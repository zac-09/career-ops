              - heading "Tech Lead, Product Engineering" [level=1] [ref=f10e11]
              - generic [ref=f10e12]: Remote
            - button "Apply" [ref=f10e16] [cursor=pointer]
          - generic [ref=f10e17]:
            - generic [ref=f10e18]:
              - paragraph [ref=f10e19]:
                - strong [ref=f10e20]: Overview
              - paragraph [ref=f10e21]: Chronograph was founded to bring next-generation technology to private capital markets. Through our suite of cloud-based analytics and data management solutions, we help many of the world's largest and most sophisticated venture capital, private equity, and credit funds understand their investment performance in unprecedented detail, with over 258,000 private companies and 15,000 private capital funds monitored via our solution suite.
              - paragraph [ref=f10e22]: At Chronograph, we get to go "behind the scenes" and work directly with investors who are driving some of the most impactful changes across high growth start-ups, global infrastructure and renewable energy, growth equity, and all other private capital strategies. The firm is backed by Sixth Street Growth, Summit Partners, Carlyle AlpInvest, and Nasdaq Inc., and has seen continuous rapid growth since its founding in 2016. Our client base today includes hundreds of investors and asset managers monitoring more than $5.9 trillion in invested capital with 8 of the 10 largest GPs and 5 of the 10 largest LPs using Chronograph.
              - paragraph [ref=f10e23]:
                - strong [ref=f10e24]: The Opportunity
              - paragraph [ref=f10e25]: As a key member of our team, you will lead and deliver projects from concept to production; driving core technical direction while working closely with key stakeholders. Our engineering teams collaborate daily with product managers and designers to build exceptional software. An ideal candidate for this role will have both sharp technical skills and a keen product sensibility.
              - paragraph [ref=f10e26]: "You’ll join a highly-driven team of engineers, contributing both as a technical leader and a hands-on full-stack developer. Our platform handles critical financial data, offering extensive workflow and data analysis tools along with an innovative data ingestion platform. This is an opportunity to make a real-world impact: you will tackle challenging technical problems and contribute to a platform relied upon by leaders in the private equity space."
              - paragraph [ref=f10e27]: This is an exceptional opportunity for a driven, detail-oriented top performer to become directly engaged with several of the world’s most sophisticated private equity investors and produce an immediate impact within a globally-focused financial technology firm.
              - paragraph [ref=f10e28]:
                - strong [ref=f10e29]: "As a Tech Lead at Chronograph, you will:"
              - list [ref=f10e30]:
                - listitem [ref=f10e31]: "Own and lead technical projects from product ideation to successful execution, including: technical decisions, architectural designs, data structures, and development approach"
                - listitem [ref=f10e32]: Collaborate with engineering, product, and design to architect high-performance and user-centric features to drive direct client impact among leaders in the private equity space
                - listitem [ref=f10e33]: Champion platform reliability and data integrity while maintaining development velocity, making thoughtful decisions that advance both technical quality and product outcomes
                - listitem [ref=f10e34]: Mentor and provide guidance to engineers across all levels, with opportunities to grow into direct people management, fostering a culture of continuous learning and developing future technical leaders
                - listitem [ref=f10e35]: Identify new technologies and best practices to promote a culture of continuous improvement
              - paragraph [ref=f10e36]:
                - strong [ref=f10e37]: "You will be successful in this role if you have:"
              - list [ref=f10e38]:
                - listitem [ref=f10e39]: At least 9 years of professional development experience, with a proven track record of leading complex technical projects
                - listitem [ref=f10e40]: Expertise in Typescript, Node, PostgreSQL and GraphQL, in particular schema and API design
                - listitem [ref=f10e41]: Fluency in frontend frameworks and patterns such as React and React Query
                - listitem [ref=f10e42]: Aptitude for navigating ambiguity and designing solutions that account for cross-system implications—spanning data models, validations, application logic and user workflows
                - listitem [ref=f10e43]: Excellent leadership and communication skills, with demonstrated ability to drive consensus across stakeholders and distill complex technical concepts for diverse audiences
                - listitem [ref=f10e44]: A track record of balancing technical solutions with business outcomes, making thoughtful tradeoffs that serve both immediate needs and long-term platform health
              - list [ref=f10e45]:
                - listitem [ref=f10e46]: "Nice-to-haves:"
                - list [ref=f10e47]:
                  - listitem [ref=f10e48]: Experience implementing and extending modern JavaScript libraries such as SpreadJS, HyperFormula, FinnFlo-js, and AG Grid
                  - listitem [ref=f10e49]: Background in building computation-heavy services where accuracy and performance are imperative
                  - listitem [ref=f10e50]: Experience expanding complex data models to fit evolving application use cases
                  - listitem [ref=f10e51]: Passionate about emerging tools that improve developer velocity, including AI-assisted coding
              - paragraph [ref=f10e52]: Even if you do not meet all criteria, we would still encourage you to apply or get in touch! Chronograph offers an entrepreneurial environment where you will be able to proactively identify opportunities to develop and strengthen our team.
              - paragraph [ref=f10e53]:
                - strong [ref=f10e54]: Why Join Chronograph?
              - paragraph [ref=f10e55]: We value creativity, open communication, and cutting edge technology – and we try to have fun along the way. We want you to be happy here for the long-term and will work with you to ensure you’re achieving your career goals.
              - paragraph [ref=f10e56]: "We offer:"
              - list [ref=f10e57]:
                - listitem [ref=f10e58]: Competitive salary
                - listitem [ref=f10e59]: Flexible work arrangements (including remote / in person / hybrid)
                - listitem [ref=f10e60]: 401(k)
                - listitem [ref=f10e61]: Unlimited and flexible vacation
                - listitem [ref=f10e62]: Generous health benefits
                - listitem [ref=f10e63]: Company-wide team events at our Brooklyn, NY headquarters three times a year for all employees
                - listitem [ref=f10e64]: Fully-paid parental leave
                - listitem [ref=f10e65]: ...and more!
              - paragraph [ref=f10e66]: Chronograph is committed to promoting a diverse and inclusive culture, and we welcome applicants from all backgrounds. If you’re a team player who wants to have an outsized impact in a dynamic and diverse environment, we’d love to hear from you!
            - generic [ref=f10e68]:
