# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)

# -- Title filter --
title_filter:
  positive:
    # -- Core backend roles --
    - 'Backend Engineer'
    - 'Backend Developer'
    - 'Software Engineer'
    - 'Software Developer'
    - 'Node.js'
    - 'TypeScript'
    - 'Full Stack'
    - 'Full-Stack'
    # -- Platform / infra --
    - 'Platform Engineer'
    - 'Infrastructure Engineer'
    - 'Cloud Engineer'
    - 'DevOps'
    - 'Site Reliability'
    - 'SRE'
    # -- API / integration --
    - 'API Engineer'
    - 'Integration Engineer'
    - 'Solutions Engineer'
    # -- Data / real-time --
    - 'Data Engineer'
    - 'Distributed Systems'
    - 'Systems Engineer'
  negative:
    - 'Junior'
    - 'Intern'
    - 'Graduate'
    - 'Entry Level'
    - 'iOS'
    - 'Android'
    - 'Mobile'
    - 'PHP'
    - 'Ruby'
    - 'Java '
    - '.NET'
    - 'C#'
    - 'Embedded'
    - 'Firmware'
    - 'FPGA'
    - 'ASIC'
    - 'Blockchain'
    - 'Web3'
    - 'Crypto'
    - 'Mainframe'
    - 'COBOL'
    - 'SAP '
    - 'Salesforce Admin'
    - 'Oracle EBS'
  seniority_boost:
    - 'Senior'
    - 'Staff'
    - 'Principal'
    - 'Lead'
    - 'Head of'

# -- Search queries --
search_queries:
  # -- Ashby --
  - name: Ashby — Senior Backend Engineer
    query: 'site:jobs.ashbyhq.com "Senior Backend Engineer" OR "Senior Software Engineer" Node.js OR TypeScript remote'
    enabled: true

  - name: Ashby — Platform & Infrastructure
    query: 'site:jobs.ashbyhq.com "Platform Engineer" OR "Infrastructure Engineer" OR "Cloud Engineer" remote senior'
    enabled: true

  - name: Ashby — Full Stack
    query: 'site:jobs.ashbyhq.com "Full Stack Engineer" OR "Full-Stack Engineer" Node.js OR TypeScript remote senior'
    enabled: true

  # -- Greenhouse --
  - name: Greenhouse — Senior Backend Engineer
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Senior Backend Engineer" Node.js OR TypeScript remote'
    enabled: true

  - name: Greenhouse — Platform & SRE
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Platform Engineer" OR "SRE" OR "Site Reliability" remote senior'
    enabled: true

  - name: Greenhouse — Full Stack
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Senior Full Stack" OR "Full-Stack Engineer" Node.js OR Firebase remote'
    enabled: true

  # -- Lever --
  - name: Lever — Senior Backend / Node.js
    query: 'site:jobs.lever.co "Senior Backend Engineer" OR "Senior Software Engineer" Node.js OR TypeScript remote'
    enabled: true

  - name: Lever — Platform & Cloud
    query: 'site:jobs.lever.co "Platform Engineer" OR "Cloud Engineer" OR "Infrastructure" GCP OR AWS remote senior'
    enabled: true
    # 2026-09-11: 1st noise strike — 6 of 7 hits were Jobgether reposts, all 410 Gone.

  # -- Wellfound (startups) --
  # 2026-07-20: disabled — Wellfound's Cloudflare bot-wall makes listings unverifiable
  # (curl/WebFetch/Playwright all blocked); user bulk-closed all prior Wellfound finds
  # on 2026-07-09 for this reason. Re-enable only if verification path is found.
  - name: Wellfound — Senior Backend
    query: 'site:wellfound.com "Senior Backend Engineer" Node.js OR TypeScript remote'
    enabled: false

  - name: Wellfound — Full Stack
    query: 'site:wellfound.com "Senior Full Stack" OR "Senior Software Engineer" Node.js OR Firebase remote'
    enabled: false

  # -- Workable --
  - name: Workable — Senior Backend
    query: '(site:apply.workable.com OR site:jobs.workable.com) ("Senior Backend Engineer" OR "Senior Software Engineer" OR "Staff Engineer") (Node.js OR TypeScript) remote'
    enabled: true
    # 2026-09-21: expanded to Workable's newer jobs.workable.com domain. Live indexed
    # Node/TS roles found there; most are country-locked, so verify geo per posting.

  # -- Broad cross-portal --
  - name: Firebase & GCP specialists
    query: '"Senior Backend Engineer" OR "Senior Software Engineer" Firebase OR Firestore OR "Cloud Functions" remote'
    enabled: false
    # 2026-08-26: 1st noise strike — only hire-a-dev marketing pages.
    # 2026-08-27: DISABLED (2nd strike) — same marketing-only pattern two runs straight.

  - name: Node.js + MongoDB backend
    query: '"Senior Backend Engineer" Node.js MongoDB remote site:job-boards.greenhouse.io OR site:jobs.ashbyhq.com OR site:jobs.lever.co'
    enabled: true
    # 2026-08-27: 1st structural strike — engine ignored site: operators, returned only
    # Indeed/aggregator index pages.
    # 2026-09-11: STRIKE CLEARED — site: operators honored, all 7 results on lever/ashby.

  - name: RemoteFront — Backend
    query: 'site:remotefront.com "Backend Engineer" OR "Software Engineer" Node.js OR TypeScript remote senior'
    enabled: true

  # -- Africa / worldwide-remote job boards (added 2026-06-08) --
  # These boards have reliable "Worldwide" / "Africa-eligible" filters — best signal for UTC+3.
  - name: Himalayas — Worldwide/Africa backend
    query: 'site:himalayas.app ("Backend Engineer" OR "Full Stack") (Node.js OR TypeScript) (worldwide OR africa OR EMEA)'
    enabled: true

  - name: RemoteOK — Worldwide/Africa backend
    query: 'site:remoteok.com (Node.js OR TypeScript) backend ("worldwide" OR "africa")'
    enabled: false
    # 2026-08-26: 1st structural strike — only tag-index pages, no individual reqs.
    # 2026-08-27: DISABLED (2nd strike) — tag-index pages only again, zero individual reqs.

  - name: WeWorkRemotely — Anywhere in the World
    query: 'site:weworkremotely.com/remote-jobs (Node.js OR TypeScript) backend "anywhere in the world"'
    enabled: true
    # 2026-09-11: 1st structural strike — 3 of 8 results off-domain (itjobswatch.co.uk,
    # builtin.com); engine partially ignored the site: operator.

  - name: RemoteAfrica — backend/fullstack
    query: 'site:remoteafrica.io ("Backend" OR "Full Stack" OR "Software Engineer") (Node.js OR TypeScript)'
    enabled: false
    # 2026-07-20: remoteafrica.io moved individual listings behind the $5/mo "Hunter"
    # subscription — job pages now render only marketing copy. Unverifiable; disabled.

  - name: Remote4Africa — backend/fullstack
    query: 'site:remote4africa.com (Node.js OR TypeScript) ("Backend" OR "Full Stack" OR "Software Engineer")'
    enabled: false
    # 2026-08-11: only hit resolved to Boolean Ltd recruiting agency, no canonical ATS (1st noise strike).
    # 2026-08-26: 2nd noise strike — all reqs anonymized "HR Services company", country-locked
    # (Nigeria/Kenya), application behind paid signup wall. One more strike disables it.
    # 2026-08-27: DISABLED (3rd strike) — same anonymized signup-walled agency reqs +
    # engine substitution (itjobswatch); zero resolvable canonical postings three runs straight.

  # -- Worldwide-remote job boards (added 2026-07-20, verified live via site: search) --
  # All are aggregators — they re-post from ATS boards. Resolve to the ORIGINAL
  # ATS/careers URL before evaluating so dedup against scan-history.tsv works.
  # Queries include "worldwide"/"anywhere" to pre-filter for Uganda (UTC+3) eligibility.
  - name: Remotive — Worldwide backend
    query: 'site:remotive.com (Node.js OR TypeScript) ("Backend" OR "Full Stack") worldwide'
    enabled: true

  - name: Working Nomads — Worldwide backend
    query: 'site:workingnomads.com/jobs (Node.js OR TypeScript) ("Backend" OR "Full Stack") ("worldwide" OR "anywhere")'
    enabled: true

  - name: NoDesk — Worldwide backend
    query: 'site:nodesk.co/remote-jobs (Node.js OR TypeScript) ("Backend Engineer" OR "Backend Developer" OR "Full Stack") ("worldwide" OR "anywhere")'
    enabled: true
    # 2026-09-11: 1st stale strike — 3 of 5 listings explicitly expired/unavailable,
    # 2 of 8 results off-domain.

  - name: Jobgether — Worldwide backend
    query: 'site:jobgether.com/offer (Node.js OR TypeScript) backend "worldwide"'
    enabled: true
    # 2026-09-11: 1st strike — on-domain, but EVERY offer resolved to HTTP 410 Gone.
    # Jobgether also hides company names, making canonical resolution impossible.
    # Zero verifiable yield; one more strike disables it.

  - name: Remote Rocketship — Worldwide backend
    query: 'site:remoterocketship.com (Node.js OR TypeScript) backend "worldwide"'
    enabled: true

  - name: DailyRemote — Worldwide backend
    query: 'site:dailyremote.com/remote-job (Node.js OR TypeScript) backend "worldwide"'
    enabled: false
    # 2026-09-11: DISABLED (2nd noise strike) — only 1 of 8 hits was an actual job page;
    # the rest were country landing pages plus off-domain substitutions (habr, builtin).
    # 2026-08-19: worldwide req = hidden-company Web3. 2026-08-27: 1st noise strike —
    # sole individual hit again hidden-company Web3/NFT; rest country-index pages.

  - name: EchoJobs — EMEA/Worldwide backend
    query: 'site:echojobs.io (Node.js OR TypeScript) "Senior Backend" ("worldwide" OR "EMEA" OR "anywhere")'
    enabled: true

  - name: JustRemote — Worldwide backend
    query: 'site:justremote.co/remote-developer-jobs (Node.js OR TypeScript) ("Backend" OR "Full Stack") ("worldwide" OR "anywhere")'
    enabled: false
    # 2026-08-19: DISABLED — site: form returns ZERO justremote.co results (engine
    # substituted itjobswatch/builtin) — structural, same pattern as Jobicy/Truly Remote.

  - name: YC Work at a Startup — remote backend
    query: 'site:workatastartup.com/jobs (Node.js OR TypeScript) backend remote ("worldwide" OR "anywhere")'
    enabled: true
    # WARNING: many YC roles are "Remote (Americas)" — verify timezone band per role.
    # 2026-08-19: 1st structural strike — site: form returned zero workatastartup.com
    # results (engine substituted other boards). One more strike disables it.
    # 2026-08-26: RECOVERED — real workatastartup.com results returned; strike counter
    # RESET. Caveat: index is stale (Better Auth worldwide Staff Eng + Rove both 404).
    # 2026-09-11: 1st structural strike (post-reset) — engine ignored site: again, 6/10
    # results off-domain and the on-domain hits were internships. Disable on repeat.

  - name: Arc.dev — remote backend
    query: 'site:arc.dev/remote-jobs (Node.js OR TypeScript) senior backend'
    enabled: false
    # Individual job URLs poorly indexed — search only surfaces listing pages.
    # Browse https://arc.dev/remote-jobs/nodejs manually instead. Partners with WWR.

  # -- ATS-level coverage gaps (added 2026-08-13) --
  # Canonical-by-construction: results ARE the ATS posting, no aggregator-label risk.
  # Evidence: Dwelly (EU Greenhouse) scored 4.0/4.1; Bitfinex (Recruitee) 4.2;
  # Yellow Card (BambooHR) is the live #188 application; Latitude.sh is Rippling.
  - name: Greenhouse EU — Senior Backend
    query: 'site:job-boards.eu.greenhouse.io "Senior Backend Engineer" OR "Senior Software Engineer" Node.js OR TypeScript remote'
    enabled: false
    # 2026-09-11: DISABLED — structurally incapable of yielding a globally-remote req.
    # 10/10 hits geo-rejected by construction (the .eu. board is EU-scoped by definition).
    # The two companies that ever justified it (Dwelly, Sporty Group) are now covered
    # directly via tracked_companies `api:` against boards.eu.greenhouse.io.
    # 2026-08-13 first run: 6 hits, ALL closed reqs (CarOnSale/Lionhires/SevenPro/
    # GR8_TECH Node reqs gone from live boards) or country-locked (Appinio DE/UK/PT/NL/ES).
    # Keep — canonical format + Dwelly precedent; index staleness is the enemy.

  - name: Lever EU — Senior Backend
    query: 'site:jobs.eu.lever.co "Senior Backend Engineer" OR "Senior Software Engineer" Node.js OR TypeScript remote'
    enabled: false
    # 2026-08-13 first run: weak — Finom + Quadcode reqs 404 (stale index), rest
    # Berlin-anchored or frontend. One more strike disables it.
    # 2026-08-19: DISABLED (2nd strike) — Finom .NET, Xentral PHP, flaconi Berlin,
    # grape Swiss, Quadcode mid-level; zero worldwide seats two runs straight.

  - name: Recruitee — worldwide backend
    query: 'site:recruitee.com (Node.js OR TypeScript) ("Backend" OR "Software Engineer") remote ("worldwide" OR "anywhere" OR senior)'
    enabled: true
    # Boards are {company}.recruitee.com — site: covers subdomains. Some companies
    # (e.g. Bitfinex careers.bitfinex.com) use custom domains and won't appear here.
    # 2026-08-13 first run: 1 add (Make freelance, work-from-anywhere) but 4 of 8
    # boards had LEFT Recruitee (301 to careers_not_hosted: Zerofy, Tomorrows Education,
    # Tiugo 404, Smartsupp 404). Keep — live boards resolve cleanly when they exist.

  - name: BambooHR — remote backend
    query: 'site:bamboohr.com "careers" (Node.js OR TypeScript) ("Backend" OR "Software Engineer" OR "Full Stack") remote'
    enabled: false
    # Boards are {company}.bamboohr.com/careers/{id}. The /careers/list JSON API
    # works per-company (see Yellow Card notes).
    # 2026-08-13: DISABLED — first run returned only bamboohr.com corporate pages;
    # Google does not index {company}.bamboohr.com job pages under this site: form.
    # BambooHR coverage stays via tracked companies (Yellow Card, Flutterwave).

  - name: Rippling ATS — remote backend
    query: 'site:ats.rippling.com (Node.js OR TypeScript) ("Backend" OR "Software Engineer") remote'
    enabled: true
    # 2026-08-13 first run: BEST ATS query of the batch — produced Utility add
    # (100% remote Node/TS) + exposed Wander backend-req closure. Keep.

  - name: Teamtailor — remote backend
    query: 'site:teamtailor.com (Node.js OR TypeScript) ("Backend" OR "Full Stack") remote'
    enabled: false
    # Many Teamtailor boards use custom domains (e.g. career.proxify.io) — this only
    # catches the {company}.teamtailor.com ones.
    # 2026-08-13 first run: all hits EU-hybrid (Twin Harbour Malta/Hamburg), Spain
    # agencies, or LATAM nearshore — zero worldwide. One more strike disables it.
    # 2026-08-19: DISABLED (2nd strike) — knowmad Spain, Valce/Upstart13 LATAM,
    # Twin Harbour repeat, Leadtech Barcelona, Virtasant US-locked; zero worldwide again.

  - name: SmartRecruiters — remote backend
    query: 'site:jobs.smartrecruiters.com (Node.js OR TypeScript) "Senior" ("Backend" OR "Software Engineer") remote'
    enabled: false
    # 2026-08-13 first run: all hits country-anchored (Berlin/Brazil/India/Vietnam/US);
    # YouGov "REMOTE" req unverifiable (posting page + API both 4xx). One more strike disables it.
    # 2026-08-19: DISABLED (2nd strike) — Bertelsmann/Omio Berlin, SMG Vietnam,
    # M3USA Brazil, YouGov Barcelona, Cacheflow US; zero worldwide two runs straight.

  # -- ATS discovery expansion (added 2026-09-21) --
  # These are direct ATS/job-board pages, not generic mirrors. They still require the
  # normal live-posting and geo checks before evaluation.
  - name: Personio — remote Node/TS backend
    query: '(site:jobs.personio.com OR site:jobs.personio.de) (Node.js OR TypeScript) ("Backend Engineer" OR "Software Engineer" OR "Platform Engineer") (remote OR worldwide OR global)'
    enabled: true
    # Search + static fetch confirmed readable, structured postings. Test results
    # included a globally-remote Node/NestJS role with EU-timezone preference.

  - name: Breezy HR — remote Node/TS backend
    query: 'site:breezy.hr (Node.js OR TypeScript) ("Backend Engineer" OR "Backend Developer" OR "Software Engineer") remote'
    enabled: true
    # Direct Breezy pages are fetchable; a live globally-distributed senior Node.js
    # role was present during validation. Search indexes closed reqs too — verify live.

  - name: JazzHR ApplyToJob — remote Node/TS backend
    query: 'site:applytojob.com (Node.js OR TypeScript) ("Backend Engineer" OR "Software Engineer" OR "Platform Engineer") remote'
    enabled: true
    # Direct JazzHR pages are readable and expose full JDs. Geo wording can be vague
    # ("remote" with a region preference), so do not infer worldwide eligibility.

  - name: Gem — remote Node/TS backend
    query: 'site:jobs.gem.com (Node.js OR TypeScript) ("Backend Engineer" OR "Software Engineer" OR "Platform Engineer") remote'
    enabled: true
    # Search indexing is strong, but direct pages are JS-heavy. Use Playwright for
    # verification and expect substantial US/Canada noise.

  - name: JOIN — remote Node/TS backend
    query: 'site:join.com/companies (Node.js OR TypeScript) ("Backend Engineer" OR "Software Engineer" OR "Full Stack Engineer") remote'
    enabled: true
    # Structured canonical postings with direct-apply metadata. Initial test skewed
    # Europe/Germany, so enforce the per-role geo check before adding to pipeline.

  # -- Aggregators with worldwide filters (added 2026-08-13) --
  # Same reliability tier as Himalayas/NoDesk: ALWAYS resolve to canonical ATS
  # posting before evaluating (standing rule — aggregator geo labels lie).
  - name: Simplify — worldwide/EMEA backend
    query: 'site:simplify.jobs/p (Node.js OR TypeScript) ("Backend Engineer" OR "Software Engineer" OR "Platform Engineer") (worldwide OR Africa OR EMEA OR Europe) remote'
    enabled: true
    # 2026-09-21 validation returned multiple current-looking Node/TS roles and full,
    # readable JDs. ALWAYS resolve the employer's canonical posting; geo labels vary.

  - name: Hirify — worldwide Node/TS backend
    query: 'site:hirify.me/jobs (Node.js OR TypeScript) ("Backend" OR "Platform" OR "Fullstack") ("remote (Global)" OR "Worldwide Remote")'
    enabled: true
    # Global filter produced readable worldwide listings. Aggregated descriptions may
    # outlive the canonical req; resolve the employer URL before evaluating.

  - name: EverJobs Uganda — backend/fullstack
    query: 'site:everjobs.ug/job (Node.js OR TypeScript) ("Backend" OR "Full Stack" OR "Software Engineer" OR "Platform Engineer")'
    enabled: true
    # Uganda-local eligibility is high and pages are statically readable. This is a
    # mirror: reject old/recycled listings and resolve the original employer posting.

  - name: Jobicy — worldwide backend
    query: 'site:jobicy.com (Node.js OR TypeScript) backend ("worldwide" OR "anywhere")'
    enabled: false
    # 2026-08-13: DISABLED — first run returned ZERO jobicy.com results (site: form
    # not indexed; engine substituted other boards). Structural, not a fluke.

  - name: 4dayweek.io — remote backend
    query: 'site:4dayweek.io (Node.js OR TypeScript) ("Backend" OR "Software Engineer") ("worldwide" OR "anywhere" OR remote)'
    enabled: false
    # 2026-08-13: DISABLED — first run surfaced only stale listings (Feb 2022,
    # Oct 2025 Buffer EM) + career-advice articles; no live reqs indexed.

  - name: Dynamite Jobs — worldwide backend
    query: 'site:dynamitejobs.com (Node.js OR TypeScript) backend ("worldwide" OR "anywhere")'
    enabled: false
    # 2026-08-13 first run: real listings but high staleness (Netguru freelance req
    # already closed, Paperpile from 2023). Marginal — one more strike disables it.
    # 2026-08-19: kept (1 fresh Aug-2026 listing, geo-failed).
    # 2026-08-26: DISABLED (2nd strike) — stale-only again: Paperpile 2023, Netguru
    # closed, Nabu Casa Jan-2026 (canonical board no longer has the req), Makeway repeat.

  - name: Jobspresso — remote backend
    query: 'site:jobspresso.co (Node.js OR TypeScript) ("Backend" OR "Full Stack") remote'
    enabled: false
    # 2026-08-13: DISABLED — all indexed listings dated 2017-2025; board effectively
    # dormant for fresh Node/TS reqs.

  - name: Remote.co — remote backend
    query: 'site:remote.co (Node.js OR TypeScript) ("Backend" OR "Software Engineer") ("worldwide" OR "anywhere")'
    enabled: false
    # 2026-08-13 first run: 1 real "International, Anywhere" hit (CitizenShipper) but
    # canonical Breezy board was already empty — stale mirror. Marginal; keep one more cycle.
    # 2026-08-19: DISABLED (2nd strike) — only hit was the SAME stale CitizenShipper
    # mirror; engine substituted other domains for the rest.

  - name: Truly Remote — worldwide backend
    query: 'site:trulyremote.co (Node.js OR TypeScript) backend ("worldwide" OR "anywhere")'
    enabled: false
    # 2026-08-13: DISABLED — first run returned ZERO trulyremote.co results (domain
    # not indexed under site: form). Structural.

  # -- High-signal non-standard sources (added 2026-08-13) --
  - name: HN Who is Hiring — remote Node/TS
    query: 'site:news.ycombinator.com "who is hiring" (Node.js OR TypeScript) (remote OR worldwide)'
    enabled: true
    # Results are monthly THREADS, not individual postings — the scanner must open
    # the latest thread and search within it (Ctrl-F style) for Node/TypeScript +
    # REMOTE entries, then resolve each company's own careers URL. Disproportionately
    # senior + globally-remote; best untapped source for this profile.
    # 2026-08-13 first run (Aug 2026 thread, id=49156683): CONFIRMED best new source —
    # 233 top-level posts, 34 Node/TS+remote, 4 pipeline adds (MixRank global, Cogram
    # CET±3, Ojin CET±2h, Flywheel worldwide-contract). Thread was single-page (no More link).
    # 2026-09-11 (Sept thread id=49522897, posted 09-10): HIGHEST-YIELD QUERY OF THE RUN and
    # now the single best source for this profile. 256 posts, 82 remote+fullstack, 39 naming
    # Node/TS, 10 worldwide. Produced RAILWAY (4 adds, best geo signal in the tracked set) +
    # Interview Resources, plus 3 geo-good/stack-fail watch items (Enveritas $135-155K global,
    # CyberAtlas, Mastra). Also caught a geo lie: AiMi posted "Remote(Everywhere)" on HN while
    # its canonical join.com posting says "Remote (India), $600-1250/month".

  - name: Welcome to the Jungle (ex-Otta) — remote backend
    query: 'site:welcometothejungle.com (Node.js OR TypeScript) "Backend" remote worldwide'
    enabled: false
    # Weak Google indexing of individual postings; better browsed manually with
    # their remote filter. Re-enable if indexing improves.

# -- Tracked companies --
# Remote-first or remote-friendly companies with strong Node.js/TypeScript stacks.
# Prioritizes companies you've already targeted + strong cultural/stack fits.

tracked_companies:
  # -- Companies you've already applied to --

  - name: Buffer
    careers_url: https://buffer.com/journey#open-roles
    scan_method: websearch
    scan_query: 'site:buffer.com/journey "engineer" OR "backend" OR "software"'
    notes: 'Fully remote. Async-first culture. Strong Node.js history. 2026-07-31: 2 eng reqs live (Senior Infrastructure Engineer — added to pipeline; Senior Growth Engineer — off-filter). Direct URLs: buffer.com/journey/{uuid}.'
    enabled: true

  - name: Attio
    careers_url: https://jobs.ashbyhq.com/attio
    scan_method: websearch
    scan_query: 'site:jobs.ashbyhq.com/attio'
    notes: 'Remote EU. AI-native CRM. Series B $52M. TypeScript-heavy.'
    enabled: true

  - name: Trigger.dev
    careers_url: https://jobs.ashbyhq.com/triggerdev
    api: https://api.ashbyhq.com/posting-api/job-board/triggerdev
    scan_method: websearch
    scan_query: 'site:trigger.dev/jobs OR "trigger.dev" careers "engineer"'
    notes: 'Remote. Open-source background job platform. TypeScript/Node.js core. 2026-07-24: Ashby slug is "triggerdev" (API verified); only 1 non-eng role live (Technical Content Engineer, UK).'
    enabled: true

  - name: Zencastr
    careers_url: https://jobs.ashbyhq.com/zencastr
    api: https://api.ashbyhq.com/posting-api/job-board/zencastr
    scan_method: websearch
    scan_query: '"zencastr" careers OR jobs "engineer" OR "backend"'
    notes: '2026-09-03: zencastr.com/careers 404 — careers_url switched to Ashby board (API works, 4 reqs). Remote. Podcast/media platform. Node.js stack. 2026-07-20: new Senior Fullstack Engineer req live on Ashby (added to pipeline); Senior Backend #103 still open. 2026-08-13: Fullstack req (#161) gone from board; Backend #103 still live.'
    enabled: true

  - name: Secureframe
    careers_url: https://jobs.lever.co/secureframe
    scan_method: websearch
    scan_query: 'site:jobs.lever.co/secureframe "engineer" OR "backend" OR "software"'
    notes: 'Remote. Compliance automation SaaS. Migrated from Greenhouse to Lever (2026-04 verified). 2026-07-31: Lever board is 15 sales/GTM roles, all US onsite — zero engineering reqs.'
    enabled: true

  - name: WunderGraph
    careers_url: https://jobs.ashbyhq.com/wundergraph
    scan_method: websearch
    scan_query: 'site:jobs.ashbyhq.com/wundergraph OR "wundergraph" careers "engineer"'
    notes: 'Remote. API federation / GraphQL platform. TypeScript core.'
    enabled: true

  - name: ElevenLabs
    careers_url: https://jobs.ashbyhq.com/elevenlabs
    scan_method: websearch
    scan_query: 'site:jobs.ashbyhq.com/elevenlabs "backend" OR "engineer" OR "software"'
    notes: 'Voice AI. Strong backend infra needs. Remote-friendly.'
    enabled: true

  # -- Developer tooling & infra (strong stack fit) --

  - name: Temporal
    careers_url: https://jobs.ashbyhq.com/temporal
