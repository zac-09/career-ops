        - generic [ref=f16e117]:
          - generic [ref=f16e118]:
            - heading "United by our values" [level=2] [ref=f16e119]
            - paragraph [ref=f16e120]: "We’re building a company that’s focused not just on the bottom line, but also on the happiness of our customers and team. Here are the values that guide our decisions and actions:"
          - generic [ref=f16e121]:
            - generic [ref=f16e122]:
              - generic [ref=f16e123]: 📖
              - heading "Default to transparency" [level=3] [ref=f16e125]
              - paragraph [ref=f16e126]: Our true North Star. Transparency is the value we’re best known for, and yet, still very aspirational. We aspire to always default to transparency as a company and as individuals in our decisions and actions.
              - group [ref=f16e127]
            - generic [ref=f16e132]:
              - generic [ref=f16e133]: ⬆️
              - heading "Improve consistently" [level=3] [ref=f16e135]
              - paragraph [ref=f16e136]: Improving consistently is about striving to be better, not in competition with anyone but our yesterday selves. We are committed to working every day toward personal and professional growth.
              - group [ref=f16e137]
            - generic [ref=f16e142]:
              - generic [ref=f16e143]: ⛵
              - heading "Be a no-ego doer" [level=3] [ref=f16e145]
              - paragraph [ref=f16e146]: We don’t attach our personal selves to ideas. We remove ourselves—our fears, our pride—from our work to lead to a better, more productive experience for us and everyone around us. We’re all rowing this boat together.
              - group [ref=f16e147]
            - generic [ref=f16e152]:
              - generic [ref=f16e153]: 💛
              - heading "Show gratitude" [level=3] [ref=f16e155]
              - paragraph [ref=f16e156]: This value is deeply ingrained in our culture. We regularly show gratitude for each other, for the technology to make this company and life possible, and for the many blessings that Buffer brings to our lives.
              - group [ref=f16e157]
            - generic [ref=f16e162]:
              - generic [ref=f16e163]: 🥛
              - heading "Choose optimism" [level=3] [ref=f16e165]
              - paragraph [ref=f16e166]: Choosing optimism is foundational to Buffer’s kind and joyful culture. Optimism helps us look to the future with positivity, while embracing hard conversations and decisions in service of Buffer’s health and future.
              - group [ref=f16e167]
            - generic [ref=f16e172]:
              - generic [ref=f16e173]: 🪞
              - heading "Reflect to unblock" [level=3] [ref=f16e175]
              - paragraph [ref=f16e176]: We carve out time for reflection in order to unblock ourselves. We believe personal growth stems from vulnerability and introspection as we focus on ongoing self-improvement.
              - group [ref=f16e177]
      - region [ref=f16e182]:
        - generic [ref=f16e184]:
          - heading "What is the Buffer team like?" [level=2] [ref=f16e185]
          - paragraph [ref=f16e186]: Buffer is an equal opportunity employer that has the awesome opportunity to add teammates from anywhere in the world! We’re united by Buffer’s values, and we celebrate our unique differences.
          - paragraph [ref=f16e187]: What kind of people work at Buffer? All kinds! We hire talented teammates from a wide variety of backgrounds and experiences, and we’re committed to a work environment of respect and kindness.
