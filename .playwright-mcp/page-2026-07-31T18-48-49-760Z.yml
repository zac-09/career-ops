              - heading "What is Buffer?" [level=2] [ref=f16e71]
              - paragraph [ref=f16e72]: We’re a small team on a mission to help innovative companies grow their businesses – and along the way, we’re championing a more human way to work.
              - paragraph [ref=f16e73]: Buffer was started in 2010 as a simple way to schedule posts on Twitter. Today it’s a growing suite of tools now serving more than 75,000 customers.
