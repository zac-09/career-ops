  - generic [ref=f4e41]:
    - generic [ref=f4e42]:
      - heading "Careers at Paystack" [level=1] [ref=f4e43]
      - paragraph [ref=f4e44]: Join Paystack and help power growth for a new generation of businesses across Africa.
    - link "See Job Openings" [ref=f4e46] [cursor=pointer]:
      - /url: "#js-job-posts"
  - generic [ref=f4e51]:
    - heading "We’re building a growth engine for modern businesses in Africa" [level=2] [ref=f4e52]
    - paragraph [ref=f4e53]: Paystack’s mission is to accelerate digital commerce across Africa. We do this in partnership with our customers, who represent some of the most forward-thinking organizations on the continent. To do this, we’re rewriting much of the fundamental infrastructure that underpins how trade happens.While we’ve had significant early success, it’s still very much day 1 at Paystack. We have a thrilling amount of opportunity ahead of us to quite literally transform how commerce happens across the continent. And we need your help.
  - generic [ref=f4e56]:
    - generic [ref=f4e58]:
      - heading "Recurring themes in the work we do" [level=2] [ref=f4e59]
      - paragraph [ref=f4e60]: Paystack is a mission-driven company, which means that we find ourselves returning to a similar set of questions in everything we do. If you already find yourself thinking about a few of the following questions, chances are high that you’ll love your work at Paystack.
    - generic [ref=f4e61]:
      - figure [ref=f4e64]:
        - generic [ref=f4e65]:
          - img "High Transaction Success Rates Compressor" [ref=f4e66]
          - generic [ref=f4e67]: Lagos fine jeweler Doubara Eporwei gets paid with Paystack
      - generic [ref=f4e70]:
        - heading "How do we make it absurdly easy to start - and scale - a business in Africa?" [level=3] [ref=f4e71]
        - paragraph [ref=f4e72]: This is something we’re focused on almost to the point of obsession. It’s the foundational question that informs everything from product to marketing strategy. How do we make it so that if someone has an idea, they can bring it to market as quickly as possible? And once a product or service has traction, how do we help apply more rocket fuel? How can we help our family of merchants become profitable, envied, and loved? How can we help them win?
    - generic [ref=f4e73]:
      - figure [ref=f4e76]:
        - img "Yc Meetup 2017" [ref=f4e78]
      - generic [ref=f4e81]:
        - heading "How do we dramatically increase the volume of intra-Africa trade?" [level=3] [ref=f4e82]
        - paragraph [ref=f4e83]: Paystack is expanding into numerous African countries, not for the thrill of planting our flag, but because of what this will mean for cross-border trade. Today, it’s easier for a Nigerian customer to purchase clothes from Europe than it is for them to do business with a merchant in nearby Togo. Why is this? And how can we fix it? How can we help a merchant in Ghana find their customers in Cote d’Ivoire? How can we help a merchant in Kenya find their customers in South Africa?
    - generic [ref=f4e84]:
      - figure [ref=f4e87]:
        - img "Get Notified When You Make A Sale" [ref=f4e89]
      - generic [ref=f4e92]:
        - heading "What new business models can technology make possible in Africa?" [level=3] [ref=f4e93]
        - paragraph [ref=f4e94]: When Paystack helped make automated recurring billing mainstream in Nigeria, it made possible completely new business models, such as digital subscriptions for media companies. Which other industries can we help create on the back of new technology? Which new frontiers would merchants in Africa pursue, if they had better tools?
    - generic [ref=f4e95]:
      - figure [ref=f4e98]:
        - generic [ref=f4e99]:
          - img "Easy To Grow 2" [ref=f4e100]
          - generic [ref=f4e101]: Paystack powers ticket sales for Afropolatan Vibes, one of Lagos' largest live music events
      - generic [ref=f4e104]:
        - heading "How can we integrate Africa into the global economy?" [level=3] [ref=f4e105]
        - paragraph [ref=f4e106]: Lots of value flows through the global economy every day, but most Africans are cut off from this wealth-creation engine. How can we help African merchants find their customers internationally? In fact, how can we help African businesses go toe-to-toe with the best companies in the world, and win?At the same time, teams all over the world are building amazing productivity and life-enhancing tools and services, but African customers can’t take advantage of those tools because much of our financial infrastructure is cut off from the global economy. How can Paystack serve as a bridge between Africa and the rest of the world?
    - generic [ref=f4e107]:
      - figure [ref=f4e110]:
        - img "Femi Cover Photo Paystack Eng 015" [ref=f4e112]
      - generic [ref=f4e115]:
        - heading "What’re the best ways to source and groom exceptional talent?" [level=3] [ref=f4e116]
        - paragraph [ref=f4e117]: One of the biggest limiting factors to the growth of our business, as well as our merchants' business, is talent. But there're hidden gems all over the continent. How do we reliably discover them?And then once they join the team, how do we intentionally empower and invest in them to do the best work of their lives?
