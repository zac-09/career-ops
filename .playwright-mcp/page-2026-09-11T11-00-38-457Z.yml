  - generic [ref=f25e11]:
    - heading "Senior Full Stack Engineer" [level=1] [ref=f25e13]
    - generic [ref=f25e14]:
      - generic [ref=f25e15]:
        - generic [ref=f25e16]:
          - heading "Location" [level=2] [ref=f25e17]
          - paragraph [ref=f25e18]: Serbia; Croatia; France; Poland; Portugal; Spain
        - generic [ref=f25e19]:
          - heading "Employment Type" [level=2] [ref=f25e20]
          - paragraph [ref=f25e21]: Full time
        - generic [ref=f25e22]:
          - heading "Location Type" [level=2] [ref=f25e23]
          - paragraph [ref=f25e24]: Remote
        - generic [ref=f25e25]:
          - heading "Department" [level=2] [ref=f25e26]
          - paragraph [ref=f25e27]: Engineering
      - generic [ref=f25e28]:
        - tablist [ref=f25e29]:
          - tab "Overview" [selected] [ref=f25e30] [cursor=pointer]
          - tab "Application" [ref=f25e31] [cursor=pointer]
        - tabpanel "Overview" [ref=f25e33]:
          - generic [ref=f25e34]:
            - paragraph [ref=f25e35]: We are looking for a Senior Full Stack Engineer to join one of our Product Tribes, the cross-functional units that own the end-to-end experience for a specific Toggl user role. You'll join the Tribe building for managers, the people who plan work, protect margins, and keep projects on time and on budget.
            - paragraph [ref=f25e36]: You own significant parts of that experience end-to-end, working hands-on with product and design to ship work that matters. You'll do this as we build and launch Toggl 2.0, our consolidated planning, time tracking, and time intelligence product.
            - paragraph [ref=f25e37]:
              - text: The salary for this position is
              - strong [ref=f25e38]: €83,000 annually.
            - paragraph [ref=f25e39]:
              - text: You can work from anywhere in the world
              - strong [ref=f25e40]: as long as your main location is between UTC-4 and UTC+4.
            - paragraph [ref=f25e41]
            - heading [level=2] [ref=f25e42]:
              - strong [ref=f25e43]: The Role
            - paragraph [ref=f25e44]: "As a Senior Full Stack Engineer, you own meaningful parts of the product end-to-end, from the data model and the API to the interface someone actually clicks: the technical approach, the quality of what ships, and whether it actually works for the people using it. You are accountable not for tickets closed, but for clarity, craft, and outcomes."
            - paragraph [ref=f25e45]: "You'll work in the Tribe serving managers, across planning and capacity management, dashboards, and billable work. This is some of the most data-dense, interaction-heavy surface area in the product: schedules and capacity views, reports, and visualizations that have to stay fast and readable at real customer scale. The interesting problems live on both sides of the API here - the query behind a capacity view matters as much as how that view renders. You'll build with React and TypeScript on the frontend and our backend services (mostly Golang) and data layer (Postgres) behind them, alongside a product manager, a designer, and engineers who are used to owning their work and pushing back when something isn't right. In a tribe of 5 other engineers, your impact and visibility are high."
            - paragraph [ref=f25e46]: Our team meetings are scheduled between 11:00 and 16:00 UTC. Your availability and commitment to participate in these sessions are essential for effective collaboration and team alignment.
            - paragraph [ref=f25e47]: "Your main responsibilities will be:"
            - paragraph [ref=f25e48]:
              - strong [ref=f25e49]: Ownership and delivery
            - list [ref=f25e50]:
              - listitem [ref=f25e51]:
                - paragraph [ref=f25e52]: Take projects from problem to production. Own the technical approach for major features front to back, break the work down sensibly, sequence it, and ship in slices rather than one big drop.
              - listitem [ref=f25e53]:
                - paragraph [ref=f25e54]: Make the technical calls in your area. Choose between options, name the tradeoffs, and decide without waiting for permission or escalating routine judgment.
              - listitem [ref=f25e55]:
                - paragraph [ref=f25e56]: Keep your work visible without being chased. Flag risks and slips early, keep the Tribe in the loop, and unblock yourself.
            - paragraph [ref=f25e57]:
              - strong [ref=f25e58]: Craft and quality across the stack
            - list [ref=f25e59]:
              - listitem [ref=f25e60]:
                - paragraph [ref=f25e61]: Build interfaces people trust with dense, real-world data. Planning views, dashboards, and reports that stay fast, accessible, and readable when the dataset gets ugly.
              - listitem [ref=f25e62]:
                - paragraph [ref=f25e63]: Design the data and API layer those views depend on. Model it so the feature you're building now doesn't make the next three harder.
              - listitem [ref=f25e64]:
                - paragraph [ref=f25e65]: Own performance as a feature, end to end. Profile, measure, and fix the slow query and the slow render instead of hoping the data stays small.
              - listitem [ref=f25e66]:
                - paragraph [ref=f25e67]: Write code others can work in. Sensible components and services, real test coverage where it earns its keep, and a codebase that's easier to change after you touch it.
            - paragraph [ref=f25e68]:
              - strong [ref=f25e69]: Working with product and design
            - list [ref=f25e70]:
              - listitem [ref=f25e71]:
                - paragraph [ref=f25e72]: Shape solutions, don't just implement them. Push on the problem, question requirements that don't hold up, and propose simpler paths when you see one.
              - listitem [ref=f25e73]:
                - paragraph [ref=f25e74]: Partner closely with design. Prototype early, spot the edge cases in a flow before it's built, and hold the bar on UX quality with your designer rather than after handoff.
              - listitem [ref=f25e75]:
                - paragraph [ref=f25e76]: Stay close to users and evidence. Join user tests, read the feedback, look at the data, and let it change what you build.
            - paragraph [ref=f25e77]:
              - strong [ref=f25e78]: Raising the bar
            - list [ref=f25e79]:
              - listitem [ref=f25e80]:
                - paragraph [ref=f25e81]: Review code with intent. Give precise, actionable feedback that makes the change and the person better.
              - listitem [ref=f25e82]:
                - paragraph [ref=f25e83]: Mentor and interview. Help other engineers grow, and help us hire well.
              - listitem [ref=f25e84]:
                - paragraph [ref=f25e85]: Improve things across team boundaries. Spot shared components and duplicated work between Tribes, and raise it before we build the same thing twice.
            - paragraph [ref=f25e86]:
              - strong [ref=f25e87]: AI as core leverage
            - list [ref=f25e88]:
              - listitem [ref=f25e89]:
                - paragraph [ref=f25e90]: Use AI tools extensively in your daily work for exploration, prototyping, code generation and review, debugging, research, and writing. AI fluency is not optional. It's part of how you increase your speed, depth, and impact - and you're expected to help the rest of the Tribe get better at it too.
            - paragraph [ref=f25e91]
            - heading [level=2] [ref=f25e92]:
              - strong [ref=f25e93]: About You
            - paragraph [ref=f25e94]: "You will thrive in this role if you:"
            - list [ref=f25e95]:
              - listitem [ref=f25e96]:
                - paragraph [ref=f25e97]: Have significant experience building and shipping production web applications end to end, and can lead major projects rather than just contribute to them.
              - listitem [ref=f25e98]:
                - paragraph [ref=f25e99]: Are genuinely comfortable on both sides of the stack. You're deep on one side and properly capable on the other, not someone who hands off at the API boundary.
              - listitem [ref=f25e100]:
                - paragraph [ref=f25e101]:
                  - text: Have deep, practical knowledge of
                  - strong [ref=f25e102]: JavaScript, TypeScript, React, and modern CSS
                  - text: "- including state management and side-effect handling in large applications."
              - listitem [ref=f25e103]:
                - paragraph [ref=f25e104]:
                  - text: "Are solid on backend fundamentals: at least one backend language you know well, API design, relational data modelling, and enough instinct for query performance to spot the problem before production does."
                  - strong [ref=f25e105]: Prior Golang experience is not mandatory but you have to be willing to adopt it and become comfortable with it fast.
              - listitem [ref=f25e106]:
                - paragraph [ref=f25e107]: Hold an extremely high bar for quality. You know what great looks like, you notice the details others miss, and you don't ship work you wouldn't put your name on.
              - listitem [ref=f25e108]:
                - paragraph [ref=f25e109]: Have a knack for data-heavy product surfaces - performance, readability, and the principles behind a chart that actually communicates something.
              - listitem [ref=f25e110]:
                - paragraph [ref=f25e111]: Care about the user's problem, not just the ticket. You start from what someone is trying to get done and work back to the implementation.
              - listitem [ref=f25e112]:
                - paragraph [ref=f25e113]: Own outcomes, not output. You follow your work into production, watch how it behaves, and fix what needs fixing.
              - listitem [ref=f25e114]:
                - paragraph [ref=f25e115]: Thrive in ambiguity and move fast. You make confident decisions with incomplete information, adapt when things change, and course-correct without drama.
              - listitem [ref=f25e116]:
                - paragraph [ref=f25e117]: Are hands-on with AI tools. You actively use AI as a core part of how you build, not a side experiment, and you have opinions about where it helps and where it doesn't.
              - listitem [ref=f25e118]:
                - paragraph [ref=f25e119]: Don't need to be managed. You set your own direction, keep people in the loop, and ask for help when it matters.
              - listitem [ref=f25e120]:
                - paragraph [ref=f25e121]: Have excellent written and verbal English communication skills. You write clearly, explain technical tradeoffs to non-engineers without jargon, and default to async communication that others can follow.
              - listitem [ref=f25e122]:
                - paragraph [ref=f25e123]: Are eager to contribute to the engineering team's growth - code review, mentoring, and interviewing included.
              - listitem [ref=f25e124]:
                - paragraph [ref=f25e125]: Value transparency, ownership, and speed over perfection. You ship, learn, and improve rather than waiting for the perfect plan.
              - listitem [ref=f25e126]:
                - paragraph [ref=f25e127]:
                  - strong [ref=f25e128]: "Nice to have:"
                - list [ref=f25e129]:
                  - listitem [ref=f25e130]:
                    - paragraph [ref=f25e131]: Experience with TanStack is a bonus, and so is a real understanding of frontend caching and eventual consistency, we'd love to hire someone who's dealt with that tradeoff directly.
                  - listitem [ref=f25e132]:
                    - paragraph [ref=f25e133]: Experience with capacity planning, scheduling, reporting, or other complex B2B SaaS products.
                  - listitem [ref=f25e134]:
                    - paragraph [ref=f25e135]: Experience working with distributed or microservice systems, a basic understanding of infrastructure and infrastructure as code, and some experience creating, improving, or debugging CI/CD pipelines.
            - paragraph [ref=f25e136]:
              - strong [ref=f25e137]: This Role Is NOT
            - list [ref=f25e138]:
              - listitem [ref=f25e139]:
                - paragraph [ref=f25e140]: A ticket-taker role. If you want fully specced work handed to you, this isn't the right fit.
              - listitem [ref=f25e141]:
                - paragraph [ref=f25e142]: A pixel-pusher translating finished designs into code with no say in the problem or the solution.
              - listitem [ref=f25e143]:
                - paragraph [ref=f25e144]: A role where you hand off at the API boundary. If "that's a backend ticket" is your instinct, this will frustrate you.
              - listitem [ref=f25e145]:
                - paragraph [ref=f25e146]: "A role where quality is someone else's job. Toggl doesn't have a dedicated QAteam or layer: there's no separate team that will catch your bugs, write yourtests, or own your performance regressions."
              - listitem [ref=f25e147]:
                - paragraph [ref=f25e148]: A place to work in isolation from users. You'll be expected to know who you're building for and why.
              - listitem [ref=f25e149]:
                - paragraph [ref=f25e150]: A role for people who need heavy process, frequent approvals, or top-down direction to do their best work.
            - paragraph [ref=f25e151]
            - paragraph [ref=f25e152]:
              - strong [ref=f25e153]: The Team
            - paragraph [ref=f25e154]:
              - text: We are a global team of ~80 awesome people working from over 40 countries around the globe. We hire globally, you work locally—in the heart of London, a beach outside of Río de Janeiro, or a quiet village near Florence, the choice is yours. Every few months we travel to meet up somewhere in the world and spend some quality time together. We place a huge amount of trust in our people, and we measure the outcomes rather than the work itself.
              - link "Our values" [ref=f25e155] [cursor=pointer]:
                - /url: https://toggl.com/culture/
              - text: fuel our results.
              - strong [ref=f25e156]: What's Happening at Toggl
            - paragraph [ref=f25e157]:
              - text: "Toggl is at an exciting turning point. We're taking our best-in-class time tracking - trusted and loved by millions of users worldwide - and expanding it into something bigger:"
              - link "Toggl 2.0" [ref=f25e158] [cursor=pointer]:
                - /url: https://toggl.com/focus/
              - text: ". One product that brings together time tracking, planning, capacity management, reporting, and insight. The idea is simple: better time tracking creates better data, which powers everything else. We call it time intelligence. We build with AI throughout, and we think it's a real multiplier for strong engineers rather than a substitute for them. The judgment, the tradeoffs, and the accountability for what ships stay with people."
            - paragraph [ref=f25e159]
            - paragraph [ref=f25e160]:
              - strong [ref=f25e161]: Benefits
            - list [ref=f25e162]:
              - listitem [ref=f25e163]:
                - paragraph [ref=f25e164]: Freedom to choose when and how much you work—we only measure results
              - listitem [ref=f25e165]:
                - paragraph [ref=f25e166]: 24 days of paid time off a year, plus your local holidays
              - listitem [ref=f25e167]:
                - paragraph [ref=f25e168]: Unlimited sick leave
              - listitem [ref=f25e169]:
                - paragraph [ref=f25e170]: In-person meetups for team-building (expenses covered)
              - listitem [ref=f25e171]:
                - paragraph [ref=f25e172]: 4-6 weeks paid sabbatical (depending on tenure)
              - listitem [ref=f25e173]:
                - paragraph [ref=f25e174]: Laptop budget up to 2,500€ and it renews every 3 years
              - listitem [ref=f25e175]:
                - paragraph [ref=f25e176]: €2,000 budget to set up your home office and an additional €300 every year after 3 years of tenure
              - listitem [ref=f25e177]:
                - paragraph [ref=f25e178]: €3,000 per year for co-working space membership and/or internet service at home
              - listitem [ref=f25e179]:
                - paragraph [ref=f25e180]: €4,000 per year contribution to use for training, workshops, and conferences
              - listitem [ref=f25e181]:
                - paragraph [ref=f25e182]: €2,400 per year contribution for any equipment or services to improve and/or maintain your physical and mental health
              - listitem [ref=f25e183]:
                - paragraph [ref=f25e184]: Support for buying tools you need for doing your best work (even eyeglasses if you need a new pair)
          - link [ref=f25e185] [cursor=pointer]:
