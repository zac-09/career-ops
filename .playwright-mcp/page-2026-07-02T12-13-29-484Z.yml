                    - listitem [ref=f27e169]:
                      - paragraph [ref=f27e170]: • A collaborative environment where your creativity will have a direct impact on the brand’s narrative
                  - paragraph [ref=f27e171]
                  - paragraph [ref=f27e172]:
                    - strong [ref=f27e173]: Ready to join us in bringing Financial Freedom to all?
                  - paragraph [ref=f27e174]: If you’re a visionary who thrives at the intersection of technology, knowledge and innovation, we want to hear from you!
                  - paragraph [ref=f27e175]
                  - paragraph [ref=f27e176]:
                    - strong [ref=f27e177]:
                      - emphasis [ref=f27e178]: Recruitment Data & Security Disclaimer
                  - paragraph [ref=f27e179]:
                    - emphasis [ref=f27e180]: As part of the hiring process at Bitfinex, we collect personal data such as your name, contact details, location, job preferences, education and employment history, and other information you voluntarily provide. This data is used solely for recruitment purposes, processed in accordance with applicable global data protection laws, including the General Data Protection Regulation (GDPR) and the California Consumer Privacy Act (CCPA), and retained only for as long as necessary to fulfil its purpose.
                  - paragraph [ref=f27e181]
                  - paragraph [ref=f27e182]:
                    - emphasis [ref=f27e183]: All assessments and recruitment-related communications are conducted exclusively through official Bitfinex email addresses (e.g., firstname.lastname@bitfinex.com). Bitfinex does not use unofficial channels (such as WhatsApp, Telegram, or SMS) for recruitment communication and does not distribute assessments or sensitive links via those means.
                  - paragraph [ref=f27e184]
                  - paragraph [ref=f27e185]:
                    - emphasis [ref=f27e186]:
                      - text: As part of our secure and compliant recruitment process, we may use approved third-party platforms to facilitate candidate assessments. For more information, please refer to our
                      - link:
                        - /url: https://docs.google.com/document/d/16XdoOVXINfITvXI3JtjV0TV0pGE9dZryKhOiauW7two/edit?usp=sharing
                      - link "Candidate Privacy Notice and Interview Recording Consent" [ref=f27e188] [cursor=pointer]:
                        - /url: https://drive.google.com/file/d/19-ymSM-OqiWjlFxZoMYfL_IwOVb7XQaC/view
                      - text: . All candidates have the right to access, correct, or delete their personal data and to withdraw consent at any time, where applicable.
                  - paragraph [ref=f27e189]
                  - paragraph [ref=f27e190]:
                    - emphasis [ref=f27e191]: Bitfinex will never request payments, financial information, or personal banking details at any stage of the recruitment process.
                  - paragraph [ref=f27e192]:
                    - emphasis [ref=f27e193]: If you receive a suspicious request, wish to exercise your data privacy rights, or have further inquiries regarding the legal aspects of the process, contact
                    - link "privacy@bitfinex.com" [ref=f27e194] [cursor=pointer]:
                      - /url: mailto:privacy@bitfinex.com
                    - emphasis [ref=f27e195]:
                      - generic [ref=f27e196]: . Please note this inbox is intended for privacy concerns and reports only; any other communications will not be processed.
                  - paragraph [ref=f27e197]
                  - paragraph [ref=f27e198]:
                    - strong [ref=f27e199]:
                      - emphasis [ref=f27e200]: Equal Opportunity Statement
                  - paragraph [ref=f27e201]:
                    - emphasis [ref=f27e202]: At Bitfinex, we're committed to equitable opportunities. We do not discriminate based on race, religion, gender, age, disability, sexual orientation, gender identity, or any other protected status. This commitment applies across all stages of recruitment and contractual relationships.
