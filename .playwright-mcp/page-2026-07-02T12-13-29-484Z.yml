              - generic [ref=f27e66]:
                - heading "Job description" [level=2] [ref=f27e67]
                - generic [ref=f27e69]:
                  - heading "The Original Bitcoin Exchange" [level=4] [ref=f27e70]:
                    - strong [ref=f27e71]:
                      - link "The Original Bitcoin Exchange" [ref=f27e73] [cursor=pointer]:
                        - /url: https://static.bitfinex.com/videos/bitfinex_about.mp4
                  - paragraph [ref=f27e74]: Inspired by Bitcoin's vision of financial freedom, we are committed to empowering individuals to transact and connect seamlessly across the globe. From the early days of the Bitcoin revolution, our mission has been to champion freedom through innovative, reliable, and accessible technology—ensuring that everyone, everywhere, has the tools to participate in a truly open and borderless world.
                  - paragraph [ref=f27e75]
                  - paragraph [ref=f27e76]: We are driven by a relentless pursuit of innovation and financial empowerment. By prioritizing education and delivering a cutting-edge platform, we enable users to seamlessly buy, hold, and trade digital assets with confidence. As the digital asset landscape rapidly evolves, we stay ahead—offering state-of-the-art trading services that empower both individuals and global liquidity providers. Our forward-thinking, agile approach ensures that financial freedom is not just a vision, but a reality for all.
                  - paragraph [ref=f27e77]
                  - paragraph [ref=f27e78]: Our team, composed of visionary individuals with practical expertise, focuses on crafting solutions to the market's toughest challenges. Despite our global presence and impact, we maintain a small, technology-focused core, fostering a culture of collaboration and innovation.
                  - paragraph [ref=f27e79]
                  - paragraph [ref=f27e80]: We value integrity and autonomy, empowering our team to contribute from concept to launch. Driven by a passion for lifelong learning and a commitment to advancing freedom, we prioritize high-caliber products and services, with a proven track record of innovation that draws on the dexterity of our teams.
                  - paragraph [ref=f27e81]
                  - heading "Why Join Us?" [level=4] [ref=f27e82]:
                    - strong [ref=f27e83]: Why Join Us?
                  - paragraph [ref=f27e84]
                  - paragraph [ref=f27e85]:
                    - strong [ref=f27e86]: Innovation
                  - paragraph [ref=f27e87]: At Bitfinex, we merge technology and skill to create an environment where your involvement isn’t just appreciated—it’s pioneering the future and pushing boundaries in finance. Our culture values bold creativity, a passion for technology, and a deep belief in Financial Freedom.
                  - paragraph [ref=f27e88]
                  - paragraph [ref=f27e89]:
                    - strong [ref=f27e90]: Flexibility & Global Reach
                  - paragraph [ref=f27e91]: We believe in trust, autonomy, and results—our team operates remotely, ensuring you work from anywhere while collaborating with some of the best talents across the world. We thrive on innovation, autonomy, and breaking new ground.
                  - paragraph [ref=f27e92]
                  - paragraph [ref=f27e93]:
                    - strong [ref=f27e94]: Fast-Paced & Impactful
                  - paragraph [ref=f27e95]: Much like the crypto industry itself, our projects move fast, break new ground, and make an impact. Your contributions reach our global audience, shaping the narrative of a decentralized future.
                  - paragraph [ref=f27e96]
                  - paragraph [ref=f27e97]:
                    - strong [ref=f27e98]: A Team that Thrives on Collaboration
                  - paragraph [ref=f27e99]: We blend seasoned experts with fresh creative minds, ensuring constant innovation, mentorship, and a dynamic work environment that keeps you at the forefront of achieving your goals. We see integrity and standing up for what is right as the most important qualities.
                  - paragraph [ref=f27e100]
                  - paragraph [ref=f27e101]:
                    - strong [ref=f27e102]: Grow with the Best
                  - paragraph [ref=f27e103]: At Bitfinex, we’re committed to continuous learning—whether through technological advancements, creative workshops, or mentorship from leading professionals in the industry.
                  - paragraph [ref=f27e104]
                  - paragraph [ref=f27e105]: If you’re excited about partaking in shaping the narrative of decentralized finance, you’ll feel right at home
                  - paragraph [ref=f27e106]
                  - paragraph [ref=f27e107]:
                    - strong [ref=f27e108]: "We’re looking for:"
                    - strong [ref=f27e109]: Senior Backend Developer
                  - paragraph [ref=f27e110]
                  - heading "The Role:" [level=4] [ref=f27e111]
                  - paragraph [ref=f27e112]:
                    - strong
                    - text: "As a senior Backend Developer, you will be a part of the team that works on the development of the backend components of all Bitfinex Services (main trading application, Lightning Network support, Blockchain integrations, ….). This includes:"
                  - paragraph [ref=f27e113]
                  - list [ref=f27e114]:
                    - listitem [ref=f27e115]:
                      - paragraph [ref=f27e116]:
                        - text: •
                        - strong [ref=f27e117]: New Products and Features
                        - text: "- Bitfinex continuously strives to create innovative new features in order to provide the most professional trading experience for customers. These are developed and deployed using agile methodologies, to ensure the user experience remains the best in the industry."
                    - listitem [ref=f27e118]:
                      - paragraph [ref=f27e119]:
                        - text: •
                        - strong [ref=f27e120]: Scalability
                        - text: "- all backend services that power Bitfinex platform must remain effortlessly smooth, responsive, and real-time for customers as the platform continues to scale to accommodate new user growth. A good example are the renown Bitfinex API, the most solid, low-latency and complete in our industry."
                    - listitem [ref=f27e121]:
                      - paragraph [ref=f27e122]:
                        - text: •
                        - strong [ref=f27e123]: Security
                        - text: "- Bitfinex makes Security its most important feature. The Backend Development team is responsible for building all the API services and backend processes with the highest security principles and standard, in order to protect the safety of the entire user base."
                  - paragraph [ref=f27e124]
                  - heading "What You Bring to the Table:" [level=4] [ref=f27e125]
                  - list [ref=f27e126]:
                    - listitem [ref=f27e127]:
                      - paragraph [ref=f27e128]: • Exceptional Node/JavaScript skills
                    - listitem [ref=f27e129]:
                      - paragraph [ref=f27e130]: • Familiar with microservices architecture
                    - listitem [ref=f27e131]:
                      - paragraph [ref=f27e132]: • Have actively participated in the development of a complex platform
                    - listitem [ref=f27e133]:
                      - paragraph [ref=f27e134]: • Good experience in interacting with databases (MySQL, MongoDB)
                    - listitem [ref=f27e135]:
                      - paragraph [ref=f27e136]: • Ability to quickly learn new technologies
                    - listitem [ref=f27e137]:
                      - paragraph [ref=f27e138]: • Good understanding of security practices
                  - paragraph [ref=f27e139]
                  - heading "Other Valuable Skills:" [level=4] [ref=f27e140]
                  - list [ref=f27e141]:
                    - listitem [ref=f27e142]:
                      - paragraph [ref=f27e143]: • Experience with blockchain integration
                    - listitem [ref=f27e144]:
                      - paragraph [ref=f27e145]: • Comfortable with high-availability concepts
                    - listitem [ref=f27e146]:
                      - paragraph [ref=f27e147]: • Ruby, Rust or C++ skills are a plus
                    - listitem [ref=f27e148]:
                      - paragraph [ref=f27e149]: "• Other technologies of interest: Message queues (Redis), Caches and Job Queues"
                  - paragraph [ref=f27e150]
