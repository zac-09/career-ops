        - heading "On a quest for quality" [level=2] [ref=e87]
        - generic [ref=e88]:
          - generic [ref=e89]:
            - paragraph [ref=e90]: We believe that there is a lost art of building software. A craftsmanship that yields products of an exceptional, almost magical, quality.
            - paragraph [ref=e91]: It’s difficult to describe this quality with words and impossible to measure it in numbers, but you can feel it when it’s there. You know it when you experience it. To bring back this level of quality, we are building a tool that empowers product teams to do their best work. A tool with unparalleled speed, focus, and design.
            - paragraph [ref=e92]: Building this tool requires a team of talented individuals who care deeply about the quality of their work, no matter if it’s engineering, design, or customer support. We are looking for people who share our passion for software craftsmanship and getting even the smallest details right. If that sounds like you, please reach out and join us on our quest.
