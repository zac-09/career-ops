        - generic [ref=e148]:
          - heading "How we think and work" [level=2] [ref=e149]
          - paragraph [ref=e150]: Linear’s mission is to inspire and accelerate builders. To turn that ambition into reality, we operate based on a set of core principles that keep us focused.
        - list [ref=e152]:
          - listitem [ref=e153]:
            - generic [ref=e154]:
              - generic [ref=e155]: "01."
              - generic [ref=e156]: Ship early
            - generic [ref=e157]: Simplify and ship smaller.
          - listitem [ref=e158]:
            - generic [ref=e159]:
              - generic [ref=e160]: "02."
              - generic [ref=e161]: Build with users
            - generic [ref=e162]: Listen carefully and understand their problems.
          - listitem [ref=e163]:
            - generic [ref=e164]:
              - generic [ref=e165]: "03."
              - generic [ref=e166]: Know what good looks like
            - generic [ref=e167]: Find and create good things. Know what needs to change to make it better.
          - listitem [ref=e168]:
            - generic [ref=e169]:
              - generic [ref=e170]: "04."
              - generic [ref=e171]: Think in principles
            - generic [ref=e172]: Not in playbooks.
          - listitem [ref=e173]:
            - generic [ref=e174]:
              - generic [ref=e175]: "05."
              - generic [ref=e176]: Build things that last
            - generic [ref=e177]: Put care into the foundation. Don’t make it a future person’s problem.
          - listitem [ref=e178]:
            - generic [ref=e179]:
              - generic [ref=e180]: "06."
              - generic [ref=e181]: Avoid side quests
            - generic [ref=e182]: Don’t fix every problem. Avoid adding unnecessary process or documents.
          - listitem [ref=e183]:
            - generic [ref=e184]:
              - generic [ref=e185]: "07."
              - generic [ref=e186]: Say it as it is
            - generic [ref=e187]: Get to the point and assume good intentions.
          - listitem [ref=e188]:
            - generic [ref=e189]:
              - generic [ref=e190]: "08."
              - generic [ref=e191]: Keep the team small, do more with less
            - generic [ref=e192]: We build better with fewer people. Wear multiple hats.
          - listitem [ref=e193]:
            - generic [ref=e194]:
              - generic [ref=e195]: "09."
              - generic [ref=e196]: Hire the best people
            - generic [ref=e197]: The best people hire the best people. Help recruit.
          - listitem [ref=e198]:
            - generic [ref=e199]:
              - generic [ref=e200]: "10."
              - generic [ref=e201]: Create fans
            - generic [ref=e202]: Build a community of people who use, love, and defend the product.
          - listitem [ref=e203]:
            - generic [ref=e204]:
              - generic [ref=e205]: "11."
              - generic [ref=e206]: Fully remote
            - generic [ref=e207]: The freedom to work remotely allows for more meaningful work.
