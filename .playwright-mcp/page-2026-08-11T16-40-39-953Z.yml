          - button "Apply" [ref=f1e18] [cursor=pointer]: Submit application
        - generic [ref=f1e20]:
          - paragraph [ref=f1e21]: Canonical is a leading provider of open source software and operating systems to the global enterprise and technology markets. Our platform, Ubuntu, is very widely used in breakthrough enterprise initiatives such as public cloud, data science, AI, engineering innovation, and IoT. Our customers include the world's leading public cloud and silicon providers, and industry leaders in many sectors. The company is a pioneer of global distributed collaboration, with 1200+ colleagues in 75+ countries and very few office-based roles. Teams meet two to four times yearly in person, in interesting locations around the world, to align on strategy and execution.
          - paragraph [ref=f1e22]: The company is founder-led, profitable, and growing.
          - paragraph [ref=f1e23]: We are hiring a Junior developer with a proven track record in Python and/or Go. As part of the Observability team, you will develop a cloud-native monitoring stack that composes best-in-class open-source monitoring tools. The stack is opinionated, resilient, and scalable, providing deep insights out of the box. The user experience is polished and seamless for the end-users, and its administrators will enjoy smooth, lightweight Day 1 and Day 2 operations.
          - paragraph [ref=f1e24]: This is an exciting opportunity for a software engineer passionate about open source software, Linux, Kubernetes, and Observability. Build a rewarding, meaningful career working with the best and brightest people in technology at Canonical, the growing international software company behind Ubuntu.
          - paragraph [ref=f1e25]: The monitoring stack will monitor applications running on a mix of cloud technologies such as Kubernetes and OpenStack, as well as bare-metal, virtual machines and containers. The stack will be capable of monitoring applications and infrastructure irrespective of whether they are operated by Juju, and will leverage multiple data sources at various levels of the architecture, including Juju itself, to contextualize the collected telemetry and insights delivered to the end-users.
          - paragraph [ref=f1e26]:
            - text: You can read more about the project
            - link "here" [ref=f1e27] [cursor=pointer]:
              - /url: https://grafana.com/blog/2021/10/28/open-source-done-right-why-canonical-adopted-grafana-loki-and-grafana-agent-for-their-new-stack/
            - text: and
            - link "here" [ref=f1e28] [cursor=pointer]:
              - /url: https://juju.is/blog/model-driven-observability-part-1
            - text: .
          - paragraph [ref=f1e29]:
            - generic [ref=f1e30]:
              - strong [ref=f1e31]: "Location:"
              - emphasis [ref=f1e32]: This role will be based remotely in the EMEA and Americas regions
          - heading "The role entails" [level=2] [ref=f1e33]
          - list [ref=f1e34]:
            - listitem [ref=f1e35]: Collaborate proactively with a globally distributed team
            - listitem [ref=f1e36]: Write, test and document high quality code to create new features
            - listitem [ref=f1e37]: Debug issues and interact with a vibrant community
            - listitem [ref=f1e38]: Review code produced by other engineers
            - listitem [ref=f1e39]: Attend conferences to represent Canonical and the Charmed Observability Stack
            - listitem [ref=f1e40]: Work from home with global travel 2 to 4 weeks for internal and external events
          - heading "What we are looking for in you" [level=2] [ref=f1e41]
          - list [ref=f1e42]:
            - listitem [ref=f1e43]: You love technology and working with brilliant people
            - listitem [ref=f1e44]: You value soft skills and are passionate, enterprising, thoughtful, and self-motivated
            - listitem [ref=f1e45]: You have a Bachelor’s or equivalent in Computer Science, STEM or similar degree
            - listitem [ref=f1e46]: You are a skilled Python developer, preferably with a track record in open source
            - listitem [ref=f1e47]: You have a working knowledge of Go
            - listitem [ref=f1e48]: "You have interest and experience with two or more of the following: Ubuntu Linux, container images, Debian packaging, snap, distributed systems."
          - heading "What we offer colleagues" [level=2] [ref=f1e49]
          - paragraph [ref=f1e50]: We consider geographical location, experience, and performance in shaping compensation worldwide. We revisit compensation annually (and more often for graduates and associates) to ensure we recognize outstanding performance. In addition to base pay, we offer a performance-driven annual bonus or commission. We provide all team members with additional benefits which reflect our values and ideals. We balance our programs to meet local needs and ensure fairness globally.
          - list [ref=f1e51]:
            - listitem [ref=f1e52]: Distributed work environment with twice-yearly team sprints in person
            - listitem [ref=f1e53]: Personal learning and development budget of USD 2,000 per year
            - listitem [ref=f1e54]: Annual compensation review
            - listitem [ref=f1e55]: Recognition rewards
            - listitem [ref=f1e56]: Annual holiday leave
            - listitem [ref=f1e57]: Maternity and paternity leave
            - listitem [ref=f1e58]: Team Member Assistance Program & Wellness Platform
            - listitem [ref=f1e59]: Opportunity to travel to new locations to meet colleagues
            - listitem [ref=f1e60]: Priority Pass and travel upgrades for long-haul company events
          - heading "About Canonical" [level=2] [ref=f1e61]
          - paragraph [ref=f1e62]: Canonical is a pioneering tech firm at the forefront of the global move to open source. As the company that publishes Ubuntu, one of the most important open-source projects and the platform for AI, IoT, and the cloud, we are changing the world of software. We recruit on a global basis and set a very high standard for people joining the company. We expect excellence; in order to succeed, we need to be the best at what we do. Most colleagues at Canonical have worked from home since our inception in 2004. Working here is a step into the future and will challenge you to think differently, work smarter, learn new skills, and raise your game.
          - heading "Canonical is an equal opportunity employer" [level=2] [ref=f1e63]
          - paragraph [ref=f1e64]:
            - text: We are proud to foster a workplace free from discrimination. Diversity of experience, perspectives, and background create a better work environment and better products.
            - link "Whatever your identity, we will give your application fair consideration." [ref=f1e65] [cursor=pointer]:
              - /url: https://canonical.com/careers/diversity/identity
          - paragraph [ref=f1e66]
          - paragraph [ref=f1e67]: "#LI-remote"
