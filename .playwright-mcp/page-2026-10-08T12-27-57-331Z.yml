        - generic [ref=f35e285]:
          - heading "No ceiling. No orbit. No limits." [level=1] [ref=f35e286]
          - generic [ref=f35e287]: You don't wait for permission to build.
        - generic [ref=f35e288]:
          - list [ref=f35e289]:
            - listitem [ref=f35e290]:
              - generic [ref=f35e291]: "01"
              - generic [ref=f35e292]:
                - paragraph [ref=f35e293]: You move before you're told.
                - paragraph [ref=f35e294]: Ship something real and learn — don't wait for alignment on an opportunity today that will be obsolete tomorrow.
            - listitem [ref=f35e295]:
              - generic [ref=f35e296]: "02"
              - generic [ref=f35e297]:
                - paragraph [ref=f35e298]: You see problems as puzzles, not walls.
                - paragraph [ref=f35e299]: When things get hard your energy goes up. You don't spiral. You solve.
            - listitem [ref=f35e300]:
              - generic [ref=f35e301]: "03"
              - generic [ref=f35e302]:
                - paragraph [ref=f35e303]: You raise the bar. Nobody asks you to go beyond the brief.
                - paragraph [ref=f35e304]: You just do - then help the person next to you.
            - listitem [ref=f35e305]:
              - generic [ref=f35e306]: "04"
              - generic [ref=f35e307]:
                - paragraph [ref=f35e308]: You default to "how could I automate this."
                - paragraph [ref=f35e309]: Engineering, ops, finance, sales - efficiency isn't laziness. It's leverage.
            - listitem [ref=f35e310]:
              - generic [ref=f35e311]: "05"
              - generic [ref=f35e312]:
                - paragraph [ref=f35e313]: You build for the people using it.
                - paragraph [ref=f35e314]: Obsess over what customers actually need - not what's easiest to build.
            - listitem [ref=f35e315]:
              - generic [ref=f35e316]: "06"
              - generic [ref=f35e317]:
                - paragraph [ref=f35e318]: You show up across borders.
                - paragraph [ref=f35e319]: Timezones aren't excuses, they're an advantage. You build with the global team, not around it.
          - figure "No ceiling. No orbit. No limits. — Alex Bouaziz — Shuo Wang" [ref=f35e321]:
            - generic [aria-hidden]:
              - generic: Alex Bouaziz
              - generic: Shuo Wang
      - generic [ref=f35e325]:
        - heading "Why Deel?" [level=2] [ref=f35e326]
        - generic [ref=f35e327]:
          - generic [ref=f35e329]:
            - paragraph [ref=f35e330]: The permission structure here is real. You don't wait for a fancy title to greenlight an idea — you build it, show it, and if it's good, it ships. The tools and the autonomy are yours. The organization is flat, a hyper-global team of builders is always a Slack DM away.
            - paragraph [ref=f35e331]: The evidence is in the growth — it's 1 of 1. We went from zero to $1B+ ARR in six years across 160+ countries. That hyperscaling creates new problems and challenges — not the kind you just manage around, but the kind that sharpen your craft as you own and solve them.
            - paragraph [ref=f35e332]: The people are genuinely smart, ambitious, and mission-driven. Our bias is action. And good ideas come from everywhere at Deel — not just R&D. An ops person can ship a workflow that changes how the company runs. We want to see the builder in everyone.
          - img "Image" [ref=f35e336]
      - generic [ref=f35e338]:
        - generic [ref=f35e340]:
          - heading "The sky is open. The door is too." [level=2] [ref=f35e341]
          - generic [ref=f35e342]:
            - paragraph [ref=f35e343]: "The honest part is that we are a work-from-anywhere company, but we do work, and work hard. Our global footprint means we move at the pace of the world: high volume, high accountability, high speed."
            - paragraph [ref=f35e344]: If you want a stable and highly predictable work week, Deel likely isn't for you. If you want to build things that touch millions of people with real autonomy and impact, there is nowhere better.
