                - listitem [ref=f8e54]: Design, develop, and maintain scalable backend services using TypeScript and Node.js (Nest.js).
                - listitem [ref=f8e55]: Build responsive, modular, and maintainable front-end applications using React.
                - listitem [ref=f8e56]: Architect, implement, and optimize RESTful APIs for client–server communication.
                - listitem [ref=f8e57]: Work with relational and NoSQL databases and design efficient data models.
                - listitem [ref=f8e58]: Build and deploy applications within AWS, leveraging services such as ECS, Lambda, S3, SQS, and IAM.
                - listitem [ref=f8e59]: Contribute to system design discussions and help shape scalable, maintainable architecture decisions.
                - listitem [ref=f8e60]: Perform thorough unit and integration testing and validate code quality prior to QA handoff.
                - listitem [ref=f8e61]: Leverage AI development tools (such as GitHub Copilot, Claude, or similar) to improve productivity and code quality.
                - listitem [ref=f8e62]: Write clean, testable, and reusable code with proper documentation.
                - listitem [ref=f8e63]: Collaborate with cross-functional teams to define requirements and deliver features from concept through production release.
                - listitem [ref=f8e64]: Ensure application security, performance, reliability, and scalability across systems.
                - listitem [ref=f8e65]: Participate in code reviews and provide constructive feedback to maintain code quality standards.
              - paragraph [ref=f8e66]:
