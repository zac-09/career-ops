                - listitem [ref=f8e73]: Solid working experience with Node.js and server-side TypeScript frameworks.
                - listitem [ref=f8e74]: Experience working with relational and NoSQL databases and ORM libraries.
                - listitem [ref=f8e75]: Familiarity with API design best practices, authentication/authorization (OAuth, JWT), and security principles.
                - listitem [ref=f8e76]: Practical experience building and deploying applications in AWS (e.g. ECS, Lambda, S3, SQS, IAM) – architecture and infrastructure ownership not required.
