                - text: ":"
              - paragraph [ref=f8e26]: LighthouseAI provides pharmaceutical state licensing software and services to pharmaceutical manufacturers, wholesale distributors, logistics companies, and pharmacies. The LighthouseAI product suite includes LighthouseAI Intelligence®, which uses artificial intelligence to automate compliance requirement research, and LighthouseAI Management®, which enables ongoing license maintenance. LighthouseAI creates a stress-free and streamlined state licensing experience with support from our expert industry veterans and professional solutions.
              - paragraph [ref=f8e27]: We are seeking a highly skilled Senior Full Stack Developer with strong TypeScript, React, and Node.js experience to join our growing engineering team. In this role, you will design, build, and maintain scalable web applications, collaborating closely with product managers and engineers across the full stack – from developing backend APIs and data models to building intuitive, high-performance front-end interfaces. We are looking for someone who brings strong autonomy, sound architectural judgment, and a bias toward clean, well-tested code.
