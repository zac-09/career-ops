                  - paragraph [ref=e70]
                  - paragraph [ref=e71]: Trusted by 20,000+ property managers worldwide, Hostaway is an industry leading, AI-powered vacation rental management platform designed for professional short-term rental operators. Hostaway brings everything together for greater efficiency and faster growth.
                  - paragraph [ref=e72]
                  - paragraph [ref=e73]:
                    - text: Profitable, high-growth, and the first short-term rental Property Management System unicorn 🦄. Join us at our most exciting stage yet! Learn more about our recent valuation and story
