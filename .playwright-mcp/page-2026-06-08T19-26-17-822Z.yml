                  - heading "About the role:" [level=3] [ref=e78]
                  - paragraph [ref=e79]: Hostaway is seeking a highly motivated Senior Backend Engineer to join our Communications team. This team is responsible for the Unified Inbox module which streamlines the Guest <> Host communication (email, sms, WhatsApp, OTA messages, etc.) by supporting the Property Managers with time saving AI features, automations, templates and scheduling.
                  - paragraph [ref=e80]
                  - paragraph [ref=e81]: The Communications team is responsible for a critical part of the system and handles huge volumes of data and requests, and interacts with a variety of complex APIs - if this is something you have experience with and you are excited about you’ll be a great fit!
                  - paragraph [ref=e82]
                  - paragraph [ref=e83]: Senior Backend Engineers at Hostaway play a crucial role in designing,building, supporting and evolving the robust, scalable, and secure backend systems that power user-facing features. You will work closely with your cross-functional team to fully own and deliver solutions that address real customer needs, ensuring our platform remains reliable and extensible as we grow.
                - heading "Job requirements" [level=2] [ref=e84]
                - generic [ref=e86]:
                  - list [ref=e87]:
                    - listitem [ref=e88]:
                      - paragraph [ref=e89]: • 6+ years of experience in SaaS software development (production live product)
                    - listitem [ref=e90]:
                      - paragraph [ref=e91]: • Strong-level proficiency in PHP and/or Golang, with a strong willingness to dive into both.
                    - listitem [ref=e92]:
                      - paragraph [ref=e93]: • Experience in designing and developing RESTful web APIs
                    - listitem [ref=e94]:
                      - paragraph [ref=e95]: • Familiarity with transitioning event-driven service-oriented architectures by applying Domain Driven Design (DDD) principles
                    - listitem [ref=e96]:
                      - paragraph [ref=e97]: • Experience in writing Unit Tests and Integration Tests
                    - listitem [ref=e98]:
                      - paragraph [ref=e99]: • Proficiency in monitoring and supporting production software
                    - listitem [ref=e100]:
                      - paragraph [ref=e101]: • Experience working in a Cloud environment (AWS is a plus)
                    - listitem [ref=e102]:
                      - paragraph [ref=e103]: • Experience with message queues (e.g., AWS SQS) is a plus
                    - listitem [ref=e104]:
                      - paragraph [ref=e105]: • English language level C1
                  - paragraph [ref=e106]
