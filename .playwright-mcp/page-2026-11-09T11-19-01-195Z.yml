          - generic [ref=e172]: Fully remote since 2014
          - paragraph [ref=e174]: We believe in working from wherever you can do your best work. That looks different for everyone, which is why we have colleagues from all around the world.
        - generic [ref=e181]:
          - generic [ref=e182]: Driven by a purpose
          - paragraph [ref=e184]: We're guided by a strong mission, a distinct vision, and shared values. Trust, our key value, shapes the company culture and direction.
        - generic [ref=e191]:
          - generic [ref=e192]: Work freedom
          - paragraph [ref=e194]: It doesn't matter when you work or how long you work, as long as you get things done. We call this Results and Accountability First at Toggl, or RAFT™.
        - generic [ref=e201]:
          - generic [ref=e202]: Small but impactful
          - paragraph [ref=e204]: Each Toggler has a significant impact on what their role entails, embracing accountability and ownership in their day-to-day.
        - generic [ref=e211]:
          - generic [ref=e212]: Challenging (the good kind)
          - paragraph [ref=e214]: Our globally distributed and diverse team members are as talented as they are opinionated. You'll work together with the best people — each with their unique skillset and perspective — to tackle real problems.
        - generic [ref=e221]:
          - generic [ref=e222]: And... meetups!
          - paragraph [ref=e224]: As a remote team, we know that virtual calls are not enough and face time is essential. We aim to meet up at least twice a year. And yes, all expenses are covered!
