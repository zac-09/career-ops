              - generic [ref=f1e80]:
                - paragraph [ref=f1e81]:
                  - strong [ref=f1e82]:
                    - emphasis [ref=f1e83]: Join Tether and Shape the Future of Digital Finance
                - paragraph [ref=f1e84]: At Tether, we’re not just building products, we’re pioneering a global financial revolution. Our cutting-edge solutions empower businesses—from exchanges and wallets to payment processors and ATMs—to seamlessly integrate reserve-backed tokens across blockchains. By harnessing the power of blockchain technology, Tether enables you to store, send, and receive digital tokens instantly, securely, and globally, all at a fraction of the cost. Transparency is the bedrock of everything we do, ensuring trust in every transaction.
                - paragraph [ref=f1e85]
                - paragraph [ref=f1e86]:
                  - strong [ref=f1e87]:
                    - emphasis [ref=f1e88]: Innovate with Tether
                - paragraph [ref=f1e89]:
                  - strong [ref=f1e90]: "Tether Finance:"
                  - text: Our innovative product suite features the world’s most trusted stablecoin,
                  - strong [ref=f1e91]: USDT
                  - text: ", relied upon by hundreds of millions worldwide, alongside pioneering digital asset tokenization services."
                - paragraph [ref=f1e92]: "But that’s just the beginning:"
                - paragraph [ref=f1e93]:
                  - strong [ref=f1e94]: "Tether Power:"
                  - text: Driving sustainable growth, our energy solutions optimize excess power for Bitcoin mining using eco-friendly practices in state-of-the-art, geo-diverse facilities.
                - paragraph [ref=f1e95]:
                  - strong [ref=f1e96]: "Tether Data:"
                  - text: Fueling breakthroughs in AI and peer-to-peer technology, we reduce infrastructure costs and enhance global communications with cutting-edge solutions like
                  - strong [ref=f1e97]: KEET
                  - text: ", our flagship app that redefines secure and private data sharing."
                - paragraph [ref=f1e98]:
                  - strong [ref=f1e99]: Tether Education
                  - text: ": Democratizing access to top-tier digital learning, we empower individuals to thrive in the digital and gig economies, driving global growth and opportunity."
                - paragraph [ref=f1e100]:
                  - strong [ref=f1e101]: Tether Evolution
                  - text: ": At the intersection of technology and human potential, we are pushing the boundaries of what is possible, crafting a future where innovation and human capabilities merge in powerful, unprecedented ways."
                - paragraph [ref=f1e102]
                - paragraph [ref=f1e103]:
                  - strong [ref=f1e104]:
                    - emphasis [ref=f1e105]: Why Join Us?
                - paragraph [ref=f1e106]: Our team is a global talent powerhouse, working remotely from every corner of the world. If you’re passionate about making a mark in the fintech space, this is your opportunity to collaborate with some of the brightest minds, pushing boundaries and setting new standards. We’ve grown fast, stayed lean, and secured our place as a leader in the industry.
                - paragraph [ref=f1e107]: If you have excellent English communication skills and are ready to contribute to the most innovative platform on the planet, Tether is the place for you.
                - paragraph [ref=f1e108]:
                  - strong [ref=f1e109]: Are you ready to be part of the future?
                - paragraph [ref=f1e110]
                - paragraph [ref=f1e111]:
                  - strong [ref=f1e112]: About the job
                - paragraph [ref=f1e113]: We are looking for Fullstack Engineer to help QVAC application teams develop, review, test, and deliver reliable software with less friction. Your focus will be our desktop and mobile applications and their shared runtime, AI harness, and skills packages. You will build and maintain developer tools, integrate AI agents into engineering workflows, and improve code quality and delivery automation.
                - paragraph [ref=f1e114]: This is a hands-on engineering role with room to shape the tooling roadmap. You will work with engineers to identify useful improvements and own them from implementation through adoption and ongoing support. Success means shorter feedback loops, dependable automation, and tools that developers trust and use.
                - paragraph [ref=f1e115]
                - paragraph [ref=f1e116]
                - paragraph [ref=f1e117]:
                  - strong [ref=f1e118]: Responsibilities
                - list [ref=f1e119]:
                  - listitem [ref=f1e120]:
                    - paragraph [ref=f1e121]: • Evaluate, integrate, and maintain developer tools and AI agents, including the repository guidance and integrations they need to work effectively.
                  - listitem [ref=f1e122]:
                    - paragraph [ref=f1e123]: • Build and operate agents in CI and scheduled workflows that investigate failures, propose fixes, and give engineers evidence they can act on.
                  - listitem [ref=f1e124]:
                    - paragraph [ref=f1e125]: • Improve automated pull request reviews, evaluating finding accuracy and reducing noise for reviewers.
                  - listitem [ref=f1e126]:
                    - paragraph [ref=f1e127]: • Develop code quality scripts and checks for complexity, function and file size, dependency cycles, and performance regressions. Work with package owners on practical thresholds and targeted refactoring.
                  - listitem [ref=f1e128]:
                    - paragraph [ref=f1e129]: • Improve development environments, testing, and build and release workflows so engineers and agents can verify changes reliably.
                  - listitem [ref=f1e130]:
                    - paragraph [ref=f1e131]: • Prioritize improvements with engineering teams, support adoption through documentation and onboarding, and measure effectiveness, reliability, and operating costs.
                - paragraph [ref=f1e132]: Example projects include agents that investigate CI failures, diagnose compatibility and performance regressions, and flag changes that affect package interfaces or architecture. You will choose and refine these workflows with the engineers who use them.
