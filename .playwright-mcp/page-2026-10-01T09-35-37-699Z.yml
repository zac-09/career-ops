        - generic [ref=f1e22]:
          - paragraph [ref=f1e23]: The mission of Speechify is to make sure that reading is never a barrier to learning.
          - paragraph [ref=f1e24]: Over 50 million people use Speechify’s text-to-speech products to turn whatever they’re reading – PDFs, books, Google Docs, news articles, websites – into audio, so they can read faster, read more, and remember more. Speechify’s text-to-speech reading products include its iOS app, Android App, Mac App, Chrome Extension, and Web App. Google recently named Speechify the Chrome Extension of the Year and Apple named Speechify its 2025 Design Award winner for Inclusivity.
          - paragraph [ref=f1e25]: Today, nearly 200 people around the globe work on Speechify in a 100% distributed setting – Speechify has no office.
          - paragraph [ref=f1e26]:
            - strong [ref=f1e27]: Overview
          - paragraph [ref=f1e28]: "The Platform team owns the backend behind everything Speechify ships: the public TTS API, payments, subscriptions, auth, consumption tracking, and analytics — serving over 50 million users across iOS, Android, Mac, Chrome, and web."
          - paragraph [ref=f1e29]: These are systems where correctness compounds. Subscription state has to stay consistent across five clients and two app-store billing systems that each go quiet at the worst moment. Consumption metering has to be exact enough to bill on and cheap enough to run at our request volume. The public TTS API has external customers with their own products depending on our latency and uptime. None of this degrades gracefully — it is either right, or someone gets charged twice.
          - paragraph [ref=f1e30]: "The job is to make your own job smaller. Every system you own here should need less of you a year from now than it did the day you took it, and the reward for that is a larger one. That is the entire growth path on this team — there is no separate ladder, and no ceiling except the one you stop raising. We are a flat organization: people become leaders here by taking scope and being right about it, fast."
          - paragraph [ref=f1e31]:
            - strong [ref=f1e32]: What Yo
            - strong [ref=f1e33]: u’
            - strong [ref=f1e34]: ll Do
          - list [ref=f1e35]:
            - listitem [ref=f1e36]: Design, build, and own the APIs behind payments, subscriptions, auth, consumption tracking, and our public TTS API
            - listitem [ref=f1e37]: Take on services you didn't write and make them faster, cheaper, and harder to break
            - listitem [ref=f1e38]: Establish that a change is correct before it ships, and leave behind the checks that keep it correct after you've moved on
            - listitem [ref=f1e39]: Automate the parts of your role that shouldn't need a person, then go take on what that freed you up for
            - listitem [ref=f1e40]: Turn work you've done once into work the whole team can repeat
            - listitem [ref=f1e41]: Design B2B and enterprise integrations for customers building on top of us
            - listitem [ref=f1e42]: Work with product, mobile, and web to keep backend architecture ahead of where the product is going
          - paragraph [ref=f1e43]:
            - strong [ref=f1e44]: An Ideal Candidate Should Have
          - list [ref=f1e45]:
            - listitem [ref=f1e46]: Proven backend experience in TS/Node (required)
            - listitem [ref=f1e47]: Direct experience with GCP; working knowledge of AWS, Azure, or another cloud
            - listitem [ref=f1e48]: A habit of giving away work you used to own, and something to show for the room it created
            - listitem [ref=f1e49]: A daily working setup with AI agents you can describe in detail — what runs unattended, what you review, and where you've decided it doesn't get to act alone
            - listitem [ref=f1e50]: The instinct to check a result against the system itself — logs, database state, the actual request — rather than against a summary of it
            - listitem [ref=f1e51]: Judgment about what not to build, and the ability to say plainly why you dropped it
            - listitem [ref=f1e52]: A preference for being corrected over being right
            - listitem [ref=f1e53]: "Preferred: Docker and containerized deployments"
            - listitem [ref=f1e54]: "Preferred: deploying high-availability applications on Kubernetes"
          - paragraph [ref=f1e55]:
            - strong [ref=f1e56]: Interview process
          - paragraph [ref=f1e57]: Several technical interviews plus a take-home assessment on a real codebase. We aim to finish within a week.
          - paragraph [ref=f1e58]: "The assessment runs in two stages: you'll submit, get real feedback from an engineer on this team, and have time to act on it. Use the tools you use every day. You'll be asked to walk through your reasoning, so bring it."
          - paragraph [ref=f1e59]:
            - strong [ref=f1e60]: What We Offer
          - list [ref=f1e61]:
            - listitem [ref=f1e62]: A dynamic environment where your contributions shape the company and its products
            - listitem [ref=f1e63]: A team that values innovation, intuition, and drive
            - listitem [ref=f1e64]: Autonomy, fostering focus and creativity
            - listitem [ref=f1e65]: The opportunity to have a significant impact in a revolutionary industry
            - listitem [ref=f1e66]: Competitive compensation, a welcoming atmosphere, and a commitment to an exceptional asynchronous work culture
            - listitem [ref=f1e67]: The privilege of working on a product that changes lives, particularly for those with learning differences like dyslexia, ADD, and more
            - listitem [ref=f1e68]: An active role at the intersection of artificial intelligence and audio – a rapidly evolving tech domain
          - paragraph [ref=f1e69]:
            - strong [ref=f1e70]: The United States Based
            - text: "Salary range for this role is: 140,000-200,000 USD/Year + Bonus + Stock depending on experience"
          - paragraph [ref=f1e71]:
            - strong [ref=f1e72]: Think you’re a good fit for this job?
          - paragraph [ref=f1e73]: Tell us more about yourself and why you're interested in the role when you apply. And don’t forget to include links to your portfolio and LinkedIn.
          - paragraph [ref=f1e74]:
            - strong [ref=f1e75]: Not looking but know someone who would make a great fit?
          - paragraph [ref=f1e76]: Refer them!
