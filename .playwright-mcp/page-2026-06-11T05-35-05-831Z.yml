                - paragraph [ref=e41]: Never send money to companies. Jobs on Himalayas will never require payment from applicants.
            - article [ref=e42]:
              - heading "About Dwelly" [level=3] [ref=e43]:
                - text: About
                - link "Dwelly" [ref=e44] [cursor=pointer]:
                  - /url: https://himalayas.app/companies/dwelly
              - paragraph [ref=e45]:
                - link "Dwelly" [ref=e46] [cursor=pointer]:
                  - /url: https://himalayas.app/companies/dwelly
                - text: "— a UK-based, AI-enabled lettings and property management platform, that is growing through a roll-up strategy acquiring estate agencies. The company leverages two arms: i) acquiring existing letting agencies, effectively buying its highly sticky, recurring revenue-type landlords portfolios, and then ii) building a top-notch technology to automate tenant management, payments, and post-rental property maintenance. The company seamlessly integrates AI services to automate all business processes within brick-and-mortar real estate agencies, integrating them into a tech-enabled digital letting platform in two months to radically improve the user experiences and increase efficiency of the business."
              - paragraph [ref=e47]: We’re a fast-growing, product-focused company, backed by top-tier investors and led by a team with deep experience in real estate, technology, and operations.
              - heading "Position Summary" [level=3] [ref=e48]
              - paragraph [ref=e49]: We’re looking for a Staff Software Engineer to join one of our core domain teams — Tenant Find, Property Management, or Payments. This is a high-impact role at the intersection of business, product, architecture, and hands-on execution. You will be expected to understand how the domain works in practice, identify the highest-leverage opportunities for automation, shape the solution, and drive it through to production. You will work in a small, high-ownership team where exceptional engineers can have disproportionate impact. This role requires advanced day-to-day use of AI and LLMs as part of exploring problems, evaluating solution paths, accelerating implementation, and designing automation systems.
              - heading "Key Responsibilities" [level=3] [ref=e50]
              - list [ref=e51]:
                - listitem [ref=e52]:
                  - strong [ref=e53]: Deep domain understanding
                  - text: Gain a deep understanding of your assigned domain (Tenant Find, Property Management, or Payments) and identify the highest-leverage opportunities for automation. Understand real operational workflows, including legacy processes, manual work, local exceptions, and agency-specific variations. Determine what should be standardized and what should remain flexible while designing robust, scalable solutions.
                - listitem [ref=e54]:
                  - strong [ref=e55]: Automation and AI-driven systems
                  - text: Design, implement, and maintain systems that automate manual processes across acquired agencies. Apply advanced AI and agentic techniques pragmatically to improve decision quality, operational efficiency, and team leverage. Ensure automation reduces operational load, improves reliability, and enhances business margins.
                - listitem [ref=e56]:
                  - strong [ref=e57]: Product and architectural collaboration
                  - text: Partner closely with product managers to frame problems, define solutions, and prioritize initiatives. Make architectural decisions grounded in operational reality rather than abstract models. Contribute to moving the system and the people around it toward better outcomes, balancing flexibility, scalability, and reliability.
                - listitem [ref=e58]:
                  - strong [ref=e59]: End-to-end ownership and impact
                  - text: Take full responsibility for outcomes, not just implementation. Deliver projects from concept to production rollout, continuously improving processes. Influence the overall direction of your domain, shape automation strategy, and materially improve business economics.
              - heading "Qualifications and Preferred Background" [level=3] [ref=e60]
              - list [ref=e61]:
                - listitem [ref=e62]: Strong engineering background with experience independently delivering complex systems from idea to production
                - listitem [ref=e63]: Solid experience with Node.js + TypeScript and React + TypeScript
                - listitem [ref=e64]: Familiarity with modern TypeScript patterns, tRPC, Drizzle, and SQL (MySQL/Postgres), or ability to ramp up quickly
                - listitem [ref=e65]: Ability to design architectures for fast-changing products with real operational constraints
                - listitem [ref=e66]: High autonomy, ownership, and comfort making decisions under ambiguity
                - listitem [ref=e67]: Product judgment and the ability to connect technical decisions to business outcomes
                - listitem [ref=e68]: Strong understanding of the modern AI landscape and agentic workflows, with pragmatic application beyond hype
                - listitem [ref=e69]: Experience in end-to-end delivery in domains with fragmented legacy workflows and operational complexity
                - listitem [ref=e70]: Strong communication skills and fluency in English
                - listitem [ref=e71]: Higher degree education
                - listitem [ref=e72]: "Startup mentality: resilience, adaptability, and ability to thrive in a fast-paced environment"
                - listitem [ref=e73]: "Customer-centric mindset: focus on delivering value to end-users or clients"
                - listitem [ref=e74]: Strong problem-solving skills – ability to approach challenges logically and propose practical solutions
              - heading "Compensation and benefits" [level=3] [ref=e75]
              - list [ref=e76]:
                - listitem [ref=e77]: The role is fully remote, providing flexibility and enabling seamless collaboration with our geographically distributed team
                - listitem [ref=e78]: Competitive salary with the potential for equity options based on performance, recognising exceptional contributions to our integration success
              - heading "What is it like being a Dwell-er" [level=3] [ref=e79]
              - paragraph [ref=e80]:
                - text: Feel free to check out
                - link:
                  - /url: https://docsend.com/view/7v8gwrjaky7mn895
                - link "Dwelly" [ref=e81] [cursor=pointer]:
                  - /url: https://himalayas.app/companies/dwelly
                - text: Core Principles. That’s about what we believe in, how we operate and make decisions
              - paragraph [ref=e82]: What we offer is not a fancy office or a static workplace. Instead, this is solving one of the world’s most complex problems in the largest consumer industry in the world (residential rentals), to improve the experience for over 30% of households (more than 5 million in the UK, and over 100 million including EU and US) that live in rental homes
              - paragraph [ref=e83]: This is about disrupting the largest, most antiquated industry in the world, with one of the strongest operational and technical teams that exist in the UK and the EU. We work hard, and we shoot for extremely ambitious results. But we want people to be proud of what they’ve built and be able to look back and say one day “hell yeah, that was me that did it all”
              - list [ref=e84]:
                - listitem [ref=e85]: Customer obsession rather than competitive focus
                - listitem [ref=e86]: Passion for invention
                - listitem [ref=e87]: Operational excellence
                - listitem [ref=e88]: Long-term thinking
              - paragraph [ref=e90]: By applying for this position, you consent to the processing and storage of your personal data for recruitment purposes for up to 365 days, in accordance with our data retention policy and applicable data protection laws.
