                  - paragraph [ref=f74e410]: You can enjoy a hybrid working environment, across all of our locations. Fully remote options may be available for some roles.
                  - paragraph [ref=f74e411]: Work from anywhere! Mix it up a little and work from a different place, even abroad, for a designated time each fiscal year.
