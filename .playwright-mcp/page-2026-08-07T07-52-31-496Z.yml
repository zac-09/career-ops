          - paragraph [ref=f74e363]: Contentsquare’s company mission is reflected in our employee commitment to create an environment where everyone, everywhere, has an experience they love, seek, and deserve. We understand that the kaleidoscope of unique backgrounds, experiences, cultures, knowledge, skills, and self expression combines to provide the richest and most successful company culture possible. We want to celebrate you as an individual.
          - paragraph [ref=f74e364]: We work hard so you’ll feel safe to be yourself, take part in your team, and feel supported to do your best work. We want you to feel welcome and included on day 1, and every day after. And we want to be the best we can be as a responsible company too—that’s why we’re dedicated to continuously learning and growing.
          - paragraph [ref=f74e365]:
