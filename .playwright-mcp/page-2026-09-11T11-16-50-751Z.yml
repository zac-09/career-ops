      - heading "Full Stack AI Engineer (Back-end leaning)" [level=1] [ref=f61e18]
      - generic [ref=f61e19]:
        - generic [ref=f61e20]: Remote
        - generic [ref=f61e24]: Full time
      - list [ref=f61e28]:
        - listitem [ref=f61e29]: TypeScript
        - listitem [ref=f61e30]: Node.js
        - listitem [ref=f61e31]: Postgres
        - listitem [ref=f61e32]: Drizzle
        - listitem [ref=f61e33]: AI SDK
        - listitem [ref=f61e34]: Vercel
      - generic [ref=f61e35]:
        - heading "About the role" [level=2] [ref=f61e36]
        - paragraph [ref=f61e37]: Behind every report is a pipeline that searches the open web, reads what it finds, extracts candidate questions, grades each one by the strength of its evidence, and throws away the rest. It runs for minutes, costs real money per run, and has to produce something defensible at the end or we refund the credit.
        - paragraph [ref=f61e38]: This role owns that pipeline. You will work on retrieval quality, prompt and schema design, the grading logic that decides whether a question is evidence-backed or merely inferred, the budget tracker that stops a run before it burns a customer's balance, and the job infrastructure that will move this work off the request path.
        - paragraph [ref=f61e39]: Back-end leaning means the centre of gravity, not the boundary. You will still open React files, because a pipeline change that nobody can see in the report is not finished.
      - generic [ref=f61e40]:
        - heading "What you will do" [level=2] [ref=f61e41]
        - list [ref=f61e42]:
          - listitem [ref=f61e43]: "Own the research pipeline end to end: search, extraction, grading, caching, and the report artefact it produces."
          - listitem [ref=f61e44]: Improve output quality with evaluations rather than vibes. Build the harness if we do not have the one you need.
          - listitem [ref=f61e45]: "Keep cost per run predictable: budget tracking, model selection, caching, and hard stops that fire before the money is gone."
          - listitem [ref=f61e46]: Move long-running work onto a durable queue with retries, idempotency, and cancellation that actually cancels.
          - listitem [ref=f61e47]: Design and migrate the Postgres schema, and keep migrations safe to run against production traffic.
          - listitem [ref=f61e48]: Build and maintain the credits ledger, payment webhooks, and the reconciliation that catches it when they disagree.
          - listitem [ref=f61e49]: Instrument everything. When a run degrades at two in the morning, the logs should already answer why.
      - generic [ref=f61e50]:
        - heading "What we are looking for" [level=2] [ref=f61e51]
        - list [ref=f61e52]:
          - listitem [ref=f61e53]: Four or more years building backend systems in TypeScript or another strongly typed language, including operating them in production.
          - listitem [ref=f61e54]: "Deep SQL and relational modelling: indexes, transactions, and what happens under concurrent writes."
          - listitem [ref=f61e55]: You have built something on top of an LLM API that had to be correct, not just impressive in a demo, and you can explain how you measured it.
          - listitem [ref=f61e56]: Practical experience with queues, retries, idempotency keys, and the failure modes of distributed work.
          - listitem [ref=f61e57]: A habit of writing tests for the paths that touch money or data integrity.
          - listitem [ref=f61e58]: Comfort in a codebase where you are also expected to change the front end when the feature needs it.
      - generic [ref=f61e59]:
        - heading "Nice to have" [level=2] [ref=f61e60]
        - list [ref=f61e61]:
          - listitem [ref=f61e62]: Experience with retrieval, ranking, or search relevance.
          - listitem [ref=f61e63]: You have run evaluation suites for a generative system and made a real quality call from the results.
          - listitem [ref=f61e64]: Familiarity with Drizzle, serverless Postgres and connection pooling, or Vercel's runtime model.
          - listitem [ref=f61e65]: Payments experience, especially the webhook and refund side.
      - generic [ref=f61e66]:
        - heading "How the process runs" [level=2] [ref=f61e67]
        - list [ref=f61e68]:
          - listitem [ref=f61e69]: Intro call, thirty minutes, with the founder.
          - listitem [ref=f61e70]: A paid take-home you can finish in a focused afternoon, built on the real stack.
          - listitem [ref=f61e71]: A ninety minute systems conversation about the pipeline and how you would change it.
          - listitem [ref=f61e72]: A final conversation about scope, money, and what the first ninety days look like.
