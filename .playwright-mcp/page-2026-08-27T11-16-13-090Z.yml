      - generic [ref=f122e19]:
        - paragraph [ref=f122e20]: Polycentric is an open-source distributed social network that lets users own their identity. The app gives communities a place to gather, post, and converse across a network of independent servers, with no single entity in control of the conversation. Polycentric gives users full sovereignty over their data, identity, and reach.
        - paragraph [ref=f122e21]: The application is built on a distributed protocol where users choose which servers to interact through. Core features include self-sovereign cryptographic identity, community-centric topic feeds, censorship-resistant publishing, ownership of your own likes and follows, and cross-platform identity linking.
        - paragraph [ref=f122e22]: We are looking for a Senior React Native Developer to help us with the upcoming launch of Polycentric.
        - heading "Responsibilities" [level=2] [ref=f122e23]
        - list [ref=f122e24]:
          - listitem [ref=f122e25]: Contribute to the development, architecture, and ongoing maintenance of Polycentric's mobile and web applications
          - listitem [ref=f122e26]: Design and implement new features and product enhancements in collaboration with a distributed team
          - listitem [ref=f122e27]: Participate in technical discussions, shaping system design and frontend architecture
          - listitem [ref=f122e28]: Engage with and contribute to the wider open-source community around Polycentric
        - heading "Qualifications" [level=2] [ref=f122e29]
        - list [ref=f122e30]:
          - listitem [ref=f122e31]: 3+ years of experience with React Native in a production environment
          - listitem [ref=f122e32]: Proven ability to work autonomously in a remote, asynchronous team
          - listitem [ref=f122e33]: Solid understanding of modern application architecture and state management
          - listitem [ref=f122e34]: Interest in decentralized systems and emerging technologies
          - listitem [ref=f122e35]: Familiarity with cryptographic concepts such as signing, verification, and key management
        - heading "Desirable" [level=2] [ref=f122e36]
        - list [ref=f122e37]:
          - listitem [ref=f122e38]: Experience with Rust in production systems
          - listitem [ref=f122e39]: Knowledge of relational databases (e.g. PostgreSQL) and query optimisation
          - listitem [ref=f122e40]: Experience with search/indexing technologies (e.g. Elasticsearch, OpenSearch)
          - listitem [ref=f122e41]: Familiarity with cloud infrastructure and deployment workflows
