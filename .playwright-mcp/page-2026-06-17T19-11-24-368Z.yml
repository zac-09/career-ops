        - separator [ref=e325]
        - heading "Beware of job scammers" [level=3] [ref=e326]
        - generic [ref=e328]:
          - paragraph [ref=e329]:
            - text: We’ve recently learned that some people have been contacted by scammers pretending to be part of the Automattic hiring team, using names like “Caelia Bassett.” Please know that this individual is
            - emphasis [ref=e330]: not
            - text: connected to us.
          - paragraph [ref=e331]:
            - text: Our hiring process happens
            - emphasis [ref=e332]: only
            - text: "through our official careers page:"
            - link "automattic.com/work-with-us/" [ref=e333] [cursor=pointer]:
              - /url: https://automattic.com/work-with-us/
            - text: . You’ll always receive messages from us using an
            - link "@automattic" [ref=e334] [cursor=pointer]:
              - /url: https://automattic.wordpress.com/mentions/automattic/
            - text: .com email address.
          - paragraph [ref=e335]: If someone reaches out claiming to be from Automattic but uses a different email domain, take a moment to verify their identity. Scams like these can look very real, so it’s always okay to double-check!
          - paragraph [ref=e336]:
            - text: Here’s
            - link "a helpful guide offering more tips on how to spot and avoid scams" [ref=e337] [cursor=pointer]:
              - /url: https://consumer.ftc.gov/consumer-alerts/2023/08/scammers-impersonate-well-known-companies-recruit-fake-jobs-linkedin-and-other-job-platforms
            - text: .
          - paragraph [ref=e338]: Stay safe out there, everyone!
