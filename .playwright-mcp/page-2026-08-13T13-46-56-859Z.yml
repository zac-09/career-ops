                - listitem [ref=f559e31]: Ability to engineer simple and elegant solutions to challenging problems.
                - listitem [ref=f559e32]: Ability to design and engineer secure RESTful APIs.
                - listitem [ref=f559e33]: Estimating and tracking tasks using Agile methodologies.
                - listitem [ref=f559e34]: Enthusiastic about learning and applying new cutting-edge technologies.
                - listitem [ref=f559e35]: Taking ownership of your own work.
