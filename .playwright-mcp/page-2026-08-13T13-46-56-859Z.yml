              - heading "Join the Utility Team!" [level=1] [ref=f559e21]
              - paragraph [ref=f559e22]: Utility is an end-to-end mobile app and digital platform agency, focused on designing and engineering innovative, transformative technology. Our clients are premier global brands and new ventures across the wellness, fitness, entertainment, streaming, and educational spaces. Founded by digital leaders from companies like Major League Baseball and McCann Erickson, Utility is built by folks who have been on the other side of the table. We treat every project as if it were our own, from startup ventures to blue-chip brands.
              - heading "What You'll Do" [level=1] [ref=f559e23]
              - paragraph [ref=f559e24]: Senior Backend Engineers are key members of our engineering team, building the back-end services and infrastructure essential to our client’s products. Over time, we expect you to grow by learning and practicing technical ownership, promoting best practices in coding and architecture, collaborating with and mentoring other members of the engineering team, and becoming a vocal advocate of our engineering-forward culture.
              - paragraph [ref=f559e25]: Our clients rely on us to build and grow their businesses and we are committed to building fast and scalable products that people love, all while using best practices and the latest technologies.
