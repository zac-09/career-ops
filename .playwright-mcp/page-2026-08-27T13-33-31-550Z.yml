        - generic [ref=f147e18]:
          - strong [ref=f147e20]: About the role
          - paragraph [ref=f147e21]: In this role, you’ll be responsible for developing microservices in a distributed deployment environment with an emphasis on containerisation with Docker and K8S. You won’t just be writing simple CRUD applications, but instead will be working on the core logic of complex systems that are accessed millions of times a day. We wrote our system from scratch about 3 years ago, so you’ll be working with the latest technology and won’t have to worry about decades old legacy code.A willingness to work in Springboot is fine - as long as you are willing to learn and have demonstrable experience in an object-oriented programming language.
          - strong [ref=f147e23]: Our Stack (we don't expect you to have all of these)
          - list [ref=f147e24]:
            - listitem [ref=f147e25]: "Language: Java 17Frameworks: Spring Boot (Tomcat, Netty), Spring Data, Spring Cloud"
            - listitem [ref=f147e26]: "Architecture: Microservices, REST API, Message Queues"
            - listitem [ref=f147e27]: "Database: MySQL, MyBatis, ShardingSphere, MongoDB"
            - listitem [ref=f147e28]: "Caching: Redis (AWS ElastiCache), ElasticSearch"
            - listitem [ref=f147e29]: "Message Queue: RocketMQCloud: Docker, Kubernetes, AWS"
            - listitem [ref=f147e30]: "Monitoring: Grafana, Prometheus, Loki, Tempo, AWS CloudWatch"
          - generic [ref=f147e31]:
            - strong [ref=f147e32]: What you'll be doing
            - list [ref=f147e33]:
              - listitem [ref=f147e34]: Develop highly-scalable mobile internet backends for millions of users
              - listitem [ref=f147e35]: Work with Product Owners and other development team members to determine new features and user stories needed in new / revised applications or large/complex development projects
              - listitem [ref=f147e36]: Participate in code reviews with peers and managers to ensure that each increment adheres to original vision as described in the user story and all standard resource libraries and architecture patterns as appropriateRespond to support calls for applications in production for quick diagnosis and repair to keep things running smoothly for users
              - listitem [ref=f147e37]: Participate in all team ceremonies including planning, grooming, product demonstration and team retrospectivesMentoring less experienced team members
              - listitem [ref=f147e38]: Potential On-Call responsibilities depending on team and tenure
            - strong [ref=f147e40]: What you'll bring
            - list [ref=f147e41]:
              - listitem [ref=f147e42]: Minimum of 6+ Years within a relevant rolePreferred experience in Spring Boot, Spring Cloud, Spring Data and iBATIS
              - listitem [ref=f147e43]: Strong experience with highly-scalable web backends
              - listitem [ref=f147e44]: Experience designing highly transactional systems
              - listitem [ref=f147e45]: Advanced proficiency in Object Oriented Design (OOD) and analysis
              - listitem [ref=f147e46]: Advanced proficiency in application of analysis / design engineering functionsAdvanced proficiency in application of non-functional software qualities such as resiliency and maintainability
              - listitem [ref=f147e47]: Advanced proficiency in modern behavior-driven testing techniquesDeep understanding of Microservices
              - listitem [ref=f147e48]: Proficient in SQLExpert knowledge of application development with technologies like RabbitMQ, MySQL, Redis etc
              - listitem [ref=f147e49]: Strong experience with container and cloud solutions such as Docker, Kubernetes and AWS Cloud
              - listitem [ref=f147e50]: An ability to work independently
              - listitem [ref=f147e51]: Excellent communication skills in English
            - strong [ref=f147e53]: What’s in it for you
          - list [ref=f147e54]:
            - listitem [ref=f147e55]: Sporty is a remote first company in pursuit of sustainability
            - listitem [ref=f147e56]: A competitive salary + individual performance based bonuses every quarter
            - listitem [ref=f147e57]: 28 days paid annual leave
            - listitem [ref=f147e58]: Our core working hours are 10am-3pm in your local time zone with flexibility outside of this
            - listitem [ref=f147e59]: Referral bonuses & flash bonuses
            - listitem [ref=f147e60]: Top of the line equipment
            - listitem [ref=f147e61]: Annual company retreats to provide great internal networking opportunities
          - paragraph [ref=f147e62]:
            - strong [ref=f147e63]: Interview Process
          - list [ref=f147e64]:
            - listitem [ref=f147e65]: Remote video screening with our Talent Acquisition Team
            - listitem [ref=f147e66]: Offline Take home assignment
            - listitem [ref=f147e67]: Remote video interview with Team Members (60 Mins)
            - listitem [ref=f147e68]: Final discussion with the hiring manager (60 mins)
          - paragraph [ref=f147e69]: If you're interested, we encourage you to apply! Every application is reviewed by a member of our team (AI is not used in our recruitment process), and we aim to respond within 48 hours.
