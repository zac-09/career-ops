            - paragraph [ref=e36]:
              - strong [ref=e37]: About Owner
              - text: Owner is the AI-native system local business owners use to succeed, starting with restaurants.
              - text: We’re building the system that replaces the many tools owners use to run their business.
              - text: It powers everything from the restaurant’s website, online ordering, CRM, POS, and more.
            - paragraph [ref=e38]
            - paragraph [ref=e39]:
              - strong [ref=e40]: Product philosophy
              - text: "Most small business software makes owners do the work to get what they want: sales growth and profit growth. Owner does the work for them agentically."
              - text: Our system drives demand, converts it, and helps operators run their business day to day. As it improves, the business improves with it.
              - text: Using Owner should feel like having a team of great operators, engineers, and marketers working for you.
            - paragraph [ref=e41]
            - paragraph [ref=e42]:
              - strong [ref=e43]: Our vision
            - paragraph [ref=e44]
            - paragraph [ref=e45]: We’re starting by helping independent restaurants succeed online.
            - paragraph [ref=e46]
            - paragraph [ref=e47]: But it’s not just restaurants that need our help. Most local businesses are struggling with these same problems. Huge technology corporations are taking their customers, bleeding their profits, and making it hard for them to survive.
            - paragraph [ref=e48]
            - paragraph [ref=e49]: Once we nail the solution for restaurants – we’ll scale it into every other local business type.
            - paragraph [ref=e50]
            - paragraph [ref=e51]: In the future we envision, tens of millions of local business owners will use our technology to succeed in the digital age.
