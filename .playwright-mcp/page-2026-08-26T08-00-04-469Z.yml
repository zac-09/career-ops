        - generic [ref=f30e15]:
          - heading [level=2] [ref=f30e16]:
            - strong [ref=f30e17]: Platform Engineer
          - paragraph [ref=f30e18]:
            - text: "Are you the kind of engineer who sees a cluster not as plumbing but as the foundation on which real lives depend? At Sand, you'll own the Kubernetes platform that ministries of health use to make decisions for millions of people. It's expanding country by country: a growing fleet that spans managed cloud and self-managed, sovereign on-premises clusters, because where health data must live is the law, not a preference. Every new deployment is a fresh reliability problem, not a copy-paste when a cluster wobbles, a health worker loses the data they need. You'll automate relentlessly, codify everything with GitOps, and maintain a single operating standard across the whole estate. If you're as curious about the lives behind the systems as you are about the systems themselves, this is your foundation to build on."
            - strong [ref=f30e19]:
              - emphasis [ref=f30e20]
          - heading [level=2] [ref=f30e21]:
            - strong [ref=f30e22]: About Sand
          - paragraph [ref=f30e23]:
            - link "Sand Technologies" [ref=f30e24] [cursor=pointer]:
              - /url: https://www.sandtech.com/
            - text: is a global Physical AI company using data and AI to make critical industries work better. We partner with governments, cities, and enterprises to improve how essential systems operate across healthcare, water, energy, telecommunications, and infrastructure.
          - paragraph [ref=f30e25]: Our work delivers proven real-world impact. We have built AI systems that help manage London’s water supply, supported telecom network planning across hundreds of cities, and developed digital healthcare platforms serving tens of millions of people across Africa. From intelligent command centers to AI-powered infrastructure platforms, we help organizations sense, analyze, and act in complex environments.
          - paragraph [ref=f30e26]: Our people are ambitious, curious, and relentlessly practical. Our teams work alongside clients in the field, solving hard problems and deploying solutions that last. With colleagues across Africa, Europe, the UK, and the US, we operate across the full stack - from research and engineering to deployment and capability building.
          - paragraph [ref=f30e27]: "Our mission is simple: to harness AI to solve humanity’s most pressing challenges."
          - heading [level=2] [ref=f30e28]:
            - strong [ref=f30e29]: About the role
          - paragraph [ref=f30e30]: As our platforms scale across industries and deployment environments, we’re looking for a Platform Engineer who lives and breathes Kubernetes. You’ll own the foundations that everything else at Sand runs on — designing, operating, and hardening the clusters, pipelines, and reliability practices that let our product and delivery teams ship critical systems with confidence.
          - paragraph [ref=f30e31]: This is a deeply hands-on site reliability role. You’ll work across managed cloud Kubernetes and self-managed on-premises clusters, treat infrastructure as code, automate relentlessly through GitOps, and build the observability and operational discipline that keeps mission-critical workloads healthy.
          - heading [level=2] [ref=f30e32]:
            - strong [ref=f30e33]: What you’ll do
          - list [ref=f30e34]:
            - listitem [ref=f30e35]:
              - strong [ref=f30e36]: "Kubernetes platform ownership:"
              - text: Design, deploy, and operate production Kubernetes clusters across AWS EKS and on-premises / bare-metal environments — owning cluster lifecycle, upgrades, multi-cluster topology, RBAC, networking, ingress, storage, and workload security.
            - listitem [ref=f30e37]:
              - strong [ref=f30e38]: "Platform engineering:"
              - text: Build golden paths and self-service capabilities — Helm charts, operators/CRDs, reusable manifests, and internal tooling — that make it fast and safe for product and delivery teams to ship onto the platform.
            - listitem [ref=f30e39]:
              - strong [ref=f30e40]: "GitOps & automation:"
              - text: Implement declarative, GitOps-driven delivery (Argo CD / Flux) and treat all infrastructure as code so environments are reproducible, auditable, and recoverable.
            - listitem [ref=f30e41]:
              - strong [ref=f30e42]: "Reliability & SRE:"
              - text: Define SLOs and error budgets, lead incident response and blameless post-mortems, drive capacity and autoscaling strategy, and continuously improve the resilience and security posture of critical workloads.
            - listitem [ref=f30e43]:
              - strong [ref=f30e44]: "Observability:"
              - text: Build and own monitoring, logging, tracing, and alerting (Prometheus, Grafana, OpenTelemetry, and similar) so the health of every deployed system is clear and actionable.
            - listitem [ref=f30e45]:
              - strong [ref=f30e46]: "CI/CD pipelines:"
              - text: Develop and maintain CI/CD pipelines that streamline build, test, and deployment across services and environments.
            - listitem [ref=f30e47]:
              - strong [ref=f30e48]: "R&D and problem-solving:"
              - text: Investigate infrastructure-level challenges, prototype solutions, and bring them into production.
            - listitem [ref=f30e49]:
              - strong [ref=f30e50]: "Debugging & issue resolution:"
              - text: Troubleshoot and resolve infrastructure, networking, and cluster issues promptly to protect system integrity and performance.
          - heading [level=2] [ref=f30e51]:
            - strong [ref=f30e52]: Who you are
          - list [ref=f30e53]:
            - listitem [ref=f30e54]: Bachelor’s or Master’s degree in Computer Science, Information Technology, or a related field — or equivalent practical experience.
            - listitem [ref=f30e55]: Minimum of 5 years in cloud/platform engineering, with significant hands-on time operating Kubernetes in production.
            - listitem [ref=f30e56]: Proven track record of designing and running scalable, secure, and reliable cloud- and container-based platforms.
            - listitem [ref=f30e57]: Experience managing on-premise and bare-metal deployments of Kubernetes clusters.
            - listitem [ref=f30e58]: Excellent problem-solving skills, with the ability to research deeply and develop innovative solutions to complex infrastructure challenges.
            - listitem [ref=f30e59]: Strong communication skills and a genuine ability to collaborate across cross-functional, distributed teams.
            - listitem [ref=f30e60]:
              - strong [ref=f30e61]: Willingness to travel across the African continent to support our in-country teams when needed.
          - heading [level=2] [ref=f30e62]:
            - strong [ref=f30e63]: How we work
          - paragraph [ref=f30e64]: Due to the highly collaborative and internationally distributed nature of our work, successful candidates must be comfortable operating in small teams while contributing to larger, globally coordinated efforts. A strong sense of ownership, self-motivation and discipline in maintaining clear and consistent communication through virtual collaboration tools and video conferencing is essential.
          - paragraph [ref=f30e65]
