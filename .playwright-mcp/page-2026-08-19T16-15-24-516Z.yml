                - paragraph [ref=f6e24]:
                  - emphasis [ref=f6e26]: We are one of the first work-from-anywhere companies with 2,000+ team members utilizing our virtual office called eXp World. This role is work-from-anywhere in Canada.
                - paragraph [ref=f6e27]
                - paragraph [ref=f6e28]:
                  - strong [ref=f6e30]: Who is eXp?
                - paragraph [ref=f6e31]: Doing the audacious is part of eXp Realty’s DNA. We are a company that rewards creative minds who can offer bold solutions, where opinions matter, anything is possible and the outcome can be revolutionary. As a global full-service real estate brokerage utilizing a 3-D, fully immersive, cloud office environment, offering 24/7 access to collaborative tools & training, eXp has broken the traditional mold of real estate. We are doing big things. Come join us!
              - generic [ref=f6e32]:
                - paragraph [ref=f6e33]
                - paragraph [ref=f6e34]:
                  - strong [ref=f6e36]: "What you will do:"
                - paragraph [ref=f6e37]: We are seeking a talented Full-Stack Software Engineer with strong experience in React and TypeScript on the frontend and Node.js on the backend, with Python as an asset. You are passionate about building high-quality, scalable products and delivering exceptional user experiences.
                - paragraph [ref=f6e38]
                - paragraph [ref=f6e39]: In this role, you will design and develop end-to-end solutions across the stack, from intuitive user interfaces to performant backend services and cloud integrations. You will help simplify the real estate journey by building ambitious products and features that serve users across multiple markets.
                - paragraph [ref=f6e40]
                - paragraph [ref=f6e41]: Working closely with product, design, and engineering teams, you will play a key role in shaping architecture, implementing robust APIs, integrating AWS services such as S3, messaging queues, and relational databases, and ensuring our applications are secure, reliable, and built to scale.
                - paragraph [ref=f6e42]
                - paragraph [ref=f6e43]:
                  - strong [ref=f6e45]: "How you will make an impact:"
                - list [ref=f6e46]:
                  - listitem [ref=f6e47]: Design, develop, and maintain features in our Next.js and React web applications, focusing on usability, performance, and scalability.
                  - listitem [ref=f6e48]: Build and enhance backend services and APIs using Node.js and TypeScript, with Python as an asset.
                  - listitem [ref=f6e49]: Maintain a strong functional understanding of AWS environments - Specifically S3, messaging queues, Secrets Manager, and SQL databases to support service development within a DevOps-led deployment model.
                  - listitem [ref=f6e50]: Collaborate with cross-functional teams to deliver end-to-end solutions, from frontend interfaces to backend services and integrations.
                  - listitem [ref=f6e51]: Implement vertical story tickets and contribute to new functionality across web and, where applicable, mobile platforms.
                  - listitem [ref=f6e52]: Write clean, testable, observable, and maintainable code following industry best practices.
                  - listitem [ref=f6e53]: Participate in code reviews, technical design discussions, and architectural decision-making.
                  - listitem [ref=f6e54]: Work closely with engineering leadership and senior peers to align technical execution with business objectives.
                  - listitem [ref=f6e55]: Contribute to operational excellence, including monitoring, performance tuning, and incident response.
                  - listitem [ref=f6e56]: Perform other duties as assigned.
                - paragraph [ref=f6e57]
                - paragraph [ref=f6e58]:
                  - strong [ref=f6e60]: "How you will grab our attention:"
                - list [ref=f6e61]:
                  - listitem [ref=f6e62]: Bachelor’s degree in Computer Science, Engineering, or a related field, or equivalent practical experience.
                  - listitem [ref=f6e63]: 5+ years of professional software development experience, with strong full-stack exposure.
                  - listitem [ref=f6e64]: Proven experience building backend services and APIs using Node.js and TypeScript, with Python as an asset.
                  - listitem [ref=f6e65]: Strong experience developing modern web applications using React and/or Next.js.
                  - listitem [ref=f6e66]: Solid understanding of JavaScript and TypeScript for building interactive, maintainable user interfaces.
                  - listitem [ref=f6e67]: Hands-on experience working with relational databases such as PostgreSQL, MySQL, or MariaDB.
                  - listitem [ref=f6e68]: Demonstrated experience designing and implementing HTTP-based APIs.
                  - listitem [ref=f6e69]: Strong understanding of API design best practices, including RESTful and hybrid approaches.
                  - listitem [ref=f6e70]: Experience building, deploying, and supporting production-grade systems.
                  - listitem [ref=f6e71]: Demonstrated ability to take ownership, collaborate effectively, and deliver high-impact projects.
                  - listitem [ref=f6e72]: High attention to detail, strong problem-solving skills, and a passion for continuous learning across the technology stack.
                  - listitem [ref=f6e73]: Familiarity with search and indexing platforms such as Elasticsearch.
                  - listitem [ref=f6e74]: Experience working with cloud platforms, particularly AWS (S3, messaging, secrets management, serverless).
                  - listitem [ref=f6e75]: Exposure to containerization and orchestration technologies, including Docker and Kubernetes.
                  - listitem [ref=f6e76]: Experience with serverless architectures (for example, AWS Lambda).
                  - listitem [ref=f6e77]: Familiarity with authentication and authorization standards such as OAuth.
                  - listitem [ref=f6e78]: Experience with CI/CD tools and workflows, including Jenkins and GitHub Actions.
                  - listitem [ref=f6e79]: Knowledge of observability, monitoring, and performance tooling.
                  - listitem [ref=f6e80]: Demonstrated full-stack development experience across web and, where applicable, mobile platforms.
                - paragraph [ref=f6e81]
                - paragraph [ref=f6e82]:
                  - emphasis [ref=f6e84]: If you think you’d make a great match for this position but don’t meet all the requirements, we would still encourage you to apply!
