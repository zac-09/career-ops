    - generic [ref=e92]:
      - heading "Our transparent application process" [level=2] [ref=e93]
      - list [ref=e94]:
        - listitem [ref=e95]:
          - paragraph [ref=e96]:
            - strong [ref=e97]: "Submit your application:"
            - text: Start by filling out the online application and responding to the longer-form questions. We encourage you to explore
            - link "our blog" [ref=e98] [cursor=pointer]:
              - /url: /how-we-work/
            - text: to get a feel for our company, values, and products. We carefully review and respond to every candidate’s application.
        - listitem [ref=e99]:
          - paragraph [ref=e100]:
            - strong [ref=e101]: "Interviews, salary transparency, and task assignment:"
            - text: If your application moves forward, you’ll hear from us via
            - link "careers@doist.com" [ref=e102] [cursor=pointer]:
              - /url: mailto:careers@doist.com
            - text: to schedule your first interview over Google Meet. At the same time, we’ll share the proposed salary range for the role, calculated using our formula-based compensation model. Salaries are benchmarked to industry data and adjusted for your location, so you can decide early on whether it’s a fit.
            - text: The rest of the process may include additional interviews and a task assignment, depending on the role. We vary the sequence to fit the scope and team, but you’ll always have a chance to showcase your skills and get a clear picture of the work, the team, and our values.
        - listitem [ref=e103]:
          - paragraph [ref=e104]:
            - strong [ref=e105]: "Reference and background check:"
            - text: Before we make an offer, we’ll conduct reference checks to better understand how you work and what strengths you bring. We also run background checks as part of our process, both to meet compliance requirements and to help ensure a safe, trusted environment for everyone. We’ll always let you know before either step begins.
        - listitem [ref=e106]:
          - paragraph [ref=e107]:
            - strong [ref=e108]: "Decision:"
            - text: Once all steps are complete, the hiring committee will make a final decision. If we move forward, you’ll receive an official offer to join the team. Either way, you’ll hear from us via
            - link "careers@doist.com" [ref=e109] [cursor=pointer]:
              - /url: mailto:careers@doist.com
            - text: . We never leave candidates hanging.
        - listitem [ref=e110]:
          - paragraph [ref=e111]:
            - strong [ref=e112]: "Onboarding and mentorship:"
            - text: Before your first day, you’ll get access to a carefully curated Todoist project that maps out your onboarding journey. You’ll also be paired with a mentor and have the chance to co-work in person with them for a week, wherever they’re based. It’s our way of making sure you feel connected, supported, and set up to thrive.
