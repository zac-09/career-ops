        - generic [ref=f63e20]:
          - paragraph [ref=f63e21]:
            - strong [ref=f63e22]: About the role
          - paragraph [ref=f63e23]: As a Data Engineer at Sporty, you will play a critical role in ensuring the smooth processing and handling of data for our machine learning and data science initiatives. Your primary responsibilities will include designing, building, testing, optimising, and maintaining data pipelines and architectures for various aspects of our rapidly growing business.
          - paragraph [ref=f63e24]:
            - strong [ref=f63e25]: What you'll be doing
          - list [ref=f63e26]:
            - listitem [ref=f63e27]: Design, develop and maintain scalable batch ETL and near-real-time data pipelines and architectures for various parts of our business, on fast and versatile data sources with millions of changes per day
            - listitem [ref=f63e28]: Ensure all data provided is of the highest quality, accuracy, and consistency
            - listitem [ref=f63e29]: Identify, design, and implement internal process improvements for optimising data delivery and re-designing infrastructure for greater scalabilit
            - listitem [ref=f63e30]: Builds out new API integrations to support continuing increases in data volume and complexity
            - listitem [ref=f63e31]: Communicate with data scientist, MLOps engineers, product owners and BI analysts in order to understand business processes and system architecture for specific product features
          - paragraph [ref=f63e32]:
            - strong [ref=f63e33]: What you'll bring
          - list [ref=f63e34]:
            - listitem [ref=f63e35]: Bachelor’s degree, or equivalent experience, in Computer Science, Engineering, Mathematics, or a related technical field
            - listitem [ref=f63e36]: 3+ years of experience in data engineering, data platforms, BI or related domain
            - listitem [ref=f63e37]: Experience in successfully implementing data-centric applications, such as data warehouses, operational data stores, and data integration projects
            - listitem [ref=f63e38]: Experience with large-scale production relational and NoSQL databases
            - listitem [ref=f63e39]: Experience with data modelling
            - listitem [ref=f63e40]: General understanding of data architectures and event-driven architectures
            - listitem [ref=f63e41]: Proficient in SQL
            - listitem [ref=f63e42]: Familiarity with one scripting language, preferably Python
            - listitem [ref=f63e43]: Experience with Apache Airflow & Apache Spark
            - listitem [ref=f63e44]: "Solid understanding of cloud data services: AWS services such as S3, Athena, EC2, RedShift, EMR (Elastic MapReduce), EKS, RDS (Relational Database Services) and Lambda"
          - strong [ref=f63e46]: Even better if
          - list [ref=f63e47]:
            - listitem [ref=f63e48]: Understanding of ML Models
            - listitem [ref=f63e49]: Understanding of containerisation and orchestration technologies like Docker/Kubernetes
            - listitem [ref=f63e50]: Relevant knowledge or experience in the gaming industry
          - paragraph [ref=f63e51]:
            - strong [ref=f63e52]: What's in it for you
          - list [ref=f63e53]:
            - listitem [ref=f63e54]: Sporty is a remote first company in pursuit of sustainability
            - listitem [ref=f63e55]: A competitive salary + individual performance based bonuses every quarter
            - listitem [ref=f63e56]: 28 days paid annual leave
            - listitem [ref=f63e57]: Our core working hours are 10am-3pm in your local time zone with flexibility outside of this
            - listitem [ref=f63e58]: Referral bonuses & flash bonuses
            - listitem [ref=f63e59]: Top of the line equipment
            - listitem [ref=f63e60]: Annual company retreats to provide great internal networking opportunities
          - paragraph [ref=f63e61]:
            - strong [ref=f63e62]: Interview Process
          - list [ref=f63e63]:
            - listitem [ref=f63e64]: Remote video screening with our Talent Acquisition Team
            - listitem [ref=f63e65]: Offline Take home assignment
            - listitem [ref=f63e66]: Remote video interview with Team Members (90 Mins)
          - generic [ref=f63e77]:
            - paragraph [ref=f63e78]: If you're interested, we encourage you to apply! Every application is reviewed by a member of our team (AI is not used in our recruitment process), and we aim to respond within 48 hours.
            - paragraph [ref=f63e79]: "*We are committed to maintaining a fair, secure and authentic recruitment process. Applications submitted using false, misleading or fraudulent information, including impersonated or fake profiles, will not be considered. Where reasonably necessary to protect the integrity and security of our recruitment process, we may verify a candidate’s identity and/or the accuracy of information provided during the recruitment process. Any such checks will be carried out in a proportionate and appropriate manner and in accordance with applicable data protection and employment laws."
