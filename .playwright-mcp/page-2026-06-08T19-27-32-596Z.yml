            - paragraph [ref=e37]:
              - text: WordPress doesn’t try to keep its users inside walled gardens, a rare thing in a world that is dangerously moving away from the open web. Instead, WordPress gives them the freedom to build a business website, an online store, or a personal blog – the way they like it. Big sites or small, using the community-run
              - link "open source project" [ref=e38] [cursor=pointer]:
                - /url: https://wordpress.org/
              - text: or Automattic’s
              - link "WordPress.com" [ref=e39] [cursor=pointer]:
                - /url: https://wordpress.com/
              - text: ", vanilla or customized with hundreds of plugins, WordPress users always get to own and control their data, their expression, and their freedom."
            - paragraph [ref=e40]: We’re always looking for talented and experienced engineers worldwide, excited to help Automattic’s product ecosystem, and join our mission to make the web a better place.
            - paragraph [ref=e41]:
              - strong [ref=e42]: What have we worked on recently?
            - list [ref=e43]:
              - listitem [ref=e44]:
                - text: AI is at the heart of many
                - link "new product developments" [ref=e45] [cursor=pointer]:
                  - /url: https://wordpress.com/ai-website-builder/
                - text: and powers a lot of our day-to-day development workflows.
              - listitem [ref=e46]:
                - link "WooCommerce" [ref=e47] [cursor=pointer]:
                  - /url: https://woocommerce.com/
                - text: is the most popular and most flexible e-commerce platform on the web. We’re working tirelessly on giving you all the control, while keeping the platform fast and stable.
              - listitem [ref=e48]:
                - link "Gutenberg" [ref=e49] [cursor=pointer]:
                  - /url: https://wordpress.org/gutenberg/
                - text: is a new block-level editor for WordPress with clean abstractions for users, too, not just developers.
              - listitem [ref=e50]:
                - link "Tumblr" [ref=e51] [cursor=pointer]:
                  - /url: https://www.tumblr.com
                - text: is a microblogging social network where users create, share, and follow what they love.
              - listitem [ref=e52]:
                - text: To view more of our recent work, check out our longer product list on
                - link "Automattic.com" [ref=e53] [cursor=pointer]:
                  - /url: https://automattic.com/
                - text: .
            - paragraph [ref=e54]:
              - strong [ref=e55]: How do we work?
            - list [ref=e56]:
              - listitem [ref=e57]:
                - text: We’re
                - link "kind to each other" [ref=e58] [cursor=pointer]:
                  - /url: https://automattic.com/creed/help-a-colleague/
                - text: and our users – we build a positive, supportive, and inclusive culture of cohesive teams focused on building useful products for our customers.
              - listitem [ref=e59]:
                - text: We work as a global and distributed workforce resulting in a unique way of working built around
                - link "our creed" [ref=e60] [cursor=pointer]:
                  - /url: https://automattic.com/creed
                - text: .
              - listitem [ref=e61]: We offer flexible work arrangements allowing our team members to work when they feel best.
              - listitem [ref=e62]:
                - text: We open-source! We’re cool with
                - link "open-sourcing" [ref=e63] [cursor=pointer]:
                  - /url: https://github.com/Automattic
                - text: everything except passwords, or secret keys.
              - listitem [ref=e64]:
                - text: We ship often,
                - link "deploying many" [ref=e65] [cursor=pointer]:
                  - /url: https://automattic.com/about/
                - text: times daily with the help of peer code review, continuous integration, and our global workforce in over 70 countries.
              - listitem [ref=e66]: We welcome collaboration, and you can be involved in any discussion across our many communication channels.
              - listitem [ref=e67]: We encourage you to learn and develop and we support you with what you need – covering expenses, easy internal mobility, coaching.
            - paragraph [ref=e68]:
              - strong [ref=e69]: "Enough about us, let‘s talk more about you. Working at Automattic might be a good fit if:"
            - list [ref=e70]:
              - listitem [ref=e71]: You care and often obsess over the quality and the details of your work.
              - listitem [ref=e72]: Debugging any problem is a fun challenge and not a chore.
              - listitem [ref=e73]: Understanding the layers of abstraction below and above your work isn’t something extra, but how you operate.
              - listitem [ref=e74]: You have production experience with several programming languages, frameworks, and paradigms. We mostly use PHP and JavaScript at Automattic, we expect you to be comfortable with the idea of becoming an expert in these languages, even if being one isn’t a requirement to apply.
              - listitem [ref=e75]: In your mind abstraction is associated as much with cost as it is with value.
              - listitem [ref=e76]: You have experience working at scale – it can be on the backend and performance side, or via the complexity of interacting with a multi-million diverse userbase.
              - listitem [ref=e77]: Are open and able to travel 3-4 weeks per year to meet up with your teammates in person.
            - paragraph [ref=e78]: These are exciting times at Automattic and you’ll have a unique opportunity to shape the future of our products. Join us! We look forward to hearing from you.
            - paragraph [ref=e79]:
              - emphasis [ref=e80]: Curious who works in engineering at Automattic?
              - link "Meet our Code Wranglers" [ref=e81] [cursor=pointer]:
                - /url: https://www.youtube.com/watch?list=PLQFhxUeNFfdLVtK-tsuAZbDa4a-LqFZlx&v=jyhYkuuzL_0
                - emphasis [ref=e82]: Meet our Code Wranglers
              - emphasis [ref=e83]: – Brandon, Jeremy, Mark, Jennifer, Roy and Kat!
            - paragraph [ref=e84]:
              - strong [ref=e85]: "What to Expect:"
            - paragraph [ref=e86]:
              - text: We know applying to jobs can be stressful and we want to ease the stress by giving clear expectations upfront about our process. We’ve outlined
              - link "everything you need to know here" [ref=e87] [cursor=pointer]:
                - /url: https://automattic.com/how-we-hire/
              - text: including all of the steps in the process as well as how we approach hiring.
            - paragraph [ref=e88]: Please note that we are paying extra attention to your answers to the questions in the application form. They are a significant part of the hiring process, and we will review them just like we would review any other step of the hiring process. We’re always iterating so if you happen to join us in the process, please feel free to offer feedback on what else we can include there!
            - paragraph [ref=e89]:
              - strong [ref=e90]: "Salary range: $70,000-$170,000 USD."
              - text: Please note that salary ranges are global, regardless of location, and we pay in local currency.
            - paragraph [ref=e91]: We are searching for high-caliber candidates with the skills and qualities to have a net positive for Automattic. Pay will reflect the potential contribution and the impact you can bring, which may, in some cases, go beyond the range stated.
            - paragraph [ref=e92]:
              - text: "We’re pleased to offer a straightforward, competitive base salary, providing financial clarity without complex variable components. This isn’t your typical work-from-home job: we are a fully-remote company with an open vacation policy. To see a full list of benefits by country, consult our"
              - link "Benefits Page" [ref=e93] [cursor=pointer]:
                - /url: https://automattic.com/benefits/
              - text: . And check out these links to learn more about
              - link "How We Hire" [ref=e94] [cursor=pointer]:
                - /url: https://automattic.com/how-we-hire/
              - text: and
              - link "What We Expect from Ourselves" [ref=e95] [cursor=pointer]:
                - /url: https://automattic.com/expectations/
              - text: ". #LI-Remote"
