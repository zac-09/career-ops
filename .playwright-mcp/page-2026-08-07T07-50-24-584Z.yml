        - region [ref=f49e94]:
          - heading "Role description" [level=2] [ref=f49e95]
          - generic [ref=f49e96]:
            - heading "About Buffer" [level=2] [ref=f49e97]
            - paragraph [ref=f49e98]: We create social media and brand-building software for small businesses, creators, and individuals. Our mission is to provide essential tools to help small businesses get off the ground and grow. Through exceptional customer service and uplifting content, we help our customers believe they can succeed and do good along the way.
            - paragraph [ref=f49e99]:
              - text: Buffer is a fully distributed team, and we’ve always aimed to do things a little differently at Buffer. Since the early days, we’ve focused on building one of the most unique and fulfilling workplaces by rethinking a lot of traditional practices. We also default to transparency, so you can read all about our metrics, and our successes and failures along the way on our
              - link "Transparency Dashboard" [ref=f49e100] [cursor=pointer]:
                - /url: https://buffer.com/open
              - text: .
            - paragraph [ref=f49e101]:
              - text: We're united by Buffer's
              - link "values" [ref=f49e102] [cursor=pointer]:
                - /url: https://buffer.com/about#values
              - text: ", and we hire and work from all over the world. We strive to create a diverse and inclusive work environment, and we are building a culture where underrepresented groups are welcome and can flourish. Please note that we do travel to work together in person once or twice per year, and those events are highly encouraged to build deeper connections among our small team."
            - paragraph [ref=f49e103]:
              - text: As you get to know Buffer and consider joining the journey, you can learn more about Buffer on our
              - link "Journey" [ref=f49e104] [cursor=pointer]:
                - /url: https://buffer.com/journey
              - text: page. Still curious to learn more about the experience on the Buffer team? Feel free to read more from
              - link "Kirsti" [ref=f49e105] [cursor=pointer]:
                - /url: https://buffer.com/resources/first-30-days-buffer/
              - text: and
              - link "Sabreen" [ref=f49e106] [cursor=pointer]:
                - /url: https://buffer.com/resources/joined-3-days-before-the-retreat/
              - text: as they share their first experiences with Buffer, as well as from
              - link "Hailley" [ref=f49e107] [cursor=pointer]:
                - /url: https://buffer.com/resources/8-years-at-buffer/
              - text: ", who captured why she still calls Buffer home after 8+ years."
            - paragraph
            - heading [level=2] [ref=f49e108]:
              - strong [ref=f49e109]: About the Role
            - paragraph [ref=f49e110]:
              - text: We're looking for a Senior Engineer to join Buffer's Growth Marketing team. This is a hands-on engineering role building the web experiences, systems, and infrastructure that help Buffer grow. The work spans building features and pages across
              - link "buffer.com" [ref=f49e111] [cursor=pointer]:
                - /url: http://buffer.com
              - text: ", interactive tools, referral systems, conversion flows, along with the technical implementation behind them: integrations with marketing tools, analytics and tracking systems, SEO infrastructure, and the backend logic that powers our marketing features."
            - paragraph [ref=f49e112]: Buffer is on a mission to help the next 200,000 creators and small teams build their brands, and this role is central to making that happen. You'll be building the growth systems, experiments, and infrastructure that connect people with Buffer at the right moment, and help them take that first step. This is a chance to shape how we grow, not just keep pace with it.
            - paragraph [ref=f49e113]: "We need someone who's comfortable across the full frontend scope, strong with React and modern web development, but also capable of diving into backend logic, connecting third-party APIs, debugging tracking pipelines, and figuring out what they don't know. The team values pace and iteration: we ship quickly, learn from real usage, and improve as we go. But we also care about craft, noticing the UX details and maintaining standards while keeping momentum."
            - paragraph [ref=f49e114]: Working at Buffer is collaborative and positive thanks to our core values. We try to be "No Ego Doers" who are aware of our assumptions, and joining us means you'll work together as a team to test and confirm our ideas.
            - paragraph
            - heading [level=2] [ref=f49e115]:
              - strong [ref=f49e116]: Who you'll work with
            - paragraph [ref=f49e117]:
              - text: This role reports to
              - link "Kateryna Porshnieva" [ref=f49e118] [cursor=pointer]:
                - /url: https://www.linkedin.com/in/kporshnieva/
              - text: ", Head of Engineering Operations, and sits on the Marketing team. You'll collaborate on a variety of Brand and Product Marketing projects with the full Marketing team, partnering closely with"
              - link "Simon Heaton" [ref=f49e119] [cursor=pointer]:
                - /url: https://www.linkedin.com/in/heatonsimon/
              - text: ", Director of Growth Marketing, and"
              - link "Hailley Griffis" [ref=f49e120] [cursor=pointer]:
                - /url: https://www.linkedin.com/in/hailleygriffis/
              - text: ", Head of Communications and Content."
            - paragraph [ref=f49e121]:
              - text: You'll work day-to-day with most of the team, in particular
              - link "Kate Baldrey" [ref=f49e122] [cursor=pointer]:
                - /url: https://www.linkedin.com/in/katebaldrey/
              - text: ", our Marketing UX Designer, to build web experiences that help people learn about and sign up for Buffer."
            - paragraph
            - heading [level=2] [ref=f49e123]:
              - strong [ref=f49e124]: What you'll do
            - list [ref=f49e125]:
              - listitem [ref=f49e126]:
                - paragraph [ref=f49e127]: Own growth engineering projects end-to-end, from implementing a localization framework for international audiences to building referral program logic, attribution systems, and rebuilding tracking infrastructure for accuracy and reliability. You'll take projects from concept to launch, partnering closely with marketing, design, and other engineers along the way.
              - listitem [ref=f49e128]:
                - paragraph [ref=f49e129]: Build features on Buffer's marketing site that help people discover and try Buffer, shipping landing pages, interactive tools, and conversion flows. Create benchmarks, calculators, and utility content that educate users and make Buffer genuinely useful before someone even signs up.
              - listitem [ref=f49e130]:
                - paragraph [ref=f49e131]: Shape our marketing platform capabilities by building the systems and frameworks that help the whole team move faster. Create A/B testing infrastructure, develop programmatic page generation for SEO and AEO, implement content management patterns, and build reusable components that make future projects easier to ship.
              - listitem [ref=f49e132]:
                - paragraph [ref=f49e133]: Drive experimentation and optimization, helping the team learn faster through code. Set up experiments, validate results, and iterate based on what we discover. You'll balance moving quickly with maintaining quality, because both matter here.
              - listitem [ref=f49e134]:
                - paragraph [ref=f49e135]:
                  - text: Strengthen our foundations by maintaining integrations with our marketing technology stack (Segment, GTM, Mixpanel, BigQuery), upgrading dependencies, optimizing performance, and ensuring accessibility. You'll also participate in our on-call rotation and contribute to ongoing system health, because keeping
                  - link "buffer.com" [ref=f49e136] [cursor=pointer]:
                    - /url: http://buffer.com
                  - text: running smoothly is a shared responsibility we all take seriously.
              - listitem [ref=f49e137]:
                - paragraph [ref=f49e138]: Help shape our engineering culture by pairing with other engineers, reviewing code, sharing knowledge about growth systems and marketing engineering patterns, and raising the bar for how we approach frontend work together at Buffer.
            - paragraph
            - heading [level=2] [ref=f49e139]:
              - strong [ref=f49e140]: Helpful skills and experience
            - list [ref=f49e141]:
              - listitem [ref=f49e142]:
                - paragraph [ref=f49e143]: You have strong frontend foundations in React, TypeScript, and modern web development, and you're comfortable going beyond the frontend when the work calls for it - writing backend logic, building API routes, connecting third-party integrations. Our site runs on Next.js, but we care more about your adaptability than matching our exact stack.
              - listitem [ref=f49e144]:
                - paragraph [ref=f49e145]: You understand what it takes to grow something. Maybe you've worked on a marketing or growth team and have hands-on experience with SEO, analytics, A/B testing, and conversion optimization. Or maybe you've grown your own product, startup, or side project and learned these things by doing - building referral systems, running experiments, and figuring out what converts and why. Either way, you know how to measure impact and you're motivated by the numbers moving.
              - listitem [ref=f49e146]:
                - paragraph [ref=f49e147]: You think beyond the immediate task. You care about how things connect, whether they'll hold up, and whether the details are right - but you also know when to ship and learn from real usage rather than polish indefinitely.
              - listitem [ref=f49e148]:
                - paragraph [ref=f49e149]: You thrive in remote, async environments. You communicate clearly, support your teammates, and don't wait for permission to make progress. You work effectively across marketing, design, and engineering, and can explain technical decisions to non-technical stakeholders.
              - listitem [ref=f49e150]:
                - paragraph [ref=f49e151]: You've built AI into user-facing marketing features at scale and you use AI tools daily to multiply your own output — we want someone who shares our energy about what AI makes possible.
              - listitem [ref=f49e152]:
                - paragraph [ref=f49e153]: You have a personal stake in the world of content creation. Maybe you've run a newsletter, built an audience on social media, or regularly share your own work online. You've used Buffer before and care about the experience of planning, creating, and publishing content.
            - paragraph
            - heading [level=2] [ref=f49e154]:
              - strong [ref=f49e155]: Our Tech Stack
            - list [ref=f49e156]:
              - listitem [ref=f49e157]:
                - paragraph [ref=f49e158]:
                  - text: We use Next.js v15+ with React and TypeScript for
                  - link "buffer.com" [ref=f49e159] [cursor=pointer]:
                    - /url: http://buffer.com
                  - text: (currently using Pages router, planning to migrate to App router). We use Express middleware for some routing (planning to migrate to Next.js middleware).
              - listitem [ref=f49e160]:
                - paragraph [ref=f49e161]: Styling with CSS Modules and Motion for animations, and use Radix UI and Base UI for accessible components (gradually migrating to Base UI as it evolves) and data visualizations using Recharts.
              - listitem [ref=f49e162]:
                - paragraph [ref=f49e163]: Our marketing technology stack includes Segment, Google Tag Manager, Mixpanel, and BigQuery for tracking and analytics.
              - listitem [ref=f49e164]:
                - paragraph [ref=f49e165]: We pull content and data from Ghost CMS (blog), Redash, Notion, Google Sheets, and various external APIs.
            - paragraph
            - heading [level=2] [ref=f49e166]:
              - strong [ref=f49e167]: Interview process
            - paragraph [ref=f49e168]: Do you believe you're a fit for this role and want to join the Buffer team? We'd love to hear about you!
            - paragraph [ref=f49e169]: Here's what our hiring process for this role is like.
            - list [ref=f49e170]:
              - listitem [ref=f49e171]:
                - paragraph [ref=f49e172]:
                  - strong [ref=f49e173]: Application.
                  - text: When submitting your application and resume, tell us why you want to join Buffer and take your time. This is your chance to make a strong first impression.
              - listitem [ref=f49e174]:
                - paragraph [ref=f49e175]:
                  - strong [ref=f49e176]: Role Interview.
                  - text: Chat with
                  - link "Simon Heaton" [ref=f49e177] [cursor=pointer]:
                    - /url: https://www.linkedin.com/in/heatonsimon/
                  - text: ", Director of Growth Marketing to understand what it takes to work at Buffer. This is an opportunity for both sides to get to know each other and determine whether our expectations align."
              - listitem [ref=f49e178]:
                - paragraph [ref=f49e179]:
                  - strong [ref=f49e180]: Code review assignment.
                  - text: We'll send you an asynchronous assignment to review a pull request, to help us understand how you think about code and communicate technical ideas.
              - listitem [ref=f49e181]:
                - paragraph [ref=f49e182]:
                  - strong [ref=f49e183]: Technical interview.
                  - text: Interview with a couple of engineers from Buffer focused on your technical experience and approach.
              - listitem [ref=f49e184]:
                - paragraph [ref=f49e185]:
                  - strong [ref=f49e186]: Leadership Interview.
                  - text: A conversation with
                  - link "Hailley Griffis" [ref=f49e187] [cursor=pointer]:
                    - /url: https://www.linkedin.com/in/hailleygriffis/
                  - text: ", Head of Communications and Content, to discuss your approach to leadership, how we drive value and impact in a cross-functional company, and to really get into how you think about approaching work and collaboration."
              - listitem [ref=f49e188]:
                - paragraph [ref=f49e189]:
                  - strong [ref=f49e190]: Final Interview.
                  - text: You will have the opportunity to meet with our Executive Leadership team. This is a great chance for you to gain a deeper understanding of Buffer's strategy, values, and work processes.
              - listitem [ref=f49e191]:
                - paragraph [ref=f49e192]:
                  - strong [ref=f49e193]: Collaboration Period.
                  - text: This is an experimental stage where you would work with us on a real project over 2 days (fully paid). The goal is to see how it feels to work in the team, both for us and for you.
              - listitem [ref=f49e194]:
                - paragraph [ref=f49e195]:
                  - strong [ref=f49e196]: Offer.
                  - text: We wrap it up with an offer and discuss the final details. We would align on the last bits before we make you part of the Buffer team 💛
            - paragraph [ref=f49e197]:
              - emphasis [ref=f49e198]: At Buffer, we value diversity of experience, and we understand that comes in many forms. We’re dedicated to adding new perspectives to the team. So, if your experience is close to what we’re looking for, please consider applying.
            - paragraph [ref=f49e199]:
              - emphasis [ref=f49e200]: By submitting the application, you consent to Buffer collecting and processing your personal data for recruiting purposes, find more details in our
              - link [ref=f49e201] [cursor=pointer]:
                - /url: https://buffer.notion.site/Privacy-Policy-for-Applicants-230a7f5a00fd80e48478f09171d18a24?pvs=143
                - emphasis [ref=f49e202]: Privacy Policy
              - emphasis [ref=f49e203]: .
