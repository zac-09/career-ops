  - main [ref=f8e33]:
    - generic [ref=f8e34]:
      - generic [ref=f8e38]:
        - generic [ref=f8e39]:
          - heading "Joyful is more than a concept. It’s a mindset" [level=1] [ref=f8e40]
          - paragraph [ref=f8e41]: Storyblok is a place that gives people the flexibility and independence to work where and how they want. So come here to work your way, alongside colleagues you’ll love and learn from, across 45+ countries.
        - link "See open positions" [ref=f8e43] [cursor=pointer]:
          - /url: /jobs#open-positions
      - generic [ref=f8e67]:
        - 'heading "3 reasons you’ll love working here: the people, pizza & dogs…" [level=2] [ref=f8e70]'
        - list [ref=f8e72]:
          - listitem [ref=f8e73]:
            - list [ref=f8e75]:
              - listitem [ref=f8e76]:
                - generic [ref=f8e78]:
                  - heading "1. Work from anywhere" [level=3] [ref=f8e80]
                  - paragraph [ref=f8e85]: Storyblok has been a remote-only company since day one. Because choosing where you work from means you can live your life while still being productive. Want to walk your dog? Meet a friend for coffee and donuts? Or simply take an afternoon nap (with your cat)? You do you. Just let us know where to get the best donuts, eh.
              - listitem [ref=f8e86]:
                - generic [ref=f8e88]:
                  - heading "2. People you’ll love and learn from" [level=3] [ref=f8e90]
                  - paragraph [ref=f8e95]: Being fully-remote means we can hire the best talent – and top-notch people – from across the world. We’re a diverse team spread across more than 45 countries, united by a love of furry animals and a belief in certain values (see below). You can rely on your colleagues here. And learn from them. Heck, you might end up calling some of them friends. Yay! Let’s get pizzzzzzzza!
              - listitem [ref=f8e96]:
                - generic [ref=f8e98]:
                  - heading "3. Do work you’re proud of" [level=3] [ref=f8e100]
                  - paragraph [ref=f8e105]: "At Storyblok our aim is bold and plain: to be the CMS that devs and content teams love the most. And we’re well on our way, according to our customer reviews, awards, and recognition from leading analysts. Join us and you'll be shaping the future of CMS, working on stuff you’d proudly tell your parents about (even if they might not understand what you’re talking about)."
      - generic [ref=f8e108]:
        - generic [ref=f8e109]: Meet our team of dreamers
        - paragraph [ref=f8e111]: We love smart, empathetic people who are brilliant at what they do. Proactive, solution-driven people who want to dive head first into the big ideas (and figure out the details along the way). People with dreams beyond their careers, who want balance and freedom in their life—not all-work, all the time.Everyone here has their own unique story, heritage and experience that they bring with them every day. From pro-moto-racers and music anthropologists, to running fans, snow bunnies, marine biologists and yoga-fanatics. We’re all privileged to work alongside a wonderfully diverse and fascinating group of people.230 teammates, 45+ countries, 47+ nationalities
      - generic [ref=f8e133]:
        - generic [ref=f8e134]: Lydia loves the team around her
        - generic [ref=f8e136]: Storyblok’s working environment helps me to get the best out of myself. The fantastic team inspires and supports me in solving challenges and creating the best possible solution.
        - separator [ref=f8e137]
        - generic [ref=f8e138]:
          - img "Lydia Kothmeier" [ref=f8e139]
          - paragraph [ref=f8e140]: Lydia Kothmeier, VP of Operations - Austria
      - generic [ref=f8e143]:
        - generic [ref=f8e146]:
          - heading "Perks & Benefits" [level=2] [ref=f8e148]
          - paragraph [ref=f8e151]:
            - text: "Storyblok is a fully remote company, hiring excellent people from all over the world. 👉Explore the full list of Benefits & Perks: 🌎"
            - link "Global Benefits & Perks" [ref=f8e152] [cursor=pointer]:
              - /url: https://a.storyblok.com/f/88751/x/ea09e5d29e/benefits-perks_global.pdf
            - text: 🇺🇸
            - link "US Benefits & Perks" [ref=f8e153] [cursor=pointer]:
              - /url: https://a.storyblok.com/f/88751/x/b0722aa5de/benefits-perks_usa.pdf
            - text: 🇬🇧
            - link "UK Benefits & Perks" [ref=f8e154] [cursor=pointer]:
              - /url: https://a.storyblok.com/f/88751/x/361c920aee/perks-benefits-uk.pdf
        - separator [ref=f8e155]
        - generic [ref=f8e156]:
          - list [ref=f8e159]:
            - listitem [ref=f8e160]:
              - paragraph [ref=f8e167]: Flexible & Fully-Remote Work Environment As a fully remote company with work-life balance at its core, you can arrange start times and finish times around your life.
            - listitem [ref=f8e168]:
              - paragraph [ref=f8e175]: Working Hours We follow each local country’s jurisdiction or the maximum amount of 38.5 hours per week.
            - listitem [ref=f8e176]:
              - paragraph [ref=f8e184]: Generous Vacation, Sick, Parental & Special Leave Policies You are entitled to 25 days paid annual leave, plus your local public holidays.
            - listitem [ref=f8e185]:
              - paragraph [ref=f8e192]: Team Events / Retreats As a fully remote company with team members living in different corners of the world, we have ongoing online fun team events.
            - listitem [ref=f8e193]:
              - paragraph [ref=f8e201]: Diverse Team We have team members in more than 45 countries now! We’re all made up of different backgrounds.
            - listitem [ref=f8e202]:
              - paragraph [ref=f8e207]: High-quality, cutting-edge, equipment We want you to have a comfortable and productive working environment where you feel at ease. We offer you our standard home office equipment package.
            - listitem [ref=f8e208]:
              - paragraph [ref=f8e215]: Wellbeing Your physical and mental health are important to us at Storyblok.
          - list [ref=f8e218]:
            - listitem [ref=f8e219]:
              - paragraph [ref=f8e225]: Individual Working Environment + Home Allowance After your probation period you may continue working from home or opt for a local co-working space or rented office in your region if you wish.
            - listitem [ref=f8e226]:
              - paragraph [ref=f8e235]: Education and Development Opportunities We want to invest in you and make sure you have all the resources you need to grow within the company. In the beginning, we will provide you with training on the job, then support you with our Career Development Fund.
            - listitem [ref=f8e236]:
              - paragraph [ref=f8e241]: Competitive salary We have a fair and equitable compensation philosophy where we’ll always consider your experience, seniority and location.
            - listitem [ref=f8e242]:
              - paragraph [ref=f8e252]: Business Travel Insurance Storyblok wants all team members to be safe during their business travels. The Business Travel Insurance covers traveling abroad for business purposes.
            - listitem [ref=f8e253]:
              - paragraph [ref=f8e260]: Referral Incentives When you refer a candidate, you can get a referral bonus, and the candidate gets the chance to work in a fun and trusting environment.
            - listitem [ref=f8e261]:
              - paragraph [ref=f8e269]: Team Member Storyblok Swag & Celebration Gifts Each new team member receives a Storyblok welcome package - a Storyblok mug and a Storyblok T-shirt to show your pride in being part of our community and company.
      - generic [ref=f8e273]:
        - generic [ref=f8e274]: Christian loves the mutual trust
        - generic [ref=f8e276]: The working environment at Storyblok is fantastic, with remote work and flexibility allowing me to support my wife and two kids, greatly improving my quality of life. This relationship is built on trust and understanding.
        - separator [ref=f8e277]
