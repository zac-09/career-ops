          - paragraph [ref=f8e287]: The process may include one or more coffee chats, depending on the seniority of the role (or how much sleep we got last night).
        - list [ref=f8e288]:
          - listitem [ref=f8e289]:
            - list [ref=f8e291]:
              - listitem [ref=f8e292]:
                - generic [ref=f8e294]:
                  - heading "⭐️ On Our Radar" [level=3] [ref=f8e296]
                  - paragraph [ref=f8e301]: Your application landed — and now it's got our full attention. Our Talent Acquisition team is giving your profile the deep-dive it deserves.
              - listitem [ref=f8e302]:
                - generic [ref=f8e304]:
                  - heading "👋 Hello from Talent Acquisition (TA) Partner" [level=3] [ref=f8e306]
                  - paragraph [ref=f8e311]: A first conversation with our TA team — we share more about the role, you share more about you.
              - listitem [ref=f8e312]:
                - generic [ref=f8e314]:
                  - heading "🤝 Meet your Future Manager" [level=3] [ref=f8e316]
                  - paragraph [ref=f8e321]: Aligned so far? Time to meet the person you'd actually report to and dig into the role in detail.
              - listitem [ref=f8e322]:
                - generic [ref=f8e324]:
                  - heading "🧩 Team Connect" [level=3] [ref=f8e326]
                  - paragraph [ref=f8e331]: Optional, but fun — meet a few future teammates and get a feel for the team.
              - listitem [ref=f8e332]:
                - generic [ref=f8e334]:
                  - heading "🎯 Show Us How You Think" [level=3] [ref=f8e336]
                  - paragraph [ref=f8e341]: This is your moment to shine — we'll send you a real task tied to the role. Walk us through your solution, since we're as curious about your process as your answer, not just what you know.
              - listitem [ref=f8e342]:
                - generic [ref=f8e344]:
                  - heading "☕️ Leadership Connect" [level=3] [ref=f8e346]
                  - paragraph [ref=f8e351]: Grab a virtual coffee with our leadership and talk culture, growth, and the big picture.
              - listitem [ref=f8e352]:
                - generic [ref=f8e354]:
                  - heading "🎉 Let's Make an Offer" [level=3] [ref=f8e356]
                  - paragraph [ref=f8e361]: Welcome to Storyblok. Let's build something great together.
