      - generic [ref=f551e53]:
        - generic [ref=f551e54]: About Cogram
        - paragraph [ref=f551e56]: Cogram is an AI platform for the architecture, engineering, and construction industry. Our products automate a growing number of workflows such as site reports, meeting minutes, email management, RFIs and submittals. We’re backed by Y Combinator and other world-leading investors and are growing fast and sustainably. We believe that a small, winning team can achieve outsize results and consistently beat competitors 100x our size.
      - generic [ref=f551e57]:
        - text: About the role
        - generic [ref=f551e58]:
          - paragraph [ref=f551e59]: "Location: Remote Timezone: within CET ±3 hours"
          - heading "About Us" [level=3] [ref=f551e60]
          - paragraph [ref=f551e61]:
            - link "Cogram" [ref=f551e62] [cursor=pointer]:
              - /url: https://cogram.com
            - text: "is an AI platform for the architecture, engineering, and construction industry. We automate project admin: RFIs & submittals, email filing, field notes, meeting minutes, reporting. World-leading architecture and engineering firms use Cogram at scale. Backed by YC and Initialized."
          - paragraph [ref=f551e63]: "AEC is a $13T industry that still runs on email chains, spreadsheets, and manual data entry. We’re building the AI platform that replaces all of it. The problems are seriously hard: messy real-world data, deeply entrenched workflows, and users who need to trust the output on job sites in difficult environments. We’re a small team competing with companies 100x our size, and winning. The goal is to become the default AI platform for design and construction workflows. We need formers technical founders who want to write code, ship product, and help us get there."
          - heading "Why ex-founders" [level=3] [ref=f551e64]
          - paragraph [ref=f551e65]: We’re a remote-first team. You talk to customers, decide what to build, build it, ship it, and measure whether it worked. You’re comfortable with thin specs. If something breaks at the edge of your knowledge, you figure it out. If you’ve built and run a company before, this will feel familiar. The pace, the ambiguity, the ownership. The difference is you’re joining a company with traction, paying customers at scale, and a clear technical direction.
          - heading "What we’re looking for" [level=3] [ref=f551e66]
          - list [ref=f551e67]:
            - listitem [ref=f551e68]: You’ve founded or co-founded a tech company and built product yourself.
            - listitem [ref=f551e69]: You’re good at talking to users and understanding requirements. You can design, ship, and own features end-to-end.
            - listitem [ref=f551e70]: 3+ years building production software. Strong in at least one backend technology and one frontend technology.
            - listitem [ref=f551e71]: Habitual power user of AI (Claude Code, Cursor, Codex, or whatever’s next). Strong opinions about AI-augmented engineering. Always finding tools that make you and the team faster.
            - listitem [ref=f551e72]: "Comfortable in unfamiliar territory: cloud ops, CI pipelines, mobile, a gnarly customer workflow."
            - listitem [ref=f551e73]: You can explain technical trade-offs to engineers and non-engineers alike.
            - listitem [ref=f551e74]: You know when to cut corners and when to be rigorous.
          - paragraph [ref=f551e75]: "Bonus: experience with shipping LLM-based production software, React Native/Expo, cloud ops (AWS, Azure), Terraform, Kubernetes, AEC industry exposure."
          - heading "Stack" [level=3] [ref=f551e76]
          - paragraph [ref=f551e77]: Python (FastAPI), Postgres, Redis, React/TypeScript, React Native/Expo, Terraform/Kubernetes on AWS & Azure.
          - heading "Benefits" [level=3] [ref=f551e78]
          - paragraph [ref=f551e79]: Fully remote, three offsites/year. 38 paid days off (26 personal + 12 German public holidays). Competitive salary + generous equity. Personal development stipend.
          - heading "How to apply" [level=3] [ref=f551e80]
          - list [ref=f551e81]:
            - listitem [ref=f551e82]: One or two paragraphs on your background.
            - listitem [ref=f551e83]: One to two lines on what you built and what you took away from it.
            - listitem [ref=f551e84]: A URL to a live project, repo, or open-source contribution.
            - listitem [ref=f551e85]: Your current agentic-coding setup.
          - paragraph [ref=f551e86]: No AI slop, please. If your experience doesn’t match every line, apply anyway. We care more about how you think than where you’ve been. Come join us.
      - generic [ref=f551e87]:
        - text: Interview Process
        - generic [ref=f551e88]:
          - list [ref=f551e89]:
            - listitem [ref=f551e90]: Screening call (20–30 min)
            - listitem [ref=f551e91]: Technical interview (with and without AI, 2–3 hours)
            - listitem [ref=f551e92]: Cultural-fit interview with co-founder (45 minutes)
            - listitem [ref=f551e93]: "Optional: paid trial days (remote or in-person) and / or in-person meet-up"
            - listitem [ref=f551e94]: Decision
          - paragraph [ref=f551e95]: We move fast. The whole process often takes a few days.
