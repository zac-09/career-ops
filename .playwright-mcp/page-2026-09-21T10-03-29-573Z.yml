                - generic [ref=f51e85]:
                  - paragraph [ref=f51e86]:
                    - strong [ref=f51e87]:
                      - emphasis [ref=f51e88]: Join Tether and Shape the Future of Digital Finance
                  - paragraph [ref=f51e89]: At Tether, we’re not just building products, we’re pioneering a global financial revolution. Our cutting-edge solutions empower businesses—from exchanges and wallets to payment processors and ATMs—to seamlessly integrate reserve-backed tokens across blockchains. By harnessing the power of blockchain technology, Tether enables you to store, send, and receive digital tokens instantly, securely, and globally, all at a fraction of the cost. Transparency is the bedrock of everything we do, ensuring trust in every transaction.
                  - paragraph [ref=f51e90]
                  - paragraph [ref=f51e91]:
                    - strong [ref=f51e92]:
                      - emphasis [ref=f51e93]: Innovate with Tether
                  - paragraph [ref=f51e94]:
                    - strong [ref=f51e95]: "Tether Finance:"
                    - text: Our innovative product suite features the world’s most trusted stablecoin,
                    - strong [ref=f51e96]: USDT
                    - text: ", relied upon by hundreds of millions worldwide, alongside pioneering digital asset tokenization services."
                  - paragraph [ref=f51e97]: "But that’s just the beginning:"
                  - paragraph [ref=f51e98]:
                    - strong [ref=f51e99]: "Tether Power:"
                    - text: Driving sustainable growth, our energy solutions optimize excess power for Bitcoin mining using eco-friendly practices in state-of-the-art, geo-diverse facilities.
                  - paragraph [ref=f51e100]:
                    - strong [ref=f51e101]: "Tether Data:"
                    - text: Fueling breakthroughs in AI and peer-to-peer technology, we reduce infrastructure costs and enhance global communications with cutting-edge solutions like
                    - strong [ref=f51e102]: KEET
                    - text: ", our flagship app that redefines secure and private data sharing."
                  - paragraph [ref=f51e103]:
                    - strong [ref=f51e104]: Tether Education
                    - text: ": Democratizing access to top-tier digital learning, we empower individuals to thrive in the digital and gig economies, driving global growth and opportunity."
                  - paragraph [ref=f51e105]:
                    - strong [ref=f51e106]: Tether Evolution
                    - text: ": At the intersection of technology and human potential, we are pushing the boundaries of what is possible, crafting a future where innovation and human capabilities merge in powerful, unprecedented ways."
                  - paragraph [ref=f51e107]
                  - paragraph [ref=f51e108]:
                    - strong [ref=f51e109]:
                      - emphasis [ref=f51e110]: Why Join Us?
                  - paragraph [ref=f51e111]: Our team is a global talent powerhouse, working remotely from every corner of the world. If you’re passionate about making a mark in the fintech space, this is your opportunity to collaborate with some of the brightest minds, pushing boundaries and setting new standards. We’ve grown fast, stayed lean, and secured our place as a leader in the industry.
                  - paragraph [ref=f51e112]: If you have excellent English communication skills and are ready to contribute to the most innovative platform on the planet, Tether is the place for you.
                  - paragraph [ref=f51e113]
                  - paragraph [ref=f51e114]:
                    - strong [ref=f51e115]: Are you ready to be part of the future?
                  - paragraph [ref=f51e116]
                  - paragraph [ref=f51e117]:
                    - strong [ref=f51e118]: About the job
                  - paragraph [ref=f51e119]
                  - paragraph [ref=f51e120]: The P2P Search team is building a next-gen stack for resilient, decentralized search. We're serious about decentralization -- that means a truly peer-to-peer architecture with no centralized index. It's search without servers -- our technology empowers anyone to spin up a self-organizing, unstoppable search engine for text, pics, chats, locations, or any data you can imagine.
                  - paragraph [ref=f51e121]
                - heading "Job requirements" [level=2] [ref=f51e122]
                - generic [ref=f51e124]:
                  - paragraph [ref=f51e125]: "We're seeking talented software engineers with a passion for P2P, an interest in research but a bias for building, and a deep understanding of some combination of the following:"
                  - paragraph [ref=f51e126]
                  - list [ref=f51e127]:
                    - listitem [ref=f51e128]:
                      - paragraph [ref=f51e129]: • Kademlia DHT.
                    - listitem [ref=f51e130]:
                      - paragraph [ref=f51e131]: "• Distributed indexing and the relevant research literature: skip graphs, prefix hash trees, m-LIGHT, locality sensitive hashing."
                    - listitem [ref=f51e132]:
                      - paragraph [ref=f51e133]: • Distributed databases and CRDTs.
                    - listitem [ref=f51e134]:
                      - paragraph [ref=f51e135]: "• Networking for P2P: TCP/IP, transport-layer connection orientation and reliability models, multiplexing, NAT traversal, encryption."
                    - listitem [ref=f51e136]:
                      - paragraph [ref=f51e137]: "• Classical IR topics and search engine architecture: recall vs. precision, ranking algorithms, lexical vs. semantic search, inverted indices, etc."
                    - listitem [ref=f51e138]:
                      - paragraph [ref=f51e139]: • Network protocol testing, evaluation, and optimization.
                    - listitem [ref=f51e140]:
                      - paragraph [ref=f51e141]: • Writing high performance, highly concurrent networking code.
                    - listitem [ref=f51e142]:
                      - paragraph [ref=f51e143]: "• The Holepunch stack: hyperdht, hyperswarm, hypercore, hyperbee, hyperdrive, udx-native"
