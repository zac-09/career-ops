      - generic [ref=f106e96]:
        - heading "Secure private networking is a fundamental right of every modern company" [level=2] [ref=f106e98]
        - generic [ref=f106e99]:
          - paragraph [ref=f106e100]: Network security is complex and expensive, often built for companies with multi-million dollar IT budgets, while millions of smaller teams are left behind. NetBird's mission is to make advanced networking and cybersecurity easy to use and affordable for teams of all sizes. By combining open source with modern technology, NetBird aims to set the standard for connecting and securing IT infrastructure.
          - paragraph [ref=f106e101]: Building something like NetBird is hard, which is exactly why it's fun. The people who thrive here love open source and networking, own problems end to end, and would rather build a new standard than keep an old one running. If you've ever figured you could do networking better, you'll fit right in.
    - generic [ref=f106e104]:
      - generic [ref=f106e106]:
        - text: How we work
        - heading "Our values" [level=2] [ref=f106e107]
        - paragraph [ref=f106e108]: How we work together matters as much as what we ship, especially when the world runs on what we build. These are the principles we work by.
      - generic [ref=f106e109]:
        - generic [ref=f106e111]:
          - heading "Build in the open" [level=3] [ref=f106e116]
          - paragraph [ref=f106e117]: Open source isn't a feature, it's how we work. Our code is public and people run what we ship every day. That openness keeps us honest.
        - generic [ref=f106e119]:
          - heading "Own the outcome" [level=3] [ref=f106e124]
          - paragraph [ref=f106e125]: Small team, real scope. You own problems end to end and see your work in production fast, not buried in process.
        - generic [ref=f106e127]:
          - heading "Default to candor" [level=3] [ref=f106e131]
          - paragraph [ref=f106e132]: Direct, kind, and specific. Best argument wins, not the loudest voice, and feedback stays about the work, never the person.
        - generic [ref=f106e134]:
          - heading "Stay close to the user" [level=3] [ref=f106e137]
          - paragraph [ref=f106e138]: Engineers talk to users and everyone does support sometimes. The product is everyone's job, not a department.
        - generic [ref=f106e140]:
          - heading "It just has to work" [level=3] [ref=f106e143]
          - paragraph [ref=f106e144]: We build for the teams actually using NetBird, make it genuinely good first, and earn the right to scale instead of over-engineering.
        - generic [ref=f106e146]:
          - heading "Security is the promise" [level=3] [ref=f106e150]
          - paragraph [ref=f106e151]: Networks around the world trust us to protect them, and we earn that trust every day. Reliability is the baseline, not a feature.
