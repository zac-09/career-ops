        - generic [ref=f36e24]:
          - generic [ref=f36e25]:
            - heading "About Dwelly" [level=2] [ref=f36e26]
            - paragraph [ref=f36e27]: Dwelly is building the AI operating system for residential lettings. Its growing network of agencies provides its AI with real-world data, continuous feedback, and control over complete workflows, making exceptional service the standard for landlords and tenants. Today, Dwelly operates more than 15,000 properties and $470 million in GMV, making it one of the UK’s ten largest lettings operators. The company has raised $263 million.
            - paragraph [ref=f36e28]: We’re a fast-growing, product-focused company, backed by top-tier investors and led by a team with deep experience in real estate, technology, and operations.
            - heading "Position Summary" [level=2] [ref=f36e29]
            - paragraph [ref=f36e30]:
              - text: We’re looking for an
              - strong [ref=f36e31]: Applied AI Engineer
              - text: to help build the agentic infrastructure that powers automation across Dwelly. Our growth model is acquisition. Every agency we acquire brings new operational workflows, legacy processes, and manual work. If we manage each new agency manually, the economics of the model break. Our ability to scale depends on turning complex operational processes into reliable AI-driven and automated systems.
            - paragraph [ref=f36e32]: We already have successful AI-driven flows running in Tenant Find and Property Management. They work and deliver real business results. But they were built quickly and as separate systems.
            - paragraph [ref=f36e33]: "The next challenge is to bring these approaches together: build reusable agentic infrastructure, establish a robust evaluation and observability layer, and create systems that allow us to automate new workflows quickly and reliably as Dwelly scales."
            - paragraph [ref=f36e34]: This is not an AI research role. You will be building AI systems that operate inside a real business and are expected to work reliably in production.
            - paragraph [ref=f36e35]:
              - text: We’re hiring remotely across the
              - strong [ref=f36e36]: UK, Ireland, and European time zones
              - text: . Candidates should be based within these regions/time zones to enable effective collaboration with the wider team.
            - heading "Key Responsibilities" [level=2] [ref=f36e37]
            - heading "1. Agentic infrastructure" [level=3] [ref=f36e38]
            - list [ref=f36e39]:
              - listitem [ref=f36e40]: Design and build the core primitives behind our agentic systems, including memory, context management, tool-calling, orchestration, and feedback loops.
              - listitem [ref=f36e41]: Move us from one-off AI solutions toward reusable infrastructure where new workflows can be introduced quickly and with predictable reliability.
            - heading "2. Evaluation & observability" [level=3] [ref=f36e42]
            - list [ref=f36e43]:
              - listitem [ref=f36e44]: Build the evaluation framework that allows us to understand how our agents perform and why they succeed or fail.
              - listitem [ref=f36e45]: Make testing, tracing, debugging, and evaluating AI systems as fundamental to our engineering process as unit testing traditional software.
              - listitem [ref=f36e46]: Develop the systems that allow us to confidently assess an agentic workflow before deploying it into production.
            - heading "3. Agentic development" [level=3] [ref=f36e47]
            - list [ref=f36e48]:
              - listitem [ref=f36e49]: Push forward how we use LLMs to build software itself.
              - listitem [ref=f36e50]: Create workflows where coding agents and specialized subagents can explore repositories, implement changes, review architecture, check conventions, run evaluations, and iterate with minimal human coordination.
              - listitem [ref=f36e51]: Use agentic engineering workflows extensively in your own day-to-day development.
            - heading "4. Orchestration" [level=3] [ref=f36e52]
            - list [ref=f36e53]:
              - listitem [ref=f36e54]: Design systems where specialized agents, tools, deterministic software, and humans work together effectively.
              - listitem [ref=f36e55]: Understand when a problem should be solved with an LLM, when traditional software is the better solution, and when multiple coordinated agents can materially improve the outcome.
            - heading "5. Operational automation" [level=3] [ref=f36e56]
            - list [ref=f36e57]:
              - listitem [ref=f36e58]: Act as the bridge between complex operational workflows and engineering.
              - listitem [ref=f36e59]: Work closely with our operational and product teams to understand how work actually happens across acquired agencies, identify the highest-leverage opportunities for automation, and turn them into reliable production systems.
            - heading "6. Architectural influence" [level=3] [ref=f36e60]
            - list [ref=f36e61]:
              - listitem [ref=f36e62]: Help define the architectural patterns we use for agentic systems as the company scales.
              - listitem [ref=f36e63]: "You won’t be joining as engineer #20 on an established AI platform. You will be an early core member of the team with significant influence over our technical approach, tooling, and engineering standards."
            - heading "Qualifications and Preferred Background" [level=2] [ref=f36e64]
            - list [ref=f36e65]:
              - listitem [ref=f36e66]:
                - paragraph [ref=f36e67]: Strong software engineering background with experience independently delivering complex systems from idea through to production
              - listitem [ref=f36e68]:
                - paragraph [ref=f36e69]:
                  - text: Hands-on experience building
                  - strong [ref=f36e70]: AI or agentic systems that have operated in production
              - listitem [ref=f36e71]:
                - paragraph [ref=f36e72]: Experience dealing with real-world AI challenges such as reliability, latency, context management, failure modes, evaluation, and observability
              - listitem [ref=f36e73]:
                - paragraph [ref=f36e74]:
                  - text: Strong understanding of
                  - strong [ref=f36e75]: agents, tool use, structured outputs, context management, orchestration, evaluation, and feedback loops
              - listitem [ref=f36e76]:
                - paragraph [ref=f36e77]: Advanced practical use of modern LLMs — not simply using ChatGPT or Claude occasionally, but understanding how to build reliable workflows around probabilistic systems
              - listitem [ref=f36e78]:
                - paragraph [ref=f36e79]:
                  - text: Experience using
                  - strong [ref=f36e80]: coding agents and agentic development workflows
                  - text: as part of your own engineering process
              - listitem [ref=f36e81]:
                - paragraph [ref=f36e82]: Experience decomposing complex engineering tasks across agents or specialized subagents and designing mechanisms for them to verify and improve their outputs
              - listitem [ref=f36e83]:
                - paragraph [ref=f36e84]: Strong architectural judgment and ability to decide when to use LLMs, deterministic software, human intervention, or a combination of approaches
              - listitem [ref=f36e85]:
                - paragraph [ref=f36e86]:
                  - text: Experience with
                  - strong [ref=f36e87]: TypeScript / Node.js
                  - text: ", or strong experience building AI systems in Python with the ability and willingness to apply that knowledge in a TypeScript-first environment"
              - listitem [ref=f36e88]:
                - paragraph [ref=f36e89]: High autonomy, ownership, and comfort making decisions under ambiguity
              - listitem [ref=f36e90]:
                - paragraph [ref=f36e91]: Strong product judgment and ability to connect technical decisions to operational and business outcomes
              - listitem [ref=f36e92]:
                - paragraph [ref=f36e93]: Strong communication skills and fluency in English
              - listitem [ref=f36e94]:
                - paragraph [ref=f36e95]: "Startup mentality: resilience, adaptability, and ability to thrive in a fast-paced environment"
            - heading "What We Don't Mean by “AI Experience”" [level=2] [ref=f36e96]
            - paragraph [ref=f36e97]:
              - text: For this role, AI experience does
              - strong [ref=f36e98]: not
              - text: "mean:"
            - list [ref=f36e99]:
              - listitem [ref=f36e100]:
                - paragraph [ref=f36e101]: Using ChatGPT to generate snippets of code
              - listitem [ref=f36e102]:
                - paragraph [ref=f36e103]: Adding a single LLM API call to an application
              - listitem [ref=f36e104]:
                - paragraph [ref=f36e105]: Building a prompt wrapper and calling it an agent
              - listitem [ref=f36e106]:
                - paragraph [ref=f36e107]: Blindly accepting whatever a coding agent generates
            - paragraph [ref=f36e108]:
              - text: We are looking for engineers who think in terms of
              - strong [ref=f36e109]: agents, tools, context, orchestration, evaluation, feedback loops, and human-machine collaboration
              - text: — and who already apply these concepts in their day-to-day engineering work.
            - heading "What Success Looks Like" [level=2] [ref=f36e110]
            - paragraph [ref=f36e111]: "Within your first 12 months:"
            - list [ref=f36e112]:
              - listitem [ref=f36e113]:
                - paragraph [ref=f36e114]:
                  - strong [ref=f36e115]: "Reliability:"
                  - text: We can deploy a new agentic workflow and understand how it will perform before it reaches production because we have robust evaluation and observability systems in place.
              - listitem [ref=f36e116]:
                - paragraph [ref=f36e117]:
                  - strong [ref=f36e118]: "Speed:"
                  - text: Integrating processes from newly acquired agencies takes days rather than weeks because we have a standardized library of reusable agentic primitives.
              - listitem [ref=f36e119]:
                - paragraph [ref=f36e120]:
                  - strong [ref=f36e121]: "Efficiency:"
                  - text: A significant amount of repetitive operational work has been automated, allowing our teams to focus on the areas where human judgment and interaction create the most value.
              - listitem [ref=f36e122]:
                - paragraph [ref=f36e123]:
                  - strong [ref=f36e124]: "Engineering leverage:"
                  - text: Agentic development workflows materially increase the speed and quality at which our engineering team can build, test, and evolve software.
            - heading "Technology Stack" [level=2] [ref=f36e125]
            - paragraph [ref=f36e126]:
              - strong [ref=f36e127]: TypeScript (Primary) · Node.js · PostgreSQL · LLM Orchestration · Agentic Workflows
            - heading "Why This Might Not Be for You" [level=2] [ref=f36e128]
            - paragraph [ref=f36e129]: "This role is probably not the right fit if:"
            - list [ref=f36e130]:
              - listitem [ref=f36e131]:
                - paragraph [ref=f36e132]: You primarily want to research new models, read the latest papers, or train custom models. We are pragmatic builders rather than an AI research lab.
              - listitem [ref=f36e133]:
                - paragraph [ref=f36e134]: You prefer working from a clearly defined backlog where someone else determines what should be built.
              - listitem [ref=f36e135]:
                - paragraph [ref=f36e136]: You enjoy prototyping AI systems but are less interested in the less glamorous work required to make them reliable — evaluation, logging, error handling, observability, infrastructure, and operational edge cases.
              - listitem [ref=f36e137]:
                - paragraph [ref=f36e138]: You see AI primarily as a feature rather than a new way of designing and building software systems.
            - heading "Compensation and benefits" [level=2] [ref=f36e139]
            - list [ref=f36e140]:
              - listitem [ref=f36e141]: The role is fully remote, providing flexibility and enabling seamless collaboration with our geographically distributed team
              - listitem [ref=f36e142]: Competitive salary with the potential for equity options based on performance, recognising exceptional contributions to our integration success
            - heading "What is it like being a Dwell-er" [level=2] [ref=f36e143]
            - paragraph [ref=f36e144]:
              - text: Feel free to check out
              - link "Dwelly Core Principles" [ref=f36e145] [cursor=pointer]:
                - /url: https://docsend.com/view/7v8gwrjaky7mn895
              - text: . That’s about what we believe in, how we operate and make decisions
            - paragraph [ref=f36e146]: What we offer is not a fancy office or a static workplace. Instead, this is solving one of the world’s most complex problems in the largest consumer industry in the world (residential rentals), to improve the experience for over 30% of households (more than 5 million in the UK, and over 100 million including EU and US) that live in rental homes
            - paragraph [ref=f36e147]: This is about disrupting the largest, most antiquated industry in the world, with one of the strongest operational and technical teams that exist in the UK and the EU. We work hard, and we shoot for extremely ambitious results. But we want people to be proud of what they’ve built and be able to look back and say one day “hell yeah, that was me that did it all”
            - list [ref=f36e148]:
              - listitem [ref=f36e149]: Customer obsession rather than competitive focus
              - listitem [ref=f36e150]: Passion for invention
              - listitem [ref=f36e151]: Operational excellence
              - listitem [ref=f36e152]: Long-term thinking
          - paragraph [ref=f36e154]: By applying for this position, you consent to the processing and storage of your personal data for recruitment purposes for up to 365 days, in accordance with our data retention policy and applicable data protection laws.
