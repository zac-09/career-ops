          - definition [ref=f5e70]: Infrastructure Operations Engineer
          - term [ref=f5e71]: Work From
          - definition [ref=f5e72]:
            - generic [ref=f5e73]: Remote
        - paragraph [ref=f5e74]: We run customer apps on our own hardware in data centers around the globe. Keeping that fleet healthy, growing, and ahead of demand is the job of the infrastructure operations team.
        - link "Read more" [ref=f5e76] [cursor=pointer]:
          - /url: /jobs/infra-engineer/
      - article [ref=f5e78]:
