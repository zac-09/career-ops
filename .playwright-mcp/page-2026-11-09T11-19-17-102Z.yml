          - term [ref=f5e80]: Position title
          - definition [ref=f5e81]: "Networking Engineer: Proxy and Corrosion"
          - term [ref=f5e82]: Work From
          - definition [ref=f5e83]:
            - generic [ref=f5e84]: Remote
        - paragraph [ref=f5e85]: Agent workloads churn machines fast, and the routing state our proxy depends on changes often. That's where the interesting engineering is.
        - link "Read more" [ref=f5e87] [cursor=pointer]:
          - /url: /jobs/networking-engineer/
      - article [ref=f5e89]:
