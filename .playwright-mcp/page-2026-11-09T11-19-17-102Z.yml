        - paragraph [ref=f5e34]: Want to work on super fun problems with (arguably) likable people? Then you’ve come to the right place.
      - generic [ref=f5e35]:
        - paragraph [ref=f5e36]: "Fly.io is a fully distributed global team, and we love that. We offer a bunch of benefits and perks designed to support our diverse team:"
        - list [ref=f5e37]:
          - listitem [ref=f5e38]: A compensation structure that pays the same, no matter where you live
