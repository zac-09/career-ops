              - text: and pay bands are visible to every Sourcegraph teammate, and we strive to make our approach equitable, explainable, and competitive.Your base salary is determined by the IC4 pay band for your location zone (1-4). Our pay bands are informed by market data and designed to ensure competitive compensation wherever you live. During the recruiting process, we'll discuss the range applicable to you based on job level, relevant skills, experience, qualifications, and location zone.
            - paragraph [ref=e135]:
              - strong [ref=e136]: 💰
              - text: "The starting salary for the IC4 pay band in each zone is:"
            - list [ref=e137]:
              - listitem [ref=e138]: "Zone 2: $176,000 USD"
              - listitem [ref=e139]: "Zone 3: $132,000 USD"
              - listitem [ref=e140]: "Zone 4: $88,000 USD"
            - paragraph [ref=e141]:
              - text: 📈 In addition to competitive cash compensation, we offer meaningful equity (because when Sourcegraph succeeds, we want you to succeed, too) and generous
