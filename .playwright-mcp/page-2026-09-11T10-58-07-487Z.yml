        - generic [ref=e24]:
          - generic [ref=e25]:
            - heading "Who we are" [level=2] [ref=e26]
            - paragraph [ref=e27]: Our mission is to bring clarity and control to the world's most complex codebases. AI is accelerating code creation, but the infrastructure to understand, oversee, and evolve that code hasn't kept pace. Sourcegraph gives engineering organizations full visibility across their systems, precise context for their agents, and the ability to execute coordinated code changes at scale. As agentic development becomes the dominant engineering paradigm, we provide the context layer teams need to take control of their codebase.With Code Search, Deep Search, MCP, and Agentic Batch Changes, we deliver on that mission today - giving engineering teams and their AI tools the cross-repo context to navigate massive codebases with confidence, and the ability to make changes across hundreds of repositories at once.Companies like Stripe, Reddit, and Leidos rely on Sourcegraph to ship faster and with higher quality. We're backed by a16z, Sequoia, and Redpoint, and proud to operate as a globally distributed team that values high agency, direct communication, and customer love.If you want to build the infrastructure that lets every engineering team - and every agent they deploy - operate on their codebase with confidence, join us.
          - generic [ref=e28]:
            - heading [level=2] [ref=e29]:
              - strong [ref=e31]: Hours & location
            - paragraph [ref=e32]:
              - text: 🌎 While we hire
              - link "almost anywhere" [ref=e33] [cursor=pointer]:
                - /url: https://sourcegraph.notion.site/How-we-engage-talent-outside-of-the-US-218f7193695a46cbb1ef39ef9c1f72d4
              - text: in the world, we have a preference for someone to reside in the following locations for this role. However, if you feel qualified, we welcome you to apply regardless of location. No matter what, working hours must overlap with EST for at least 20 hours/week.
            - paragraph [ref=e34]:
              - strong [ref=e35]: "Preferred locations:"
            - list [ref=e36]:
              - listitem [ref=e37]: Europe
              - listitem [ref=e38]: North America
            - heading [level=2] [ref=e39]:
              - strong [ref=e41]: Why this job is exciting
            - paragraph [ref=e42]:
              - text: Sourcegraph is at the forefront of building AI tools to solve the biggest problems in the software industry, problems that only get bigger as codebases grow and as more of the work is done by agents. The
              - strong [ref=e43]: Code Understanding
              - text: "team owns the surfaces where that intelligence meets the developer:"
              - strong [ref=e44]: Deep Search
              - text: ", our agentic, multi-step answer engine across an enterprise's entire lineup of codebases,"
              - strong [ref=e45]: Query Assist
              - text: ", turning natural language queries into Sourcegraph query syntax,"
              - strong [ref=e46]: Smart Hovers
              - text: ", concisely summarizing symbols right where devs need it, guided diff review, and the APIs that both humans and AI agents rely on every day."
            - paragraph [ref=e47]:
              - text: Most of what makes those surfaces tick is
              - strong [ref=e48]: agent engineering
              - text: ": a blend of software engineering, machine learning, and statistics. Agent engineering tells us which model to use and when, how to retrieve and pack context, how to measure answer quality, where to fine-tune or distill a smaller model to cut costs and latency, and how to expand a single LLM call into a reliable multi-step agent. As the"
              - strong [ref=e49]: staff ML and agent engineer on Code Understanding
              - text: ", you'll be the technical owner of it: setting the tam’s direction for models, evaluations, and agentic systems, making our products measurably better, faster, and cheaper, and raising the team's fluency in building with models."
            - paragraph [ref=e50]:
              - text: This is a
              - strong [ref=e51]: staff-level role
              - text: ": we're hiring a technical leader, not just a strong individual contributor. The primary need is a production ML and evaluation authority who also builds production agent systems. You'll own the hardest, most ambiguous problems in this space, set standards others follow, and influence direction beyond your immediate team. You'll get the exhilarating chance to drive the vision on how we can provide the best code understanding experience on the market by combining our deterministic, large-scale systems and AI into experiences never seen before."
            - paragraph [ref=e52]:
              - strong [ref=e53]: "Concretely, you'll own work like:"
            - list [ref=e54]:
              - listitem [ref=e55]:
                - strong [ref=e56]: Agentic systems.
                - text: You'll design and harden the multi-step, tool-using agent loops behind current and new agentic experiences, turning research and experiments into reliable, observable, and affordable products at enterprise scale.
              - listitem [ref=e57]:
                - strong [ref=e58]: Pragmatic use of evaluations.
                - text: Crafting agentic products means needing to tell when a change actually helped, which is hard when agents keep changing and the product keeps shifting. You'll bring judgment about where evaluations earn their keep, when to use targeted smoke tests and metrics, and how to avoid noise dressed up as rigor, so we can move fast with confidence.
              - listitem [ref=e59]:
                - strong [ref=e60]: "Models: selection, upgrading, and training."
                - text: You'll decide which models we run where, drive upgrades, and fine-tune our own when that's the right call.
              - listitem [ref=e61]:
                - strong [ref=e62]: Retrieval and context engineering.
                - text: You'll push on how we ground models in a customer's code - retrieval, ranking, context windows, citations - to make answers more accurate and verifiable.
              - listitem [ref=e63]:
                - strong [ref=e64]: Cost and latency.
                - text: Every surface has a per-user economic budget. You'll treat cost and latency as product features, and profile, distill, cache, and right-size models so we can ship ambitious features sustainably.
            - paragraph [ref=e65]: "You'll do this on a small, senior-leaning team that ships quickly, owns a lot of product surface, and has streamlined product management: engineers here talk to customers, frame the problem, and own it end-to-end. You'll have real agency over technical direction and a direct line to the impact of your work."
            - paragraph [ref=e66]:
              - strong [ref=e67]: 📅 Within one month, you will…
            - list [ref=e68]:
              - listitem [ref=e69]: Get the Code Understanding products and their model/agent pipelines running end-to-end locally, and land your first improvements to a model, prompt, retrieval path, or eval.
              - listitem [ref=e70]: Build a clear picture of where the AI engineering pain is, and the product surfaces most constrained by them.
              - listitem [ref=e71]: Get to know the team and our customers, and start forming your own opinions about where our agentic products should go next.
              - listitem [ref=e72]: Join the team's on-call support rotation.
            - paragraph [ref=e73]:
              - strong [ref=e74]: 📅 Within three months, you will…
            - list [ref=e75]:
              - listitem [ref=e76]: Own a meaningful agentic slice of the product end-to-end, driving it from problem-framing through rollout and measurement.
              - listitem [ref=e77]: "Establish how the team ships model and prompt changes responsibly: the evals, dashboards, and guardrails that make quality and cost regressions visible before customers feel them."
              - listitem [ref=e78]: Begin up-leveling teammates in building with models by pairing with them, reviewing their code, and modeling good agent engineering instincts.
            - paragraph [ref=e79]:
              - strong [ref=e80]: 📅 Within six months, you will…
            - list [ref=e81]:
              - listitem [ref=e82]: Be the recognized technical authority for agent engineering and agentic systems on Code Understanding. You will be the person teammates, and increasingly the wider department, defer to on model, eval, and agent-design decisions.
              - listitem [ref=e83]: "Have measurably moved the products: better answer quality, lower cost/latency, or new agentic capabilities that weren't feasible before."
              - listitem [ref=e84]: Be setting the direction of the team's roadmap where it intersects agents, bringing conviction, backed by evidence, about which bets are worth making, and pulling other engineers up to execute on them.
            - heading [level=2] [ref=e85]:
              - strong [ref=e87]: About you
            - paragraph [ref=e88]:
              - text: You are a
              - strong [ref=e89]: staff engineer and technical leader with hard-won skills across production machine learning, evaluation, and agent systems
              - text: . This high-leverage role relies on your ability to make sound model and evaluation decisions for a fast-moving product, build the production systems around them, steer technical direction, and be a force multiplier for a talented, product-minded team. You're equally comfortable reasoning about an eval harness, a fine-tuning run, a retrieval pipeline, and the multi-step agent loop that ties them together, and you make everyone around you better at all of it.
            - paragraph [ref=e90]: "You operate at staff scope: you own the most ambiguous, highest-risk problems in your domain, go into whatever codebase a problem requires, set standards and patterns others adopt, and translate fluidly between engineering goals and business objectives. You influence direction beyond your immediate team. You lead through technical excellence and mentorship."
            - list [ref=e91]:
              - listitem [ref=e92]:
                - strong [ref=e93]: You have personally owned a production model lifecycle.
                - text: You have trained or fine-tuned at least one model and taken it from dataset construction through evaluation, production rollout, and monitoring. You can explain how you chose between training or fine-tuning and prompting or retrieval, how you chose baselines and metrics, what error analysis revealed, and how production evidence affected the next version.
              - listitem [ref=e94]:
                - strong [ref=e95]: You build agents, fluently and opinionatedly.
                - text: You've designed multi-step agentic systems and made them reliable, observable, and cost-bounded. You have a point of view on where agents shine and where deterministic code or human judgment is required.
              - listitem [ref=e96]:
                - strong [ref=e97]: You have strong evaluation judgment.
                - text: You build representative datasets, meaningful baselines, useful error taxonomies, and release criteria that connect offline measurements to production behavior. You know where rigorous evaluations earn their keep, where lightweight smoke tests or qualitative review are enough, and where a precise-looking metric is misleading.
              - listitem [ref=e98]:
                - strong [ref=e99]: You treat cost and latency as product constraints.
                - text: You make measured quality, latency, and cost tradeoffs and use the appropriate combination of model selection, prompting, retrieval, caching, distillation, and fine-tuning rather than reaching reflexively for a more complex model.
              - listitem [ref=e100]:
                - strong [ref=e101]: You operate autonomously on ambiguous problems.
                - text: Given a rough product idea, a few customer quotes, and a Slack thread, you come back with a plan, a prototype, milestones, and a point of view on tradeoffs, without it being pre-scoped. You own high-technical-risk projects end-to-end.
              - listitem [ref=e102]:
                - strong [ref=e103]: You contribute beyond your domain.
                - text: As a senior IC, you go into whatever part of the codebase a problem requires, recognize issues beyond your immediate area, and translate between engineering goals and business objectives.
              - listitem [ref=e104]:
                - strong [ref=e105]: You up-level the people around you.
                - text: You mentor by pairing on hard problems, providing substantive design and code reviews, and spreading agent engineering literacy across the team. You see investing in your teammates' growth as part of the job.
              - listitem [ref=e106]:
                - strong [ref=e107]: You're customer and product-driven.
                - text: You're comfortable on customer calls and in feedback threads, you turn raw signals into requirements, scopes, and milestones, and you push back when feedback would lead the product astray.
              - listitem [ref=e108]:
                - strong [ref=e109]: You're pragmatic, not a perfectionist.
                - text: You ship the smallest correct thing, prefer robust solutions over complicated ones, and keep a high-quality bar with simplicity.
            - paragraph [ref=e110]: "On the engineering fundamentals:"
            - list [ref=e111]:
              - listitem [ref=e112]: You're a strong software engineer who can ship production services.
              - listitem [ref=e113]: You're comfortable across our stack - Go on the backend, TypeScript on the frontend, GraphQL, Postgres, Docker - or you're clearly able and eager to get there.
              - listitem [ref=e114]: You're fluent with agentic coding tools, and you understand and own every line it submits.
              - listitem [ref=e115]: You're comfortable in an async-first, multi-service, fast-paced remote environment.
            - paragraph [ref=e116]: "Nice-to-haves:"
            - list [ref=e117]:
              - listitem [ref=e118]: "You've shipped an LLM-powered or agentic developer-facing product you can speak about opinionatedly: what worked, what didn't, what you'd do differently."
              - listitem [ref=e119]: You've fine-tuned, distilled, or trained models to meet cost, latency, or quality targets in production.
              - listitem [ref=e120]: Experience with retrieval, ranking, embeddings, or search relevance.
              - listitem [ref=e121]: Experience working directly with enterprise customers and translating their needs into a product.
              - listitem [ref=e122]: Experience mentoring or up-leveling engineers, especially raising a team's agent engineering fluency.
            - heading [level=2] [ref=e123]:
              - strong [ref=e125]: Level
            - paragraph [ref=e126]:
              - text: 📊 This job is an IC4. You can read more about
              - link "our job leveling philosophy" [ref=e127] [cursor=pointer]:
                - /url: https://www.notion.so/sourcegraph/Leveling-Guide-0e1b5c76ada64b9caac387f8b7c4fc66
              - text: in our Handbook.
            - heading [level=2] [ref=e128]:
              - strong [ref=e130]: Compensation
            - paragraph [ref=e131]:
              - strong [ref=e132]: 💸
              - text: We pay above-market salaries because we want to hire exceptional people who can focus on building great products, not worrying about paying bills. As an
              - link "open and transparent" [ref=e133] [cursor=pointer]:
                - /url: https://sourcegraph.notion.site/Mission-values-e9d37e6b972a4ef395c3076aea2bd07d
              - text: company, our
