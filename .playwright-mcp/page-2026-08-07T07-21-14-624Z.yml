        - heading "Remote, but grounded" [level=2] [ref=f32e161]
        - paragraph [ref=f32e162]: You can live anywhere within +4GMT to -10GMT time zones, but the work is serious. This isn't about juggling multiple side projects or working from the beach. It's about access to meaningful opportunities, wherever you call home.
