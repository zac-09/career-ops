            - paragraph [ref=f18e61]: "We believe all Zapiens should be rewarded competitively and equitably, using practices that are simple and transparent. This philosophy ensures we’re able to find, grow, and retain exceptional people from a broad range of backgrounds. Here’s how we define our compensation principles:"
            - list [ref=f18e62]:
              - listitem [ref=f18e63]:
                - paragraph [ref=f18e64]: "Competitive: Zapier pays well among the technology sector."
              - listitem [ref=f18e65]:
                - paragraph [ref=f18e66]: "Equitable: Consistent pay practices; Pay for impact"
              - listitem [ref=f18e67]:
                - paragraph [ref=f18e68]: "Simple: Pay is well understood, and pay practices are built for scale."
              - listitem [ref=f18e69]:
                - paragraph [ref=f18e70]: "Transparent: Zapiens know how pay works, including how their pay is determined."
            - paragraph [ref=f18e71]
            - paragraph [ref=f18e72]:
              - text: A Candidate's compensation package is finalized once the interview process is concluded and accounts for demonstrated experience, job knowledge, skills, abilities, and internal equity. We use a business impact approach to base pay, which means we set pay for all Zapiens based on their demonstrated impact on Zapier’s success. In alignment with that philosophy, the upper half of a pay range is typically reserved for individuals who have consistently demonstrated a high impact in their current role and level while at Zapier.
              - text: For more information on Zapier’s Total Rewards please click
              - link "here" [ref=f18e73] [cursor=pointer]:
                - /url: https://zapier.com/l/jobs/total-rewards
              - text: .
