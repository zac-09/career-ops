              - text: ", we build and use automation every day to make work more efficient, creative, and human. So if you’re using AI tools while applying here - that’s great! We just ask that you use them"
              - strong [ref=f18e85]: responsibly and transparently
              - text: .
            - paragraph [ref=f18e86]:
              - text: Check out our guidance on
              - link "How to Collaborate with AI During Zapier’s Hiring Process" [ref=f18e87] [cursor=pointer]:
                - /url: https://zapier.com/l/jobs/ai-at-zapier
