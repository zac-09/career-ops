      - generic [ref=f11e113]:
        - heading "Our transparent application process" [level=2] [ref=f11e114]
        - list [ref=f11e116]:
          - listitem [ref=f11e117]:
            - strong [ref=f11e118]: "Submit your application:"
            - text: Start by filling out the online application and responding to the form questions. We encourage you to explore
            - link "our blog" [ref=f11e119] [cursor=pointer]:
              - /url: /inspiration/category/remote-work
            - text: to get a feel for our company, values, and products. We carefully review and respond to every candidate’s application.
          - listitem [ref=f11e120]:
            - strong [ref=f11e121]: "Interviews, salary transparency, and task assignment:"
            - text: If your application moves forward, you’ll hear from us to schedule your first interview over Google Meet. At the same time, we’ll share the proposed salary range for the role, calculated using our formula-based compensation model. Salaries are benchmarked to industry data and adjusted for your location, so you can decide early on whether it’s a fit. The rest of the process will include additional interviews and a task assignment, depending on the role. We vary the sequence to fit the scope and team, but you’ll always have a chance to showcase your skills and get a clear picture of the work, the team, and our values.
          - listitem [ref=f11e122]:
            - strong [ref=f11e123]: "Reference and background check:"
            - text: Before we make an offer, we’ll conduct reference checks to better understand how you work and what strengths you bring. We also run background checks as part of our process, both to meet compliance requirements and to help ensure a safe, trusted environment for everyone. We’ll always let you know before either step begins.
          - listitem [ref=f11e124]:
            - strong [ref=f11e125]: "Decision:"
            - text: Once all steps are complete, the hiring committee will make a final decision. If we move forward, you’ll receive an official offer to join the team. Either way, you’ll hear from us. We never leave candidates hanging.
          - listitem [ref=f11e126]:
            - strong [ref=f11e127]: "Onboarding and mentorship:"
            - text: Before your first day, you’ll get access to a carefully curated Todoist project that maps out your onboarding journey. You’ll also be paired with a mentor and have the chance to co-work in person with them for a week, wherever they’re based. It’s our way of making sure you feel connected, supported, and set up to thrive.
      - generic [ref=f11e129]:
        - heading "A company that supports your ambitious goals and personal wellbeing" [level=2] [ref=f11e130]
        - generic [ref=f11e132]:
          - generic [ref=f11e133]:
            - heading "The basics" [level=3] [ref=f11e135]
            - list [ref=f11e136]:
              - listitem [ref=f11e137]:
                - generic [ref=f11e140]:
                  - heading "Work from anywhere" [level=4] [ref=f11e141]
                  - paragraph [ref=f11e142]: Todoisters can work from anywhere in the world. We never place restrictions on locations.
              - listitem [ref=f11e143]:
                - generic [ref=f11e146]:
                  - heading "Design your own schedule" [level=4] [ref=f11e147]
                  - paragraph [ref=f11e148]: Work during the time of day that’s best for you. Todoisters are encouraged to work 8-hour days and no more than 40 hours/week.
              - listitem [ref=f11e149]:
                - generic [ref=f11e152]:
                  - heading "Negotiation-free compensation package" [level=4] [ref=f11e153]
                  - paragraph [ref=f11e154]: Our formula-based salaries are calculated based on industry-benchmarked skills and geographical location – no stressful negotiation required.
          - generic [ref=f11e155]:
            - heading "Expand your professional skills" [level=3] [ref=f11e157]
            - list [ref=f11e158]:
              - listitem [ref=f11e159]:
                - generic [ref=f11e162]:
                  - heading "Continue your education" [level=4] [ref=f11e163]
                  - paragraph [ref=f11e164]: You’ll have a recurring budget to spend on attending conferences, taking courses, and purchasing books.
              - listitem [ref=f11e165]:
                - generic [ref=f11e168]:
                  - heading "Collaborate in-person at retreats" [level=4] [ref=f11e169]
                  - paragraph [ref=f11e170]: Our team- and company-wide retreats are unforgettable. The connections that we make in person inspire us throughout the year.
          - generic [ref=f11e171]:
            - heading "Craft your ideal work environment" [level=3] [ref=f11e173]
            - list [ref=f11e174]:
              - listitem [ref=f11e175]:
                - generic [ref=f11e178]:
                  - heading "Cozy up at a coworking space" [level=4] [ref=f11e179]
                  - paragraph [ref=f11e180]: Find the coworking space that’s right for you and Todoist will cover the expense.
              - listitem [ref=f11e181]:
                - generic [ref=f11e184]:
                  - heading "Subscribe to apps and services" [level=4] [ref=f11e185]
                  - paragraph [ref=f11e186]: "You’ll have a monthly budget to spend on services that help you do your job: home internet, work apps, music subscription, etc."
              - listitem [ref=f11e187]:
                - generic [ref=f11e190]:
                  - heading "Purchase the hardware you need" [level=4] [ref=f11e191]
                  - paragraph [ref=f11e192]: Every Todoister has access to a recurring budget to spend on work-related equipment.
          - generic [ref=f11e193]:
            - heading "Focus on your wellbeing" [level=3] [ref=f11e195]
