        - generic [ref=f44e17]:
          - heading [level=2] [ref=f44e18]
          - heading [level=2] [ref=f44e19]:
            - strong [ref=f44e20]: About Sand
          - paragraph [ref=f44e21]:
            - link "Sand Technologies" [ref=f44e22] [cursor=pointer]:
              - /url: https://www.sandtech.com/
            - text: is a global Physical AI company using data and AI to make critical industries work better. We partner with governments, cities and enterprises to improve how essential systems operate across healthcare, water, energy, telecommunications and infrastructure.
          - paragraph [ref=f44e23]: Our work delivers proven real-world impact. We have built AI systems that help manage London’s water supply, supported telecom network planning across hundreds of cities, and developed digital healthcare platforms serving tens of millions of people across Africa. From intelligent command centers to AI-powered infrastructure platforms, we help organizations sense, analyze and act in complex environments.
          - paragraph [ref=f44e24]: Our people are ambitious, curious and relentlessly practical. Our teams work alongside clients in the field, solving hard problems and deploying solutions that last. With colleagues across Africa, Europe, the UK and the US, we operate across the full stack - from research and engineering to deployment and capability building.
          - paragraph [ref=f44e25]: "Our mission is simple: to harness AI to solve humanity’s most pressing challenges."
          - heading [level=2] [ref=f44e26]:
            - strong [ref=f44e27]: About the role
          - paragraph [ref=f44e28]: We are seeking an experienced Senior Software Engineer to join our Telco Product team. This is a permanent role. You will be expected to build and maintain production grade code from the backend.
          - paragraph [ref=f44e29]: "Our delivery squads run deliberately small software engineering teams, so this role must be genuinely full-stack and self-sufficient: designing and building backend engineering tasks within our product solution. You will take direction from the Technical Lead and turn it into shipped, production-quality features, while setting the engineering standards mid-level colleagues build on."
          - paragraph [ref=f44e30]: We work in cross functional teams so our Data Scientists and Data Engineers handle model creation and data pipelines, you will be expected to help in the deployment of these models and data pipelines and also build secure, scalable and quality code in our product solution components.
          - heading [level=2] [ref=f44e31]:
            - strong [ref=f44e32]: What you’ll do
          - list [ref=f44e33]:
            - listitem [ref=f44e34]:
              - strong [ref=f44e35]: "Build solutions end to end:"
              - text: Design, build and maintain the back-end services(Integration to APIs, build python modules etc.).
            - listitem [ref=f44e36]:
              - strong [ref=f44e37]: "Own engineering standards:"
              - text: Set up or main CI/CD pipelines, environments, testing, code review and observability on AWS, and establish practices a small cross-functional squad can sustain at pace.
            - listitem [ref=f44e38]:
              - strong [ref=f44e39]: "Integrate with AI and data:"
              - text: Collaborate closely with data engineering and data science specialists on integration points, consuming their pipelines, integrating AI/model outputs into the product and deploying these models or pipelines.
            - listitem [ref=f44e40]:
              - strong [ref=f44e41]: "Deploy and run on AWS:"
              - text: Build and deploy code on AWS (e.g. ECS, containers etc.), ensuring availability, security and low-latency performance.
            - listitem [ref=f44e42]:
              - strong [ref=f44e43]: "Ship and support:"
              - text: Translate the Technical Lead’s decisions into working software; support end-to-end testing and the user acceptance testing phase.
            - listitem [ref=f44e44]:
              - strong [ref=f44e45]: "Mentor:"
              - text: Guide mid-level engineers, fostering continuous technical improvement in small teams.
          - heading [level=2] [ref=f44e46]:
            - strong [ref=f44e47]: Who you are
          - list [ref=f44e48]:
            - listitem [ref=f44e49]: 5+ years of software engineering experience with a proven track record of deploying robust, production software – ideally with exposure to telco or other critical/smart-infrastructure environments.
            - listitem [ref=f44e50]: Full-stack with a strong focus on backend engineering (Python, Go, Ruby, Node or C#), DevOps and end to end solution design.
            - listitem [ref=f44e51]: Production experience deploying and running software on a major cloud platform – AWS strongly preferred (Managed AWS Airflow, ECS, containers).
            - listitem [ref=f44e52]: Strong software design skills, with a solid grasp of authentication/security and integration with data services.
            - listitem [ref=f44e53]: Experience with automated testing (unit, component and BDD testing) and CI/CD.
            - listitem [ref=f44e54]: Able to work autonomously, own features end to end in a small team, and communicate clearly with distributed colleagues and client-side stakeholders in regulated environments and the ability to estimate features with a high degree of confidence.
          - heading [level=2] [ref=f44e55]:
            - strong [ref=f44e56]: Desirable
          - list [ref=f44e57]:
            - listitem [ref=f44e58]: Experience with building reusable software modules preferably in Python.
            - listitem [ref=f44e59]: Experience with orchestration tools such as Airflow etc.
            - listitem [ref=f44e60]: Experience with MLOps.
            - listitem [ref=f44e61]: Experience mentoring mid-level or junior engineers.
            - listitem [ref=f44e62]: B.Sc. or M.Sc. in Computer Science, Software Engineering or a related field.
          - heading [level=2] [ref=f44e63]:
            - strong [ref=f44e64]: How we work
          - paragraph [ref=f44e65]: Due to the highly collaborative and internationally distributed nature of our work, successful candidates must be comfortable operating in small teams while contributing to larger, globally coordinated efforts. A strong sense of ownership, self-motivation and discipline in maintaining clear and consistent communication through virtual collaboration tools and video conferencing is essential.
