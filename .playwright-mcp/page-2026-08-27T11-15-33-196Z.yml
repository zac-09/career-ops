              - strong [ref=f114e81]: Who we are
            - paragraph [ref=f114e82]: Moniepoint Inc. is Africa’s all-in-one financial ecosystem, helping 10 million businesses and individuals access seamless payments, banking, credit, and business management tools since 2019.As Nigeria’s largest merchant acquirer, Moniepoint Inc. powers most of the country’s point-of-sale (POS) transactions. Through its subsidiaries, Moniepoint Inc. processes $22 billion monthly for its customers while operating profitably.
            - paragraph [ref=f114e83]:
              - strong [ref=f114e84]: About the role
            - paragraph [ref=f114e85]: We’re looking for a Full-Stack Engineer to join the Moniepoint team. The ideal candidate has strong experience with Node.js and TypeScript, and is proficient in at least one object-oriented programming language (e.g., Java, C#, etc.). You’ll be building scalable backend services and intuitive frontend interfaces that power financial services used by millions. This role requires a problem-solver with a builder mindset and the ability to work across the stack to deliver high-impact features.
            - paragraph [ref=f114e86]: "Location: Remote (Full-time)"
            - paragraph [ref=f114e87]:
              - strong [ref=f114e88]: What you’ll get to do
            - list [ref=f114e89]:
              - listitem [ref=f114e90]: Work with developers to design algorithms and flowcharts
              - listitem [ref=f114e91]: Produce clean, efficient code based on specifications
              - listitem [ref=f114e92]: Integrate software components and third-party programs
              - listitem [ref=f114e93]: Verify and deploy programs and systems
              - listitem [ref=f114e94]: Troubleshoot, debug and upgrade existing software
              - listitem [ref=f114e95]: Gather and evaluate user feedback
              - listitem [ref=f114e96]: Recommend and execute improvements
              - listitem [ref=f114e97]: Create technical documentation for reference and reporting
            - paragraph [ref=f114e98]:
              - strong [ref=f114e99]: To succeed in this role, we think you should have
            - list [ref=f114e100]:
              - listitem [ref=f114e101]: 7-10 years of experience as a Software Developer, Software Engineer or similar role
              - listitem [ref=f114e102]: 5+ years of MERN stack experience
              - listitem [ref=f114e103]: 2+ years of OOP language like Java, C# etc.
              - listitem [ref=f114e104]: Familiarity with Agile development methodologies
              - listitem [ref=f114e105]: Experience with software design and development in a test-driven environment
              - listitem [ref=f114e106]: Knowledge of coding languages (e.g. Javascript, Typescript) and frameworks/systems (e.g. ReactJS, Node.js, ExpressJs, Git)
              - listitem [ref=f114e107]: Experience with databases (MySQL, Mongo) and Object-Relational Mapping (ORM) frameworks
              - listitem [ref=f114e108]: Ability to learn new languages and technologies
              - listitem [ref=f114e109]: Excellent communication skills
              - listitem [ref=f114e110]: Resourcefulness and troubleshooting aptitude
              - listitem [ref=f114e111]: BSc/BA in Computer Science, Engineering or a related field
            - paragraph [ref=f114e112]:
              - strong [ref=f114e113]: Some of the technologies you’ll get to work with
            - list [ref=f114e114]:
              - listitem [ref=f114e115]: Javascript & Typescript
              - listitem [ref=f114e116]: ReactJS and NodeJS
              - listitem [ref=f114e117]: Docker and Kubernetes
              - listitem [ref=f114e118]: MySQL, MSSQL, Redis
              - listitem [ref=f114e119]: Microservices architecture on AWS
            - paragraph [ref=f114e120]:
              - strong [ref=f114e121]: What we can offer you
            - list [ref=f114e122]:
              - listitem [ref=f114e123]: Culture -We put our people first and prioritize the well-being of every team member. We’ve built a company where all opinions carry weight and where all voices are heard. We value and respect each other and always look out for one another. Above all, we are human.
              - listitem [ref=f114e124]: Learning - We have a learning and development-focused environment with an emphasis on knowledge sharing, training, and regular internal technical talks.
              - listitem [ref=f114e125]: Compensation - You’ll receive an attractive salary, pension, health insurance, annual bonus, plus other benefits.
