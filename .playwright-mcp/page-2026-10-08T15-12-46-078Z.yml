              - heading [level=3] [ref=f49e120]:
                - strong [ref=f49e121]: How you’ll plan your day (and life)
              - paragraph [ref=f49e122]:
                - text: We work async at Remote which means you can plan your schedule around your life (and not around meetings). Read more at
                - link "remote.com/async" [ref=f49e123] [cursor=pointer]:
                  - /url: https://remote.com/async
                - text: .
              - paragraph [ref=f49e124]:
                - text: You will be empowered to take ownership and be proactive. When in doubt you will default to action instead of waiting. Your
                - strong [ref=f49e125]: life-work balance
                - text: is important and you will be encouraged to put yourself and your family first, and fit work around your needs.
              - paragraph [ref=f49e126]: If that sounds like something you want, apply now!
            - generic [ref=f49e127]:
              - paragraph [ref=f49e128]: Remote's Total Rewards philosophy is to ensure fair, unbiased compensation and fair equity pay along with competitive benefits in all locations in which we operate. We do not agree to or encourage cheap-labor practices and therefore we ensure to pay locally competitive rates. We hope to inspire other companies to support global talent-hiring and bring local wealth to developing countries.
              - paragraph [ref=f49e129]: At first glance our salary bands seem quite wide - here is some context. At Remote we have international operations and a globally distributed workforce. We use geo ranges to consider geographic pay differentials as part of our global compensation strategy to remain competitive in various markets while we hire globally.
              - paragraph [ref=f49e130]: Our salary ranges are determined by role, level and location, and our job titles may span more than one career level. The interviewer will share further details with the candidate on the more restricted pay range for the role in line with their specific location. The individual pay for the successful candidate in this role is dependent upon many factors such as location, transferable or job-related skills, work experience, relevant training, business needs, internal parity and market demands. The base salary range may be subject to change.
              - paragraph [ref=f49e131]: At Remote, we foster internal mobility as a key element of our culture of employee growth and development, supported by a compensation philosophy that guarantees pay equity and fairness. Therefore, all compensation changes associated with an internal move will be reviewed by the Total Rewards & People Enablement team on a case by case basis.
              - paragraph [ref=f49e132]: The annual salary range for this full-time position is $53,300 to $149,800.
