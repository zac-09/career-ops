          - heading "Senior Backend Engineer" [level=1] [ref=f49e41]
          - generic [ref=f49e42]:
            - paragraph [ref=f49e43]: You'll be joining a team of engineers across Frontend, Backend, SRE and QA. We're organised into cross-functional development teams assigned to specific verticals.
            - paragraph [ref=f49e44]: This role is open for several teams, and we will define the exact team that you will be joining during the interview process based on the business needs and your preferences.
            - paragraph [ref=f49e45]: Regardless of the specific team, you will be working on building tools, APIs and integrations for one of our products.
            - paragraph [ref=f49e46]: Our backend is built with Elixir and Phoenix, with a Postgres database. We use React and Nextjs for our front-end. Gitlab is used as a version control tool, issue tracker and a CI/CD solution. Our applications are hosted on AWS. We fully rely on our CI for deployments and deploy multiple times per day.
            - paragraph [ref=f49e47]: "You can also check out this Keynote to learn how we evolved Remote's architecture and organisation to support a fast pace. We explore domain boundaries and dependency management alongside worker separation. You will also hear about ownership driven observability: https://www.youtube.com/watch?v=02r5xP2BgNk."
          - generic [ref=f49e48]:
            - heading "Job Description" [level=2] [ref=f49e49]
            - generic [ref=f49e50]:
              - heading [level=3] [ref=f49e51]:
                - strong [ref=f49e53]: What you bring
              - list [ref=f49e54]:
                - listitem [ref=f49e55]: Strong engineering fundamentals and a track record of shipping production systems that are secure, reliable, and scalable.
                - listitem [ref=f49e56]: Practical experience designing or adopting agentic/automation workflows (or comparable systems) and improving them through iteration.
                - listitem [ref=f49e57]: "Ability to think in systems: define specs clearly, break down plans, instrument verification, and close the loop on quality."
                - listitem [ref=f49e58]: Postgres (or similar).
                - listitem [ref=f49e59]: CI/CD (GitLab, Github, Jenkins or similar).
                - listitem [ref=f49e60]:
                  - strong [ref=f49e61]: Demonstrates strong automation and AI capabilities and AI fluency.
              - heading [level=3] [ref=f49e62]:
                - strong [ref=f49e63]: Nice to have
              - list [ref=f49e64]:
                - listitem [ref=f49e65]: Kubernetes
                - listitem [ref=f49e66]: Docker
                - listitem [ref=f49e67]: AWS
                - listitem [ref=f49e68]: Nextjs
                - listitem [ref=f49e69]: React/Vue/Angular
              - heading [level=3] [ref=f49e70]:
                - strong [ref=f49e72]: Key Responsibilities
              - list [ref=f49e73]:
                - listitem [ref=f49e74]: Lead the development of major team-scoped projects, participate in cross-team initiatives for Remote's HR and Payroll products.
                - listitem [ref=f49e75]: "Actively participate in product work in the team: provide feedback, suggest solutions to the problems. Use technical insights and expertise to suggest product improvements."
                - listitem [ref=f49e76]: Maintain good understanding of the team’s domain, both from product and engineering sides.
                - listitem [ref=f49e77]: Provide feedback on code reviews.
                - listitem [ref=f49e78]: Contribute to the shared codebase.
                - listitem [ref=f49e79]: Debug and solve technical and business issues.
                - listitem [ref=f49e80]: Participate in non-team activities, such as support rotations, hiring process, RFC discussions, etc.
                - listitem [ref=f49e81]: Mentor and provide guidance to other engineers.
                - listitem [ref=f49e82]: Investigate, propose and participate in implementation of improvements to our platform.
                - listitem [ref=f49e83]: Implement interfaces with performance, accessibility, and API design in mind.
                - listitem [ref=f49e84]: Redesign how engineering work ships with autonomous agents as the default execution layer
                - listitem [ref=f49e85]: Propose and operationalize agentic workflows end-to-end (spec → plan → execute → verify) to deliver outcomes faster.
                - listitem [ref=f49e86]: Build reusable agentic workflows and primitives in the codebase so teams can apply them repeatedly across domains.
                - listitem [ref=f49e87]: Use verification loops (tests, checks, evals, guardrails) to ensure results are correct, secure, reliable, and scalable.
          - generic [ref=f49e88]:
            - heading "Benefits" [level=2] [ref=f49e89]
            - generic [ref=f49e90]:
              - heading [level=3] [ref=f49e91]:
                - strong [ref=f49e93]: What this job can offer you
              - list [ref=f49e94]:
                - listitem [ref=f49e95]: Complex and meaningful challenges — solving them will enable people and businesses to live and operate in any country of the world.
                - listitem [ref=f49e96]: Opportunity to have a significant impact on the business — we are still very early in our journey as a company, and each change you make today is amplified by the company's growth.
                - listitem [ref=f49e97]: A lot of freedom to organize your work and life — you are not bound to daily standups, recurring meetings or other ceremonies.
                - listitem [ref=f49e98]: Competitive salary, stock options, flexible paid time off, and a set of perks and benefits.
                - listitem [ref=f49e99]: A supportive and kind work environment where we would like you to challenge the dogmas and pursue innovation!
                - listitem [ref=f49e100]: Strong team of experienced engineers who will support and facilitate your professional growth.
          - generic [ref=f49e101]:
            - heading "Compensation" [level=2] [ref=f49e102]
            - generic [ref=f49e103]:
              - heading [level=3] [ref=f49e104]:
                - strong [ref=f49e106]: Benefits
              - paragraph [ref=f49e107]:
                - text: Our full benefits & perks are explained in our handbook at
