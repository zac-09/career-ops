              - heading [level=3] [ref=f49e160]:
                - strong [ref=f49e162]: How to apply
              - list [ref=f49e163]:
                - listitem [ref=f49e164]: Please fill out the form below and upload your CV with a PDF format.
                - listitem [ref=f49e165]:
                  - strong [ref=f49e166]: We kindly ask you to submit your application and CV in English, as this is the standardised language we use here at Remote.
                - listitem [ref=f49e167]: If you don’t have an up to date CV but you are still interested in talking to us, please feel free to add a copy of your LinkedIn profile instead.
              - paragraph [ref=f49e168]: Not only do we encourage folks from all ethnic groups, genders, sexuality, age, abilities, disability status and any other under-represented group to apply, but we prioritize a sense of belonging. We have 4 ERGs (Women, Disability, Queer, Minorities in Tech) who meet regularly with the People team. During your interviews and beyond, we ask & encourage anybody who needs an accommodation to request one from their recruiter.
              - paragraph [ref=f49e169]: We will ask you to voluntarily tell us your pronouns at interview stage, and you will have the option to answer our anonymous demographic questionnaire when you apply below. As an equal employment opportunity employer it’s important to us that our workforce reflects people of all backgrounds, identities, and experiences and this data will help us to stay accountable. We thank you for providing this data, if you chose to.
              - paragraph [ref=f49e170]:
                - text: At Remote, we embrace AI as a valuable tool while prioritizing human creativity and authenticity. We look forward to meeting candidates who balance innovation with genuine expertise and experience. To learn more about Remote's AI guidelines check see
                - link "here" [ref=f49e171] [cursor=pointer]:
