                  - /url: http://remote.com/r/benefits
                - text: ". As a global company, each country works differently, but some benefits/perks are for all Remoters:"
              - list [ref=f49e109]:
                - listitem [ref=f49e110]: work from anywhere
                - listitem [ref=f49e111]: flexible paid time off
                - listitem [ref=f49e112]:
