    - generic [ref=f68e61]:
      - generic [ref=f68e66]:
        - heading "Curious minds. Real ownership. Shared mission." [level=1] [ref=f68e67]
        - paragraph [ref=f68e69]: We believe generosity deserves better. Join the people changing it.
        - link "View open roles" [ref=f68e71] [cursor=pointer]:
          - /url: "#careers-jobs-list-table"
      - button "Play video" [ref=f68e89] [cursor=pointer]
    - generic [ref=f68e92]:
      - heading "Who we are" [level=2] [ref=f68e93]
      - generic [ref=f68e96]:
        - paragraph [ref=f68e97]: "Fundraise Up is a nonprofit fundraising platform that has transformed the donation experience for donors. We built it around the modern donor and their needs: global, privacy-compliant and AI-first. By reimagining traditional donation forms, we’ve helped thousands of organizations increase their conversion rates, grow their monthly donor file, and capture more revenue from every giving opportunity."
        - paragraph [ref=f68e98]: Nonprofits deserve better technology, and generosity deserves better infrastructure. That belief shapes everything we build from frictionless checkout experiences to intelligent optimization tools that ultimately help mission-driven organizations deliver on their mission.
        - paragraph [ref=f68e99]: "Curiosity drives how we operate: thinking beyond convention, exploring what motivates donor behavior, and reimagining technology around the donor experience. We’re a team of builders, strategists, and problem-solvers. We bring a global perspective to our work, collaborating across countries and showing up with an unwavering commitment to the nonprofits we serve."
    - generic [ref=f68e104]:
      - heading "Our values" [level=2] [ref=f68e105]
      - generic [ref=f68e107]:
        - paragraph [ref=f68e108]: "Donor experience is the growth engine of modern fundraising. Everything we build, design, and deliver is grounded in a simple belief: when the donor experience improves, generosity grows. These values shape how we show up for nonprofits, donors, and each other."
        - paragraph [ref=f68e109]: We attract and hire people who want to build, a culture where experimentation is encouraged, ownership is expected, and where honest collaboration drives better outcomes.
      - generic [ref=f68e112]:
        - generic [ref=f68e115]:
          - heading "Continuous innovation" [level=3] [ref=f68e116]
          - paragraph [ref=f68e117]: Bold ideas, no rigid playbooks. We push what’s possible for nonprofits and the donors who support them.
        - generic [ref=f68e120]:
          - heading "Ownership" [level=3] [ref=f68e121]
          - paragraph [ref=f68e122]: Real responsibility, real impact, roles that matter. When a nonprofit raises more, we feel it. When they don’t, we fix it.
        - generic [ref=f68e125]:
          - heading "Candid collaboration" [level=3] [ref=f68e126]
          - paragraph [ref=f68e127]: Low ego, direct communication, trust that drives results. The best ideas come from people who collaborate without politics.
    - generic [ref=f68e130]:
      - heading "Ready to build with us?" [level=2] [ref=f68e131]
      - paragraph [ref=f68e133]: Explore open roles and discover where you can make an impact.
      - link "View open roles" [ref=f68e135] [cursor=pointer]:
        - /url: "#careers-jobs-list-table"
    - generic [ref=f68e139]:
      - heading "Our team" [level=2] [ref=f68e140]
      - paragraph [ref=f68e156]: At Fundraise Up, our team spans the globe from Brooklyn to Lisbon, Buenos Aires to London. We’re a truly distributed company, shaped by the cultures and perspectives of our diverse teams.
      - paragraph [ref=f68e173]: Collaboration is core to how we work, across teams, across time zones, and alongside the organizations we support. We believe generosity is worth celebrating, and we care deeply about helping nonprofits raise more for the causes they serve.
