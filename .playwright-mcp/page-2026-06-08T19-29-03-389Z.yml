    - generic [ref=e124]:
      - heading "The challenging path ahead of us." [level=1] [ref=e125]
      - paragraph [ref=e126]: As the creator economy comes to life, there's an incredible amount of interest and excitement about an entirely new sector of the market — not just from creators themselves, but from companies and platforms who want to capitalise on something new. We are not the only team working in this space.
      - paragraph [ref=e127]: Ghost is unique in that we build decentralised, open technology that allows people to own and control their own destiny.
      - paragraph [ref=e128]: Building software that's decentralised, open, and can be installed anywhere is fundamentally more difficult than building centralised platform. It requires more advanced engineering, more compute power, more marketing, documentation, education, and significantly more sophisticated customer support to handle the demands of our most successful customers.
      - paragraph [ref=e129]: Our biggest challenge, by far, is in making advanced software be as friendly, accessible and straightforward to manage as possible. Lowering the barrier for people to feel comfortable running their own technology, and enjoying the freedom to build publications and businesses they control. Forever.
      - paragraph [ref=e130]: Eventually decentralised, open technology always wins.
      - paragraph [ref=e131]: The path to get there requires building a world class product, rock solid infrastructure, carefully crafted architecture, and a renowned service team. And that's where we're hoping you'll be able to help us, because we can't do it alone.
      - paragraph [ref=e132]: We need you.
