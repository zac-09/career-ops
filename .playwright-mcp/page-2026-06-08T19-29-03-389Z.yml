        - text: Enjoy 3 day weekends year-round.
      - paragraph [ref=e83]:
        - strong [ref=e84]: 🏝 Generous paid vacation
        - text: We close the office for 2 weeks each December, and encourage everyone to take regular time off from work to relax.
      - paragraph [ref=e85]:
        - strong [ref=e86]: 👶 Paid parental leave
        - text: When the time comes to welcome a new member of the family, we offer generous and fully paid parental leave.
      - paragraph [ref=e87]:
        - strong [ref=e88]: 📈 Regular pay reviews
        - text: Everyone receives an annual pay review, with compensation updates based on performance.
      - paragraph [ref=e89]:
        - strong [ref=e90]: 🧘‍♀️ Meeting-free focus
        - text: Most people at Ghost only have 1 or 2 zoom calls a week. We like to keep calendars empty & leave plenty of space for focusing on creative work.
    - generic [ref=e95]:
      - heading "We're looking for people with a balanced perspective." [level=1] [ref=e96]
      - paragraph [ref=e97]: Our team is made up of a group of incredibly smart, kind people who get shit done. People who are comfortable taking on big ideas and figuring out the details along the way tend to enjoy the light-touch level of process that we use. People with dreams and ambitions beyond their career tend to appreciate our unapologetic focus on balance and freedom, rather than just all-work, all-the-time.
      - paragraph [ref=e98]: We want driven people who move fast and ship, getting things done even in the absence of a complete plan. We also want people who are patient and calm, accepting that most things will be mostly imperfect most of the time. We especially value people who are capable and responsible, who don't wait to be told what to do next.
      - paragraph [ref=e99]: People who thrive in traditional corporate structures and office environments often do not enjoy the experience here. There's a lot of free-form collaboration and experimentation which means it's both harder to coast along doing the minimum, or play politics to climb the career ladder. Our team is passionate about their craft and talented at what they do, but none of us take ourselves or the world around us too seriously. We laugh at ourselves, and each other, a lot — so there isn't much room for self-importance.
      - paragraph [ref=e100]: You won't find any lengthy manifestos here, nor breathless memos about how we're "fixing media" or "changing the world", because people who do particularly well at Ghost tend to be self-aware, and share a common allergy to nonsense.
