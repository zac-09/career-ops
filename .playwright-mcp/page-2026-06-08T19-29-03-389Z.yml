        - heading "Help create the creator economy." [level=1] [ref=e12]
        - paragraph [ref=e14]: Ecommerce redefined how people buy products, the creator economy is redefining how people buy content. Ghost makes independent technology for creators to publish online and build a sustainable subscription business to fund their work.
