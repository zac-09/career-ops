    - generic [ref=e38]:
      - paragraph [ref=e39]: The world has changed, and media is struggling to change with it. The internet fuelled advertising-driven business models where all that mattered was capturing as many eyeballs as possible. The resulting economy brought us clickbait, outrage, fake news, and a fraught competition for your attention. Today, creators are choosing a new model where they have a direct relationship with an audience who pay a subscription to receive their content. The incentives are aligned, and the audience is the customer, not the product being sold.
      - paragraph [ref=e40]: At Ghost, we're a very small team creating a very large platform that's redefining how people are publishing online. The opportunity ahead for subscription commerce is hard to overstate, and we're looking for people who can help turn our dream for the future of publishing into a reality.
    - generic [ref=e49]:
      - heading "We work differently to most other companies." [level=1] [ref=e50]
      - paragraph [ref=e51]: We're a non-profit organisation, we give away all of the intellectual property and software we build as free and open source, we have a distributed international team spread all over the world, we're completely self-funded with no shareholders or VCs in the background influencing decisions, and we're committed to staying small, never growing our team to more than around 50 people.
      - paragraph [ref=e52]: "We have only two goals at Ghost: To create a product we're incredibly proud of, and a company that provides a great life to the team building it. To achieve those goals we've thrown away most other traditional measures of success."
      - paragraph [ref=e53]: We optimise for making the best product we can, rather than the one that makes the most money. We're cultivating a team of people we love working with, rather than one which is the biggest or most efficient. The structure of the company was chosen as a forcing factor. What happens when you have a business that can never be bought or sold? It turns out that you make a lot of decisions that optimise for building a company you're happy to be stuck with.
      - paragraph [ref=e54]: The alternative paths and artificial constraints we've chosen to adopt have been the seeds for a remarkable amount of creativity. Limiting our ambition has, in so many ways, been exactly what has attracted people and fuelled our success.
      - paragraph [ref=e55]: We've worked remotely since 2013 and, though everyone does it now, the way in which we've done it has always been to give people freedom and trust to do their best work — and live a fulfilling life beyond work. You wont find endless Zoom calls, full calendars, petty process or exhausting career politics here. Just a calm, creative group of humans enjoying challenging problems at the junction between art, science and engineering.
      - paragraph [ref=e56]: Aside from during volcanic eruptions and global pandemics, the whole team gets together in-person for a week-long retreat twice a year. Our last few trips have taken us to Spain, Thailand, Dubai, Egypt and Austria.
      - paragraph [ref=e57]
    - heading "Perks included with every role at Ghost." [level=1] [ref=e63]
    - generic [ref=e68]:
