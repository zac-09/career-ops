        - generic [ref=f26e3]:
          - generic [ref=f26e4]:
            - link "Back to jobs" [ref=f26e5] [cursor=pointer]:
              - /url: https://www.chronograph.pe/jobs/
            - generic [ref=f26e8]:
              - generic [ref=f26e9]:
                - heading "Senior Software Engineer" [level=1] [ref=f26e10]
                - generic [ref=f26e11]: Remote
              - button "Apply" [ref=f26e15] [cursor=pointer]
            - generic [ref=f26e17]:
              - paragraph [ref=f26e18]:
                - strong [ref=f26e19]: Overview
              - paragraph [ref=f26e20]: Chronograph was founded to bring next-generation technology to private capital markets. Through our suite of cloud-based analytics and data management solutions, we help many of the world’s largest and most sophisticated venture capital, private equity, and credit funds understand their investment performance in unprecedented detail, with over 258,000 private companies and 15,000 private capital funds monitored via our solution suite.
              - paragraph [ref=f26e21]: At Chronograph, we get to go “behind the scenes” and work directly with investors who are driving some of the most impactful changes across high growth start-ups, global infrastructure and renewable energy, growth equity, and all other private capital strategies. The firm is backed by The Carlyle Group, Nasdaq Inc., and Summit Partners, and has seen continuous rapid growth since its founding in 2016.
              - paragraph [ref=f26e22]:
                - strong [ref=f26e23]: The Opportunity
              - paragraph [ref=f26e24]: As a key member of our team, you will lead and deliver projects from concept to production; driving core technical direction while working closely with key stakeholders. Our engineering teams collaborate daily with product managers and designers to build exceptional software. An ideal candidate for this role will have both sharp technical skills and a keen product sensibility.
              - paragraph [ref=f26e25]: "You’ll join a highly-driven team of engineers, contributing both as a technical leader and a hands-on full-stack developer. Our platform handles critical financial data, offering extensive workflow and data analysis tools along with an innovative data ingestion platform. This is an opportunity to make a real-world impact: you will tackle challenging technical problems and contribute to a platform relied upon by leaders in the private equity space."
              - paragraph [ref=f26e26]: This is an exceptional opportunity for a driven, detail-oriented top performer to become directly engaged with several of the world’s most sophisticated private equity investors and produce an immediate impact within a globally-focused financial technology firm.
              - paragraph [ref=f26e27]:
                - strong [ref=f26e28]: "As a Senior Software Engineer at Chronograph, you will:"
              - list [ref=f26e29]:
                - listitem [ref=f26e30]: "Own and lead technical projects from product ideation to successful execution, including: technical decisions, architectural designs, data structures, and development approach"
                - listitem [ref=f26e31]: Collaborate with engineering, product, and design to architect high-performance and user-centric features to drive direct client impact among leaders in the private equity space
                - listitem [ref=f26e32]: Identify new technologies and best practices to help your team and the department continuously improve
                - listitem [ref=f26e33]: Lead cross-team initiatives to improve Chronograph’s overall developer experience and operating processes
                - listitem [ref=f26e34]: Mentor and provide guidance to junior engineers, fostering a culture of continuous learning and improvement
              - paragraph [ref=f26e35]:
                - strong [ref=f26e36]: "You will be successful in this role if you have:"
              - list [ref=f26e37]:
                - listitem [ref=f26e38]: At least 7 years of professional development experience
                - listitem [ref=f26e39]: Expertise in Typescript, Node, PostgreSQL, and GraphQL
                - listitem [ref=f26e40]: Proficiency in database schema design and writing performant SQL queries
                - listitem [ref=f26e41]: Experience with frontend frameworks and patterns such as React and React Query
                - listitem [ref=f26e42]: Excellent leadership and communication skills, and in particular the ability to distill complex technical concepts for diverse audiences
                - listitem [ref=f26e43]: A creative mindset that bridges technical constraints and product needs
              - list [ref=f26e44]:
                - listitem [ref=f26e45]: "Nice-to-haves:"
                - list [ref=f26e46]:
                  - listitem [ref=f26e47]: Experience implementing and extending modern JavaScript libraries such as SpreadJS, HyperFormula, FinnFlo-js and AG Grid
                  - listitem [ref=f26e48]: Background in building computation-heavy services where accuracy and performance are imperative
                  - listitem [ref=f26e49]: Curiosity about emerging tools that improve developer velocity, including AI-assisted coding
              - paragraph [ref=f26e50]:
                - text: Even if you do not meet all criteria, we would still encourage you to apply or get in touch! Chronograph offers an entrepreneurial environment where you will be able to proactively identify opportunities to develop and strengthen our team.
                - strong [ref=f26e51]: Why Join Chronograph?
              - paragraph [ref=f26e52]: We value creativity, open communication, and cutting edge technology – and we try to have fun along the way. We want you to be happy here for the long-term and will work with you to ensure you’re achieving your career goals.
              - paragraph [ref=f26e53]: "We offer:"
              - list [ref=f26e54]:
                - listitem [ref=f26e55]: Competitive salary
                - listitem [ref=f26e56]: Flexible work arrangements (including remote / in person / hybrid)
                - listitem [ref=f26e57]: 401(k)
                - listitem [ref=f26e58]: Unlimited and flexible vacation
                - listitem [ref=f26e59]: Generous health benefits
                - listitem [ref=f26e60]: Company-wide team events at our Brooklyn, NY headquarters three times a year for all employees
                - listitem [ref=f26e61]: Fully-paid parental leave
                - listitem [ref=f26e62]: ...and more!
              - paragraph [ref=f26e63]: Chronograph is committed to promoting a diverse and inclusive culture, and we welcome applicants from all backgrounds. If you’re a team player who wants to have an outsized impact in a dynamic and diverse environment, we’d love to hear from you!
            - generic [ref=f26e67]:
              - paragraph [ref=f26e68]: Create a Job Alert
              - paragraph [ref=f26e69]: Interested in building your career at Chronograph? Get future opportunities sent straight to your email.
              - link "Create alert" [ref=f26e325] [cursor=pointer]:
                - /url: https://my.greenhouse.io/users/sign_in?job_board=chronograph&source=job_alert_post
