        - generic [ref=f21e22]:
          - generic [ref=f21e23]:
            - heading "About Dwelly" [level=2] [ref=f21e24]
            - paragraph [ref=f21e25]: "Dwelly — a UK-based, AI-enabled lettings and property management platform, that is growing through a roll-up strategy acquiring estate agencies. The company leverages two arms: i) acquiring existing letting agencies, effectively buying its highly sticky, recurring revenue-type landlords portfolios, and then ii) building a top-notch technology to automate tenant management, payments, and post-rental property maintenance. The company seamlessly integrates AI services to automate all business processes within brick-and-mortar real estate agencies, integrating them into a tech-enabled digital letting platform in two months to radically improve the user experiences and increase efficiency of the business."
            - paragraph [ref=f21e26]: We’re a fast-growing, product-focused company, backed by top-tier investors and led by a team with deep experience in real estate, technology, and operations.
            - heading "Position Summary" [level=2] [ref=f21e27]
            - paragraph [ref=f21e28]: We’re looking for a Staff Software Engineer to join one of our core domain teams — Tenant Find, Property Management, or Payments. This is a high-impact role at the intersection of business, product, architecture, and hands-on execution. You will be expected to understand how the domain works in practice, identify the highest-leverage opportunities for automation, shape the solution, and drive it through to production. You will work in a small, high-ownership team where exceptional engineers can have disproportionate impact. This role requires advanced day-to-day use of AI and LLMs as part of exploring problems, evaluating solution paths, accelerating implementation, and designing automation systems.
            - heading "Key Responsibilities" [level=2] [ref=f21e29]
            - list [ref=f21e30]:
              - listitem [ref=f21e31]:
                - strong [ref=f21e32]: Deep domain understanding
                - text: Gain a deep understanding of your assigned domain (Tenant Find, Property Management, or Payments) and identify the highest-leverage opportunities for automation. Understand real operational workflows, including legacy processes, manual work, local exceptions, and agency-specific variations. Determine what should be standardized and what should remain flexible while designing robust, scalable solutions.
              - listitem [ref=f21e33]:
                - strong [ref=f21e34]: Automation and AI-driven systems
                - text: Design, implement, and maintain systems that automate manual processes across acquired agencies. Apply advanced AI and agentic techniques pragmatically to improve decision quality, operational efficiency, and team leverage. Ensure automation reduces operational load, improves reliability, and enhances business margins.
              - listitem [ref=f21e35]:
                - strong [ref=f21e36]: Product and architectural collaboration
                - text: Partner closely with product managers to frame problems, define solutions, and prioritize initiatives. Make architectural decisions grounded in operational reality rather than abstract models. Contribute to moving the system and the people around it toward better outcomes, balancing flexibility, scalability, and reliability.
              - listitem [ref=f21e37]:
                - strong [ref=f21e38]: End-to-end ownership and impact
                - text: Take full responsibility for outcomes, not just implementation. Deliver projects from concept to production rollout, continuously improving processes. Influence the overall direction of your domain, shape automation strategy, and materially improve business economics.
            - heading "Qualifications and Preferred Background" [level=2] [ref=f21e39]
            - list [ref=f21e40]:
              - listitem [ref=f21e41]: Strong engineering background with experience independently delivering complex systems from idea to production
              - listitem [ref=f21e42]: Solid experience with Node.js + TypeScript and React + TypeScript
              - listitem [ref=f21e43]: Familiarity with modern TypeScript patterns, tRPC, Drizzle, and SQL (MySQL/Postgres), or ability to ramp up quickly
              - listitem [ref=f21e44]: Ability to design architectures for fast-changing products with real operational constraints
              - listitem [ref=f21e45]: High autonomy, ownership, and comfort making decisions under ambiguity
              - listitem [ref=f21e46]: Product judgment and the ability to connect technical decisions to business outcomes
              - listitem [ref=f21e47]: Strong understanding of the modern AI landscape and agentic workflows, with pragmatic application beyond hype
              - listitem [ref=f21e48]: Experience in end-to-end delivery in domains with fragmented legacy workflows and operational complexity
              - listitem [ref=f21e49]: Strong communication skills and fluency in English
              - listitem [ref=f21e50]: Higher degree education
              - listitem [ref=f21e51]: "Startup mentality: resilience, adaptability, and ability to thrive in a fast-paced environment"
              - listitem [ref=f21e52]: "Customer-centric mindset: focus on delivering value to end-users or clients"
              - listitem [ref=f21e53]: Strong problem-solving skills – ability to approach challenges logically and propose practical solutions
            - heading "Compensation and benefits" [level=2] [ref=f21e54]
            - list [ref=f21e55]:
              - listitem [ref=f21e56]: The role is fully remote, providing flexibility and enabling seamless collaboration with our geographically distributed team
              - listitem [ref=f21e57]: Competitive salary with the potential for equity options based on performance, recognising exceptional contributions to our integration success
            - heading "What is it like being a Dwell-er" [level=2] [ref=f21e58]
            - paragraph [ref=f21e59]:
              - text: Feel free to check out
              - link "Dwelly Core Principles" [ref=f21e60] [cursor=pointer]:
                - /url: https://docsend.com/view/7v8gwrjaky7mn895
              - text: . That’s about what we believe in, how we operate and make decisions
            - paragraph [ref=f21e61]: What we offer is not a fancy office or a static workplace. Instead, this is solving one of the world’s most complex problems in the largest consumer industry in the world (residential rentals), to improve the experience for over 30% of households (more than 5 million in the UK, and over 100 million including EU and US) that live in rental homes
            - paragraph [ref=f21e62]: This is about disrupting the largest, most antiquated industry in the world, with one of the strongest operational and technical teams that exist in the UK and the EU. We work hard, and we shoot for extremely ambitious results. But we want people to be proud of what they’ve built and be able to look back and say one day “hell yeah, that was me that did it all”
            - list [ref=f21e63]:
              - listitem [ref=f21e64]: Customer obsession rather than competitive focus
              - listitem [ref=f21e65]: Passion for invention
              - listitem [ref=f21e66]: Operational excellence
              - listitem [ref=f21e67]: Long-term thinking
          - paragraph [ref=f21e69]: By applying for this position, you consent to the processing and storage of your personal data for recruitment purposes for up to 365 days, in accordance with our data retention policy and applicable data protection laws.
