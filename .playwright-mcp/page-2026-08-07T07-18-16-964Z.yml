      - heading "Why Togglers love it here" [level=2] [ref=f1e218]
      - generic [ref=f1e220]:
        - button [ref=f1e223] [cursor=pointer]
        - generic [ref=f1e229]:
          - generic [ref=f1e230]:
            - img "Photo of Liisa, a Toggler" [ref=f1e234]
            - paragraph [ref=f1e235]: “7 years and counting at Toggl. What keeps me here is the constant evolution of the company — it is not afraid of trying out new ideas and giving its team the opportunities to take ownership of them to grow professionally. The trust that Toggl puts in me keeps up my motivation to deliver results, even amidst the constant chaos that my life is when raising three little boys.”
            - generic [ref=f1e237]:
              - paragraph [ref=f1e238]:
                - strong [ref=f1e239]: Liisa from 🇪🇪
              - paragraph [ref=f1e240]:
                - strong [ref=f1e241]: Product Manager
          - generic [ref=f1e242]:
            - img "Photo of Dorian, a Toggler" [ref=f1e246]
            - paragraph [ref=f1e247]: “The collaboration culture at Toggl is based on kindness, transparent communication, and trust — which are the values I particularly appreciate coming from a corporate, legal environment. I am empowered to work when and where I want, which leaves me enough room to also grow as a triathlete. At Toggl, my well-being basically takes care of itself!”
            - generic [ref=f1e249]:
              - paragraph [ref=f1e250]:
                - strong [ref=f1e251]: Dorian from 🇵🇱
              - paragraph [ref=f1e252]:
                - strong [ref=f1e253]: Legal & Compliance Officer
          - generic [ref=f1e254]:
            - img "Photo of Sera, a Toggler" [ref=f1e258]
            - paragraph [ref=f1e259]: “For me, it's definitely the trust Toggl shows. I've always felt most productive in the afternoons and evenings. However, office hours are limited and it always felt stressful to force myself to focus in the mornings. Now that Toggl trusts me to manage my own time, I can choose to rest in the mornings and get in the zone in the afternoons. Professional-life equivalence of being treated like a grown up!”
            - generic [ref=f1e261]:
              - paragraph [ref=f1e262]:
                - strong [ref=f1e263]: Sera from 🇹🇷
              - paragraph [ref=f1e264]:
                - strong [ref=f1e265]: Backend Developer
          - generic [ref=f1e266]:
            - img "Photo of Jake, a Toggler" [ref=f1e270]
            - paragraph [ref=f1e271]: “Working for Toggl has given me a level of freedom and opportunity that was just not possible in my previous roles. I can work from where I'm most productive; be it from the couch, a local coffeeshop, or another state entirely! I also have the opportunity to learn and grow within my role, as well as receive encouragement to explore and perhaps even switch roles within the company.”
            - generic [ref=f1e273]:
              - paragraph [ref=f1e274]:
                - strong [ref=f1e275]: Jake from 🇺🇸
              - paragraph [ref=f1e276]:
                - strong [ref=f1e277]: Support Agent
          - generic [ref=f1e278]:
            - img "Photo of Vedran, a Toggler" [ref=f1e282]
            - paragraph [ref=f1e283]: "“The most common question I get from hiring candidates is: \"Vedran, what is your favorite part about working for Toggl\"? My answer is always the same: The people. Despite us working remotely, there's this (almost weird) connection that we share. It's legitimately hard to explain; You're excited when you know you'll see others from the company, either at meetups or at gatherings outside of work.”"
            - generic [ref=f1e285]:
              - paragraph [ref=f1e286]:
                - strong [ref=f1e287]: Vedran from 🇭🇷
              - paragraph [ref=f1e288]:
                - strong [ref=f1e289]: Head of Support
          - generic [ref=f1e290]:
            - img "Photo of Olivia, yet another Toggler!" [ref=f1e294]
            - paragraph [ref=f1e295]: “What I've always appreciated is the team's ability to move quickly and launch projects without getting bogged down by the need for perfection. We may not always get it right the first time, but we always take the time to learn and improve. Even projects that were put on hold due to practicality are revisited as the team grows, which shows that no idea is ever truly shut down. It keeps things exciting.”
            - generic [ref=f1e297]:
              - paragraph [ref=f1e298]:
                - strong [ref=f1e299]: Olivia from 🇲🇾
              - paragraph [ref=f1e300]:
                - strong [ref=f1e301]: Marketing Developer
          - generic [ref=f1e302]:
            - img "Photo of Hazem, a Toggler" [ref=f1e306]
            - paragraph [ref=f1e307]: “Working at Toggl feels like you're working in a group rather than being a cog in a hardly oiled creaking enterprise of a machine. You are a human, and you are treated as such. You are trusted to do what's right — no snooping, no bickering, no stress. Live in the Bahamas, work in your pajamas, raise a thousand llamas, have all the fun as long as you get things done.”
            - generic [ref=f1e309]:
              - paragraph [ref=f1e310]:
                - strong [ref=f1e311]: Hazem from 🇪🇬
