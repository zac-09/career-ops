  - generic [ref=f13e52]:
    - paragraph [ref=f13e53]: Our Team
    - paragraph [ref=f13e54]: At SafeBoda we believe that everyone in African cities should have access to affordable services at a click of a button. Our platform is carefully designed to meet the needs of African consumers as a one-stop-shop for transportation, payments and on demand services. While motorcycle taxis serve as the lifeblood of many cities in Africa, they are extremely unsafe and disorganized. Our safe, convenient, transportation platform provides for Africa’s booming young population as well as creating community and stability for our rider fleet.
