        - generic [ref=f115e293]:
          - generic [ref=f115e294]:
            - generic [ref=f115e295]: Benefits
            - heading "Not your average software company" [level=2] [ref=f115e299]
            - paragraph [ref=f115e301]: You’ll work with top-tier companies, contribute to OSS, and take on projects that push you forward-all in a team that moves with purpose. And that’s just the beginning of a long list of perks of working at Callstack.
            - link "Open positions" [ref=f115e304] [cursor=pointer]:
              - /url: "#open-positions"
          - generic:
            - generic [ref=f115e315]:
              - heading "Remote-first by design" [level=3] [ref=f115e316]
              - paragraph [ref=f115e318]: Work from wherever you do your best work. Our team spans 10+ countries, and remote is the default, not a perk. Some roles may require hybrid or in-office work, but unless it’s in the job description, you won’t be asked to return just because.
            - generic [ref=f115e323]:
              - heading "Workations and team events worth showing up for" [level=3] [ref=f115e324]
              - paragraph [ref=f115e326]: From team-wide workations to internal meetups, we make space for deep work, real connection, and a little adventure. Each Callstacker gets a one-week workation in a villa somewhere in southern Europe.
            - generic [ref=f115e331]:
              - heading "Wellbeing & Development Budget" [level=3] [ref=f115e332]
              - paragraph [ref=f115e334]: Use this flexible budget to invest in your growth, learning, and overall well-being, from courses to physiotherapy.
        - generic [ref=f115e342]:
          - heading "We’ve got your back, at work and beyond" [level=2] [ref=f115e346]
          - generic [ref=f115e348]:
            - generic [ref=f115e349]:
              - heading "Fully covered life insurance" [level=3] [ref=f115e355]
              - paragraph [ref=f115e357]: We care about your future, which includes support for you and your family when it matters most.
            - generic [ref=f115e358]:
              - heading "Time off that actually supports you" [level=3] [ref=f115e364]
              - paragraph [ref=f115e366]: You get 24 paid days off per year, plus up to 30 days of paid sick leave. No games, no stress-we want you to rest when you need to.
            - generic [ref=f115e367]:
              - heading "Private healthcare" [level=3] [ref=f115e373]
              - paragraph [ref=f115e375]: We co-finance private healthcare plans for you and your family or provide an equivalent if you're outside Poland.
            - generic [ref=f115e376]:
              - heading "Sports allowance" [level=3] [ref=f115e382]
              - paragraph [ref=f115e384]: Whether it’s a Multisport card or local equivalent, we help cover the cost of staying active.
            - generic [ref=f115e385]:
              - heading "Mental health support" [level=3] [ref=f115e391]
              - paragraph [ref=f115e393]: Free access to the Helping Hand platform, including webinars and one-on-one sessions with licensed specialists.
            - generic [ref=f115e394]:
              - heading "Milestone Five Anniversary Program" [level=3] [ref=f115e400]
              - paragraph [ref=f115e402]: Stay with us long-term and we’ll celebrate it with a special benefit made just for you.
            - generic [ref=f115e403]:
              - heading "Accounting cost refund" [level=3] [ref=f115e409]
              - paragraph [ref=f115e411]: We help cover your accounting costs if you're working with us on a B2B contract.
            - generic [ref=f115e412]:
              - heading "React Universe Conf participation" [level=3] [ref=f115e418]
              - paragraph [ref=f115e420]: You’ll have the chance to take part in React Universe Conf and stay close to what’s next in the React ecosystem.
            - generic [ref=f115e421]:
              - heading "Top-notch hardware" [level=3] [ref=f115e427]
              - paragraph [ref=f115e429]: We’ll set you up with Apple gear so you can work comfortably and efficiently from day one.
