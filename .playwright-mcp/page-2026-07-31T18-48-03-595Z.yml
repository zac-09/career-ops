            - listitem [ref=f15e293]:
              - generic [ref=f15e294]: 💪
              - generic [ref=f15e296]:
                - heading "Health insurance" [level=3] [ref=f15e297]
                - paragraph [ref=f15e298]: We offer health insurance for all of our team members, international or US.
