              - generic [ref=f15e300]: 🏠
              - generic [ref=f15e302]:
                - heading "Home office setup" [level=3] [ref=f15e303]
                - paragraph [ref=f15e304]: Get $1000 to set up your home office!
            - listitem [ref=f15e305]:
              - generic [ref=f15e306]: 👓
