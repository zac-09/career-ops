          - generic [ref=f15e97]:
            - heading "About Buffer" [level=2] [ref=f15e98]
            - paragraph [ref=f15e99]: We create social media and brand-building software for small businesses, creators, and individuals. Our mission is to provide essential tools to help small businesses get off the ground and grow. Through exceptional customer service and uplifting content, we help our customers believe they can succeed and do good along the way.
            - paragraph [ref=f15e100]:
              - text: Buffer is a fully distributed team, and we’ve always aimed to do things a little differently at Buffer. Since the early days, we’ve focused on building one of the most unique and fulfilling workplaces by rethinking a lot of traditional practices. We also default to transparency, so you can read all about our metrics, and our successes and failures along the way on our
              - link "Transparency Dashboard" [ref=f15e101] [cursor=pointer]:
                - /url: https://buffer.com/open
              - text: .
            - paragraph [ref=f15e102]:
              - text: We're united by Buffer's
              - link "values" [ref=f15e103] [cursor=pointer]:
                - /url: https://buffer.com/about#values
              - text: ", and we hire and work from all over the world. We strive to create a diverse and inclusive work environment, and we are building a culture where underrepresented groups are welcome and can flourish. Please note that we do travel to work together in person once or twice per year, and those events are highly encouraged to build deeper connections among our small team."
            - paragraph [ref=f15e104]:
              - text: As you get to know Buffer and consider joining the journey, you can learn more about Buffer on our
              - link "Journey" [ref=f15e105] [cursor=pointer]:
                - /url: https://buffer.com/journey
              - text: page. Still curious to learn more about the experience on the Buffer team? Feel free to read more from
              - link "Kirsti" [ref=f15e106] [cursor=pointer]:
                - /url: https://buffer.com/resources/first-30-days-buffer/
              - text: and
              - link "Sabreen" [ref=f15e107] [cursor=pointer]:
                - /url: https://buffer.com/resources/joined-3-days-before-the-retreat/
              - text: as they share their first experiences with Buffer, as well as from
              - link "Hailley" [ref=f15e108] [cursor=pointer]:
                - /url: https://buffer.com/resources/8-years-at-buffer/
              - text: ", who captured why she still calls Buffer home after 8+ years."
            - paragraph
            - heading "About the role" [level=2] [ref=f15e109]
            - paragraph [ref=f15e110]: As Buffer's next Senior Infrastructure Engineer, you'll join two seasoned Infrastructure Engineers on a small, deliberate, high-leverage team. Together, you'll run the platform that lets every Buffer engineer ship, and that indirectly lets millions of creators publish, grow, and earn a living on the social web. When our infrastructure is fast and reliable, creators get features sooner and outages less often.
            - paragraph [ref=f15e111]: You'll own a meaningful slice of three shifts the team is making.
            - list [ref=f15e112]:
              - listitem [ref=f15e113]:
                - paragraph [ref=f15e114]:
                  - strong [ref=f15e115]: Keeping the lights on at a higher bar.
                  - text: You'll make our CI/CD pipelines faster and even more anti-fragile, ship boring deploys, and turn each incident into a new lesson rather than a repeat.
              - listitem [ref=f15e116]:
                - paragraph [ref=f15e117]:
                  - strong [ref=f15e118]: Modernizing the foundation.
                  - text: Buffer is not new, but our Infra is in continuous improvement. From deploying KEDA and Argo Rollouts to improving our signal-to-noise ratio in monitoring, there is plenty to do. One cannot talk about modernization without mentioning AI. We're already leaning on it for investigations and boilerplate, and want to bring it deeper into our day-to-day.
              - listitem [ref=f15e119]:
                - paragraph [ref=f15e120]:
                  - strong [ref=f15e121]: Treating engineers across Buffer as customers.
                  - text: You'll evolve the developer tooling that makes the inner loop fast, with documentation that holds up at 2am or when consumed by an agent.
            - paragraph [ref=f15e122]: We're remote-first with a preference for at least 4 hours of overlap with EMEA time zones, but we're open to strong candidates anywhere in the world.
            - paragraph [ref=f15e123]: It's an exciting time to join. Buffer is a profitable, 15-year-old company innovating at the edge of AI-assisted development, and there's lots of impactful work to do.
            - paragraph
            - heading "Who you'll work with" [level=2] [ref=f15e124]
            - paragraph [ref=f15e125]:
              - text: In this role, you'll report to
              - link "Miguel" [ref=f15e126] [cursor=pointer]:
                - /url: https://www.linkedin.com/in/migueldavid/
              - text: ", the Infrastructure Engineering Manager."
            - paragraph [ref=f15e127]:
              - text: Day-to-day you'll work closely with
              - link "Peter" [ref=f15e128] [cursor=pointer]:
                - /url: https://www.linkedin.com/in/peter-emil/
              - text: and
              - link "Steven" [ref=f15e129] [cursor=pointer]:
                - /url: https://www.linkedin.com/in/stevenc81/
              - text: ", who have helped build the infrastructure we run on since the beginning of Buffer. We're looking to round out the team with someone who sits between infra and developer experience: deep infra expertise paired with an infra-as-a-product mindset."
            - paragraph [ref=f15e130]: You'll also work daily with all of EPD (Buffer's unified Engineering, Product, and Design team). EPD are the internal customers of the platform you maintain, and they contribute to it too.
            - paragraph
            - heading "What you'll be working on" [level=2] [ref=f15e131]
            - list [ref=f15e132]:
              - listitem [ref=f15e133]:
                - paragraph [ref=f15e134]:
                  - strong [ref=f15e135]: Own
                  - text: the day-to-day reliability of our production platform. Keep EKS, ArgoCD, and the AWS surface area boring, tune autoscaling so the system adjusts well under load, and approach incident response in a way that each incident teaches us something new instead of repeating itself. (On-call is distributed across all engineers at Buffer, a week-long shift roughly once a quarter.)
              - listitem [ref=f15e136]:
                - paragraph [ref=f15e137]:
                  - strong [ref=f15e138]: Build
                  - text: progressive delivery into something the rest of engineering trusts. Implement Argo Rollouts with clean rollback paths, so the time between "this deploy is bad" and "this deploy is reverted" measures in seconds to minutes.
              - listitem [ref=f15e139]:
                - paragraph [ref=f15e140]:
                  - strong [ref=f15e141]: Build
                  - text: developer tools as products, instead of loose scripts. Evolve our in-house local development environment,
                  - link "BIBEs" [ref=f15e142] [cursor=pointer]:
                    - /url: https://peteremil.com/buffers-bibes/
                  - text: (Buffer Isolated Build Environments, per-PR full-stack staging deployments), and our CLI tooling so the inner loop is fast, frictionless, and parallel-friendly for AI agents. Measure adoption, talk to your users, iterate.
              - listitem [ref=f15e143]:
                - paragraph [ref=f15e144]:
                  - strong [ref=f15e145]: Reduce
                  - text: operational toil with AI. Automate low-risk workflows end-to-end so the team spends its time on the hard problems, not the repeat ones. AI doesn't touch infrastructure directly, it speeds up the humans who do.
              - listitem [ref=f15e146]:
                - paragraph [ref=f15e147]:
                  - strong [ref=f15e148]: Keep
                  - text: "the stack current. Drive lifecycle upgrades: application runtimes (Node.js, Python), Kubernetes, EKS, Helm versions, and the Terraform-managed surface area. Own infra-side security vulnerabilities."
              - listitem [ref=f15e149]:
                - paragraph [ref=f15e150]:
                  - strong [ref=f15e151]: Improve
                  - text: the economics of our platform. Lead visibility work on Datadog, AWS rightsizing, and log filters so observability and cloud spend grow slower than the company does.
              - listitem [ref=f15e152]:
                - paragraph [ref=f15e153]:
                  - strong [ref=f15e154]: Partner
                  - text: with EPD on the platform they build on. Raise the documentation bar with the team, carry your share of weekly security work (dependency and vulnerability management is everyone's job), and help the infra team grow toward shared ownership and fewer single-person dependencies.
            - paragraph
            - heading "Helpful skills and experience" [level=2] [ref=f15e155]
            - paragraph [ref=f15e156]: Very few people match every line here. If most of the core list sounds like you, apply. The bonus list is genuinely bonus.
            - heading "Core experience" [level=3] [ref=f15e157]
            - list [ref=f15e158]:
              - listitem [ref=f15e159]:
                - paragraph [ref=f15e160]: You've worked as an Infrastructure Engineer, SRE, or in a DevOps or platform engineering role, on systems real people depended on.
              - listitem [ref=f15e161]:
                - paragraph [ref=f15e162]: You've run production Kubernetes. You've authored and maintained Helm charts, tuned autoscaling and resource requests, and kept it standing under real traffic.
              - listitem [ref=f15e163]:
                - paragraph [ref=f15e164]: You know AWS and Terraform well. You default to modules, keep the code readable and adaptable, and can say what happens when a plan touches something load-bearing.
              - listitem [ref=f15e165]:
                - paragraph [ref=f15e166]: You've operated production CI/CD and GitOps, including a rollback path you'd trust when something breaks in production.
              - listitem [ref=f15e167]:
                - paragraph [ref=f15e168]: You've carried the pager for something you built. You've run an incident, written the follow-up, and turned off the alert nobody trusted anymore.
              - listitem [ref=f15e169]:
                - paragraph [ref=f15e170]: You've built internal developer tooling. CLIs, dev environments, per-PR environments. You've felt the difference between something that ships and something that gets used.
              - listitem [ref=f15e171]:
                - paragraph [ref=f15e172]: You thrive in remote, async environments. You're clear in your thinking and generous with context.
              - listitem [ref=f15e173]:
                - paragraph [ref=f15e174]: Slow and flaky bothers you. You ship something rough teammates can react to, then keep going until the whole class of problem is gone, not just the one bug in the ticket.
              - listitem [ref=f15e175]:
                - paragraph [ref=f15e176]: You're fluent with modern AI tools. You use them to debug, document, and reduce toil, not just to generate code.
              - listitem [ref=f15e177]:
                - paragraph [ref=f15e178]: You make pragmatic build-vs-buy calls, you weigh what things cost to run, and you revisit both when conditions change. You'd rather invest in fundamentals that compound than chase the newest tool.
              - listitem [ref=f15e179]:
                - paragraph [ref=f15e180]: "You have a personal stake in making and publishing things. What that looks like is yours to choose: writing, video, code, photos, music, a niche account with twelve followers. Audience size is not the point. We're a Team of Creators, and infra gets better the closer it sits to that experience."
            - heading "Bonus points" [level=3] [ref=f15e181]
            - list [ref=f15e182]:
              - listitem [ref=f15e183]:
                - paragraph [ref=f15e184]: You're already a Buffer user, or you know the social media management space.
              - listitem [ref=f15e185]:
                - paragraph [ref=f15e186]: You've worked with Datadog, Sentry, or a similar observability stack, and you design logs and metrics with cost in mind.
              - listitem [ref=f15e187]:
                - paragraph [ref=f15e188]: Prior Cloudflare experience across Workers, Zero Trust, and DNS.
              - listitem [ref=f15e189]:
                - paragraph [ref=f15e190]: An open source Terraform module or tool you've contributed.
            - paragraph
            - heading "Our tech stack" [level=2] [ref=f15e191]
            - list [ref=f15e192]:
              - listitem [ref=f15e193]:
                - paragraph [ref=f15e194]:
                  - strong [ref=f15e195]: Cloud and IaC.
                  - text: "AWS, GCP, Cloudflare. Products you'll find in use here: EC2, EKS, S3, SQS, SNS, ECR, IAM, ALB, BigQuery, mostly managed in Terraform."
              - listitem [ref=f15e196]:
                - paragraph [ref=f15e197]:
                  - strong [ref=f15e198]: Container orchestration and delivery.
                  - text: Kubernetes on EKS, Helm for charting, KEDA for SQS-driven autoscaling. ArgoCD for deploys from git. An in-house canary system that we want to augment with Argo Rollouts. BIBEs and frontend branch deployments for per-PR previews.
              - listitem [ref=f15e199]:
                - paragraph [ref=f15e200]:
                  - strong [ref=f15e201]: CI/CD.
                  - text: GitHub Actions, with self-hosted AWS runners (including KVM-capable instances for Android UI tests). Our monorepo is the consolidation target, and we're moving more services into it over time.
              - listitem [ref=f15e202]:
                - paragraph [ref=f15e203]:
                  - strong [ref=f15e204]: Observability and incidents.
                  - text: Datadog for logs, metrics, APM, and spans. Sentry for errors.
                  - link "Incident.io" [ref=f15e205] [cursor=pointer]:
                    - /url: https://incident.io
                  - text: (and a bit of PagerDuty) for the incident lifecycle and postmortems.
              - listitem [ref=f15e206]:
                - paragraph [ref=f15e207]:
                  - strong [ref=f15e208]: Networking and DNS.
                  - text: Cloudflare across Workers, Zero Trust, DNS, and more. CloudFront for AWS-side distribution. VPC peering for cross-account connectivity. OctoDNS for DNS-as-code.
              - listitem [ref=f15e209]:
                - paragraph [ref=f15e210]:
                  - strong [ref=f15e211]: Data stores.
                  - text: MongoDB fronted by GraphQL, Elasticsearch, Redis.
              - listitem [ref=f15e212]:
                - paragraph [ref=f15e213]:
                  - strong [ref=f15e214]: Local development.
                  - text: Hermes (our in-house environment that mirrors production) running in OrbStack, pre-built production containers from ECR.
              - listitem [ref=f15e215]:
                - paragraph [ref=f15e216]:
                  - strong [ref=f15e217]: Languages and runtimes.
                  - text: Node.js and TypeScript across most services, Python in selected services and tooling, and PHP for legacy services that are still load-bearing and being gradually replaced.
            - paragraph
            - heading "Interview process" [level=2] [ref=f15e218]
            - paragraph [ref=f15e219]: Do you believe you're a fit for this role and want to join the Buffer team? We'd love to hear about you!
            - paragraph [ref=f15e220]: "Here's what the hiring process will look like:"
            - list [ref=f15e221]:
              - listitem [ref=f15e222]:
                - paragraph [ref=f15e223]:
                  - strong [ref=f15e224]: Application.
                  - text: Apply to join the team through the form below.
                - list [ref=f15e225]:
                  - listitem [ref=f15e226]:
                    - paragraph [ref=f15e227]: When submitting your application and resume, take your time. This is your chance to make a strong first impression.
                  - listitem [ref=f15e228]:
                    - paragraph [ref=f15e229]: While we have a couple of engineering roles open, we recommend applying to only one role. If during our review or interviews we think you'd be great for a different position, we'll re-route your application internally.
                  - listitem [ref=f15e230]:
                    - paragraph [ref=f15e231]: Response times can take a few days to weeks. We're a small team reviewing every application carefully.
              - listitem [ref=f15e232]:
                - paragraph [ref=f15e233]:
                  - strong [ref=f15e234]: Hiring manager interview.
                  - text: Chat with the hiring manager for your role (
                  - link "Miguel, Engineering Manager" [ref=f15e235] [cursor=pointer]:
                    - /url: https://www.linkedin.com/in/migueldavid/
                  - text: ) and another Engineering Leader to understand what it takes to work at Buffer. This is an opportunity for both sides to get to know each other and determine whether our expectations align.
              - listitem [ref=f15e236]:
                - paragraph [ref=f15e237]:
                  - strong [ref=f15e238]: Take-home exercise.
                  - text: We'll send you
                  - strong [ref=f15e239]
                  - text: a two-page max asynchronous assignment to review a system or scenario to help us understand how you think about systems, assumptions and communication of technical ideas.
              - listitem [ref=f15e240]:
                - paragraph [ref=f15e241]:
                  - strong [ref=f15e242]: Technical interview.
                  - text: Interview with two Infrastructure Engineers from Buffer (
                  - link "Peter" [ref=f15e243] [cursor=pointer]:
                    - /url: https://www.linkedin.com/in/peter-emil/
                  - text: and
                  - link "Steven" [ref=f15e244] [cursor=pointer]:
                    - /url: https://www.linkedin.com/in/stevenc81/
                  - text: ) focusing on your technical experience and approach.
              - listitem [ref=f15e245]:
                - paragraph [ref=f15e246]:
                  - strong [ref=f15e247]: Leadership interview.
                  - text: A conversation with one or two Engineering Leaders to discuss your approach to leadership, how we drive value and impact in a cross-functional company, and to really get into how you think about approaching work and collaboration.
              - listitem [ref=f15e248]:
                - paragraph [ref=f15e249]:
                  - strong [ref=f15e250]: Final interview.
                  - text: You will have the opportunity to meet with our Executive Leadership team. This is a great chance for you to gain a deeper understanding of Buffer's strategy, values, and work processes.
              - listitem [ref=f15e251]:
                - paragraph [ref=f15e252]:
                  - strong [ref=f15e253]: Collaboration period.
                  - text: This is a stage where you would work with us on a real project over two days (fully paid). The goal is to see how it feels to work in the team, both for us and for you. You'll meet a few Bufferoos, we'll kick off the project, invite you to a Slack channel, and you'll collaborate with the team on it.
              - listitem [ref=f15e254]:
                - paragraph [ref=f15e255]:
                  - strong [ref=f15e256]: Offer.
                  - text: We wrap it up with an offer and discuss the final details. We would align on the last bits before we make you part of the Buffer team 💛
            - paragraph [ref=f15e257]:
              - emphasis [ref=f15e258]: At Buffer, we value diversity of experience, and we understand that comes in many forms. We’re dedicated to adding new perspectives to the team. So, if your experience is close to what we’re looking for, please consider applying.
            - paragraph [ref=f15e259]:
              - emphasis [ref=f15e260]: By submitting the application, you consent to Buffer collecting and processing your personal data for recruiting purposes, find more details in our
              - link [ref=f15e261] [cursor=pointer]:
                - /url: https://buffer.notion.site/Privacy-Policy-for-Applicants-230a7f5a00fd80e48478f09171d18a24?pvs=143
                - emphasis [ref=f15e262]: Privacy Policy
              - emphasis [ref=f15e263]: .
