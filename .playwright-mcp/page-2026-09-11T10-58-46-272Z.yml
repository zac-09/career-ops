              - generic [ref=f6e348]:
                - generic [ref=f6e349]:
                  - generic [ref=f6e350]: Form CC-305
                  - generic [ref=f6e351]: Page 1 of 1
                - generic [ref=f6e352]:
                  - generic [ref=f6e353]: OMB Control Number 1250-0005
                  - generic [ref=f6e354]: Expires 07/31/2029
              - strong [ref=f6e355]: Why are you being asked to complete this form?
              - paragraph [ref=f6e356]: We are a federal contractor or subcontractor. The law requires us to provide equal employment opportunity to qualified people with disabilities. We have a goal of having at least 7% of our workers as people with disabilities. The law says we must measure our progress towards this goal. To do this, we must ask applicants and employees if they have a disability or have ever had one. People can become disabled, so we need to ask this question at least every five years.
              - paragraph [ref=f6e357]:
                - text: Completing this form is voluntary, and we hope that you will choose to do so. Your answer is confidential. No one who makes hiring decisions will see it. Your decision to complete the form and your answer will not harm you in any way. If you want to learn more about the law or this form, visit the U.S. Department of Labor’s Office of Federal Contract Compliance Programs (OFCCP) website at
                - link "www.dol.gov/ofccp" [ref=f6e358] [cursor=pointer]:
                  - /url: https://www.dol.gov/ofccp
                - text: .
              - strong [ref=f6e359]: How do you know if you have a disability?
              - paragraph [ref=f6e360]:
                - text: A disability is a condition that substantially limits one or more of your “major life activities.” If you have or have ever had such a condition, you are a person with a disability.
                - strong [ref=f6e361]: "Disabilities include, but are not limited to:"
              - list [ref=f6e362]:
                - listitem [ref=f6e363]: Alcohol or other substance use disorder (not currently using drugs illegally)
                - listitem [ref=f6e364]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=f6e365]: Blind or low vision
                - listitem [ref=f6e366]: Cancer (past or present)
                - listitem [ref=f6e367]: Cardiovascular or heart disease
                - listitem [ref=f6e368]: Celiac disease
                - listitem [ref=f6e369]: Cerebral palsy
                - listitem [ref=f6e370]: Deaf or serious difficulty hearing
                - listitem [ref=f6e371]: Diabetes
                - listitem [ref=f6e372]: Disfigurement, for example, disfigurement caused by burns, wounds, accidents, or congenital disorders
