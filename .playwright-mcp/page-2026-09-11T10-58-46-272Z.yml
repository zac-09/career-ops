            - paragraph [ref=f6e108]:
              - strong [ref=f6e109]: Time Off
            - list [ref=f6e110]:
              - listitem [ref=f6e111]: Flexible paid time off covering vacation and sick leave
              - listitem [ref=f6e112]: Leave programs, including parental, pregnancy health, medical, and bereavement leave
            - paragraph [ref=f6e113]
          - generic [ref=f6e114]:
            - heading "What Makes Cloudflare Special?" [level=3] [ref=f6e115]
            - paragraph [ref=f6e116]: We’re not just a highly ambitious, large-scale technology company. We’re a highly ambitious, large-scale technology company with a soul. Fundamental to our mission to help build a better Internet is protecting the free and open Internet.
            - paragraph [ref=f6e117]:
              - link [ref=f6e118] [cursor=pointer]:
                - /url: https://blog.cloudflare.com/protecting-free-expression-online/
                - strong [ref=f6e119]: Project Galileo
              - text: ": Since 2014, we've equipped more than 2,400 journalism and civil society organizations in 111 countries with powerful tools to defend themselves against attacks that would otherwise censor their work, technology already used by Cloudflare’s enterprise customers--at no cost."
            - paragraph [ref=f6e120]:
              - strong [ref=f6e121]:
                - link "Athenian Project" [ref=f6e122] [cursor=pointer]:
                  - /url: https://www.cloudflare.com/athenian/
              - text: ": In 2017, we created the Athenian Project to ensure that state and local governments have the highest level of protection and reliability for free, so that their constituents have access to election information and voter registration. Since the project, we've provided services to more than 425 local government election websites in 33 states."
            - paragraph [ref=f6e123]:
              - link [ref=f6e124] [cursor=pointer]:
                - /url: https://1.1.1.1/
                - strong [ref=f6e125]: 1.1.1.1
              - text: ": We released"
              - link "1.1.1.1" [ref=f6e126] [cursor=pointer]:
                - /url: https://1.1.1.1/
              - text: to help fix the foundation of the Internet by building a faster, more secure and privacy-centric public DNS resolver. This is available publicly for everyone to use - it is the first consumer-focused service Cloudflare has ever released. Here’s the deal - we don’t store client IP addresses never, ever. We will continue to abide by our
              - link "privacy commitment" [ref=f6e127] [cursor=pointer]:
                - /url: https://developers.cloudflare.com/1.1.1.1/privacy/public-dns-resolver
              - text: and ensure that no user data is sold to advertisers or used to target consumers.
            - paragraph [ref=f6e128]: Sound like something you’d like to be a part of? We’d love to hear from you!
            - paragraph [ref=f6e129]: Please note that applicants who progress to the offer stage of the interview process may be asked to attend an in-person interview within one of the Cloudflare Offices or Cloudflare Hubs. More details about this will be available at that stage of the interview process.
            - paragraph [ref=f6e130]: This position may require access to information protected under U.S. export control laws, including the U.S. Export Administration Regulations. Please note that any offer of employment may be conditioned on your authorization to receive software or technology controlled under these U.S. export laws without sponsorship for an export license.
            - paragraph [ref=f6e131]: Cloudflare is proud to be an equal opportunity employer. We are committed to providing equal employment opportunity for all people and place great value in both diversity and inclusiveness. All qualified applicants will be considered for employment without regard to their, or any other person's, perceived or actual race, color, religion, sex, gender, gender identity, gender expression, sexual orientation, national origin, ancestry, citizenship, age, physical or mental disability, medical condition, family care status, or any other basis protected by law. We are an AA/Veterans/Disabled Employer.
            - paragraph [ref=f6e132]: Cloudflare provides reasonable accommodations to qualified individuals with disabilities. Please tell us if you require a reasonable accommodation to apply for a job. Examples of reasonable accommodations include, but are not limited to, changing the application process, providing documents in an alternate format, using a sign language interpreter, or using specialized equipment. If you require a reasonable accommodation to apply for a job, please contact us via e-mail at hr@cloudflare.com or via mail at 101 Townsend St. San Francisco, CA 94107.
