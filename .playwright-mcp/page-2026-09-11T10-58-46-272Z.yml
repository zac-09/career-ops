          - generic [ref=f6e15]:
            - heading "Senior Solutions Engineer, Cloudflare One (SASE/SSE)" [level=1] [ref=f6e16]
            - generic [ref=f6e17]: Distributed
          - button "Apply" [ref=f6e21] [cursor=pointer]
        - generic [ref=f6e22]:
          - generic [ref=f6e23]:
            - heading "About Us" [level=3] [ref=f6e24]
            - paragraph [ref=f6e25]: At Cloudflare, we are on a mission to help build a better Internet. Today the company runs one of the world’s largest networks that powers millions of websites and other Internet properties for customers ranging from individual bloggers to SMBs to Fortune 500 companies. Cloudflare protects and accelerates any Internet application online without adding hardware, installing software, or changing a line of code. Internet properties powered by Cloudflare all have web traffic routed through its intelligent global network, which gets smarter with every request. As a result, they see significant improvement in performance and a decrease in spam and other attacks. Cloudflare was named to Entrepreneur Magazine’s Top Company Cultures list and ranked among the World’s Most Innovative Companies by Fast Company.
            - paragraph [ref=f6e26]: At Cloudflare, we’re not looking for people who wait for a polished roadmap; we’re looking for the builders who see the cracks in the Internet that everyone else has simply learned to live with. We value candidates who have the instinct to spot a "normalized" problem and the AI-native curiosity to create a solution using the latest tools. Our culture is built on iteration, leveraging AI to ship faster today to make it better tomorrow, while ensuring that every improvement, no matter how small, is shared across the team to lift everyone up. If you’re the type of person who values curiosity over bureaucracy, and that AI is a partner in solving tough problems to keep the Internet moving forward, you’ll fit right in.
          - generic [ref=f6e27]:
            - heading [level=3] [ref=f6e28]:
              - strong [ref=f6e29]: "Available Location: Chicago, IL; Austin, TX; Phoenix, AZ; Los Angeles, CA; San Francisco, CA; Denver, CO; St. Louis, MO; Kansas City; Dallas, TX"
            - heading "About the Department" [level=3] [ref=f6e30]
            - paragraph [ref=f6e31]: The Specialist Solutions Engineering team at Cloudflare is a group of trusted technical advisors who partner with customers to solve complex security, connectivity, and performance challenges. We work hand in hand with the sales organization throughout the customer journey, from discovery and solution design through proof of value and technical validation. We are passionate about technology and dedicated to helping customers use the full power of Cloudflare's global network to achieve business-critical outcomes.
            - heading "About the Role" [level=3] [ref=f6e32]
            - paragraph [ref=f6e33]: As a Senior Solutions Engineer specializing in Cloudflare One, you will partner with account teams and customers to design, demonstrate, and validate integrated solutions across Zero Trust, enterprise WAN, and emerging AI technologies. You will lead the technical path for complex opportunities, translating customer risks, operational requirements, and business priorities into architectures that give stakeholders confidence to adopt Cloudflare.
            - paragraph [ref=f6e34]: Zero Trust is the primary focus of this role, with enterprise WAN and AI as the next priorities. Successful candidates will bring meaningful customer-facing Zero Trust experience and practical enterprise WAN experience. Email Security experience is welcome but not required. You do not need to be an expert in every part of the portfolio, but you must be able to connect these technologies into a coherent customer strategy and continue developing your expertise as the market evolves.
            - paragraph [ref=f6e35]: This is a Senior-level individual-contributor role for a curious, commercially aware technical leader who can guide customer evaluations, collaborate across teams, and improve the effectiveness of the broader field organization.
            - heading "Responsibilities" [level=3] [ref=f6e36]
            - list [ref=f6e37]:
              - listitem [ref=f6e38]: Serve as a trusted technical advisor, leading discovery and designing Cloudflare One architectures that address customer security, connectivity, and business requirements.
              - listitem [ref=f6e39]: Guide qualified opportunities through solution design, demonstrations, technical evaluations, proofs of value, success-criteria management, and technical close.
              - listitem [ref=f6e40]: Advise customers on Zero Trust strategies spanning identity-aware access, secure web gateway, data protection, SaaS security, browser isolation, device posture, and secure connectivity.
              - listitem [ref=f6e41]: Design WAN transformation solutions that connect users, offices, data centers, and cloud environments using Cloudflare WAN and complementary Cloudflare One services.
              - listitem [ref=f6e42]: Build expertise in AI-era opportunities and risks, including employee AI adoption, Shadow AI, sensitive-data exposure, AI application access, Model Context Protocol (MCP) server controls, and agentic AI governance.
              - listitem [ref=f6e43]: Use AI tools thoughtfully to improve research, customer preparation, technical analysis, content creation, demonstrations, automation, and the repeatability of field activities.
              - listitem [ref=f6e44]: Support broader Cloudflare One opportunities involving Email Security when relevant to the customer's strategy and requirements.
              - listitem [ref=f6e45]: Clearly articulate Cloudflare's technical and business differentiation against competing Zero Trust, email-security, networking, and adjacent AI-security solutions.
              - listitem [ref=f6e46]: Partner with sales teams on account strategy, pipeline development, and revenue goals while maintaining clear ownership of technical next steps and customer outcomes.
              - listitem [ref=f6e47]: Create reusable architectures, demonstration and proof-of-value patterns, technical guidance, and lightweight automation, and coach peers and partners to execute more effectively.
              - listitem [ref=f6e48]: Capture customer feedback, market trends, and product gaps, translating them into actionable input for Product and Engineering.
              - listitem [ref=f6e49]: Coordinate with Sales, Support, Product, and Engineering to resolve technical issues and maintain customer trust during complex evaluations.
              - listitem [ref=f6e50]: Own presales evaluation outcomes through technical close, then coordinate a clean handoff to the appropriate Customer Success, Professional Services, Support, or implementation teams.
            - heading "Qualifications" [level=3] [ref=f6e51]
            - paragraph [ref=f6e52]: Successful candidates are customer-focused technical leaders who combine broad security and networking experience with strong communication, commercial judgment, and learning agility. We welcome relevant backgrounds in Solutions or Systems Engineering, technical sales, consulting, or enterprise security and network architecture.
            - heading "Required Qualifications" [level=3] [ref=f6e53]
            - list [ref=f6e54]:
              - listitem [ref=f6e55]: 5+ years of experience in a customer-facing technical role such as Solutions Engineering, Systems Engineering, technical sales, consulting, or enterprise architecture.
              - listitem [ref=f6e56]: Meaningful customer-facing experience designing, demonstrating, evaluating, or implementing Zero Trust solutions.
              - listitem [ref=f6e57]: Practical understanding of Zero Trust and SASE architectures, including identity, endpoint, network, application, data, and SaaS security considerations.
              - listitem [ref=f6e58]: Practical experience with enterprise networking and WAN concepts such as routing, subnetting, VPNs, SD-WAN, hybrid connectivity, cloud networking, or network transformation.
              - listitem [ref=f6e59]: Active professional use of AI tools and demonstrated commitment to learning how AI platforms, AI-enabled threats, data exposure, and governance affect enterprise customers.
              - listitem [ref=f6e60]: "Experience designing or integrating enterprise security solutions with one or more of the following: identity providers, Microsoft 365 or Google Workspace, public cloud environments, APIs, and SIEM or log-analytics platforms."
              - listitem [ref=f6e61]: Proven ownership of technical evaluations or proofs of value, including discovery, architecture, scope, success criteria, deployment dependencies, stakeholder communication, technical decision management, and technical close.
              - listitem [ref=f6e62]: Strong written, presentation, and demonstration skills across practitioner, architect, and executive audiences, with the ability to connect technical capabilities to risk reduction, operational improvement, and business outcomes.
              - listitem [ref=f6e63]: Ability to collaborate across Sales, Product, Engineering, Support, partners, and customer teams while managing competing priorities and deadlines.
            - heading "Preferred Qualifications" [level=3] [ref=f6e64]
            - list [ref=f6e65]:
              - listitem [ref=f6e66]: Hands-on experience with Cloudflare One capabilities such as Access, Gateway, Cloudflare One Client, Browser Isolation, CASB, DLP, Email Security, Cloudflare Tunnel, or Cloudflare WAN.
              - listitem [ref=f6e67]: Experience displacing, integrating, or migrating from secure web gateways, VPN or ZTNA platforms, secure email gateways, API-based email-security platforms, MPLS networks, or SD-WAN solutions.
              - listitem [ref=f6e68]: Experience with Email Security technologies, customer requirements, or threat use cases, including familiarity with Microsoft 365 or Exchange, Google Workspace, SMTP, mail flow, SPF, DKIM, or DMARC.
              - listitem [ref=f6e69]: Deeper networking experience with routing, BGP, IPsec or GRE connectivity, SD-WAN, network firewalls, hybrid and multi-cloud networking, or WAN transformation.
              - listitem [ref=f6e70]: Hands-on experience with AI security or governance, including Shadow AI discovery, controls for generative-AI applications, AI-related data-loss risks, MCP, agentic systems, or the broader Cloudflare AI portfolio.
              - listitem [ref=f6e71]: Ability to use scripting, APIs, or automation to make demonstrations, evaluations, reporting, and deployments more repeatable.
              - listitem [ref=f6e72]: Experience enabling channel partners, distributors, managed service providers, or systems integrators in complex enterprise sales cycles.
              - listitem [ref=f6e73]: Relevant security, networking, cloud, or AI certifications, or equivalent demonstrated expertise.
            - paragraph [ref=f6e74]:
              - strong [ref=f6e75]: Compensation
            - list [ref=f6e76]:
              - listitem [ref=f6e77]:
                - text: Compensation may be adjusted depending on work location
                - list [ref=f6e78]:
                  - listitem [ref=f6e79]: "For SF, SJ, and Bay Area Metro based hires: Estimated annual salary of $244,000 - $336,000."
                  - listitem [ref=f6e80]: "For Boston, California - Remote, Connecticut - Remote, DC Metro, Massachusetts - Remote, New Jersey - Remote, New York City, NY Metro, Remote - Washington, Washington (Kirkland), and Washington D.C. based hires: Estimated annual salary of $234,000 - $321,000."
                  - listitem [ref=f6e81]: "For Colorado - Remote, Illinois - Remote, Maryland - Remote, Minnesota - Remote, Nevada - Remote, New York - Remote, Rhode Island - Remote, and Vermont - Remote based hires: Estimated annual base salary of $163,240 - $224,840. Estimated variable compensation target of $48,760 - $67,160."
              - listitem [ref=f6e82]: This role is eligible to earn incentive compensation under Cloudflare's Sales Compensation Plan. The estimated annual salary range includes the on-target incentive compensation that may be attained in this role under the Sales Compensation Plan.
              - listitem [ref=f6e83]: "Application Deadline: December 8, 2026"
            - paragraph [ref=f6e84]:
              - strong [ref=f6e85]: Equity
            - paragraph [ref=f6e86]: This role is eligible to participate in Cloudflare’s equity plan.
            - paragraph [ref=f6e87]:
              - strong [ref=f6e88]: Benefits
            - paragraph [ref=f6e89]: Cloudflare offers a complete package of benefits and programs to support you and your family. Our benefits programs can help you pay health care expenses, support caregiving, build capital for the future and make life a little easier and fun! The below is a description of our benefits for employees in the United States, and benefits may vary for employees based outside the U.S.
            - paragraph [ref=f6e90]:
              - strong [ref=f6e91]: Health & Welfare Benefits
            - list [ref=f6e92]:
              - listitem [ref=f6e93]: Medical/Rx Insurance
              - listitem [ref=f6e94]: Dental Insurance
