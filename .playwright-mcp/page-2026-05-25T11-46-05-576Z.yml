        - region "Role description" [ref=e96]:
          - heading "Role description" [level=2] [ref=e97]
          - generic [ref=e98]:
            - heading "About Buffer" [level=2] [ref=e99]
            - paragraph [ref=e100]: We create social media and brand-building software for small businesses, creators, and individuals. Our mission is to provide essential tools to help small businesses get off the ground and grow. Through exceptional customer service and uplifting content, we help our customers believe they can succeed and do good along the way.
            - paragraph [ref=e101]:
              - text: Buffer is a fully distributed team, and we’ve always aimed to do things a little differently at Buffer. Since the early days, we’ve focused on building one of the most unique and fulfilling workplaces by rethinking a lot of traditional practices. We also default to transparency, so you can read all about our metrics, and our successes and failures along the way on our
              - link "Transparency Dashboard" [ref=e102] [cursor=pointer]:
                - /url: https://buffer.com/open
              - text: .
            - paragraph [ref=e103]:
              - text: We're united by Buffer's
              - link "values" [ref=e104] [cursor=pointer]:
                - /url: https://buffer.com/about#values
              - text: ", and we hire and work from all over the world. We strive to create a diverse and inclusive work environment, and we are building a culture where underrepresented groups are welcome and can flourish. Please note that we do travel to work together in person once or twice per year, and those events are highly encouraged to build deeper connections among our small team."
            - paragraph [ref=e105]:
              - text: As you get to know Buffer and consider joining the journey, feel free to read more from
              - link "Kirsti" [ref=e106] [cursor=pointer]:
                - /url: https://buffer.com/resources/first-30-days-buffer/
              - text: and
              - link "Sabreen" [ref=e107] [cursor=pointer]:
                - /url: https://buffer.com/resources/joined-3-days-before-the-retreat/
              - text: as they share their first experiences with Buffer, as well as from
              - link "Hailley" [ref=e108] [cursor=pointer]:
                - /url: https://buffer.com/resources/8-years-at-buffer/
              - text: ", who captured why she still calls Buffer home after 8+ years."
            - paragraph
            - heading "About the role" [level=2] [ref=e109]
            - paragraph [ref=e110]: We’re looking for a senior backend engineer to join the Channels and Platform team at Buffer. You will play a key role in building our public API and creating a future plug-in ecosystem that would elevate Buffer into a platform other developers can build on top of, providing creators the next generation of tools for writing, editing, and managing content.
            - paragraph [ref=e111]: We’re looking for someone with first-hand experience designing, implementing, and maintaining public APIs and/or extensibility platforms, who enjoys going deep — designing data models, shaping APIs, improving performance, and helping our systems scale with clarity and confidence. You’ll work closely with product, design, and mobile + web engineers to bring ideas to life and keep the user experience smooth and resilient.
            - paragraph [ref=e112]: We work iteratively and in tight feedback loops, balancing thoughtful engineering with steady momentum. In addition to building a new platform, you’ll help us strengthen our internal systems, making them faster, more scalable, and better equipped to power content creation at scale. There’s real room here to shape this direction and make an impact.
            - paragraph
            - heading "What you’ll do" [level=2] [ref=e113]
            - list [ref=e114]:
              - listitem [ref=e115]:
                - paragraph [ref=e116]: Be part of a small, dedicated squad within the Channels and Platform team responsible for Public API development.
              - listitem [ref=e117]:
                - paragraph [ref=e118]: Lead the development of the backend systems for the Buffer Platform. This includes creating an API for core Buffer features, internal services to ensure Public API stability, availability, high performance, and developer tools for platform clients.
              - listitem [ref=e119]:
                - paragraph [ref=e120]: Improve and evolve our internal systems — helping consolidate services into a monorepo, improve tooling and observability, and reduce complexity across the board.
              - listitem [ref=e121]:
                - paragraph [ref=e122]: Collaborate closely with engineers, product, and design to scope work, explore trade-offs, and find the simplest path to something great.
              - listitem [ref=e123]:
                - paragraph [ref=e124]: Make steady improvements to performance, reliability, and data modeling, helping us scale quality over time.
              - listitem [ref=e125]:
                - paragraph [ref=e126]: Participate in on-call rotation (all engineers take on a 24/7 week-long shift once a quarter on average) and day-to-day maintenance work required to keep the lights on the systems owned by the team (this includes bug fixing, addressing security vulnerabilities, incident follow-ups, etc.)
              - listitem [ref=e127]:
                - paragraph [ref=e128]: Contribute to shaping our engineering culture by sharing knowledge, reviewing code, and leading by example.
            - paragraph
            - heading "Helpful skills and experience" [level=2] [ref=e129]
            - list [ref=e130]:
              - listitem [ref=e131]:
                - paragraph [ref=e132]: You have practical experience designing, implementing, and maintaining public APIs, plug-in ecosystems, or extensibility platforms.
              - listitem [ref=e133]:
                - paragraph [ref=e134]: You have deep experience with modern stack — we use Node.js, TypeScript, GraphQL, and MongoDB.
              - listitem [ref=e135]:
                - paragraph [ref=e136]: You’ve led backend projects from start to finish — shaping architecture, guiding trade-offs, and delivering reliable systems that support real-world product needs.
              - listitem [ref=e137]:
                - paragraph [ref=e138]: You have strong systems thinking. You look beyond the immediate task, anticipate downstream effects, and help teams converge on architecture that supports the long game.
              - listitem [ref=e139]:
                - paragraph [ref=e140]: You’ve worked across teams to drive platform or infrastructure improvements — whether simplifying service boundaries, improving observability, or evolving internal tooling.
              - listitem [ref=e141]:
                - paragraph [ref=e142]: You’ve contributed to collaborative or multi-user product features, and you understand the data, consistency, and UX considerations that come with them.
              - listitem [ref=e143]:
                - paragraph [ref=e144]: You’re fluent with modern AI tools — not just using them for code generation, but integrating them into how you debug, document, explore ideas, and reduce manual effort.
              - listitem [ref=e145]:
                - paragraph [ref=e146]: You care about performance, scale, and clean abstractions — and know how to measure, prioritize, and improve them pragmatically.
              - listitem [ref=e147]:
                - paragraph [ref=e148]: You’ve influenced engineering culture through code reviews, mentoring, or leading by example, and you’re comfortable being a resource for others on architectural decisions.
              - listitem [ref=e149]:
                - paragraph [ref=e150]: You have a personal stake in the world of content creation; maybe you’ve run a newsletter, built an audience on social media, or regularly shared your own work online. You’ve used Buffer before and care about the experience of planning, creating, and publishing content.
              - listitem [ref=e151]:
                - paragraph [ref=e152]: You thrive in remote, async environments. You’re clear in your thinking, generous with context, and don’t wait for perfect information to get started.
              - listitem [ref=e153]:
                - paragraph [ref=e154]: You’ve likely been doing this for 7+ years, but experience depth and impact matter more to us than a specific number.
            - paragraph
            - heading "Our tech stack" [level=2] [ref=e155]
            - list [ref=e156]:
              - listitem [ref=e157]:
                - paragraph [ref=e158]: We use NodeJS, TypeScript, and MongoDB, but part of our core legacy systems are written in PHP (including old APIs)
              - listitem [ref=e159]:
                - paragraph [ref=e160]: We are in the process of migrating to GraphQL, and we use Apollo Client in our web application.
              - listitem [ref=e161]:
                - paragraph [ref=e162]: We are running our services on AWS with Kubernetes. We follow a microservices architecture and are currently moving our services into a central shared monorepo.
              - listitem [ref=e163]:
                - paragraph [ref=e164]: On the frontend, we use React and TypeScript for our web frontends
              - listitem [ref=e165]:
                - paragraph [ref=e166]: We have an internal design system called Popcorn that we started developing last year. It is built with Radix primitives, CSS modules, Storybook, and our own system of design tokens
              - listitem [ref=e167]:
                - paragraph [ref=e168]: We write automated tests with jest, react testing library (for integration tests), and Playwright (for e2e tests)
            - paragraph
            - heading "Interview process" [level=2] [ref=e169]
            - paragraph [ref=e170]: Here's what our hiring process for this role is like.
            - list [ref=e171]:
              - listitem [ref=e172]:
                - paragraph [ref=e173]:
                  - strong [ref=e174]: Application.
                  - text: When submitting your application and resume, tell us why you want to join Buffer and take your time. This is your chance to make a strong first impression.
                - list [ref=e175]:
                  - listitem [ref=e176]:
                    - paragraph [ref=e177]: "Please note: While we have several engineering roles open, we recommend applying to only one role - just choose one that resonates with you the most. If during our review or interviews we think you'd be great for a different position, we'll re-route your application internally."
              - listitem [ref=e178]:
                - paragraph [ref=e179]:
                  - strong [ref=e180]: Hiring manager interview.
                  - text: Chat with the hiring manager for your role to understand what it takes to work at Buffer. This is an opportunity for both sides to get to know each other and determine whether our expectations align.
              - listitem [ref=e181]:
                - paragraph [ref=e182]:
                  - strong [ref=e183]: Code review assignment.
                  - text: We'll send you
                  - strong [ref=e184]
                  - text: 30-minute asynchronous assignment to review a pull request, to help us understand how you think about code and communicate technical ideas.
              - listitem [ref=e185]:
                - paragraph [ref=e186]:
                  - strong [ref=e187]: Technical interviews.
                  - text: Interview with a couple of engineers from Buffer focused on your technical experience and approach. Additionally, for senior+ roles, we'll have an additional conversation about your leadership, how you work with teams, and how you approach the broader challenges that come with this level.
              - listitem [ref=e188]:
                - paragraph [ref=e189]:
                  - strong [ref=e190]: Meet the CEO.
                  - text: At the very end, you will have the opportunity to meet with Joel Gascoigne, our CEO. This is a great chance for you to gain a deeper understanding of Buffer's strategy, values, and work processes.
              - listitem [ref=e191]:
                - paragraph [ref=e192]:
                  - strong [ref=e193]: Collaboration period.
                  - text: This is experimental stage for us where you would work with us on a real project over 2 days (fully paid). The goal is to see how it feels to work in the team, both for us and for you. You'll meet a few bufferoos, we'll kickoff the project, and invite you to a Slack and you'll collaborate with the team on it.
              - listitem [ref=e194]:
                - paragraph [ref=e195]:
                  - strong [ref=e196]: Offer.
                  - text: We wrap it up with an offer and discuss the final details. We would align on the last bits before we make you part of the Buffer team 💛
            - paragraph [ref=e197]:
              - emphasis [ref=e198]: At Buffer, we value diversity of experience, and we understand that comes in many forms. We’re dedicated to adding new perspectives to the team. So, if your experience is close to what we’re looking for, please consider applying.
            - paragraph [ref=e199]:
              - emphasis [ref=e200]: By submitting the application, you consent to Buffer collecting and processing your personal data for recruiting purposes, find more details in our
              - link "Privacy Policy" [ref=e201] [cursor=pointer]:
                - /url: https://buffer.notion.site/Privacy-Policy-for-Applicants-230a7f5a00fd80e48478f09171d18a24?pvs=143
                - emphasis [ref=e202]: Privacy Policy
              - emphasis [ref=e203]: .
