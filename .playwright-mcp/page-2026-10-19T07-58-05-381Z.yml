        - heading "What this means" [level=2] [ref=f32e114]
        - paragraph [ref=f32e115]:
          - generic [ref=f32e116]:
            - strong [ref=f32e117]: For candidates.
            - text: Our roles are advertised as remote, but "remote" means remote within the countries listed above. To be considered, you generally need to already have the right to work in one of them. If you are based somewhere not on this list, it is not an automatic no, so do talk to the recruiter, but we may not be able to employ you.
        - paragraph [ref=f32e118]:
          - generic [ref=f32e119]:
            - strong [ref=f32e120]: For current employees.
            - text: If you already live and work somewhere that is not on this list, nothing changes for you. You can stay where you are.
        - paragraph [ref=f32e121]:
          - generic [ref=f32e122]:
            - strong [ref=f32e123]: For relocations.
            - text: If you are thinking about moving countries, the list above is the boundary for staff-initiated relocations. Anything outside it needs an exception review before you commit to a move. Please start that conversation with People Operations early, and read the Global Mobility Policy alongside this page.
        - heading "Why we work this way" [level=2] [ref=f32e124]
        - paragraph [ref=f32e125]: Focusing on countries where we already have tested onboarding processes lets us move candidates through hiring faster and with fewer surprises. Every additional country brings its own labour laws, EOR requirements, and new processes to work through, which slows things down for hiring teams and new colleagues alike. Concentrating our footprint keeps the experience consistent and supports GD's wider absorption capacity goals.
        - heading "Questions" [level=2] [ref=f32e126]
        - paragraph [ref=f32e127]: Reach out to the People Team. If you are unsure whether something counts as an edge case, flag it, and we will work through it with you.
