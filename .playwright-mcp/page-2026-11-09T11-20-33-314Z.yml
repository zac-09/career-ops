    - generic [ref=f62e42]:
      - heading "Core Values" [level=2] [ref=f62e43]
      - list [ref=f62e44]:
        - listitem [ref=f62e45]:
          - heading "We’re egolessly mission driven." [level=3] [ref=f62e46]
          - paragraph [ref=f62e47]: We never forget why we’re in it—to make life better for everyone that touches our products. The people that use Wave to do their jobs, send money to loved ones or save their day’s wages—they’re our real bosses.
        - listitem [ref=f62e48]:
          - heading "We don’t wait—we live our fullest lives now." [level=3] [ref=f62e49]
          - paragraph [ref=f62e50]: Collectively, we take care of our users first, but individually we take time offline to live a full life, whether that means choosing our working hours carefully, turning off notifications, or taking long vacations.
        - listitem [ref=f62e51]:
          - heading "We’re embarrassingly honest." [level=3] [ref=f62e52]
          - paragraph [ref=f62e53]: At most companies, admitting your mistakes is seen as weakness, and direct communication about hard things is taboo. At Wave, being vulnerable and honest about your mistakes is a sign of strength, and giving honest feedback to teammates is an act of generosity.
        - listitem [ref=f62e54]:
          - heading "We maximize our rate of learning." [level=3] [ref=f62e55]
          - paragraph [ref=f62e56]: We’re always iterating on our personal goals and habits to become more effective and happier. Most importantly, we do this fast. The faster we run these loops—as a company and individuals—the faster we’ll achieve our mission.
