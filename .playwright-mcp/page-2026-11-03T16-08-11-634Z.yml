  - main [ref=f29e85]:
    - generic [ref=f29e88]:
      - heading "Senior Backend Software Engineer, DX" [level=1] [ref=f29e89]
      - paragraph [ref=f29e91]: Engineering | Remote, Americas | Remote, Remote
      - link "Apply for this job" [ref=f29e94] [cursor=pointer]:
        - /url: https://careers-americas.icims.com/jobs/27730/senior-backend-software-engineer%2c-dx/job?mode=apply
    - generic [ref=f29e97]:
      - generic [ref=f29e98]:
        - paragraph [ref=f29e100]: Working at Atlassian
        - paragraph [ref=f29e102]: Atlassians can choose where they work – whether in an office, from home, or a combination of the two. That way, Atlassians have more control over supporting their family, personal goals, and other priorities. We can hire people in any country where we have a legal entity.
        - paragraph [ref=f29e104]: To help our teams work together effectively, this role is fully remote across all USA time zones, with a preference for Pacific Time or Mountain Standard Time Zones.
        - paragraph [ref=f29e106]: "We're looking for a Senior Backend Software Engineer to join our DX team, particularly having experience with third-party integrations. You’ll work end‑to‑end on features: from shaping vague problem statements with product and design, to shipping high‑quality code, to measuring impact and iterating quickly."
      - generic [ref=f29e107]:
        - paragraph [ref=f29e109]: "What You'll Do:"
        - list [ref=f29e111]:
          - listitem [ref=f29e112]:
            - paragraph [ref=f29e113]: Drive large, complex projects autonomously, from technical design to launch
          - listitem [ref=f29e114]:
            - paragraph [ref=f29e115]: Tackle complex architecture challenges, apply architectural standards and start using them on new projects
          - listitem [ref=f29e116]:
            - paragraph [ref=f29e117]: Lead code reviews & documentation as well as take on complex bug fixes, especially on high-risk problems
          - listitem [ref=f29e118]:
            - paragraph [ref=f29e119]: Be an example for thorough, meaningful code reviews
          - listitem [ref=f29e120]:
            - paragraph [ref=f29e121]: Partner across engineering teams to tackle company-wide initiatives spanning multiple projects
          - listitem [ref=f29e122]:
            - paragraph [ref=f29e123]: Mentor junior members of the team
      - generic [ref=f29e124]:
        - paragraph [ref=f29e126]: At Atlassian, we strive to design equitable, explainable, and competitive compensation programs. We follow consistent hiring practices and account for each candidate's skills, knowledge, and experience when setting base pay within the range.
        - paragraph [ref=f29e128]:
          - text: Please visit
          - link "go.atlassian.com/payzones" [ref=f29e129] [cursor=pointer]:
            - /url: http://go.atlassian.com/payzones
          - text: for more information on which locations are included in each of our geographic pay zones. However, please confirm the zone for your specific location with your recruiter.
        - paragraph [ref=f29e131]: This role may also be eligible for benefits, bonuses, commissions, and equity.
      - generic [ref=f29e132]:
        - paragraph [ref=f29e134]: "In The Americas, we have three geographic pay zones. For this role, our current base pay ranges for new hires in each zone are:"
        - generic:
          - paragraph
        - paragraph [ref=f29e136]: "Zone A: $180,000 - $235,000"
        - generic:
          - paragraph
        - paragraph [ref=f29e138]: "Zone B: $162,000 - $211,500"
        - generic:
          - paragraph
        - paragraph [ref=f29e140]: "Zone C: $149,400 - $195,050"
      - generic [ref=f29e141]:
        - paragraph [ref=f29e143]: "Your Background:"
        - list [ref=f29e145]:
          - listitem [ref=f29e146]:
            - paragraph [ref=f29e147]: 5+ years experience building and developing backend applications
          - listitem [ref=f29e148]:
            - paragraph [ref=f29e149]: Bachelor's or Master's degree with a preference for Computer Science degree - Senior-level
          - listitem [ref=f29e150]:
            - paragraph [ref=f29e151]: Experience with third-party integrations
          - listitem [ref=f29e152]:
            - paragraph [ref=f29e153]: Experience with one or more prominent languages such as Java, Python, Kotlin, Go, or Ruby on Rails is required.
          - listitem [ref=f29e154]:
            - paragraph [ref=f29e155]: Understanding of SaaS, PaaS, IaaS industry with hands-on experience with public cloud offerings (e.g., AWS, GCP, Azure)
          - listitem [ref=f29e156]:
            - paragraph [ref=f29e157]: Fluency in any one database technology (e.g. RDBMS like Oracle or Postgres and/or NoSQL like DynamoDB or Cassandra)
          - listitem [ref=f29e158]:
            - paragraph [ref=f29e159]: Experience crafting and implementing well-tested, highly scalable and performant micro-services
          - listitem [ref=f29e160]:
            - paragraph [ref=f29e161]: and/or other distributed systems
          - listitem [ref=f29e162]:
            - paragraph [ref=f29e163]: Practical knowledge of agile software development methodologies (e.g., XP, scrum)
          - listitem [ref=f29e164]:
            - paragraph [ref=f29e165]: Knowledge to evaluate trade-offs between correctness, robustness, performance, space and time
          - listitem [ref=f29e166]:
            - paragraph [ref=f29e167]: Practice in mentoring other engineers and influencing decision makers throughout the organization
        - paragraph [ref=f29e169]: Benefits & Perks
        - paragraph [ref=f29e171]:
          - text: Atlassian offers a wide range of perks and benefits designed to support you, your family and to help you engage with your local community. Our offerings include health and wellbeing resources, paid volunteer days, and so much more. To learn more, visit
          - link "go.atlassian.com/perksandbenefits" [ref=f29e172] [cursor=pointer]:
            - /url: http://go.atlassian.com/perksandbenefits
          - text: .
        - paragraph [ref=f29e175]: About Atlassian
        - paragraph [ref=f29e177]: "At Atlassian, we're motivated by a common goal: to unleash the potential of every team. Our software products help teams all over the planet and our solutions are designed for all types of work. Team collaboration through our tools makes what may be impossible alone, possible together."
        - paragraph [ref=f29e179]: We believe that the unique contributions of all Atlassians create our success. To ensure that our products and culture continue to incorporate everyone's perspectives and experience, we never discriminate based on race, religion, national origin, gender identity or expression, sexual orientation, age, or marital, veteran, or disability status. All your information will be kept confidential according to EEO guidelines.
        - paragraph [ref=f29e181]: To provide you the best experience, we can support with accommodations or adjustments at any stage of the recruitment process. Simply inform our Recruitment team during your conversation with them.
        - paragraph [ref=f29e183]:
          - text: To learn more about our culture and hiring process, visit
          - link "go.atlassian.com/crh" [ref=f29e184] [cursor=pointer]:
            - /url: http://go.atlassian.com/crh
          - text: .
        - paragraph [ref=f29e187]: In line with local law, identity verification (which may include use of biometric data) is a condition of employment with Atlassian for employment fraud purposes.
