              - emphasis [ref=e46]: Michelle Langston on her background as a designer, what drew her to Automattic, and what keeps her here.
        - generic [ref=e47]:
          - generic [ref=e48]:
            - heading "Our hiring process" [level=2] [ref=e49]
            - paragraph [ref=e50]:
              - emphasis [ref=e51]: This is our standard process; however, the hiring steps may differ by role to ensure we choose candidates who will thrive as Automatticians.
          - generic [ref=e52]:
            - heading "1 Application" [level=3] [ref=e53]:
              - text: "1"
              - emphasis [ref=e54]: Application
            - paragraph [ref=e55]: You submit a formal application for a current job opening, giving us a sense of your communication style. We assess based on criteria that vary depending on the opening and the needs of the team, and pay close attention to your answers — so share as much relevant information as possible! If your application advances, we’ll invite you to complete a criteria assessment designed to evaluate the specific skills and competencies we’re looking for in this role.
            - heading "2 Interview" [level=3] [ref=e56]:
              - text: "2"
              - emphasis [ref=e57]: Interview
            - paragraph [ref=e58]: One of the first steps in the application process is a Slack or Zoom interview. While some roles start with a written interview on Slack, others require Zoom interviews, so we can get to know you better live.
            - heading "3 Trial" [level=3] [ref=e59]:
              - text: "3"
              - emphasis [ref=e60]: Trial
            - paragraph [ref=e61]: Our jobs involve a paid trial in the application process, which is a short project or set of tasks that will be assessed by our hiring teams. You will have the chance to work on something that’s closely aligned with the role you’re interviewing for, and tackle a specific, real problem.
            - heading "4 Final Interview" [level=3] [ref=e62]:
              - text: "4"
              - emphasis [ref=e63]: Final Interview
            - paragraph [ref=e64]: Once a candidate successfully completes their trial, many teams require a final interview — typically conducted by an executive leader within the business unit — before proceeding to the offer stage.
            - heading "5 The Offer" [level=3] [ref=e65]:
              - text: "5"
              - emphasis [ref=e66]: The Offer
            - paragraph [ref=e67]:
              - text: Our HR folks will share feedback from the hiring process and tender a formal offer to join Automattic — one that takes account of your
              - link "compensation" [ref=e68] [cursor=pointer]:
                - /url: /compensation/
              - text: expectations, interview feedback, work experience, and trial performance. Welcome aboard!
            - generic [ref=e69]:
              - link "Learn more" [ref=e71] [cursor=pointer]:
                - /url: /how-we-hire/
              - link "Open jobs" [ref=e73] [cursor=pointer]:
                - /url: https://automattic.com/jobs/
