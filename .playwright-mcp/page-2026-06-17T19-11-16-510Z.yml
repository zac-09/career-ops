          - generic [ref=e123]:
            - heading "We also meet(up) live" [level=3] [ref=e125]
            - generic [ref=e126]:
              - paragraph [ref=e127]: Since the pandemic, we’ve focused on smaller groups, division meetups, and so on, that accomplish bonding and coworking on a manageable scale.
              - paragraph [ref=e128]:
                - text: Awesome places we’ve met include San Francisco, California; La Paz, Mexico; Oracle, Arizona; Breckenridge, Colorado; Mont-Sainte-Anne, Québec; Budapest, Hungary; San Diego, California; Santa Cruz, California; Park City, Utah; Whistler, Canada; Orlando, Florida; London, England; Dubai, United Arab Emirates; Madrid, Spain; Amsterdam, The Netherlands; Montreal, Québec; and many more.
                - text: In addition to our larger meetups, individual teams meet for five to seven days to brainstorm team-level strategy and bond in locales ranging from Boulder to Buenos Aires, Las Vegas to Lisbon, Montréal to Mexico City, and Vienna to Vietnam. If you join our merry band, expect to travel three to four weeks per year.
