        - generic [ref=e103]:
          - generic [ref=e104]:
            - heading "Our remote-first culture" [level=3] [ref=e106]
            - generic [ref=e107]:
              - paragraph [ref=e108]: This isn’t your typical work-from-home job. Everyone works from the location they choose, during the hours they choose. We’re spread out all over the world. We track about 70 percent of our projects on P2-themed WordPress.com blogs, 25 percent in private chat rooms, and the rest on Slack. Because of the geographic variance, we’re active 24/7. But don’t let that worry you. This is not a work-’til-you-drop place. We encourage work-life balance, and care about the work you produce, not the hours you put in.
              - paragraph [ref=e109]:
                - link "How We Work" [ref=e110] [cursor=pointer]:
                  - /url: https://automattic.com/how-we-work/
          - generic [ref=e112]:
            - heading "Why you’ll love working here" [level=3] [ref=e114]
            - generic [ref=e115]:
              - paragraph [ref=e116]:
                - text: Making the web a better place is rewarding in its own right, but we also provide professional growth, an open vacation policy, generous parental leaves, wellness support,
                - link "sabbaticals" [ref=e117] [cursor=pointer]:
                  - /url: https://automattic.com/benefits/sabbatical/
                - text: ", and more. Our main"
                - link "benefits are listed here" [ref=e118] [cursor=pointer]:
                  - /url: https://automattic.com/benefits/
                - text: . Additional benefits vary
                - link "by location" [ref=e119] [cursor=pointer]:
