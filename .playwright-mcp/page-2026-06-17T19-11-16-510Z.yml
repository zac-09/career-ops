        - heading "Work with us from wherever you like" [level=1] [ref=e28]
        - generic [ref=e30]:
          - paragraph [ref=e31]: Explore the remote job opportunities at Automattic. Work from anywhere, and make the web a better place for everyone, everywhere. Check out today’s open jobs.
          - link "View open jobs" [ref=e34] [cursor=pointer]:
            - /url: https://automattic.com/jobs/
        - generic [ref=e38]:
          - paragraph [ref=e40]: We’re 1,451 Automatticians in 82 countries speaking 108 languages. We democratize publishing and commerce so anyone with a story can tell it, and anyone with a product can sell it, regardless of income, gender, politics, language, or country.
