                  - paragraph [ref=e70]
                  - paragraph [ref=e71]: Trusted by 20,000+ property managers worldwide, Hostaway is an industry leading, AI-powered vacation rental management platform designed for professional short-term rental operators. Hostaway brings everything together for greater efficiency and faster growth.
                  - paragraph [ref=e72]
                  - paragraph [ref=e73]:
                    - text: Profitable, high-growth, and the first short-term rental PMS unicorn 🦄. Join us at our most exciting stage yet! Learn more about our recent valuation and story
                    - link "here" [ref=e75] [cursor=pointer]:
                      - /url: https://www.hostaway.com/blog/short-term-rental-software-unicorn/?placement=&keyword=hostaway&utm_campaign=gg_emea_dg_search_brand_exact&utm_source=google&utm_medium=paid_search&utm_content=brand_exact&utm_term=hostaway&hsa_acc=1558130764&hsa_cam=20285764070&hsa_grp=149795465945&hsa_ad=703390329010&hsa_src=g&hsa_tgt=kwd-323175560058&hsa_kw=hostaway&hsa_mt=e&hsa_net=adwords&hsa_ver=3&gad_source=1&gclid=CjwKCAiA9bq6BhAKEiwAH6bqoFzIiBxWyYjgj1eHkWBbx21yE_0H832dTtEPhfNCYj-TMlL-GnknahoCGzkQAvD_BwE
                    - text: .
                  - paragraph [ref=e76]
                  - heading "About the role" [level=3] [ref=e77]:
                    - strong [ref=e78]: About the role
                  - paragraph [ref=e79]: We are looking for a delivery-focused Staff Backend Engineer to build our new Trust Accounting subsystem. This is a greenfield opportunity to design and deliver a financial system that property managers can trust—one that is accurate, compliant, and reliable.
                  - paragraph [ref=e80]: You will have a significant impact on shaping the financial operations of Hostaway's customers, allowing them to maintain compliant records and properly manage funds.
                  - paragraph [ref=e81]
                  - paragraph [ref=e82]: As a founding member of this new team, you will be responsible for the architecture and technical direction of this critical platform. You’ll influence architecture, processes, and delivery from day one, establishing a culture where correctness and accountability are paramount. Your work will directly determine how effectively Hostaway can deliver secure and auditable financial services to our customers.
                  - paragraph [ref=e83]
                  - heading "What You’ll Do" [level=3] [ref=e84]:
                    - strong [ref=e85]: What You’ll Do
                  - list [ref=e86]:
                    - listitem [ref=e87]:
                      - paragraph [ref=e88]:
                        - text: •
                        - strong [ref=e89]: "Architect a Greenfield System:"
                        - text: Lead the greenfield development, owning the architecture and technical vision for the V1 Trust Accounting product.
                    - listitem [ref=e90]:
                      - paragraph [ref=e91]:
                        - text: •
                        - strong [ref=e92]: "Build Production-Grade Financial Infrastructure:"
                        - text: Design and implement the core backend services for a secure, scalable, and auditable trust accounting subsystem with the highest quality standards.
                    - listitem [ref=e93]:
                      - paragraph [ref=e94]:
                        - text: •
                        - strong [ref=e95]: "Drive Quality and Reliability:"
                        - text: Establish quality gates, robust testing, and CI/CD integration to ensure every feature ships with measurable confidence and correctness.
                    - listitem [ref=e96]:
                      - paragraph [ref=e97]:
                        - text: •
                        - strong [ref=e98]: "Champion Engineering Best Practices:"
                        - text: Drive best practices for system design, observability, and security across the organization, with a focus on quality, resilience, and financial accuracy.
                    - listitem [ref=e99]:
                      - paragraph [ref=e100]:
                        - text: •
                        - strong [ref=e101]: "Collaborate and Influence:"
                        - text: Work closely with product, design, finance, and legal teams to deliver a seamless product. Provide technical context in discussions to foster transparency and accountability.
                    - listitem [ref=e102]:
                      - paragraph [ref=e103]:
                        - text: •
                        - strong [ref=e104]: "Mentor and Elevate Engineers:"
                        - text: Raise the technical bar across the team and beyond through code reviews, architectural guidance, and hands-on pairing.
                  - paragraph [ref=e105]
                - heading "Job requirements" [level=2] [ref=e106]
                - generic [ref=e108]:
                  - list [ref=e109]:
                    - listitem [ref=e110]:
                      - paragraph [ref=e111]:
                        - text: •
                        - strong [ref=e112]: 8+ years
                        - text: of software engineering experience, with at least 2 years operating at a Staff Engineer or equivalent level.
                    - listitem [ref=e113]:
                      - paragraph [ref=e114]:
                        - text: •
                        - strong [ref=e115]: "Deep Backend Expertise:"
                        - text: High proficiency in a backend language like Go for building production-grade services.
                    - listitem [ref=e116]:
                      - paragraph [ref=e117]:
                        - text: •
                        - strong [ref=e118]: "Production Experience:"
                        - text: You've built, shipped, and operated critical backend systems that serve real users at scale. You understand the operational realities of reliability, observability, and failure modes.
                    - listitem [ref=e119]:
                      - paragraph [ref=e120]:
                        - text: •
                        - strong [ref=e121]: "Strong Architectural Instincts:"
                        - text: You can design systems that start simple and evolve gracefully, making pragmatic trade-offs between speed and extensibility.
                    - listitem [ref=e122]:
                      - paragraph [ref=e123]:
                        - text: •
                        - strong [ref=e124]: "Experience with Accounting or Ledger Products:"
                        - text: Familiarity with financial systems, accounting principles, or ledger products is a significant plus.
                    - listitem [ref=e125]:
                      - paragraph [ref=e126]:
                        - text: •
                        - strong [ref=e127]: "Cross-Team Influence:"
                        - text: You lead through clarity and credibility, not authority, and have successfully driven the adoption of platforms, patterns, or standards.
                    - listitem [ref=e128]:
                      - paragraph [ref=e129]:
                        - text: •
                        - strong [ref=e130]: "Infrastructure Fluency:"
                        - text: Comfortable with AWS, Kubernetes, CI/CD pipelines, and operating services in production.
                    - listitem [ref=e131]:
                      - paragraph [ref=e132]:
                        - text: •
                        - strong [ref=e133]: "Polyglot Comfort:"
                        - text: Hostaway’s product includes Go services, a PHP monolith, and a React frontend. You should have the curiosity and adaptability to integrate with code across these technologies.
                  - paragraph [ref=e134]
                  - heading "What Success Looks Like" [level=3] [ref=e135]:
                    - strong [ref=e136]: What Success Looks Like
                  - list [ref=e137]:
                    - listitem [ref=e138]:
                      - paragraph [ref=e139]: • The Trust Accounting subsystem is delivered reliably, is trusted by customers and regulators, and integrates seamlessly into the Hostaway platform.
                    - listitem [ref=e140]:
                      - paragraph [ref=e141]: • The system is high-throughput and low-error, providing accurate, auditable data to customers.
                    - listitem [ref=e142]:
                      - paragraph [ref=e143]: • Financial correctness and compliance are central to the product's design and operation.
                    - listitem [ref=e144]:
                      - paragraph [ref=e145]: • You become a go-to technical authority for financial systems and backend architecture at Hostaway.
                    - listitem [ref=e146]:
                      - paragraph [ref=e147]: • The platform scales to meet growing demand without requiring a fundamental re-architecture.
                  - paragraph [ref=e148]
                  - heading "What we offer" [level=3] [ref=e149]:
                    - strong [ref=e150]: What we offer
                  - list [ref=e151]:
                    - listitem [ref=e152]:
                      - paragraph [ref=e153]:
                        - text: •
                        - strong [ref=e154]: "Competitive Compensation:"
                        - text: We offer competitive pay based on market rates in the country of the applicant.
                    - listitem [ref=e155]:
                      - paragraph [ref=e156]:
                        - text: •
                        - strong [ref=e157]: "100% Remote:"
                        - text: Enjoy the freedom to work from anywhere within your country of residence—be it a co-working space, your home office, or even your dining room table. The choice is yours. Just don’t ask to work in our office (we don’t have one).
                    - listitem [ref=e158]:
                      - paragraph [ref=e159]:
                        - text: •
                        - strong [ref=e160]: "Equity:"
                        - text: Every role in our company comes with valuable stock options in a fast-growing and profitable company. This ensures we all share in the company’s success.
                    - listitem [ref=e161]:
                      - paragraph [ref=e162]:
                        - text: •
                        - strong [ref=e163]: "Values-Driven Leadership:"
                        - text: Our Core Values are not just words we’ve written to make us feel good. We leverage them daily when making strategic and tactical decisions.
                    - listitem [ref=e164]:
                      - paragraph [ref=e165]:
                        - text: •
                        - strong [ref=e166]: "Professional Growth:"
                        - text: Our rapid growth offers unparalleled learning and development opportunities, along with a multitude of career advancement opportunities.
                    - listitem [ref=e167]:
                      - paragraph [ref=e168]:
                        - text: •
                        - strong [ref=e169]: "Annual Paid Leave:"
                        - text: The specific amounts vary by country and are aligned with country and/or contract-specific norms.
                    - listitem [ref=e170]:
                      - paragraph [ref=e171]:
                        - text: •
                        - strong [ref=e172]: "Geographic Specific Benefits:"
                        - text: As an international employer, we offer different country-specific benefits such as Health Insurance and Pensions in countries where these perks are customary. The specifics depend on the country of the applicant.
                    - listitem [ref=e173]:
                      - paragraph [ref=e174]:
                        - text: •
                        - strong [ref=e175]: "Dynamic Team Culture:"
                        - text: As a global company with team members in over 40 countries, our diverse and international culture fuels our innovation and creativity, providing a key pillar to our success (and making it a lot of fun to work here).
                  - paragraph [ref=e176]
                  - paragraph [ref=e177]: Thank you for your interest. If you apply for this role, you will receive an email from our Talent Acquisition team after your application has been reviewed alongside the qualifications for this role and the qualifications of others who have applied.
