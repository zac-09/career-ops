          - heading "Why Apply Proactively?" [level=4] [ref=e34]:
            - strong [ref=e35]: Why Apply Proactively?
          - paragraph [ref=e36]: At Open Energy Transition, we value initiative and creativity. We recognize that exceptional talent may not always align with our posted roles but can make significant contributions to our mission.
          - paragraph [ref=e37]: By submitting a proactive application, you give us the opportunity to consider your skills, experience, and cultural alignment for future roles.
          - heading "Who Should Apply?" [level=4] [ref=e38]:
            - strong [ref=e39]: Who Should Apply?
          - paragraph [ref=e40]: "We encourage applications from individuals who:"
          - list [ref=e41]:
            - listitem [ref=e42]: Are deeply passionate about advancing the global energy transition.
            - listitem [ref=e43]: Have expertise in areas such as energy modeling, data analysis, or other fields relevant to our mission.
            - listitem [ref=e44]: Thrive in a collaborative, flexible, and mission-driven environments, with a flat hierarchy, and lots of collaboration across fully remote teams and different cultures.
          - heading "What We Look For" [level=4] [ref=e45]:
            - strong [ref=e46]: What We Look For
          - paragraph [ref=e47]: "When reviewing proactive applications, we consider:"
          - list [ref=e48]:
            - listitem [ref=e49]: Relevant skills, experience, and/or projects that align with our mission and goals.
            - listitem [ref=e50]: Demonstrated initiative, adaptability, dedication, self-management, and teamwork (including cross-functional collaboration).
            - listitem [ref=e51]: A clear connection to Open Energy Transition’s vision and values (which you can learn more about on our website).
            - listitem [ref=e52]: Having worked in a fully remote role before is a bonus (our team members are based all around the world - mainly in the EMEA region).
          - paragraph [ref=e53]: We also value the diversity of our team. OET is open to applicants from all backgrounds, cultures, regions, and language groups. If you require any special accommodations during hiring or work, please let us know when applying.
          - paragraph [ref=e54]: Individuals from both commercial and academic environments will be considered.
          - heading "Next Steps" [level=4] [ref=e55]:
            - strong [ref=e56]: Next Steps
          - paragraph [ref=e57]: "Please note: applying via the proactive posting does not mean you will be contacted. We only reach out to proactive applicants if a suitable role arises, and we wish to proceed with screening calls."
          - paragraph [ref=e58]: Your application will be reviewed and kept in our ATS. We may add certain individuals to specific Talent Pools for future consideration.
          - paragraph [ref=e59]: Should an opportunity arise that aligns with your skills and interests, we will reach out to explore next steps.
          - paragraph [ref=e60]: Join us in shaping a sustainable future. We look forward to learning more about you!
