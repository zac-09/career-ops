            - strong [ref=e31]: About Open Energy Transition
          - paragraph [ref=e32]:
            - text: Open Energy Transition is a non-profit organization dedicated to accelerating the global energy transition through innovative open-source energy planning solutions. We are a team of passionate individuals committed to creating a sustainable future by enabling accessible, effective, and transparent energy management tools. More info at
            - link "our website" [ref=e33] [cursor=pointer]:
