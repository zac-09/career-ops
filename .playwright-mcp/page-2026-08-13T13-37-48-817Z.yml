                    - strong [ref=f543e140]: )
                  - paragraph [ref=f543e141]: Make is an AI-first design and engineering agency based in Texas, with team members worldwide. We’re proud to have created award-winning software that has been featured in TechCrunch, Mashable, US Weekly, CBS News, Texas Monthly, and The Today Show. A multi-disciplinary team of engineers and designers, we are passionate about creating world-class software that people enjoy using. At the end of the day, more than our work life, it’s our life’s work 💙.
                  - paragraph [ref=f543e142]: We are a team of talented individuals who take ownership of the entire project beyond their own craft. We value proactive communication, autonomy, and initiative. You'll be joining a team of 'Managers of One'—people who set their own direction, identify what needs to be done, and dive in without waiting for permission 💯.
                  - paragraph [ref=f543e143]
