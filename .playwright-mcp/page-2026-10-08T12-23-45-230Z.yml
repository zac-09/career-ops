      - generic [ref=f15e74]:
        - heading "The database wasn't built for a world where every agent wants its own." [level=2] [ref=f15e75]
        - paragraph [ref=f15e76]: For decades, the default has been one big database per application. One large store, shared by everything, scaled within a single instance. That model is running out of room. AI agents need isolated workspaces. Consumer apps need per-user privacy. Multi-tenant platforms need hard customer boundaries. Global businesses need data sovereignty. The architecture teams want to build now require thousands, sometimes millions, of databases. The infrastructure they have makes that prohibitively expensive or operationally impossible.
        - paragraph [ref=f15e77]: Turso is an architecture designed from the ground up for many databases, not one large one.
