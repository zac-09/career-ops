            - paragraph [ref=f26e21]:
              - strong [ref=f26e22]: About GiveDirectly
              - strong [ref=f26e23]
            - paragraph [ref=f26e24]: "What if the most effective way to fight poverty was also the simplest: give people money and trust them to decide what they need?"
            - paragraph [ref=f26e25]: "Since 2011, GiveDirectly has proven that idea at scale. We’ve delivered more than $1B in cash directly to 2+ million people living in poverty and crisis across 15 countries, and rigorous research shows the results: healthier kids, stronger businesses, sturdier homes, and more resilient families and local economies. Cash is now widely recognized as one of the most scalable, cost-effective, and dignified forms of aid."
            - paragraph [ref=f26e26]:
              - text: "Our ambition goes beyond our own programs. We want cash to become the benchmark for aid, much as the index fund became the benchmark for investing, so that every aid dollar is held to one question:"
              - emphasis [ref=f26e27]: is this doing more good than giving the money directly to people living in poverty?
            - paragraph [ref=f26e28]:
              - strong [ref=f26e29]: We’re growing fast, and this is a rare and important moment to join.
            - paragraph [ref=f26e30]: We expect to hit $1B in revenue in 2026 with significant growth forecast for 2027. At the same time we are building a new technology stack and operating model designed for a roughly 10x change in scale, and we are actively pursuing partnerships with major funders to move even more money in bigger ways, to people who need it. We are known for our extensive integration of technology into field processes; our quantitative approach to performance measurement; and our commitment to rigorous, independent, experimental evaluation of our impact, with multiple Randomized Control Trials completed and others in progress.
            - paragraph [ref=f26e31]:
              - strong [ref=f26e32]: How we work
            - paragraph [ref=f26e33]: "Our team spans 20+ countries and 69 languages. Our culture is candid, analytical, and non-hierarchical. We expect high ownership and give people real responsibility early. Our values are central to how we hire, work, and grow, and they are deliberately opinionated:"
            - list [ref=f26e34]:
              - listitem [ref=f26e35]:
                - strong [ref=f26e36]: Recipients first.
                - text: Recipients’ preferences come before those of donors or ourselves.
              - listitem [ref=f26e37]:
                - strong [ref=f26e38]: Team next.
                - text: We optimize for organizational success, not individual success.
              - listitem [ref=f26e39]:
                - strong [ref=f26e40]: Be proactively candid.
                - text: We say what we believe and share information openly.
              - listitem [ref=f26e41]:
                - strong [ref=f26e42]: Create positive energy.
                - text: We aim to be a source of energy for colleagues, not a drain.
              - listitem [ref=f26e43]:
                - strong [ref=f26e44]: Think rigorously; act quickly.
                - text: We reason from first principles, then act rather than debate.
              - listitem [ref=f26e45]:
                - strong [ref=f26e46]: Know yourself and grow.
                - text: We own our imperfections and seek feedback to grow.
              - listitem [ref=f26e47]:
                - strong [ref=f26e48]: Accept reality. Propose solutions.
                - text: We focus on what can change and bring solutions, not just problems.
              - listitem [ref=f26e49]:
                - strong [ref=f26e50]: Be productively ambitious.
                - text: We take risks for step-change impact, not incremental progress.
            - paragraph [ref=f26e51]: If they describe how you like to work and they energize you, this could be a great fit.
            - paragraph [ref=f26e52]:
              - strong [ref=f26e53]: "Want to learn more? Read and listen:"
            - paragraph [ref=f26e54]:
              - text: We are one of
              - link "Time100’s" [ref=f26e55] [cursor=pointer]:
                - /url: https://time.com/collection/time100-most-influential-companies/2026/givedirectly/
              - text: Most Influential Companies of 2026, and our work has been covered by
              - link "The Economist" [ref=f26e56] [cursor=pointer]:
                - /url: https://www.economist.com/special-report/2024/01/10/givedirectly-does-what-it-says-on-the-tin
              - text: ","
              - link "NPR" [ref=f26e57] [cursor=pointer]:
                - /url: https://www.npr.org/sections/goatsandsoda/2023/12/07/1217478771/its-one-of-the-biggest-experiments-in-fighting-global-poverty-now-the-results-ar
              - text: ","
              - link "TED" [ref=f26e58] [cursor=pointer]:
                - /url: https://www.ted.com/talks/rory_stewart_to_end_extreme_poverty_give_cash_not_advice
              - text: ", and"
              - link "The Washington Post" [ref=f26e59] [cursor=pointer]:
                - /url: https://www.givedirectly.org/washingtonpost-apr-2024/
              - text: . We're now preparing to deliver billions of dollars a year to people in extreme poverty, if funding allows.
              - link "Read our CEO's essay" [ref=f26e60] [cursor=pointer]:
                - /url: https://www.givedirectly.org/deliver-billions
              - text: on what that will take.
          - generic [ref=f26e61]:
            - paragraph [ref=f26e62]:
              - strong [ref=f26e63]:
                - emphasis [ref=f26e64]: You must be based in one of the countries on
                - emphasis [ref=f26e65]:
                  - link "this list" [ref=f26e67] [cursor=pointer]:
                    - /url: https://perfectwiki.page/p/iOeyfUha_9
                - emphasis [ref=f26e68]: and must overlap with East Africa Time and US Eastern Time (8am-6pm) by at least 3 hours. As an example, 6PM East Africa Time is 11AM US Eastern time in the summer and 10AM in the winter. In practice, if you are in the Eastern US timezone, that means being regularly available for 8AM meetings and some 7AM ones. We know people have commitments like school drop-offs, so you’re encouraged to set a schedule that works for you—as long as there’s sufficient overlap with the team.
                - emphasis [ref=f26e69]: We are unable to sponsor or take over sponsorship of employment Visas in the U.S. or U.K. at this time.
            - paragraph [ref=f26e70]:
              - strong [ref=f26e71]: About this role
            - paragraph [ref=f26e72]: Technology plays a central role in how GiveDirectly delivers cash—whether that’s identifying recipients in hard-to-reach places, sending payments quickly after disasters, or powering the platforms our donors use to give.
            - paragraph [ref=f26e73]: "We’re hiring a Senior Software Engineer to help build the systems behind this work. Our engineering team still operates like a startup within GiveDirectly—lean, fast-moving, and high-autonomy. You’ll lean into product thinking, help shape the roadmap, and collaborate closely across disciplines to solve real-world problems. The specific team you’ll join is still being finalized—it could be:"
            - list [ref=f26e74]:
              - listitem [ref=f26e75]:
                - text: Our
                - strong [ref=f26e76]: Programs Engineering
                - text: team (getting cash in the hands of people experiencing extreme poverty),
              - listitem [ref=f26e77]:
                - text: Our
                - strong [ref=f26e78]: Fundraising Engineering
                - text: team (raising more money for recipients), or
              - listitem [ref=f26e79]:
                - text: Our
                - strong [ref=f26e80]: International Rapid Response
                - text: team (getting cash to disaster-affected communities within 5 days of a crisis—anywhere in the world)
            - paragraph [ref=f26e81]: "No matter the team, you’ll play a central role in scaling our impact: getting more money, to more people, more efficiently."
            - paragraph [ref=f26e82]: This is a hands-on role with real ownership. You’ll help shape architecture, ship production-ready code, and work side-by-side with teammates across product, data, and operations. We’re looking for someone excited to wear multiple hats, move quickly, and define what great engineering looks like in a mission-driven org
            - paragraph [ref=f26e83]:
              - strong [ref=f26e84]: "Level: Senior Software Engineer"
            - paragraph [ref=f26e85]:
              - strong [ref=f26e86]: "Travel Requirement:"
              - text: Must be able to travel ~1-2 times per year to one of our countries of operation for team retreats or field visits.
            - paragraph [ref=f26e87]:
              - strong [ref=f26e88]: "What you’ll do:"
            - list [ref=f26e89]:
              - listitem [ref=f26e90]: Design and build scalable, reliable systems that power our core operations—whether that’s donor platforms, systems that deliver payments directly to recipients, or crisis response tools reaching hundreds of thousands of people globally.
              - listitem [ref=f26e91]: Own end-to-end development of new features and services, from architecture through deployment and monitoring.
              - listitem [ref=f26e92]: Improve our developer workflows by strengthening CI/CD pipelines, reducing manual steps, and increasing test coverage.
              - listitem [ref=f26e93]: Collaborate with cross-functional teams (product, ops, data) to understand real-world needs and ship tools that directly support program delivery in the field.
              - listitem [ref=f26e94]: Debug and resolve production issues across our stack, with a focus on root cause analysis and long-term fixes.
              - listitem [ref=f26e95]: Advocate for sustainable engineering practices, including testing, documentation, and monitoring
              - listitem [ref=f26e96]: Help shape our tech roadmap with an eye toward scale, maintainability, and recipient experience
            - paragraph [ref=f26e97]:
              - strong [ref=f26e98]: "What you’ll bring:"
            - list [ref=f26e99]:
              - listitem [ref=f26e100]:
                - strong [ref=f26e101]: Exceptional alignment with
                - link [ref=f26e102] [cursor=pointer]:
                  - /url: https://www.givedirectly.org/givedirectly-values/
                  - strong [ref=f26e103]: GiveDirectly Values
                - text: "and active demonstration of our core competencies: emotional intelligence, problem solving, project management, follow-through, and fostering inclusivity. We welcome and strongly encourage applications from candidates who have personal or professional experience in the low-income and/or historically marginalized communities that we serve."
              - listitem [ref=f26e104]: "Language Requirement: English"
              - listitem [ref=f26e105]: 4+ years of industry experience creating production-caliber software and systems
              - listitem [ref=f26e106]: "Experience with backend architecture: databases, cloud services, APIs"
              - listitem [ref=f26e107]: Experience building infrastructure to deploy software
              - listitem [ref=f26e108]: Experience with strongly-typed, object-oriented programming such as Java, C#, Go, etc. and scripting languages such as Python, Ruby, etc.
              - listitem [ref=f26e109]: High degree of ownership and autonomy - you proactively advocate for ways to improve systems and constantly leave our codebase in a better state than you found it
              - listitem [ref=f26e110]: Strong analytical skills and communication - able to break down complex problems, describe technical trade-offs, and collaborate with cross-functional partners (e.g. technical program managers, product managers)
              - listitem [ref=f26e111]: "Bonus: Experience using Python and AWS in a production environment"
              - listitem [ref=f26e112]: "Bonus: experience with payments/financial software and/or experience with microservice/serverless architecture"
