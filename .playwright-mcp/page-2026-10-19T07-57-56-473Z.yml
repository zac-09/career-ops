            - paragraph [ref=f26e180]:
              - strong [ref=f26e181]: Commitment to Safeguarding
            - paragraph [ref=f26e182]:
              - text: As a global organization working with communities to eliminate extreme poverty, GiveDirectly takes the safeguarding of its recipients, staff, and partners seriously. To that end, GiveDirectly is a member of the
              - link "Misconduct Disclosure Scheme" [ref=f26e184] [cursor=pointer]:
                - /url: https://misconduct-disclosure-scheme.org/
              - text: ", and will systematically check with previous employers about any abuse or misconduct related matters involving potential new hires. We may also employ other robust pre-hire screens, including in-depth reference checks, criminal background checks, and sanctions screens."
            - paragraph [ref=f26e185]: These efforts help us continue to build and maintain trust with the communities we work with, and prevent abuse to our recipients and staff.
            - paragraph [ref=f26e186]: "**GD is committed to observing all local, national and international laws that protect people and basic human rights of all. GD is committed to a policy of “zero tolerance when it comes to preventing, reporting, or responding to any form of abuse or exploitation.” and expects anyone who works for GD to uphold the protection and safeguarding of our recipients as a priority.**"
            - paragraph [ref=f26e187]:
              - strong [ref=f26e188]: Reasonable Accommodations
            - paragraph [ref=f26e189]: We are committed to fostering an inclusive and accessible work environment. If you require any accommodations during the application or interview process, or to perform the essential functions of the role, please email us at careers@givedirectly.org with the email subject “Accommodation Needed”. We will work with you to ensure reasonable accommodations are made to support your needs.
