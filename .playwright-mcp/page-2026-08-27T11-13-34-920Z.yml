- generic [active] [ref=f97e1]: "<?xml version=\"1.0\" encoding=\"UTF-8\"?> <rss version=\"2.0\" xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:media=\"http://search.yahoo.com/mrss\"> <channel> <title>We Work Remotely: Remote jobs in design, programming, marketing and more</title> <link>https://weworkremotely.com/remote-jobs.rss</link> <description>We Work Remotely: Remote jobs in design, programming, marketing and more</description> <language>en-US</language> <ttl>60</ttl> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0171/6266/logo.gif\" type=\"image/png\"/> <title>ATOM PARTNERS LIMITED: Junior Crypto Trader (Remote)</title> <region>Anywhere in the World</region> <country></country> <state>Hong Kong</state> <skills>Cryptocurrency</skills> <category>All Other Remote</category> <type>Full-Time</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0171/6266/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; ATOM PARTNERS LIMITED &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://atomsmiths.com\"&gt;https://atomsmiths.com&lt;/a&gt; &lt;/p&gt; &lt;div class=\"vacancy-intro reveal reveal-delay-2 is-visible\"&gt; &lt;p&gt;Application link: &lt;a href=\"https://atomsmiths.com/work/weworkremotely\"&gt;https://atomsmiths.com/work/weworkremotely&lt;/a&gt;&lt;br&gt;&lt;br&gt;ATOM Partners is an international company focused on digital asset markets, trading technologies, and data-driven market research. We work with modern analytical tools and help aspiring professionals build practical knowledge of cryptocurrency trading in a structured environment.&lt;/p&gt; &lt;p&gt;We are currently looking for a Junior Crypto Trader to join our growing remote team. This opportunity is designed for motivated individuals who are interested in financial markets, cryptocurrency, and analytical thinking. Previous professional trading experience is not required — we provide comprehensive training and continuous guidance throughout the onboarding process.&lt;/p&gt; &lt;/div&gt; &lt;div class=\"vacancy-blocks-group reveal reveal-delay-3 is-visible\"&gt; &lt;div class=\"vacancy-block vacancy-block--segment\"&gt; &lt;h3&gt;What You'll Do&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Execute trades according to established trading strategies and internal guidelines.&lt;/li&gt; &lt;li&gt;Monitor cryptocurrency markets and identify potential trading opportunities.&lt;/li&gt; &lt;li&gt;Analyze charts, technical indicators, and market trends.&lt;/li&gt; &lt;li&gt;Follow market news and evaluate its potential impact on digital assets.&lt;/li&gt; &lt;li&gt;Maintain trading discipline and apply risk management principles.&lt;/li&gt; &lt;li&gt;Record and review your trading performance.&lt;/li&gt; &lt;li&gt;Use professional trading software and market analysis tools.&lt;/li&gt; &lt;li&gt;Continuously improve your market knowledge and trading skills.&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;div class=\"vacancy-block vacancy-block--segment\"&gt; &lt;h3&gt;What We're Looking For&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Interest in cryptocurrency, trading, or financial markets.&lt;/li&gt; &lt;li&gt;Strong analytical and problem-solving skills.&lt;/li&gt; &lt;li&gt;Ability to stay focused and make decisions in a fast-paced environment.&lt;/li&gt; &lt;li&gt;Willingness to learn and develop professionally.&lt;/li&gt; &lt;li&gt;Good written and spoken English.&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;div class=\"vacancy-block vacancy-block--segment\"&gt; &lt;h3&gt;What We Offer&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Fully remote position with flexible working hours.&lt;/li&gt; &lt;li&gt;Comprehensive onboarding program provided by the company.&lt;/li&gt; &lt;li&gt;Hands-on experience with professional trading platforms.&lt;/li&gt; &lt;li&gt;Access to market analytics, educational resources, and trading tools.&lt;/li&gt; &lt;li&gt;Ongoing mentorship from experienced market professionals.&lt;/li&gt; &lt;li&gt;Clear development path with opportunities for increased responsibility.&lt;/li&gt; &lt;li&gt;Performance-based compensation.&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;div class=\"vacancy-block vacancy-block--segment\"&gt; &lt;h3&gt;Benefits&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Remote work from anywhere.&lt;/li&gt; &lt;li&gt;Flexible schedule.&lt;/li&gt; &lt;li&gt;Structured training program.&lt;/li&gt; &lt;li&gt;Career development opportunities.&lt;/li&gt; &lt;li&gt;Continuous mentorship.&lt;/li&gt; &lt;li&gt;International team.&lt;/li&gt; &lt;li&gt;Modern analytical tools.&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;div class=\"vacancy-block vacancy-block--segment\"&gt; &lt;h3&gt;Recruitment Process&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Step 1: Initial phone conversation with one of our recruiters.&lt;/li&gt; &lt;li&gt;Step 2: Online interview to discuss your background, motivation, and career goals.&lt;/li&gt; &lt;li&gt;Step 3: Introductory training session with a trading mentor before joining the team.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Application link: &lt;a href=\"https://atomsmiths.com/work/weworkremotely\"&gt;https://atomsmiths.com/work/weworkremotely&lt;/a&gt;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/atom-partners-limited-junior-crypto-trader-remote\"&gt;https://weworkremotely.com/remote-jobs/atom-partners-limited-junior-crypto-trader-remote&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Thu, 27 Aug 2026 10:58:06 +0000</pubDate> <expires_at>Sat, 26 Sep 2026 10:58:06 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/atom-partners-limited-junior-crypto-trader-remote</guid> <link>https://weworkremotely.com/remote-jobs/atom-partners-limited-junior-crypto-trader-remote</link> </item> <item> <title>Databricks: AI Engineer - FDE (Forward Deployed Engineer)</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Product</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote - United Kingdom &lt;/p&gt; &lt;p&gt;&lt;strong&gt;AI Engineer - FDE (Forward Deployed Engineer)&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Req ID: CSQ427R191&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Location: United Kingdom - Remote (must be based in the UK for this role)&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Mission&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;The AI Forward Deployed Engineering (AI FDE) team is a highly specialized customer-facing AI team at Databricks. We deliver professional services engagements to help our customers build and productionize first-of-its-kind AI applications. We work cross-functionally to shape long-term strategic priorities and initiatives alongside engineering, product, and developer relations, as well as support internal subject matter expert (SME) teams. We view our team as an ensemble: we look for individuals with strong, unique specializations to improve the overall strength of the team. This team is the right fit for you if you love working with customers, teammates, and fueling your curiosity for the latest trends in GenAI, LLMOps, and ML more broadly.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;We welcome remote applicants located near our offices. Preferred locations: London (UK),&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Reporting to: Senior Manager - AI FDE, EMEA&lt;/p&gt; &lt;p&gt;&lt;strong&gt;The impact you will have:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Develop cutting-edge GenAI solutions, incorporating the latest techniques from &lt;a href=\"https://www.databricks.com/blog/category/databricks-ai?categories=databricks-ai%2Cai-research%2Cai-engineering\"&gt;Databricks AI research&lt;/a&gt; to solve customer problems&lt;/li&gt; &lt;li&gt;Own production rollouts of consumer and internally facing GenAI applications&lt;/li&gt; &lt;li&gt;Serve as a trusted technical advisor to customers across a variety of domains&lt;/li&gt; &lt;li&gt;Present at conferences such as Data + AI Summit, recognized as a thought leader internally and externally&lt;/li&gt; &lt;li&gt;Collaborate cross-functionally with the product and engineering teams to influence priorities and shape the product roadmap&amp;nbsp;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;What we look for:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Experience building GenAI applications, including RAG, multi-agent systems, Text2SQL, fine-tuning, etc., with tools such as HuggingFace, LangChain, and DSPy&lt;/li&gt; &lt;li&gt;Expertise in deploying production-grade GenAI applications, including evaluation and optimizations&amp;nbsp;&lt;/li&gt; &lt;li&gt;Extensive years of hands-on industry data science experience, leveraging common machine learning and data science tools, i.e. pandas, scikit-learn, PyTorch, etc.&lt;/li&gt; &lt;li&gt;Experience building production-grade machine learning deployments on AWS, Azure, or GCP&lt;/li&gt; &lt;li&gt;Graduate degree in a quantitative discipline (Computer Science, Engineering, Statistics, Operations Research, etc.) or equivalent practical experience&lt;/li&gt; &lt;li&gt;Experience communicating and/or teaching technical concepts to non-technical and technical audiences alike&lt;/li&gt; &lt;li&gt;Passion for collaboration, life-long learning, and driving business value through AI&lt;/li&gt; &lt;li&gt;[Preferred] Experience using the Databricks Intelligence Platform and Apache Spark™ to process large-scale distributed datasets&lt;/li&gt; &lt;li&gt;Willing to travel once every 4-8 weeks to see customers (as needed)&lt;/li&gt; &lt;/ul&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&lt;strong&gt;About Databricks&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;Databricks is the Data and AI company. More than 20,000 organizations worldwide — including adidas, AT&amp;amp;T, Bayer, Block, Mastercard, Rivian, Unilever, and 70% of the Fortune 500 — rely on the Databricks Data + AI Platform to build and scale data and AI apps, analytics and agents. Headquartered in San Francisco with 30+ offices around the globe, Databricks offers a unified platform that includes Genie, Lakebase, Agent Bricks, Lakeflow, Lakehouse, and Unity Catalog. To learn more, follow Databricks on &lt;a href=\"https://www.linkedin.com/company/databricks\"&gt;LinkedIn&lt;/a&gt;, &lt;a href=\"https://x.com/databricks\"&gt;X&lt;/a&gt;, &lt;a href=\"https://www.youtube.com/@Databricks\"&gt;YouTube&lt;/a&gt;, and &lt;a href=\"https://www.instagram.com/databricksinc/?hl=en\"&gt;Instagram&lt;/a&gt;.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Benefits&lt;br&gt;&lt;br&gt;&lt;/strong&gt;&lt;/span&gt;At Databricks, we strive to provide comprehensive benefits and perks that meet the needs of all of our employees. For specific details on the benefits offered in your region click &lt;a href=\"https://docs.google.com/document/d/154un3e8Xav4BceOSlcYFZRGEuQI54xMxVydRwQn54eQ/edit?usp=sharing\"&gt;here&lt;/a&gt;.&lt;br&gt;&lt;br&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Our Commitment to Diversity and Inclusion&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;At Databricks, we are committed to fostering a diverse and inclusive culture where everyone can excel. We take great care to ensure that our hiring practices are inclusive and meet equal employment opportunity standards. Individuals looking for employment at Databricks are considered without regard to age, color, disability, ethnicity, family or marital status, gender identity or expression, language, national origin, physical and mental ability, political affiliation, race, religion, sexual orientation, socio-economic status, veteran status, and other protected characteristics.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Compliance&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;&lt;span&gt;If access to export-controlled technology or source code is required for performance of job duties, it is within Employer's discretion whether to apply for a U.S. government license for such positions, and Employer may decline to proceed with an applicant on this basis alone.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/databricks-ai-engineer-fde-forward-deployed-engineer-1\"&gt;https://weworkremotely.com/remote-jobs/databricks-ai-engineer-fde-forward-deployed-engineer-1&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Thu, 27 Aug 2026 07:31:13 +0000</pubDate> <expires_at>Sat, 26 Sep 2026 07:31:13 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/databricks-ai-engineer-fde-forward-deployed-engineer-1</guid> <link>https://weworkremotely.com/remote-jobs/databricks-ai-engineer-fde-forward-deployed-engineer-1</link> </item> <item> <title>Melio: Sales Development Representative</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Sales and Marketing</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote, US &lt;/p&gt; &lt;p&gt;&lt;strong&gt;Sales Development Representative&lt;br&gt;&lt;/strong&gt;&lt;strong&gt;&lt;em&gt;Location:&lt;/em&gt;&lt;em&gt; Remote&amp;nbsp;(required to live in one of the following states: AZ, CO, FL, GA, IL, MI, MN, NY, NC, TX, UT,VT)&lt;/em&gt;&lt;br&gt;&lt;br&gt;Qualifications:&lt;br&gt;&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;1+ year of dedicated experience in an Outbound Sales Development or Business Development Representative role&lt;/strong&gt;, with a proven track record of successful cold outreach (cold calling, email, LinkedIn).&lt;/li&gt; &lt;li&gt;Demonstrated ability to identify target prospects and key decision-makers within a given territory.&lt;/li&gt; &lt;li&gt;Experience conducting high-volume, consistent outbound activities while maintaining quality and personalization.&lt;/li&gt; &lt;li&gt;Strong verbal and written communication skills, with the ability to articulate value propositions clearly and handle objections effectively.&lt;/li&gt; &lt;li&gt;A results-oriented mindset with a strong drive to meet and exceed targets.&lt;/li&gt; &lt;li&gt;Familiarity with CRM software (preferably Salesforce) and sales engagement tools (e.g., Outreach, SalesLoft).&lt;/li&gt; &lt;li&gt;Ability to work collaboratively with Account Executives and adapt to evolving sales strategies.&lt;/li&gt; &lt;li&gt;Resilience and a positive attitude in the face of challenges, with a strong desire to learn and grow in a sales career.&lt;/li&gt; &lt;li&gt;Fintech, SaaS, or startup experience is a plus, demonstrating an ability to thrive in a fast-paced environment.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Bonus Points:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Experience in the payments or SMB market.&lt;/li&gt; &lt;li&gt;Familiarity with sales methodologies.&lt;/li&gt; &lt;li&gt;Proven ability to leverage data to improve prospecting effectiveness.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;A day in the life and how you’ll make an impact:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Execute Strategic Cold Outreach:&lt;/strong&gt; Conduct high-volume, targeted outbound activities including cold calls, personalized emails, and LinkedIn outreach to engage prospects who are not yet familiar with Melio.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Prospect &amp;amp; Identify Ideal Customers:&lt;/strong&gt; Utilize provided lists and conduct independent research to identify SMB businesses that align with our Ideal Customer Profile (ICP) and pinpoint key decision-makers within those organizations.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Qualify &amp;amp; Convert Prospects:&lt;/strong&gt; Engage prospects in discovery conversations, effectively qualify their needs and pain points, and successfully book introductory meetings for our SMB Account Executives.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Collaborate on Outbound Strategy:&lt;/strong&gt; Work closely with your assigned Account Executives and Sales leadership to develop, refine, and execute outbound strategies, adjusting tactics based on performance and market feedback.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Optimize Lead Handoff:&lt;/strong&gt; Ensure a seamless and effective transition of qualified opportunities to Account Executives, providing comprehensive context to maximize conversion rates.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Contribute to Pipeline Growth:&lt;/strong&gt; Consistently meet and exceed daily, weekly, and monthly activity and meeting-set targets, directly contributing to Melio's revenue pipeline.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Support Go-to-Market Initiatives:&lt;/strong&gt; From time to time, assist with various initiatives such as event preparation and follow-up, targeted call blitzes, and other revenue-driving projects.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Document &amp;amp; Analyze Performance:&lt;/strong&gt; Maintain accurate and up-to-date records of all prospecting activities and customer interactions within Salesforce, contributing to a data-driven approach to performance improvement.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;About the team:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;As a Sales&lt;strong&gt; Development Representative (SDR)&lt;/strong&gt; at Melio, you will play a critical role in driving our growth by initiating new business conversations with our small to medium-sized and high value businesses. This is a highly impactful outbound-focused position where your expertise in traditional cold outreach will directly contribute to building pipeline and expanding Melio's market presence.&lt;/p&gt; &lt;p&gt;You will be responsible for identifying, engaging, and qualifying prospective clients who are focused on optimizing their cash flow and workflow. This role requires a proactive, resilient, and data-driven individual with a proven track record in cold prospecting. You will work closely with Account Executives and Sales leadership to strategize, execute, and refine our outbound approach, ensuring a consistent flow of high-quality meetings.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;About Melio USA:&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Competitive compensation packages: We strive to make each and every employee feel valued and appreciated. &lt;ul&gt; &lt;li&gt;The annual base salary for this position is $60,000-$63,000 with an additional bonus component.&lt;/li&gt; &lt;/ul&gt; &lt;/li&gt; &lt;li&gt;Medical, Dental, and Vision: We offer generous and highly competitive plans with up to 100% employer-paid coverage, FSA and HSA.&lt;/li&gt; &lt;li&gt;401K matching: Feel the investment of working at a high-growth company.&lt;/li&gt; &lt;li&gt;Wellness: We take a holistic approach to wellness at Melio with a focus on providing financial, physical, emotional, social, and community support for our employees.&lt;/li&gt; &lt;li&gt;Time Off: Time to rest and recharge is a priority for us. We offer competitive vacation time, sick days, holidays, parental leave and wedding days to allow you to take the time you need, when you need it.&lt;/li&gt; &lt;li&gt;Food perks: Enjoy our fully stocked kitchens, along with a weekly Seamless stipend and plenty of catered meals each week.&lt;/li&gt; &lt;li&gt;Office culture: Thrive in our collaborative offices in New York City or Denver, in a hybrid working environment. We are dog friendly as well!&lt;/li&gt; &lt;li&gt;Growth and development: Lean on the diverse team to foster professional and personal growth through workshops, mentorship programs, and team building activities.&amp;nbsp;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Melio builds business-to-business (B2B) payment tools so small business owners can spend less time in the back office and more time on their craft. As the fastest-growing B2B payment platform in the US, Melio is working hard to find new and better ways to help small businesses succeed in the ways that work best for them.&lt;/p&gt; &lt;p&gt;Melio's diversity, equity and inclusion efforts have always been a top priority within our team. We are an Equal Opportunity Employer, and all of our employees encompass different strengths, experiences and backgrounds. DEI within Melio prioritizes race, gender, age, disability status, veteran status, sexual orientation, religion and many other parts that make up one's identity. Having a diverse team across all offices is key to our success, and inclusion is each #TeaMelio member's responsibility. Melio accepts job applications on an ongoing basis until the position is filled. If you are interested in applying for this job opportunity, please do so directly on our &lt;a href=\"https://www.lifeatmelio.com/\"&gt;careers page&lt;/a&gt; (or if you’re here already, scroll down and apply now!). This employer participates in&lt;a href=\"https://drive.google.com/file/d/1Hav72jolloAjHVMjwrj4mTymQA7Uw1je/view\"&gt; E-Verify&lt;/a&gt; and will provide the federal government with your Form I-9 information to confirm that you are authorized to work in the U.S.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/melio-sales-development-representative\"&gt;https://weworkremotely.com/remote-jobs/melio-sales-development-representative&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Thu, 27 Aug 2026 07:31:02 +0000</pubDate> <expires_at>Sat, 26 Sep 2026 07:31:02 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/melio-sales-development-representative</guid> <link>https://weworkremotely.com/remote-jobs/melio-sales-development-representative</link> </item> <item> <title>Databricks: AI Engineer - FDE (Forward Deployed Engineer)</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Product</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote - India &lt;/p&gt; &lt;p&gt;&lt;strong&gt;CSQ326R35&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;AI Engineer - FDE (Forward Deployed Engineer)&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Mission&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;The AI Forward Deployed Engineering (AI FDE) team is a highly specialized customer-facing AI team at Databricks. We deliver professional services engagements to help our customers build and productionize first-of-its-kind AI applications. We work cross-functionally to shape long-term strategic priorities and initiatives alongside engineering, product, and developer relations, as well as support internal subject matter expert (SME) teams. We view our team as an ensemble: we look for individuals with strong, unique specializations to improve the overall strength of the team. This team is the right fit for you if you love working with customers, teammates, and fueling your curiosity for the latest trends in GenAI, LLMOps, and ML more broadly. Open to remote locations.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;The impact you will have:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Develop cutting-edge GenAI solutions, incorporating the latest techniques from &lt;a href=\"https://www.databricks.com/blog/category/databricks-ai?categories=databricks-ai%2Cai-research%2Cai-engineering\"&gt;Databricks AI research&lt;/a&gt; to solve customer problems&lt;/li&gt; &lt;li&gt;Own production rollouts of consumer and internally facing GenAI applications&lt;/li&gt; &lt;li&gt;Serve as a trusted technical advisor to customers across a variety of domains&lt;/li&gt; &lt;li&gt;Present at conferences such as Data + AI Summit, recognized as a thought leader internally and externally&lt;/li&gt; &lt;li&gt;Collaborate cross-functionally with the product and engineering teams to influence priorities and shape the product roadmap&amp;nbsp;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;What we look for:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Experience building GenAI applications, including RAG, multi-agent systems, Text2SQL, fine-tuning, etc., with tools such as HuggingFace, LangChain, and DSPy&lt;/li&gt; &lt;li&gt;Expertise in deploying production-grade GenAI applications, including evaluation and optimizations&amp;nbsp;&lt;/li&gt; &lt;li&gt;Extensive years of hands-on industry data science experience, leveraging common machine learning and data science tools, i.e. pandas, scikit-learn, PyTorch, etc.&lt;/li&gt; &lt;li&gt;Experience building production-grade machine learning deployments on AWS, Azure, or GCP&lt;/li&gt; &lt;li&gt;Graduate degree in a quantitative discipline (Computer Science, Engineering, Statistics, Operations Research, etc.) or equivalent practical experience&lt;/li&gt; &lt;li&gt;Experience communicating and/or teaching technical concepts to non-technical and technical audiences alike&lt;/li&gt; &lt;li&gt;Passion for collaboration, life-long learning, and driving business value through AI&lt;/li&gt; &lt;li&gt;[Preferred] Experience using the Databricks Intelligence Platform and Apache Spark™ to process large-scale distributed datasets&lt;/li&gt; &lt;li&gt;Willing to travel once every 4-8 weeks to see customers (as needed)&lt;/li&gt; &lt;/ul&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&lt;strong&gt;About Databricks&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;Databricks is the Data and AI company. More than 20,000 organizations worldwide — including adidas, AT&amp;amp;T, Bayer, Block, Mastercard, Rivian, Unilever, and 70% of the Fortune 500 — rely on the Databricks Data + AI Platform to build and scale data and AI apps, analytics and agents. Headquartered in San Francisco with 30+ offices around the globe, Databricks offers a unified platform that includes Genie, Lakebase, Agent Bricks, Lakeflow, Lakehouse, and Unity Catalog. To learn more, follow Databricks on &lt;a href=\"https://www.linkedin.com/company/databricks\"&gt;LinkedIn&lt;/a&gt;, &lt;a href=\"https://x.com/databricks\"&gt;X&lt;/a&gt;, &lt;a href=\"https://www.youtube.com/@Databricks\"&gt;YouTube&lt;/a&gt;, and &lt;a href=\"https://www.instagram.com/databricksinc/?hl=en\"&gt;Instagram&lt;/a&gt;.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Benefits&lt;br&gt;&lt;br&gt;&lt;/strong&gt;&lt;/span&gt;At Databricks, we strive to provide comprehensive benefits and perks that meet the needs of all of our employees. For specific details on the benefits offered in your region click &lt;a href=\"https://docs.google.com/document/d/154un3e8Xav4BceOSlcYFZRGEuQI54xMxVydRwQn54eQ/edit?usp=sharing\"&gt;here&lt;/a&gt;.&lt;br&gt;&lt;br&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Our Commitment to Diversity and Inclusion&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;At Databricks, we are committed to fostering a diverse and inclusive culture where everyone can excel. We take great care to ensure that our hiring practices are inclusive and meet equal employment opportunity standards. Individuals looking for employment at Databricks are considered without regard to age, color, disability, ethnicity, family or marital status, gender identity or expression, language, national origin, physical and mental ability, political affiliation, race, religion, sexual orientation, socio-economic status, veteran status, and other protected characteristics.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Compliance&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;&lt;span&gt;If access to export-controlled technology or source code is required for performance of job duties, it is within Employer's discretion whether to apply for a U.S. government license for such positions, and Employer may decline to proceed with an applicant on this basis alone.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/databricks-ai-engineer-fde-forward-deployed-engineer\"&gt;https://weworkremotely.com/remote-jobs/databricks-ai-engineer-fde-forward-deployed-engineer&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Thu, 27 Aug 2026 07:31:00 +0000</pubDate> <expires_at>Sat, 26 Sep 2026 07:31:00 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/databricks-ai-engineer-fde-forward-deployed-engineer</guid> <link>https://weworkremotely.com/remote-jobs/databricks-ai-engineer-fde-forward-deployed-engineer</link> </item> <item> <title>HighRadius: Sales Transformation (Enterprise Expansion) - Northeast</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Sales and Marketing</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote - US &lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Summary&amp;nbsp;&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;We’re looking for our next &lt;strong&gt;Enterprise Account Manager (aka Digital Transformation Advisor)&lt;/strong&gt; to join the Expansion Sales team and support our &lt;strong&gt;Northeast Enterprise portfolio&lt;/strong&gt;. In this role, you’ll partner with CFOs and finance leaders to transform their finance landscape through cutting-edge technology. Your goal is to not only drive customer success, but also deepen strategic relationships, expand our client portfolio, and generate revenue.&lt;br&gt;&lt;br&gt;We’re looking for people who embody &lt;strong&gt;HighRadian DNA&lt;/strong&gt;: resilient, results-driven, skilled in stakeholder management, and energized by a fast-paced environment.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Location:&lt;/strong&gt; This is a strategic field-based position dedicated to our Northeast Enterprise portfolio. To enable high-touch customer engagement and regular in-person meetings with key stakeholders, candidates must maintain their primary residence within the &lt;strong&gt;Northeast region, including New York, New Jersey, Pennsylvania, Massachusetts, Connecticut, Rhode Island, Vermont, and New Hampshire.&lt;/strong&gt;&amp;nbsp;Regular travel to customer sites is expected.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Your Day-to-Day:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Serve as a consultative, trusted advisor to a portfolio of existing HighRadius customers, with a core focus on developing and closing new business opportunities&lt;/li&gt; &lt;li&gt;Build relationships with executive leaders and key client stakeholders to drive high levels of satisfaction and product adoption&lt;/li&gt; &lt;li&gt;Conduct assessments to understand customer pain points and develop a roadmap and business cases for customers' finance transformation using HighRadius solutions.&amp;nbsp;&lt;/li&gt; &lt;li&gt;Achieve monthly sales targets consistently. Manage and forecast sales activity and opportunities by flawlessly executing the HighRadius sales process and playbook&lt;/li&gt; &lt;li&gt;Partner with internal HighRadius teams in coordinating communication and action plans to drive desired outcomes for customers&lt;/li&gt; &lt;li&gt;Attend in-person meetings on client site, as well as industry events, such as user groups, trade shows, and conferences to build and manage relationships with prospective and existing customer base&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;What You'll Need to be Successful:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Bachelor's degree&lt;/li&gt; &lt;li&gt;8+ years of experience in SaaS/technology Account Management with history of success in managing complex accounts and sales cycles&lt;/li&gt; &lt;li&gt;Ability to sell Value Framework and expand digital footprint in complex customer environments&lt;/li&gt; &lt;li&gt;Ability to communicate value to senior-level executives and proven experience in building and sustaining strong strategic relationships&lt;/li&gt; &lt;li&gt;Excellent written &amp;amp; verbal communication and presentation skills&lt;/li&gt; &lt;li&gt;Track record of leveraging strategic, consultative selling tactics and techniques&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Ability to travel to local and regional client sites &amp;amp; industry events up to 50% of the time&lt;/strong&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Perks &amp;amp; Benefits:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Performance-based bonus or commission (for eligible roles)&lt;/li&gt; &lt;li&gt;Competitive benefits, 401 (k) matching plan, and wellness resources&lt;/li&gt; &lt;li&gt;Opportunity to earn stock options for top-performers&lt;/li&gt; &lt;li&gt;Paid parental leave&lt;/li&gt; &lt;li&gt;Paid company &amp;amp; flex holidays&lt;/li&gt; &lt;li&gt;ZINGy environment: quarterly events, team outings, and MORE!&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/highradius-sales-transformation-enterprise-expansion-northeast\"&gt;https://weworkremotely.com/remote-jobs/highradius-sales-transformation-enterprise-expansion-northeast&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Thu, 27 Aug 2026 07:31:00 +0000</pubDate> <expires_at>Sat, 26 Sep 2026 07:31:00 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/highradius-sales-transformation-enterprise-expansion-northeast</guid> <link>https://weworkremotely.com/remote-jobs/highradius-sales-transformation-enterprise-expansion-northeast</link> </item> <item> <title>Melio: Customer Success Manager</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Customer Support</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote, US &lt;/p&gt; &lt;p&gt;&lt;strong&gt;Customer Success Manager&lt;/strong&gt;&lt;strong&gt;&lt;br&gt;&lt;/strong&gt;&lt;strong&gt;&lt;em&gt;Location:&lt;/em&gt;&lt;/strong&gt;&lt;em&gt; &lt;strong&gt;Remote&lt;/strong&gt;&amp;nbsp;&lt;strong&gt;(required to live in one of the following states: AZ, CO, FL, GA, IL, MI, MN, NY, NC, TX, UT,VT)&lt;/strong&gt;&lt;/em&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Qualifications:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;3+ years of experience in Customer Success, Account Management, Sales, or any client facing role.&lt;/li&gt; &lt;li&gt;1+ years experience utilizing a CRM software system, Salesforce preferred.&lt;/li&gt; &lt;li&gt;Experience in a scaled customer success environment, maximizing impact for a large range of clients through scalable motions executed at key moments in a customer’s journey.&lt;/li&gt; &lt;li&gt;Proven ability to adopt new technologies and teach others effectively.&lt;/li&gt; &lt;li&gt;Strong communication and sales acumen, with the ability to understand the true needs of the customer, helping them tap into the full value of Melio’s platform for their unique business.&lt;/li&gt; &lt;li&gt;Takes an analytical, strategic approach to our customers’ success, constantly iterating to improve the whole customer experience.&lt;/li&gt; &lt;li&gt;Excited to bring new processes and procedures to continue to develop the customer journey at Melio.&lt;/li&gt; &lt;li&gt;Enjoys working cross-functionally with other teams across the organization on a diverse range of internal and customer-facing initiatives.&lt;/li&gt; &lt;li&gt;Excellent time-management skills, as well as the ability to remain flexible as the company and role evolves.&lt;/li&gt; &lt;li&gt;Passionate about speaking with and building relationships with small business owners, helping their businesses succeed with Melio.&lt;/li&gt; &lt;li&gt;Has a track record of taking on additional responsibilities outside of their direct scope, showing a natural curiosity.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Bonus Points:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Experience working with small businesses in an account management or customer success capacity.&lt;/li&gt; &lt;li&gt;Prior experience working in a SaaS environment and/or in the financial technology space&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;A day in the life and how you’ll make an impact:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Own all strategic actions associated with customer engagement and retention efforts.&lt;/li&gt; &lt;li&gt;Build dynamic relationships with your customers through meaningful interactions and comprehensive engagements, developing a deep understanding of their business needs to drive retention.&lt;/li&gt; &lt;li&gt;Lead customers through early adoption and proactively shepherded them through lifecycle stages, educating on best practices, removing friction, and accelerating time-to-value.&lt;/li&gt; &lt;li&gt;Continuously evaluate customer health signals and feedback to surface churn risks and growth pathways across the customer lifecycle.&lt;/li&gt; &lt;li&gt;Execute proven sales methodologies to guide strategic customer conversations, deepen discovery, and influence outcomes for the customer and the business.&lt;/li&gt; &lt;li&gt;Share ownership of “one-to-many” motions (e.g. webinars), when required, to support customer education at scale&lt;/li&gt; &lt;li&gt;Work collaboratively alongside relevant Melio departments to ensure the voice of the customer is constantly elevated in a digestible, actionable format, and that the customer is receiving the utmost support and satisfaction.&lt;/li&gt; &lt;li&gt;Proactively evaluate best practices when it comes to processes and procedures within the Customer Success role; suggest changes or enhancements to existing procedures to ensure the team’s motions are aligned with the goals of customers and the business.&lt;/li&gt; &lt;li&gt;Leverage internal tools, such as Salesforce,Tableau, Outreach, and Gong to ensure effective communication and impact assessment.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;About the team:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;As a&amp;nbsp;&lt;strong&gt;&lt;em&gt;Customer Success Manager&lt;/em&gt;&lt;/strong&gt;, you will manage Melio’s most valuable customers, overseeing the strategic growth and retention of top-tier accounts. You will act as a consultant at key milestones to ensure long-term success, drive deeper platform usage, and identify new avenues for&amp;nbsp; expansion. Additionally, you will regularly surface customer feedback to internal stakeholders, including leadership, Product, Voice of the Customer, and Strategy teams to continue to enhance the platform. You will own the consolidation of this feedback as well as the packaging and presentation of the insights.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;About Melio USA:&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Competitive compensation packages: We strive to make each and every employee feel valued and appreciated.&lt;/li&gt; &lt;ul&gt; &lt;li&gt;The annual base salary range for this position is $70,000 - $85,000 with an with an additional bonus component&amp;nbsp;&amp;nbsp;&lt;/li&gt; &lt;/ul&gt; &lt;li&gt;Medical, Dental, and Vision: We offer generous and highly competitive plans with up to 100% employer-paid coverage, FSA and HSA.&lt;/li&gt; &lt;li&gt;401K matching and stock options: Feel the investment of working at a hyper-growth startup.&lt;/li&gt; &lt;li&gt;Wellness: We take a holistic approach to wellness at Melio with a focus on providing financial, physical, emotional, social, and community support for our employees.&amp;nbsp;&lt;/li&gt; &lt;li&gt;Time Off: Time to rest and recharge is a priority for us. We offer competitive vacation time, sick days, holidays, parental leave and wedding days to allow you to take the time you need, when you need it.&amp;nbsp;&lt;/li&gt; &lt;li&gt;Food perks: Enjoy a weekly Seamless stipend&amp;nbsp;&lt;/li&gt; &lt;li&gt;Growth and development: Lean on the diverse team to foster professional and personal growth through workshops, mentorship programs, and team building activities.&amp;nbsp;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Melio builds business-to-business (B2B) payment tools so small business owners can spend less time in the back office and more time on their craft. As the fastest-growing B2B payment platform in the US, Melio is working hard to find new and better ways to help small businesses succeed in the ways that work best for them.&lt;/p&gt; &lt;p&gt;Melio's diversity, equity and inclusion efforts have always been a top priority within our team. We are an Equal Opportunity Employer, and all of our employees encompass different strengths, experiences and backgrounds. DEI within Melio prioritizes race, gender, age, disability status, veteran status, sexual orientation, religion and many other parts that make up one's identity. Having a diverse team across all offices is key to our success, and inclusion is each #TeaMelio member's responsibility. Melio accepts job applications on an ongoing basis until the position is filled. If you are interested in applying for this job opportunity, please do so directly on our&amp;nbsp;&lt;a href=\"https://www.lifeatmelio.com/\"&gt;careers page&lt;/a&gt;&amp;nbsp;(or if you’re here already, scroll down and apply now!). This employer participates in&lt;a href=\"https://drive.google.com/file/d/1Hav72jolloAjHVMjwrj4mTymQA7Uw1je/view\"&gt;&amp;nbsp;E-Verify&lt;/a&gt;&amp;nbsp;and will provide the federal government with your Form I-9 information to confirm that you are authorized to work in the U.S.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/melio-customer-success-manager\"&gt;https://weworkremotely.com/remote-jobs/melio-customer-success-manager&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Thu, 27 Aug 2026 07:31:00 +0000</pubDate> <expires_at>Sat, 26 Sep 2026 07:31:00 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/melio-customer-success-manager</guid> <link>https://weworkremotely.com/remote-jobs/melio-customer-success-manager</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0077/5678/logo.gif\" type=\"image/png\"/> <title>Coaching.com: Customer Success Manager (UK)</title> <region>Anywhere in the World</region> <country>🇬🇧 United Kingdom of Great Britain and Northern Ireland</country> <state>California</state> <skills>HubSpot and Intercom</skills> <category>Customer Support</category> <type>Full-Time</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0077/5678/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; United States &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://coaching.com\"&gt;https://coaching.com&lt;/a&gt; &lt;/p&gt; &lt;h1&gt;Customer Success Manager (UK)&lt;/h1&gt; &lt;h2&gt;General Information&lt;/h2&gt; &lt;div&gt; &amp;nbsp; &amp;nbsp; &lt;p&gt;Department&lt;/p&gt; &lt;p&gt;Customer Success&lt;/p&gt; &lt;p&gt;Reports to&lt;/p&gt; &lt;p&gt;Director of Customer Success&lt;/p&gt; &lt;p&gt;Location&lt;/p&gt; &lt;p&gt;Remote, UK&lt;/p&gt; &lt;p&gt;Start Date&lt;/p&gt; &lt;p&gt;Immediate&lt;/p&gt; &lt;p&gt;Compensation&lt;/p&gt; &lt;p&gt;£55,000 - £60,000 + quarterly performance bonus*&lt;/p&gt; &lt;/div&gt; &lt;h2&gt;&amp;nbsp;&lt;/h2&gt; &lt;h2&gt;About Coaching.com&lt;/h2&gt; &lt;p&gt;Coaching.com is the platform powering the global coaching industry.&lt;/p&gt; &lt;p&gt;Our technology helps organizations, coaching companies, and professional coaches manage and scale coaching, from program administration and coach management to participant engagement, reporting, and more.&lt;/p&gt; &lt;p&gt;We work with leading organizations and coaching providers around the world to make high-quality coaching easier to deliver, manage, and scale.&lt;/p&gt; &lt;h2&gt;The Role&lt;/h2&gt; &lt;p&gt;We are looking for a proactive, commercially minded Customer Success Manager to own and strengthen relationships with our Enterprise customers and strategic partners.&lt;/p&gt; &lt;p&gt;You will guide customers from onboarding and implementation through adoption, ongoing success, renewal, and expansion. Your goal is not simply to help customers use the Coaching.com platform. It is to understand what they are trying to accomplish and help them use our technology successfully to achieve it.&lt;/p&gt; &lt;p&gt;You will work closely with senior stakeholders at leading organizations and coaching companies, becoming a trusted partner who understands their goals, anticipates challenges, identifies opportunities, and ensures they receive meaningful value from Coaching.com.&lt;/p&gt; &lt;p&gt;This is an opportunity for someone who loves the intersection of technology, relationships, problem-solving, and business growth and wants to help shape an evolving Customer Success function within a growing SaaS organization.&lt;/p&gt; &lt;h2&gt;What You'll Own&lt;/h2&gt; &lt;h3&gt;Customer Relationships &amp;amp; Success&lt;/h3&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Serve as the primary strategic point of contact for a portfolio of Enterprise customers and partners.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Develop a strong understanding of each customer's goals, use cases, stakeholders, and measures of success.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Build trusted relationships with customer stakeholders, including senior and executive-level leaders.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Proactively guide customers toward stronger adoption, engagement, and outcomes throughout their lifecycle.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Onboarding, Training &amp;amp; Adoption&lt;/h3&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Lead customer onboarding and platform implementation to create a strong first experience with Coaching.com.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Deliver engaging virtual training, demonstrations, and enablement sessions for administrators and stakeholders.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Help customers translate their business needs into effective platform workflows and practices.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Monitor adoption and proactively identify opportunities to help customers gain greater value from the platform.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Retention &amp;amp; Account Growth&lt;/h3&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Own customer health and proactively identify risks before they become renewal concerns.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Partner with customers throughout the lifecycle to support strong retention and successful renewals.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Identify opportunities for account expansion, additional platform usage, and relevant Coaching.com solutions.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Work collaboratively with Sales and internal teams to support expansion and cross-sell opportunities.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;&lt;br&gt;&lt;br&gt;&lt;/strong&gt;&lt;/p&gt; &lt;h3&gt;Customer Advocacy &amp;amp; Product Partnership&lt;/h3&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Represent the voice of the customer internally.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Gather and synthesize customer feedback, needs, and recurring challenges.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Partner closely with Product, Support, Sales, and other teams to improve both the platform and overall customer experience.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Help identify patterns and opportunities that can improve the experience across the broader customer base.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Customer Success Excellence&lt;/h3&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Maintain accurate account information, activity, opportunities, risks, and next steps within our CRM and Customer Success systems.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Use customer data, engagement signals, and business context to prioritize proactive outreach.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Contribute to scalable Customer Success processes, resources, webinars, and customer education.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Help us continually improve how Coaching.com delivers an exceptional customer experience.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;What We're Looking For&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;2+ years of experience in Customer Success, Account Management, or a similar client-facing role within a technology or SaaS organization.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience managing ongoing B2B customer relationships, ideally including Enterprise accounts.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Strong relationship-building skills and confidence communicating with senior and executive-level stakeholders.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Excellent presentation, facilitation, and virtual communication skills.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Ability to learn technology quickly and confidently guide customers through software workflows and solutions.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Strong commercial awareness with an understanding of retention, expansion, churn, adoption, and account health.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Proactive and highly organized, with the ability to manage multiple customers, priorities, and projects simultaneously.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Comfortable using data and customer insights to identify risks and opportunities.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience with CRM and customer communication platforms such as HubSpot and Intercom.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Comfortable operating in a fast-moving environment where priorities evolve and team members take ownership beyond narrowly defined responsibilities.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A genuine desire to become an expert in the Coaching.com platform and a trusted resource for customers.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Self-directed and resourceful. You do not wait for a customer problem to become urgent before taking action.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Bonus Points&lt;/h3&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Experience working with Enterprise SaaS customers.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience in HRTech, Learning &amp;amp; Development, coaching, talent development, or professional services.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience working successfully within a distributed or remote team.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience supporting software implementations, onboarding, or change management.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;How We Define Success&lt;/h2&gt; &lt;p&gt;Success in this role means your customers are not simply using Coaching.com. They are getting measurable value from it.&lt;/p&gt; &lt;p&gt;You will help drive:&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Strong customer adoption and engagement&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Successful onboarding and implementation&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Healthy Enterprise relationships&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;High retention and renewal rates&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Identification of expansion opportunities&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Strong customer advocacy and satisfaction&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Clear, actionable customer insights that improve our product and experience&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;How to Apply&lt;/h2&gt; &lt;p&gt;Please send the following to careers@coaching.com with the subject line Customer Success Manager - UK:&lt;/p&gt; &lt;ol&gt; &lt;li&gt; &lt;p&gt;Your resume&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A short cover letter&lt;br&gt;In 2 to 3 paragraphs, tell us why you are interested in Coaching.com and what makes you a strong fit for this position.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A short video introduction&lt;/p&gt; &lt;/li&gt; &lt;/ol&gt; &lt;p&gt;Part of this role involves interacting with senior executives, Enterprise partners, and prospective clients, primarily through virtual meetings. You should be confident, professional, and comfortable communicating on camera.&lt;/p&gt; &lt;p&gt;Please record a short video of approximately 2 minutes answering the following questions:&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;What is one thing you've learned about Coaching.com that stood out to you?&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Why are you excited about this opportunity?&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;What strengths or experience would you bring that would help you succeed in this role?&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Upload your video to Google Drive and include a shareable link with your application. Please confirm that the sharing permissions allow our team to view it.&lt;/p&gt; &lt;h2&gt;Equal Opportunity&lt;/h2&gt; &lt;p&gt;Coaching.com is an Equal Opportunity Employer. Employment decisions are based on merit, competence, and qualifications without regard to race, color, religion, gender, pregnancy, national origin or ethnicity, veteran status, disability, age, sexual orientation, gender identity, marital status, or any other status protected by applicable law.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/coaching-com-customer-success-manager-uk\"&gt;https://weworkremotely.com/remote-jobs/coaching-com-customer-success-manager-uk&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 26 Aug 2026 21:35:54 +0000</pubDate> <expires_at>Fri, 25 Sep 2026 21:35:54 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/coaching-com-customer-success-manager-uk</guid> <link>https://weworkremotely.com/remote-jobs/coaching-com-customer-success-manager-uk</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0171/6262/logo.gif\" type=\"image/png\"/> <title>Carelock.com: Behavioral Health Integration Specialist</title> <region>Anywhere in the World</region> <country></country> <state>Arizona</state> <skills>Medical Documentation</skills> <category>All Other Remote</category> <type>Full-Time</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0171/6262/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Arizona, United States &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://allmyclinics.com/\"&gt;https://allmyclinics.com/&lt;/a&gt; &lt;/p&gt; &lt;p class=\"MsoNormal\"&gt;&lt;strong&gt;&lt;span&gt;Position Summary:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"MsoNormal\"&gt;&lt;span&gt;The Behavioral Health Integration Specialist &lt;/span&gt;&lt;span&gt;provides non-clinical administrative and documentation support for CareLock LLC’s Behavioral Health Integration (BHI) program. This is a non-clinical, administrative position with no direct patient contact. The primary focus of this role is reviewing patient charts, completing and maintaining BHI documentation, tracking required information, supporting care-plan documentation, and ensuring all records are complete, accurate, and compliant with established CareLock workflows, AZDHS regulations, and HIPAA standards.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoNormal\"&gt;&lt;strong&gt;&lt;span&gt;Key Responsibilities:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"MsoNormal\"&gt;&lt;span&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpFirst\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Review patient charts for BHI documentation requirements.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Complete and maintain accurate BHI documentation within the EHR.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Review existing clinical documentation and ensure applicable information is accurately reflected in BHI records.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Maintain and update BHI care-management documentation and care plans based on information contained within the medical record.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Review documentation related to behavioral health screenings, including PHQ-9 and GAD-7, when applicable.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Track required BHI documentation and identify incomplete or outstanding charting.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Review charts for missing information and route documentation needs to the appropriate clinical team member.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Document applicable administrative and care-coordination activities.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Maintain accurate documentation of applicable BHI time and activities when required.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Ensure charts and documentation are completed within established CareLock timeframes.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Support providers and clinical staff by maintaining organized and accurate BHI records.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Follow established BHI workflows and documentation standards.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Maintain productivity and accuracy expectations while managing a high volume of patient charts.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Maintain strict compliance with HIPAA, patient confidentiality requirements, and CareLock policies and procedures.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Other duties and responsibilities as assigned.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpLast\"&gt;&lt;span&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoNormal\"&gt;&lt;strong&gt;&lt;span&gt;Required Qualifications:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"MsoNormal\"&gt;&lt;span&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpFirst\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=\"normaltextrun\"&gt;&lt;span&gt;Must be at least twenty-one (21) years of age&lt;/span&gt;&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;High school diploma or equivalent&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Previous experience in medical documentation, behavioral health administration, care management, medical records, medical assisting, healthcare administration, or related healthcare role.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Experience working within an EHR/EMR specifically EClinical Works.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Strong written communication, grammar, spelling, and documentation skills.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Excellent attention to detail and organizational skills.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Ability to accurately review and interpret information contained within medical records.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Strong computer and data-entry skills.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Ability to work independently and manage a high volume of documentation.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Understanding of HIPAA and patient confidentiality requirements.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Core understanding of basic medical terminology and clinic-based office procedures.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Proficiency utilizing basic computer systems and applications, including Microsoft Office Suite.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Excellent customer service skills with the ability to communicate clearly and effectively.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Proven ability to multi-task, prioritize a shifting workload, and strictly interpret and uphold clinic policies and procedures.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpLast\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Level 1 Arizona Fingerprint Clearance Card (or willingness to obtain).&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoNormal\"&gt;&lt;strong&gt;&lt;span&gt;Preferred Qualifications:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"MsoNormal\"&gt;&lt;span&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpFirst\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Previous experience with Behavioral Health Integration (BHI) documentation.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Experience with eClinicalWorks (eCW).&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Experience with PHQ-9, GAD-7, behavioral health documentation, and care plans.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpMiddle\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Experience with Medicare and/or Medicaid documentation requirements.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"MsoListParagraphCxSpLast\"&gt;&lt;span&gt;&lt;span&gt;·&lt;span&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;Experience in a primary care or behavioral health setting.&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/carelock-com-behavioral-health-integration-specialist\"&gt;https://weworkremotely.com/remote-jobs/carelock-com-behavioral-health-integration-specialist&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 26 Aug 2026 17:26:29 +0000</pubDate> <expires_at>Fri, 25 Sep 2026 17:26:29 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/carelock-com-behavioral-health-integration-specialist</guid> <link>https://weworkremotely.com/remote-jobs/carelock-com-behavioral-health-integration-specialist</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0015/7118/logo.gif\" type=\"image/png\"/> <title>Spiralyze: Video Editor (LinkedIn Content)</title> <region>Anywhere in the World</region> <country></country> <state>Georgia</state> <skills>Video Editing and Video Editing (Final Cut Pro, Adobe Premiere)</skills> <category>Sales and Marketing</category> <type>Full-Time</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0015/7118/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Atlanta, Georgia &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://www.spiralyze.com/\"&gt;https://www.spiralyze.com/&lt;/a&gt; &lt;/p&gt; &lt;div class=\"external-panel__trix-content external-panel__trix-content--colored external-panel__trix-content--lead-in\"&gt; &lt;div&gt; &lt;div&gt; &lt;div&gt;We’re looking for a video editor to help create sharp, premium LinkedIn videos about A/B testing, CRO, landing pages, and design.&lt;br&gt;&lt;br&gt;&lt;/div&gt; &lt;div&gt;This is founder-led content. Most videos will include talking-head footage, screen recordings, website examples, captions, charts, and simple motion graphics.&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;h2 class=\"external-panel__heading\"&gt;Key Responsibilities&lt;/h2&gt; &lt;div class=\"external-panel__trix-content external-panel__trix-content--colored\"&gt; &lt;div&gt; &lt;div&gt; &lt;ul&gt; &lt;li&gt;Edit short LinkedIn videos, usually 30 seconds to 3 minutes&lt;/li&gt; &lt;li&gt;Turn raw footage into polished, engaging social content&lt;/li&gt; &lt;li&gt;Add captions, callouts, zooms, screenshots, charts, and simple motion graphics&lt;/li&gt; &lt;li&gt;Apply clean, consistent color grading to maintain a polished look&lt;/li&gt; &lt;li&gt;Enhance audio with basic sound design and leveling&lt;/li&gt; &lt;li&gt;Make business and data-heavy topics feel clear and visually interesting&lt;/li&gt; &lt;li&gt;Create strong openings that hook viewers in the first few seconds&lt;/li&gt; &lt;li&gt;Repurpose longer recordings into short clips&lt;/li&gt; &lt;li&gt;Maintain a clean, premium, data-driven brand style&lt;/li&gt; &lt;li&gt;Communicate clearly with a U.S.-based team and respond well to feedback&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;h2 class=\"external-panel__heading\"&gt;Skills, Knowledge and Expertise&lt;/h2&gt; &lt;div class=\"external-panel__trix-content external-panel__trix-content--colored\"&gt; &lt;div&gt; &lt;div&gt; &lt;ul&gt; &lt;li&gt;2+ years of professional video editing experience&lt;/li&gt; &lt;li&gt;Strong portfolio of social media videos&lt;/li&gt; &lt;li&gt;Excellent sense of pacing, storytelling, captions, and visual hierarchy&lt;/li&gt; &lt;li&gt;Experience editing talking-head, educational, or business content&lt;/li&gt; &lt;li&gt;Strong skills in Premiere Pro, DaVinci Resolve, Final Cut, or similar&lt;/li&gt; &lt;li&gt;Good written English&lt;/li&gt; &lt;li&gt;Reliable, organized, and able to work independently&lt;/li&gt; &lt;/ul&gt; &lt;div&gt;&lt;strong&gt;Nice to Have&lt;/strong&gt;&lt;/div&gt; &lt;ul&gt; &lt;li&gt;Experience with B2B, SaaS, marketing, design, or tech content&lt;/li&gt; &lt;li&gt;Motion graphics or After Effects skills&lt;/li&gt; &lt;li&gt;Familiarity with LinkedIn and YouTube editing styles&lt;/li&gt; &lt;li&gt;Interest in A/B testing, CRO, UX, or digital marketing&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;h2 class=\"external-panel__heading\"&gt;Benefits&lt;/h2&gt; &lt;div class=\"external-panel__trix-content external-panel__trix-content--colored\"&gt; &lt;div&gt; &lt;div&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Growth path.&amp;nbsp;&lt;/strong&gt;We invest heavily in developing our people and promote almost exclusively from within. Success in this role leads to building and leading an entire content and brand team.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;In-demand skills.&amp;nbsp;&lt;/strong&gt;You’ll work alongside one of the most experienced experimentation teams in the world and learn how data, psychology, and creative intersect.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Tech reimbursement.&amp;nbsp;&lt;/strong&gt;Need a better computer, monitor, or setup?&amp;nbsp; We’ll help.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Time to recharge.&amp;nbsp;&lt;/strong&gt;20 days of paid vacation plus holidays.&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/spiralyze-video-editor-linkedin-content\"&gt;https://weworkremotely.com/remote-jobs/spiralyze-video-editor-linkedin-content&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 26 Aug 2026 14:56:22 +0000</pubDate> <expires_at>Fri, 25 Sep 2026 14:56:22 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/spiralyze-video-editor-linkedin-content</guid> <link>https://weworkremotely.com/remote-jobs/spiralyze-video-editor-linkedin-content</link> </item> <item> <title>Toptal: Automation Engineer (UIPath) for innovative AI Project</title> <region>USA Only</region> <country></country> <state></state> <skills></skills> <category>Full-Stack Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; &lt;/p&gt; &lt;p&gt;📌 Summary&lt;/p&gt;&lt;p&gt;We are seeking a hands-on, execution-focused Senior Automation &amp;amp; AI Systems Developer (UiPath &amp;amp; Power Platform) to build, scale, and maintain enterprise automations across our client's regional operations. In this role, you will own the end-to-end development lifecycle for production-grade bots on a mature estate, while actively expanding into cutting-edge AI-assisted and agentic automation patterns.&lt;/p&gt;&lt;p&gt;This position balances rigorous build and production support work on a high-volume platform with a genuine, applied pathway into modern AI engineering. Working across UiPath, Microsoft Power Platform, Anthropic Claude, and REST APIs, you will build complex bot architectures, integrate language models, and construct resilient, multi-system workflows.&lt;/p&gt;&lt;p&gt;🏢 General Information (About the Client)&lt;/p&gt;&lt;p&gt;Our client operates a mature, enterprise-scale Center of Excellence (CoE) running a robust production estate—executing over 19,000 monthly jobs across 125+ unattended production robots and 200+ active automations.&lt;/p&gt;&lt;p&gt;Operating within a modern tech environment utilizing UiPath, Power Platform, Anthropic Claude, ServiceNow, Bitbucket, and Azure DevOps, they are actively advancing from traditional UI-level RPA into agentic automation patterns. They foster a disciplined, engineering-first culture that prioritizes reusable code libraries, structured exception handling, robust CI/CD practices, and strict compliance-ready documentation.&lt;/p&gt;&lt;p&gt;Tasks and Deliverables&lt;/p&gt;&lt;p&gt;Production Automation Development: Design, develop, test, and deploy resilient, production-grade automations primarily on UiPath across core business lines.&lt;/p&gt;&lt;p&gt;Complex Architecture Engineering: Build and maintain advanced bot architectures incorporating multi-system integrations, structured exception handling, retry logic, and automated recovery patterns.&lt;/p&gt;&lt;p&gt;AI &amp;amp; Agentic Service Composition: Integrate AI capabilities directly into automation workflows, utilizing Anthropic Claude, Document Understanding, classification models, and structured LLM prompts.&lt;/p&gt;&lt;p&gt;Power Platform Back-End Integration: Construct and support modern user interfaces using Power Apps / Power Automate backed by robust UiPath and API execution engines.&lt;/p&gt;&lt;p&gt;API &amp;amp; Scripting Extensions: Extend automation capabilities beyond basic UI automation by writing custom Python, PowerShell, REST API, and webhook integrations.&lt;/p&gt;&lt;p&gt;Production Support &amp;amp; Incident Triage: Troubleshoot and resolve production bot failures with minimal downtime, managing queues, analyzing logs, and working closely with architects.&lt;/p&gt;&lt;p&gt;Code Quality &amp;amp; Governance: Contribute to reusable component libraries, conduct peer code reviews against team standards, and maintain audit-ready technical documentation.&lt;/p&gt;&lt;p&gt;Required Experience&lt;/p&gt;&lt;p&gt;UiPath Engineering Seniority: 3+ years of dedicated, hands-on RPA development experience with UiPath as your primary platform.&lt;/p&gt;&lt;p&gt;Production-Grade Bot Experience: Proven track record building and supporting automations running live in production—demonstrating deep mastery of exception handling, logging, error recovery, and multi-system integration (training exercises/POCs do not qualify).&lt;/p&gt;&lt;p&gt;Database &amp;amp; SQL Proficiency: Practical experience writing SQL queries for data manipulation, extraction, and validation within automated pipelines.&lt;/p&gt;&lt;p&gt;Active UiPath Certification: Hold a current, active UiPath developer credential (e.g., Automation Developer Professional, Automation Developer Associate, Specialized AI Professional, or valid Advanced RPA Developer / UiARD).&lt;/p&gt;&lt;p&gt;Agile Delivery Practice: Demonstrated experience delivering software within an Agile framework (daily standups, sprint planning, retrospectives, backlog grooming).&lt;/p&gt;&lt;p&gt;Preferred Qualifications (Plus):&lt;/p&gt;&lt;p&gt;Practical Python or PowerShell scripting for advanced orchestration, data manipulation, and custom API connections.&lt;/p&gt;&lt;p&gt;Experience with Microsoft Power Platform (Power Apps, Power Automate), REST APIs, webhooks, or AI-assisted development tools (UiPath Autopilot, GitHub Copilot, Anthropic Claude).&lt;/p&gt;&lt;p&gt;Exposure to agentic automation patterns, Intelligent Document Processing (IDP), process/task mining, or secondary RPA platforms (Automation Anywhere).&lt;/p&gt;&lt;p&gt;Familiarity with Git, CI/CD pipelines, Azure DevOps/Jira, and enterprise systems (Microsoft Dynamics 365, Workday, Salesforce, Vertafore, or Oracle Fusion).&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/toptal-automation-engineer-uipath-for-innovative-ai-project\"&gt;https://weworkremotely.com/remote-jobs/toptal-automation-engineer-uipath-for-innovative-ai-project&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 26 Aug 2026 13:48:50 +0000</pubDate> <expires_at>Fri, 25 Sep 2026 13:48:50 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/toptal-automation-engineer-uipath-for-innovative-ai-project</guid> <link>https://weworkremotely.com/remote-jobs/toptal-automation-engineer-uipath-for-innovative-ai-project</link> </item> <item> <title>Toptal: Mechanical Engineer</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Full-Stack Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; &lt;/p&gt; &lt;p&gt;We're looking for a highly experienced Mechanical Engineer who can hit the ground running on a fast-paced, short-term remote engagement. This is a hands-on design role for someone who thrives under tight timelines and can move from onboarding to meaningful output within days, not weeks. You'll be working deep in Siemens NX on plastics-focused design challenges, contributing directly to parts that are headed toward injection molding production.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;What You'll Do&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Deliver mechanical design work in Siemens NX with a focus on plastic components for injection molding&lt;/li&gt;&lt;li&gt;Design and refine TPU overmolded parts&lt;/li&gt;&lt;li&gt;Manage heat insert placement and integration into plastic housings&lt;/li&gt;&lt;li&gt;Apply functional dimensioning and geometric tolerancing to ensure manufacturability&lt;/li&gt;&lt;li&gt;Perform tolerance stack-up analysis to validate fit and function across assemblies&lt;/li&gt;&lt;li&gt;Support IP-rated enclosure design and button/user interface component design&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;What You Bring&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Strong, hands-on experience with Siemens NX&lt;/li&gt;&lt;li&gt;Proven track record designing injection-molded plastic parts&lt;/li&gt;&lt;li&gt;Experience with TPU overmolding&lt;/li&gt;&lt;li&gt;Practical knowledge of heat insert management and integration&lt;/li&gt;&lt;li&gt;Solid grasp of functional dimensioning and tolerance stack-up analysis&lt;/li&gt;&lt;li&gt;Experience with IP-rated design&lt;/li&gt;&lt;li&gt;Experience with button/user interface design&lt;/li&gt;&lt;li&gt;Ability to start immediately and ramp up quickly with minimal onboarding time&lt;/li&gt;&lt;/ul&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/toptal-mechanical-engineer\"&gt;https://weworkremotely.com/remote-jobs/toptal-mechanical-engineer&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 26 Aug 2026 13:37:23 +0000</pubDate> <expires_at>Fri, 25 Sep 2026 13:37:23 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/toptal-mechanical-engineer</guid> <link>https://weworkremotely.com/remote-jobs/toptal-mechanical-engineer</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0168/2732/logo.gif\" type=\"image/png\"/> <title>IxDF - Interaction Design Foundation: Course Director: UX, UI, and AI </title> <region>Anywhere in the World</region> <country></country> <state>Texas</state> <skills>UI/UX Design, Writing, Design, and Interaction Design</skills> <category>Design</category> <type>Full-Time</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0168/2732/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Denmark &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://ixdf.org/about/careers\"&gt;https://ixdf.org/about/careers&lt;/a&gt; &lt;/p&gt; &lt;p&gt;You've been designing long enough to have watched tools become essential and then disappear. You know which design skills are timeless and which ones expire.&amp;nbsp;&lt;strong&gt;The human-centered design skills are where your heart is&lt;/strong&gt;, and you know that AI will take over much of the tool-based design work soon.&lt;/p&gt; &lt;p&gt;You see the fear around AI, and you understand where it comes from. But you also see the opportunities, and you want to show people how to work with AI in a way that benefits their lives, their users, and the world.&lt;/p&gt; &lt;p&gt;You can name the&amp;nbsp;&lt;strong&gt;ten leading designers&lt;/strong&gt;&amp;nbsp;who should be teaching the world’s best courses and Master Classes right now. You know what each of them does better than anyone else, and where their gaps are.&lt;/p&gt; &lt;p&gt;Now you get the opportunity to decide what hundreds of thousands of designers learn next.&lt;/p&gt; &lt;p&gt;The industry leaders whose expertise you'll be turning into courses and Master Classes include&amp;nbsp;&lt;strong&gt;Don Norman and Vitaly Friedman&lt;/strong&gt;, as well as Design Leads at&amp;nbsp;&lt;strong&gt;Netflix, LinkedIn, Meta, and Adobe&lt;/strong&gt;. Don Norman also chairs our executive board.&lt;/p&gt; &lt;p&gt;You'll be involved in the entire process of creating our courses and Master Classes, and you'll lead many of the decisions, so there are incredible opportunities for you to&amp;nbsp;&lt;strong&gt;take initiative, make meaningful contributions, and grow&lt;/strong&gt;. Forget political struggles or long, pointless debates. You’ll be in a team with minimal distance between idea and action, where decisions are made ultra-fast.&lt;/p&gt; &lt;h2&gt;Join the Global Leader in Online Design and AI Education&lt;/h2&gt; &lt;p&gt;IxDF is the world's largest online design and AI education platform, with over 1,150,000 enrollments since 2002. We hold the trust of industry giants like Adobe, NASA, and IBM, who rely on our courses to train their teams. Prestigious universities, including MIT and the University of Cambridge, integrate our material into their curricula. Help us &lt;strong&gt;take online education to new heights&lt;/strong&gt;&amp;nbsp;and&amp;nbsp;&lt;strong&gt;make a meaningful impact on humankind&lt;/strong&gt;.&lt;/p&gt; &lt;p&gt;At IxDF, we’re not just a company but a movement dedicated to making high-quality design and AI education accessible to everyone, everywhere.&lt;/p&gt; &lt;p&gt;We've pioneered online design education since 2002. We have over 1,150,000 enrollments and 1,583 company members, with more than 40 courses, 160 Master Classes, and thousands of open-source design resources, created by our team in collaboration with 240 industry leaders.&lt;/p&gt; &lt;p&gt;With learners from over 100 countries, your work will empower people worldwide.&lt;/p&gt; &lt;h2&gt;We're Hiring Three People for Our Editorial Team&lt;/h2&gt; &lt;p&gt;We're growing, and three roles are open at the same time to build the next generation of our core educational product. Here's what each role leads on:&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Our Course Directors, UX, UI, and AI&lt;/strong&gt;: lead what we teach and who teaches our courses and Master Classes. You reach out to industry leaders and create the invitation they say yes to. You bring your judgment to a planned course outline: what's missing, what doesn't belong, and whether the structure is solid. You plan and shoot courses with our Education Designers.&amp;nbsp;&lt;strong&gt;This is the role described here.&lt;/strong&gt;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;&lt;a href=\"https://ixdf.org/about/careers/education-designer-ux-ui-and-ai\"&gt;Our Education Designers, UX, UI, and AI&lt;/a&gt;&lt;/strong&gt;: lead how design and AI are taught. You plan, structure, and create the core content, and you decide what a course participant should be able to do by the end and how they get there.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;&lt;a href=\"https://ixdf.org/about/careers/course-writer-and-editor-ux-ui-and-ai\"&gt;Our Course Writers and Editors&lt;/a&gt;&lt;/strong&gt;: lead how our courses and articles read. You make each title engaging, ensure each sentence flows, and edit the written course experience from the user’s perspective.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;We're a flexible team, and you'll be able to do what you excel in. Everyone on our team creates courses, and everyone works across these roles. If you're torn between two roles, apply for the one you'd be best at, and tell us in your application which other one you considered and why.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;You, the Course Director&lt;/strong&gt;, decide what belongs in our curriculum and who should teach it. You reach out to the world’s leading experts, plan the courses with them, and shoot courses with them. When an Education Designer brings you a course outline, you're the one who says what's missing, what doesn't belong, and how to optimize the learning outcome so designers can succeed today. You'll work closely with our&amp;nbsp;&lt;strong&gt;Co-Founder&lt;/strong&gt;, your&amp;nbsp;&lt;strong&gt;Team Lead&lt;/strong&gt;, our other&amp;nbsp;&lt;strong&gt;Course Directors&lt;/strong&gt;, and the&amp;nbsp;&lt;strong&gt;Education Designers&lt;/strong&gt;, and you'll plan and create courses alongside them. Our Course Writers and Editors take the finished material the last mile: the scripts, hooks, headings, on-screen text in videos, quiz wording, and editorial voice. You'll also work closely with the video team and our growth team.&lt;/p&gt; &lt;h2&gt;Your Role at IxDF&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Be a core part of our Editorial Team&lt;/strong&gt;. You'll collaborate with IxDF editors, video editors, and UX and UI designers as well as external industry leaders to create courses and Master Classes for people worldwide. You'll help them succeed in the age of AI with new skills in AI and in timeless human-centered design.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You'll research what already exists in a topic area, so that what we build is genuinely unique. You'll look at&amp;nbsp;&lt;strong&gt;where design and AI are heading, what designers need&amp;nbsp;&lt;/strong&gt;that nobody has taught well yet, and&amp;nbsp;&lt;strong&gt;what we should retire&amp;nbsp;&lt;/strong&gt;because the field has already moved on.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Find the people who should teach it.&lt;/strong&gt;&amp;nbsp;You decide a topic is worth a course, you work out who should teach it and why, you write the email, and you get the yes. Then you plan the content with the industry leader and agree what the course must leave a learner able to do.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Decide what each expert should teach.&lt;/strong&gt;&amp;nbsp;The best designers know a great deal, and a course that tries to capture all of it becomes an information dump. You develop a point of view on what a designer genuinely needs from them, and you hold the course to it.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;You'll decide which skills our courses teach&lt;/strong&gt;, both to people entering design and to experienced designers leveling up. Our goal is to help designers thrive in the age of AI and work responsibly, so their users can thrive too.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Ensure our course participants finish each course with a solid portfolio project they can show a hiring manager.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Help us decide what AI should do for our course participants&lt;/strong&gt;. Personalized learning paths, constructive AI feedback on portfolio work, practice environments where people run real design tasks and get feedback. You'll also help us improve the user flows on our own platform, so that learning at IxDF is as well designed as what we teach. You'll work on this with our founders, designers, and dev team.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Make an impact as you pressure-test the courses&amp;nbsp;&lt;/strong&gt;our Education Designers plan. An Education Designer sends you a course outline, and you read it against everything you know about the field and about how people learn design, then give constructive feedback on what's missing, what doesn't belong, and where the structure can be improved.&lt;strong&gt;&amp;nbsp;You know the limits of your own expertise&lt;/strong&gt;, and you research your way past them before you weigh in. You'll also plan, structure, and create courses yourself, alongside them.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're one of the people&lt;strong&gt;&amp;nbsp;whose judgment the rest of the team leans on.&lt;/strong&gt;&amp;nbsp;You show our Education Designers what ten or twenty years in the field taught you to look for. In return, our Co-Founder, your Team Lead, and our other Course Directors give constructive feedback on the courses you lead. You'll work in a&amp;nbsp;&lt;strong&gt;diverse, highly organized, result-driven environment&lt;/strong&gt;&amp;nbsp;where you'll grow personally and professionally.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Act as guardian of our quality bar&lt;/strong&gt;. When a course goes out under our name, it has to be better than anything else available on the topic. On the courses and Master Classes you lead or review, you're the one who spots what's not good enough yet and works with the team to fix it.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Bring your subject matter expertise&amp;nbsp;&lt;/strong&gt;to our writers, community managers, and social media team, so our design thinking stays consistent across everything we publish.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;You help produce Master Classes&lt;/strong&gt;. We produce 3 per month. Over email, you reach out to designers whose work you admire, invite them to create one with us, plan the content, and produce the live session.&amp;nbsp;&lt;strong&gt;Timelines vary enormously:&amp;nbsp;&lt;/strong&gt;with Don Norman or Vitaly Friedman it can be two weeks from first email to publication, because we work with them often. With a new expert, it can be half a year. Once the session is recorded, you get the footage and the transcript, and you decide with the Education Designers and Team Lead which existing course benefits from which snippets, and where they go.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Focus on what matters&amp;nbsp;&lt;/strong&gt;as you take raw expert video material, course and Master Class transcripts and footage featuring global industry leaders, and turn it into educational material that teaches new skills in AI and in timeless human-centered design. You'll work across UX design, human-computer interaction, design thinking, UI design, psychology, and AI.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Design for a diverse, global audience.&lt;/strong&gt;&amp;nbsp;Some of our courses and Master Classes serve working designers who want to grow into more senior work. Others serve people moving into design from other fields. Often, a course will serve both in the same lesson. Getting both right without watering either down is a rewarding design challenge.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Give the video team&amp;nbsp;&lt;strong&gt;constructive feedback&lt;/strong&gt;&amp;nbsp;on course and Master Class videos, from on-screen text and b-roll to graphics and animation, so each video is engaging to learn from and accurate from a design perspective.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Fly out and meet the global industry leaders in design in professional studios across the world.&lt;/strong&gt;&amp;nbsp;You'll shoot the course content there with some of your colleagues. Expect this a few times a year at minimum. Some of us love that part and join every studio production; others keep it to those few trips. Both work for us. On average&amp;nbsp;&lt;strong&gt;we shoot 4-6 new courses per year.&lt;/strong&gt;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Expect to have several courses moving at once at different stages: one you're planning with an expert, one being shot, one in production, and one published course that you're reviewing and improving.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Find room for improvement&lt;/strong&gt;&amp;nbsp;by looking at completion rates, learner feedback, and the portfolios course participants produce, then go back and fix what isn't excellent yet. Use the power of incremental, modular design as you help push the quality of our educational materials to new heights, surpassing even the very best in industry and academia. We're always learning, always improving, always raising the bar in everything we do and ship.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Maintain and improve our crystal-clear documentation&amp;nbsp;&lt;/strong&gt;so our knowledge resources stay up-to-date, easy to find, and provide instant value to our internal teams. Clarity is key. Any line of documentation should be self-explanatory.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;We're proud to have assembled&amp;nbsp;&lt;strong&gt;a remarkable team of unicorns&amp;nbsp;&lt;/strong&gt;who uplift, motivate, and push each other to excel daily. There's a seat open for someone who shares our passion for excellence. Could that be you?&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;About You&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;You have at least&lt;strong&gt;&amp;nbsp;10 years of hands-on design experience. Thirty is not too many.&lt;/strong&gt;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You have a&amp;nbsp;&lt;strong&gt;network among designers you respect&lt;/strong&gt;, and you're&amp;nbsp;&lt;strong&gt;comfortable writing to someone you admire&lt;/strong&gt;&amp;nbsp;and presenting them with an opportunity.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You know what the design community wants to see, and what it needs to learn.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're kind, and you have the&amp;nbsp;&lt;strong&gt;social intelligence and empathy to&lt;/strong&gt;&amp;nbsp;engage well with very different kinds of people. Much of this job is convincing busy, accomplished people that what we're building is worth their time.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;You can show us something you built or led&lt;/strong&gt;: a product, a design team, a course, an AI teaching app, or a conference track. We're excited to hear what it was, your thinking behind it, how long it took you to create, what went wrong, and how you improved it.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You can take a&amp;nbsp;&lt;strong&gt;broad, complex design practice and turn it into a step-by-step learning sequence&lt;/strong&gt;&amp;nbsp;that'll make a beginner feel and act confident. You can look at a plan for teaching something and&amp;nbsp;&lt;strong&gt;see what's missing&lt;/strong&gt;&amp;nbsp;before anyone builds it.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're a&amp;nbsp;&lt;strong&gt;practical idealist&lt;/strong&gt;. You know how to create great results through incremental quick wins and MVPs, and you know when to go all in and make something perfect.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You’re a&amp;nbsp;&lt;strong&gt;forward thinker&lt;/strong&gt;&amp;nbsp;who isn’t afraid to innovate and try new things before others have.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You&amp;nbsp;&lt;strong&gt;collaborate with AI in everything you do&lt;/strong&gt;. You use AI to research, structure, write, and create faster, and you know how to take&lt;strong&gt;&amp;nbsp;human leadership&lt;/strong&gt;, so the&amp;nbsp;&lt;strong&gt;outcome is 100% yours&amp;nbsp;&lt;/strong&gt;and better than you could have created without AI.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You’re&amp;nbsp;&lt;strong&gt;eager to help people build UX and UI skills&lt;/strong&gt;&amp;nbsp;because you know they’re more relevant than ever in the age of AI.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You can&amp;nbsp;&lt;strong&gt;teach a career changer&lt;/strong&gt;&amp;nbsp;the powerful skills of great design, and you can&amp;nbsp;&lt;strong&gt;guide an experienced designer&lt;/strong&gt;&amp;nbsp;in upskilling. Perhaps you've mentored people, or you’ve run your own company helping clients level up.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You&amp;nbsp;&lt;strong&gt;give constructive feedback people can act on&lt;/strong&gt;, and you can tell a talented colleague how they can improve their work without them becoming defensive.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're genuinely&amp;nbsp;&lt;strong&gt;curious&lt;/strong&gt;&amp;nbsp;about how AI is changing design work and design education.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're&amp;nbsp;&lt;strong&gt;fluent in written and spoken English&lt;/strong&gt;&amp;nbsp;and you can explain complex ideas clearly.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You’re enthusiastic about learning by doing and are&amp;nbsp;&lt;strong&gt;committed to putting in the effort to continuously improve your skills&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You&amp;nbsp;&lt;strong&gt;spot problems&lt;/strong&gt;&amp;nbsp;before anyone else notices them, and when something goes off track you come back with a solution rather than a report.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You&amp;nbsp;&lt;strong&gt;value teamwork&lt;/strong&gt;, prioritize collaboration, and focus on collective goals and harmony in the workplace.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're&amp;nbsp;&lt;strong&gt;self-motivated&lt;/strong&gt;, and you love&amp;nbsp;&lt;strong&gt;creative freedom&lt;/strong&gt;,&amp;nbsp;&lt;strong&gt;independent judgment&lt;/strong&gt;, and the&amp;nbsp;&lt;strong&gt;responsibility&lt;/strong&gt;&amp;nbsp;that comes with both.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You’re driven by the desire to&amp;nbsp;&lt;strong&gt;make a positive impact in the world&lt;/strong&gt;&amp;nbsp;and to improve the lives of others.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;If you still love designing in Figma and building interfaces with AI, there's room for that here. Some of our Course Directors design hands-on; others have moved fully into direction. Both work for us.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Most of the work happens from your&amp;nbsp;&lt;strong&gt;home office,&amp;nbsp;&lt;/strong&gt;but you're&amp;nbsp;&lt;strong&gt;willing to travel a few times a year&lt;/strong&gt;&amp;nbsp;to shoot courses.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're located in a&amp;nbsp;&lt;strong&gt;time zone&lt;/strong&gt;&amp;nbsp;between UTC-6 (Austin, Chicago) and UTC+8 (Singapore, Perth), which includes all of Europe.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Bonus Points&lt;/h2&gt; &lt;p&gt;None of these are required, but each of them would make us even happier.&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;You've&amp;nbsp;&lt;strong&gt;led a design team.&lt;/strong&gt;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You&amp;nbsp;&lt;strong&gt;publish your own thinking on design&lt;/strong&gt;: articles, a book, educational material, a blog, or a social media presence.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You've&lt;strong&gt;&amp;nbsp;spoken at design conferences&lt;/strong&gt;, or you're on a first-name basis with people who do.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You've&amp;nbsp;&lt;strong&gt;created design systems&lt;/strong&gt;. Organizing complex material so other people can put it to use is a lot of what you'll be doing.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You've worked as an&amp;nbsp;&lt;strong&gt;editor&lt;/strong&gt;, or you've created&amp;nbsp;&lt;strong&gt;online courses&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You have the graphic design skills to create image-based and interactive content for courses, articles, and social media.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You've&amp;nbsp;&lt;strong&gt;built AI-supported learning tools&lt;/strong&gt;&amp;nbsp;yourself, or you've used AI to build products.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You hold a&amp;nbsp;&lt;strong&gt;bachelor's or master's&lt;/strong&gt;&amp;nbsp;degree in UX, UI, HCI&lt;em&gt;,&lt;/em&gt;&amp;nbsp;AI, or a similar field.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You’ve&amp;nbsp;&lt;strong&gt;collaborated with video production teams&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;What We Can Offer&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;A highly valued role&lt;/strong&gt;: You'll shape our core product, our courses and Master Classes.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Reach and impact that are difficult to find anywhere else in this field.&lt;/strong&gt;&amp;nbsp;A design leader might shape the work of thirty people on their team. Your decisions about what we teach will reach hundreds of thousands. They'll build better careers and design a better world for all of us.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Access:&amp;nbsp;&lt;/strong&gt;the designers you'd normally see on a conference stage are the people you'll email, plan with, and sit across from in a studio. Our name opens doors. An email from IxDF gets read, so the reach you have now is the floor, not the ceiling.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Autonomy&lt;/strong&gt;: Nobody will ever hand you a template and tell you to fill it in.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;A global, purpose-driven team: work remotely&amp;nbsp;&lt;/strong&gt;alongside passionate professionals from all over the world, united by a&amp;nbsp;&lt;strong&gt;common mission&lt;/strong&gt;&amp;nbsp;to create the best possible design and AI education in the world and make it accessible for everyone.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Our co-founder and co-CEO, Rikke, will work closely with you&lt;/strong&gt;. She and our other co-founder, Mads, built IxDF from nothing, with no investment capital, so we would stay free to make world-class design education affordable to everyone. She was the sole editor and video editor for many of our early years, so she's shaped our course planning, expert interviews, video shoots, and content editing from the inside. She's still hands-on in everything we do, and she still films educational videos herself, in places like the US, the North Pole, and Nepal.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A&amp;nbsp;&lt;strong&gt;full-time position&lt;/strong&gt;&amp;nbsp;within a fully remote organization. Video-based collaboration with your colleagues from elsewhere on the planet, and we get together in person each year, on a team trip or for a studio production.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Bi-weekly&amp;nbsp;&lt;strong&gt;knowledge-sharing sessions&lt;/strong&gt;&amp;nbsp;and 4 meeting-free days weekly for focused work.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A work culture with no&amp;nbsp;&lt;strong&gt;fluffy titles, political agendas, or corporate drama&lt;/strong&gt;. Your colleagues value&amp;nbsp;&lt;strong&gt;your warm character, your strong work ethic, and the results you deliver&lt;/strong&gt;. If you embody old-school virtues of always striving to deliver results, learn and become better every day, you'll thrive at IxDF.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A daily mission to help impact,&amp;nbsp;&lt;strong&gt;empower, and enrich the lives of millions of people&lt;/strong&gt;&amp;nbsp;by creating&amp;nbsp;&lt;strong&gt;affordable high-end design education&lt;/strong&gt;&amp;nbsp;for everyone across the planet. It'll be yours too.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Colleagues with four to forty years of experience&lt;/strong&gt;, and a culture where we follow the best idea, not the longest résumé.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A company&amp;nbsp;&lt;strong&gt;where the distance between idea and execution is minimal.&lt;/strong&gt;&amp;nbsp;We're a highly agile organization with&amp;nbsp;&lt;strong&gt;zero bureaucracy or corporate politics&lt;/strong&gt;&amp;nbsp;– and with&amp;nbsp;&lt;strong&gt;exceptional order and efficiency&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A company culture where&lt;strong&gt;&amp;nbsp;passion meets high performance and excellence&lt;/strong&gt;. To help us improve the world, and yourself in the process,&amp;nbsp;&lt;strong&gt;you'll need grit, strong work ethic, long-term thinking, and self-discipline&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;We thrive because we have a&amp;nbsp;&lt;strong&gt;hands-on attitude and a bias towards action&lt;/strong&gt;&amp;nbsp;as opposed to fluff-filled, unrealistic strategies. You'll need&amp;nbsp;&lt;strong&gt;crisp execution skills yourself&lt;/strong&gt;&amp;nbsp;and the ability to&amp;nbsp;&lt;strong&gt;impress your colleagues with concrete results&lt;/strong&gt;, just like they'll impress you.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;We built online design education before people believed in it. AI is now changing what designers do, and they carry a bigger responsibility than ever. You'll be at the&amp;nbsp;&lt;strong&gt;forefront of teaching designers to work with AI and to design responsibly for it&lt;/strong&gt;. You'll help&amp;nbsp;&lt;strong&gt;set a direction&lt;/strong&gt; that shapes both the designers we teach and the people who use what they build. Together, we'll design a better world.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;div class=\"OutlineElement Ltr SCXW248147200 BCX0\"&gt; &lt;h2 class=\"Paragraph SCXW248147200 BCX0\"&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;How to Learn More and Apply&amp;nbsp;&lt;/span&gt;&lt;span class=\"EOP Selected SCXW248147200 BCX0\"&gt;&amp;nbsp;&lt;/span&gt;&lt;/h2&gt; &lt;/div&gt; &lt;div class=\"OutlineElement Ltr SCXW248147200 BCX0\"&gt; &lt;p class=\"Paragraph SCXW248147200 BCX0\"&gt;&lt;span class=\"TextRun SCXW248147200 BCX0\" lang=\"EN-GB\" xml:lang=\"EN-GB\"&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;To&amp;nbsp;&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;submit&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;&amp;nbsp;your application as well as learn more about our Work Culture and Values, please visit https://ixdf.org/about/careers&lt;/span&gt;&lt;/span&gt;&lt;span class=\"EOP Selected SCXW248147200 BCX0\"&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;/div&gt; &lt;div class=\"OutlineElement Ltr SCXW248147200 BCX0\"&gt; &lt;p class=\"Paragraph SCXW248147200 BCX0\"&gt;&lt;span class=\"TextRun SCXW248147200 BCX0\" lang=\"EN-GB\" xml:lang=\"EN-GB\"&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;Please apply as soon as you can.&amp;nbsp;&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;We’re&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;&amp;nbsp;firm believers in “the sooner, the better” and we&amp;nbsp;&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;look&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;&amp;nbsp;forward to working with you!&lt;/span&gt;&lt;/span&gt;&lt;span class=\"EOP Selected SCXW248147200 BCX0\"&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/ixdf-interaction-design-foundation-course-director-ux-ui-and-ai\"&gt;https://weworkremotely.com/remote-jobs/ixdf-interaction-design-foundation-course-director-ux-ui-and-ai&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 26 Aug 2026 11:52:22 +0000</pubDate> <expires_at>Fri, 25 Sep 2026 11:52:22 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/ixdf-interaction-design-foundation-course-director-ux-ui-and-ai</guid> <link>https://weworkremotely.com/remote-jobs/ixdf-interaction-design-foundation-course-director-ux-ui-and-ai</link> </item> <item> <title>IxDF - Interaction Design Foundation: Education Designer: UX, UI, and AI </title> <region>Anywhere in the World</region> <country></country> <state>Texas</state> <skills>UI/UX Design, Writing, Design, Education, and Interaction Design</skills> <category>Design</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Denmark &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://ixdf.org/about/careers\"&gt;https://ixdf.org/about/careers&lt;/a&gt; &lt;/p&gt; &lt;p&gt;You're a designer who has facilitated workshops or built online courses, and you noticed that&lt;strong&gt;&amp;nbsp;you loved it and that you were unusually good at it&lt;/strong&gt;.&lt;/p&gt; &lt;p&gt;You know how to make complex skills easy to learn, and how to guide people in applying their new skills. As one of our Education Designers, you'll structure and create the courses and Master Classes you lead.&lt;/p&gt; &lt;p&gt;You've taught design or AI to hundreds of people. Now you get the opportunity to&amp;nbsp;&lt;strong&gt;teach it to hundreds of thousands&amp;nbsp;&lt;/strong&gt;of learners around the world.&lt;/p&gt; &lt;p&gt;You see the fear around AI, and you understand where it comes from. But you also see the opportunities, and you want to show people how to work with AI in a way that benefits their lives, their users, and the world.&lt;/p&gt; &lt;p&gt;The industry leaders whose expertise you'll be turning into courses and Master Classes include&amp;nbsp;&lt;strong&gt;Don Norman and Vitaly Friedman&lt;/strong&gt;, as well as Design Leads at&amp;nbsp;&lt;strong&gt;Netflix, LinkedIn, Meta, and Adobe&lt;/strong&gt;. Don Norman also chairs our executive board.&lt;/p&gt; &lt;p&gt;You’ll be involved in all stages of course and Master Class creation, including key decisions, so there are incredible opportunities for you to&amp;nbsp;&lt;strong&gt;take initiative, make meaningful contributions, and grow&lt;/strong&gt;. Forget political struggles or long, pointless debates. You’ll be in a team with minimal distance between idea and action, where decisions are made ultra-fast.&lt;/p&gt; &lt;h2&gt;Join the Global Leader in Online Design and AI Education&lt;/h2&gt; &lt;p&gt;IxDF is the world's largest online design and AI education platform, with over 1,150,000 enrollments since 2002. We hold the trust of industry giants like Adobe, NASA, and IBM, who rely on our courses to train their teams. Prestigious universities, including MIT and the University of Cambridge, integrate our material into their curricula. Help us&amp;nbsp;&lt;strong&gt;take online education to new heights&lt;/strong&gt;&amp;nbsp;and&amp;nbsp;&lt;strong&gt;make a meaningful impact on humankind&lt;/strong&gt;.&lt;/p&gt; &lt;p&gt;At IxDF, we’re not just a company but a movement dedicated to making high-quality design and AI education accessible to everyone, everywhere.&lt;/p&gt; &lt;p&gt;We've pioneered online design education since 2002. We have over 1,150,000 enrollments and 1,583 company members, with more than 40 courses, 160 Master Classes, and thousands of open-source design resources, created by our team in collaboration with 240 industry leaders.&lt;/p&gt; &lt;p&gt;With learners from over 100 countries, your work will empower people worldwide.&lt;/p&gt; &lt;h2&gt;We're Hiring Three People for Our Editorial Team&lt;/h2&gt; &lt;p&gt;We're growing, and three roles are open at the same time to build the next generation of our core educational product. Here's what each role leads on:&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Our Education Designers, UX, UI, and AI:&amp;nbsp;&lt;/strong&gt;lead how design and AI are taught. You plan, structure, and create the core content, and you decide what a course participant should be able to do by the end and how they get there.&amp;nbsp;&lt;strong&gt;This is the role described here.&lt;/strong&gt;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;&lt;a href=\"https://ixdf.org/about/careers/course-director-ux-ui-and-ai\"&gt;Our Course Directors, UX, UI, and AI&lt;/a&gt;:&amp;nbsp;&lt;/strong&gt;lead what we teach and who teaches our courses and Master Classes. You reach out to industry leaders and create the invitation they say yes to. You bring your judgment to a planned course outline: what's missing, what doesn't belong, and whether the structure is solid. You plan and shoot courses with our&amp;nbsp;&lt;strong&gt;Education Designers&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;&lt;a href=\"https://ixdf.org/about/careers/course-writer-and-editor-ux-ui-and-ai\"&gt;Our Course Writers and Editors&lt;/a&gt;:&amp;nbsp;&lt;/strong&gt;lead how our courses and articles read. You make each title engaging, ensure each sentence flows, and edit the written course experience from the user’s perspective.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;We’re a flexible team, and you’ll be able to do what you excel in. Everyone on our team creates courses, and everyone works across these roles. If you're torn between two roles, apply for the one you'd be best at, and tell us in your application which other one you considered and why.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;You, the Education Designer,&amp;nbsp;&lt;/strong&gt;establish what a course participant should be able to do by the end of a course. You create the sequences, exercises, templates, and assessments. You'll work closely with our&amp;nbsp;&lt;strong&gt;Co-Founder&lt;/strong&gt;, your&amp;nbsp;&lt;strong&gt;Team Lead&lt;/strong&gt;, and the&amp;nbsp;&lt;strong&gt;Course Directors&lt;/strong&gt;, who lead on what we teach and who teaches it, and you'll have a real say in both. We all reach out to and collaborate with industry leaders in these processes. Once your course is ready, our&amp;nbsp;&lt;strong&gt;Course Writers and Editors&lt;/strong&gt;&amp;nbsp;take it the last mile: the scripts, hooks, headings, on-screen text in videos, quiz wording, and editorial voice. You'll also work closely with the video team and our growth team.&lt;/p&gt; &lt;h2&gt;Your Role at IxDF&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Be a core part of our Editorial Team.&lt;/strong&gt;&amp;nbsp;You'll collaborate with IxDF editors, video editors, and UX and UI designers as well as external industry leaders to create courses and Master Classes for people worldwide. You'll help them succeed in the age of AI with new skills in AI and in timeless human-centered design.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Design for a diverse, global audience.&amp;nbsp;&lt;/strong&gt;Some of our courses and Master Classes serve working designers who want to grow into more senior work. Others serve people moving into design from other fields. Often, you'll teach both in the same lesson. Getting both right without watering either down is a rewarding design challenge.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Make an impact as you decide how the courses you lead come together.&lt;/strong&gt;&amp;nbsp;You establish what a course participant should be able to do by the end of a course, then you plan, structure, and create the core content that gets them there. What comes first, what builds on what, and how people level up step by step with ease and joy from confused to competent. You'll work across UX design, human-computer interaction, design thinking, UI design, psychology, and AI.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Design the exercises, portfolio activities, design templates, and assessments that&amp;nbsp;&lt;strong&gt;turn passive watching into active designing&lt;/strong&gt;. You write the exercises that make a course participant apply an idea to their own portfolio project, the templates that scaffold that work, and the assessments that reveal whether they understood and can apply it, or whether they just watched. You write the headings and hooks your structure calls for, and our Course Writers and Editors own the final wording. Every course should leave a participant with a portfolio case study they can show a hiring manager.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Set and raise the standard for our assessments,&amp;nbsp;&lt;/strong&gt;so a correct answer proves understanding, not just recognition, and a good question teaches as well as tests.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Make expert knowledge understandable.&lt;/strong&gt;&amp;nbsp;You take raw expert video material, course and Master Class transcripts and footage featuring global industry leaders, and turn it into educational material that teaches timeless human-centered design and AI.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;You help produce Master Classes.&amp;nbsp;&lt;/strong&gt;We produce 3 per month. Over email, you reach out to designers whose work you admire, invite them to create one with us, plan the content, and produce the live session.&amp;nbsp;&lt;strong&gt;Timelines vary enormously&lt;/strong&gt;: with Don Norman or Vitaly Friedman it can be two weeks from first email to publication, because we work with them often. With a new expert, it can be half a year. Once the session is recorded, you get the footage and the transcript, and you decide with the Course Directors and Team Lead which existing course benefits from which snippets, and where they go.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You&amp;nbsp;&lt;strong&gt;plan the course content in collaboration with the global industry leaders&lt;/strong&gt;&amp;nbsp;in design and then&amp;nbsp;&lt;strong&gt;fly out to meet them in professional studios across the world&lt;/strong&gt;. You'll shoot the course content there with some of your colleagues. Expect this a few times a year at minimum. Some of us love that part and join every studio production; others keep it to those few trips. Both work for us. On average&lt;strong&gt;&amp;nbsp;we shoot 4-6 new courses per year.&lt;/strong&gt;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Our courses combine written and video lessons.&amp;nbsp;&lt;/strong&gt;You'll work closely with the video team, giving constructive feedback on on-screen text, b-roll, graphics, and animation, and telling them which takeaways need a visual, so each video is more engaging to learn from and accurate from a design perspective. You'll also work closely with our growth team.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Balance the big picture with the smaller details.&amp;nbsp;&lt;/strong&gt;Expect to focus on&amp;nbsp;&lt;strong&gt;one large course creation project per quarter&lt;/strong&gt;, alongside small, continuous improvements to what's already published.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Find room for improvement&amp;nbsp;&lt;/strong&gt;by looking at completion rates, learner feedback, and the portfolios course participants produce, then go back and fix what isn't excellent yet. Use the power of incremental, modular design as you help push the quality of our educational materials to new heights, surpassing even the very best in industry and academia. We're always learning, always improving, always raising the bar in everything we do and ship.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Maintain and improve our crystal-clear documentation&amp;nbsp;&lt;/strong&gt;so our knowledge resources stay up-to-date, easy to find, and provide instant value to our internal teams. Clarity is key. Any line of documentation should be self-explanatory.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;You won't do this alone.&amp;nbsp;&lt;/strong&gt;You'll work with our Course Directors, your Team Lead, and our Co-Founder to pressure-test the structure: what's missing, what doesn't belong, and whether it holds together. That kind of judgment takes twenty years to build, and this type of collaboration is one of the fastest ways to grow your own design skills. You'll work in a diverse, highly organized, result-driven environment where you'll grow personally and professionally.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;We’re committed to excellence,&lt;/strong&gt;&amp;nbsp;and we seek a like-minded enthusiast to join us. This role is not for the average. Ahead of you is a highly rewarding and enriching journey.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;We're proud to have assembled a&amp;nbsp;&lt;strong&gt;remarkable team of unicorns&lt;/strong&gt;&amp;nbsp;who uplift, motivate, and push each other to excel daily. There's a seat open for someone who shares our passion for excellence. Could that be you?&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;About You&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;You have at least&amp;nbsp;&lt;strong&gt;5 years of hands-on design experience&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You've&amp;nbsp;&lt;strong&gt;facilitated workshops&lt;/strong&gt;&amp;nbsp;repeatedly, run a beginner course, mentored designers, or built curricula for online courses.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You can&amp;nbsp;&lt;strong&gt;show us something you built&lt;/strong&gt;: a course, a workshop series, live Master Classes, an AI teaching app, or a mentoring program. We’re excited to hear what it was, why you built it the way you did, and how long it took you to create.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You can take a&amp;nbsp;&lt;strong&gt;broad, complex design practice and turn it into a step-by-step learning sequence&lt;/strong&gt;&amp;nbsp;that’ll make a beginner feel and act confident.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You can teach the same idea in different formats: a 60-minute workshop, a written lesson, a 90-second video. You know what a medium does well and what it can't carry, and you know what to cut when the format gets shorter.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're a&lt;strong&gt;&amp;nbsp;practical idealist&lt;/strong&gt;. You know how to create great results through incremental quick wins and MVPs, and you know when to go all in and make something perfect.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You&amp;nbsp;&lt;strong&gt;collaborate with AI in everything you do&lt;/strong&gt;. You use AI to research, structure, write, and create faster, and you know how to take&lt;strong&gt;&amp;nbsp;human leadership&lt;/strong&gt;, so the&amp;nbsp;&lt;strong&gt;outcome is 100% yours&amp;nbsp;&lt;/strong&gt;and better than you could have created without AI.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You know the difference between&amp;nbsp;&lt;strong&gt;timeless human-centered design skills and skills in tools that change&lt;/strong&gt;. You’re passionate about the first, because they’re the most interesting to you and you know that AI will take over much of the tool-based design work soon. You’re eager to help people build UX and UI skills because you know they’re more relevant than ever in the age of AI.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You can&amp;nbsp;&lt;strong&gt;teach a career changer&lt;/strong&gt;&amp;nbsp;the powerful skills of great design, and you can&amp;nbsp;&lt;strong&gt;guide an experienced designer&lt;/strong&gt;&amp;nbsp;in upskilling to a more senior role.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're genuinely&amp;nbsp;&lt;strong&gt;curious&lt;/strong&gt;&amp;nbsp;about how AI is changing design work and design education.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're kind, and you have the&amp;nbsp;&lt;strong&gt;social intelligence and empathy&lt;/strong&gt;&amp;nbsp;to engage well with very different kinds of people.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're&amp;nbsp;&lt;strong&gt;fluent in written and spoken English&lt;/strong&gt;&amp;nbsp;and you can explain complex ideas clearly.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You’re enthusiastic about learning by doing and are&amp;nbsp;&lt;strong&gt;committed to putting in the effort to continuously improve your skills&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You&amp;nbsp;&lt;strong&gt;spot problems&lt;/strong&gt;&amp;nbsp;before anyone else notices them, and when something goes off track you come back with a solution rather than a report.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You&amp;nbsp;&lt;strong&gt;value teamwork&lt;/strong&gt;, prioritize collaboration, and focus on collective goals. You give constructive feedback that others can act on, and you take it the same way. When someone shows you how your idea could be better, you're interested rather than defensive.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're&amp;nbsp;&lt;strong&gt;self-motivated&lt;/strong&gt;, and you love&amp;nbsp;&lt;strong&gt;creative freedom&lt;/strong&gt;,&amp;nbsp;&lt;strong&gt;independent judgment&lt;/strong&gt;, and the&amp;nbsp;&lt;strong&gt;responsibility&lt;/strong&gt;&amp;nbsp;that comes with both.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You’re driven by the desire to&amp;nbsp;&lt;strong&gt;make a positive impact in the world&lt;/strong&gt;&amp;nbsp;and to improve the lives of others.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Most of the work happens from your&amp;nbsp;&lt;strong&gt;home office,&amp;nbsp;&lt;/strong&gt;but you're&amp;nbsp;&lt;strong&gt;willing to travel a few times a year&lt;/strong&gt;&amp;nbsp;to shoot courses. You're located in a&amp;nbsp;&lt;strong&gt;time zone&lt;/strong&gt;&amp;nbsp;between UTC-6 (Austin, Chicago) and UTC+8 (Singapore, Perth), which includes all of Europe.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Bonus Points&lt;/h2&gt; &lt;p&gt;None of these are required, but each of them would make us even happier.&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;You've&amp;nbsp;&lt;strong&gt;published&amp;nbsp;&lt;/strong&gt;educational material under your own name or&amp;nbsp;&lt;strong&gt;spoken&lt;/strong&gt;&amp;nbsp;at design conferences.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You've worked with an&amp;nbsp;&lt;strong&gt;LMS or an online learning platform&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You've&amp;nbsp;&lt;strong&gt;built AI-supported learning&lt;/strong&gt;: tutors, adaptive paths, automated feedback. Or you’ve used AI to build products.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You hold a&amp;nbsp;&lt;strong&gt;bachelor's or master's&lt;/strong&gt;&amp;nbsp;in UX, UI, AI, or a similar field.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You have your&amp;nbsp;&lt;strong&gt;own blog or social media page&lt;/strong&gt;&amp;nbsp;where you create and share original content.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You have&amp;nbsp;&lt;strong&gt;collaborated with video production teams&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;What We Can Offer&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;A highly valued role:&lt;/strong&gt;&amp;nbsp;You'll shape our core product, our courses and Master Classes.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Reach and impact&lt;/strong&gt;&amp;nbsp;that are difficult to find anywhere else in this field. A workshop facilitator might teach one hundred designers a year. Your design decisions will reach hundreds of thousands. They'll build better careers and design a better world for all of us.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Access:&lt;/strong&gt;&lt;em&gt;&lt;strong&gt;&amp;nbsp;&lt;/strong&gt;&lt;/em&gt;The experts you'd normally cite in a workshop are the people whose material you'll be shaping, whose Master Classes you'll produce, and in some cases the people you'll be in a studio with. Our name opens doors. An email from IxDF gets read, so the reach you have now is the floor, not the ceiling.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Autonomy:&amp;nbsp;&lt;/strong&gt;Nobody will ever hand you a template and tell you to fill it in. You decide how our courses teach.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;A global, purpose-driven team: Work remotely&amp;nbsp;&lt;/strong&gt;alongside passionate professionals from all over the world, united by a&amp;nbsp;&lt;strong&gt;common mission&lt;/strong&gt;&amp;nbsp;to create the best possible design and AI education in the world, and make it accessible for everyone.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Our co-founder and co-CEO, Rikke, will work closely with you&lt;/strong&gt;. She and our other co-founder, Mads, built IxDF from nothing, with no investment capital, so we would stay free to make world-class design education affordable to everyone. She was the sole editor and video editor for many of our early years, so she's shaped our course planning, expert interviews, video shoots, and content editing from the inside. She's still hands-on in everything we do, and she still films educational videos herself, in places like the US, the North Pole, and Nepal.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A&amp;nbsp;&lt;strong&gt;full-time position&lt;/strong&gt;&amp;nbsp;within a fully remote organization. Video-based collaboration with your colleagues from elsewhere on the planet, and we get together in person each year, on a team trip or for a studio production.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Bi-weekly&amp;nbsp;&lt;strong&gt;knowledge-sharing sessions&lt;/strong&gt;&amp;nbsp;and 4 meeting-free days weekly for focused work.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A work culture with no&amp;nbsp;&lt;strong&gt;fluffy titles, political agendas, or corporate drama&lt;/strong&gt;. Your colleagues value&amp;nbsp;&lt;strong&gt;your warm character, your strong work ethic, and the results you deliver&lt;/strong&gt;. If you embody old-school virtues of always striving to deliver results, learn and become better every day, you'll thrive at IxDF.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A daily mission to help impact,&amp;nbsp;&lt;strong&gt;empower, and enrich the lives of millions of people&lt;/strong&gt;&amp;nbsp;by creating&amp;nbsp;&lt;strong&gt;affordable high-end design education&lt;/strong&gt;&amp;nbsp;for everyone across the planet. It'll be yours too.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Colleagues with four to forty years of experience&lt;/strong&gt;, and a culture where we follow the best idea, not the longest résumé.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A company&amp;nbsp;&lt;strong&gt;where the distance between idea and execution is minimal.&lt;/strong&gt;&amp;nbsp;We're a highly agile organization with&amp;nbsp;&lt;strong&gt;zero bureaucracy or corporate politics&lt;/strong&gt;&amp;nbsp;– and with&amp;nbsp;&lt;strong&gt;exceptional order and efficiency&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A company culture where&lt;strong&gt;&amp;nbsp;passion meets high performance and excellence&lt;/strong&gt;. To help us improve the world, and yourself in the process,&amp;nbsp;&lt;strong&gt;you'll need grit, strong work ethic, long-term thinking, and self-discipline&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;We thrive because we have a&amp;nbsp;&lt;strong&gt;hands-on attitude and a bias towards action&lt;/strong&gt;&amp;nbsp;as opposed to fluff-filled, unrealistic strategies. You'll need&amp;nbsp;&lt;strong&gt;crisp execution skills yourself&lt;/strong&gt;&amp;nbsp;and the ability to&amp;nbsp;&lt;strong&gt;impress your colleagues with concrete results&lt;/strong&gt;, just like they'll impress you.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;If you want even more opportunities to show the world what you can do, you’re in luck! When you're willing to do the hard work of learning and growing, then you’ll find virtually&amp;nbsp;&lt;strong&gt;limitless opportunities with us.&lt;/strong&gt;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;We built online design education before people believed in it. AI is now changing what designers do, and they carry a bigger responsibility than ever. You'll be at the&amp;nbsp;&lt;strong&gt;forefront of teaching designers to work with AI and to design responsibly for it&lt;/strong&gt;. You'll help&amp;nbsp;&lt;strong&gt;set a direction&lt;/strong&gt; that shapes both the designers we teach and the people who use what they build. Together, we'll design a better world.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;div class=\"OutlineElement Ltr SCXW248147200 BCX0\"&gt; &lt;h2 class=\"Paragraph SCXW248147200 BCX0\"&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;How to Learn More and Apply&amp;nbsp;&lt;/span&gt;&lt;span class=\"EOP Selected SCXW248147200 BCX0\"&gt;&amp;nbsp;&lt;/span&gt;&lt;/h2&gt; &lt;/div&gt; &lt;div class=\"OutlineElement Ltr SCXW248147200 BCX0\"&gt; &lt;p class=\"Paragraph SCXW248147200 BCX0\"&gt;&lt;span class=\"TextRun SCXW248147200 BCX0\" lang=\"EN-GB\" xml:lang=\"EN-GB\"&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;To&amp;nbsp;&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;submit&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;&amp;nbsp;your application as well as learn more about our Work Culture and Values, please visit https://ixdf.org/about/careers&lt;/span&gt;&lt;/span&gt;&lt;span class=\"EOP Selected SCXW248147200 BCX0\"&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;/div&gt; &lt;div class=\"OutlineElement Ltr SCXW248147200 BCX0\"&gt; &lt;p class=\"Paragraph SCXW248147200 BCX0\"&gt;&lt;span class=\"TextRun SCXW248147200 BCX0\" lang=\"EN-GB\" xml:lang=\"EN-GB\"&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;Please apply as soon as you can.&amp;nbsp;&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;We’re&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;&amp;nbsp;firm believers in “the sooner, the better” and we&amp;nbsp;&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;look&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;&amp;nbsp;forward to working with you!&lt;/span&gt;&lt;/span&gt;&lt;span class=\"EOP Selected SCXW248147200 BCX0\"&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/ixdf-interaction-design-foundation-education-designer-ux-ui-and-ai\"&gt;https://weworkremotely.com/remote-jobs/ixdf-interaction-design-foundation-education-designer-ux-ui-and-ai&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 26 Aug 2026 11:48:28 +0000</pubDate> <expires_at>Fri, 25 Sep 2026 11:48:28 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/ixdf-interaction-design-foundation-education-designer-ux-ui-and-ai</guid> <link>https://weworkremotely.com/remote-jobs/ixdf-interaction-design-foundation-education-designer-ux-ui-and-ai</link> </item> <item> <title>IxDF - Interaction Design Foundation: Course Writer and Editor: UX, UI, and AI </title> <region>Anywhere in the World</region> <country></country> <state>Texas</state> <skills>UI/UX Design, Writing, Design, and Editing</skills> <category>Design</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Denmark &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://ixdf.org/about/careers\"&gt;https://ixdf.org/about/careers&lt;/a&gt; &lt;/p&gt; &lt;p&gt;You're the one people trust with the words, whether you're writing them or fixing them. You noticed that&amp;nbsp;&lt;strong&gt;you loved it, and that you were unusually good at it&lt;/strong&gt;. You turn rough, complex ideas into words people understand.&lt;/p&gt; &lt;p&gt;Now you get the opportunity to work with some of the most respected designers alive, and help share their knowledge with hundreds of thousands of learners around the world.&lt;/p&gt; &lt;p&gt;A great hook pulls your readers in, makes them see themselves in the topic, and shows them why it matters in their lives. That's your craft. Abstract ideas don't stay abstract for long, because you find the example that makes an idea concrete. You're structured and systematic, yet creative, and you'll rewrite a sentence six times until it says exactly what you mean.&lt;/p&gt; &lt;p&gt;You see the fear around AI, and you understand where it comes from. But you also see the opportunities, and you want to show people how to work with AI in a way that benefits their lives, their users, and the world.&lt;/p&gt; &lt;p&gt;If you're also curious about how great design and the responsible use of AI improve people's lives, read on. As one of our Course Writers and Editors, you'll shape how our courses and Master Classes read and flow.&lt;/p&gt; &lt;p&gt;The industry leaders whose expertise you'll be turning into courses and Master Classes include&amp;nbsp;&lt;strong&gt;Don Norman and Vitaly Friedman&lt;/strong&gt;, as well as Design Leads at&amp;nbsp;&lt;strong&gt;Netflix, LinkedIn, Meta, and Adobe&lt;/strong&gt;.&lt;/p&gt; &lt;p&gt;You’ll be involved in all stages of course and Master Class creation, including key decisions, so there are incredible opportunities for you to&amp;nbsp;&lt;strong&gt;take initiative, make meaningful contributions, and grow&lt;/strong&gt;. Forget political struggles or long, pointless debates. You’ll be in a team with minimal distance between word and action, where decisions are made ultra-fast.&lt;/p&gt; &lt;h2&gt;Join the Global Leader in Online Design and AI Education&lt;/h2&gt; &lt;p&gt;IxDF is the world's largest online design and AI education platform, with over 1,150,000 enrollments since 2002. We hold the trust of industry giants like Adobe, NASA, and IBM, who rely on our courses to train their teams. Prestigious universities, including MIT and the University of Cambridge, integrate our material into their curricula. Help us&amp;nbsp;&lt;strong&gt;take online education to new heights&lt;/strong&gt;&amp;nbsp;and&amp;nbsp;&lt;strong&gt;make a meaningful impact on humankind&lt;/strong&gt;.&lt;/p&gt; &lt;p&gt;At IxDF, we’re not just a company but a movement dedicated to making high-quality design and AI education accessible to everyone, everywhere.&lt;/p&gt; &lt;p&gt;We've pioneered online design education since 2002. We have over 1,150,000 enrollments and 1,583 company members, with more than 40 courses, 160 Master Classes, and thousands of open-source design resources, created by our team in collaboration with 240 industry leaders.&lt;/p&gt; &lt;p&gt;With learners from over 100 countries, your work will empower people worldwide.&lt;/p&gt; &lt;h2&gt;We're Hiring Three People for Our Editorial Team&lt;/h2&gt; &lt;p&gt;We're growing, and three roles are open at the same time to build the next generation of our core educational product. Here's what each role leads on:&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Our Course Writers and Editors:&amp;nbsp;&lt;/strong&gt;lead how our courses and articles read. You make each title engaging, ensure each sentence flows, and edit the written course experience from the user’s perspective.&amp;nbsp;&lt;strong&gt;This is the role described here.&lt;/strong&gt;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;&lt;a href=\"https://ixdf.org/about/careers/education-designer-ux-ui-and-ai\"&gt;Our Education Designers, UX, UI, and AI&lt;/a&gt;:&amp;nbsp;&lt;/strong&gt;lead how design and AI are taught. You plan, structure, and create the core content, and you decide what a course participant should be able to do by the end and how they get there.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;&lt;a href=\"https://ixdf.org/about/careers/course-director-ux-ui-and-ai\"&gt;Our Course Directors, UX, UI, and AI:&lt;/a&gt;&amp;nbsp;&lt;/strong&gt;lead what we teach and who teaches our courses and Master Classes. You reach out to industry leaders and create the invitation they say yes to. You bring your judgment to a planned course outline: what's missing, what doesn't belong, and whether the structure is solid. You plan and shoot courses with our Education Designers.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;We’re a flexible team, and you’ll be able to do what you excel in. Everyone on our team creates courses, and everyone works across these roles. If you're torn between two roles, apply for the one you'd be best at, and tell us in your application which other one you considered and why.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;You, the Course Writer and Editor&lt;/strong&gt;, own how our courses and Master Classes read: the scripts, hooks, headings, on-screen text in videos, quiz wording, and editorial voice across everything we publish. Our&amp;nbsp;&lt;strong&gt;Education Designers&lt;/strong&gt;&amp;nbsp;hand you the structure and the exercises, and they'll often hand you draft headings and hooks along with them. The final wording is yours. You'll work closely with our&amp;nbsp;&lt;strong&gt;Co-Founder, your Team Lead, the Education Designers, and the Course Directors&lt;/strong&gt;, and you'll have a real say in what we make. You'll also work closely with the video team and our growth team.&lt;/p&gt; &lt;h2&gt;Your Role at IxDF&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Be a core part of our Editorial Team.&amp;nbsp;&lt;/strong&gt;You'll collaborate with IxDF editors, video editors, and UX and UI designers as well as external industry leaders to&amp;nbsp;&lt;strong&gt;create educational content for people worldwide&lt;/strong&gt;. You'll help them succeed in the age of AI with skills in&amp;nbsp;&lt;strong&gt;timeless, human-centered design and AI&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Make an impact as you decide how every course sounds.&amp;nbsp;&lt;/strong&gt;The title people want to click, the first paragraph that hooks them, the on-screen words that make our learners remember and apply what our experts teach. Our Education Designers create the structure and draft the headings, hooks, and quizzes. You finalize the scripts, hooks, headings, quiz wording, and editorial voice across everything we publish, and you give proactive feedback on the structure.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;You don't need a design background.&lt;/strong&gt;&amp;nbsp;Most of our writers and editors start without one, and that can be an advantage because you're coming to design the way many of our learners do. In your first year you'll learn it from the inside, working through it sentence by sentence with the people who teach it, until you know what a course participant needs.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Write for a diverse, global audience.&lt;/strong&gt;&amp;nbsp;Some of our courses and Master Classes serve experienced designers who want to grow into more senior work. Others serve people moving into design from other fields, and many are not reading in their first language. Often, you'll write for all of them at the same time. Getting that balance right without watering anything down is a rewarding editorial challenge.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Be the voice of IxDF.&amp;nbsp;&lt;/strong&gt;Our reputation lives in every sentence we publish, and many of those sentences will be yours.&amp;nbsp;&lt;strong&gt;Represent a global movement dedicated to design education&lt;/strong&gt;, and take pride in it. It's a big responsibility, and a rewarding one.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Set and raise the standard for our assessments&lt;/strong&gt;, so a correct answer proves understanding, not just recognition, and a good question teaches as well as tests. Our Education Designers decide what a question has to test. You write the wording that does both.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Balance the big picture with the smaller details.&amp;nbsp;&lt;/strong&gt;Expect to focus on one large course creation project per month, alongside small, continuous improvements to what's already published. You'll also write and edit articles, course descriptions, and supporting material, and help our Growth team and our two founders get the voice right in campaigns and social copy.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Turn expert material into lessons.&amp;nbsp;&lt;/strong&gt;Once you've built an understanding of design, you'll take a one-hour Master Class transcript and the learning goals for what the lesson must teach, then turn the strongest sections into a finished lesson. We produce 3 Master Classes per month, so new expert material arrives continuously.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Our courses&amp;nbsp;&lt;strong&gt;combine written and video lessons.&lt;/strong&gt;&amp;nbsp;You'll work closely with the video team, giving&amp;nbsp;&lt;strong&gt;constructive feedback&lt;/strong&gt;&amp;nbsp;on on-screen text, b-roll, graphics, and animation, and telling them which takeaways need a visual, so each video is more engaging to learn from.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Find room for improvement&amp;nbsp;&lt;/strong&gt;by looking at completion rates, learner feedback, and the portfolios learners produce, then go back and fix what isn't excellent yet. Small, incremental edits are why our material surpasses even the very best in industry and academia.&amp;nbsp;&lt;strong&gt;We're always learning, always improving, always raising the bar&lt;/strong&gt;&amp;nbsp;in everything we do.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;We’re committed to&lt;strong&gt; excellence&lt;/strong&gt;, and we seek a like-minded enthusiast to join us. This role is &lt;strong&gt;not for the average&lt;/strong&gt;. Ahead of you is a &lt;strong&gt;highly rewarding and enriching journey&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Maintain and improve our&amp;nbsp;&lt;strong&gt;crystal-clear documentation&lt;/strong&gt;&amp;nbsp;so our knowledge resources stay up-to-date, easy to find, and provide instant value to our internal teams. Clarity is key. Any line of documentation should be self-explanatory.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;You won't do this alone.&amp;nbsp;&lt;/strong&gt;You'll work with our Education Designers, Course Directors, your Team Lead, and our Co-Founder to pressure-test the material: you'll add what's missing, delete what's redundant, and suggest how to improve the structure. You'll be working with people who have anything from 4 to 40 years of design experience, ready to share their knowledge. We'll also help you upskill so you can grow a designer's eye alongside your editor's ear. You'll work in a diverse, highly organized, result-driven environment where you'll develop&amp;nbsp;&lt;strong&gt;personally and professionally.&lt;/strong&gt;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;We're proud to have assembled a&amp;nbsp;&lt;strong&gt;remarkable team of unicorns&lt;/strong&gt;&amp;nbsp;who uplift, motivate, and push each other to excel daily. There's a seat open for someone who shares our passion for excellence. Could that be you?&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Do You Share IxDF's Vision?&lt;/h2&gt; &lt;p&gt;People don't just buy our courses; they invest in a better version of themselves and a career they truly love. That's why every course we create and every sentence we write must do more than just inform. It must reflect the high-quality research and hands-on skills we teach.&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Show the dream outcome&lt;/strong&gt;: Help people imagine a future of creative, meaningful work, fulfillment, and impact through a career in design and AI.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Strengthen belief in success&lt;/strong&gt;: Build confidence through real stories, practical case studies, and hands-on templates.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Overcome barriers&lt;/strong&gt;: Write in a way that's crystal clear, human, and motivating. Connect and lead the way.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;You'll educate, inspire, energize, and support. Whether you write a course article or give editorial feedback on a video, you'll help designers thrive in the age of AI.&lt;/p&gt; &lt;h2&gt;About You&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;You have at least 4 years of professional writing or editing experience.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;What matters far more than the number is the quality of the work you can show us: a course, an article series, a set of scripts, documentation, a newsletter. We’re excited to hear what it was, why you wrote it the way you did, and how long it took you to create.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're a&amp;nbsp;&lt;strong&gt;master communicator&lt;/strong&gt;&amp;nbsp;with a&amp;nbsp;&lt;strong&gt;sharp eye for detail&lt;/strong&gt;&amp;nbsp;and&amp;nbsp;&lt;strong&gt;strong skills in language, tone, and flow&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You can take a complex idea and write it so a beginner gets it on the first read.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You know how to hook someone with a title and a first line, and you know the difference between&amp;nbsp;&lt;strong&gt;a hook that's earned&lt;/strong&gt;&amp;nbsp;and a hook that's cheap.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You&amp;nbsp;&lt;strong&gt;collaborate with AI in everything you do&lt;/strong&gt;. You use AI to write, research, and create faster, and you know how to take&amp;nbsp;&lt;strong&gt;human leadership&lt;/strong&gt;, so&amp;nbsp;&lt;strong&gt;the outcome is 100% yours&amp;nbsp;&lt;/strong&gt;and better than you could have created without AI.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You’re eager to help people build UX and UI skills because you know they’re more relevant than ever in the age of AI.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You can write for a career changer and for an experienced designer without losing either one.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You have an&amp;nbsp;&lt;strong&gt;exceptional talent for creating structure&lt;/strong&gt;, and you take pride in organizing processes and tasks in a way that's efficient and clear.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're genuinely&amp;nbsp;&lt;strong&gt;curious&amp;nbsp;&lt;/strong&gt;about UX and UI design, and you're motivated to learn how great design shapes experiences and solves problems.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're genuinely&amp;nbsp;&lt;strong&gt;curious&lt;/strong&gt;&amp;nbsp;about how AI is changing design work and design education, and you look for new ways to use it in your own work.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're kind, and you have the&amp;nbsp;&lt;strong&gt;social intelligence and empathy&lt;/strong&gt;&amp;nbsp;to engage well with very different kinds of people.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're fluent in written and spoken English, your grammar is exact, and you understand the power of tone, brevity, and microcopy.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You take&amp;nbsp;&lt;strong&gt;full ownership&lt;/strong&gt;&amp;nbsp;of your work and see it through. You move comfortably across ad hoc projects of varying complexity, and you stay consistent when the work turns repetitive.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You’re enthusiastic about learning by doing and are&amp;nbsp;&lt;strong&gt;committed to putting in the effort to continuously improve your skills&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You&amp;nbsp;&lt;strong&gt;spot problems&lt;/strong&gt;&amp;nbsp;before anyone else notices them, and when something goes off track you come back with a solution rather than a report.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You&amp;nbsp;&lt;strong&gt;value teamwork&lt;/strong&gt;, prioritize collaboration, and focus on collective goals and harmony in the workplace.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You work well with great responsibility and freedom inside a well-documented, structured system. Accuracy and attention to detail are key on an online learning platform, where every tag must be correct and every piece of text formatted to our upload system. It's in your nature to meticulously double-check that everything is in order.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're&amp;nbsp;&lt;strong&gt;self-motivated&lt;/strong&gt;, and you love&amp;nbsp;&lt;strong&gt;creative freedom&lt;/strong&gt;,&amp;nbsp;&lt;strong&gt;independent judgment&lt;/strong&gt;, and the&amp;nbsp;&lt;strong&gt;responsibility&lt;/strong&gt;&amp;nbsp;that comes with both.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You’re driven by the desire to&amp;nbsp;&lt;strong&gt;make a positive impact in the world&lt;/strong&gt;&amp;nbsp;and to improve the lives of others.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You're located in a&amp;nbsp;&lt;strong&gt;time zone&lt;/strong&gt;&amp;nbsp;between UTC+0 (London) and UTC+4 (Dubai), which covers Europe, the Middle East, and Africa.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Bonus Points&lt;/h2&gt; &lt;p&gt;None of these are required, but each of them would make us even happier.&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;You've&amp;nbsp;&lt;strong&gt;taught in classrooms or workshops&lt;/strong&gt;, or&amp;nbsp;&lt;strong&gt;you've created educational material&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You have your&amp;nbsp;&lt;strong&gt;own blog or social media page&lt;/strong&gt;&amp;nbsp;where you create and share original content.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You’ve&amp;nbsp;&lt;strong&gt;collaborated with video production teams&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You've written&lt;strong&gt;&amp;nbsp;quiz or assessment questions.&lt;/strong&gt;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You've worked with an&amp;nbsp;&lt;strong&gt;LMS or an online learning platform&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You hold a&amp;nbsp;&lt;strong&gt;bachelor's or master's&lt;/strong&gt;&amp;nbsp;degree in communications, journalism, literature, or a similar field.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;What We Can Offer&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;A highly valued role:&lt;/strong&gt;&amp;nbsp;You'll shape our core product, our courses and Master Classes.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Reach and impact&lt;/strong&gt;&amp;nbsp;that are difficult to find anywhere else in this field. Your words will be read year after year, by hundreds of thousands of people who build better careers and design a better world for all of us.&amp;nbsp;&lt;strong&gt;An education you can't buy:&amp;nbsp;&lt;/strong&gt;free access to every IxDF course and Master Class, and a job that requires you to study the work of the best designers alive in order to edit it. Most people pay for this. You'll be paid for it.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Access:&amp;nbsp;&lt;/strong&gt;the designers whose books you'd normally buy are the people whose words you'll be shaping, and in some cases the people you'll be in a studio with.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Studio shoots:&lt;/strong&gt;&amp;nbsp;once you know our courses well, usually after your first year, you'll be a real asset on a studio production, and you'll be welcome to join us when we meet our experts in professional studios around the world. Some of us love that part and go every time; others keep travel to a minimum. Both work for us. On average we shoot 4-6 new courses per year.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Autonomy:&amp;nbsp;&lt;/strong&gt;Nobody will ever hand you a template and tell you to fill it in. You decide how our courses read.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;A global, purpose-driven team: Work remotely&amp;nbsp;&lt;/strong&gt;alongside passionate professionals from all over the world, united by a&amp;nbsp;&lt;strong&gt;common mission&lt;/strong&gt;&amp;nbsp;to create the best possible design and AI education in the world and make it accessible for everyone.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Our co-founder and co-CEO, Rikke, will work closely with you&lt;/strong&gt;. She and our other co-founder, Mads, built IxDF from nothing, with no investment capital, so we would stay free to make world-class design education affordable to everyone. She was the sole editor and video editor for many of our early years, so she's shaped our course planning, expert interviews, video shoots, and content editing from the inside. She's still hands-on in everything we do, and she still films educational videos herself, in places like the US, the North Pole, and Nepal.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A&amp;nbsp;&lt;strong&gt;full-time position&lt;/strong&gt;&amp;nbsp;within a fully remote organization. Video-based collaboration with your colleagues from elsewhere on the planet, and we get together in person each year, on a team trip or a studio production.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Bi-weekly&amp;nbsp;&lt;strong&gt;knowledge-sharing sessions&lt;/strong&gt;&amp;nbsp;and 4 meeting-free days weekly for focused work.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A work culture with no&amp;nbsp;&lt;strong&gt;fluffy titles, political agendas, or&lt;/strong&gt;&amp;nbsp;&lt;strong&gt;corporate drama&lt;/strong&gt;. Your colleagues value&amp;nbsp;&lt;strong&gt;your warm character, your strong work ethic, and the results you deliver&lt;/strong&gt;. If you embody old-school virtues of always striving to deliver results, learn and become better every day, you'll thrive at IxDF.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A daily mission to help impact,&amp;nbsp;&lt;strong&gt;empower, and enrich the lives of millions of people&lt;/strong&gt;&amp;nbsp;by creating&amp;nbsp;&lt;strong&gt;affordable high-end design education&lt;/strong&gt;&amp;nbsp;for everyone across the planet. It'll be yours too.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A company&amp;nbsp;&lt;strong&gt;where the distance between idea and execution is minimal.&lt;/strong&gt;&amp;nbsp;We're a highly agile organization with&amp;nbsp;&lt;strong&gt;zero bureaucracy or corporate politics&lt;/strong&gt;&amp;nbsp;– and with&amp;nbsp;&lt;strong&gt;exceptional order and efficiency&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A company culture where&lt;strong&gt;&amp;nbsp;passion meets high performance and excellence&lt;/strong&gt;. To help us improve the world, and yourself in the process,&amp;nbsp;&lt;strong&gt;you'll need grit, strong work ethic, long-term thinking, and self-discipline&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;We thrive because we have a&amp;nbsp;&lt;strong&gt;hands-on attitude and a bias towards action&lt;/strong&gt;&amp;nbsp;as opposed to fluff-filled, unrealistic strategies. You'll need&amp;nbsp;&lt;strong&gt;crisp execution skills yourself&lt;/strong&gt;&amp;nbsp;and the ability to&amp;nbsp;&lt;strong&gt;impress your colleagues with concrete results&lt;/strong&gt;, just like they'll impress you.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;If you want even more opportunities to show the world what you can do, you’re in luck! When you're willing to do the hard work of learning and growing, then you’ll find virtually&amp;nbsp;&lt;strong&gt;limitless opportunities with us.&lt;/strong&gt;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;We built online design education before people believed in it. AI is now changing what designers do, and they carry a bigger responsibility than ever. You'll be at the&amp;nbsp;&lt;strong&gt;forefront of teaching designers to work with AI and to design responsibly for it&lt;/strong&gt;. You'll help&amp;nbsp;&lt;strong&gt;set a direction&lt;/strong&gt; that shapes both the designers we teach and the people who use what they build. Together, we'll design a better world.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;div class=\"OutlineElement Ltr SCXW248147200 BCX0\"&gt; &lt;h2 class=\"Paragraph SCXW248147200 BCX0\"&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;How to Learn More and Apply&amp;nbsp;&lt;/span&gt;&lt;span class=\"EOP Selected SCXW248147200 BCX0\"&gt;&amp;nbsp;&lt;/span&gt;&lt;/h2&gt; &lt;/div&gt; &lt;div class=\"OutlineElement Ltr SCXW248147200 BCX0\"&gt; &lt;p class=\"Paragraph SCXW248147200 BCX0\"&gt;&lt;span class=\"TextRun SCXW248147200 BCX0\" lang=\"EN-GB\" xml:lang=\"EN-GB\"&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;To&amp;nbsp;&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;submit&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;&amp;nbsp;your application as well as learn more about our Work Culture and Values, please visit https://ixdf.org/about/careers&lt;/span&gt;&lt;/span&gt;&lt;span class=\"EOP Selected SCXW248147200 BCX0\"&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;/div&gt; &lt;div class=\"OutlineElement Ltr SCXW248147200 BCX0\"&gt; &lt;p class=\"Paragraph SCXW248147200 BCX0\"&gt;&lt;span class=\"TextRun SCXW248147200 BCX0\" lang=\"EN-GB\" xml:lang=\"EN-GB\"&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;Please apply as soon as you can.&amp;nbsp;&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;We’re&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;&amp;nbsp;firm believers in “the sooner, the better” and we&amp;nbsp;&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;look&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW248147200 BCX0\"&gt;&amp;nbsp;forward to working with you!&lt;/span&gt;&lt;/span&gt;&lt;span class=\"EOP Selected SCXW248147200 BCX0\"&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/ixdf-interaction-design-foundation-course-writer-and-editor-ux-ui-and-ai\"&gt;https://weworkremotely.com/remote-jobs/ixdf-interaction-design-foundation-course-writer-and-editor-ux-ui-and-ai&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 26 Aug 2026 11:42:10 +0000</pubDate> <expires_at>Fri, 25 Sep 2026 11:42:10 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/ixdf-interaction-design-foundation-course-writer-and-editor-ux-ui-and-ai</guid> <link>https://weworkremotely.com/remote-jobs/ixdf-interaction-design-foundation-course-writer-and-editor-ux-ui-and-ai</link> </item> <item> <title>Keeper Security: Associate Account Manager, SLED</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>DevOps and Sysadmin</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote, US &lt;/p&gt; &lt;p&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Keeper is hiring a driven SLED (state, local, and higher education) focused Associate Account Manager to join a high producing team within our B2B sales division. This is a 100% remote position from select locations, with an opportunity to work a hybrid schedule for candidates who live near our global headquarters in Chicago.&lt;/p&gt; &lt;p&gt;Keeper’s cybersecurity software is trusted by millions of people and thousands of organizations, globally. Keeper is published in 23 languages and is sold in over 150 countries. Join one of the fastest-growing cybersecurity companies and gain valuable skills while expanding and developing client relationships in this pivotal role!&lt;/p&gt; &lt;p&gt;&lt;strong&gt;About Keeper Security&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Keeper Security is a leading cybersecurity software company that protects thousands of organizations and millions of people in more than 150 countries. Keeper delivers a powerful zero-trust and zero-knowledge solution built to meet the stringent requirements of state, local and educational (SLED) IT environments. Its flagship offering, KeeperPAM®, is an AI-enabled, cloud-native platform that protects users, devices and critical infrastructure from cyber attacks. Recognized in the Gartner® Magic QuadrantTM for Privileged Access Management (PAM), Keeper combines robust compliance with unmatched visibility and control. With industry-leading certifications, including GovRAMP Authorization, Keeper provides the security assurance public sector organizations require. Learn why agencies trust Keeper to defend against today’s sophisticated adversaries at &lt;a href=\"http://keepersecurity.com\"&gt;KeeperSecurity.com&lt;/a&gt;.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;About the Role&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Join an elite group of proven performers and highly successful Associate Account Manager professionals. Our team is full of seasoned technologists, with experience selling into SME and Enterprise level accounts. They have a passion for helping companies get the most out of their technology investments and are skilled at identifying new business opportunities and expansion opportunities within named accounts. As a SLED focused Associate Account Manager, you will work with an established client base within the public sector, concentrating on state, local, and higher education and be responsible for growing revenue through these accounts using our industry-leading solutions.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Responsibilities&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Thrive in a supportive but independent workplace with the opportunity to grow as our organization grows&lt;/li&gt; &lt;li&gt;Carry a revenue quota to meet or exceed sales targets within assigned accounts&lt;/li&gt; &lt;li&gt;Provide strong interactions with customers at the Senior Management level with support on forming relationships with C level contacts&lt;/li&gt; &lt;li&gt;Work with clients to negotiate contract renewals, cross-sells and upsells&lt;/li&gt; &lt;li&gt;Work with clients to establish business and technical goals &amp;amp; potential via technical and Quarterly Business Reviews&lt;/li&gt; &lt;li&gt;Navigate SLED-specific procurement processes, including RFP/RFI responses, contract vehicles, cooperative purchasing agreements, and compliance requirements (e.g., FedRAMP, StateRAMP, CJIS, etc.)&lt;/li&gt; &lt;li&gt;Build and manage relationships with key public sector stakeholders, including government agencies, educational institutions, and internal champions, aligning Keeper solutions with mission-driven objectives and budget cycles&lt;/li&gt; &lt;li&gt;Understand public sector funding models and budget timelines to effectively position renewals, expansions, and multi-year agreements&lt;/li&gt; &lt;li&gt;Maintain a structured cadence with named customer accounts, build relationships, present Keeper solutions, troubleshoot challenges, manage issues with the broader Keeper team and close deals&lt;/li&gt; &lt;li&gt;Advise customers on best practices for securing and protecting their business against password related breaches&lt;/li&gt; &lt;li&gt;Proactively manage the success of a portfolio of assigned Keeper Security customers to deliver consistent value across the entire lifecycle&lt;/li&gt; &lt;li&gt;Consistently demonstrate knowledge of Account Management best practices, stay up to date on trends in the industry, and operate as an Account Manager and Cybersecurity advisor to your customers&lt;/li&gt; &lt;li&gt;Understand and navigate account procurement practices to negotiate licensing contracts&lt;/li&gt; &lt;li&gt;Resolve customer issues, alone and through collaboration with other Keeper Security teams; approach all situations with curiosity and creativity. Resolving customer issues can involve troubleshooting and require deep technical knowledge of our solutions and the Password management space&lt;/li&gt; &lt;li&gt;Build strong customer relationships by maintaining high levels of engagement, adoption, and communication; conduct quarterly business reviews to ensure our clients are up to speed on their areas of vulnerability, new product features etc.&lt;/li&gt; &lt;li&gt;Become a Keeper Security product expert for your customers; occasionally assist on Sales or Marketing calls/webinars as an Account Manager &amp;amp; Keeper expert&lt;/li&gt; &lt;li&gt;Drive customer advocacy in the form of references, referrals, and case studies&lt;/li&gt; &lt;li&gt;Perform data-driven reviews and analysis on customer portfolio to prioritize opportunity and risk; reliably renew and expand customer contracts, meet and exceed personal and team quotas&lt;/li&gt; &lt;li&gt;Participate in the evolution of Keeper Security’s own Account Management programs and processes; insist on excellence in our own AM initiatives&lt;/li&gt; &lt;li&gt;Contribute towards the development of a strong team environment by upholding high work standards&lt;/li&gt; &lt;li&gt;Jump at opportunities to go the extra mile to ensure our customers are supported and successful!&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Requirements&lt;/strong&gt;&amp;nbsp;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;2+ years of experience within software or tech sales (with a focus on upselling and expansion)&lt;/li&gt; &lt;li&gt;1+ years of SLED or government sales experience within software or tech sales&lt;/li&gt; &lt;li&gt;Strong technical knowledge as it pertains to software integrations (SSO, Directory etc), implementation, onboarding &amp;amp; support&lt;/li&gt; &lt;li&gt;Experience working in IAM or cybersecurity industry&lt;/li&gt; &lt;li&gt;Motivated by solving problems for customers; demonstrated ability to anticipate challenges before they arise&lt;/li&gt; &lt;li&gt;Experience working with and selling to Enterprise organizations, IT and Cyber Security Executives&lt;/li&gt; &lt;li&gt;Unrivaled sense of autonomy, ownership, and dedication to helping customers realize their intended value&lt;/li&gt; &lt;li&gt;Energetic and self-motivated; a team player who is also a proactive and creative problem solver&lt;/li&gt; &lt;li&gt;Aptitude for learning software; strong with business applications&lt;/li&gt; &lt;li&gt;Ability to manage multiple priorities while maintaining strict attention to details. Strong communication and interpersonal skills, both written and verbal; consistent diplomacy, tact, and poise when working through customer issues and escalations&lt;/li&gt; &lt;li&gt;Working knowledge of Salesforce.com&lt;/li&gt; &lt;li&gt;Undergraduate degree preferred (BA/BS)&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Benefits&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Medical, Dental &amp;amp; Vision (Inclusive of domestic partnerships)&lt;/li&gt; &lt;li&gt;Employer Paid Life Insurance &amp;amp; Employee/Spouse/Child Supplemental life&lt;/li&gt; &lt;li&gt;Voluntary Short/Long Term Disability Insurance&lt;/li&gt; &lt;li&gt;401k (Roth/Traditional)&lt;/li&gt; &lt;li&gt;A generous PTO plan that celebrates your commitment and seniority (including paid Bereavement/Jury Duty, etc)&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Keeper Security, Inc. is an equal opportunity employer and participant in the U.S. Federal&lt;/p&gt; &lt;p&gt;E-Verify program. We celebrate diversity and are committed to creating an inclusive environment for all employees.&lt;/p&gt; &lt;p&gt;Classification: Non-Exempt&lt;/p&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Keeper Candidate Privacy Notice&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;This notice explains how Keeper Security processes your personal data during recruitment. Depending on the role and location, the Controller of personal data (the organization responsible for determining why and how personal data is processed) will be Keeper Security Inc. (US), Keeper Security EMEA Ltd. (Ireland), or Keeper Security APAC K.K (Japan).&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; 1. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Data We Collect&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Information You provide:&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Contact details, CV/resume, cover letter&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Employment history, qualifications, work eligibility&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Application responses and uploaded documents&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Information We generate:&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Interview notes, assessments, communications&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Scheduling information&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Information From Others:&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Recruiter/referral information who submit your profile&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;References (with your consent, before final offer)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Public professional profiles&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Background verification (post offer)&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; Voluntary Diversity and Equal Opportunity Information&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;We may ask you to voluntarily provide diversity information including race/ethnicity, gender, disability status and veteran status (US). Providing this information is optional and Keeper collects this data in order to comply with EEOC and similar requirements&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; 2. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;How We Use Your Data&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Assess your application and suitability&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Manage interviews and recruitment workflow&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Consider you for other/future roles (we may seek your consent to keep your information on our systems beyond the retention period specified)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Comply with employment law obligations&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; 3. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Legal Basis&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Legitimate Interests (recruitment management, security and integrity of the hiring process)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Contracting steps (for progressed candidates)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Legal and regulatory compliance obligations; explicit consent where required&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; 4. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Who We Share Information With&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Internal: &lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;HR, hiring managers, interviewers*, IT support for system administration&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;*Note - diversity and equal opportunity data is not shared with hiring managers.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Third Parties:&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Service providers who assist with:&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Applicant tracking, recruitment systems and assessment providers&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Background verification vendors (post offer)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Recruitment agencies (where applicable)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Tools to support communication, collaboration and to securely store your data&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Keeper ensures that all our third parties are contractually bound to protect your personal data with adequate safeguards in place.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; 5. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;International Transfers&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Your data may be accessed by Keeper entities globally as needed for the purposes of hiring and decision making. We protect any such data transfer between Keeper entities using appropriate safeguards under applicable data protection laws. &lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;6. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Security&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;We implement appropriate technical and organizational measures to protect your data, consistent with our industry leading security standards.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;7. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Retention&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;We keep your data for 24 months from your last application activity, then delete or anonymize it. &lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Exceptions:&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;You opt into our talent database for further retention by providing consent (extended retention)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;You're hired (transfers to employee records)&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; 8. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Your Rights&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;You have the following rights and can contact us at the email below to exercise them:&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Access, correct, or delete your data, subject to applicable law and retention requirements&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Object to or restrict processing&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Withdraw consent (where applicable)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Request data portability&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Lodge a complaint with your data protection authority&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;If you become an employee, your rights regarding your employee record are governed by our internal Employee Privacy Notice and certain data will be retained as required under relevant laws such as employment or tax law.&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;When you request access to your personal data, some information may be redacted if it includes the personal data of other individuals or information that we must protect in order to preserve their privacy rights.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; 9. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Automated Decisions&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Keeper does not make hiring decisions using solely automated processing.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;10. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Contact&lt;/span&gt;&lt;/strong&gt;&lt;span class=\"cf1\"&gt; - Candidates can send privacy questions to: privacy@keepersecurity.com&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/keeper-security-associate-account-manager-sled\"&gt;https://weworkremotely.com/remote-jobs/keeper-security-associate-account-manager-sled&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 26 Aug 2026 07:30:47 +0000</pubDate> <expires_at>Fri, 25 Sep 2026 07:30:47 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/keeper-security-associate-account-manager-sled</guid> <link>https://weworkremotely.com/remote-jobs/keeper-security-associate-account-manager-sled</link> </item> <item> <title>Keeper Security: Associate Account Manager</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>DevOps and Sysadmin</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote, US &lt;/p&gt; &lt;p&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Keeper is hiring a driven Associate Account Manager to join a high producing team within our B2B sales division. This is a 100% remote position from select locations with an opportunity to work a hybrid schedule for candidates who live near our global headquarters in Chicago.&lt;/p&gt; &lt;p&gt;Keeper’s cybersecurity software is trusted by millions of people and thousands of organizations, globally. Keeper is published in 23 languages and is sold in over 150 countries. Join one of the fastest-growing cybersecurity companies and gain valuable skills while expanding and developing client relationships in this pivotal role!&lt;/p&gt; &lt;p&gt;&lt;strong&gt;About Keeper Security&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Keeper Security is transforming cybersecurity for people and organizations globally. Keeper’s intuitive solutions are built with end-to-end encryption to protect every user, on every device, in every location. Our zero-trust privileged access management platform deploys in minutes and seamlessly integrates with any tech stack to prevent breaches, reduce help desk costs and ensure compliance. Trusted by millions of individuals and thousands of organizations, Keeper is the leader for password, passkey and secrets management, privileged access, secure remote access and encrypted messaging. Learn how our zero-trust and zero-knowledge solutions defend against cyber threats at &lt;a href=\"http://keepersecurity.com\"&gt;KeeperSecurity.com&lt;/a&gt;.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;About the Role&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Join an elite group of proven performers and highly successful Associate Account Manager professionals. Our team is full of seasoned technologists, with experience selling into SME and Enterprise level accounts. They have a passion for helping companies get the most out of their technology investments and are skilled at identifying new business opportunities and expansion opportunities within named accounts. As an Associate Account Manager, you will work with an established client base and be responsible for growing revenue through these accounts using our industry-leading solutions.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Responsibilities&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Thrive in a supportive but independent workplace with the opportunity to grow as our organization grows&lt;/li&gt; &lt;li&gt;Carry a revenue quota to meet or exceed sales targets within assigned accounts&lt;/li&gt; &lt;li&gt;Provide strong interactions with customers at the Senior Management level with support on forming relationships with C level contacts&lt;/li&gt; &lt;li&gt;Work with clients to negotiate contract renewals, cross-sells and upsells&lt;/li&gt; &lt;li&gt;Work with clients to establish business and technical goals &amp;amp; potential via technical and Quarterly Business Reviews&lt;/li&gt; &lt;li&gt;Maintain a structured cadence with named customer accounts, build relationships, present Keeper solutions, troubleshoot challenges, manage issues with the broader Keeper team and close deals&lt;/li&gt; &lt;li&gt;Advise customers on best practices for securing and protecting their business against password related breaches&lt;/li&gt; &lt;li&gt;Proactively manage the success of a portfolio of assigned Keeper Security customers to deliver consistent value across the entire lifecycle&lt;/li&gt; &lt;li&gt;Consistently demonstrate knowledge of Account Management best practices, stay up to date on trends in the industry, and operate as an Account Manager and Cyber Security advisor to your customers&lt;/li&gt; &lt;li&gt;Understand and navigate account procurement practices to negotiate licensing contracts&lt;/li&gt; &lt;li&gt;Resolve customer issues, alone and through collaboration with other Keeper Security teams; approach all situations with curiosity and creativity. Resolving customer issues can involve troubleshooting and require deep technical knowledge of our solutions and the Password management space&lt;/li&gt; &lt;li&gt;Build strong customer relationships by maintaining high levels of engagement, adoption, and communication; conduct quarterly business reviews to ensure our clients are up to speed on their areas of vulnerability, new product features etc.&lt;/li&gt; &lt;li&gt;Become a Keeper Security product expert for your customers; occasionally assist on Sales or Marketing calls/webinars as an Account Manager &amp;amp; Keeper expert&lt;/li&gt; &lt;li&gt;Drive customer advocacy in the form of references, referrals, and case studies&lt;/li&gt; &lt;li&gt;Perform data-driven reviews and analysis on customer portfolio to prioritize opportunity and risk; reliably renew and expand customer contracts, meet and exceed personal and team quotas&lt;/li&gt; &lt;li&gt;Participate in the evolution of Keeper Security’s own Account Management programs and processes; insist on excellence in our own AM initiatives&lt;/li&gt; &lt;li&gt;Contribute towards the development of a strong team environment by upholding high work standards&lt;/li&gt; &lt;li&gt;Jump at opportunities to go the extra mile to ensure our customers are supported and successful!&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Requirements&lt;/strong&gt;&amp;nbsp;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;2+ years of experience within software or tech sales (with a focus on upselling and expansion)&lt;/li&gt; &lt;li&gt;Strong technical knowledge as it pertains to software integrations (SSO, Directory etc), implementation, onboarding &amp;amp; support&lt;/li&gt; &lt;li&gt;Motivated by solving problems for customers; demonstrated ability to anticipate challenges before they arise&lt;/li&gt; &lt;li&gt;Experience working with and selling to Enterprise organizations, C-level Executives, IT and Cyber Security Executives&lt;/li&gt; &lt;li&gt;Unrivaled sense of autonomy, ownership, and dedication to helping customers realize their intended value&lt;/li&gt; &lt;li&gt;Energetic and self-motivated; a team player who is also a proactive and creative problem solver&lt;/li&gt; &lt;li&gt;Aptitude for learning software; strong with business applications&lt;/li&gt; &lt;li&gt;Ability to manage multiple priorities while maintaining strict attention to details. Strong communication and interpersonal skills, both written and verbal; consistent diplomacy, tact, and poise when working through customer issues and escalations&lt;/li&gt; &lt;li&gt;Working knowledge of Salesforce.com&lt;/li&gt; &lt;li&gt;Undergraduate degree preferred (BA/BS)&lt;/li&gt; &lt;li&gt;Experience working in IAM industry is a plus&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Benefits&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Medical, Dental &amp;amp; Vision (Inclusive of domestic partnerships)&lt;/li&gt; &lt;li&gt;Employer Paid Life Insurance &amp;amp; Employee/Spouse/Child Supplemental life&lt;/li&gt; &lt;li&gt;Voluntary Short/Long Term Disability Insurance&lt;/li&gt; &lt;li&gt;401k (Roth/Traditional)&lt;/li&gt; &lt;li&gt;A generous PTO plan that celebrates your commitment and seniority (including paid Bereavement/Jury Duty, etc)&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Keeper Security, Inc. is an equal opportunity employer and participant in the U.S. Federal&amp;nbsp;E-Verify program. We celebrate diversity and are committed to creating an inclusive environment for all employees.&lt;/p&gt; &lt;p&gt;Classification: Non-Exempt&lt;/p&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Keeper Candidate Privacy Notice&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;This notice explains how Keeper Security processes your personal data during recruitment. Depending on the role and location, the Controller of personal data (the organization responsible for determining why and how personal data is processed) will be Keeper Security Inc. (US), Keeper Security EMEA Ltd. (Ireland), or Keeper Security APAC K.K (Japan).&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; 1. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Data We Collect&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Information You provide:&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Contact details, CV/resume, cover letter&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Employment history, qualifications, work eligibility&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Application responses and uploaded documents&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Information We generate:&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Interview notes, assessments, communications&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Scheduling information&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Information From Others:&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Recruiter/referral information who submit your profile&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;References (with your consent, before final offer)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Public professional profiles&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Background verification (post offer)&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; Voluntary Diversity and Equal Opportunity Information&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;We may ask you to voluntarily provide diversity information including race/ethnicity, gender, disability status and veteran status (US). Providing this information is optional and Keeper collects this data in order to comply with EEOC and similar requirements&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; 2. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;How We Use Your Data&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Assess your application and suitability&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Manage interviews and recruitment workflow&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Consider you for other/future roles (we may seek your consent to keep your information on our systems beyond the retention period specified)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Comply with employment law obligations&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; 3. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Legal Basis&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Legitimate Interests (recruitment management, security and integrity of the hiring process)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Contracting steps (for progressed candidates)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Legal and regulatory compliance obligations; explicit consent where required&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; 4. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Who We Share Information With&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Internal: &lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;HR, hiring managers, interviewers*, IT support for system administration&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;*Note - diversity and equal opportunity data is not shared with hiring managers.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Third Parties:&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Service providers who assist with:&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Applicant tracking, recruitment systems and assessment providers&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Background verification vendors (post offer)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Recruitment agencies (where applicable)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Tools to support communication, collaboration and to securely store your data&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Keeper ensures that all our third parties are contractually bound to protect your personal data with adequate safeguards in place.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; 5. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;International Transfers&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Your data may be accessed by Keeper entities globally as needed for the purposes of hiring and decision making. We protect any such data transfer between Keeper entities using appropriate safeguards under applicable data protection laws. &lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;6. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Security&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;We implement appropriate technical and organizational measures to protect your data, consistent with our industry leading security standards.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;7. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Retention&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;We keep your data for 24 months from your last application activity, then delete or anonymize it. &lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Exceptions:&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;You opt into our talent database for further retention by providing consent (extended retention)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;You're hired (transfers to employee records)&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; 8. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Your Rights&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;You have the following rights and can contact us at the email below to exercise them:&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Access, correct, or delete your data, subject to applicable law and retention requirements&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Object to or restrict processing&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Withdraw consent (where applicable)&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Request data portability&lt;/span&gt;&lt;/li&gt; &lt;li class=\"pf1\"&gt;&lt;span class=\"cf1\"&gt;Lodge a complaint with your data protection authority&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;If you become an employee, your rights regarding your employee record are governed by our internal Employee Privacy Notice and certain data will be retained as required under relevant laws such as employment or tax law.&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;When you request access to your personal data, some information may be redacted if it includes the personal data of other individuals or information that we must protect in order to preserve their privacy rights.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt; 9. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Automated Decisions&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;Keeper does not make hiring decisions using solely automated processing.&lt;/span&gt;&lt;/p&gt; &lt;p class=\"pf0\"&gt;&lt;span class=\"cf1\"&gt;10. &lt;/span&gt;&lt;strong&gt;&lt;span class=\"cf0\"&gt;Contact&lt;/span&gt;&lt;/strong&gt;&lt;span class=\"cf1\"&gt; - Candidates can send privacy questions to: privacy@keepersecurity.com&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/keeper-security-associate-account-manager\"&gt;https://weworkremotely.com/remote-jobs/keeper-security-associate-account-manager&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 26 Aug 2026 07:30:39 +0000</pubDate> <expires_at>Fri, 25 Sep 2026 07:30:39 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/keeper-security-associate-account-manager</guid> <link>https://weworkremotely.com/remote-jobs/keeper-security-associate-account-manager</link> </item> <item> <title>OfferUp: Software Development Engineer II Full Stack - Business (Remote @ Colombia)</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Full-Stack Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote @ Colombia &lt;/p&gt; &lt;p&gt;&lt;strong&gt;About the role:&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;The OfferUp Business team owns the platforms that power every business vertical on our marketplace; Storefronts, Auto Dealers, Services, Rentals, and Jobs. Our customers aren't casually browsing; they're running businesses on top of what we build, so every feature we ship has a direct, measurable impact on their livelihood and on OfferUp's revenue. We operate the full stack end-to-end: including microservices that handle some of the highest RPS and TPS in the company, and integrations with partners like Stripe and Shopify. We move fast, instrument everything, and treat experimentation as a first-class part of the workflow. We've barely scratched the surface of what these verticals can become, and the roadmap is wide open for someone who wants to help shape it.&lt;/p&gt; &lt;p&gt;At many organizations, your role begins and ends with the code. On our team, we’re different. You own a feature from concept to fruition. Your responsibilities will include everything from writing well architected and thoroughly tested code, to rolling out the feature by analyzing metrics. You also get to take ownership beyond your technical area by working with cross-functional team members.&lt;/p&gt; &lt;p&gt;As a Full Stack Software Engineer II on the Business team, you'll be a proven contributor who ships features end-to-end across the stack. From the React components our business customers interact with, to the Java services and data pipelines behind them. You'll take real ownership of the work you deliver, raise the quality of the code around you, and grow into a high-performing, reliable contributor on the team.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Here’s more of what you will get to do:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Design, build, and deploy new user experiences and backend services across our five business verticals, using React, TypeScript, GraphQL, Node.js, and Java&lt;/li&gt; &lt;li&gt;Own features end-to-end: plan, design, develop, deploy, measure, and iterate&lt;/li&gt; &lt;li&gt;Break down complex engineering problems into achievable tasks and deliver them within committed timeframes&lt;/li&gt; &lt;li&gt;Work collaboratively with cross-functional teams (Product, Design, Data, Business stakeholders) to design and implement new features&lt;/li&gt; &lt;li&gt;Contribute to A/B tests and use experimentation results to decide what ships&lt;/li&gt; &lt;li&gt;Actively participate in code reviews and enforce good patterns, testing, and edge-case handling&lt;/li&gt; &lt;li&gt;Coach and mentor junior team members, new hires, and interns&lt;/li&gt; &lt;li&gt;Create shared components, utilities, and services that improve team velocity across the stack&lt;/li&gt; &lt;li&gt;Maintain and improve the runbooks, alerting, and monitoring for the features you ship&lt;/li&gt; &lt;li&gt;Participate in a reasonable on-call rotation with the rest of the team&lt;/li&gt; &lt;li&gt;Use AI coding tools (Claude Code, Cursor, Copilot, and similar) to increase your daily development velocity and code quality&lt;/li&gt; &lt;li&gt;Become a subject matter expert in one or more of the team's sub-domains&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;You’ll thrive in this role if you have:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;2+ years of professional software engineering experience&lt;/li&gt; &lt;li&gt;Demonstrated ability to own the delivery of multiple features end-to-end (plan, design, develop, and deploy) with high efficiency, including breaking down engineering problems into achievable tasks&lt;/li&gt; &lt;li&gt;Strong coding skills across the full stack:&lt;/li&gt; &lt;ul&gt; &lt;li&gt;React, TypeScript, HTML, CSS, and modern web tooling; good grasp of responsive design, performance, and cross-browser compatibility&lt;/li&gt; &lt;li&gt;Java and a working understanding of microservices and distributed-systems fundamentals&lt;/li&gt; &lt;/ul&gt; &lt;li&gt;Experience building and integrating with REST or GraphQL APIs&lt;/li&gt; &lt;li&gt;Good knowledge of data structures and object-oriented design&lt;/li&gt; &lt;li&gt;Hands-on experience using AI coding tools (Claude Code, Cursor, Copilot, or similar) in a real engineering workflow, and a point of view on when they help and when they don't&lt;/li&gt; &lt;li&gt;Follows good coding patterns, writes appropriate tests, considers trade-offs, and actively seeks out edge cases&lt;/li&gt; &lt;li&gt;Comfortable giving and receiving feedback in code reviews&lt;/li&gt; &lt;li&gt;A bias toward shipping, learning from production, and iterating quickly&lt;/li&gt; &lt;li&gt;An insatiable desire and ability to learn&lt;/li&gt; &lt;li&gt;BS or MS in Computer Science, or equivalent practical experience&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Helpful, but not required:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Fluency in any other modern OOO programming language&lt;/li&gt; &lt;li&gt;Experience with Agile development&lt;/li&gt; &lt;li&gt;Experience with AWS Cloud infrastructure&lt;/li&gt; &lt;li&gt;Experience around any of the following: web package managers, Bower, bundler system, NodeJS, Python, webpack&lt;/li&gt; &lt;li&gt;Experience with A/B testing platforms (Statsig, LaunchDarkly, Optimizely) and analytics warehouses (BigQuery, Snowflake)&lt;/li&gt; &lt;li&gt;Experience consuming or integrating LLM-based APIs (e.g., Bedrock, Vertex AI, OpenAI)&lt;/li&gt; &lt;li&gt;Familiarity with AWS cloud infrastructure and CI/CD pipelines&lt;/li&gt; &lt;/ul&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&lt;strong&gt;About OfferUp:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;OfferUp is dedicated to creating the simplest and most trusted way for people to buy, sell, and connect in their local communities. One of the top local marketplace apps for local buyers and sellers in the U.S., OfferUp makes it easy for people to discover more of what they need—from great deals and secondhand goods to jobs, services, home rentals, and more—right in their own communities. Our trusted platform empowers millions to connect, thrive, and move life forward.&amp;nbsp;&lt;/p&gt; &lt;p&gt;Available on iOS and Android, OfferUp has consistently ranked among the top shopping apps. Founded in 2011 and based in Bellevue, WA, OfferUp serves local markets nationwide and was used by more than 1 in 6 adults in the U.S. in 2024. OfferUp is backed by leading investors, including Andreessen Horowitz, Warburg Pincus, GGV Capital, T. Rowe Price, and Coatue Management. https://about.offerup.com&lt;/p&gt; &lt;p&gt;&lt;strong&gt;More About OfferUp At a Glance&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Top 10 Shopping app in the App Store and Google Play Store for three years&lt;/li&gt; &lt;li&gt;15%+ of adults in several major markets use OfferUp every month (LA, Miami, Phoenix, Seattle, Las Vegas, Riverside, Orlando)&lt;/li&gt; &lt;li&gt;OfferUp works directly with nearly 2000 US law enforcement agencies to build trust in local communities&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;em&gt;OfferUp is unleashing the power of local, and we’ve built a dynamic team to do it. To learn more about working at OfferUp, check out &lt;/em&gt;&lt;a href=\"https://about.offerup.com/people\"&gt;&lt;em&gt;https://about.offerup.com/people&lt;/em&gt;&lt;/a&gt;&lt;em&gt;&amp;nbsp;&lt;/em&gt;&lt;/p&gt; &lt;p&gt;&lt;em&gt;OfferUp provides equal employment opportunities (EEO) to all employees and applicants for employment without regard to race, color, religion, sex, national origin, age, disability, or genetics. In addition to federal law requirements, OfferUp complies with applicable state and local laws governing nondiscrimination in employment in every location in which the company has facilities. This policy applies to all terms and conditions of employment, including recruiting, hiring, placement, promotion, termination, layoff, transfer, leaves of absence, compensation, and training.&lt;/em&gt;&lt;/p&gt; &lt;p&gt;&lt;em&gt;OfferUp expressly prohibits any form of workplace harassment based on race, color, religion, gender, sexual orientation, gender identity or expression, national origin, age, genetic information, disability, or veteran status. Improper interference with the ability of OfferUp’s employees to perform their job duties may result in discipline up to and including discharge.&lt;/em&gt;&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/offerup-software-development-engineer-ii-full-stack-business-remote-colombia\"&gt;https://weworkremotely.com/remote-jobs/offerup-software-development-engineer-ii-full-stack-business-remote-colombia&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 26 Aug 2026 07:30:39 +0000</pubDate> <expires_at>Fri, 25 Sep 2026 07:30:39 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/offerup-software-development-engineer-ii-full-stack-business-remote-colombia</guid> <link>https://weworkremotely.com/remote-jobs/offerup-software-development-engineer-ii-full-stack-business-remote-colombia</link> </item> <item> <title>Typeform: Director of Accounting &amp; Controlling</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Product</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Ireland (Remote); Netherlands (Remote) ; Portugal (Remote) ; Spain (Remote) ; United Kingdom (Remote) &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;h3&gt;Who we are&lt;/h3&gt; &lt;p&gt;Typeform is a refreshingly different form builder. We help over 150,000 businesses collect the data they need with forms, surveys, and quizzes that people enjoy. Designed to look striking and feel effortless to fill out, Typeform drives 500 million responses every year—and integrates with essential tools like Slack, Zapier, and Hubspot.&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;&lt;strong&gt;About the Team&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;You'll join a small but high-impact Accounting &amp;amp; Controlling team at a pivotal moment in Typeform's journey.&lt;/p&gt; &lt;p&gt;As we've grown into a global SaaS business, our finance function is evolving to support greater scale, complexity, and ambition. We're investing in stronger financial controls, more sophisticated accounting operations, and systems that will enable our next stage of growth.&lt;/p&gt; &lt;p&gt;You'll partner closely with the VP of Accounting &amp;amp; Controlling, serving as their strategic deputy and helping lead both the day-to-day function and the longer-term evolution of our accounting organization. Together, you'll build a world-class finance operation that is scalable, resilient, and ready for what's next.&lt;br&gt;&lt;br&gt;&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;About the Role&lt;/strong&gt;&lt;/h3&gt; &lt;p class=\"PDq2pG_selectionAnchorContainer\"&gt;As Director of Accounting &amp;amp; Controlling, you'll lead the operational accounting function while helping shape the future of finance at Typeform.&lt;/p&gt; &lt;p&gt;Reporting to the VP of Accounting &amp;amp; Controlling, you'll own the integrity of our global accounting operations, oversee a growing team, and drive initiatives that strengthen financial controls, improve efficiency, and support international growth. You'll combine technical accounting expertise with strong leadership and operational excellence, ensuring the business continues to scale on solid financial foundations.&lt;/p&gt; &lt;p&gt;This role is ideal for someone who enjoys balancing strategic thinking with hands-on execution. You'll be a trusted partner to senior leadership, mentor and develop the accounting team, and play a key role in transforming how finance operates across the company.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Things you will do:&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Lead the Accounting &amp;amp; Controlling function, ensuring accurate, timely, and compliant financial operations across multiple entities and jurisdictions&lt;/li&gt; &lt;li&gt;Partner closely with the VP of Accounting &amp;amp; Controlling as a strategic deputy, helping define priorities, lead the team, and drive the finance roadmap&lt;/li&gt; &lt;li&gt;Manage, coach, and develop a high-performing accounting team, fostering a culture of accountability, continuous improvement, and operational excellence&lt;/li&gt; &lt;li&gt;Own the monthly, quarterly, and annual close processes, ensuring high-quality financial reporting and strong balance sheet integrity&lt;/li&gt; &lt;li&gt;Strengthen our internal control environment and ensure compliance with IFRS and regulatory requirements across all operating jurisdictions&lt;/li&gt; &lt;li&gt;Oversee revenue recognition policies and processes across our subscription and usage-based business models&lt;/li&gt; &lt;li&gt;Lead our indirect tax strategy and compliance (VAT/GST, digital services taxes, and related obligations), partnering with external advisors where appropriate&lt;/li&gt; &lt;li&gt;Oversee transfer pricing frameworks, intercompany accounting, and cross-border financial operations&lt;/li&gt; &lt;li&gt;Partner with Legal, FP&amp;amp;A, People, and external advisors to support international expansion, entity creation, and regulatory compliance&lt;/li&gt; &lt;li&gt;Lead external audits and statutory reporting processes, ensuring smooth execution and strong stakeholder relationships&lt;/li&gt; &lt;li&gt;Drive finance transformation initiatives, including process redesign, automation, ERP optimization, and scalability improvements&lt;/li&gt; &lt;li&gt;Build internal accounting capabilities while reducing dependency on external advisors where appropriate&lt;/li&gt; &lt;li&gt;Provide leadership and continuity for the function, acting on behalf of the VP of Accounting &amp;amp; Controlling when required&lt;br&gt;&lt;br&gt;&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;What you already bring to the table:&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Significant experience leading accounting and controlling functions within a high-growth technology or SaaS environment&lt;/li&gt; &lt;li&gt;Experience managing and developing accounting teams in a fast-paced, international business&lt;/li&gt; &lt;li&gt;Strong technical accounting expertise with deep knowledge of IFRS&lt;/li&gt; &lt;li&gt;Proven experience managing multi-entity, multi-jurisdiction accounting environments&lt;/li&gt; &lt;li&gt;Strong understanding of revenue recognition, particularly for subscription and usage-based business models&lt;/li&gt; &lt;li&gt;Experience overseeing indirect tax compliance across multiple jurisdictions&lt;/li&gt; &lt;li&gt;Strong understanding of financial controls, risk management, and audit processes&lt;/li&gt; &lt;li&gt;Experience partnering with executive stakeholders and influencing cross-functional decisions&lt;/li&gt; &lt;li&gt;A pragmatic, hands-on leadership style with a willingness to dive into the details when needed&lt;/li&gt; &lt;li&gt;Excellent communication skills and the ability to build trusted relationships across the business&lt;/li&gt; &lt;li&gt;A continuous improvement mindset with experience driving operational excellence and finance transformation&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;Extra awesome:&lt;br&gt;&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Experience leading accounting in a global B2B SaaS company&lt;/li&gt; &lt;li&gt;Experience with international expansion, entity setup, and cross-border compliance&lt;/li&gt; &lt;li&gt;Strong knowledge of transfer pricing and international tax structures&lt;/li&gt; &lt;li&gt;Big 4 background or equivalent public accounting experience&lt;/li&gt; &lt;li&gt;Experience implementing or optimizing ERP systems (NetSuite preferred)&lt;/li&gt; &lt;li&gt;Track record of leading finance transformation, automation, or systems implementation projects&lt;/li&gt; &lt;li&gt;Experience preparing an organization for rapid international growth, acquisitions, or IPO readiness&lt;br&gt;&lt;br&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;*Typeform drives hundreds of millions of interactions each year, enabling conversational, human-centered experiences across the globe. We &lt;strong&gt;move as one team&lt;/strong&gt;, empowering our collective efforts by valuing each individual’s unique perspective. This fosters &lt;strong&gt;strong bonds&lt;/strong&gt; grounded in respect, transparency, and trust. We &lt;strong&gt;champion our diverse customer base&lt;/strong&gt; by anticipating their needs and addressing their challenges with priority. Committed to excellence, we&lt;strong&gt; hold high expectations &lt;/strong&gt;for ourselves and each other, continuously striving to deliver exceptional results.&lt;/p&gt; &lt;p&gt;We are proud to be an equal-opportunity employer. We celebrate diversity and stand firmly against discrimination and harassment of any kind—whether based on race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, gender identity or expression, or veteran status. Everyone is welcome here.&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/typeform-director-of-accounting-controlling\"&gt;https://weworkremotely.com/remote-jobs/typeform-director-of-accounting-controlling&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 26 Aug 2026 07:30:39 +0000</pubDate> <expires_at>Fri, 25 Sep 2026 07:30:39 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/typeform-director-of-accounting-controlling</guid> <link>https://weworkremotely.com/remote-jobs/typeform-director-of-accounting-controlling</link> </item> <item> <title>OfferUp: Senior Cloud Engineer (Hybrid @ Bellevue, WA or Remote @ Florida)</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Full-Stack Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Bellevue, WA or Remote Florida &lt;/p&gt; &lt;p&gt;&lt;strong&gt;Team Charter:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;The Cloud Engineering team is dedicated to maintaining and evolving cloud infrastructure, CI/CD pipelines, Application Security, Change Management, and Backend application golden templates. We are the backbone of the technical organization, ensuring the foundation of our services is robust, secure, and efficient.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;About the role:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;We are looking for a &lt;strong&gt;Senior Cloud Engineer&lt;/strong&gt; to join our &lt;strong&gt;Cloud Engineering&lt;/strong&gt; team. This team is tasked with &lt;strong&gt;ensuring scalability, reliability, and security for all backend services&lt;/strong&gt; and keeping the SDLC running smoothly for engineers across the company.&lt;/p&gt; &lt;p&gt;As a senior member of the team, you will own meaningful pieces of our cloud platform end-to-end — from design through deployment and operation — while helping shape the standards, tooling, and golden templates that the rest of the engineering organization builds on. You will balance deep, hands-on technical ownership with mentoring teammates and influencing the technical direction of the systems that power a large-scale mobile marketplace.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What we love about this role:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Scale &amp;amp; Impact: You will work on systems that drive the end-user experience and support every technical team across the organization, operating across a multi-account AWS and GCP footprint.&lt;/li&gt; &lt;li&gt;Ownership: You will own critical infrastructure and platform capabilities end-to-end, making architectural decisions that affect reliability, security, and cost at scale.&lt;/li&gt; &lt;li&gt;Force Multiplier: The templates, pipelines, and tooling you build raise the productivity and safety of every engineer at OfferUp.&lt;/li&gt; &lt;li&gt;Emerging Technology: You will help bring new capabilities — including AI/ML developer tooling and infrastructure — into the hands of our engineers.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;In this role, you will&lt;/strong&gt; design, build, and operate the cloud infrastructure, platform tooling, and CI/CD systems that underpin OfferUp's core applications. Day to day, that means you will:&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Build cloud infrastructure as code&lt;/strong&gt; — design, implement, and maintain AWS and GCP infrastructure with Terraform, optimizing for reliability, security, and cost.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Own our Kubernetes &amp;amp; GitOps platform&lt;/strong&gt; — run and evolve EKS/GKE (cluster upgrades, Envoy/Gloo networking, Helm, ArgoCD delivery).&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Keep the SDLC fast and safe&lt;/strong&gt; — build CI/CD pipelines and developer workflows (GitHub Actions, monorepo tooling, JFrog Artifactory), and maintain the backend “golden templates” and shared libraries the wider org builds on.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Lead platform migrations end-to-end&lt;/strong&gt; — plan, execute, and de-risk observability, data-store, Kubernetes, and multi-account migrations, including rollback strategy.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Drive operational excellence &amp;amp; security&lt;/strong&gt; — own observability in Datadog and on-call, remediate CVEs, manage secrets and access controls (Cloudflare/ZTNA, Okta, SSO, Workload Identity Federation), and optimize cloud cost.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Multiply the team&lt;/strong&gt; — enable AI/ML developer tooling (Amazon Bedrock, Claude, AI-assisted workflows), lead design and code reviews, set technical standards, mentor engineers, and partner with other teams.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;You'll thrive in this role if you have:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Experience &amp;amp; Education:&lt;/strong&gt; 5–8 years in cloud engineering, infrastructure, platform, DevOps, or SRE roles; Bachelor's in Computer Science or a related field, or equivalent practical experience.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Cloud &amp;amp; Infrastructure as Code:&lt;/strong&gt; Deep, hands-on AWS (ideally GCP) — EKS/GKE, Lambda, networking, IAM, S3, Kinesis, OpenSearch, Route53 — managed declaratively with Terraform at scale.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Containers &amp;amp; Delivery:&lt;/strong&gt; Solid experience with Kubernetes (EKS/GKE), Helm, GitOps (ArgoCD), and CI/CD pipelines (GitHub Actions or similar) in a monorepo or multi-service environment.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Observability &amp;amp; Operations:&lt;/strong&gt; Modern observability tooling (Datadog or similar) for metrics, logs, traces, and alerting; supporting production systems, on-call, and debugging complex distributed systems.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Coding:&lt;/strong&gt; Proficiency in at least one of Java, TypeScript, Python, or Go for automation, tooling, and platform development; comfort with scripting and SQL.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Communication &amp;amp; Leadership:&lt;/strong&gt; Able to communicate technical concepts to technical and non-technical audiences, lead through influence, and mentor other engineers.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Helpful, but not required:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Experience with edge and zero-trust networking (Cloudflare, Envoy/Gloo).&lt;/li&gt; &lt;li&gt;Experience operating data and streaming infrastructure (Kinesis, Flink, Redis/Valkey, Confluent/Kafka).&lt;/li&gt; &lt;li&gt;Experience enabling AI/ML infrastructure or developer tooling (Amazon Bedrock, SageMaker, or LLM-based developer workflows).&lt;/li&gt; &lt;li&gt;Experience with security and compliance practices, change management, and incident management at scale.&lt;/li&gt; &lt;li&gt;Experience with GCP Workload Identity Federation and cross-cloud (AWS↔GCP) integrations.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Compensation Range:&lt;/strong&gt; $215,000 - $240,000&lt;/p&gt; &lt;p&gt;OfferUp offers a comprehensive compensation and benefits package where you’ll be rewarded based on your performance and recognized for the value you bring to the business. Individual salaries within our ranges are determined through a variety of factors, including but not limited to education, experience, knowledge, skills, and geography. All roles will receive equity in OfferUp as part of their compensation, the amount of equity varying depending on the individual’s level and experience.&lt;/p&gt; &lt;p&gt;Benefits (all US roles): In addition to our compensation package, this role is eligible to enroll in health insurance, healthcare savings and spending accounts, retirement savings benefits (401(k) plan with match), basic and voluntary life insurance, disability benefits, and paid time off for sick leave, family and/or medical leave, vacation, and 12 company holidays. In regard to vacation time, OfferUp has a flexible vacation policy, and, in general, full-time, exempt employees will be expected to take 3-5 weeks (15-30 days) of pre-planned vacation time per year. Vacation needs are flexible and will naturally vary from year to year based on individual circumstances and business needs. In regard to sick time, all full-time employees (exempt and non-exempt) will be granted 12 days (96 hours) of sick time per year (pro-rated if the start date is other than January 1). Your recruiter can share more details about specific benefits during the interview process.&lt;/p&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&lt;strong&gt;About OfferUp:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;OfferUp is dedicated to creating the simplest and most trusted way for people to buy, sell, and connect in their local communities. One of the top local marketplace apps for local buyers and sellers in the U.S., OfferUp makes it easy for people to discover more of what they need—from great deals and secondhand goods to jobs, services, home rentals, and more—right in their own communities. Our trusted platform empowers millions to connect, thrive, and move life forward.&amp;nbsp;&lt;/p&gt; &lt;p&gt;Available on iOS and Android, OfferUp has consistently ranked among the top shopping apps. Founded in 2011 and based in Bellevue, WA, OfferUp serves local markets nationwide and was used by more than 1 in 6 adults in the U.S. in 2024. OfferUp is backed by leading investors, including Andreessen Horowitz, Warburg Pincus, GGV Capital, T. Rowe Price, and Coatue Management. https://about.offerup.com&lt;/p&gt; &lt;p&gt;&lt;strong&gt;More About OfferUp At a Glance&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Top 10 Shopping app in the App Store and Google Play Store for three years&lt;/li&gt; &lt;li&gt;15%+ of adults in several major markets use OfferUp every month (LA, Miami, Phoenix, Seattle, Las Vegas, Riverside, Orlando)&lt;/li&gt; &lt;li&gt;OfferUp works directly with nearly 2000 US law enforcement agencies to build trust in local communities&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;em&gt;OfferUp is unleashing the power of local, and we’ve built a dynamic team to do it. To learn more about working at OfferUp, check out &lt;/em&gt;&lt;a href=\"https://about.offerup.com/people\"&gt;&lt;em&gt;https://about.offerup.com/people&lt;/em&gt;&lt;/a&gt;&lt;em&gt;&amp;nbsp;&lt;/em&gt;&lt;/p&gt; &lt;p&gt;&lt;em&gt;OfferUp provides equal employment opportunities (EEO) to all employees and applicants for employment without regard to race, color, religion, sex, national origin, age, disability, or genetics. In addition to federal law requirements, OfferUp complies with applicable state and local laws governing nondiscrimination in employment in every location in which the company has facilities. This policy applies to all terms and conditions of employment, including recruiting, hiring, placement, promotion, termination, layoff, transfer, leaves of absence, compensation, and training.&lt;/em&gt;&lt;/p&gt; &lt;p&gt;&lt;em&gt;OfferUp expressly prohibits any form of workplace harassment based on race, color, religion, gender, sexual orientation, gender identity or expression, national origin, age, genetic information, disability, or veteran status. Improper interference with the ability of OfferUp’s employees to perform their job duties may result in discipline up to and including discharge.&lt;/em&gt;&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/offerup-senior-cloud-engineer-hybrid-bellevue-wa-or-remote-florida\"&gt;https://weworkremotely.com/remote-jobs/offerup-senior-cloud-engineer-hybrid-bellevue-wa-or-remote-florida&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 26 Aug 2026 07:30:35 +0000</pubDate> <expires_at>Fri, 25 Sep 2026 07:30:35 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/offerup-senior-cloud-engineer-hybrid-bellevue-wa-or-remote-florida</guid> <link>https://weworkremotely.com/remote-jobs/offerup-senior-cloud-engineer-hybrid-bellevue-wa-or-remote-florida</link> </item> <item> <title>Customer.io: Mid-Market Account Executive, Americas</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Sales and Marketing</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Americas Remote &lt;/p&gt; &lt;p&gt;Hello, I’m Jacob, Senior Sales Manager at&amp;nbsp;&lt;a href=\"http://customer.io/\"&gt;Customer.io&lt;/a&gt;! We're expanding our sales team in the &lt;strong&gt;United States&lt;/strong&gt; and seeking motivated and successful Account Executives at the Mid-Market level to join us! This role offers a unique opportunity to take your sales career to the next level, with potential for upward mobility.&lt;/p&gt; &lt;p&gt;As an Account Executive, you’ll represent&amp;nbsp;&lt;a href=\"http://customer.io/\"&gt;Customer.io&lt;/a&gt;&amp;nbsp;to prospective customers and drive growth within key market segments. This is a full-cycle sales role (prospect, demo, close), where you'll be fielding both inbound and outbound demand.&lt;/p&gt; &lt;h3&gt;About&amp;nbsp;&lt;a href=\"http://customer.io/\"&gt;Customer.io&lt;/a&gt;&lt;/h3&gt; &lt;p&gt;Over 8,000 companies — from scrappy startups to global brands — use our platform to send billions of emails, push notifications, in-app messages, and SMS every day.&amp;nbsp;&lt;a href=\"http://customer.io/\"&gt;Customer.io&lt;/a&gt;&amp;nbsp;powers automated communication that people actually want to receive. We help teams send smarter, more relevant messages using real-time behavioral data.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Responsibilities&lt;/strong&gt;:&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Pipeline Development and Management&lt;/strong&gt;: Build and manage a pipeline through self-sourced leads and SDR-supported leads to drive new customer acquisition.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Full-Cycle Sales Execution&lt;/strong&gt;: Lead the entire sales process from prospecting and discovery through demo and closing, focusing on new business acquisition within targeted accounts.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Customer Needs Analysis and Solution Alignment&lt;/strong&gt;: Conduct discovery calls to understand customer business challenges and goals. Position&amp;nbsp;&lt;a href=\"http://customer.io/\"&gt;Customer.io&lt;/a&gt;'s solutions to meet these needs effectively.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Collaboration and Cross-Functional Feedback&lt;/strong&gt;: Work closely with the SDR team for lead quality feedback and collaborate with Customer Success and Technical Support for a smooth hand-off post-sale.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Performance Tracking and Reporting&lt;/strong&gt;: Own and report on individual sales metrics, including pipeline status and progress towards targets, to support informed decision-making.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;Qualifications&lt;/strong&gt;:&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Experience:&lt;/strong&gt;&amp;nbsp;2+ years of experience in full-cycle B2B SaaS or MarTech sales, handling mid-market accounts&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Location:&lt;/strong&gt;&amp;nbsp;We are currently hiring for positions based in the UK, Ireland, and the Americas (Canada and the USA). Candidates must be located in one of these regions to be considered for the role.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;B2B SaaS or MarTech Experience&lt;/strong&gt;: Proven success in&amp;nbsp;&lt;strong&gt;new customer acquisition&lt;/strong&gt;&amp;nbsp;and closing deals within the B2B SaaS space, preferably MarTech&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Sales Methodology&lt;/strong&gt;: Familiarity with MEDDPICC or a similar framework that supports consultative selling and discovery to close.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Communication Skills&lt;/strong&gt;: Excellent written and verbal communication skills, with a professional and engaging presence to build rapport with new prospects.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Problem Solving&lt;/strong&gt;: Strong ability to identify customer business needs and position relevant solutions effectively to drive acquisition&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Deal Focus&lt;/strong&gt;: Primarily handles mid-market accounts with shorter sales cycles and lower ACV deals&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Support&lt;/strong&gt;: Works closely with our SDR team for lead generation, with a balance between inbound and self-sourced opportunities&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Responsibilities&lt;/strong&gt;: &lt;ul&gt; &lt;li&gt;Engage in high-volume prospecting, cold and warm outreach&lt;/li&gt; &lt;li&gt;Manage the full sales cycle for deals typically under $50,000 ACV&lt;/li&gt; &lt;li&gt;Drive growth within mid-sized clients, nurturing relationships and uncovering business needs&lt;/li&gt; &lt;/ul&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Compensation &amp;amp; Benefits&lt;/h3&gt; &lt;p&gt;We believe in transparency. We are offering a compensation package of $95,000 base + $95,000 variable for a total $190,000 OTE USD (or equivalent in local currency), subject to market rate adjustment.&lt;/p&gt; &lt;p&gt;We know our people are what make us great, and we’re committed to taking great care of them. Our inclusive benefits package supports your well-being and growth, including&amp;nbsp;&lt;strong&gt;100% coverage of medical, dental, vision, mental health, and supplemental insurance premiums for you and your family&lt;/strong&gt;. We also offer&amp;nbsp;&lt;strong&gt;16 weeks paid parental leave, unlimited PTO&lt;/strong&gt;, stipends for remote work and wellness, a professional development budget, and more.&lt;/p&gt; &lt;p&gt;&lt;a href=\"https://customer.io/careers#:~:text=our%20collective%20success.-,BENEFITS,-Our%C2%A0\"&gt;See full benefits here →&lt;/a&gt;&lt;/p&gt; &lt;h3&gt;Our Process&lt;/h3&gt; &lt;p&gt;No gotchas, no trick questions - just a clear, human process designed to help both of us make an informed decision.&lt;/p&gt; &lt;ol&gt; &lt;li&gt;30-minute video call with a Recruiter&lt;/li&gt; &lt;li&gt;45-minute video call with the Hiring Manager&lt;/li&gt; &lt;li&gt;60-minute Mock Call w/ the Hiring Team&lt;/li&gt; &lt;/ol&gt; &lt;p&gt;All final candidates will be asked to complete a background check and employment verifications as part of our pre-employment process.&lt;/p&gt; &lt;p&gt;&lt;a href=\"http://customer.io/\"&gt;Customer.io&lt;/a&gt;&amp;nbsp;recognizes the stifling impact of systemic injustice on diverse communities. We commit to using our influence to increase inclusion and equity within the tech industry. We strive to build an inclusive team culture, implement bias-free hiring practices, and develop community partnerships to expand our global impact.&lt;/p&gt; &lt;p&gt;Zoom is the only video conference platform that we use, virtual interviews will be conducted using the video capability (i.e., not via the chat), and offers will be extended in writing on official &lt;a href=\"http://Customer.io\"&gt;Customer.io&lt;/a&gt; letterhead. Please be vigilant in all of your job search activity, and if you have any questions please contact&amp;nbsp;&lt;a href=\"mailto:jobs@customer.io\"&gt;jobs@customer.io&lt;/a&gt;.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Join us!&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Check out our&amp;nbsp;&lt;a href=\"https://customer.io/careers/\"&gt;careers page&lt;/a&gt;&amp;nbsp;for more information about why you should&amp;nbsp;&lt;a href=\"https://customer.io/about/\"&gt;come work with us!&lt;/a&gt;&amp;nbsp;We are passionate about our core values of Empathy, Transparency, Responsibility, and Awkwardness and are looking for new coworkers to share and build that passion!&lt;/p&gt; &lt;p&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/customer-io-mid-market-account-executive-americas\"&gt;https://weworkremotely.com/remote-jobs/customer-io-mid-market-account-executive-americas&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Tue, 25 Aug 2026 07:31:11 +0000</pubDate> <expires_at>Thu, 24 Sep 2026 07:31:11 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/customer-io-mid-market-account-executive-americas</guid> <link>https://weworkremotely.com/remote-jobs/customer-io-mid-market-account-executive-americas</link> </item> <item> <title>Otter.ai: Enterprise Account Executive, Expansion</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Sales and Marketing</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote &lt;/p&gt; &lt;div&gt; &lt;div&gt; &lt;h4&gt;The Opportunity&lt;/h4&gt; &lt;/div&gt; &lt;p&gt;This role is focused on expansion within Otter’s top accounts.&lt;/p&gt; &lt;p&gt;You will own growth across a defined set of strategic customers, expanding into new teams, business units, and subsidiaries while introducing new products and use cases. The opportunity is wide. Multiple entry points, multiple personas, and a product that continues to evolve.&lt;/p&gt; &lt;p&gt;This is not an inbound or maintenance role. We are looking for a hunter who can operate inside complex accounts, build multi-threaded relationships, and drive net new revenue within existing customers.&lt;/p&gt; &lt;p&gt;You will act as the quarterback across the account. Partnering closely with CSMs, Solution Engineering, and Marketing to drive a coordinated growth strategy.&lt;/p&gt; &lt;h4&gt;Your impact&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;Own expansion revenue across a portfolio of strategic enterprise accounts&lt;/li&gt; &lt;li&gt;Identify and break into new teams, business units, and subsidiaries&lt;/li&gt; &lt;li&gt;Build and execute account plans with clear growth strategies and priorities&lt;/li&gt; &lt;li&gt;Lead account mapping across personas, functions, and levels&lt;/li&gt; &lt;li&gt;Drive outbound and creative prospecting within existing customers&lt;/li&gt; &lt;li&gt;Introduce new products and use cases aligned to customer needs&lt;/li&gt; &lt;li&gt;Partner closely with CSMs on account health, retention, and expansion timing&lt;/li&gt; &lt;li&gt;Coordinate cross-functional resources to move deals forward&lt;/li&gt; &lt;li&gt;Navigate complex procurement and enterprise sales cycles&lt;/li&gt; &lt;/ul&gt; &lt;h4&gt;We're looking for someone who&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;Proven success in enterprise SaaS sales with a focus on expansion or net new within accounts&lt;/li&gt; &lt;li&gt;Experience selling into complex, multi-threaded organizations&lt;/li&gt; &lt;li&gt;Strong account planning and mapping capabilities&lt;/li&gt; &lt;li&gt;Ability to prospect and generate pipeline within existing accounts&lt;/li&gt; &lt;li&gt;Experience selling upmarket with longer, more strategic sales cycles&lt;/li&gt; &lt;li&gt;Strong business acumen and ability to connect product to outcomes&lt;/li&gt; &lt;li&gt;Highly self-driven with a builder mindset&lt;/li&gt; &lt;li&gt;Comfortable operating cross-functionally and leading without authority&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;p&gt;&lt;strong&gt;About Otter.ai&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;div&gt;We are in the business of shaping the future of work.&amp;nbsp;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;Our mission is to make conversations more valuable.With over 1B meetings transcribed,&amp;nbsp;&lt;a href=\"http://otter.ai/\"&gt;Otter.ai&lt;/a&gt; is the world’s leading tool for meeting transcription, summarization, and collaboration. Using artificial intelligence, Otter generates real-time automated meeting notes, summaries, and other insights from in-person and virtual meetings - turning meetings into accessible, collaborative, and actionable data that can be shared across teams and organizations. The company is backed by early investors in Google, DeepMind, Zoom, and Tesla. &lt;p&gt;Otter.ai is an equal opportunity employer. We proudly celebrate diversity and are committed to building an inclusive and accessible workplace.&amp;nbsp; We provide reasonable accommodations for qualified applicants throughout the hiring process.&amp;nbsp;&amp;nbsp;&lt;/p&gt; &lt;strong&gt;Accessibility &amp;amp; Accommodations&lt;/strong&gt; &lt;p&gt;Otter.ai is committed to providing reasonable accommodations for candidates with disabilities in our hiring process.&amp;nbsp; If you need assistance or an accommodation during any stage of the recruitment process, please contact hr@otter.ai at least 3 business days before your interview.&lt;/p&gt; &lt;p&gt;*Otter.ai does not accept unsolicited resumes from 3rd party recruitment agencies without a written agreement in place for permanent placements. Any resume or other candidate information submitted outside of established candidate submission guidelines (including through our website or via email to any Otter.ai employee) and without a written agreement otherwise will be deemed to be our sole property, and no fee will be paid should we hire the candidate.&lt;/p&gt; &lt;/div&gt; &lt;div&gt;&lt;strong&gt;Salary range&amp;nbsp;&lt;/strong&gt; &lt;p&gt;OTE Range: $220,000 to $270,000 USD per year&lt;span&gt; &lt;em&gt;**potential inclusive of commission**&lt;/em&gt;&lt;/span&gt;&lt;/p&gt; &lt;p&gt;This salary range represents the low and high end of the estimated salary range for this position. The actual base salary offered for the role is dependent on several factors. Our base salary is just one component of a comprehensive total rewards package. &amp;nbsp;&lt;span&gt;&lt;br&gt;&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;#LI-Hybrid&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;#LI-Hybrid&lt;/span&gt;&lt;/p&gt; &lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/otter-ai-enterprise-account-executive-expansion\"&gt;https://weworkremotely.com/remote-jobs/otter-ai-enterprise-account-executive-expansion&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Tue, 25 Aug 2026 07:31:11 +0000</pubDate> <expires_at>Thu, 24 Sep 2026 07:31:11 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/otter-ai-enterprise-account-executive-expansion</guid> <link>https://weworkremotely.com/remote-jobs/otter-ai-enterprise-account-executive-expansion</link> </item> <item> <title>Flexport: Customs Associate</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>All Other Remote</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Canada Remote &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;h2&gt;&lt;strong&gt;About Flexport:&amp;nbsp;&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;At Flexport, we believe global trade can move the human race forward. That’s why it’s our mission to make global commerce so easy there will be more of it. We’re shaping the future of a $10T industry with solutions powered by innovative technology and exceptional people. Today, companies of all sizes—from emerging brands to Fortune 500s—use Flexport technology to move more than $19B of merchandise across 112 countries a year.&amp;nbsp;&lt;/p&gt; &lt;p&gt;The recent global supply chain crisis has put Flexport center stage as we continue to play a pivotal role in how goods move around the world. We are proud to have the support of the best investors in the game who believe in our mission, solutions and people. Ready to tackle global challenges that impact business, society, and the environment? Come join us.&lt;/p&gt;&lt;/div&gt;&lt;h2&gt;&lt;strong&gt;Help streamline our customers’ customs processes&lt;/strong&gt;&lt;/h2&gt; &lt;h2&gt;&lt;strong&gt;The opportunity:&amp;nbsp;&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;Flexport is experiencing massive growth with 2,000+ Flexporters across 16 global offices and warehouses. And we’re just getting started.&lt;/p&gt; &lt;p&gt;As a &lt;strong&gt;Customs Broker&lt;/strong&gt;, you will be part of the customs operations team and play a vital role in ensuring the smooth movement of goods into Canada. Your work directly supports Flexport’s end customers in achieving their compliance goals by executing the clearance of shipments. Most importantly, you will play a pivotal role in taking our customs operations to the next level at Flexport: allowing us to effectively scale to achieve our mission of making global trade easy for everyone a reality.&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;You will:&lt;/strong&gt;&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Create and submit customs entries for high profile clients&lt;/li&gt; &lt;li&gt;Digitally prepare and Submit all documentation required for goods to clear goods with CBSA&lt;/li&gt; &lt;li&gt;Maintain up to date knowledge of all regulations and procedures of the CBSA and Participating Government Agencies (PGA’s)&lt;/li&gt; &lt;li&gt;Review and organize incoming documents to ensure compliance with CBSA and PGA reporting requirements&lt;/li&gt; &lt;li&gt;Provide exceptional customer service support to clients, ensuring a seamless and positive experience throughout their interactions with Flexport&amp;nbsp;&lt;/li&gt; &lt;li&gt;Learn and follow global customs laws, regulations, and trade agreements to ensure compliance with import and export requirements&lt;/li&gt; &lt;li&gt;Participate in training programs to enhance your knowledge of customs compliance and stay up to date on changes in customs regulations and industry practice&lt;/li&gt; &lt;li&gt;Multiple Shifts available&amp;nbsp;&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;You should have:&amp;nbsp;&amp;nbsp;&lt;/strong&gt;&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;CCS Designation&amp;nbsp;&amp;nbsp;&lt;/li&gt; &lt;li&gt;Good understanding of CARM&lt;/li&gt; &lt;li&gt;Strong attention to detail and organizational skills.&lt;/li&gt; &lt;li&gt;An obsession with client happiness. You succeed when they succeed.&amp;nbsp;&lt;/li&gt; &lt;li&gt;Courage to challenge the status quo when logic and reason require it. See something broken? Fix it.&amp;nbsp;&lt;/li&gt; &lt;li&gt;Understanding of international trade and customs regulations (previous experience is a must)&lt;/li&gt; &lt;li&gt;Familiarity with CBSA product classification and rulings&lt;/li&gt; &lt;li&gt;Excellent communication, interpersonal, and organizational skills&lt;/li&gt; &lt;li&gt;Proficient computer skills, including G Suite applications.&lt;/li&gt; &lt;li&gt;Willingness to learn and adapt to changing customs practices and regulations.&lt;/li&gt; &lt;li&gt;Ability to work well independently and in a team-oriented environment.&lt;/li&gt; &lt;li&gt;Strong work ethic and commitment to accuracy and compliance.&lt;/li&gt; &lt;li&gt;A \"compliance first\" attitude to keep our regulators happy and enthusiastic about Flexport since we operate in a heavily regulated industry.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;#LI-Remote&lt;/p&gt;&lt;div class=\"content-conclusion\"&gt;&lt;div class=\"c-virtual_list__item\"&gt; &lt;div class=\"c-message_kit__background p-message_pane_message__message c-message_kit__message\"&gt; &lt;div class=\"c-message_kit__hover\"&gt; &lt;div class=\"c-message_kit__actions c-message_kit__actions--default\"&gt; &lt;div class=\"c-message_kit__gutter\"&gt; &lt;div class=\"c-message_kit__gutter__right\"&gt; &lt;div class=\"c-message_kit__blocks c-message_kit__blocks--rich_text\"&gt; &lt;div class=\"c-message__message_blocks c-message__message_blocks--rich_text\"&gt; &lt;div class=\"p-block_kit_renderer\"&gt; &lt;div class=\"p-block_kit_renderer__block_wrapper p-block_kit_renderer__block_wrapper--first\"&gt; &lt;div class=\"p-rich_text_block\"&gt; &lt;h4&gt;Commitment to Equal Opportunity&lt;/h4&gt; &lt;p&gt;At Flexport, our ability to fulfill our mission of making global commerce easy and accessible relies on having a diverse, dedicated and engaged workforce. All qualified applicants will receive consideration for employment regardless of race, color, religion, sex, national origin, age, physical and mental disability, health status, marital and family status, sexual orientation, gender identity and expression, military and veteran status, and any other characteristic protected by applicable law.&lt;/p&gt; &lt;h4&gt;Global Data Privacy Notice for Job Candidates and Applicants&lt;/h4&gt; &lt;p&gt;Depending on your location, the General Data Protection Regulation (GDPR) and California Consumer Privacy Act (CCPA) may regulate the way we manage the data of job applicants.&amp;nbsp;By submitting your application, you are agreeing to our use and processing of your data as required. Please see our Privacy Notice available at&amp;nbsp;&lt;a href=\"http://www.flexport.com/privacy\"&gt;www.flexport.com/privacy&lt;/a&gt;&amp;nbsp;for additional information.&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/flexport-customs-associate\"&gt;https://weworkremotely.com/remote-jobs/flexport-customs-associate&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Tue, 25 Aug 2026 07:31:11 +0000</pubDate> <expires_at>Thu, 24 Sep 2026 07:31:11 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/flexport-customs-associate</guid> <link>https://weworkremotely.com/remote-jobs/flexport-customs-associate</link> </item> <item> <title>Customer.io: GTM AI Engineer</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Sales and Marketing</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Americas Remote &lt;/p&gt; &lt;h3&gt;About &lt;a href=\"http://customer.io/\"&gt;Customer.io&lt;/a&gt;&lt;/h3&gt; &lt;p&gt;Over 9,000 companies — from scrappy startups to global brands — use our platform to send billions of emails, push notifications, in-app messages, and SMS every day. &lt;a href=\"http://Customer.io\"&gt;Customer.io&lt;/a&gt; powers automated communication that people actually want to receive. We help teams send smarter, more relevant messages using real-time behavioral data.&lt;/p&gt; &lt;h3&gt;About the role&lt;/h3&gt; &lt;p&gt;Hi, my name is Nick Guardino, Senior Director of Marketing Ops at &lt;a href=\"http://Customer.io\"&gt;Customer.io&lt;/a&gt;, and I'm looking for a GTM AI Engineer to help take our AI agents from scrappy prototypes to production-grade systems our GTM teams can depend on.&lt;/p&gt; &lt;p&gt;Over the last 3.5 months, our GTM AI team has built 11 agents now running in production, serving 120 active users and roughly 25,000 tool calls a day — all through custom CLIs that work, but weren't built to scale. We believe businesses can run leaner and go further when they deploy AI agents well, and we're figuring out that motion in real time. This role owns the scale and reliability layer so the rest of the team can keep building.&lt;/p&gt; &lt;h3&gt;What we value&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Craft over quick wins&lt;/strong&gt; — energized by making things robust, not just making them work.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;A point of view&lt;/strong&gt; — we want someone who asks \"why did you build it that way?\" and has a specific answer for what to do instead.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Comfortable being wrong&lt;/strong&gt; — you try things fast, and you course-correct just as fast.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;AI-native by default&lt;/strong&gt; — you'd rather direct Claude to write and QA code than write it by hand.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;What you'll do&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Alpha-to-production ownership&lt;/strong&gt; — take newly built agents from working v1 to production-ready: write evals, harden prompts and tool definitions, and refactor prototype scaffolding into clean, production-quality code.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Observability &amp;amp; stability&lt;/strong&gt; — instrument tracing, logging, and monitoring across the agent fleet so we catch regressions before our 120+ GTM users do.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Deployment &amp;amp; infrastructure&lt;/strong&gt; — stand up and maintain the pipelines that get agents into users' hands without surprises, owning environment parity and release hygiene on our GCP stack.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Database administration&lt;/strong&gt; — own how agents read from and write to our databases, safely and at scale.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Fleet maintenance&lt;/strong&gt; — monitor agent behavior in production, triage issues, and ship the steady stream of improvements that make an agent indispensable rather than just useful.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Partner closely with the GTM AI team&lt;/strong&gt; — free up our agent builders to stay in their zero-to-one wheelhouse while you own scale and reliability.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Bring an outside point of view&lt;/strong&gt; — tell us what we built wrong, and back it up with a plan to fix it.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;What we're looking for&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;4+ years in software engineering, platform/infrastructure engineering, or a similarly technical role, ideally at a B2B SaaS company.&lt;/li&gt; &lt;li&gt;Comfort working in the terminal daily, with a real GitHub PR-and-deploy workflow.&lt;/li&gt; &lt;li&gt;Cloud hosting experience — Kubernetes, VMs, or equivalent; Google Cloud experience strongly preferred.&lt;/li&gt; &lt;li&gt;Experience with how agents interact with and edit databases, including some hands-on database administration.&lt;/li&gt; &lt;li&gt;Familiarity with LLM-based application development: prompt engineering, tool/function calling, evals, and modern agent frameworks.&lt;/li&gt; &lt;li&gt;Ability to prompt AI tools correctly, review their output critically, and direct them to QA their own work — this is an AI-native role, not a hand-coding one.&lt;/li&gt; &lt;li&gt;Scrappy enough to iterate fast, disciplined enough to think about consistency once something needs to scale.&lt;/li&gt; &lt;li&gt;A point of view, and the willingness to ask \"why did you build it that way?\"&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Compensation &amp;amp; Benefits&lt;/h3&gt; &lt;p&gt;We believe in transparency. Starting salary for this role is &lt;strong&gt;$140,000–$170,000 USD&lt;/strong&gt; (or equivalent in local currency) depending on experience and subject to market rate adjustment.&lt;/p&gt; &lt;p&gt;We know our people are what make us great, and we’re committed to taking great care of them. Our inclusive benefits package supports your well-being and growth, including &lt;strong&gt;100% coverage of medical, dental, vision, mental health, and supplemental insurance premiums for you and your family&lt;/strong&gt;. We also offer &lt;strong&gt;16 weeks paid parental leave, unlimited PTO&lt;/strong&gt;, stipends for remote work and wellness, a professional development budget, and more.&lt;/p&gt; &lt;p&gt;&lt;a href=\"https://customer.io/careers#:~:text=our%20collective%20success.-,BENEFITS,-Our%C2%A0\"&gt;See full benefits here →&lt;/a&gt;&lt;/p&gt; &lt;h3&gt;Our Process&lt;/h3&gt; &lt;p&gt;No gotchas, no trick questions - just a clear, human process designed to help both of us make an informed decision.&lt;/p&gt; &lt;ol&gt; &lt;li&gt;30-minute Zoom call with Recruiter&lt;/li&gt; &lt;li&gt;45-minute Zoom call with Hiring Manager&lt;/li&gt; &lt;li&gt;45-minute Zoom call with a member of the GTM AI team&lt;/li&gt; &lt;li&gt;60-minute Live technical session with the team&lt;/li&gt; &lt;/ol&gt; &lt;p&gt;All final candidates will be asked to complete a background check and employment verifications as part of our pre-employment process.&lt;/p&gt; &lt;p&gt;&lt;a href=\"http://Customer.io\"&gt;Customer.io&lt;/a&gt; recognizes the stifling impact of systemic injustice on diverse communities. We commit to using our influence to increase inclusion and equity within the tech industry. We strive to build an inclusive team culture, implement bias-free hiring practices, and develop community partnerships to expand our global impact.&lt;/p&gt; &lt;p&gt;Zoom is the only video conference platform that we use, virtual interviews will be conducted using the video capability (i.e., not via the chat), and offers will be extended in writing on official &lt;a href=\"http://customer.io/\"&gt;Customer.io&lt;/a&gt; letterhead. Please be vigilant in all of your job search activity, and if you have any questions please contact &lt;a href=\"mailto:jobs@customer.io\"&gt;jobs@customer.io&lt;/a&gt;.&lt;/p&gt; &lt;h3&gt;Join us!&lt;/h3&gt; &lt;p&gt;Check out our&amp;nbsp;&lt;a href=\"https://customer.io/careers/\"&gt;careers page&lt;/a&gt;&amp;nbsp;for more information about why you should&amp;nbsp;&lt;a href=\"https://customer.io/about/\"&gt;come work with us!&lt;/a&gt; We believe in empathy, transparency, responsibility, and, yes, a little awkwardness. If you’re excited by what you read — apply now.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/customer-io-gtm-ai-engineer\"&gt;https://weworkremotely.com/remote-jobs/customer-io-gtm-ai-engineer&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Tue, 25 Aug 2026 07:31:11 +0000</pubDate> <expires_at>Thu, 24 Sep 2026 07:31:11 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/customer-io-gtm-ai-engineer</guid> <link>https://weworkremotely.com/remote-jobs/customer-io-gtm-ai-engineer</link> </item> <item> <title>Brex: Compliance Manager, Marketing</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Sales and Marketing</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;p&gt;&lt;strong&gt;Why join us&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Brex is the intelligent finance platform that enables companies to spend smarter and move faster in more than 200 markets. By combining global corporate cards and banking with intuitive spend management, bill pay, and travel software, Brex enables founders and finance teams to accelerate operations, gain real-time visibility, and control spend effortlessly. Brex’s AI-native automation and world-class service eliminate manual expense and accounting tasks for customers so they can focus on what matters most. Tens of thousands of the world's best companies run on Brex, including DoorDash, Coinbase, Robinhood, Zoom, Plaid, Reddit, and SeatGeek.&lt;/p&gt; &lt;p&gt;Working at Brex allows you to push your limits, challenge the status quo, and collaborate with some of the brightest minds in the industry. We’re committed to building a diverse team and inclusive culture and believe your potential should only be limited by how big you can dream. We make this a reality by empowering you with the tools, resources, and support you need to grow your career.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Compliance at Brex&lt;br&gt;&lt;br&gt;&lt;/strong&gt;The Compliance team helps the company grow responsibly, advocating for Brex and for the tens of thousands of growing businesses we serve. We own the compliance policies for Brex, provide strategic advice and guidance to all Brex teams, protect Brex from financial crime and other compliance risks, and represent the company externally on key regulatory and policy issues. Reimagining the financial system in a highly regulated environment requires creativity and resourcefulness, and we welcome the challenge.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What you’ll do&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;As a Manager, Compliance Marketing, you will play a key role in executing and scaling Brex’s marketing compliance program across payments, cards, banking and broader product lines. You will operate at the intersection of compliance, marketing, and product, ensuring that customer-facing materials are accurate, compliant, and aligned with Brex’s standards.&lt;/p&gt; &lt;p&gt;This role is hands-on and execution-focused, supporting high-volume marketing review workflows while helping improve processes, guidance, and training as the program continues to mature. You will partner closely with Marketing, Legal, Product, and other cross-functional teams to enable compliant, high-quality marketing at scale.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Where you'll work&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;This role will be based in our San Francisco office. We are a hybrid environment that combines the energy and connections of being in the office with the benefits and flexibility of working from home. We currently require a minimum of three coordinated days in the office per week, Monday, Wednesday and Thursday. As a perk, we also have up to four weeks per year of fully remote work!&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Responsibilities&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Review and approve marketing materials across channels (e.g., web, SEO, campaigns, email, product marketing, and promotional content) for compliance with internal policies and applicable regulations (e.g., UDAAP, FTC advertising standards)&lt;/li&gt; &lt;li&gt;Ensure marketing claims are accurate, substantiated, and appropriately disclosed, including validation of performance-related claims&lt;/li&gt; &lt;li&gt;Manage a high-volume intake of marketing reviews, including triaging requests, prioritizing based on risk, and meeting turnaround expectations in a fast-paced environment&lt;/li&gt; &lt;li&gt;Partner with Marketing, Product, and Legal teams to translate regulatory requirements into clear, actionable, and solutions-oriented guidance&lt;/li&gt; &lt;li&gt;Track, document, and maintain records of marketing reviews to support audit readiness and reporting expectations&lt;/li&gt; &lt;li&gt;Identify and escalate higher-risk or complex issues with clear recommendations to senior compliance leadership&lt;/li&gt; &lt;li&gt;Support and improve marketing compliance policies, procedures, training, and review workflows to increase efficiency and reduce rework&lt;/li&gt; &lt;li&gt;Take ownership of recurring issues or gaps and drive practical, scalable solutions, while supporting partner bank expectations, audits, and regulatory inquiries&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Requirements&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;4–6 years of experience in compliance, legal, risk, or a related function within banking, financial services, or fintech&lt;/li&gt; &lt;li&gt;Experience reviewing marketing materials or customer-facing content in a regulated environment&lt;/li&gt; &lt;li&gt;Working knowledge of key marketing and consumer protection regulations (e.g., UDAAP, FTC advertising rules; familiarity with Reg Z, CAN-SPAM, TCPA, or similar is a plus)&lt;/li&gt; &lt;li&gt;Strong attention to detail and ability to assess risk and apply regulatory requirements pragmatically&lt;/li&gt; &lt;li&gt;Clear and effective written and verbal communication skills, with the ability to provide concise, solutions-oriented feedback&lt;/li&gt; &lt;li&gt;Ability to manage multiple priorities and deadlines in a high-volume, fast-paced environment&lt;/li&gt; &lt;li&gt;Demonstrated ownership and strong problem-solving skills, with the ability to navigate ambiguity and improve processes&lt;/li&gt; &lt;li&gt;Collaborative, hands-on working style with a focus on execution and cross-functional partnership&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Nice to have&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Experience supporting or scaling a marketing compliance review program&lt;/li&gt; &lt;li&gt;Familiarity with fintech products across payments, card programs, and complex banking products&lt;/li&gt; &lt;li&gt;Experience working with partner banks or within a bank partnership model&lt;/li&gt; &lt;li&gt;Experience or familiarity with AI tools or AI-generated marketing content, including understanding associated compliance risks and review considerations&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Compensation&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;The expected salary range for this role is $153,000 to $170,000. However, the starting base pay will depend on several factors, including the candidate’s location, skills, experience, market demands, and internal pay parity. Depending on the position offered, equity and other forms of compensation may be provided as part of a total compensation package.&lt;/p&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&lt;em&gt;Please be aware, job-seekers may be at risk of targeting by malicious actors looking for personal data. Brex recruiters will only reach out via LinkedIn or email with a&amp;nbsp;&lt;a class=\"c-link\" href=\"http://brex.com/\"&gt;brex.com&lt;/a&gt;&amp;nbsp;domain. Any outreach claiming to be from Brex via other sources should be ignored.&lt;/em&gt;&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/brex-compliance-manager-marketing\"&gt;https://weworkremotely.com/remote-jobs/brex-compliance-manager-marketing&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Tue, 25 Aug 2026 07:31:10 +0000</pubDate> <expires_at>Thu, 24 Sep 2026 07:31:10 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/brex-compliance-manager-marketing</guid> <link>https://weworkremotely.com/remote-jobs/brex-compliance-manager-marketing</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0171/5952/logo.gif\" type=\"image/png\"/> <title>Icarus Digital Marketing: Performance Creative Strategist and AI Producer</title> <region>Anywhere in the World</region> <country>🇦🇱 Albania, 🇦🇷 Argentina, 🇧🇦 Bosnia and Herzegovina, 🇧🇬 Bulgaria, 🇧🇷 Brazil, 🇨🇴 Colombia, 🇲🇩 Moldova (Republic of), 🇲🇰 North Macedonia, 🇲🇽 Mexico, 🇵🇪 Peru, 🇵🇭 Philippines, 🇷🇴 Romania, 🇷🇸 Serbia, and 🇿🇦 South Africa</country> <state>Wyoming</state> <skills>Ad Design, Copywriting, Facebook Paid Ads, Video Production, Generative AI, and AI Content Creation</skills> <category>Sales and Marketing</category> <type>Full-Time</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0171/5952/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; United States &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://icarusdigitalmarketing.com/\"&gt;https://icarusdigitalmarketing.com/&lt;/a&gt; &lt;/p&gt; &lt;h2&gt;Performance Creative Strategist and AI Producer&lt;/h2&gt; &lt;p&gt;&lt;strong&gt;Remote | Full time | Paid 30-day working trial&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Icarus Digital Marketing builds and scales direct-response ecommerce brands, including brands in difficult and restricted categories. We are hiring a hands-on performance creative operator to work directly with the owners on our internal portfolio of brands.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;This is not a conventional graphic-design role.&lt;/strong&gt; We need someone who understands why Meta ads convert and can personally turn that understanding into high-quality static and video creative using current AI production tools.&lt;/p&gt; &lt;p&gt;You may come from dropshipping, affiliate marketing, DTC, a performance agency, or a creative media-buying background. We care more about commercial judgment, production ability, speed, and proof of work than polished credentials.&lt;/p&gt; &lt;h3&gt;The work&lt;/h3&gt; &lt;p&gt;You will use and help improve our internal Creative Cockpit. It takes a brand from research and foundational strategy through campaign creation, production, review, and delivery. For each brand, the system holds brand assets and voice, customer language and audience psychology, pains and desires, necessary beliefs, competitor intelligence, awareness levels, angles, hooks, offer context, prior creative, winners, and performance signals.&lt;/p&gt; &lt;p&gt;Your job is to turn that intelligence into creative that can sell.&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Read campaign briefs, audience research, voice-of-customer material, and brand strategy documents.&lt;/li&gt; &lt;li&gt;Decide what each batch should test and why.&lt;/li&gt; &lt;li&gt;Source and analyse strong visual and structural references.&lt;/li&gt; &lt;li&gt;Develop angles, hooks, scripts, concepts, storyboards, and landing-page direction.&lt;/li&gt; &lt;li&gt;Personally produce static ads and short-form video ads.&lt;/li&gt; &lt;li&gt;Use AI image, video, voice, and editing tools at a high level.&lt;/li&gt; &lt;li&gt;Create meaningful variants without producing repetitive AI slop.&lt;/li&gt; &lt;li&gt;Review work for persuasion, visual quality, brand fit, platform fit, and compliance.&lt;/li&gt; &lt;li&gt;Refine weak generations rather than accepting the first output.&lt;/li&gt; &lt;li&gt;Package approved assets for launch and document what each concept tests.&lt;/li&gt; &lt;li&gt;Read results and use the learning to plan the next batch.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;What you must be good at&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Direct-response advertising and Meta creative strategy&lt;/li&gt; &lt;li&gt;Audience psychology and voice-of-customer interpretation&lt;/li&gt; &lt;li&gt;Awareness levels, hooks, angles, mechanisms, objections, offers, and message-market fit&lt;/li&gt; &lt;li&gt;Understanding when an ad should lead to a PDP, advertorial, listicle, quiz, or sales page&lt;/li&gt; &lt;li&gt;Static ad, UGC, and short-form video production&lt;/li&gt; &lt;li&gt;Visual-reference analysis and controlled recreation&lt;/li&gt; &lt;li&gt;Current AI image and video workflows using tools such as Seedance, Google Flow/Omni, Nano Banana/Gemini, GPT Image, Higgsfield, Kling, Sora, Veo, or comparable tools&lt;/li&gt; &lt;li&gt;Editing, compositing, pacing, captions, sound, and final polish&lt;/li&gt; &lt;li&gt;Fast, organised batch production&lt;/li&gt; &lt;li&gt;Reading creative performance and choosing the next test&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;You are probably not right for this role if&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Your portfolio is mostly branding, organic social content, or attractive design without performance context.&lt;/li&gt; &lt;li&gt;You call every asset “scroll-stopping” but cannot explain the audience belief or conversion mechanism.&lt;/li&gt; &lt;li&gt;You are a strategist who depends on other people to make the work.&lt;/li&gt; &lt;li&gt;You are a tool operator who needs someone else to provide every hook, angle, script, and decision.&lt;/li&gt; &lt;li&gt;You use one prompt, accept the first output, and call it AI production.&lt;/li&gt; &lt;li&gt;You cannot show exactly what you personally contributed to portfolio examples.&lt;/li&gt; &lt;li&gt;You dislike volume, iteration, testing, or direct feedback.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;What success looks like&lt;/h3&gt; &lt;p&gt;Within 30 days, you can understand our strategy packs and operating system, take a structured brief from research to finished assets with limited supervision, produce a useful weekly mix of static and video concepts, explain the reason for every important decision, maintain quality while moving quickly, and suggest practical improvements to the workflow.&lt;/p&gt; &lt;h3&gt;Compensation&lt;/h3&gt; &lt;p&gt;The role begins with a fully paid 30-day working trial at &lt;strong&gt;USD $2,000&lt;/strong&gt;. If the fit is strong, it becomes a long-term full-time position expected to pay &lt;strong&gt;USD $2,000 to $3,000 per month&lt;/strong&gt;, based on demonstrated level, with additional performance upside available for an exceptional long-term operator.&lt;/p&gt; &lt;p&gt;We care about ability, English comprehension, reliability, some overlap with our working hours, and quality of output.&lt;/p&gt; &lt;h3&gt;How to apply&lt;/h3&gt; &lt;p&gt;&lt;strong&gt;Do not send a generic cover letter.&lt;/strong&gt; Message Simon on WhatsApp at &lt;strong&gt;+353 86 349 5073&lt;/strong&gt; and begin with: &lt;strong&gt;I make the work.&lt;/strong&gt;&lt;/p&gt; &lt;ol&gt; &lt;li&gt;Send three Meta ads you personally made or materially directed.&lt;/li&gt; &lt;li&gt;For each example, state exactly what you did and explain the audience, angle, hook, and intended next step in the funnel.&lt;/li&gt; &lt;li&gt;Share any useful performance context you are permitted to disclose. Redacted evidence is acceptable.&lt;/li&gt; &lt;li&gt;Show one weak or failed creative and explain what you learned or changed.&lt;/li&gt; &lt;li&gt;List the AI tools you use in real production and explain your normal workflow from reference to finished asset.&lt;/li&gt; &lt;li&gt;Send a Loom of no more than five minutes. Choose one Meta ad you respect, explain why it works, and describe the next three variants you would test.&lt;/li&gt; &lt;li&gt;State your location, timezone, availability, and expected monthly compensation after the trial.&lt;/li&gt; &lt;/ol&gt; &lt;p&gt;Applications without the requested evidence will not be reviewed. Shortlisted candidates will complete a small paid practical exercise before the 30-day trial.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/icarus-digital-marketing-performance-creative-strategist-and-ai-producer\"&gt;https://weworkremotely.com/remote-jobs/icarus-digital-marketing-performance-creative-strategist-and-ai-producer&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Tue, 25 Aug 2026 00:58:16 +0000</pubDate> <expires_at>Thu, 24 Sep 2026 00:58:16 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/icarus-digital-marketing-performance-creative-strategist-and-ai-producer</guid> <link>https://weworkremotely.com/remote-jobs/icarus-digital-marketing-performance-creative-strategist-and-ai-producer</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0171/6250/logo.gif\" type=\"image/png\"/> <title>Meadow Memorials: Remote Inbound Sales Representative — LATAM, Caribbean &amp; Philippines</title> <region>Anywhere in the World</region> <country></country> <state>New York</state> <skills>Sales, English, and Customer Service</skills> <category>Sales and Marketing</category> <type>Full-Time</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0171/6250/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://www.meadowmemorials.com/\"&gt;https://www.meadowmemorials.com/&lt;/a&gt; &lt;/p&gt; &lt;h3&gt;About the Role&lt;/h3&gt; &lt;p&gt;As an Inbound Sales Representative, you’ll be the first voice families hear when they reach out. You’ll guide them with clarity and compassion - no cold calls or pushy tactics, just meaningful conversations that help people make one of life’s most important decisions with confidence.&lt;/p&gt; &lt;p&gt;This is a sales role: you're responsible for helping families make confident decisions and guiding them to a close - always with genuine care, never pressure. Depending on team needs and performance, this role may include a mix of inbound sales conversations, returning lead follow-up, and support work that helps the broader sales process run smoothly.&lt;/p&gt; &lt;p&gt;&lt;em&gt;A quick note, because many candidates wonder about it:&amp;nbsp;&lt;/em&gt;People often assume this work is emotionally heavy, but our team consistently finds it deeply meaningful and surprisingly uplifting. The role is rooted in hospitality, clarity, and human connection, not sadness. Rather than feeling heavy, the work offers a unique sense of purpose as part of a modern, compassionate company transforming an outdated industry and bringing dignity, transparency, and warmth to families across the country.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;h3&gt;Grow Your Career&lt;/h3&gt; &lt;p&gt;Most teammates begin in our&amp;nbsp;&lt;strong&gt;Second Call Representative&lt;/strong&gt;&amp;nbsp;role, a customer-facing sales position where you'll build product expertise, close deals, and develop our consultative sales approach.&lt;/p&gt; &lt;p&gt;High-performing Day Shift reps may become eligible to join our&amp;nbsp;&lt;strong&gt;First Call Representative&lt;/strong&gt;&amp;nbsp;team after approximately three months. First Call Reps receive more inbound opportunities and move to an uncapped performance-based compensation plan tied directly to dollars sold, creating meaningful upside for top performers.&lt;/p&gt; &lt;p&gt;Eligibility for the First Call team is based on sustained performance, including strong conversion results, customer experience, workflow accuracy, and overall reliability.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;h3&gt;What You’ll Do&lt;/h3&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Handle warm inbound leads and support families through the sales process with clarity, empathy, and strong follow-through.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Guide families through cremation options, helping them make a confident decision when possible and ensuring thoughtful follow-up when more time is needed.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Manage returning leads and follow-up conversations across phone, text, and email so no family falls through the cracks.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Contribute to queue coverage, sales activities, and related support workflows that improve the overall customer experience.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Hit performance targets while maintaining strong conversion outcomes and quality scores.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Move fluently across our stack - HubSpot, Aircall, GSuite, Slack, and our case management system.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Requirements&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Must currently reside in Latin America, the Caribbean, or the Philippines.&lt;/li&gt; &lt;li&gt; &lt;p&gt;2+ years of sales experience with a track record of meeting or exceeding individual targets - managing the full sales cycle and closing, ideally consumer (B2C) sales over the phone.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Strong sales instincts and phone presence: you can guide a live conversation toward a confident decision, handle objections naturally, and build trust with families while balancing sales conversations with follow-up and support work.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Clear spoken and written English; you explain options simply and warmly.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Self-driven and results-focused: you track where you stand against your target and adjust when you're behind. Emotionally steady and highly coachable&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Comfortable working independently and managing a consistent follow-up rhythm.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Familiarity with HubSpot or comparable CRMs (Salesforce, Zoho, etc.).&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A home setup that supports the work - see our&amp;nbsp;&lt;a href=\"https://docs.google.com/document/d/1Iap_48WyBpiBL098Y7EC15a26syH7C9vfeXk_FAcOVI/edit?usp=sharing\"&gt;tech requirements&lt;/a&gt;&amp;nbsp;for details.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Bonus Points&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Experience selling in high-trust categories (insurance, healthcare, travel, etc.).&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Spanish fluency — many of the families we serve speak it.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Details:&lt;/h3&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Remote, full-time&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Compensation:&lt;/strong&gt; $6-$14 OTE, depending on your location and local market.&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;em&gt;Competitive base pay plus monthly performance bonuses.&lt;/em&gt;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;em&gt;The advertised OTE reflects expected earnings in your starting role. Top performers who advance to our&amp;nbsp;&lt;strong&gt;First Call Representative&lt;/strong&gt;&amp;nbsp;team move to an uncapped performance-based compensation plan with significantly higher earning potential.&lt;/em&gt;&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;/li&gt; &lt;/ul&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Tools&lt;/strong&gt;: HubSpot (CRM), Aircall (phone), Slack, and our case management system&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Schedule:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Full-time, 8-hour shifts on a consistent weekly schedule&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Days: Monday–Friday, Tuesday–Saturday, or Sunday–Thursday&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;(weekend availability a plus)&lt;/strong&gt;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Available shift windows:&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;AM (start 6–8am EST)&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;PM (start 1–4pm EST)&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;/li&gt; &lt;/ul&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Why You’ll Love Working With Us:&lt;/h3&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;We’re a real business, built to last.&lt;/strong&gt;&amp;nbsp;We’ve proven our model in LA and became the largest independent funeral home in California in less than two years. We’re now going national. And plan to grow for years to come.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;A serious employer for global teammates.&lt;/strong&gt;&amp;nbsp;We have years of experience running distributed teams. Same 1:1s, check-ins, and career paths as our U.S. team - same expectations, same opportunities.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;People stay.&lt;/strong&gt;&amp;nbsp;Regrettable turnover is very low. Don't take our word for it - read our&amp;nbsp;&lt;a href=\"https://www.glassdoor.com/Overview/Working-at-Meadow-Memorials-EI_IE10471206.11,27.htm\"&gt;Glassdoor reviews&lt;/a&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Fair compensation with real upside.&amp;nbsp;&lt;/strong&gt;Competitive globally benchmarked base pay, meaningful monthly bonuses, and a clear path to an uncapped compensation plan through eligibility to our First Call team.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;High care, high standards.&lt;/strong&gt;&amp;nbsp;Real investment in training and growth, honest feedback, no burnout culture.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Benefits:&lt;/strong&gt;&amp;nbsp;PTO, 10 paid holidays, paid training, fully remote.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Purpose-driven work:&lt;/strong&gt;&amp;nbsp;Real impact during one of life's most meaningful transitions.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;br&gt;Apply Now&lt;/h3&gt; &lt;p&gt;We’re just getting started, and we’re looking for people who want to grow with us. If you’re excited about making an impact, building meaningful relationships, and launching a successful career in sales and tech, apply today. Even if you don’t meet every qualification, we encourage you to apply - your passion and potential matter more than checking every box.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/meadow-memorials-remote-inbound-sales-representative-latam-caribbean-philippines\"&gt;https://weworkremotely.com/remote-jobs/meadow-memorials-remote-inbound-sales-representative-latam-caribbean-philippines&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Mon, 24 Aug 2026 22:10:43 +0000</pubDate> <expires_at>Wed, 23 Sep 2026 22:10:43 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/meadow-memorials-remote-inbound-sales-representative-latam-caribbean-philippines</guid> <link>https://weworkremotely.com/remote-jobs/meadow-memorials-remote-inbound-sales-representative-latam-caribbean-philippines</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0171/6247/logo.gif\" type=\"image/png\"/> <title>Eyr Holistic: Creative Strategist</title> <region>Anywhere in the World</region> <country></country> <state>Texas</state> <skills></skills> <category>Sales and Marketing</category> <type>Contract</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0171/6247/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Poland &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://eyrholistic.com/\"&gt;https://eyrholistic.com/&lt;/a&gt; &lt;/p&gt; &lt;p&gt;We're Eyr Holistic, a fast-growing nine-figure Nordic ecommerce group in natural wellness and beauty, home to Frøya Organics, Norse Organics, Primal Viking and Arctic Goddess. We are vertically integrated from the ground up, from the farmers and harvesters who grow and collect our Arctic herbs all the way to the customer's door. One integrated company, one team spread across the world, owning quality and story at every step.&lt;/p&gt; &lt;p&gt;At Eyr Holistic you'll sharpen your skills in a fast-growing, eight-figure skincare empire, own bold campaigns from concept to scale, and thrive in a culture of speed, creativity, and impact. Top performers don't just market, they shape legendary brands and outcomes.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Who is this for&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Creative Strategist with 3+ years experience writing scripts and shot lists for performance video ads on Meta&lt;/li&gt; &lt;li&gt;Proven track record scaling 8–9 figure DTC brands with UGC-style creatives&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;What you'll get&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Creative freedom to strategically test new angles and innovative creative ideas.&lt;/li&gt; &lt;li&gt;Ownership of creative quality and ad performance.&lt;/li&gt; &lt;li&gt;A high-velocity environment with clear weekly output targets.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Key Responsibilities&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Write direct response UGC style scripts that drive high conversion rates.&lt;/li&gt; &lt;li&gt;Analyze performance data and use learnings to optimize future scripts.&lt;/li&gt; &lt;li&gt;Collaborate with our Creator Team and Editors to ensure the ad creation process from idea to execution runs smoothly.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Qualifications&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;3+ years writing performance video ads for Meta&lt;/li&gt; &lt;li&gt;Portfolio of UGC/performance ads that scaled DTC brands&lt;/li&gt; &lt;li&gt;Understanding of how to analyze Meta performance data&lt;/li&gt; &lt;li&gt;Strong grasp of rapid iteration, testing, and data-informed decisions&lt;/li&gt; &lt;li&gt;Experience collaborating with editors and providing them with clear feedback to bring your vision to life&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;If this sounds like you, apply through this listing or send your CV to talent@eyrholistic.com.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/eyr-holistic-creative-strategist\"&gt;https://weworkremotely.com/remote-jobs/eyr-holistic-creative-strategist&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Mon, 24 Aug 2026 15:18:07 +0000</pubDate> <expires_at>Wed, 23 Sep 2026 15:18:07 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/eyr-holistic-creative-strategist</guid> <link>https://weworkremotely.com/remote-jobs/eyr-holistic-creative-strategist</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0081/6771/logo.gif\" type=\"image/png\"/> <title>Lemon.io: Senior DevOps Engineer</title> <region>Anywhere in the World</region> <country>🇦🇹 Austria, 🇦🇺 Australia, 🇧🇪 Belgium, 🇧🇬 Bulgaria, 🇨🇦 Canada, 🇨🇾 Cyprus, 🇨🇿 Czechia, 🇩🇪 Germany, 🇩🇰 Denmark, 🇪🇪 Estonia, 🇪🇸 Spain, 🇫🇮 Finland, 🇫🇷 France, 🇬🇧 United Kingdom of Great Britain and Northern Ireland, 🇬🇷 Greece, 🇭🇷 Croatia, 🇭🇺 Hungary, 🇮🇪 Ireland, 🇮🇹 Italy, 🇱🇹 Lithuania, 🇱🇺 Luxembourg, 🇱🇻 Latvia, 🇲🇹 Malta, 🇳🇱 Netherlands, 🇵🇱 Poland, 🇵🇹 Portugal, 🇷🇴 Romania, 🇸🇪 Sweden, 🇸🇬 Singapore, 🇸🇮 Slovenia, 🇸🇰 Slovakia, and 🇺🇸 United States of America</country> <state>Delaware</state> <skills>GoLang, Linux, Python, Engineer, Developer, Back-End Dev, Full Stack Dev, Full Time, DevOps, English, Kubernetes, and AI Agents</skills> <category>DevOps and Sysadmin</category> <type>Contract</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0081/6771/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; New York, NY &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://lemon.io\"&gt;https://lemon.io&lt;/a&gt; &lt;/p&gt; &lt;p&gt;&lt;strong&gt;Senior Developer? Work Remote. Get Paid Well. Build What Matters.&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;a href=\"https://lemon.io/for-developers/?utm_source=weworkremotely&amp;amp;utm_medium=job_ad&amp;amp;utm_campaign=supply_en_devops_client_aug_2026_job_ad\"&gt;Lemon.io&lt;/a&gt; connects hand-picked senior developers with vetted startups across the US and Europe — no bidding wars, no ghosting, just serious opportunities.&lt;/p&gt; &lt;p&gt;We're currently hiring for a &lt;strong&gt;research-driven AI company&lt;/strong&gt; on a mission to slash the cost of modern AI — co-designing hardware, software, algorithms, and models to make AI's benefits accessible to everyone. They're active open-source contributors, building the infrastructure behind next-generation AI at scale.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Open roles:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Senior Software Engineer (Golang)&lt;/li&gt; &lt;li&gt;Senior DevOps Engineer&lt;/li&gt; &lt;li&gt;Senior Site Reliability Engineer&lt;/li&gt; &lt;li&gt;Platform Engineer&lt;/li&gt; &lt;li&gt;Senior Python &amp;amp; LLM Developer&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Why this one's worth a look:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Starts as contract work through our platform — but perform well, and you're on track for direct hire with equity, health insurance, and other competitive benefits. You'll be working on infrastructure that directly shapes how AI gets built and deployed, at a company operating at the frontier of the field.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Locations:&lt;/strong&gt; EU, US, Canada, UK, Australia, Singapore&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Senior Golang Developer&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Build the Go-based platform that lets research and inference teams provision, scale, repair, and tear down GPU clusters via API — no ticket queues. You'll own it end to end: internal platform design, developer experience, and production ops.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Requirements:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;5+ years of software development experience&lt;/li&gt; &lt;li&gt;3+ years of experience with Golang and Kubernetes controllers&lt;/li&gt; &lt;li&gt;Knowledge of Temporal is a must&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Senior Site Reliability Engineer&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Requirements:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;5+ years of software development experience&lt;/li&gt; &lt;li&gt;5+ years of experience with Linux and Kubernetes&lt;/li&gt; &lt;li&gt;3+ years of experience with Python or Golang&lt;/li&gt; &lt;li&gt;At least 2 years of expertise with Ansible&lt;/li&gt; &lt;li&gt;2+ years of experience with bare-metal provisioning&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Senior DevOps Engineer&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;5+ years of software development experience&lt;/li&gt; &lt;li&gt;3+ years of experience with Python or Golang&lt;/li&gt; &lt;li&gt;3+ years of experience with Kubernetes&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Senior Platform Engineer&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;5+ years of software development experience&lt;/li&gt; &lt;li&gt;3+ years of experience with Python or Golang&lt;/li&gt; &lt;li&gt;5+ years of experience with Kubernetes&lt;/li&gt; &lt;li&gt;AI-assisted coding is a must&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Senior Python + LLM Developer&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;5+ years of software development experience&lt;/li&gt; &lt;li&gt;5+ years of experience with Python&lt;/li&gt; &lt;li&gt;2+ years of experience with Linux and Kubernetes&lt;/li&gt; &lt;li&gt;2+ years of experience AI agent development&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Not your stack?&lt;/strong&gt; We're placing Senior Developers (4+ yrs commercial experience) across AI Agent Architecture, AI Automation Architecture, AI Engineering, Site Reliability Engineering, Platform Engineering, React &amp;amp; Python, React &amp;amp; Golang, Golang, React &amp;amp; Java, React &amp;amp; Ruby, Ruby, PHP &amp;amp; Vue, Vue &amp;amp; Node.js, React &amp;amp; .NET, Android &amp;amp; iOS, iOS &amp;amp; Swift, Flutter &amp;amp; Dart, Blockchain (Ethereum/Ethers.js/Wagmi/Viem/Solana), Angular &amp;amp; Node.js, Vue &amp;amp; .NET, Python &amp;amp; Vue, DevOps, MLOps, Data Science, Angular &amp;amp; PHP, Angular &amp;amp; .NET, Symfony &amp;amp; React, Symfony &amp;amp; Vue, Symfony &amp;amp; Angular, Python, Symfony &amp;amp; JavaScript &amp;amp; Next.js &amp;amp; TypeScript, Data Analysis, React &amp;amp; PHP, Data Engineering, Project Management, Product Management, QA Automation, QA Manual, Embedded Software Engineering, React Native &amp;amp; Node, React Native &amp;amp; React, React Native &amp;amp; Ruby, React Native &amp;amp; Python, WordPress, Android, Data Annotation, Angular, Python &amp;amp; Node, React &amp;amp; Node.js, Java &amp;amp; Spring, Svelte &amp;amp; Python, Svelte &amp;amp; Node.js, Svelte &amp;amp; TypeScript, Rust, Shopify &amp;amp; JavaScript, Vue &amp;amp; Nuxt, PHP &amp;amp; Laravel, UI/UX Design, Animation, Graphic Design, React &amp;amp; Node &amp;amp; React Native, .NET &amp;amp; C#, Electron, Scala, C++, Unreal Engine &amp;amp; C++, Python &amp;amp; LLM, Unity, or Machine Learning Engineering — and more. Reach out and we'll match you.&lt;/p&gt; &lt;p&gt;&lt;em&gt;No visa assistance provided. Contract engagements don't include direct-hire benefits.&lt;/em&gt;&lt;/p&gt; &lt;p&gt;We work with developers across 75+ countries in Europe, Latin America, North America, select Asian markets (Japan, Singapore, South Korea, Philippines, Indonesia, Malaysia, Vietnam, Thailand, Israel), Oceania (Australia, New Zealand, Papua New Guinea), and Africa (including Morocco, South Africa).&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/lemon-io-senior-devops-engineer-3\"&gt;https://weworkremotely.com/remote-jobs/lemon-io-senior-devops-engineer-3&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Mon, 24 Aug 2026 11:52:38 +0000</pubDate> <expires_at>Wed, 23 Sep 2026 11:52:38 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/lemon-io-senior-devops-engineer-3</guid> <link>https://weworkremotely.com/remote-jobs/lemon-io-senior-devops-engineer-3</link> </item> <item> <title>Faire: Senior Manager, Global Equity</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Management and Finance</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote - US &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;p&gt;&lt;span&gt;&lt;strong&gt;About Faire&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt; &lt;p&gt;Faire is a technology wholesale platform built on the belief that the future is local. Independent retailers around the globe collectively represent a multi-hundred-billion-dollar wholesale market that has historically been fragmented and offline. At Faire, we're using the power of tech, data, and machine learning to connect this thriving community of entrepreneurs across the globe. Picture your favorite boutique in town — we help them discover the best products from around the world to sell in their stores. With the right tools and insights, we believe that we can level the playing field so businesses can grow and local communities can thrive.&lt;/p&gt; &lt;p&gt;We’re looking for smart, resourceful and passionate people to join us as we power the shop local movement. If you believe in community, come join ours.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;About this role&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Faire is revolutionizing wholesale and helping local retailers and their suppliers succeed in a technology-enabled era. As a Senior Manager, Global Equity, you will own and continue to evolve Faire’s global equity programs, building on an existing foundation while enhancing the structure, rigor, and scalability required to support public company readiness. This is a high-impact role for someone who thrives in fast-paced environments, brings strong judgment, and wants to shape how equity operates with true end-to-end ownership.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;As a Senior Manager, Global Equity You Will&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Own and scale Faire’s global equity programs end-to-end, spanning plan design, administration, accounting, compliance, and employee experience across all equity award types and jurisdictions.&lt;/li&gt; &lt;li&gt;Serve as the senior owner of equity operations, partnering with Finance, Accounting, Payroll, Legal, and People to build durable, audit-ready processes that scale with company growth.&lt;/li&gt; &lt;li&gt;Lead public company equity responsibilities, including SEC reporting support, insider trading programs, audit readiness, and the design and operation of equity-related internal controls.&lt;/li&gt; &lt;li&gt;Oversee the full equity lifecycle, including grant issuance, vesting, exercises, releases, share pool management, and reconciliations between the equity platform and general ledger.&lt;/li&gt; &lt;li&gt;Design, implement, and optimize equity systems and workflows, including Shareworks (or equivalent) integrations with payroll, HRIS, and financial reporting systems.&lt;/li&gt; &lt;li&gt;Act as a trusted advisor and escalation point for complex employee, executive, and stakeholder equity matters, exercising sound judgment and discretion.&lt;/li&gt; &lt;li&gt;Proactively manage global regulatory, tax, and compliance risk, partnering with Legal and external advisors to ensure equity programs remain compliant as Faire scales internationally.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Qualifications&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Bachelor’s degree in Economics, Finance, Accounting, Law or equivalent practical experience&lt;/li&gt; &lt;li&gt;10+ years of experience in stock plan administration, including leadership in complex or high-growth environments&lt;/li&gt; &lt;li&gt;CEP certification strongly preferred&lt;/li&gt; &lt;li&gt;Deep expertise in global equity programs, with hands-on knowledge of legal, tax, and payroll considerations across multiple jurisdictions.&lt;/li&gt; &lt;li&gt;Experience with designing and implementing an Employee Stock Purchase Plan&lt;/li&gt; &lt;li&gt;Proven experience scaling equity programs through private-to-public readiness or public company operations.&lt;/li&gt; &lt;li&gt;Advanced analytical and systems skills; Shareworks (or equivalent) expertise required.&lt;/li&gt; &lt;li&gt;Demonstrated ability to influence cross-functionally without authority, including working with senior leaders.&lt;/li&gt; &lt;li&gt;You are resourceful and not afraid to roll up your sleeves.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Salary Range&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;California &amp;amp; New York:&amp;nbsp;&lt;/strong&gt;the pay range for this role is $184,000 to $253,000 per year.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Zone B&lt;/strong&gt;: the pay range for this role is $165,500 to $227,500 per year.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Zone C&lt;/strong&gt;: the pay range for this role is $147,000 to $202,500 per year.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Note: &lt;/strong&gt;This is a &lt;strong&gt;remote role&lt;/strong&gt; open to candidates located in Arizona, California, Colorado, Connecticut, District of Columbia, Florida, Georgia, Idaho, Illinois, Indiana, Kentucky, Maine, Maryland, Massachusetts, Michigan, Minnesota, Missouri, Nevada, New Hampshire, New Jersey, New Mexico, New York, North Carolina, Ohio, Oregon, Pennsylvania, Rhode Island, Tennessee, Texas, Utah, Virginia, Washington, or Wisconsin&lt;/p&gt; &lt;p&gt;This role will also be eligible for equity and benefits. Actual base pay will be determined based on permissible factors such as transferable skills, work experience, market demands, and primary work location. The base pay range provided is subject to change and may be modified in the future.&lt;/p&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&lt;em&gt;&lt;span&gt;&lt;em&gt;Hybrid Faire employees currently go into the office 3 days per week on Tuesdays, Thursdays, and a third flex day of their choosing (Monday, Wednesday, or Friday).&lt;/em&gt; Additionally, hybrid in-office roles will have the flexibility to work remotely up to 4 weeks per year. Specific Workplace and Information Technology positions may require onsite attendance 5 days per week as will be indicated in the job posting.&amp;nbsp;&lt;br&gt;&lt;/span&gt;&lt;/em&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Why you’ll love working at Faire&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Move fast:&lt;/strong&gt; You'll own meaningful problems that serve customers around the globe with the agency to move fast and see your results clearly.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Equipped to scale:&lt;/strong&gt; We invest in what matters, including the latest enterprise AI tools, to help you work smarter and get more out of every day.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Best in class:&lt;/strong&gt; Our team is full of sharp, kind, and generous colleagues who care about their craft and about helping you grow in yours.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Real rewards.&lt;/strong&gt; Competitive pay, equity, and comprehensive benefits designed to support your life inside and outside of work.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Belonging:&lt;/strong&gt; We're intentional about building an environment where every Faire employee has equal access to opportunities, growth, and success.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Faire was founded in 2017 by a team of early product and engineering leads from Square. We’re backed by some of the top investors in retail and tech including: Y Combinator, Lightspeed Venture Partners, Forerunner Ventures, Khosla Ventures, Sequoia Capital, Founders Fund, and DST Global. We have headquarters in San Francisco and Kitchener-Waterloo, and a global employee presence across offices in Toronto, London, and New York. To learn more about Faire and our customers, you can read more on our &lt;a href=\"https://blog.faire.com/\"&gt;blog&lt;/a&gt;.&lt;/p&gt; &lt;p&gt;&lt;/p&gt; &lt;p&gt;Faire provides equal employment opportunities (EEO) to all employees and applicants for employment without regard to race, color, religion, sex, national origin, age, disability, genetics, sexual orientation, gender identity or gender expression.&lt;/p&gt; &lt;p&gt;Faire is committed to providing access, equal opportunity and reasonable accommodation for individuals with disabilities in employment, its services, programs, and activities. Accommodations are available throughout the recruitment process and applicants with a disability may request to be accommodated throughout the recruitment process. We will work with all applicants to accommodate their individual accessibility needs.&amp;nbsp; To request reasonable accommodation, please fill out our &lt;a href=\"https://docs.google.com/forms/d/e/1FAIpQLSczpI9me7nYKhunSC6AlagHKv75LHqfi-Qi2TP_3dpin0Uc9Q/viewform\"&gt;Accommodation Request Form&lt;/a&gt; (&lt;a href=\"https://bit.ly/faire-form)\"&gt;https://bit.ly/faire-form)&lt;/a&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Privacy&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;For information about the type of personal data Faire collects from applicants, as well as your choices regarding the data collected about you, please visit Faire’s &lt;a class=\"c-link\" href=\"https://www.faire.com/privacy\"&gt;Privacy Notice (https://www.faire.com/privacy)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/faire-senior-manager-global-equity\"&gt;https://weworkremotely.com/remote-jobs/faire-senior-manager-global-equity&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Mon, 24 Aug 2026 07:30:47 +0000</pubDate> <expires_at>Wed, 23 Sep 2026 07:30:47 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/faire-senior-manager-global-equity</guid> <link>https://weworkremotely.com/remote-jobs/faire-senior-manager-global-equity</link> </item> <item> <title>Abnormal: Application Security Engineer II</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>DevOps and Sysadmin</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote - USA &lt;/p&gt; &lt;h2&gt;About the Role&lt;/h2&gt; &lt;p&gt;Abnormal AI is looking for an &lt;strong&gt;Application Security Engineer II&lt;/strong&gt; to secure the AI-powered systems at the core of our AWS-based platform (LLM-integrated features, agentic workflows, MCP connectors, and the model supply chain) against threats like prompt injection at production scale. This is an individual contributor role that blends deep application security expertise with strong engineering fundamentals. You'll focus on integrating security into every phase of our software development lifecycle, conducting comprehensive security reviews, and partnering with engineering teams to build defensible architectures.&lt;/p&gt; &lt;p&gt;You will own the security architecture and development of secure coding practices while ensuring security is a foundational partner to our engineering stakeholders. You'll coach developers across the engineering organization on application security principles, act as a technical liaison across teams, and contribute directly to keeping our applications and customers secure. This role reports to the Director of Security Engineering.&lt;/p&gt; &lt;h2&gt;What you will do&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Lead threat modeling and security architecture reviews with engineering teams by translating security risks into concrete development actions, with particular focus on AI-powered features (LLM integrations, agentic workflows, MCP connectors).&lt;/li&gt; &lt;li&gt;Architect, build, and maintain security tooling and integrations that make secure development the default in our CI/CD pipelines.&lt;/li&gt; &lt;li&gt;Design and deploy automated security testing to identify vulnerabilities early in the development process.&lt;/li&gt; &lt;li&gt;Serve as a hands-on technical contributor during security incidents by analyzing application-level behavior and enhancing response processes.&lt;/li&gt; &lt;li&gt;Coach developers on secure coding, security architecture, and threat modeling for AI-native systems.&lt;/li&gt; &lt;li&gt;Define and track key security posture metrics, building dashboards or reports to visualize security coverage and vulnerability trends.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Must Haves&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;5+ years of experience in application security engineering roles, ideally securing AWS or comparable cloud-native environments with modern development practices.&lt;/li&gt; &lt;li&gt;Experience securing AI/ML-powered systems, or a clear ability to ramp fast on prompt injection, model supply chain, and agentic-workflow risks.&lt;/li&gt; &lt;li&gt;Strong programming skills in Python, Go, Java, or JavaScript/TypeScript. You write and read production code, not just review it.&lt;/li&gt; &lt;li&gt;Expertise in web application security including OWASP Top 10, authentication/authorization, cryptography, and secure API design, including securing modern architectures (microservices, containers, cloud-native).&lt;/li&gt; &lt;li&gt;Hands-on experience threat modeling and running security architecture reviews.&lt;/li&gt; &lt;li&gt;Proven ability to influence and collaborate cross-functionally with engineering, DevOps, and product teams, with strong written communication.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Nice to Have&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Experience working in fast-paced or startup environments, comfortable defining scope in a growing security program.&lt;/li&gt; &lt;li&gt;Hands-on experience with commercial security tools (Veracode, Checkmarx, SonarQube, Wiz, Semgrep, Burp Suite)&lt;/li&gt; &lt;li&gt;Prior experience building security telemetry pipelines or vulnerability management frameworks.&lt;/li&gt; &lt;li&gt;Exposure to compliance frameworks (SOC 2, ISO 27001) and how development decisions affect auditability.&lt;/li&gt; &lt;li&gt;Familiarity with bug bounty programs and vulnerability disclosure processes.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;#LI-PP1&lt;/p&gt;&lt;div class=\"content-pay-transparency\"&gt;&lt;div class=\"pay-input\"&gt;&lt;div class=\"description\"&gt;&lt;p&gt;Actual compensation will be determined based on several non-discriminatory factors including skills, experience, qualifications, and geographic location.&lt;br&gt;In addition to base salary, this role may be eligible for bonus or incentive compensation, equity, and a comprehensive benefits package.&lt;/p&gt;&lt;/div&gt;&lt;div class=\"title\"&gt;Base salary range:&lt;/div&gt;&lt;div class=\"pay-range\"&gt;&lt;span&gt;$130,100&lt;/span&gt;&lt;span class=\"divider\"&gt;—&lt;/span&gt;&lt;span&gt;$187,000 USD&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&lt;strong&gt;A note on AI in our process:&amp;nbsp;&lt;br&gt;&lt;/strong&gt;Abnormal AI uses AI-assisted tools to help our recruiting team prepare for candidate interviews. These tools analyze resume content and role requirements to suggest interview questions and areas for the interviewer to explore. They do not make hiring decisions or screen candidates automatically. Every decision about a candidacy is made by a person. Further, if your application is successful and Abnormal AI makes a conditional offer of employment, we will carry out pre-employment checks which must be successfully completed to progress to a final offer. All processes and pre-employment checks are in line with prevailing legislation and Abnormal AI's policies relevant to our security and privacy standards.&lt;/p&gt; &lt;p&gt;Abnormal AI is an equal opportunity employer. Qualified applicants will receive consideration for employment without regard to race, color, religion, sex, national origin, disability, protected veteran status or other characteristics protected by law. For our EEO policy statement please &lt;a href=\"https://assets.contentstack.io/v3/assets/blt3a076cfd9753fa1f/blt9cbda641db7c0045/6a1e3d3a66aea075cd33e462/AAP_and_EEO_Statement.pdf\"&gt;&lt;span&gt;&lt;em&gt;click here&lt;/em&gt;&lt;/span&gt;&lt;/a&gt;. If you would like more information on your EEO rights under the law, please&amp;nbsp;&lt;em&gt;&lt;span&gt;&lt;a href=\"https://assets.contentstack.io/v3/assets/blt3a076cfd9753fa1f/blt4eb3a265cc7b1ca9/6a1e3d3bfe33e73c16ff026b/EEOC_Know_Your_Rights_Oct_30_2025.pdf\"&gt;click here&lt;/a&gt;&lt;/span&gt;&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/abnormal-application-security-engineer-ii\"&gt;https://weworkremotely.com/remote-jobs/abnormal-application-security-engineer-ii&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Mon, 24 Aug 2026 07:30:47 +0000</pubDate> <expires_at>Wed, 23 Sep 2026 07:30:47 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/abnormal-application-security-engineer-ii</guid> <link>https://weworkremotely.com/remote-jobs/abnormal-application-security-engineer-ii</link> </item> <item> <title>Abnormal: Critical Situation Manager</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>DevOps and Sysadmin</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote - USA &lt;/p&gt; &lt;p&gt;The Critical Situation Manager owns the customer-facing response when a customer's trust in the platform has been shaken by a significant efficacy or product concern.&amp;nbsp; This role engages when a customer's feedback is substantive and requires a coordinated investigation and response from R&amp;amp;D and other technical teams. The Critical Situation Manager leads that investigation, translates technical findings into clear, confidence-restoring customer communication, and owns the engagement through to a formal resolution and close-out.&lt;/p&gt; &lt;p&gt;As a Critical Situation Manager, you are a skilled communicator who thrives at navigating complex customer challenges, influencing cross-functional teams, and restoring customer confidence. You bring a strong customer-first mindset, the ability to untangle technical and relationship issues, and the confidence to drive action across Customer Success, Product, Engineering, and Support. Your leadership and organizational skills will ensure that escalations are handled with urgency, transparency, and accountability.&amp;nbsp; You have held roles such as Support Engineer, Sales Engineer, or Technical Account Manager in enterprise SaaS or cybersecurity environments, and this background enables you to navigate complex technical issues and customer relationships effectively.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;The Critical Situation Manager will:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Serve as the customer-facing owner for high-stakes technical situations where a customer's confidence in the platform needs to be restored.&lt;/li&gt; &lt;li&gt;Assess incoming situations and determine the right level of response, from a clear explanation to a full cross-functional investigation.&lt;/li&gt; &lt;li&gt;Coordinate with R&amp;amp;D and other technical teams to investigate customer-reported concerns, translating customer feedback into a precise, actionable investigation request.&lt;/li&gt; &lt;li&gt;Translate technical findings back into clear, credible communication for customer stakeholders, up to and including executive audiences.&lt;/li&gt; &lt;li&gt;Own the full arc of each engagement following the initial assignment, from investigation through resolution, and a formal close-out with the customer.&lt;/li&gt; &lt;li&gt;Set and hold timeline expectations with customers throughout an engagement, ensuring no gaps in communication.&lt;/li&gt; &lt;li&gt;Track outcomes and findings across engagements to identify recurring themes and inform product and process improvements.&lt;/li&gt; &lt;li&gt;Build and drive the Critical Situation Management process and build playbooks for handling common scenarios&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Must Haves&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;5-7 years of customer-facing experience in a technical role (TAM, SE, Support, or related enterprise SaaS roles) with a proven track record in managing escalations&lt;/li&gt; &lt;li&gt;Sufficient technical fluency in Abnormal's detection architecture and investigation tooling to engage credibly with both R&amp;amp;D and customers without a technical translator.&lt;/li&gt; &lt;li&gt;Demonstrated success in leading de-escalations for complex, strategic customers, and strong judgment in assessing the right level of response to a customer concern&lt;/li&gt; &lt;li&gt;Strong understanding of customer lifecycle, support workflows, and escalation management best practices&lt;/li&gt; &lt;li&gt;Excellent verbal and written communication skills, including executive-level communication with customers and internal stakeholders&lt;/li&gt; &lt;li&gt;Comfort owning complex, multi-week engagements through to resolution, not just leading an initial call.&lt;/li&gt; &lt;li&gt;Strong organizational skills with the ability to prioritize multiple high-stakes issues simultaneously&lt;/li&gt; &lt;li&gt;Demonstrated ability to build cross-functional trust quickly, including with technical teams outside your direct reporting line.&lt;/li&gt; &lt;li&gt;Empathy-driven, customer-first orientation with a bias for action&lt;/li&gt; &lt;li&gt;Experience in Cybersecurity is required&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;#LI-MC2&lt;/p&gt;&lt;div class=\"content-pay-transparency\"&gt;&lt;div class=\"pay-input\"&gt;&lt;div class=\"description\"&gt;&lt;p&gt;Actual compensation will be determined based on several non-discriminatory factors including skills, experience, qualifications, and geographic location.&lt;br&gt;In addition to base salary, this role may be eligible for bonus or incentive compensation, equity, and a comprehensive benefits package.&lt;/p&gt;&lt;/div&gt;&lt;div class=\"title\"&gt;Base salary range:&lt;/div&gt;&lt;div class=\"pay-range\"&gt;&lt;span&gt;$107,100&lt;/span&gt;&lt;span class=\"divider\"&gt;—&lt;/span&gt;&lt;span&gt;$154,000 USD&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&lt;strong&gt;A note on AI in our process:&amp;nbsp;&lt;br&gt;&lt;/strong&gt;Abnormal AI uses AI-assisted tools to help our recruiting team prepare for candidate interviews. These tools analyze resume content and role requirements to suggest interview questions and areas for the interviewer to explore. They do not make hiring decisions or screen candidates automatically. Every decision about a candidacy is made by a person. Further, if your application is successful and Abnormal AI makes a conditional offer of employment, we will carry out pre-employment checks which must be successfully completed to progress to a final offer. All processes and pre-employment checks are in line with prevailing legislation and Abnormal AI's policies relevant to our security and privacy standards.&lt;/p&gt; &lt;p&gt;Abnormal AI is an equal opportunity employer. Qualified applicants will receive consideration for employment without regard to race, color, religion, sex, national origin, disability, protected veteran status or other characteristics protected by law. For our EEO policy statement please &lt;a href=\"https://assets.contentstack.io/v3/assets/blt3a076cfd9753fa1f/blt9cbda641db7c0045/6a1e3d3a66aea075cd33e462/AAP_and_EEO_Statement.pdf\"&gt;&lt;span&gt;&lt;em&gt;click here&lt;/em&gt;&lt;/span&gt;&lt;/a&gt;. If you would like more information on your EEO rights under the law, please&amp;nbsp;&lt;em&gt;&lt;span&gt;&lt;a href=\"https://assets.contentstack.io/v3/assets/blt3a076cfd9753fa1f/blt4eb3a265cc7b1ca9/6a1e3d3bfe33e73c16ff026b/EEOC_Know_Your_Rights_Oct_30_2025.pdf\"&gt;click here&lt;/a&gt;&lt;/span&gt;&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/abnormal-critical-situation-manager\"&gt;https://weworkremotely.com/remote-jobs/abnormal-critical-situation-manager&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Mon, 24 Aug 2026 07:30:47 +0000</pubDate> <expires_at>Wed, 23 Sep 2026 07:30:47 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/abnormal-critical-situation-manager</guid> <link>https://weworkremotely.com/remote-jobs/abnormal-critical-situation-manager</link> </item> <item> <title>Grafana Labs: Associate Observability Architect | PST | Remote</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Customer Support</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; United States (Remote) &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;p&gt;Grafana Labs, the company behind the open observability cloud, is founded on the principles of open source, open standards, open ecosystems, and open culture. Grafana Cloud, our fully managed observability platform, is flexible and built for scale. With Grafana Cloud's actually useful AI, organizations can see, understand, and act on all their disparate data to move at the speed of their ambitions. Today, more than 35 million users and 7,000+ customers – including Anthropic, Bloomberg, NVIDIA, Microsoft, and Salesforce – trust Grafana Labs to ensure reliability of their applications and systems, resolve incidents quickly, and optimize their telemetry to reduce noise and cost. We are a 100% remote company with 1,600+ team members across 40+ countries, and we’re backed by leading investors including Lightspeed Venture Partners, Sequoia Capital, GIC, Coatue, J.P. Morgan, CapitalG, and Lead Edge Capital. Learn more at &lt;span&gt;&lt;a href=\"http://grafana.com\"&gt;grafana.com&lt;/a&gt;&lt;/span&gt; and follow us on &lt;span&gt;&lt;a href=\"https://www.linkedin.com/company/grafana-labs/\"&gt;LinkedIn&lt;/a&gt;&lt;/span&gt; and &lt;span&gt;&lt;a href=\"https://twitter.com/grafana\"&gt;X&lt;/a&gt;&lt;/span&gt;.&lt;/p&gt; &lt;p&gt;We’re scaling fast and staying true to what makes us different: an open-source legacy, a global collaborative culture, and a passion for meaningful work. Our team thrives in an innovation-driven environment where transparency, autonomy, and trust fuel everything we do.&lt;/p&gt; &lt;p&gt;You may not meet every requirement, and that’s okay. If this role excites you, we’d love you to raise your hand for what could be a truly career-defining opportunity.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;The Opportunity:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;At Grafana Labs, we’re redefining what post-sales technical partnership looks like—and it starts with the&amp;nbsp;&lt;strong&gt;Observability Architect&lt;/strong&gt;. This is a role for deeply technical experts who are ready to step into strategic leadership with our most important customers. If you thrive at the intersection of systems thinking, architecture design, and customer impact—this is your stage.&lt;/p&gt; &lt;p&gt;As an Observability Architect, you will be the technical owner of long-term customer success. You’ll architect and guide the implementation of complex observability solutions across a wide range of modern infrastructure and application environments. You’ll build strategic relationships with engineers, SREs, and architects—ensuring Grafana’s technology is not just deployed, but &lt;strong&gt;deeply embedded&lt;/strong&gt; into mission-critical systems.&lt;/p&gt; &lt;p&gt;Working hand-in-hand with our Engagement Managers, you’ll lead technical discovery, design, onboarding, and enablement—all with a focus on delivering tangible outcomes. You’ll spot patterns, solve hard problems, and guide customers through their observability maturity curve with authority and clarity.&lt;/p&gt; &lt;p&gt;You’ll also represent the technical voice of our customers internally—shaping product feedback and roadmap priorities by working closely with Engineering and Product Management.&lt;/p&gt; &lt;p&gt;This is a hands-on, high-impact role for those who want to go deep, stay technical, and directly influence customer success at scale. Join us and become part of the most respected observability team in the industry.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What You'll Be Doing:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Serve as the primary technical point of contact for a portfolio of Grafana customers.&lt;/li&gt; &lt;li&gt;Design the observability maturity journey of customers and assist them on that path.&amp;nbsp;&lt;/li&gt; &lt;li&gt;Provide expert-level troubleshooting and guidance to drive adoption.&lt;/li&gt; &lt;li&gt;Conduct regular technical reviews and health checks to ensure client success. Assist in RCA to understand issues that affect customer satisfaction, retention, and overall product experience.&lt;/li&gt; &lt;li&gt;Advise clients on best practices and strategies for leveraging our technology to achieve their business goals&lt;/li&gt; &lt;li&gt;Collaborate with clients to develop and execute technical roadmaps.&lt;/li&gt; &lt;li&gt;Identify opportunities for clients to optimize their cost, expand their use of our solutions and drive adoption of new products and features.&lt;/li&gt; &lt;li&gt;Develop and maintain strong, long-term relationships with key stakeholders.&lt;/li&gt; &lt;li&gt;With the support of our Engagement Managers and Onboarding Solutions Architects, own customer lifecycle.&lt;/li&gt; &lt;li&gt;Drive the adoption and effective use of our product suite within your customer portfolio to maximize their value from our platform and ensure a strong return on investment.&lt;/li&gt; &lt;li&gt;Act as the voice of the customer within the company, advocating for their needs, priorities and feature requests.&lt;/li&gt; &lt;li&gt;Conduct training sessions and workshops to educate clients on our technology.&lt;/li&gt; &lt;li&gt;Develop and deliver technical documentation, guides, and tutorials.&lt;/li&gt; &lt;li&gt;Work alongside account teams to participate in and/or conduct regular reviews with customers to identify areas for improvement, calculate ROI, assess their satisfaction, and discuss upcoming needs and projects.&lt;/li&gt; &lt;li&gt;Prepare and present reports on client metrics, achievements, and areas of focus.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;What Makes You a Great Fit:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Located on the West Coast&lt;/li&gt; &lt;li&gt;Bachelor’s degree in Computer Science, Information Technology, Math or a related field (or equivalent experience).&lt;/li&gt; &lt;li&gt;Experience deploying and operating Kubernetes.&lt;/li&gt; &lt;li&gt;5+ years of experience in a technical support, technical account management, consulting, SE or Professional Services role within the technology industry.&amp;nbsp;&lt;/li&gt; &lt;li&gt;Strong understanding of observability solutions. Grafana, Prometheus, and Loki a plus.&lt;/li&gt; &lt;li&gt;Proven ability to manage multiple clients and projects simultaneously.&lt;/li&gt; &lt;li&gt;Excellent problem-solving and analytical skills.&lt;/li&gt; &lt;li&gt;Outstanding communication and interpersonal skills.&lt;/li&gt; &lt;li&gt;Experience with relevant tools and technologies, e.g., CRM software, ticketing systems, specific programming languages.&lt;/li&gt; &lt;li&gt;Ability to travel as needed to meet with clients (up to 25%).&lt;/li&gt; &lt;li&gt;Identify and provide timely workarounds and solutions to meet a customer’s business needs.&lt;/li&gt; &lt;li&gt;You have some observability expertise, preferably architect level&lt;/li&gt; &lt;li&gt;First class written and oral communication skills to collaborate with our remote-first internal teams and with our worldwide customers.&amp;nbsp; Ability to articulate our value proposition and the technical advantages of our products&lt;/li&gt; &lt;li&gt;You will love solving technical challenges and thrive on bringing creative solutions to our customers&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Bonus Points For:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;2+ years of technical sales, TAM or other post sales technical experience, ideally with open source technologies, or in the observability space.&lt;/li&gt; &lt;li&gt;Great at connecting product usage to value (ROI).&lt;/li&gt; &lt;li&gt;Great at managing customer lifecycle.&lt;/li&gt; &lt;li&gt;You will be creative in solving customer adoption challenges.&lt;/li&gt; &lt;li&gt;You can proactively assist customers with technical issues that may arise and assist in the troubleshooting and root cause analysis.&amp;nbsp;&lt;/li&gt; &lt;li&gt;You should have a technical mindset and a desire to grow technically. Great candidates may be a recent grad of a coding bootcamp or have previous post-sales or engineering experience–we are excited to see what unique experiences and skill sets you bring to the table!&amp;nbsp;&amp;nbsp;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;In the US, the OTE compensation range for this role is $139,000 - $167,000. &amp;nbsp;Actual compensation may vary based on level, experience, and skillset as assessed throughout the interview process. All of our roles include Restricted Stock Units (RSUs), giving every team member ownership in Grafana Labs' success. We believe in shared outcomes—RSUs help us stay aligned and invested as we scale globally.&lt;/p&gt;&lt;div class=\"content-conclusion\"&gt;&lt;div&gt; &lt;p&gt;&lt;em&gt;*Compensation ranges are country specific. If you are applying for this role from a different location than listed above, your recruiter will discuss your specific market’s defined pay range &amp;amp; benefits at the beginning of the process.&lt;/em&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Why You’ll Thrive at Grafana Labs:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;100% Remote, Global Culture -&amp;nbsp;&lt;/strong&gt;As a remote-only company, we bring together talent from around the world, united by a culture of collaboration and shared purpose.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Scaling Organization&lt;/strong&gt; – Tackle meaningful work in a high-growth, ever-evolving environment.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Transparent Communication&lt;/strong&gt; – Expect open decision-making and regular company-wide updates.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Innovation-Driven&lt;/strong&gt; – Autonomy and support to ship great work and try new things.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Open Source Roots&lt;/strong&gt; – Built on community-driven values that shape how we work.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Empowered Teams&lt;/strong&gt; – High trust, low ego culture that values outcomes over optics.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Career Growth Pathways&lt;/strong&gt; – Defined opportunities to grow and develop your career.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Approachable Leadership&lt;/strong&gt; – Transparent execs who are involved, visible, and human.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Passionate People&lt;/strong&gt; – Join a team of smart, supportive folks who care deeply about what they do.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;In-Person onboarding &lt;/strong&gt;- We want you to thrive from day 1 with your fellow new ‘Grafanistas’ to learn all about what we do and how we do it.&amp;nbsp;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Balance is Key&lt;/strong&gt; - We operate a global annual leave policy of 30 days per annum. 3 days of your annual leave entitlement are reserved for Grafana Shutdown Days to allow the team to really disconnect. &lt;em&gt;*We will comply with local legislation where applicable.&lt;/em&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Equal Opportunity Employer:&lt;/strong&gt; &lt;em&gt;Grafana Labs is an equal opportunities employer. We welcome applications from everyone regardless of race, colour, nationality, origin, caste, sex, gender reassignment identity or expression, sexual orientation, age, religion or belief, disability, veteran status, genetic information, pregnancy, maternity, marital, family or carer status, or any other characteristic which is protected by local law. We believe that equality and diversity build a strong organisation, and we work hard to ensure that is the foundation of our organisation as we grow.&lt;/em&gt;&lt;/p&gt; &lt;p&gt;&lt;em&gt;Grafana Labs may utilize AI tools in its recruitment process to assist in matching information provided in CVs to job postings. The recruitment team will continue to review inbound CVs manually to identify alignment with current openings.&lt;/em&gt;&lt;/p&gt; &lt;p&gt;#LI-Remote&lt;/p&gt; &lt;/div&gt; &lt;div&gt;&lt;em&gt;For information about how your personal data is used once you’ve applied to a job, check out our &lt;a href=\"https://grafana.com/legal/applicant-and-candidate-privacy-policy/\"&gt;privacy policy&lt;/a&gt;.&amp;nbsp;&lt;/em&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/grafana-labs-associate-observability-architect-pst-remote\"&gt;https://weworkremotely.com/remote-jobs/grafana-labs-associate-observability-architect-pst-remote&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sun, 23 Aug 2026 07:30:51 +0000</pubDate> <expires_at>Tue, 22 Sep 2026 07:30:51 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/grafana-labs-associate-observability-architect-pst-remote</guid> <link>https://weworkremotely.com/remote-jobs/grafana-labs-associate-observability-architect-pst-remote</link> </item> <item> <title>Customer.io: Director, GTM Finance</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Full-Stack Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Americas Remote &lt;/p&gt; &lt;h3&gt;About &lt;a href=\"http://customer.io/\"&gt;Customer.io&lt;/a&gt;&lt;/h3&gt; &lt;p&gt;Over 9,000 companies — from scrappy startups to global brands — use our platform to send billions of emails, push notifications, in-app messages, and SMS every day. &lt;a href=\"http://Customer.io\"&gt;Customer.io&lt;/a&gt; powers automated communication that people actually want to receive. We help teams send smarter, more relevant messages using real-time behavioral data.&lt;/p&gt; &lt;h3&gt;About the role&lt;/h3&gt; &lt;p&gt;Hi, my name is Diep Nguyen, VP of Finance here at &lt;a href=\"http://customer.io/\"&gt;Customer.io&lt;/a&gt;, and I'm looking for a Director, GTM Finance to own our go-to-market P&amp;amp;L end-to-end as we scale from $100M+ ARR today to $1B+ ARR in the future.&lt;/p&gt; &lt;p&gt;We're hiring for strategic finance horsepower first: someone who builds models from a blank page, challenges assumptions, and earns trust with senior executives. Deep GTM fluency matters just as much — but for a strong finance generalist, that business partnership often shows up in the work rather than the title. You'll own our GTM P&amp;amp;L spanning Sales, Marketing, and Customer Success, and build the team behind it.&lt;/p&gt; &lt;p&gt;We're an AI-forward company: this role requires someone energized by using AI to reinvent how finance operates, not someone who merely tolerates the tools we hand them.&lt;/p&gt; &lt;h3&gt;What we value&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Financial rigor over title-matching&lt;/strong&gt; — we care more about how you've built and defended models than whether \"GTM Finance\" was ever your title.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;AI as genuine practice, not a buzzword&lt;/strong&gt; — we want concrete stories of AI changing an outcome, not familiarity with the tools.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Ownership from day one&lt;/strong&gt; — you'll build and lead a team, not just execute analysis handed to you.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Directness with data&lt;/strong&gt; — you challenge top-down assumptions with account-level evidence, even in uncomfortable conversations.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;What you’ll do&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Own the GTM P&amp;amp;L end-to-end — revenue, gross margin, and opex across Sales, Marketing, and Customer Success — not just a spend-efficiency lens.&lt;/li&gt; &lt;li&gt;Drive unit economics and the growth funnel model — CAC, LTV/CAC, payback, magic number, and cohort/retention analysis across self-serve and sales-assisted motions.&lt;/li&gt; &lt;li&gt;Own the ARR roll-forward, bookings, and revenue forecasting — auditable, reconcilable, and independently stress-tested against top-down assumptions.&lt;/li&gt; &lt;li&gt;Partner with Sales and RevOps on capacity planning, deal economics, and pricing — protecting margin and ARR quality without slowing deal velocity.&lt;/li&gt; &lt;li&gt;Build and own the monthly/quarterly GTM reporting package for the exec team and Board, with variance analysis that explains root cause.&lt;/li&gt; &lt;li&gt;Champion AI-enabled finance workflows and build the GTM finance team as &lt;a href=\"http://Customer.io\"&gt;Customer.io&lt;/a&gt; scales past $250M+ ARR.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;What we're looking for&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;10+ years in FP&amp;amp;A, strategic finance, or related roles at complex, scaled orgs; a first-principles modeler who builds from a blank page rather than inheriting assumptions&lt;/li&gt; &lt;li&gt;Deep GTM business-partnering experience with Sales, Marketing, or Customer Success — regardless of whether \"GTM Finance\" was ever the title&lt;/li&gt; &lt;li&gt;Comfortable with subscription/SaaS metrics (ARR, NRR, CAC, LTV) or able to get there fast&lt;/li&gt; &lt;li&gt;Concrete, demonstrated track record driving AI adoption in finance workflows — not just familiarity with the tools&lt;/li&gt; &lt;li&gt;Proven people leader — has managed and developed finance professionals&lt;/li&gt; &lt;li&gt;Strong Excel skills (with experience using Snowflake a plus) and experience with planning/GTM systems (NetSuite, Salesforce, Gong, Drivetrain)&lt;/li&gt; &lt;li&gt;Bachelor's degree in Finance, Accounting, Economics, or related field; MBA a plus&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Compensation &amp;amp; Benefits&lt;/h3&gt; &lt;p&gt;We believe in transparency. Starting salary for this role is &lt;strong&gt;$200K–$255K USD&lt;/strong&gt; (or equivalent in local currency) depending on experience and subject to market rate adjustment.&lt;/p&gt; &lt;p&gt;We know our people are what make us great, and we’re committed to taking great care of them. Our inclusive benefits package supports your well-being and growth, including &lt;strong&gt;100% coverage of medical, dental, vision, mental health, and supplemental insurance premiums for you and your family&lt;/strong&gt;. We also offer &lt;strong&gt;16 weeks paid parental leave, unlimited PTO&lt;/strong&gt;, stipends for remote work and wellness, a professional development budget, and more.&lt;/p&gt; &lt;p&gt;&lt;a href=\"https://customer.io/careers#:~:text=our%20collective%20success.-,BENEFITS,-Our%C2%A0\"&gt;See full benefits here →&lt;/a&gt;&lt;/p&gt; &lt;h3&gt;Our Process&lt;/h3&gt; &lt;p&gt;No gotchas, no trick questions - just a clear, human process designed to help both of us make an informed decision.&lt;/p&gt; &lt;ol&gt; &lt;li&gt;Recruiter Screen (30 min)&lt;/li&gt; &lt;li&gt;Hiring Manager Screen (45 min)&lt;/li&gt; &lt;li&gt;Two Cross-functional conversations with team members (30 min each)&lt;/li&gt; &lt;li&gt;Case study + Case Review Panel with team (45 min)&lt;/li&gt; &lt;/ol&gt; &lt;p&gt;All final candidates will be asked to complete a background check and employment verifications as part of our pre-employment process.&lt;/p&gt; &lt;p&gt;&lt;a href=\"http://Customer.io\"&gt;Customer.io&lt;/a&gt; recognizes the stifling impact of systemic injustice on diverse communities. We commit to using our influence to increase inclusion and equity within the tech industry. We strive to build an inclusive team culture, implement bias-free hiring practices, and develop community partnerships to expand our global impact.&lt;/p&gt; &lt;p&gt;Zoom is the only video conference platform that we use, virtual interviews will be conducted using the video capability (i.e., not via the chat), and offers will be extended in writing on official &lt;a href=\"http://customer.io/\"&gt;Customer.io&lt;/a&gt; letterhead. Please be vigilant in all of your job search activity, and if you have any questions please contact &lt;a href=\"mailto:jobs@customer.io\"&gt;jobs@customer.io&lt;/a&gt;.&lt;/p&gt; &lt;h3&gt;Join us!&lt;/h3&gt; &lt;p&gt;Check out our&amp;nbsp;&lt;a href=\"https://customer.io/careers/\"&gt;careers page&lt;/a&gt;&amp;nbsp;for more information about why you should&amp;nbsp;&lt;a href=\"https://customer.io/about/\"&gt;come work with us!&lt;/a&gt; We believe in empathy, transparency, responsibility, and, yes, a little awkwardness. If you’re excited by what you read — apply now.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/customer-io-director-gtm-finance\"&gt;https://weworkremotely.com/remote-jobs/customer-io-director-gtm-finance&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sun, 23 Aug 2026 07:30:51 +0000</pubDate> <expires_at>Tue, 22 Sep 2026 07:30:51 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/customer-io-director-gtm-finance</guid> <link>https://weworkremotely.com/remote-jobs/customer-io-director-gtm-finance</link> </item> <item> <title>GitLab: AI Transformation Owner, Product &amp; Design</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Product</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote, Canada; Remote, United Kingdom; Remote, United States &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;p&gt;GitLab is the intelligent orchestration platform for DevSecOps. GitLab enables organizations to increase developer productivity, improve operational efficiency, reduce security and compliance risk, and accelerate digital transformation. More than 50 million registered users and more than 50% of the Fortune 100* trust GitLab to ship better, more secure software faster.&lt;/p&gt; &lt;p&gt;The same principles built into our products are reflected in how our team works: we embrace AI as a core productivity multiplier, with all team members expected to incorporate AI into their daily workflows to drive efficiency, innovation, and impact. GitLab is where careers accelerate, innovation flourishes, and every voice is valued. Our high-performance culture is driven by our values&amp;nbsp;and continuous knowledge exchange, enabling our team members to reach their full potential while collaborating with industry leaders to solve complex problems. &lt;a href=\"https://www.youtube.com/watch?v=OuZIb5zszQI\"&gt;Co-create the future with us&lt;/a&gt; as we build technology that transforms how the world develops software.&lt;/p&gt; &lt;p&gt;*&lt;em&gt;Fortune 500® is a registered trademark of Fortune Media IP Limited, used under license. Claim based on GitLab data. Fortune 100 refers to the top 20% ranked companies in the 2025 Fortune 500 list, published in June 2025. Fortune and Fortune Media IP Limited are not affiliated with, and do not endorse products or services of GitLab.&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;&lt;h2&gt;An overview of this role&lt;/h2&gt; &lt;p&gt;As an AI Transformation Owner at GitLab, you'll shape your function's AI strategy and build the solutions that deliver it. You are the person responsible for identifying where AI can fundamentally change how your org operates, partnering with your Executive Sponsor to align on the biggest challenges, and driving measurable outcomes against them.&lt;/p&gt; &lt;p&gt;Think of this as a product management role where the product is your org's way of working. You'll manage the full lifecycle: understanding how work flows today, deciding where AI should reshape it, prioritizing what gets built and in what order, and ensuring what ships actually gets adopted. You'll also prototype solutions, configure agents, and prove what's possible before pulling in engineering support to scale it.&lt;/p&gt; &lt;p&gt;You will work closely with an AI Engineer who sits within the Enterprise AI team. Together you form a partnership: you bring the business context, process intelligence, and strategic prioritization. They bring the technical depth, production-grade delivery, and architecture decisions. You'll build working solutions at the no-code and low-code layer, and partner with the AI Engineer on the right approach, tooling, and structure.&lt;/p&gt; &lt;h2&gt;What you'll do&lt;/h2&gt; &lt;h3&gt;Strategy &amp;amp; Prioritization&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Own your function's AI strategy,&lt;/strong&gt; aligned with your Executive Sponsor and business priorities. Understand which metrics matter to the org, identify what will move the needle, define how you'll measure impact, and track progress over time.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Map how work flows&lt;/strong&gt; across your function end-to-end, including the handoffs upstream and downstream to other orgs. Identify where the real constraints are, not just the ones your team can see. Focus on the 100x problems: where could leveraging AI in a workflow let your org execute it orders of magnitude faster, or at 100x more volume than before?&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Manage intake&lt;/strong&gt; of AI requests, ideas, and pain points from across the function, including via your Champion network. Ensure every team member has a clear route to surface what they need, rather than building independently.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Prioritize strategically&lt;/strong&gt; against business outcomes and executive guidance. Hold the line on priorities - we cannot change direction every two weeks - and ensure the AI Engineer's time is spent on the highest-impact work.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Adoption &amp;amp; Change Management&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Reimagine, not just automate.&lt;/strong&gt; Challenge your org to think beyond injecting AI into existing workflows. Work with Enterprise AI to spot opportunities to fundamentally rethink how work gets done.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Drive adoption and change management&lt;/strong&gt; together with the AI Engineer. The best AI solution is worthless if nobody uses it. Create the channels, rituals, and feedback loops that make AI visible in your function: shared spaces for teams to show what they've built, regular office hours, onboarding for new hires, and celebration of wins. Own the rollout and iteration needed to make AI initiatives stick.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Coordinate with Enterprise AI&lt;/strong&gt; to ensure your function benefits from patterns, tools, and learnings emerging across other parts of the business.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Build and bridge the Champion network in your function.&lt;/strong&gt; Champions are the peer community that extends your reach beyond what you and the AI Engineer can deliver directly. From early in the role, identify and recruit Champions across sub-teams (5-10% time, formally agreed with their manager), run a regular Champion sync, host demos to the wider function, and act as their bridge to Enterprise AI. Champions are not your reports: you coordinate them, you don't manage them. Without this network, your reach is capped.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Hands-On Building &amp;amp; Agent Operations&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Build AI agents&lt;/strong&gt; using no-code and low-code platforms (e.g. Glean, Workato, similar tools). Go from idea to working prototype without waiting for engineering.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Author and iterate on skills files&lt;/strong&gt; that define how AI agents behave. Refine instructions based on real usage and share reusable skills across the function.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Configure MCP servers and tools,&lt;/strong&gt; giving agents access to the business systems they need. Partner with the AI Engineer on what to connect and how to do it securely.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Own your function's fleet of agents.&lt;/strong&gt; Some agents will be used directly by people in your org. Those that aren't, you own. Either way, you're accountable for their performance: tracking KPIs, running evaluations after model or data changes, and iterating based on what you learn.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Expect to rebuild.&lt;/strong&gt; AI tools and models evolve fast. The agent you built last month may need to be replaced, not patched. You should be comfortable sunsetting your own work when a better approach emerges, and helping your org stay current rather than attached to what exists today.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;What you'll bring&lt;/h2&gt; &lt;h3&gt;Business &amp;amp; Strategic&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Deep knowledge of your function's operations.&lt;/strong&gt; You understand how work moves through your org, where it gets stuck, and why. You can trace a process end-to-end and explain how it connects to the teams around it.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Strategic prioritization skills.&lt;/strong&gt; You've managed competing demands before and can make hard calls about what matters most. You think in terms of business outcomes, not activity.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;A product management mindset.&lt;/strong&gt; You naturally think about intake, backlog, iteration, and adoption. You're comfortable defining success metrics and holding yourself accountable to them.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Strong communication and influence.&lt;/strong&gt; You'll be the person saying \"not yet\" to some teams and \"think bigger\" to others. You need the credibility and interpersonal skills to make both of those conversations land.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Cross-functional instincts.&lt;/strong&gt; You default to understanding how your org's processes affect and are affected by the teams around you - not just optimising in isolation.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Experience building peer networks or communities of practice.&lt;/strong&gt; You've recruited and sustained volunteer contributors before, whether as a guild lead, champion program owner, or community organizer. You know how to motivate people whose time you don't directly own.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Hands-On &amp;amp; Technical&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Comfortable building with AI tools.&lt;/strong&gt; You don't need to write production code, but you should be able to build a working agent, configure a skill, connect an MCP server, and troubleshoot when something isn't working. Think: power user, not software engineer.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Ready to learn fast.&lt;/strong&gt; Experience with or willingness to quickly pick up no-code/low-code AI platforms, prompt engineering, and agent configuration. You'll be trained on GitLab's specific tooling, but you should arrive ready to get your hands dirty.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Strong conceptual understanding of AI capabilities&lt;/strong&gt; - summarization, classification, generation, automation, agentic workflows - and a commitment to staying current. The landscape shifts constantly. The tools you use today may be obsolete in weeks. You stay on top of new developments so that your org's AI strategy reflects what's actually possible, not what was possible six months ago.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Ability to map data flows&lt;/strong&gt; - structured and unstructured. Understand where agents need context, and figure out where humans should interface with automated workflows and at what steps.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;About the team&lt;/h2&gt; &lt;p&gt;You will partner closely with Enterprise AI within the Enterprise Technology &amp;amp; AI organization, while remaining embedded in your own function. Enterprise AI provides the technical delivery capability, platforms, and patterns. You provide the business context, prioritization, building at the no-code layer, and adoption muscle. Together, you form the core of your function's AI transformation.&lt;/p&gt;&lt;div class=\"content-pay-transparency\"&gt;&lt;div class=\"pay-input\"&gt;&lt;div class=\"description\"&gt;&lt;p&gt;&lt;em&gt;The base salary range for this role’s listed level is currently for residents of the&amp;nbsp;United States only. This range is intended to reflect the role's base salary rate in locations throughout the US.&amp;nbsp;Grade level and salary ranges are determined through interviews and a review of education, experience, knowledge, skills, abilities of the applicant, equity with other team members, alignment with market data,&amp;nbsp;and geographic location.&amp;nbsp;The base salary range does not include any bonuses, equity, or benefits. See more information on our &lt;a class=\"waffle-rich-text-link\" href=\"https://about.gitlab.com/handbook/total-rewards/benefits/general-and-entity-benefits/\"&gt;benefits&lt;/a&gt;&lt;span&gt; and &lt;/span&gt;&lt;a class=\"waffle-rich-text-link\" href=\"https://about.gitlab.com/handbook/stock-options/\"&gt;equity&lt;/a&gt;. Sales roles are also eligible for incentive pay targeted at up to 100% of the offered base salary.&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=\"title\"&gt;United States Salary Range&lt;/div&gt;&lt;div class=\"pay-range\"&gt;&lt;span&gt;$203,200&lt;/span&gt;&lt;span class=\"divider\"&gt;—&lt;/span&gt;&lt;span&gt;$345,600 USD&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"content-conclusion\"&gt;&lt;h4&gt;&lt;strong&gt;How GitLab Supports Full-Time Employees&lt;/strong&gt;&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;&lt;a href=\"https://about.gitlab.com/handbook/total-rewards/benefits/general-and-entity-benefits/\"&gt;Benefits to support your health, finances, and well-being&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a href=\"https://handbook.gitlab.com/handbook/people-group/time-off-and-absence/time-off-types/#flexible-paid-time-off-pto\"&gt;Flexible Paid Time Off&amp;nbsp;&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a href=\"https://handbook.gitlab.com/handbook/company/culture/inclusion/tmrg-tmag/\"&gt;Team Member Resource Groups&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a href=\"https://handbook.gitlab.com/handbook/total-rewards/stock-options/\"&gt;Equity Compensation &amp;amp; Employee Stock Purchase Plan&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a href=\"https://handbook.gitlab.com/handbook/people-group/learning-and-development/growth-and-development/\"&gt;Growth and Development Fund&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a href=\"https://about.gitlab.com/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave\"&gt;Parental Leave&lt;/a&gt;&amp;nbsp;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Please note that we welcome interest from candidates with varying levels of experience; many successful candidates do not meet every single requirement. Additionally, studies have shown that people from &lt;a href=\"https://about.gitlab.com/company/culture/inclusion/#examples-of-select-underrepresented-groups\"&gt;underrepresented groups&lt;/a&gt; are less likely to apply to a job unless they meet every single qualification. If you're excited about this role, please apply and allow our recruiters to assess your application.&lt;/p&gt; &lt;hr&gt; &lt;p&gt;&lt;strong&gt;Country Hiring Guidelines: &lt;/strong&gt;GitLab hires new team members in countries around the world. All of our roles are remote, however some roles may carry specific location-based eligibility requirements. Our Talent Acquisition team can help answer any questions about location after starting the recruiting process.&amp;nbsp;&amp;nbsp;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Privacy Policy: &lt;/strong&gt;Please review our &lt;a href=\"https://handbook.gitlab.com/handbook/hiring/candidate-faq/recruitment-privacy-policy/\"&gt;Recruitment Privacy Policy.&lt;/a&gt; Your privacy is important to us.&lt;/p&gt; &lt;p&gt;GitLab is proud to be an equal opportunity workplace and is an affirmative action employer. GitLab’s policies and practices relating to recruitment, employment, career development and advancement, promotion, and retirement are based solely on merit, regardless of race, color, religion, ancestry, sex (including pregnancy, lactation, sexual orientation, gender identity, or gender expression), national origin, age, citizenship, marital status, mental or physical disability, genetic information (including family medical history), discharge status from the military, protected veteran status (which includes disabled veterans, recently separated veterans, active duty wartime or campaign badge veterans, and Armed Forces service medal veterans), or any other basis protected by law. GitLab will not tolerate discrimination or harassment based on any of these characteristics. See also&amp;nbsp;&lt;a href=\"https://about.gitlab.com/handbook/people-policies/inc-usa/#equal-employment-opportunity-policy\"&gt;GitLab’s EEO Policy&lt;/a&gt;&amp;nbsp;and&amp;nbsp;&lt;a href=\"https://about.gitlab.com/handbook/labor-and-employment-notices/#eeoc-us-equal-employment-opportunity-commission-notices\"&gt;EEO is the Law&lt;/a&gt;. If you have a disability or special need that requires&amp;nbsp;&lt;a href=\"https://about.gitlab.com/handbook/people-policies/inc-usa/#reasonable-accommodation\"&gt;accommodation&lt;/a&gt;, please let us know during the&amp;nbsp;&lt;a href=\"https://about.gitlab.com/handbook/hiring/interviewing/#adjustments-to-our-interview-process\"&gt;recruiting process&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/gitlab-ai-transformation-owner-product-design\"&gt;https://weworkremotely.com/remote-jobs/gitlab-ai-transformation-owner-product-design&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sun, 23 Aug 2026 07:30:51 +0000</pubDate> <expires_at>Tue, 22 Sep 2026 07:30:51 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/gitlab-ai-transformation-owner-product-design</guid> <link>https://weworkremotely.com/remote-jobs/gitlab-ai-transformation-owner-product-design</link> </item> <item> <title>Customer.io: Contract Legal Assistant</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>All Other Remote</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Americas Remote &lt;/p&gt; &lt;h2&gt;General overview&lt;/h2&gt; &lt;p&gt;Hi! I’m Dessa, General Counsel here at&amp;nbsp;&lt;a href=\"http://customer.io/\"&gt;Customer.io&lt;/a&gt;, and I’m looking for an amazing Legal Assistant contractor to join our small, but mighty Legal team. We’re excited to have the opportunity to add you to the team and teach you the ins-and-outs of a small legal department.&lt;/p&gt; &lt;p&gt;&lt;a href=\"http://customer.io/\"&gt;Customer.io&lt;/a&gt;’s Legal team is seeking a highly motivated Legal Assistant contractor to join our growing and innovative legal team. Reporting to the General Counsel, this role offers a unique opportunity to gain practical, hands-on experience in a fast-paced SaaS environment. You’ll work closely with the General Counsel, Legal Ops Manager, and Paralegal, contributing to a wide range of projects that support the company’s legal, compliance, and operational initiatives.&lt;/p&gt; &lt;p&gt;As a Legal Assistant contractor, you will tackle projects that directly support Legal’s goals—such as contract management, legal operations, and privacy compliance—while collaborating with cross-functional teams, honing your technical skills, and receiving mentorship.&lt;/p&gt; &lt;p&gt;You’ll gain hands-on experience with contract lifecycle management tools like LinkSquares, support privacy and security assessments, and develop strong organizational and communication skills. You’ll also learn best practices in legal operations, contract negotiations, and remote collaboration within a fast-paced SaaS environment.&lt;/p&gt; &lt;h2&gt;Some of the things you'll do&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Assist with contract organization and data hygiene as part of our legacy migration project to LinkSquares.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Review and archive legacy and outdated templates and documents from Google Drive to streamline internal file systems.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Shadow the General Counsel and Paralegal in real-time contract negotiations and related stakeholder interactions.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Support the legal team in managing shared inboxes, including triaging, tagging, and responding to routine inquiries.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Initiate and coordinate customer security assessments using Conveyor and other intake tools.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;About You&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Interest in corporate, contract, or technology law.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Strong organizational skills and attention to detail.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Ability to handle confidential information with discretion.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Excellent written and verbal communication skills.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;What we're looking for&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Interest or experience in legal tech platforms (e.g., LinkSquares, Conveyor) is a plus.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Logistics&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Hours&lt;/strong&gt;: 40 hours/week at $30–$35/hour&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Location&lt;/strong&gt;: Remote&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Contract&lt;/strong&gt;: Temporary coverage through the end of 2026&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Collaboration&lt;/strong&gt;: Works closely with the General Counsel, Legal Ops Manager, and Paralegal&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;All final candidates will be asked to complete a background check and employment verifications as part of our pre-employment process.&lt;/p&gt; &lt;p&gt;&lt;a href=\"http://customer.io/\"&gt;Customer.io&lt;/a&gt; recognizes the stifling impact of systemic injustice on diverse communities. We commit to using our influence to increase inclusion and equity within the tech industry. We strive to build an inclusive team culture, implement bias-free hiring practices, and develop community partnerships to expand our global impact.&lt;/p&gt; &lt;p&gt;Zoom is the only video conference platform that we use, virtual interviews will be conducted using the video capability (i.e., not via the chat), and offers will be extended in writing on official &lt;a href=\"http://customer.io/\"&gt;Customer.io&lt;/a&gt; letterhead. Please be vigilant in all of your job search activity, and if you have any questions please contact &lt;a href=\"mailto:jobs@customer.io\"&gt;jobs@customer.io&lt;/a&gt;.&lt;/p&gt; &lt;h3&gt;Join us!&lt;/h3&gt; &lt;p&gt;We believe in empathy, transparency, responsibility, and, yes, a little awkwardness. If you’re excited by what you read and want to build software that makes communication better for everyone—apply now.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/customer-io-contract-legal-assistant\"&gt;https://weworkremotely.com/remote-jobs/customer-io-contract-legal-assistant&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sun, 23 Aug 2026 07:30:51 +0000</pubDate> <expires_at>Tue, 22 Sep 2026 07:30:51 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/customer-io-contract-legal-assistant</guid> <link>https://weworkremotely.com/remote-jobs/customer-io-contract-legal-assistant</link> </item> <item> <title>LaunchDarkly: Engineering Manager, Experimentation</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Design</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote - US &lt;/p&gt; &lt;h4&gt;&lt;strong&gt;About the Job:&lt;/strong&gt;&lt;/h4&gt; &lt;p&gt;We're looking for an Engineering Manager for our Experimentation team. In this role, you'll lead the team that builds and operates the core Experimentation product, from setup to results processing and display.&lt;/p&gt; &lt;p&gt;LaunchDarkly’s Experimentation team is building one of the company’s most strategic product areas: a platform that helps leading engineering organizations move beyond intuition and make product decisions with real statistical confidence. Sitting at the intersection of large-scale systems, data science, and user experience, the team is creating a best-in-class experimentation product that lets customers set up, manage, and analyze experiments with ease while still earning the trust of even the most rigorous data teams. From warehouse-native analysis to experimentation workflows built on top of LaunchDarkly’s massive feature management scale, this team is tackling ambitious technical problems with visible customer impact and a clear opportunity to define the future of modern software experimentation&lt;/p&gt; &lt;p&gt;As the Engineering Manager, you'll bring a balance of people management and technical leadership as you drive the development of the multiple services that power this product and foster a high-performing, collaborative engineering culture.&lt;/p&gt; &lt;h4&gt;Responsibilities:&lt;/h4&gt; &lt;ul class=\"ak-ul\"&gt; &lt;li&gt; &lt;p&gt;Lead and develop a team of engineers, providing coaching, feedback, and career growth opportunities&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Partner with PM and Design to scope, estimate, and sequence roadmap items, making scope tradeoffs in real time.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Own the team's delivery of features, ensuring completion within timelines and quality requirements.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Collaborate with adjacent teams (Warehouse Integrations, Metrics, and Guardian) on shared infrastructure decisions and cross-team dependencies&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Communicate roadmaps, risks, and progress clearly to engineering leadership and cross-functional stakeholders&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Build team working norms that promote collaboration, reduce silos, and keep engineers engaged&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Drive operational excellence — improve reliability, observability, and incident response for production data infrastructure&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Participate in hiring to grow the team and raise the engineering bar&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h4&gt;Qualifications:&lt;/h4&gt; &lt;ul class=\"ak-ul\"&gt; &lt;li&gt; &lt;p&gt;3+ years of experience in software engineering, with at least 2 years managing a team of backend or infrastructure engineers&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Proven ability to partner with Product Management to translate business goals into engineering plans with reliable estimations&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Strong communication skills, especially in distributed team environments with cross-timezone collaboration&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Track record of coaching and developing engineers, including performance management, career growth planning, and technical mentorship&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Familiarity with observability practices (metrics, tracing, alerting, structured logging) and comfort with production incident response&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience with Go or comparable backend languages (Java, Python, Rust) is a plus&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Familiarity with data warehouse platforms (Snowflake, Redshift, BigQuery, Databricks) and data pipeline tooling (Airflow, Prequel) is a plus&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;div&gt; &lt;p class=\"p1\"&gt;&lt;strong&gt;Pay:&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"p1\"&gt;&lt;em&gt;Target pay ranges based on Geographic Zones* for Level 2:&lt;/em&gt;&lt;/p&gt; &lt;ul class=\"ul1\"&gt; &lt;li class=\"li1\"&gt;Zone 1: &lt;em&gt;San Francisco/Bay Area or NYC Metropolitan Area, Boston, Seattle&lt;/em&gt; - $191,800 - $263,670**&lt;/li&gt; &lt;li class=\"li1\"&gt;Zone 2:&lt;em&gt; Irvine, LA, Monterey, Santa Barbara, Santa Rosa, Austin, Portland, Philadelphia, Chicago - &lt;/em&gt;$172,600 - $237,270**&lt;/li&gt; &lt;li class=\"li1\"&gt;Zone 3: &lt;em&gt;All other US locations - &lt;/em&gt;$163,000 - $224,070**&lt;/li&gt; &lt;li class=\"li1\"&gt;All Zones Inclusive of a 10% Bonus Target&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"p1\"&gt;&lt;em&gt;LaunchDarkly operates from a place of high trust and transparency; we are happy to state the pay range for our open roles to best align with your needs. Exact compensation may vary based on skills, experience, and location.&lt;/em&gt;&lt;/p&gt; &lt;p class=\"p1\"&gt;&lt;em&gt;*Within the United States, our geographic pay zones are defined by counties surrounding major metropolitan areas.&lt;/em&gt;&lt;br&gt;&lt;em&gt;**Restricted Stock Units (RSUs), health, vision, and dental insurance, and mental health benefits in addition to salary.&lt;/em&gt;&lt;/p&gt; &lt;/div&gt; &lt;h4&gt;&lt;strong&gt;About LaunchDarkly:&lt;/strong&gt;&lt;/h4&gt; &lt;p&gt;Modern software delivery was supposed to be the foundation for a thriving digital business but reality has proven otherwise. Slow, inefficient development cycles, costly outages, and fragmented customer experiences are preventing developers from building their best software. The LaunchDarkly platform helps developers innovate on new features faster while protecting them with a safety valve to instantly rewind when things go wrong. Developers can target product experiences to any customer segment and maximize the business impact of every feature. And by gradually rolling out new application components, they escape nightmare \"big-bang\" technology migrations.&amp;nbsp;&lt;/p&gt; &lt;p&gt;The LaunchDarkly platform was built to guide engineers to the next frontier of DevOps by:&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Improving the velocity and stability of software releases, without the fear of end customer outages&lt;/li&gt; &lt;li&gt;Delivering targeted experiences by easily personalizing features to customer cohorts&lt;/li&gt; &lt;li&gt;Maximizing the business impact of every feature through the ability to experiment and optimize&lt;/li&gt; &lt;li&gt;Coordinating the release and optimization of software to provide consistent experiences across mobile platforms and device types&lt;/li&gt; &lt;li&gt;Improving the effectiveness and productivity of engineering teams, by providing insights into engineering cadence and stability&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;At LaunchDarkly, we believe in the power of teams. We're building a team that is humble, open, collaborative, respectful and kind. We are an equal opportunity employer and value diversity at our company. We do not discriminate on the basis of race, religion, color, national origin, gender, gender identity, sexual orientation, age, marital status, veteran status, or disability status. LD invites any applicant to review our written Affirmative Action Plan. To do so, contact People Ops at &lt;span class=\"link-annotation-unknown-block-id--893544457\"&gt;&lt;a href=\"mailto:hr@launchdarkly.com\"&gt;hr@launchdarkly.com&lt;/a&gt;&lt;/span&gt;.&amp;nbsp;&lt;/p&gt; &lt;p class=\"p1\"&gt;&lt;span class=\"s1\"&gt;&lt;strong&gt;Do you need a disability accommodation?&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt; &lt;p class=\"p1\"&gt;Fill out this&amp;nbsp;&lt;a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdYb_7upYMtdRVXzvXGHGfQw0pU2FNma-6Rwp-I6NjKm7SYNw/viewform\"&gt;&lt;span class=\"s2\"&gt;accommodations request form&lt;/span&gt;&lt;/a&gt;&amp;nbsp;and someone from our People Operations team will contact you for assistance.&amp;nbsp;&lt;/p&gt; &lt;p class=\"p1\"&gt;&lt;strong&gt;Your safety matters to us.&lt;/strong&gt; To protect yourself from potential scams, LaunchDarkly recruiters will only contact you from @&lt;a href=\"http://launchdarkly.com\"&gt;launchdarkly.com&lt;/a&gt; email addresses or via LinkedIn from \"Verified Recruiter\" accounts. Be cautious of emails from other domains.&amp;nbsp; Legitimate LaunchDarkly recruiters will never ask for money, fees, or banking information before making a job offer. LaunchDarkly will never make a job offer without conducting a formal interview process. Our interview process does not involve asking detailed questions by email. If you are ever unsure about a communication that you receive, don't click any links—visit &lt;a href=\"https://launchdarkly.com/careers/\"&gt;Careers | LaunchDarkly&lt;/a&gt;&amp;nbsp; directly for confirmed job openings and links to apply.&lt;br&gt;&lt;br&gt;Please notify us of any fraudulent representation by sending an email to &lt;a href=\"mailto:careers@launchdarkly.com\"&gt;careers@launchdarkly.com&lt;/a&gt;.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/launchdarkly-engineering-manager-experimentation\"&gt;https://weworkremotely.com/remote-jobs/launchdarkly-engineering-manager-experimentation&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sat, 22 Aug 2026 07:31:08 +0000</pubDate> <expires_at>Mon, 21 Sep 2026 07:31:08 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/launchdarkly-engineering-manager-experimentation</guid> <link>https://weworkremotely.com/remote-jobs/launchdarkly-engineering-manager-experimentation</link> </item> <item> <title>LaunchDarkly: Commercial Counsel</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>All Other Remote</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote - US &lt;/p&gt; &lt;h4&gt;&lt;strong&gt;About the Job:&lt;/strong&gt;&lt;/h4&gt; &lt;p&gt;The LaunchDarkly legal team is expanding to support our rapidly growing company. You'll be reporting to the VP Legal, Commercial and joining a small (&lt;em&gt;&lt;strong&gt;but mighty&lt;/strong&gt;&lt;/em&gt;) Legal team. You will be asked to leverage your contract negotiation and drafting skills and to collaborate cross-functionally with other teams at LaunchDarkly, all while working in a fast-paced and rapidly changing environment. You will support the Sales organization by drafting, negotiating, and closing commercial transactions for the purchase of LaunchDarkly’s SaaS products. You will also manage a variety of vendor, channel, and partnership contracts. We are building a best-in-class Legal team that is focused on a culture of collective success, excellent customer service, and partnership with the business. The right candidate will be comfortable with the technology required to stay connected to the team and our internal customers across multiple time zones.&amp;nbsp;&lt;strong&gt;Must be based in or able to work primarily within Eastern Time Zone hours to support EMEA customers.&lt;/strong&gt;&lt;/p&gt; &lt;h4&gt;Responsibilities:&lt;/h4&gt; &lt;ul class=\"ak-ul\"&gt; &lt;li&gt; &lt;p&gt;Independently negotiate a variety of customer-related agreements including SaaS agreements, data processing agreements (DPAs), distribution/partner agreements, NDAs, and other transactions relating to the distribution and sale of LaunchDarkly’s products and services.&amp;nbsp;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Independently negotiate and manage vendor contracts.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Provide clear and pragmatic legal advice to non-lawyers on contract terms, including security and data privacy requirements.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Actively participate in creation and maintenance of contracting resources such as contract templates, playbooks and handbooks.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Participate in projects to improve internal processes and scale the department, including the development of associated training materials.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Develop a close working relationship with business stakeholders to facilitate efficient and effective review of agreements and deliver solutions-oriented legal advice across internal functions.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Educate, counsel, and train business owners and senior management on identified legal, regulatory and compliance risks.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Assist with implementation and maintenance of a contracts management system.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Advise and assist with LaunchDarkly’s general legal needs as needed.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Contribute to a positive team environment.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h4&gt;Qualifications:&lt;/h4&gt; &lt;ul class=\"ak-ul\"&gt; &lt;li&gt; &lt;p&gt;Graduate of an ABA-accredited law school (&lt;span&gt;JD&lt;/span&gt;) and bar admission in good standing in your practice jurisdiction.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;4 years of relevant sales-side transactional experience at a law firm or in-house (some in-house experience preferred), ideally with international exposure.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Understanding of SaaS contracting models, including data privacy and revenue recognition issues.&lt;/p&gt; &lt;/li&gt; &lt;li&gt;Must be based in or able to work primarily within Eastern Time Zone hours to support EMEA customers.&lt;/li&gt; &lt;li&gt; &lt;p&gt;Proven drafting skills with an eye for detail and efficiency in drafting.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Negotiation skills that include the ability to explain the company positions and policies effectively and succinctly.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Strong sense of flexibility and ability to use judgment even in ambiguous situations.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Sense of urgency, with ability to work well under pressure, manage multiple projects with competing priorities, meet deadlines, and adapt to change within a rapidly growing company.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A track record of positive collaborative experiences and cross-functional projects.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Strong internal / external customer service skills.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Team player with a high level of professionalism and commitment to developing strong relationships with colleagues, internal clients, and teams across the business.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A love of learning, a curious mind, and a good sense of humor.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Nice to Have:&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;ul class=\"ak-ul\"&gt; &lt;li&gt; &lt;p&gt;Strong preference for prior experience with a rapidly growing company&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Previous exposure to data security and privacy laws (e.g. &lt;span&gt;&lt;span class=\"_kqswh2mm\"&gt;&lt;span class=\"_5pioz8co _189e1dm9 _1il9buyh _19lc184f _d0altlke\"&gt;GDPR&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;, &lt;span&gt;&lt;span class=\"_kqswh2mm\"&gt;&lt;span class=\"_5pioz8co _189e1dm9 _1il9buyh _19lc184f _d0altlke\"&gt;CCPA&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;)&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience in project management of cross-functional initiatives&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience using and/or implementing Ironclad&amp;nbsp;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience using DocuSign, Confluence, and/or Salesforce/&lt;span&gt;CPQ&lt;/span&gt;&amp;nbsp;&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p class=\"p1\"&gt;&lt;strong&gt;Pay:&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"p1\"&gt;&lt;em&gt;Target pay ranges based on Geographic Zones* for Level 3:&amp;nbsp;&lt;/em&gt;&lt;/p&gt; &lt;ul class=\"ul1\"&gt; &lt;li class=\"li1\"&gt;Zone 1: &lt;em&gt;San Francisco/Bay Area or NYC Metropolitan Area, Boston, Seattle&lt;/em&gt; -&lt;em&gt; $&lt;span class=\"collapsed-field-text\"&gt;136,000 - $187,000&lt;/span&gt;**&lt;/em&gt;&lt;/li&gt; &lt;li class=\"li1\"&gt;Zone 2:&lt;em&gt; Irvine, LA, Monterey, Santa Barbara, Santa Rosa, Austin, Portland, Philadelphia, Chicago - $&lt;span class=\"collapsed-field-text\"&gt;122,000 - $168,000&lt;/span&gt;&lt;/em&gt;**&lt;/li&gt; &lt;li class=\"li1\"&gt;Zone 3: &lt;em&gt;All other US locations - $&lt;span class=\"collapsed-field-text\"&gt;116,000 - $159,000&lt;/span&gt;&lt;/em&gt;**&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"p1\"&gt;&lt;em&gt;LaunchDarkly operates from a place of high trust and transparency; we are happy to state the pay range for our open roles to best align with your needs. Exact compensation may vary based on skills, experience, and location.&lt;/em&gt;&lt;/p&gt; &lt;p class=\"p1\"&gt;&lt;em&gt;*Within the United States, our geographic pay zones are defined by counties surrounding major metropolitan areas.&lt;/em&gt;&lt;br&gt;&lt;em&gt;**Restricted Stock Units (RSUs), health, vision, and dental insurance, and mental health benefits in addition to salary.&lt;/em&gt;&lt;/p&gt; &lt;h4&gt;&lt;strong&gt;About LaunchDarkly:&lt;/strong&gt;&lt;/h4&gt; &lt;p&gt;Modern software delivery was supposed to be the foundation for a thriving digital business but reality has proven otherwise. Slow, inefficient development cycles, costly outages, and fragmented customer experiences are preventing developers from building their best software. The LaunchDarkly platform helps developers innovate on new features faster while protecting them with a safety valve to instantly rewind when things go wrong. Developers can target product experiences to any customer segment and maximize the business impact of every feature. And by gradually rolling out new application components, they escape nightmare \"big-bang\" technology migrations.&amp;nbsp;&lt;/p&gt; &lt;p&gt;The LaunchDarkly platform was built to guide engineers to the next frontier of DevOps by:&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Improving the velocity and stability of software releases, without the fear of end customer outages&lt;/li&gt; &lt;li&gt;Delivering targeted experiences by easily personalizing features to customer cohorts&lt;/li&gt; &lt;li&gt;Maximizing the business impact of every feature through the ability to experiment and optimize&lt;/li&gt; &lt;li&gt;Coordinating the release and optimization of software to provide consistent experiences across mobile platforms and device types&lt;/li&gt; &lt;li&gt;Improving the effectiveness and productivity of engineering teams, by providing insights into engineering cadence and stability&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;At LaunchDarkly, we believe in the power of teams. We're building a team that is humble, open, collaborative, respectful and kind. We are an equal opportunity employer and value diversity at our company. We do not discriminate on the basis of race, religion, color, national origin, gender, gender identity, sexual orientation, age, marital status, veteran status, or disability status. LD invites any applicant to review our written Affirmative Action Plan. To do so, contact People Ops at &lt;a class=\"notion-link-token notion-focusable-token notion-enable-hover\" href=\"mailto:hr@launchdarkly.com\"&gt;&lt;span class=\"link-annotation-unknown-block-id--893544457\"&gt;hr@launchdarkly.com&lt;/span&gt;&lt;/a&gt;.&amp;nbsp;&lt;/p&gt; &lt;p class=\"p1\"&gt;&lt;span class=\"s1\"&gt;&lt;strong&gt;Do you need a disability accommodation?&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt; &lt;p class=\"p1\"&gt;Fill out this&amp;nbsp;&lt;a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdYb_7upYMtdRVXzvXGHGfQw0pU2FNma-6Rwp-I6NjKm7SYNw/viewform\"&gt;&lt;span class=\"s2\"&gt;accommodations request form&lt;/span&gt;&lt;/a&gt;&amp;nbsp;and someone from our People Operations team will contact you for assistance.&amp;nbsp;&lt;/p&gt; &lt;p class=\"p1\"&gt;&lt;strong&gt;Your safety matters to us.&lt;/strong&gt; To protect yourself from potential scams, LaunchDarkly recruiters will only contact you from &lt;a href=\"https://launchdarkly.slack.com/team/UKEE4GBS6\"&gt;@LaunchDarkly&lt;/a&gt;.com email addresses or via LinkedIn from \"Verified Recruiter\" accounts.&lt;strong&gt; &lt;/strong&gt;Be cautious of emails from other domains.&amp;nbsp; Legitimate LaunchDarkly recruiters will never ask for money, fees, or banking information before making a job offer. LaunchDarkly will never make a job offer without conducting a formal interview process. Our interview process does not involve asking detailed questions by email. If you are ever unsure about a communication that you receive, don't click any links—visit &lt;a href=\"https://launchdarkly.com/careers/\"&gt;Careers | LaunchDarkly&lt;/a&gt;&amp;nbsp; directly for confirmed job openings and links to apply.&lt;/p&gt; &lt;p class=\"p1\"&gt;Please notify us of any fraudulent representation by sending an email to&amp;nbsp;&lt;a href=\"mailto:careers@launchdarkly.com\"&gt;careers@launchdarkly.com&lt;/a&gt;.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/launchdarkly-commercial-counsel\"&gt;https://weworkremotely.com/remote-jobs/launchdarkly-commercial-counsel&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sat, 22 Aug 2026 07:31:03 +0000</pubDate> <expires_at>Mon, 21 Sep 2026 07:31:03 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/launchdarkly-commercial-counsel</guid> <link>https://weworkremotely.com/remote-jobs/launchdarkly-commercial-counsel</link> </item> <item> <title>BeyondTrust: Associate Instructor</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>DevOps and Sysadmin</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote Canada | East Coast Canada &lt;/p&gt; &lt;p&gt;BeyondTrust is a place where you can bring your purpose to life through the work that you do, creating a safer world through our cybersecurity SaaS portfolio.&lt;/p&gt; &lt;p&gt;Our culture of flexibility, trust, and continual learning means you will be recognized for your growth, and for the impact you make on our success. You will be surrounded by people who challenge, support, and inspire you to be the best version of yourself.&lt;/p&gt; &lt;p&gt;The Role&lt;/p&gt; &lt;p&gt;The Associate Instructor is a junior instructional role within BeyondTrust University, designed to develop foundational skills in technical training delivery and course support. Working closely with senior Instructors and the broader Education team, the Associate Instructor learns the tools, platforms, and product knowledge needed to contribute effectively to training delivery while building proficiency in learner engagement and curriculum support.&amp;nbsp; This role is designed to develop individuals toward the instructor role and, longer term, into Senior Instructor positions based on capability growth and performance.&lt;/p&gt; &lt;p&gt;What You’ll Do&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Training Delivery Support&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Shadow and co-teach courses with more experienced Instructors, progressively taking on greater delivery responsibility as proficiency develops.&lt;/li&gt; &lt;li&gt;Support the delivery of training to customers, partners, and employees under the guidance of Senior Instructors.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Learner Engagement &amp;amp; Feedback&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Assist in assessing individual and group training needs for assigned courses.&lt;/li&gt; &lt;li&gt;Gather and consolidate post-session feedback to support continuous improvement of training content and delivery.&lt;/li&gt; &lt;li&gt;Build working relationships with learners and stakeholders by providing reliable, professional support.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Learning &amp;amp; Development&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Actively build knowledge of BeyondTrust software product lines and underlying technical concepts.&lt;/li&gt; &lt;li&gt;Proactively use other knowledge channels such as KB articles, Teams chats, and technical documentation.&lt;/li&gt; &lt;li&gt;Learn and apply team processes, instructional tools, and delivery platforms (e.g., Zoom, Teams, LMS).&lt;/li&gt; &lt;li&gt;Seek coaching and feedback from Senior Instructors to accelerate skill development.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;What You’ll Bring&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Bachelor's degree or international equivalent, or equivalent combination of education and relevant experience.&lt;/li&gt; &lt;li&gt;0–2 years of professional experience, including internships, co-op placements, academic teaching roles, or applicable project experience.&lt;/li&gt; &lt;li&gt;Strong communication and interpersonal skills, with comfort presenting or facilitating in front of groups.&lt;/li&gt; &lt;li&gt;Willingness and ability to learn technical concepts and enablement tools at pace.&lt;/li&gt; &lt;li&gt;Strong organizational skills and attention to detail.&lt;/li&gt; &lt;li&gt;Comfort working in a fast-paced, evolving environment.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Nice To Have&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Internship, co-op, or academic experience in training, education, or instructional facilitation.&lt;/li&gt; &lt;li&gt;Exposure to software, SaaS, or cybersecurity environments.&lt;/li&gt; &lt;li&gt;Familiarity with IT principles, networking, or technical subject matter.&lt;/li&gt; &lt;li&gt;Experience with virtual delivery tools such as Zoom, Teams, or similar platforms.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Better Together&lt;/p&gt; &lt;p&gt;Diversity. Inclusion. They’re more than just words for us. They are the guiding values of how we build our teams, cultivate leaders, and create a culture where people feel connected.&lt;/p&gt; &lt;p&gt;We take care of our employees so they can take care of our customers. Customers who&amp;nbsp;come from all walks of life just like us. We hire incredible people from diverse backgrounds because when we are different together, we are stronger together.&lt;/p&gt; &lt;p&gt;About Us&lt;/p&gt; &lt;p&gt;BeyondTrust is the global identity security leader protecting Paths to Privilege™. Our identity-centric approach goes beyond securing privileges and access, empowering organizations with the most effective solution to manage the entire identity attack surface and neutralize threats, whether from external attacks or insiders.&lt;/p&gt; &lt;p&gt;BeyondTrust is leading the charge in transforming identity security to prevent breaches and limit the blast radius of attacks, while creating a superior customer experience and operational efficiencies. We are trusted by 20,000 customers, including 75 of the Fortune 100, and our global ecosystem of partners.&lt;/p&gt; &lt;p&gt;Learn more at &lt;a href=\"http://www.beyondtrust.com/\"&gt;www.beyondtrust.com&lt;/a&gt;.&amp;nbsp;&lt;/p&gt; &lt;p&gt;#LI-JB1&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/beyondtrust-associate-instructor\"&gt;https://weworkremotely.com/remote-jobs/beyondtrust-associate-instructor&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sat, 22 Aug 2026 07:31:03 +0000</pubDate> <expires_at>Mon, 21 Sep 2026 07:31:03 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/beyondtrust-associate-instructor</guid> <link>https://weworkremotely.com/remote-jobs/beyondtrust-associate-instructor</link> </item> <item> <title>Temporal Technologies: Senior Application Security Engineer</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>DevOps and Sysadmin</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; United States or Canada - Remote Opportunity &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;h3&gt;&lt;strong&gt;About Us&lt;/strong&gt;&lt;/h3&gt; &lt;div&gt;Temporal is an open source programming model that can simplify code, make applications more reliable, and help developers focus on the important things like delivering features faster. We are on a mission to be the reliable foundation of every developer’s toolbox, and are building the team that will make that happen.&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;Our values guide us —they are present in how we show up, make decisions, and work together to make an impact. We’re curious, driven, collaborative, genuine and humble.&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;Temporal is growing and we are looking for those who share our values, challenge 'standard' thinking, and want to influence our future. If you have a passion for improving the developer experience, building world-class open-source software and communities, and want to be a part of our amazing team, we'd love to hear from you!&lt;/div&gt;&lt;/div&gt;&lt;div&gt; &lt;h3&gt;&lt;span&gt;&lt;strong&gt;Summary&lt;/strong&gt;&lt;/span&gt;&lt;/h3&gt; &lt;p&gt;Join our dynamic team as a &lt;strong&gt;Senior Application Security Engineer&lt;/strong&gt;, where you'll play a pivotal role in securing the Temporal development pipeline, product, and customer execution environment. In this position, you'll work closely with software engineering teams and customers to build security deeply into our platform across multiple clouds. You'll also help shape how we use AI responsibly in both our product and our engineering processes. We're looking for individuals who are passionate about enabling engineering teams to build and ship securely, serving as trusted security partners across the organization.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;What You’ll Do&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Collaborate with product and engineering teams to integrate security principles into the design and architecture of products.&lt;/li&gt; &lt;li&gt;Conduct threat modeling and risk assessments to identify vulnerabilities and potential attack vectors across the full product surface.&lt;/li&gt; &lt;li&gt;Manage the Secure Development pipeline including code security and 3rd party library supply chain security.&lt;/li&gt; &lt;li&gt;Stay current on emerging standards and guidance (e.g. OWASP Top 10 for LLMs, MCP security specifications) and translate these into actionable internal policy.&lt;/li&gt; &lt;li&gt;Triage Bug Bounty findings and responsibility disclosed vulnerabilities.&lt;/li&gt; &lt;li&gt;Able to participate in on-call rotation.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;What You’ll Bring&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Bachelor’s degree in Computer Science, Cybersecurity, or a related field (or equivalent experience).&lt;/li&gt; &lt;li&gt;5+ years in application or product security or a related role.&lt;/li&gt; &lt;li&gt;Proven partnership with engineering teams, bringing security expertise to the planning and development process.&lt;/li&gt; &lt;li&gt;Knowledge of encryption, authentication, and secure communication protocols.&lt;/li&gt; &lt;li&gt;Familiarity with tools like SAST, DAST, and penetration testing frameworks.&lt;/li&gt; &lt;li&gt;A deep understanding of application architecture and design principles, ability to effectively identify vulnerabilities across multiple programming languages&lt;/li&gt; &lt;li&gt;Excellent communication and ability to explain complex security concepts to non-technical stakeholders.&lt;/li&gt; &lt;li&gt;Kubernetes security posture management and auditing, including workload hardening, RBAC design, and admission control.&lt;/li&gt; &lt;li&gt;Demonstrated experience with multi-tenant security architecture, including data plane isolation, control plane hardening, and cross-tenant data leakage prevention.&lt;/li&gt; &lt;li&gt;Excellent collaboration and communication skills.&lt;/li&gt; &lt;li&gt;Expertise in at least one programming language, familiarity with Python and Go.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;Nice to Have&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Distributed computing and related vulnerability experience.&lt;/li&gt; &lt;li&gt;Running a Security Champions program.&lt;/li&gt; &lt;li&gt;Open Source automation or automation projects.&lt;/li&gt; &lt;li&gt;Expertise in other areas of security.&lt;/li&gt; &lt;li&gt;Security conference talks or published research.&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;div&gt; &lt;div&gt;&lt;span&gt;&lt;strong&gt;Compensation&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt; &lt;div&gt; &lt;ul&gt; &lt;li&gt;The estimated pay range for this role is $180,000 - $225,000, depending on qualifications and location.&lt;/li&gt; &lt;li&gt;This role is eligible to participate in Temporal's equity plan.&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;/div&gt;&lt;div class=\"content-conclusion\"&gt;&lt;div&gt;&lt;em&gt;Compensation ranges reflect salary and commission compensation (when applicable) across several geographic markets. Employment offers carefully consider multiple factors, including prior experience, knowledge, expertise, skillset, market location, and job level assessed during the interview process.&lt;/em&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;em&gt;Employee benefits and perks below are for full-time employees, part-time or temporary positions are excluded.&amp;nbsp;&lt;/em&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt; &lt;div&gt;&lt;strong&gt;U.S. Benefits&amp;nbsp;&lt;/strong&gt;&lt;/div&gt; &lt;div&gt; &lt;ul&gt; &lt;li&gt;Unlimited PTO, 12 Holidays + 2 Floating Holidays&lt;/li&gt; &lt;li&gt;100% Premiums Coverage for Medical, Dental, and Vision&lt;/li&gt; &lt;li&gt;AD&amp;amp;D, LT &amp;amp; ST Disability, and Life Insurance (Standard &amp;amp; Supplemental Available)&lt;/li&gt; &lt;li&gt;Empower 401K Plan&lt;/li&gt; &lt;li&gt;Additional Perks for Learning &amp;amp; Development, Lifestyle Spending, Home Office Setup, Professional Memberships, WFH Meals, Internet Stipend and more!&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;/div&gt; &lt;div&gt; &lt;div&gt;&lt;strong&gt;International Benefits&lt;/strong&gt;&lt;/div&gt; &lt;div&gt; &lt;p&gt;Paid Time Off (PTO) and Benefits outside the United States vary by country, and are issued in partnership with &lt;a class=\"postings-link\" href=\"http://remote.com/\"&gt;Remote.com&lt;/a&gt;.&amp;nbsp; Additionally, Temporal offers perks to all international employees for learning &amp;amp; career development, a lifestyle spending account, home office setup, professional memberships, work-from-home meals, and access to the Calm app for mental wellness.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Travel&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Temporal is a globally distributed, collaborative team that values opportunities for in-person connection. Occasional travel may be required for company events, team offsites, and other meaningful moments that bring us together.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;div&gt;&lt;em&gt;Temporal Technologies is an Equal Opportunity Employer. Temporal Technologies does not discriminate on the basis of race, religion, color, sex, gender identity, sexual orientation, age, non-disqualifying physical or mental disability, national origin, veteran status, or any other basis covered by appropriate law. All employment is decided on the basis of qualifications, merit, and business need. We embrace and celebrate differences and diversity.&lt;/em&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;em&gt;Temporal is committed to providing access, equal opportunity, and reasonable accommodation for individuals with disabilities in employment, its services, programs, and activities. If you need to request a reasonable accommodation, please let your Recruiter know so we can assist.&lt;/em&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;em&gt;We are not working with external recruitment agencies, thanks.&lt;/em&gt;&lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/temporal-technologies-senior-application-security-engineer\"&gt;https://weworkremotely.com/remote-jobs/temporal-technologies-senior-application-security-engineer&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sat, 22 Aug 2026 07:31:03 +0000</pubDate> <expires_at>Mon, 21 Sep 2026 07:31:03 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/temporal-technologies-senior-application-security-engineer</guid> <link>https://weworkremotely.com/remote-jobs/temporal-technologies-senior-application-security-engineer</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0077/5564/logo.gif\" type=\"image/png\"/> <title>Native Camp: Online English Teacher</title> <region>Anywhere in the World</region> <country></country> <state>Beograd (Belgrade)</state> <skills></skills> <category>All Other Remote</category> <type>Contract</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0077/5564/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Japan &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://nativecamp.net/tutors/?cc=gb-wwr\"&gt;https://nativecamp.net/tutors/?cc=gb-wwr&lt;/a&gt; &lt;/p&gt; &lt;div&gt;&lt;strong&gt;About us:&amp;nbsp;&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;Native Camp is Japan’s No.1 Online English Service counting the highest number of both teachers and students who are learning the English language through our platform. Since 2017, we have started hiring teachers from all around the world, and we have created an environment that makes it easy for them to work and earn while having full flexibility.&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;We are continuously expanding, introducing new features and teaching materials, and as a result of these efforts, more than 1.3 million members are using our service. Lessons are provided via a unique language platform developed by our company. We have simplified our application process and made it as quick as possible, so joining our team of teachers has never been easier. Join us today to experience the benefits that we provide.&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;ONLINE ENGLISH TEACHER&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;&lt;em&gt;(Home-Based job position)&lt;/em&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;What we offer:&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;・Complete flexibility (24/7)&lt;/div&gt; &lt;div&gt;・100% remote&lt;/div&gt; &lt;div&gt;・Easy-to-follow teaching materials provided&lt;/div&gt; &lt;div&gt;・No minimum hours per week required&lt;/div&gt; &lt;div&gt;・Frequent incentives offered&lt;/div&gt; &lt;div&gt;・No CV or experience required&lt;/div&gt; &lt;div&gt;・Online support available&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;Requirements:&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;・English Proficiency&lt;/div&gt; &lt;div&gt;・Laptop or PC with a webcam&lt;/div&gt; &lt;div&gt;・Headset with a microphone&lt;/div&gt; &lt;div&gt;・Stable Internet connection and speed&lt;/div&gt; &lt;div&gt;・Quiet environment and plain background&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;Application Process:&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;・Apply through our website&lt;/div&gt; &lt;div&gt;・Do the English Proficiency Test&lt;/div&gt; &lt;div&gt;・Do the System Check and the Demo Lesson&lt;/div&gt; &lt;div&gt;・Complete your profile&lt;/div&gt; &lt;div&gt;・Start Teaching&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;The whole application process is done online, via desktop. Just follow step by step and the system will guide you through it.&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;If you have any questions please contact us via our website (Contact Us page).&lt;/div&gt; &lt;div&gt;&lt;br&gt;&lt;br&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/native-camp-online-english-teacher-35\"&gt;https://weworkremotely.com/remote-jobs/native-camp-online-english-teacher-35&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Fri, 21 Aug 2026 10:40:25 +0000</pubDate> <expires_at>Sun, 20 Sep 2026 10:40:25 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/native-camp-online-english-teacher-35</guid> <link>https://weworkremotely.com/remote-jobs/native-camp-online-english-teacher-35</link> </item> <item> <title>Galileo: Medical Licensing Specialist (Contract)</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Full-Stack Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote, United States &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;p&gt;&lt;strong&gt;About Us&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;Galileo is a team-based medical practice working to improve the quality and affordability of health care for all. Operating across 50 states, Galileo offers high-touch, data-driven, multi-specialty, longitudinal care to diverse and complex patients—on the phone, in the home, and everywhere in between. Regional and national health plans, employers, and Fortune 500 organizations trust Galileo as the leading solution to improve population health. Founded by Dr. Tom X. Lee, the healthcare pioneer behind One Medical and Epocrates, Galileo is a team of leading innovators from healthcare, technology, and human-centered design. Our mission is to apply that talent and scientific thinking to&lt;/span&gt;&lt;span&gt; transform society by solving our largest, toughest healthcare problems, while at the same time bringing patient and provider closer.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;About the Role&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;We're looking for a Medical Licensing Specialist to own the end-to-end state licensing process for our provider population across all 50 states. You'll manage the full licensing lifecycle for Registered Nurses (RNs), Nurse Practitioners (NPs), MDs, and DOs, coordinating directly with state medical boards, providers, and internal teams to keep our clinicians compliant and practice-ready. The role requires knowledge in state-specific licensing requirements, a high degree of organizational precision, and a proactive approach to issue resolution.&lt;/p&gt; &lt;p&gt;This is a full-time, contract position at 40 hours/week, reporting into the Senior Manager, Licensing and Credentialing.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Here’s what you’ll do:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Manage initial state license applications for RNs, NPs, MDs, and DOs across all 50 states, owning each application from submission through approval&lt;/li&gt; &lt;li&gt;Coordinate directly with providers to collect required documentation, including primary source verifications, CEU records, and background checks&lt;/li&gt; &lt;li&gt;Communicate with state medical and nursing boards to resolve application issues, answer inquiries, and expedite approvals where possible&lt;/li&gt; &lt;li&gt;Maintain current, working knowledge of state-specific licensure requirements, processing timelines, and regulatory changes&lt;/li&gt; &lt;li&gt;Use Verifiable to manage provider profiles, track license statuses, and generate compliance reporting for internal stakeholders&lt;/li&gt; &lt;li&gt;Ensure all licensing data is accurately entered and maintained in the credentialing system of record&lt;/li&gt; &lt;li&gt;Proactively flag and escalate issues to prevent delays in provider readiness, managing an active queue of 60+ licenses at any given time&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;About You&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;You are a detail-oriented and process-driven operator who takes ownership of complex, high-volume workflows. You know your way around state medical board requirements and thrive in an environment where precision and follow-through are non-negotiable. You can manage a queue of active applications, prioritize effectively, and communicate clearly with providers, boards, and internal teams alike. You are comfortable navigating ambiguity, adapting quickly when requirements shift, and escalating the right things at the right time.&amp;nbsp;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;We would love to hear from you if you have the following or equivalent experience:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Minimum of 2 years of experience in healthcare licensing, credentialing, or a closely related field&lt;/li&gt; &lt;li&gt;Hands-on experience processing state licenses for RNs, NPs, MDs, and/or DOs&lt;/li&gt; &lt;li&gt;Familiarity with multi-state licensing requirements and the Interstate Medical Licensure Compact (IMLC)&lt;/li&gt; &lt;li&gt;Strong organizational skills with a demonstrated ability to manage a high volume of concurrent applications&lt;/li&gt; &lt;li&gt;Exceptional attention to detail and consistent follow-through on deadline-driven tasks&lt;/li&gt; &lt;li&gt;Experience with Verifiable or comparable credentialing platforms (preferred)&lt;/li&gt; &lt;li&gt;Experience in a telehealth, virtual care, or multi-state provider organization (preferred)&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Compensation:&lt;/strong&gt; $25/hour&lt;/p&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&lt;strong&gt;How We Hire&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Galileo Health is an equal-opportunity employer and welcomes applicants from all backgrounds.&lt;/p&gt; &lt;p&gt;We have recently become aware of the fraudulent use of our name on job postings and via recruiting emails that are illegitimate and not in any way associated with us. We will never ask you to provide sensitive personal information as part of the recruiting process, such as your social security number; send you any unsolicited job offers or employment contracts; require any fees, payments or access to any financial accounts; and/or conduct text-only interviews. If you suspect you are being scammed or have been scammed online, you may report the crime to the &lt;a href=\"http://www.ic3.gov/\"&gt;Federal Bureau of Investigation&lt;/a&gt;&amp;nbsp;and obtain more information regarding online scams at the&amp;nbsp;&lt;a href=\"https://www.consumer.ftc.gov/\"&gt;Federal Trade Commission&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/galileo-medical-licensing-specialist-contract\"&gt;https://weworkremotely.com/remote-jobs/galileo-medical-licensing-specialist-contract&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Fri, 21 Aug 2026 07:30:41 +0000</pubDate> <expires_at>Sun, 20 Sep 2026 07:30:41 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/galileo-medical-licensing-specialist-contract</guid> <link>https://weworkremotely.com/remote-jobs/galileo-medical-licensing-specialist-contract</link> </item> <item> <title>Pendo: Director, Customer Growth &amp; Lifecycle</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Product</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Raleigh, NC / New York, NY / EST Remote &lt;/p&gt; &lt;h2&gt;The Team + The Role&lt;/h2&gt; &lt;p&gt;Pendo is rebuilding for the AI era, with new products, new buyers, and new ways to deliver value to customers. The Customer Growth and Lifecycle function sits at the center of that shift, helping turn customer engagement into a deliberate, repeatable, compounding growth motion. This team connects product usage, customer behavior, experimentation, and lifecycle programs to help customers get more value from Pendo.&lt;/p&gt; &lt;p&gt;As Director, Customer Growth &amp;amp; Lifecycle, you will own the lifecycle motion from first login to fully embedded power user. You will design the experiments, programs, and data-driven interventions that make engagement intentional rather than accidental, using Pendo’s own platform and analytics to understand what moves adoption, retention, and expansion. You will also lead a team of approximately five Adoption Managers and Pendo’s Center of Excellence / Product Operations function.&lt;/p&gt; &lt;p&gt;This is a role based in-office in Raleigh or New York, or Remote in the East Coast.&lt;/p&gt; &lt;h2&gt;What this looks like day-to-day&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Customer lifecycle ownership:&lt;/strong&gt; Build, iterate, and optimize the full digital customer journey from onboarding through expansion. You will start with functional lifecycle infrastructure and make it more measurable, scalable, and compounding.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Behavior-to-action strategy:&lt;/strong&gt; Use Pendo’s own analytics to identify where users find value, where they drop off, and which interventions move the needle. You will scope and prove your own work rather than waiting on an analyst to define the opportunity.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Scaled Pendo-on-Pendo execution:&lt;/strong&gt; Act as one of Pendo’s most important internal practitioners of the product. Design and ship cross-channel experiments across in-app guides, email, NPS, segmentation, and other lifecycle channels that show customers what great product engagement looks like.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Roadmap influence:&lt;/strong&gt; Bring front-line visibility into customer behavior directly into product conversations. Your insights will help shape feature decisions and improve how Pendo builds for adoption, retention, and expansion.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Team leadership:&lt;/strong&gt; Develop and lead a team of approximately five Adoption Managers while also guiding Pendo’s Center of Excellence / Product Operations function. You will set direction, coach the team, and raise the operating ceiling while staying close to the work.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Who You Are&lt;/h2&gt; &lt;p&gt;Beyond the qualifications, we hire through a specific lens. These aren't buzzwords; they're the things we'll actually look for in how you talk about your work.&lt;/p&gt; &lt;p&gt;You're a builder, not a maintainer.&lt;/p&gt; &lt;p&gt;You're most energized when there isn't a clear path yet, and you get to define it. You don't wait for direction; you identify gaps, shape solutions, and drive them forward. At Pendo, great Directors of Customer Growth &amp;amp; Lifecycle don't just follow instructions; they operate as strategic advisors, influencing decisions, guiding stakeholders, and elevating how we work.&lt;/p&gt; &lt;p&gt;You're AI-curious - genuinely.&lt;/p&gt; &lt;p&gt;You're not using AI tools occasionally. You're rewiring how you work around them. You're faster, sharper, and more prolific because of it, and you bring that energy to everything — how you approach your work, how you prep, how you communicate, how you think. We want someone who sees AI as a multiplier, not a shortcut.&lt;/p&gt; &lt;h2&gt;Must-haves&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;7+ years of experience in product growth, lifecycle design, or growth marketing in software.&lt;/li&gt; &lt;li&gt;Experience running lifecycle or growth programs in a product-led SaaS company where the end user and economic buyer are different people.&lt;/li&gt; &lt;li&gt;A proven track record of moving product adoption and retention metrics, including clear examples of programs you shipped and the measurable impact they created.&lt;/li&gt; &lt;li&gt;Experience building and leading a team of growth or lifecycle professionals focused on the customer journey.&lt;/li&gt; &lt;li&gt;Strong data fluency, including the ability to scope, query, analyze, and prove the impact of your own work without creating an analyst dependency.&lt;/li&gt; &lt;li&gt;Hands-on experience with experimentation, including forming hypotheses, testing quickly, learning from results, and shipping improvements.&lt;/li&gt; &lt;li&gt;Power-user experience with Pendo.&lt;/li&gt; &lt;li&gt;Daily use of AI tools, with a clear point of view on where they accelerate growth, lifecycle, and customer engagement work.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Nice-to-haves&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Experience designing lifecycle programs that connect digital onboarding, product usage, retention, and expansion.&lt;/li&gt; &lt;li&gt;Experience using customer conversations alongside behavioral data to understand motivation, friction, and value realization.&lt;/li&gt; &lt;li&gt;Experience influencing product roadmap decisions through customer behavior insights and lifecycle learnings.&lt;/li&gt; &lt;li&gt;Experience leading a Center of Excellence or Product Operations function.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;About Pendo&lt;/h2&gt; &lt;p&gt;Pendo was founded in 2013 by former product managers, who combined their heads and hearts to build something they wanted but never had as product managers: a simple way to understand and attack what truly drives product success. Our mission is to improve society's experience with software. Come join one of the fastest-growing startups, supported by best-in-class institutions like Battery Ventures, Salesforce Ventures, Spark Capital and Meritech.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Pendo Core Values:&lt;/strong&gt; Bias to Act, Hone Your Craft, The Team is Pendo, and Maniacal Focus.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Location:&lt;/strong&gt; Pendo is a hybrid culture. In-office 3 days per week unless designated remote.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Compensation:&lt;/strong&gt; The expected base salary for this role is $190,000 - $220,000.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Benefits:&lt;/strong&gt; United States benefits include highly competitive, employer-heavy coverage including $0 premium options, strong 401(k) match, equity, and flexible time off.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;EEOC:&lt;/strong&gt; We are an equal opportunity employer and believe having diverse teams where everyone brings their whole self to Pendo is key to our success. We welcome all people of different backgrounds, experiences, abilities and perspectives.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Accessibility:&lt;/strong&gt; Pendo is committed to working with, and providing access and reasonable accommodation to, applicants with mental and/or physical disabilities. If you think you may require an accommodation for any part of the recruitment process, please send a request to: accommodation@pendo.io. All requests for accommodations are treated discreetly and confidentially, as practical and permitted by law.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/pendo-director-customer-growth-lifecycle\"&gt;https://weworkremotely.com/remote-jobs/pendo-director-customer-growth-lifecycle&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Fri, 21 Aug 2026 07:30:41 +0000</pubDate> <expires_at>Sun, 20 Sep 2026 07:30:41 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/pendo-director-customer-growth-lifecycle</guid> <link>https://weworkremotely.com/remote-jobs/pendo-director-customer-growth-lifecycle</link> </item> <item> <title>Galileo: Digital Nurse Practitioner (Evenings &amp; Weekends)</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>All Other Remote</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote, United States &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;p&gt;&lt;strong&gt;About Us&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;Galileo is a team-based medical practice working to improve the quality and affordability of health care for all. Operating across 50 states, Galileo offers high-touch, data-driven, multi-specialty, longitudinal care to diverse and complex patients—on the phone, in the home, and everywhere in between. Regional and national health plans, employers, and Fortune 500 organizations trust Galileo as the leading solution to improve population health. Founded by Dr. Tom X. Lee, the healthcare pioneer behind One Medical and Epocrates, Galileo is a team of leading innovators from healthcare, technology, and human-centered design. Our mission is to apply that talent and scientific thinking to&lt;/span&gt;&lt;span&gt; transform society by solving our largest, toughest healthcare problems, while at the same time bringing patient and provider closer.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;&lt;span&gt;&lt;strong&gt;About The Role&lt;/strong&gt;&lt;/span&gt;&lt;/h3&gt; &lt;p&gt;&lt;span&gt;&lt;span&gt;Galileo is looking for culturally sensitive clinicians to join our digital-first, primary care medical group. In this role, you will use &lt;/span&gt;&lt;span&gt;asynchronous text-based chat and synchronous video to provide high-quality, comprehensive and evidence-based primary care&lt;/span&gt;&lt;span&gt;. As a part of our collaborative clinical care team, you will leverage data, technology, and operational rigor to optimize great patient outcomes while offering highly personalized care and shared decision making with patients.&amp;nbsp;&lt;/span&gt;&lt;/span&gt;&lt;/p&gt; &lt;h4&gt;&lt;span&gt;Here’s What You’ll Do:&lt;/span&gt;&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;&lt;span&gt;Provide best-in-class care for Galileo patients managing complex and chronic illnesses through our innovative, proprietary app and technology and your excellent clinical judgment.&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span&gt;Provide compassionate and empathetic care to patients from age 0-100 across all needs, including complex, chronic medical conditions such as: diabetes, hypertension, obesity and mental health.&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span&gt;Work with a diverse patient population. We pride ourselves on fostering a culture that is inclusive of all backgrounds.&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span&gt;Solve patient problems in an efficient, nimble manner by drawing on resourcefulness, collaborating with team members to leverage their expertise, and a “can-do” approach.&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;span&gt;&lt;strong&gt;How We Work&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;Galileo is a 24/7 medical group utilizing asynchronous text-based chat and synchronous video to provide high-quality, comprehensive primary care. We work in 4-hour shifts (mornings, afternoons, evenings, overnight on weekdays and weekends) and require a minimum of 14 hours a week (alternating 12 and 16 hour weeks). At 24+ hours you will be considered full-time and benefits eligible. Providers are required to work at least two 4 hour shifts each weekend, in addition to their weekday hours.&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;We are currently looking for NPs with active licensure in Texas. We have several roles available for evening and weekends coverage. Evening shifts begin at 6pm ET.&lt;/span&gt;&lt;/p&gt; &lt;h4&gt;&lt;span&gt;Compensation&lt;/span&gt;&lt;/h4&gt; &lt;p&gt;&lt;span&gt;$80/hour (regular rate) and $90/hour (premium rate)&lt;/span&gt;&lt;/p&gt; &lt;h3&gt;&lt;span&gt;&lt;strong&gt;About You&lt;/strong&gt;&lt;/span&gt;&lt;/h3&gt; &lt;p&gt;&lt;span&gt;We look for passionate clinicians who are invested in solving complex problems that impact millions of lives and are excited about fixing what’s broken to improve care quality and health outcomes for everyone. &lt;/span&gt;&lt;span&gt;We believe in a culture that fosters teamwork, excellence, and sound decision-making—one that is based on mutual respect and trust. We appreciate individuals who are open and honest about what they’re looking for so we can ensure it’s a fit on both sides.&lt;/span&gt;&lt;/p&gt; &lt;h4&gt;&lt;span&gt;We would love to hear from you if you have the following or equivalent experience:&lt;/span&gt;&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;&lt;span&gt;Have 5+ years of advanced clinical experience in complex care, chronic care management, or primary care.&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span&gt;Are experienced in or have an appetite for learning digital-first healthcare (e.g. virtual medicine).&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span&gt;Are interested in new, innovative models of care that balance evidence-based approaches with creative ideas.&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span&gt;Are highly comfortable with using technology and various applications to deliver care to patients virtually. Our current tech stack is:&lt;/span&gt;&lt;/li&gt; &lt;ul&gt; &lt;li&gt;&lt;span&gt;Proprietary built clinician-patient platform&amp;nbsp;&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span&gt;Google Suite (gmail, sheets, docs, etc)&amp;nbsp;&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span&gt;Slack&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;li&gt;&lt;span&gt;Certified as a Nurse Practitioner&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span&gt;Active state licensure in TX, with the ability to obtain additional state licensures.&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;span&gt;&lt;strong&gt;How We Care for You:&lt;/strong&gt;&lt;/span&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;&lt;span&gt;Flexible scheduling - design the schedule that works best for YOU&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span&gt;Competitive health, vision and dental plans&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span&gt;Company paid short and long term disability&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span&gt;12 weeks paid parental leave&amp;nbsp;&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span&gt;Malpractice insurance provided, including tail coverage&amp;nbsp;&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span&gt;401(k) with company match&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&lt;strong&gt;How We Hire&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Galileo Health is an equal-opportunity employer and welcomes applicants from all backgrounds.&lt;/p&gt; &lt;p&gt;We have recently become aware of the fraudulent use of our name on job postings and via recruiting emails that are illegitimate and not in any way associated with us. We will never ask you to provide sensitive personal information as part of the recruiting process, such as your social security number; send you any unsolicited job offers or employment contracts; require any fees, payments or access to any financial accounts; and/or conduct text-only interviews. If you suspect you are being scammed or have been scammed online, you may report the crime to the &lt;a href=\"http://www.ic3.gov/\"&gt;Federal Bureau of Investigation&lt;/a&gt;&amp;nbsp;and obtain more information regarding online scams at the&amp;nbsp;&lt;a href=\"https://www.consumer.ftc.gov/\"&gt;Federal Trade Commission&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/galileo-digital-nurse-practitioner-evenings-weekends\"&gt;https://weworkremotely.com/remote-jobs/galileo-digital-nurse-practitioner-evenings-weekends&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Fri, 21 Aug 2026 07:30:41 +0000</pubDate> <expires_at>Sun, 20 Sep 2026 07:30:41 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/galileo-digital-nurse-practitioner-evenings-weekends</guid> <link>https://weworkremotely.com/remote-jobs/galileo-digital-nurse-practitioner-evenings-weekends</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0171/2702/logo.gif\" type=\"image/png\"/> <title>TELUS Digital: Content Reviewer - US</title> <region>Anywhere in the World</region> <country>🇺🇸 United States of America</country> <state>Nevada</state> <skills>Information Analysis, Research and Analysis, and Social Media Content</skills> <category>All Other Remote</category> <type>Contract</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0171/2702/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Las Vegas, Nevada &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://jobs.telusdigital.com/search/jobs?cfm5=Artificial+Intelligence&amp;amp;ns_category=artificial-intelligence\"&gt;https://jobs.telusdigital.com/search/jobs?cfm5=Artificial+Intelligence&amp;amp;ns_category=artificial-intelligence&lt;/a&gt; &lt;/p&gt; &lt;div class=\"figma-padding-bottom-32 tw-border-b tw-border-[#E3E6E8]\"&gt; &lt;p class=\"ql-align-justify\"&gt;We are looking for an independent, flexible, remote opportunity where you can help improve AI-powered search technology from the comfort of your home? If you're curious, internet-savvy, and enjoy evaluating online content, this freelance project could be a great fit.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;&lt;strong&gt;A Day in the Life of a Content Reviewer - US&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;In this role, you will analyze and provide feedback on text, webpages, images, and other types of online content for leading search engines using a specialized online platform.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;By reviewing and rating search results for relevance and quality, you will help improve the overall search experience for millions of users around the world, including yourself.&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;Join our global community and put your skills to work supporting one of the world's leading search technologies.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;&lt;strong&gt;Service Rates&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;The rate of pay is $0.2333 per completed task, with an estimated earning potential of $14 per hour. Compensation is based on tasks completed and project availability. Estimated earnings may vary depending on task volume and program requirements including, quality, and productivity, in accordance with the program's quality standards and guidelines.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;Please note that only one member per household may participate in this program. If it is identified that more than one person from the same household is participating in the TELUS Digital Rating Program, all associated accounts may be removed from the program.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;&lt;strong&gt;Independent Contractor Relationship&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;This opportunity is offered on an independent contractor basis. Contributors have the flexibility to choose when and how much they work, subject to project availability and quality requirements. This opportunity is not and should not be construed as creating an employment relationship with TELUS Digital.&lt;/p&gt; &lt;/div&gt; &lt;div class=\"pt-7 figma-padding-bottom-32 tw-border-b tw-border-[#E3E6E8]\"&gt; &lt;p class=\"sui-text-b3 sui-text-darkGray-darker ql-editor\"&gt;&amp;nbsp;&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;&lt;strong&gt;Qualification Process&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;No previous professional experience is required to apply for this opportunity.&amp;nbsp;However, participation in this project requires meeting the basic requirements and successfully completing the qualification process.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;&lt;strong&gt;Basic Requirements&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;• Excellent written and verbal communication skills in English&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;• Must have resided in the United States for the past three consecutive years&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;• Familiarity with current and historical business, media, sports, news, social media, and cultural affairs in the United States&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;• Active use of Gmail and social media platforms&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;• Experience using web browsers to navigate and interact with a variety of online content&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;• Daily access to a reliable broadband internet connection&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;• Access to a smartphone (Android 5.0 or higher, or iOS 14 or higher)&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;• Access to a personal computer&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;&lt;strong&gt;Assessment&lt;/strong&gt;&lt;/p&gt; &lt;p class=\"ql-align-justify\"&gt;You must complete an English language assessment, pass an open book qualification exam, and complete an ID verification in order to be successful for this role. These assessments will determine your suitability for the position.&lt;/p&gt; &lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/telus-digital-content-reviewer-us-5\"&gt;https://weworkremotely.com/remote-jobs/telus-digital-content-reviewer-us-5&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Thu, 20 Aug 2026 14:00:38 +0000</pubDate> <expires_at>Sat, 19 Sep 2026 14:00:38 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/telus-digital-content-reviewer-us-5</guid> <link>https://weworkremotely.com/remote-jobs/telus-digital-content-reviewer-us-5</link> </item> <item> <title>6sense: Benefits Partner</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Management and Finance</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; United States, Remote &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;p&gt;&lt;strong&gt;Our Mission:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;6sense's mission is to multiply what matters: growth, retention, and efficiency.&amp;nbsp; We envision a future where companies, teams and people reach their full potential.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Our People:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;People are the heart and soul of 6sense. We serve with passion and purpose. We live by our Being 6sense values of Win as One Team, Stay Curious, Do The Right Thing, Own the Outcome, and Create Belonging. &amp;nbsp;Every 6sensor plays a part in deﬁning the future of our industry-leading technology.&amp;nbsp; 6sense is a place where difference-makers roll up their sleeves, take risks, act with integrity, and measure success by the value we create for our customers.&amp;nbsp; We want 6sense to be the best chapter of your career.&amp;nbsp;&lt;/p&gt;&lt;/div&gt;&lt;p&gt;Our &lt;strong&gt;Benefits Partner &lt;/strong&gt;will administer and improve global benefits programs across the U.S., India, Canada, and the UK. This role manages day-to-day benefits operations, leave administration, open enrollment, vendor coordination, and employee inquiries while partnering with internal teams (People, Payroll, Finance, and Legal), and external vendors to ensure accurate, compliant, and employee-centered delivery.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Responsibilities &amp;amp; Accountabilities&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Lead day-to-day administration of global benefits programs, including health and welfare, retirement and pension, leave, wellbeing, eligibility, enrollment, issue resolution, and region-specific offerings across the U.S., India, Canada, and the UK&lt;/li&gt; &lt;li&gt;Oversee benefits program execution in a shared service HR model (by partnering with People Ops), including escalations, service delivery standards, documentation, controls, audit readiness, and adherence to global governance frameworks&lt;/li&gt; &lt;li&gt;Administer leave programs, including statutory, supplemental, FMLA, state leaves, disability, ADA-related processes, documentation, tracking, and compliance&lt;/li&gt; &lt;li&gt;Lead global benefits renewal and annual cycle coordination, including open enrollment, statutory updates, communications, system testing, financial alignment, market competitiveness, and local requirements&lt;/li&gt; &lt;li&gt;Partner with vendors, brokers, Payroll, Finance, Legal, HR Technology, and People teams on deductions, funding, reconciliations, reporting, cross-border compliance, implementations, and issue resolution&lt;/li&gt; &lt;li&gt;Ensure compliance with applicable benefits, pension, leave, tax, social insurance, health coverage, data privacy, and jurisdiction-specific regulatory requirements&lt;/li&gt; &lt;li&gt;Oversee benefits systems and vendor performance, including configuration governance, data integrity, access controls, service levels, contract alignment, and process improvements&lt;/li&gt; &lt;li&gt;Provide reporting and analysis on participation, cost trends, utilization, vendor performance, service metrics, audit findings, and financial impact to inform planning and leadership decisions; perform other duties as required&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Competencies and Behaviors&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Operational excellence: executes and improves benefits processes accurately, consistently, and with strong attention to controls, metrics, and scalability&lt;/li&gt; &lt;li&gt;Employee-centered judgment: provides clear, practical, confidential, and empathetic support while balancing business needs and policy requirements&lt;/li&gt; &lt;li&gt;Compliance mindset: applies sound judgment, maintains documentation, and escalates regulatory, data, financial, or operational risk appropriately&lt;/li&gt; &lt;li&gt;Cross-functional partnership: collaborates effectively with People, Payroll, Finance, Legal, HR Technology, vendors, brokers, and occasional senior stakeholders&lt;/li&gt; &lt;li&gt;Team and change leadership: provides direction, adapts priorities to resource and operational challenges, contributes to standards and budgets, and presents clearly in internal or external forums&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Performance Measurement&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Benefits transactions, eligibility updates, enrollments, deductions, reconciliations, and inquiries are completed accurately and within service level expectations&lt;/li&gt; &lt;li&gt;Employee inquiries, escalations, vendor issues, and leave cases are resolved timely, clearly, and in compliance with applicable requirements across regions&lt;/li&gt; &lt;li&gt;Renewals, open enrollment milestones, statutory updates, testing, communications, reporting, and audits are completed on schedule with minimal errors&lt;/li&gt; &lt;li&gt;Vendor, broker, Payroll, Finance, Legal, HR Technology, and People Team partnerships enable compliant, scalable, and consistent global program execution&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Educational and Experience Requirements&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;5–7 years of experience in benefits administration, Total Rewards, or a related People function, including global or multi-country benefits exposure&lt;/li&gt; &lt;li&gt;Strong knowledge of U.S. and global benefits regulations, compliance requirements, governance practices, leave programs, and self-insured plan administration&lt;/li&gt; &lt;li&gt;Experience partnering with vendors, brokers, Payroll, Finance, Legal, HR Technology, and People teams to resolve escalations, manage renewals, and support service delivery&lt;/li&gt; &lt;li&gt;Strong attention to detail, operational discipline, communication skills, employee support mindset, and ability to exercise independent judgment within defined objectives&lt;/li&gt; &lt;li&gt;Experience with HRIS and benefits platforms preferred, especially Workday benefits administration and U.S. open enrollment; Sequoia, Sparrow, or comparable systems/vendors also valued&lt;/li&gt; &lt;li&gt;Ability to use AI tools, automation, reporting, documentation, metrics, and process improvement to improve benefits operations and internal controls&lt;/li&gt; &lt;li&gt;CEBS or similar certification, global or SaaS experience, benefits analytics exposure, and experience providing direction to team members preferred&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;Base Salary Range: $77,919.00 - $114,281.20. The base salary range represents the anticipated low and high end of the base salary range for this position. Actual salaries may vary and may be above or below the range based on various factors, including but not limited to work location and experience. The base salary is one component of 6sense’s total compensation package for this position. Other compensation may include a bonus program or commission plan, and stock options if approved by 6sense’s board. In addition, 6sense provides a variety of benefits, including generous health insurance coverage, life, and disability insurance, a 401K employer matching program, paid holidays, self-care days, and paid time off (PTO). &lt;span&gt;#Li-remote&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;Notice of Collection and Use of Personal Information for California Residents: &lt;/span&gt;&lt;a href=\"https://6sense.com/california-recruitment-privacy-notice/\"&gt;California Recruitment Privacy Notice and Policy&lt;/a&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;Our Benefits:&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;Full-time employees can take advantage of health coverage, paid parental leave, generous paid time-off and holidays, quarterly self-care days off, and stock options. We’ll make sure you have the equipment and support you need to work and connect with your teams, at home or in one of our oﬃces.&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;We have a growth mindset culture that is represented in all that we do, from onboarding through to numerous learning and development initiatives including access to our LinkedIn Learning platform. Employee well-being is also top of mind for us. We host quarterly wellness education sessions to encourage self care and personal growth. From wellness days to ERG-hosted events, we celebrate and energize all 6sense employees and their backgrounds.&lt;/span&gt;&lt;span&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;&lt;span&gt;Equal Opportunity Employer:&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;6sense is an Equal Employment Opportunity and Affirmative Action Employers. Qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender perception or identity, national origin, age, marital status, protected veteran status, or disability status. If you require reasonable accommodation in completing this application, interviewing, completing any pre-employment testing, or otherwise participating in the employee selection process, please direct your inquiries to &lt;/span&gt;&lt;span&gt;&lt;a href=\"mailto:jobs@6sense.com\"&gt;jobs@6sense.com&lt;/a&gt;&lt;a href=\"mailto:jobs@6sense.com\"&gt;.&lt;/a&gt;&lt;/span&gt;&lt;span&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;em&gt;&lt;span&gt;&lt;span class=\"TextRun SCXW160271132 BCX0\" lang=\"EN-US\"&gt;&lt;span class=\"NormalTextRun SCXW160271132 BCX0\"&gt;We are aware of recruiting impersonation&amp;nbsp;&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW160271132 BCX0\"&gt;attempts&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW160271132 BCX0\"&gt; that are not affiliated with 6sense in any way. &lt;/span&gt;&lt;span class=\"NormalTextRun SCXW160271132 BCX0\"&gt;A&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW160271132 BCX0\"&gt;ll email communications from &lt;/span&gt;&lt;span class=\"NormalTextRun SCXW160271132 BCX0\"&gt;6sense&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW160271132 BCX0\"&gt; will originate from &lt;/span&gt;&lt;span class=\"NormalTextRun SCXW160271132 BCX0\"&gt;the @6sense.com domain&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW160271132 BCX0\"&gt;. &lt;/span&gt;&lt;span class=\"NormalTextRun SCXW160271132 BCX0\"&gt;We will &lt;/span&gt;&lt;span class=\"NormalTextRun SCXW160271132 BCX0\"&gt;not initially contact you via text message and will &lt;/span&gt;&lt;span class=\"NormalTextRun SCXW160271132 BCX0\"&gt;never request payments&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW160271132 BCX0\"&gt;. &lt;/span&gt;&lt;span class=\"NormalTextRun SCXW160271132 BCX0\"&gt;If you are uncertain whether you have been contacted by an official 6sense employee, reach out to &lt;/span&gt;&lt;/span&gt;&lt;a class=\"Hyperlink SCXW160271132 BCX0\" href=\"mailto:jobs@indeed.com\"&gt;&lt;span class=\"FieldRange SCXW160271132 BCX0\"&gt;&lt;span class=\"TextRun Underlined SCXW160271132 BCX0\" lang=\"EN-US\"&gt;&lt;span class=\"NormalTextRun CommentStart SCXW160271132 BCX0\"&gt;jobs@&lt;/span&gt;&lt;span class=\"NormalTextRun SCXW160271132 BCX0\"&gt;6sense.com&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;span class=\"EOP SCXW160271132 BCX0\"&gt;&amp;nbsp;&lt;/span&gt;&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/6sense-benefits-partner\"&gt;https://weworkremotely.com/remote-jobs/6sense-benefits-partner&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Thu, 20 Aug 2026 07:30:54 +0000</pubDate> <expires_at>Sat, 19 Sep 2026 07:30:54 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/6sense-benefits-partner</guid> <link>https://weworkremotely.com/remote-jobs/6sense-benefits-partner</link> </item> <item> <title>Toast: Senior Product Manager, Consumer Payments</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Full-Stack Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote, US &lt;/p&gt; &lt;div class=\"job__description body\"&gt;&lt;div&gt;&lt;p&gt;Toast creates technology to help restaurants and local businesses succeed in a digital world, helping business owners operate, increase sales, engage customers, and keep employees happy.&lt;/p&gt;&lt;br&gt;&lt;p&gt;We are looking for a &lt;strong&gt;Senior Product Manager, Consumer Payments&lt;/strong&gt; to lead Toast’s consumer payments strategy and product area. This role will shape how diners pay across the Toast ecosystem, while also helping restaurants benefit from more seamless experiences, stronger guest loyalty, and improved economics.&lt;/p&gt;&lt;br&gt;&lt;p&gt;In this role, you will define and drive the strategy, roadmap, and execution for consumer payment experiences at Toast. This includes card and stored value experiences, guest checkout innovation, loyalty- and rewards-linked payments, and emerging payment methods that improve both the guest experience and cost of acceptance.&lt;/p&gt;&lt;br&gt;&lt;p&gt;You will work cross-functionally with teams across Consumer, Payments, Engineering, Design, Data, Risk, Operations, Partnerships, Legal, Finance, and Go-to-Market to turn an ambitious vision into a scalable and differentiated product portfolio. This role sits at the intersection of consumer experience, payments innovation, and business strategy, and requires strong product judgment, technical fluency, leadership, and comfort operating in ambiguity.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;strong&gt;A day in the life (Responsibilities)&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;br&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;Own the product vision, strategy, and roadmap for Consumer Payments, aligning near-term execution with Toast’s long-term strategy.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Define the end-to-end consumer payment experience across areas such as wallet, stored value, guest checkout, rewards-linked payments, and emerging lower-cost payment methods.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Partner with Consumer and Guest teams to create payment experiences that are seamless, intuitive, and habit-forming for diners across Toast surfaces.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Work closely with other Payment teams, Risk, Finance, Legal, and Operations teams to design solutions that are compliant, scalable, and economically compelling.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Drive product discovery and prioritization grounded in customer needs, business impact, technical feasibility, and strategic differentiation.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Lead complex cross-functional initiatives involving internal platform teams and external partners.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Translate broad strategic goals into clear milestones, measurable outcomes, and focused execution plans.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Use data to evaluate adoption, engagement, conversion, retention, payment mix, margin impact, and customer value.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Communicate strategy, priorities, tradeoffs, progress, and risks clearly to senior leadership and stakeholders across Toast.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Embrace and advocate for the use of AI tools to accelerate product discovery, streamline execution, and explore new product experiences - helping shape how we build and what we build.&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;p&gt;&lt;strong&gt;Do you have the right ingredients?* (Requirements)&lt;/strong&gt;&lt;/p&gt;&lt;br&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;8+ years of product management experience, including significant experience in payments, fintech, consumer payments, wallets, or other complex platform businesses.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Track record of defining, building, and scaling products in ambiguous, cross-functional environments.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Strong understanding of digital payments, wallets, stored value, alternative payment methods, or consumer fintech ecosystems.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Ability to balance customer experience, technical complexity, risk and compliance constraints, and business economics.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Strong technical fluency and comfort partnering deeply with engineering on architecture, APIs, dependencies, and rollout planning.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Excellent communication and stakeholder management skills, with the ability to influence senior leaders and align cross-functional teams.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Strong analytical and strategic thinking skills, with the ability to move fluidly between detail and big-picture strategy.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Experience with marketplace, network, loyalty, or two-sided platform models is a plus.&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;p&gt;&lt;strong&gt;Special Sauce* (Nice to Have)&lt;/strong&gt;&lt;/p&gt;&lt;br&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;Experience building wallet, stored value, prepaid, debit, or rewards-linked payment products.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Familiarity with merchant economics, cost-of-acceptance levers, or alternative payment rails such as ACH or pay by bank.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Experience in hospitality, commerce, or local marketplace products.&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;p&gt;&lt;strong&gt;AI at Toast&lt;/strong&gt;&lt;/p&gt;&lt;br&gt;&lt;p&gt;At Toast, one of our company values is that we're hungry to build and learn. We believe learning new AI tools empowers us to build for our customers faster, more independently, and with higher quality. We provide these tools across all disciplines, from Engineering and Product to Sales and Support, and are inspired by how our Toasters are already driving real value with them. The people who thrive here are those who embrace changes that let us build more for our customers; it’s a core part of our culture.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;br&gt;&lt;strong&gt;Our Total Rewards Philosophy&lt;/strong&gt;&lt;/p&gt;&lt;br&gt;&lt;p&gt;We strive to provide competitive compensation and benefits programs that help to attract, retain, and motivate the best and brightest people in our industry. Our total rewards package goes beyond great earnings potential and provides the means to a healthy lifestyle with the flexibility to meet Toasters’ changing needs. Learn more about our benefits at &lt;a class=\"c-link\" href=\"https://careers.toasttab.com/toast-benefits\"&gt;https://careers.toasttab.com/toast-benefits&lt;/a&gt;.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;br&gt;#LI-REMOTE&lt;/p&gt;&lt;/div&gt;&lt;div class=\"job__pay-ranges\"&gt;&lt;div class=\"pay-range\"&gt;&lt;div class=\"description\"&gt;&lt;div class=\"body\"&gt;&lt;span&gt;&lt;p&gt;&lt;span&gt;The base salary range for this role is listed below. The starting salary will be determined based on skills, experience, and geographic location. In addition to base salary, our total rewards components include cash compensation (overtime, bonus/commissions if eligible), equity, and benefits. You can learn more about how we align pay with local labor markets in our &lt;a class=\"in-cell-link\" href=\"https://careers.toasttab.com/us-pay-zones\"&gt;Geographic Pay Zone Philosophy&lt;/a&gt;.&lt;/span&gt;&lt;/p&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=\"body body--medium\"&gt;Zone A&lt;/p&gt;&lt;p class=\"body\"&gt;$159,000 - $254,000 USD&lt;/p&gt;&lt;/div&gt;&lt;div class=\"pay-range\"&gt;&lt;p class=\"body body--medium\"&gt;Zone B&lt;/p&gt;&lt;p class=\"body\"&gt;$138,000 - $221,000 USD&lt;/p&gt;&lt;/div&gt;&lt;div class=\"pay-range\"&gt;&lt;p class=\"body body--medium\"&gt;Zone C&lt;/p&gt;&lt;p class=\"body\"&gt;$125,000 - $200,000 USD&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;How Toast Uses AI in its Hiring Process&lt;/strong&gt;&lt;/p&gt;&lt;br&gt;&lt;p&gt;Throughout the hiring process, our goal is to get to know you. We use AI tools to support our recruiters and interviewers with tasks like note-taking, summarization, and documentation of interviews to ensure they can be fully focused on your conversation. All hiring decisions are made by people.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;strong&gt;&lt;strong&gt;Diversity, Equity, and Inclusion is Baked into our Recipe for Success&lt;/strong&gt;&lt;/strong&gt;&lt;/p&gt;&lt;br&gt;&lt;p&gt;At Toast, our employees are our secret ingredient—when they thrive, we thrive.&amp;nbsp;The restaurant industry is one of the most diverse, and we embrace that diversity with authenticity, inclusivity, respect, and humility. By embedding these principles into our culture and design, we create equitable opportunities for all and raise the bar in delivering exceptional experiences.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;span&gt;&lt;strong&gt;We Thrive Together&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;span&gt;We embrace a hybrid work model that fosters in-person collaboration while valuing individual needs. Our goal is to build a strong culture of connection as we work together to empower the restaurant community. To learn more about how we work globally and regionally, check out: &lt;a class=\"c-link\" href=\"https://careers.toasttab.com/locations-toast\"&gt;https://careers.toasttab.com/locations-toast&lt;/a&gt;.&lt;/span&gt;&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;strong&gt;Apply today!&lt;/strong&gt;&lt;/p&gt;&lt;br&gt;&lt;p&gt;Toast is committed to creating an accessible and inclusive hiring process. As part of this commitment, we strive to provide reasonable accommodations for persons with disabilities to enable them to access the hiring process. If you need an accommodation to access the job application or interview process, please contact &lt;a href=\"mailto:candidateaccommodations@toasttab.com\"&gt;candidateaccommodations@toasttab.com&lt;/a&gt;.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;em&gt;------&lt;/em&gt;&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;em&gt;For roles in the United States, it is unlawful in Massachusetts to require or administer a lie detector test as a condition of employment or continued employment. An employer who violates this law shall be subject to criminal penalties and civil liability.&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/toast-senior-product-manager-consumer-payments\"&gt;https://weworkremotely.com/remote-jobs/toast-senior-product-manager-consumer-payments&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 20:38:45 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 20:38:45 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/toast-senior-product-manager-consumer-payments</guid> <link>https://weworkremotely.com/remote-jobs/toast-senior-product-manager-consumer-payments</link> </item> <item> <title>Tractian: Product Content Specialist</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Full-Stack Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; São Paulo, SP &lt;/p&gt; &lt;div class=\"content\"&gt;&lt;div class=\"section-wrapper page-full-width\"&gt;&lt;div class=\"section page-centered\"&gt;&lt;div&gt;&lt;strong&gt;Marketing at TRACTIAN&lt;br&gt;&lt;br&gt;&lt;/strong&gt;&lt;/div&gt;&lt;br&gt;&lt;div&gt;&lt;span&gt;The Marketing team at Tractian crafts the narrative, defines messaging and positioning, and translates our groundbreaking products and features into tangible customer benefits. Our cross-functional team, spanning Product Marketing, Customer Experience, Growth, Branding, and Events, is dedicated to acquiring new customers and possesses a deep understanding of the business. We collaborate closely with many teams to elucidate how we can help our clients reach their full potential.&lt;/span&gt;&lt;/div&gt;&lt;br&gt;&lt;div&gt;&amp;nbsp;&lt;/div&gt;&lt;br&gt;&lt;div&gt;&lt;strong&gt;What will you do&lt;br&gt;&lt;br&gt;&lt;/strong&gt;This professional will lead product enablement for new feature launches by transforming technical information into clear, engaging content that drives understanding and adoption. They will create and manage high-quality assets - such as videos, product demos and tours - while collaborating cross-functionally to ensure consistent positioning. Their work directly impacts how effectively teams and customers adopt new features, improving product usage, alignment, and overall go-to-market success.&lt;/div&gt;&lt;/div&gt;&lt;div class=\"section page-centered\"&gt;&lt;div&gt;&lt;h3&gt;Responsibilities&lt;/h3&gt;&lt;div class=\"posting-requirements plain-list\"&gt;&lt;div&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;Plan and execute enablement initiatives for new feature launches, ensuring each release is supported by clear, high-quality assets.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Translate product requirements, technical specifications, and engineering context into clear narratives and actionable enablement materials.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Create high-quality product launch and feature content end-to-end, including scripting (launch videos, guided demos, and feature explanations), capturing product screens and building realistic demos, producing voiceovers, editing videos, and developing visual assets that clearly showcase functionality and value. Adapt launches into multiple formats - such as video, written content, FAQs, internal announcements, and training materials - while supporting Customer Enablement teams when needed.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Publish and maintain enablement assets across the appropriate channels, ensuring consistency in naming, versioning, and distribution.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Create complementary materials such as one-pagers, FAQs, quick guides, walkthroughs, GIFs, lightweight decks, and internal reference content.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Support internal communication around new feature launches, helping customer-facing teams understand feature value, ideal use cases, and main workflows.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Collect feedback on asset consumption, clarity, and effectiveness to improve future launch enablement efforts.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Manage a backlog of enablement assets by launch priority, impact, and release timing.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Define and maintain quality standards for demos, screenshots, scripts, videos, and other feature-related materials.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Help build and maintain a reusable repository of enablement materials organized by product and feature.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Measure the consumption and effectiveness of enablement assets to identify what drives understanding and adoption.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Identify recurring knowledge gaps and suggest improvements to how product changes are communicated across the organization.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Use tools such as Intercom and Arcade to set up in-product tours and guided product experiences that support feature adoption.&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"section page-centered\"&gt;&lt;div&gt;&lt;h3&gt;Requirements&lt;/h3&gt;&lt;div class=\"posting-requirements plain-list\"&gt;&lt;div&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;3+ years of experience in product enablement, product education, customer education, product marketing, or similar roles focused on explaining SaaS functionality.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Previous experience creating enablement or educational materials for SaaS products and new feature launches.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Strong experience explaining product functionality clearly to both technical and non-technical audiences.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Hands-on experience producing product content end-to-end, including scripting, screen recording, voiceover, editing, and publication.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Strong video editing skills and the ability to independently create polished, engaging product videos.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Experience working cross-functionally with Product, Engineering, Marketing, Customer Success, and Support teams.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Strong organizational skills with the ability to manage multiple launch timelines, content formats, and priorities simultaneously.&lt;/li&gt;&lt;br&gt;&lt;li&gt;High attention to detail and commitment to content quality, consistency, and technical accuracy.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Familiarity with Intercom or similar platforms for setting up product tours, in-app guidance, and feature adoption flows.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Comfortable working in a fast-paced, high-growth environment with evolving product priorities.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Self-starter with strong ownership and the ability to take projects from idea to final delivery with minimal oversight.&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"section page-centered\"&gt;&lt;div&gt;&lt;h3&gt;Bonus Points&lt;/h3&gt;&lt;div class=\"posting-requirements plain-list\"&gt;&lt;div&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;Experience in B2B SaaS product enablement, customer education, or feature launch communications.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Experience with prompt engineering and AI tools usage - it's awesome if you're an AI enthusiast.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Experience creating content for product adoption, release enablement, or internal go-to-market readiness.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Familiarity with video, audio, and visual content production tools such as Premiere Pro, Camtasia, Loom, Descript, Screen Studio or similar platforms.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Experience working closely with Engineering Managers or product development teams on feature communication.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Experience creating in-app onboarding flows, product tours, or guided experiences for newly released features (using Intercom or similar feature)&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/tractian-product-content-specialist\"&gt;https://weworkremotely.com/remote-jobs/tractian-product-content-specialist&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 20:38:28 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 20:38:28 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/tractian-product-content-specialist</guid> <link>https://weworkremotely.com/remote-jobs/tractian-product-content-specialist</link> </item> <item> <title>Mercury: Senior Product Designer Mobile</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Management and Finance</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; San Francisco, CA, New York, NY, Portland, OR, or Remote within Canada or United States &lt;/p&gt; &lt;div class=\"job__description body\"&gt;&lt;div&gt;&lt;p&gt;The Memphis Group burst onto the scene in the early 1980s with a belief that design could be more than purely functional, it could be bold, expressive, and deeply human. They expanded what design could be, embracing color, emotion, and personality at a time when clarity and restraint dominated. That same spirit of possibility, of questioning defaults and reimagining what tools can feel like, still resonates today.&lt;/p&gt;&lt;br&gt;&lt;p&gt;At Mercury, we’re building *banking for builders. Entrepreneurs who are often on the go and need to manage their business from anywhere. People who live complex lives who need their personal finances to feel like a breeze. We're rethinking what financial tools can feel like when they're designed with real people in mind: fast, expressive, and thoughtfully crafted from the ground up.&lt;/p&gt;&lt;br&gt;&lt;p&gt;We’re looking for a Senior Product Designer to help define what modern *banking should feel like for founders on the go. This role is unique because you'll help define the holistic future of Mercury's mobile experience, not just design features. You'll work alongside another senior designer focused on pushing craft forward, ship high-impact work quickly and see it used by real businesses immediately, and have room to explore ambitious ideas and turn them into real products.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;strong&gt;What you’ll do&lt;/strong&gt;&lt;/p&gt;&lt;br&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;Lead design for major mobile initiatives from concept through launch and iteration&lt;/li&gt;&lt;br&gt;&lt;li&gt;Shape the vision for Mercury’s native iOS and Android experiences&lt;/li&gt;&lt;br&gt;&lt;li&gt;Turn complex financial workflows into simple, intuitive interactions&lt;/li&gt;&lt;br&gt;&lt;li&gt;Work closely with product managers and engineers to decide what to build and why&lt;/li&gt;&lt;br&gt;&lt;li&gt;Prototype ideas quickly to explore direction, test assumptions, and refine details&lt;/li&gt;&lt;br&gt;&lt;li&gt;Design polished, production-ready interfaces with exceptional craft and precision&lt;/li&gt;&lt;br&gt;&lt;li&gt;Contribute to our design systems and help evolve patterns across platforms&lt;/li&gt;&lt;br&gt;&lt;li&gt;Raise the quality bar for interaction, visual design, and product thinking across the team&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;p&gt;&lt;strong&gt;What we’re looking for&lt;/strong&gt;&lt;/p&gt;&lt;br&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;6+ years designing high-quality product experiences&lt;/li&gt;&lt;br&gt;&lt;li&gt;Strong visual and interaction design skills with a sharp eye for detail&lt;/li&gt;&lt;br&gt;&lt;li&gt;Experience designing complex systems, not just individual screens&lt;/li&gt;&lt;br&gt;&lt;li&gt;Ability to work through ambiguity and drive projects forward independently&lt;/li&gt;&lt;br&gt;&lt;li&gt;Clear communicator who can articulate decisions and influence product direction&lt;/li&gt;&lt;br&gt;&lt;li&gt;Experience designing native mobile apps (iOS and/or Android)&lt;/li&gt;&lt;br&gt;&lt;li&gt;Thoughtful collaborator who makes teammates better&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;p&gt;&lt;em&gt;*&lt;/em&gt;&lt;em&gt;Mercury is a fintech company, not an FDIC-insured bank. Banking services provided through Choice Financial Group and Column N.A., Members FDIC.&lt;/em&gt;&lt;/p&gt;&lt;br&gt;&lt;p&gt;The total rewards package at Mercury includes base salary, equity (stock options/RSUs), and benefits. Our salary and equity ranges are highly competitive within the SaaS and fintech industry and are updated regularly using the most reliable compensation survey data for our industry. New hire offers are made based on a candidate’s experience, expertise, geographic location, and internal pay equity relative to peers.&lt;/p&gt;&lt;br&gt;&lt;p&gt;Our target new hire base salary ranges for this role are the following:&lt;/p&gt;&lt;br&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;US employees (any location): $189,000–236,200 USD&lt;/li&gt;&lt;br&gt;&lt;li&gt;Canadian employees (any location):&amp;nbsp; $178,600–223,200 CAD&amp;nbsp;&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;p&gt;We use Covey as part of our hiring and / or promotional process for jobs in NYC and certain features may qualify it as an AEDT. As part of the evaluation process we provide Covey with job requirements and candidate submitted applications. We began using &lt;a href=\"https://getcovey.com/product/covey-scout-inbound\"&gt;Covey Scout for Inbound &lt;/a&gt;on January 22, 2024. Please see the independent bias audit report covering our use of Covey &lt;a href=\"https://getcovey.com/nyc-local-law-144\"&gt;here&lt;/a&gt;.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;em&gt;*Mercury is a fintech company, not an FDIC-insured bank. Banking services provided through Choice Financial Group and Column N.A., Members FDIC.&lt;/em&gt;&lt;/p&gt;&lt;br&gt;&lt;p&gt;#LI-SS1&lt;/p&gt;&lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/mercury-senior-product-designer-mobile\"&gt;https://weworkremotely.com/remote-jobs/mercury-senior-product-designer-mobile&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 20:38:25 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 20:38:25 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/mercury-senior-product-designer-mobile</guid> <link>https://weworkremotely.com/remote-jobs/mercury-senior-product-designer-mobile</link> </item> <item> <title>Blue Whale Lending Llc.: Graphic Design Assistant</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Management and Finance</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Baltimore US &lt;/p&gt; &lt;p&gt;Join our dynamic team at Blue Whale Lending LLC. as a creative force behind our visual communications. This position offers an exciting opportunity to assist in the design and production of engaging graphics that resonate with our audience.&lt;/p&gt;&lt;h3&gt;Key Responsibilities&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Collaborate with the design team to create visually appealing graphics for marketing materials.&lt;/li&gt;&lt;li&gt;Assist in the development of branding and promotional content.&lt;/li&gt;&lt;li&gt;Support the creation of digital assets for social media and online advertisements.&lt;/li&gt;&lt;li&gt;Maintain and update the design library and assets.&lt;/li&gt;&lt;li&gt;Participate in brainstorming sessions to generate innovative design ideas.&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;Requirements&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Proficiency in graphic design software such as Adobe Creative Suite (Photoshop, Illustrator, InDesign).&lt;/li&gt;&lt;li&gt;Strong understanding of design principles and techniques.&lt;/li&gt;&lt;li&gt;Excellent communication skills and ability to work collaboratively within a team.&lt;/li&gt;&lt;li&gt;Detail-oriented with a passion for creativity.&lt;/li&gt;&lt;li&gt;A portfolio showcasing relevant design work.&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;Nice to have&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Familiarity with web design and user experience principles.&lt;/li&gt;&lt;li&gt;Knowledge of current design trends and best practices.&lt;/li&gt;&lt;/ul&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/blue-whale-lending-llc-graphic-design-assistant\"&gt;https://weworkremotely.com/remote-jobs/blue-whale-lending-llc-graphic-design-assistant&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 20:38:17 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 20:38:17 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/blue-whale-lending-llc-graphic-design-assistant</guid> <link>https://weworkremotely.com/remote-jobs/blue-whale-lending-llc-graphic-design-assistant</link> </item> <item> <title>Tiger Analytics Inc.: Manager/ Sr. Manager - Data Product Manager</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Full-Stack Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Toronto, Ontario, Canada &lt;/p&gt; &lt;p&gt;Tiger Analytics is an advanced analytics consulting firm. We are the trusted analytics partner for several Fortune 100 companies, enabling them to generate business value from data. Our consultants bring deep expertise in Data Science, Machine Learning, and AI. Our business value and leadership have been recognized by various market research firms, including Forrester and Gartner.&lt;/p&gt;&lt;p&gt;We are seeking a strategic and execution-focused Data Product Manager to lead the development, modernisation, and scaling of enterprise data products. This role will sit at the intersection of business, data engineering, analytics, and technology, translating complex business needs into scalable data solutions that drive measurable impact.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Responsibilities:&lt;/strong&gt;&lt;br&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Work directly with client stakeholders to translate business problems into high-level analytics solution designs.&lt;/li&gt;&lt;li&gt;Develop customer understanding through customer data, contributing to the overall analysis of the consumer path to purchase.&lt;/li&gt;&lt;li&gt;Develop end-to-end solutions based on an in-depth understanding of business problems to ensure analytics solutions are delivered efficiently, predictably, and sustainably.&lt;/li&gt;&lt;li&gt;Responsible for managing analytics projects, collaborating with client stakeholders and Tiger’s team situated globally &lt;/li&gt;&lt;li&gt;End-to-end Data + Analytics delivery execution ownership and optimization of resource assignment, sequencing, and allocation.&lt;/li&gt;&lt;li&gt;Oversee the design, building, and managing of how business-ready data lives within the Enterprise Data Foundation.&lt;/li&gt;&lt;li&gt;Drive coordination between Domains, Products and Projects to help drive reuse and reduce redundancy/duplication in the D+A and broader client portfolio.&lt;/li&gt;&lt;li&gt;Responsible for making presentations to senior management, communicating results to business teams, and developing plans to help operationalize analytic solutions.&lt;/li&gt;&lt;li&gt;Build data roadmaps to meet hydration targets and support timely delivery for global data initiatives and programs.&lt;/li&gt;&lt;li&gt;Ensure data cataloguing in the Data Foundation is accessible to business stakeholders.&lt;/li&gt;&lt;li&gt;Work with program Technical Data Product Managers to ensure expectations from D+A are managed and to eliminate disconnects regarding what can be addressed.&lt;/li&gt;&lt;/ul&gt; &lt;ul&gt;&lt;li&gt;8–12 years of progressive experience across product management, data analytics, data science, and data management within business-facing environments. &lt;/li&gt;&lt;li&gt; Minimum 7 years of experience in Product roles or in a Data Product Manager or Senior Business Analyst capacity with ownership of end-to-end data initiatives. &lt;/li&gt;&lt;li&gt;Proven experience owning the full lifecycle of data products — from ideation, business case development, and roadmap definition to MVP launch, scaling, and continuous optimization. &lt;/li&gt;&lt;li&gt;Demonstrated experience leading data migration and modernization programs (e.g., legacy to cloud-based architectures). &lt;/li&gt;&lt;li&gt;Advanced SQL proficiency with strong understanding of data modeling, data architecture, and analytics frameworks. &lt;/li&gt;&lt;li&gt;Hands-on experience with GCP is preferred.&lt;/li&gt;&lt;li&gt;Proven ability to translate complex business requirements into structured epics, user stories, and technical documentation that enable efficient cross-functional delivery. &lt;/li&gt;&lt;li&gt;Experience collaborating with cross-functional teams including Product Owners, Data Engineers, Developers, Testers, and Analytics teams. &lt;/li&gt;&lt;li&gt;Strong executive presence with the ability to engage VP-level and senior stakeholders, translating business problems into high-level analytics and data solution approaches. &lt;/li&gt;&lt;li&gt;Demonstrated ability to identify high-value analytics opportunities across core business domains (e.g., marketing, risk, operations) and define measurable paths to value realization. &lt;/li&gt;&lt;li&gt;Experience driving innovative, business-oriented solutions using advanced analytics, feature engineering, and machine learning techniques. &lt;/li&gt;&lt;li&gt;Strong people leadership capabilities, with experience building, mentoring, and managing multi-level teams. &lt;/li&gt;&lt;li&gt;Excellent communication skills, with the ability to simplify complex technical concepts for both data &amp;amp; analytics teams and non-technical business stakeholders. &lt;/li&gt;&lt;li&gt;Graduate degree in Business Analytics, MBA, or equivalent professional experience. &lt;/li&gt;&lt;/ul&gt; &lt;p&gt;Significant career development opportunities exist as the company grows. The position offers a unique opportunity to be part of a small, fast-growing, challenging and entrepreneurial environment, with a high degree of individual responsibility.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;Tiger Analytics provides equal employment opportunities to applicants and employees without regard to race, color, religion, age, sex, sexual orientation, gender identity/expression, pregnancy, national origin, ancestry, marital status, protected veteran status, disability status, or any other basis as protected by federal, state, or local law.&lt;/strong&gt;&lt;/em&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/tiger-analytics-inc-manager-sr-manager-data-product-manager\"&gt;https://weworkremotely.com/remote-jobs/tiger-analytics-inc-manager-sr-manager-data-product-manager&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 20:38:12 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 20:38:12 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/tiger-analytics-inc-manager-sr-manager-data-product-manager</guid> <link>https://weworkremotely.com/remote-jobs/tiger-analytics-inc-manager-sr-manager-data-product-manager</link> </item> <item> <title>Sharegate Migrate Chezworkleap: Senior Product Designer - ShareGate Migrate</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Full-Stack Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Canada - Remote &lt;/p&gt; &lt;div class=\"job__description body\"&gt;&lt;div&gt;&lt;div&gt;&lt;br&gt;&lt;h2 class=\"title\"&gt;Description de l'entreprise&lt;/h2&gt;&lt;br&gt;&lt;/div&gt;&lt;br&gt;&lt;div class=\"wysiwyg\"&gt;&lt;br&gt;&lt;p&gt;Workleap est une entreprise tech basée à Montréal avec comme mission de rendre le travail plus simple.&lt;/p&gt;&lt;br&gt;&lt;p&gt;Depuis 2006, on bâtit des produits innovants qui aident les équipes RH et TI à relever leurs plus grands défis.&lt;/p&gt;&lt;br&gt;&lt;p&gt;Workleap offre deux lignes de produits distinctes :&lt;/p&gt;&lt;br&gt;&lt;ul class=\"ak-ul\"&gt;&lt;br&gt;&lt;li&gt;&lt;br&gt;&lt;p&gt;La &lt;a href=\"https://workleap.com/fr/plateforme\"&gt;plateforme Workleap&lt;/a&gt;, une solution RH propulsée par l’IA qui élève la performance des équipes et stimule l’engagement des employés.&lt;/p&gt;&lt;br&gt;&lt;/li&gt;&lt;br&gt;&lt;li&gt;&lt;br&gt;&lt;p&gt;&lt;a href=\"https://sharegate.com/\"&gt;ShareGate&lt;/a&gt;, le leader incontesté en migration et gouvernance Microsoft 365, reconnu par les professionnels TI du monde entier pour sa grande simplicité.&lt;/p&gt;&lt;br&gt;&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;p&gt;Aujourd’hui, c’est plus de 20 000 entreprises partout dans le monde qui comptent sur les produits Workleap pour croître, évoluer et opérer.&lt;/p&gt;&lt;br&gt;&lt;p&gt;On est des bâtisseurs dans l’âme et ce qui nous passionne est clair : créer les produits les plus simples qui amènent de la valeur exceptionnelle à nos clients, un point c’est tout.&lt;/p&gt;&lt;br&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Description du poste&lt;/h3&gt;&lt;br&gt;&lt;p&gt;&lt;em&gt;Concrètement à quoi va ressembler ton poste ? &lt;/em&gt;&amp;nbsp;&lt;/p&gt;&lt;br&gt;&lt;p&gt;En tant que &lt;strong&gt;Senior Designer&lt;/strong&gt;&lt;strong&gt; de Produit&lt;/strong&gt; sur&amp;nbsp;&lt;strong&gt;ShareGate Migrate&lt;/strong&gt;, tu travailleras au sein d’un &lt;strong&gt;trio produit étroitement collaboratif&lt;/strong&gt; (PM, Tech Lead, Designer) pour façonner l’expérience d’un produit utilisé dans des projets à fort impact et à forte sensibilité opérationnelle.&amp;nbsp;Tu concevras des solutions qui aident les administrateurs TI à naviguer dans des scénarios de migration complexes avec clarté et confiance. Ton travail couvre à la fois la &lt;strong&gt;stratégie et l’exécution&lt;/strong&gt; : définition des problématiques, conception des parcours et des interactions, affinage des détails d’interface, et itérations rapides basées sur les apprentissages.&amp;nbsp;Tu exploreras de manière réfléchie comment l’&lt;strong&gt;IA&lt;/strong&gt; peut enrichir l’expérience, que ce soit pour simplifier la planification, faire émerger des insights pertinents ou guider les équipes dans leurs décisions techniques. C’est une occasion de travailler sur des enjeux concrets ayant un impact réel sur l’évolution des environnements numériques des organisations. Tu t’épanouiras dans ce rôle si tu aimes la complexité, collabores naturellement avec les ingénieurs et les PM, et accordes une grande importance à la création d’expériences utilisateur fiables, réfléchies et capables de passer à l’échelle.&lt;/p&gt;&lt;br&gt;&lt;p&gt;Responsabilités :&lt;/p&gt;&lt;br&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;Piloter le design de bout en bout au sein de ton équipe produit, de la définition des problèmes jusqu’au raffinement des interactions finales ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Transformer des parcours ambigus ou techniques en expériences intuitives et utiles pour des professionnels TI ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Concevoir des parcours, interfaces et interactions qui simplifient les scénarios de migration Microsoft 365 et cloud ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Collaborer étroitement avec les PM, les ingénieurs et les experts métier pour clarifier le périmètre et aligner la stratégie ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Prototyper, tester et itérer rapidement afin de valider les hypothèses et renforcer les solutions ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Utiliser les données, les retours clients et les insights produit pour guider les décisions et améliorer les résultats ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Explorer des opportunités liées à l’IA pour rendre les flux de migration et de gouvernance plus efficaces, prédictifs et fiables ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Contribuer à l’amélioration des pratiques design à l’aide de nouveaux outils, d’innovations et de nouvelles méthodologies ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Participer à l’évolution du design system et veiller à la cohérence de l’expérience à travers ShareGate.&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;p&gt;&lt;em&gt;Une semaine typique? &lt;/em&gt; &amp;nbsp;&lt;/p&gt;&lt;br&gt;&lt;p&gt;Tu évolueras naturellement entre exploration stratégique, design concret et collaboration étroite. Concrètement, tu pourras :&lt;/p&gt;&lt;br&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;Contribuer à la direction produit lors des activités de planification et de découverte en trio ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Traduire les besoins clients et les opportunités business en parcours clairs, wireframes et prototypes ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Travailler avec l’ingénierie pour affiner le périmètre, comprendre les contraintes et maintenir un haut niveau de qualité design tout au long du développement ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Présenter des travaux en cours aux équipes et aux parties prenantes lors de critiques ou de revues asynchrones ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Analyser les données de migration, les tendances de support et les comportements utilisateurs pour éclairer les décisions ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Raffiner les détails d’interaction et assurer des hand-offs clairs et cohérents ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Documenter les décisions et communiquer efficacement le raisonnement derrière les choix effectués ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Utiliser des outils d’IA pour mieux comprendre nos utilisateurs et augmenter ton efficacité ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Prototyper régulièrement avec des outils de prototypage assistés par l’IA pour communiquer, tester et valider les solutions.&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;p&gt;Tu bénéficieras d’autonomie, de responsabilité, et d’une équipe qui valorise l’exécution réfléchie et l’apprentissage continu.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;strong&gt;Qui est l’équipe que tu vas rejoindre ? &lt;/strong&gt;&lt;/p&gt;&lt;br&gt;&lt;p&gt;Tu rejoindras une équipe multidisciplinaire où les designers sont impliqués tôt, influencent la direction produit et collaborent étroitement avec l’ingénierie et la gestion de produit.&lt;br&gt;Le design chez Workleap est collaboratif, riche en feedback, et engagé à constamment élever le niveau, autant dans les processus que dans la qualité du craft.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;em&gt;Quels sont les prochains défis qui attendent ton équipe ?&lt;/em&gt;&amp;nbsp;&lt;/p&gt;&lt;br&gt;&lt;p&gt;ShareGate évolue rapidement, et les défis design à venir demandent à la fois créativité et rigueur. Tu contribueras notamment à :&lt;/p&gt;&lt;br&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;Des scénarios de migration à l’échelle entreprise, où la clarté, la prévisibilité et l’efficacité sont essentielles ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;La modernisation des expériences clés de ShareGate Migrate et de l’écosystème plus large ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;L’évolution d’un design system en croissance, soutenant de nouveaux patterns, l’accessibilité et la cohérence multi-produits ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Des expériences de planification et de guidance AI-native pour aider les équipes TI à anticiper les risques et prendre des décisions éclairées.&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;p&gt;C’est un rôle où tu peux influencer non seulement le fonctionnement du produit aujourd’hui, mais aussi son évolution sur les prochaines années.&lt;/p&gt;&lt;br&gt;&lt;h3&gt;&lt;strong&gt;Qualifications&lt;/strong&gt;&amp;nbsp;&lt;/h3&gt;&lt;br&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;6+ ans d’expérience en design de produits B2B SaaS au sein d’équipes multidisciplinaires ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Fort sens de l’utilisateur et aisance dans des environnements ambigus et techniquement complexes ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Maîtrise de la stratégie, des parcours UX, du design UI et des détails d’interaction soignés ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Capacité à trouver l’équilibre entre rapidité d’exécution et haute qualité ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Expérience auprès d’audiences techniques (TI, outils d’administration, plateformes) — un atout ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Expérience en conception ou collaboration sur des fonctionnalités propulsées par l’IA ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Excellentes compétences en communication et en storytelling ;&lt;/li&gt;&lt;br&gt;&lt;li&gt;Grand souci du détail et engagement fort envers la qualité du design.&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;p&gt;&lt;br&gt;&lt;strong&gt;Fourchette salariale : 120–145 k $ CAD.&lt;br&gt;&lt;/strong&gt;&lt;em&gt;La fourchette salariale affichée reflète notre échelle de rémunération au Canada. Au moment de formuler une offre, selon la région où le candidat est basé, certains ajustements peuvent s’appliquer afin de refléter les conditions du marché local.&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;br&gt;&lt;h2 class=\"title\"&gt;Qui nous sommes&lt;/h2&gt;&lt;br&gt;&lt;p&gt;On est une équipe de curieux et de créateurs passionnés, rassemblés par le même objectif : rendre le travail plus simple - et meilleur - pour tout le monde. Les défis stimulent notre créativité, on carbure à l'intensité, et repousser les limites fait partie de notre ADN. On pense que les meilleures idées naissent de l’expérimentation, de l’apprentissage continu, et parfois même de l’inconfort—c’est comme ça qu’on évolue.&lt;/p&gt;&lt;br&gt;&lt;p&gt;Depuis 2006, on réinvente la façon dont les équipes travaillent, en alliant créativité et technologie pour résoudre de vrais problèmes en TI et en RH. On avance vite, on apprend constamment, et on garde toujours nos clients au coeur de nos décisions. Si tu es une personne proactive, qui prend les choses en main, adore collaborer et n’a pas peur de plonger dans l’inconnu - tu trouveras parfaitement ta place parmi nous.&lt;/p&gt;&lt;br&gt;&lt;h2 class=\"title\"&gt;Informations supplémentaires&lt;/h2&gt;&lt;br&gt;&lt;/div&gt;&lt;br&gt;&lt;div class=\"wysiwyg\"&gt;&lt;br&gt;&lt;p&gt;Chez Workleap, on bâtit ensemble, on se fait confiance et on se soutient, dans la réussite ou dans l'échec. Tu pourras t'exprimer, évoluer et développer ta créativité dans un environnement qui s'adaptera à ton quotidien et à tes besoins. &amp;nbsp;&lt;br&gt;&lt;br&gt;Nos aspirations sont de bâtir un environnement de travail sain et inclusif. Il s’agit là de l’affaire de tous et de toutes. &lt;br&gt;&lt;br&gt;&lt;strong&gt;Notre processus Expérience Candidat chez Workleap :&lt;/strong&gt;&lt;br&gt;Entrevue téléphonique - Entrevue virtuelle par Teams - Mise en situation - Offre d'emploi&lt;/p&gt;&lt;br&gt;&lt;p&gt;En tant qu’entreprise technologique, nous utilisons l’IA pour optimiser le recrutement, tout en veillant à ce que toutes les décisions d’évaluation restent humaines.&lt;/p&gt;&lt;br&gt;&lt;p&gt;On a hâte d'apprendre à te connaître !&lt;br&gt;&lt;br&gt;En postulant à ce poste, tu confirmes avoir lu et être en accord avec notre &lt;a href=\"https://workleap.com/fr/confidentialite/\"&gt;politique de confidentialité&lt;/a&gt;.&lt;br&gt;&lt;br&gt;#LI-Remote&lt;/p&gt;&lt;br&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/sharegate-migrate-chezworkleap-senior-product-designer-sharegate-migrate\"&gt;https://weworkremotely.com/remote-jobs/sharegate-migrate-chezworkleap-senior-product-designer-sharegate-migrate&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 20:38:12 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 20:38:12 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/sharegate-migrate-chezworkleap-senior-product-designer-sharegate-migrate</guid> <link>https://weworkremotely.com/remote-jobs/sharegate-migrate-chezworkleap-senior-product-designer-sharegate-migrate</link> </item> <item> <title>Duel.com: Product Owner</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Product</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Malta &lt;/p&gt; &lt;p&gt;Duel is a protest against everything wrong in gambling. The purest, fairest casino ever built. The Vatican of gamba. We're waging war on scammers, fake bets, and dark patterns — and we need a Product Owner who wants to burn the old playbook down.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;The role&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;You own the product backlog across casino, sportsbook, and games. You translate vision into stories, stories into shipped features, and shipped features into better player experiences. You work directly with engineering and design — no layers, no bureaucracy, no nonsense.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;If you want to build the same casino everyone else has built, move on.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;What you'll do&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Own and prioritise the backlog across all platforms&lt;/li&gt;&lt;li&gt;Turn product vision into clear user stories and tasks&lt;/li&gt;&lt;li&gt;Monitor player engagement and performance — find what's broken, fix it, find what's missing, build it&lt;/li&gt;&lt;li&gt;Gather and define requirements with stakeholders, functional and non-functional&lt;/li&gt;&lt;li&gt;Drive growth through ideas that are actually different&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;What you'll need&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;3+ years in a product ownership or management role&lt;/li&gt;&lt;li&gt;Gambling or gaming industry experience preferred&lt;/li&gt;&lt;li&gt;Comfortable working with both technical and commercial teams&lt;/li&gt;&lt;li&gt;Experience with distributed, remote-first development teams&lt;/li&gt;&lt;li&gt;Clear communicator, strong prioritisation instincts, ownership mindset&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;Come build something pure.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/duel-com-product-owner\"&gt;https://weworkremotely.com/remote-jobs/duel-com-product-owner&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 20:38:12 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 20:38:12 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/duel-com-product-owner</guid> <link>https://weworkremotely.com/remote-jobs/duel-com-product-owner</link> </item> <item> <title>Ingenious.build: Senior Product Designer</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Design</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Poland - Remote &lt;/p&gt; &lt;div class=\"job__description body\"&gt;&lt;div&gt;&lt;p&gt;At INGENIOUS.BUILD, we have developed a top-notch platform for companies in the real estate and construction industries worldwide. Our platform enables companies to easily manage all aspects of their projects from start to finish, both internally and with other project participants.&amp;nbsp;&lt;/p&gt;&lt;br&gt;&lt;p&gt;Joining INGENIOUS.BUILD means embarking on an incredible journey to create the first cloud application for managing the entire lifecycle of a real estate construction project. You'll be building what some consider the holy grail of construction project management. It's a big, bold, and audacious endeavor, and if you have what it takes, you'll play a direct role in its development.&amp;nbsp;&lt;/p&gt;&lt;br&gt;&lt;p&gt;And if you’ve got what it takes, you’ll be directly involved in its development. The rest, as they say, will be history...&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=\"styles--21mG1\"&gt;&lt;br&gt;&lt;div&gt;&lt;br&gt;&lt;p&gt;&lt;strong&gt;About the role&lt;/strong&gt;:&lt;/p&gt;&lt;br&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;br&gt;&lt;p&gt;We are actively seeking a skilled Senior Product Designer to join our dynamic team. As a Product Designer at INGENIOUS.BUILD, you’ll play a key role in crafting and enhancing user interfaces for our platform in close collaboration with product management and engineering teams. You’ll have the opportunity to build prototypes, gather feedback from stakeholders, and ensure the seamless integration of design elements across our platform. Your work will directly contribute to delivering exceptional user experiences and the overall success of our product.&amp;nbsp; If you’re passionate about creating intuitive, user-centered designs and thrive in a collaborative environment, we’d love to hear from you.&lt;br&gt;&lt;br&gt;&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;strong&gt;In this position, you wil&lt;/strong&gt;&lt;strong&gt;l&lt;/strong&gt;:&lt;/p&gt;&lt;br&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;Collaborate closely with product management and engineering teams to create impactful user interfaces&lt;/li&gt;&lt;br&gt;&lt;li&gt;Develop clickable prototypes to demonstrate design concepts and gather feedback&lt;/li&gt;&lt;br&gt;&lt;li&gt;Work with stakeholders to understand their needs and incorporate feedback into design iterations&lt;/li&gt;&lt;br&gt;&lt;li&gt;Lead rapid design exploration and prototyping to validate concepts early in the product development cycle.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Plan and execute user research and testing efforts, including A/B tests, usability studies, and experiments.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Synthesize research, behavioral data, and test outcomes into clear design recommendations.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Drive continuous design iteration based on user feedback, product metrics, and business impact.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Conduct competition research to inform design decisions.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Assist developers during the implementation phase by providing support and clarifications&lt;/li&gt;&lt;br&gt;&lt;li&gt;Utilize INGENIOUS.BUILD Design System to maintain consistency across the product&lt;/li&gt;&lt;br&gt;&lt;li&gt;Take ownership of features and drive them from conception to delivery&lt;/li&gt;&lt;br&gt;&lt;li&gt;Create user-friendly interfaces for the complex B2B web application&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;strong&gt;Skills and Experience needed&lt;/strong&gt;:&lt;/p&gt;&lt;br&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;Minimum of 5 years experience as a UX/UI/Product Designer or in a similar role&lt;/li&gt;&lt;br&gt;&lt;li&gt;Demonstrated strong teamwork skills coupled with a problem-solving attitude&lt;/li&gt;&lt;br&gt;&lt;li&gt;Proven experience in rapid design iteration, prototyping, and concept validation.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Hands-on experience with user research and testing methods, including A/B testing, usability testing, and experiment analysis.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Strong ability to synthesize user insights, behavioral data, and business needs into clear design solutions.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Deep understanding of product design processes, interaction design, and user-centered design best practices.&lt;/li&gt;&lt;br&gt;&lt;li&gt;Familiarity with WCAG accessibility rules&lt;/li&gt;&lt;br&gt;&lt;li&gt;Proficiency in Figma&lt;/li&gt;&lt;br&gt;&lt;li&gt;Ability to create and maintain Design System&lt;/li&gt;&lt;br&gt;&lt;li&gt;Demonstrated self-motivation, a proactive mindset, and an ownership mentality to drive projects independently and deliver high-quality results&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;p&gt;&lt;strong&gt;Benefits of Working with Us:&lt;/strong&gt;&lt;/p&gt;&lt;br&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;We provide high-performance company laptops for optimal productivity&lt;/li&gt;&lt;br&gt;&lt;li&gt;Unlimited PTO lets you take the time you need to recharge&lt;/li&gt;&lt;br&gt;&lt;li&gt;One-time $500 office budget to set up your workspace&lt;/li&gt;&lt;br&gt;&lt;li&gt;$50 monthly for educational resources, rolling over until year-end&lt;/li&gt;&lt;br&gt;&lt;li&gt;Stock options so you can share in the company’s growth&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;/div&gt;&lt;br&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;p&gt;We're fired up to learn more about you to see how you can help us on our mission!&amp;nbsp;&lt;/p&gt;&lt;br&gt;&lt;p&gt;We genuinely look forward to receiving your application after submitting your information a member from the Recruitment Team will reach out accordingly.&amp;nbsp;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/ingenious-build-senior-product-designer\"&gt;https://weworkremotely.com/remote-jobs/ingenious-build-senior-product-designer&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 20:37:27 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 20:37:27 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/ingenious-build-senior-product-designer</guid> <link>https://weworkremotely.com/remote-jobs/ingenious-build-senior-product-designer</link> </item> <item> <title>E. Breuninger&amp; Co.: Product Owner (m/w/d) Tools &amp; Systeme Customer Service // remote möglich</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Product</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Stuttgart, Deutschland &lt;/p&gt; &lt;div&gt;&lt;div&gt;&lt;p class=\"googlejobs-paragraph--empty\"&gt;&lt;/p&gt;&lt;h2 class=\"title\"&gt;Unternehmensbeschreibung&lt;/h2&gt;&lt;/div&gt;&lt;div class=\"wysiwyg\"&gt;&lt;p&gt;Fashion und Lifestyle, 6.500 Mitarbeiter:innen, 13 Department Stores, Online-Shops in Deutschland, Polen, Österreich, Belgien, Luxemburg, Spanien, Italien, Tschechien, den Niederlanden und der Schweiz, über 2.000 Marken, 25 Restaurants &amp;amp; Confiserien, 15 erstklassige Services, drei Friseur-Salons und stets ein besonderes Einkaufserlebnis – das ist Breuninger. Ein Traditionsunternehmen, das internationale Wege geht, seine Ziele klar definiert und innovative Möglichkeiten schafft.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;p class=\"googlejobs-paragraph--empty\"&gt;&lt;/p&gt;&lt;h2 class=\"title\"&gt;Stellenbeschreibung&lt;/h2&gt;&lt;/div&gt;&lt;div class=\"wysiwyg\"&gt;&lt;p&gt;&lt;strong&gt;Wer wir sind:&amp;nbsp;Technologischer Taktgeber&amp;nbsp;für exzellenten Service&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;In unserer Abteilung Customer Service Services (CSS) sind wir der technologische Taktgeber für den Kundenservice bei Breuninger. Unser Ziel: Wir bauen die technische&amp;nbsp;Infrastruktur, die unsere&amp;nbsp;Kolleg:innen&amp;nbsp;befähigt, Kundenbegeisterung auf Breuninger-Niveau zu erzeugen. Wir administrieren, konfigurieren und orchestrieren die Tools von morgen – von der Telefonie bis zur KI&amp;nbsp;–&amp;nbsp;und schaffen damit einzigartige Kundenerlebnisse.&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Deine Mission: Bauen, Steuern und Begeistern&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Du bist weit mehr als&amp;nbsp;ein:e&amp;nbsp;Administrator:in&amp;nbsp;–&amp;nbsp;Du bist&amp;nbsp;der:die&amp;nbsp;Botschafter:in&amp;nbsp;Deiner Produkte. Du nimmst strategische Leitplanken, sowie operative Problemstellungen&amp;nbsp;auf und übersetzt sie eigenständig in exzellente technologische Lösungen. Du liebst es, tief in die Konfiguration einzutauchen, hältst aber gleichzeitig die Fahne für&amp;nbsp;Deine Produkte hoch und steckst andere mit&amp;nbsp;Deiner Begeisterung für neue Features an. Damit bist&amp;nbsp;Du ein wesentlicher Teil der digitalen Transformation des Customer Service.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;End-to-End Konfiguration&lt;/strong&gt;: Du verantwortest die Administration und Weiterentwicklung unserer Low-Code-Produkte (z. B.&amp;nbsp;Zendesk,&amp;nbsp;Babelforce). Du hast Freude daran, „unter die Haube“ zu schauen und Prozesse technisch perfekt&amp;nbsp;abzubilden.&amp;nbsp;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Product&amp;nbsp;Evangelism&lt;/strong&gt;: Du machst Lust auf das Produkt! Du vermarktest neue Funktionen intern, begeisterst die&amp;nbsp;User:innen&amp;nbsp;für&amp;nbsp;Deine Lösungen und sorgst für eine hohe Akzeptanz und Freude an der Nutzung.&amp;nbsp;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Demand- &amp;amp; Stakeholder-Management&lt;/strong&gt;: Du nimmst Anforderungen aus den&amp;nbsp;Operations&amp;nbsp;auf, priorisierst diese und&amp;nbsp;orchestrierst IT-Schnittstellen und externe Partner bei Bedarf.&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;KI-Pionierarbeit&lt;/strong&gt;: Du spielst eine zentrale Rolle bei der Auswahl und Implementierung von KI-Komponenten. Du beherrschst&amp;nbsp;Prompting&amp;nbsp;und optimierst unsere Systeme für maximale Effizienz.&amp;nbsp;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Projektsteuerung&lt;/strong&gt;: Du leitest (Teil-)Projekte von der Marktanalyse bis zum Go-Live und sorgst dafür, dass das \"perfekte Produkt\" für den Kundenservice entsteht.&amp;nbsp;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Das „Breuninger-Plus“ für Dich:&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Gestaltungsspielraum: Wir bieten&amp;nbsp;Dir eine zentrale Rolle bei der technologischen Transformation – inklusive der Freiheit,&amp;nbsp;Deine Rolle nach&amp;nbsp;Deinen Stärken (Strategie vs. Technik) mitzugestalten.&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div&gt;&lt;p class=\"googlejobs-paragraph--empty\"&gt;&lt;/p&gt;&lt;h2 class=\"title\"&gt;Qualifikationen&lt;/h2&gt;&lt;/div&gt;&lt;div class=\"wysiwyg\"&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Erfahrung und Background&lt;/strong&gt;:&amp;nbsp;Du verfügst über mehrjährige Erfahrung als&amp;nbsp;Product/Business&amp;nbsp;Owner:in&amp;nbsp;oder&amp;nbsp;eine vergleichbare&amp;nbsp;Tätigkeit&amp;nbsp;und bist es gewohnt, in einem sich schnell wandelnden &lt;strong&gt;E-Commerce&amp;nbsp;Umfeld&lt;/strong&gt;&amp;nbsp;agil&amp;nbsp;und innovativ&amp;nbsp;zu arbeiten.&amp;nbsp;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Qualifikation&lt;/strong&gt;: Ein abgeschlossenes Studium im Bereich Betriebswirtschaft oder Wirtschaftsinformatik ist von Vorteil.&amp;nbsp;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Tool-Expertise &amp;amp; Leidenschaft&lt;/strong&gt;: Du hast fundierte Erfahrung&amp;nbsp;in der Konfiguration und Administration von&lt;strong&gt;&amp;nbsp;Ticket- oder Telefonie-Systemen im Customer Service &lt;/strong&gt;(z. B.&amp;nbsp;Zendesk,&amp;nbsp;Babelforce) und brennst darauf, diese technologisch auf das nächste Level zu heben.&amp;nbsp;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Steuerung&lt;/strong&gt;: Du hast Erfahrung in der&amp;nbsp;eigenverantwortlichen&amp;nbsp;Steuerung von Produktweiterentwicklungen oder vergleichbarer&amp;nbsp;Projekte&amp;nbsp;und bist in der Lage externe Partner und Stakeholder zu orchestrieren.&amp;nbsp;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Technisches Mindset&lt;/strong&gt;: Du liebst Low-Code/No-Code-Tools und hast eine hohe Affinität für KI-Lösungen und modernes&amp;nbsp;Prompting.&amp;nbsp;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Mindset eines digitalen Gastgeber:in:&lt;/strong&gt;&amp;nbsp;Du trägst die&amp;nbsp;Verantwortung,&amp;nbsp;dass Dein Produkt nicht nur reibungslos funktioniert, sondern&amp;nbsp;interne und externe&amp;nbsp;Kunden an jedem Kontaktpunkt begeistert&amp;nbsp;werden.&amp;nbsp;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div&gt;&lt;p class=\"googlejobs-paragraph--empty\"&gt;&lt;/p&gt;&lt;h2 class=\"title\"&gt;Zusätzliche Informationen&lt;/h2&gt;&lt;/div&gt;&lt;div class=\"wysiwyg\"&gt;&lt;p&gt;Bei Breuninger geht es um mehr als einen Job. Wir leben Wertschätzung und Verantwortung – und genau das spiegeln unsere Benefits wieder. Sie sind ein Zeichen dafür, wie wir Dich begleiten und unterstützen. Und das Beste: Dies ist nur ein Teil dessen, was Dich bei uns erwartet.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Wertschätzung, die spürbar ist &lt;/strong&gt;Freiwilliges Urlaubs- und Weihnachtsgeld sowie Zuschüsse zur Altersvorsorge.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Dein Stil, Dein Vorteil&amp;nbsp;&lt;/strong&gt;30 % Mitarbeitendenrabatt, auch für Deine:n Partner:in, inklusive Gastronomie und Friseur.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Deine Treue zählt&lt;/strong&gt;&amp;nbsp;Ab dem 5. Jahr erhältst Du zusätzliche Urlaubstage.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Sport-Life-Balance&amp;nbsp;&lt;/strong&gt;Zuschuss zu Deiner Urban Sports Mitgliedschaft.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Wachse mit uns&lt;/strong&gt; Von Trainings bis zu Führungsprogrammen.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Workation available&lt;/strong&gt; Bis zu 30 Kalendertage im Jahr in ausgewählten europäischen Ländern.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Urlaub à la carte&lt;/strong&gt;&amp;nbsp;Über Gehaltsumwandlung kannst Du Dir zusätzliche Urlaubstage sichern, ergänzt durch Sabbatical-Option.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Mobil im Alltag&amp;nbsp;&lt;/strong&gt;Mit Company Bike Dein Wunschrad oder E-Bike unkompliziert leasen.&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;Haben wir Dein&amp;nbsp;Interesse geweckt?&lt;/p&gt;&lt;p&gt;Dann sollten wir uns schnell kennenlernen.&lt;/p&gt;&lt;p&gt;Bei Fragen steht Dir &lt;strong&gt;Sabrina Rösch&lt;/strong&gt; gerne jederzeit zur Verfügung.&lt;/p&gt;&lt;p&gt;Wir freuen uns auf Deine aussagekräftige Online Bewerbung mit Angabe Deiner Verfügbarkeit sowie Gehaltsvorstellung.&amp;nbsp;Bewerbungen per E-Mail können aus Datenschutzgründen &lt;strong&gt;nicht verarbeitet&lt;/strong&gt; werden. Nutze daher bitte ausschließlich unser &lt;strong&gt;Online-Bewerbungssystem&lt;/strong&gt;.&lt;/p&gt;&lt;div&gt;&lt;/div&gt;&lt;p&gt;&lt;a href=\"https://www.breuninger.com/de/service/imprint/\"&gt;Impressum&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/e-breuninger-co-product-owner-m-w-d-tools-systeme-customer-service-remote-moglich\"&gt;https://weworkremotely.com/remote-jobs/e-breuninger-co-product-owner-m-w-d-tools-systeme-customer-service-remote-moglich&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 20:37:05 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 20:37:05 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/e-breuninger-co-product-owner-m-w-d-tools-systeme-customer-service-remote-moglich</guid> <link>https://weworkremotely.com/remote-jobs/e-breuninger-co-product-owner-m-w-d-tools-systeme-customer-service-remote-moglich</link> </item> <item> <title>Great Minds: Principal Product Manager (Content Authoring, Delivery &amp; CMS)</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Product</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; DC, District of Columbia, United States &lt;/p&gt; &lt;div class=\"sc-1gch2qa-0 fhKCjg\"&gt;&lt;div&gt;&lt;div class=\"sc-gfrfnr-2 deOrHQ\"&gt;&lt;/div&gt;&lt;div class=\"sc-18h7are-0 ebVyJP\"&gt;&lt;div class=\"sc-1tu9fip-2 ezRMeN\"&gt;&lt;div class=\"sc-1tu9fip-1 kdUgoN\"&gt;&lt;div class=\"sc-1tu9fip-3 iFQjUO\"&gt;&lt;div class=\"sc-ji5wy4-0 jIYAZB\"&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div class=\"sc-1uwf3m5-2 kxtNOL\"&gt;&lt;div class=\"sc-1v95195-0 jscoSJ\"&gt;&lt;div&gt;&lt;div&gt;&lt;h2 class=\"sc-1npqnwg-4 sc-1npqnwg-5 sc-1uwf3m5-0 bTeJGh custom-css-style-job-description\"&gt;Job description&lt;/h2&gt;&lt;div class=\"sc-1fwbcuw-0 bgbhkg\"&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Who We Are&lt;/strong&gt;&lt;/p&gt;&lt;p class=\"MsoBodyTextCxSpMiddle\"&gt;Great Minds is a high-growth, mission-driven organization founded by educators in 2007. As a for-profit, Public Benefit Corporation, we believe all students deserve access to meaningful, challenging content—and all teachers deserve tools that are intuitive, effective, and built for the realities of today’s classrooms.&lt;/p&gt;&lt;p class=\"MsoBodyTextCxSpMiddle\"&gt;We develop high-quality, knowledge-rich math, science and ELA curricula grounded in research and designed in collaboration with educators. Our materials reflect real classroom needs and are built to drive lasting student outcomes.&lt;/p&gt;&lt;p class=\"MsoBodyTextCxSpMiddle\"&gt;&amp;nbsp;&lt;/p&gt;&lt;p class=\"MsoBodyTextCxSpMiddle\"&gt;We are committed to usability, coherence, and practical implementation—supporting teachers not just through curriculum, but with professional learning, purposeful technology, and responsive service that enable strong adoption and impact.&lt;/p&gt;&lt;p class=\"MsoBodyTextCxSpMiddle\"&gt;&amp;nbsp;&lt;/p&gt;&lt;p class=\"MsoBodyTextCxSpMiddle\"&gt;&lt;strong&gt;What We Build&lt;/strong&gt;&lt;/p&gt;&lt;p class=\"MsoBodyTextCxSpMiddle\"&gt;Our products—&lt;strong&gt;Eureka Math and &lt;/strong&gt;Eureka Math², &lt;strong&gt;Wit &amp;amp; Wisdom&lt;/strong&gt;, PhD Science, &lt;strong&gt;Geodes&lt;/strong&gt;, and the newly launched &lt;strong&gt;Arts &amp;amp; Letters ELA&lt;/strong&gt;—are trusted by thousands of schools and districts nationwide.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Eureka Math&lt;/strong&gt; is the most widely used math curriculum in the U.S., and is focused on balancing conceptual understanding, procedural fluency, and application.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Wit &amp;amp; Wisdom®&lt;/strong&gt; and &lt;strong&gt;Arts &amp;amp; Letters ELA™&lt;/strong&gt; anchor our reading strategy with content-rich, grade-level instruction that integrates literature, history, and the arts, grounded in the science of reading. &lt;strong&gt;Geodes®&lt;/strong&gt; complements our reading suite with decodable texts that pair phonics with meaningful content to support early literacy.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;PhD Science &lt;/strong&gt;is a hands-on K-5 Science program that sparks curiosity as students build enduring knowledge of how the scientific world works.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p class=\"MsoBodyTextCxSpMiddle\"&gt;These programs reflect a shared belief in high expectations, joyful rigor, and deep respect for educators and students.&lt;/p&gt;&lt;p class=\"MsoBodyTextCxSpMiddle\"&gt;&amp;nbsp;&lt;/p&gt;&lt;p class=\"MsoBodyTextCxSpMiddle\"&gt;&lt;strong&gt;Where We’re Headed&lt;/strong&gt;&lt;/p&gt;&lt;p class=\"MsoBodyTextCxSpMiddle\"&gt;Great Minds is entering a new stage of growth and product maturity. We are focused on building more connected, customer-informed experiences across the full educator journey—from curriculum to professional learning to platform and support.&lt;/p&gt;&lt;p class=\"MsoBodyTextCxSpMiddle\"&gt;&amp;nbsp;&lt;/p&gt;&lt;p class=\"MsoBodyTextCxSpLast\"&gt;Our long-term vision is to become a true partner in impact—not just delivering curriculum, but supporting educators in achieving outcomes at scale.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;br&gt;Job Purpose&lt;/strong&gt;&lt;/p&gt;&lt;p class=\"MsoNormal\"&gt;Reporting to the Director, Digital Product Management, the Principal Product Manager (Content Authoring, Delivery &amp;amp; CMS)&lt;strong&gt; &lt;/strong&gt;will lead discovery and execution for our content authoring tools, end user delivery experiences, and content management system (CMS). This role will be critical to how curriculum and assessment content is created, managed, and experienced by teachers, students, administrators, and internal teams. This is a top-level individual contributor role with broad ownership and influence. The position will work with product design, engineering, curriculum, and assessment teams to ensure Great Minds’ authoring and delivery platforms are coherent, scalable, and deeply supportive of high-quality K–12 instructional and assessment experiences. The role will partner closely with Product Design, Engineering, and other teams in and outside the Digital department.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;br&gt;Responsibilities&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Content Authoring Platforms:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Define and evolve the product vision for tools used to author curriculum and assessment content.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Balance usability for authors with structural rigor required for downstream delivery, analytics, and interoperability.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Partner with curriculum and assessment teams to translate instructional intent into scalable software capabilities.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;End User Content Delivery:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;In partnership with the Chief Technology Officer, directors, and other leaders, form product strategy for how authored content is delivered to teachers, students, and administrators.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Ensure delivery experiences are performant, accessible, intuitive, and instructionally sound.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Work closely with Digital Product Design to validate real classroom and instructional workflows.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;CMS and Content Architecture:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Initiate and sometimes facilitate product direction conversations for the CMS, including content models, workflows, permissions, versioning, and publishing—working with but deferring to expert partners in Product Design and Engineering.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Ensure the CMS supports multiple products, grade levels, subjects, delivery contexts, and modalities.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Partner with Engineering on long-term platform scalability and maintainability.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Responsibilities:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Set clear product strategy and success metrics for authoring, delivery, and CMS capabilities.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Translate complex instructional and operational needs into well-scoped product initiatives.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Write clear roadmap proposals and product requirements when they are defined.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Collaborate deeply with Product Design to ground decisions in user needs and evidence.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Partner with Engineering to make sound trade-offs across speed, quality, and technical health.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Influence roadmap priorities in partnership with Product Management and leadership.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Act as a subject matter expert on content platforms for Great Minds commercial products.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Identify and reduce friction across the content lifecycle—from creation to classroom use.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;h2 class=\"sc-1npqnwg-4 sc-1npqnwg-5 sc-1uwf3m5-0 sc-1uwf3m5-1 hfBgvY custom-css-style-job-requirements\"&gt;Job requirements&lt;/h2&gt;&lt;div class=\"sc-1fwbcuw-0 bgbhkg\"&gt;&lt;div&gt;&lt;ul&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;7+ years of product management experience, with senior level ownership of complex platforms or systems&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Experience building products that serve multiple user types (authors, teachers, students, admins, internal teams) and not exclusively authors&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Deep understanding of content authoring tools, CMS platforms, and structured content systems&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Strong systems thinking—able to reason about data models, workflows, and downstream impacts&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Proven ability to influence without authority and lead through collaboration&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Comfort working hands on with detailed requirements while maintaining strategic perspective&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Preferred Qualifications&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Direct experience with K–12 curriculum and assessment products&lt;strong&gt;&lt;br&gt;&lt;/strong&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;Required Education&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p class=\"paragraph\"&gt;Bachelor’s degree&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;&lt;br&gt;Status&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Full-time&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Location&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Remote&lt;strong&gt;&lt;br&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;The expected base salary range for this position is $151,000-$170,000, however the offered salary&lt;strong&gt; &lt;/strong&gt;may be higher or lower than the above range dependent on numerous factors including, but not limited to location, work experience, skills and internal equity considerations. The base salary is not inclusive of benefits or other incentives.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;A cover letter and resume are required to be considered for this position.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;New employees will be required to successfully complete a background check.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;Any communication to applicants relating to the Great Minds hiring process will only come from email addresses with the domains &lt;strong&gt;&lt;a href=\"http://greatminds.org/\"&gt;greatminds.org&lt;/a&gt;&lt;/strong&gt; or &lt;strong&gt;&lt;a href=\"http://greatminds.recruitee.com/\"&gt;greatminds.recruitee.com&lt;/a&gt;&lt;/strong&gt;. If in the course of the application or hiring process with Great Minds you are contacted through another domain, are requested to provide banking or other sensitive information, or you note any other suspicious activity, please contact &lt;a href=\"mailto:security@greatminds.org\"&gt;security@greatminds.org&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;Great Minds is an equal opportunity employer. We will extend equal opportunity to all individuals without regard to race, religion, color, sex (including pregnancy, sexual orientation, and gender identity), national origin, disability, age, genetic information, or any other status protected under applicable federal, state, or local laws. Our policy reflects and affirms the organization’s commitment to the principles of fair employment and the elimination of all discriminatory practices.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;#LI-Remote&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"sc-1uwf3m5-3 cTUFI\"&gt;&lt;div class=\"sc-e5uvhz-0 kHqIkC\"&gt;&lt;div class=\"sc-e5uvhz-8 ekemGm\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div class=\"sc-1f8x0pm-0 ibrjJt\"&gt;&lt;div&gt;&lt;h3 class=\"sc-1npqnwg-4 sc-1npqnwg-5 sc-1f8x0pm-1 hmVXnl\"&gt;All done!&lt;/h3&gt;&lt;p class=\"sc-1npqnwg-9 sc-1npqnwg-10 iPueVD\"&gt;Your application has been successfully submitted!&lt;/p&gt;&lt;/div&gt;&lt;div class=\"sc-1f8x0pm-2 dvyFlr\"&gt;&lt;a class=\"sc-s03za1-0 xZUGZ custom-css-style-application-success-button\" href=\"/\"&gt;Other jobs&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=\"sc-fggwcr-0 bKsRHH\"&gt;&lt;div&gt;&lt;h3 class=\"sc-1npqnwg-4 sc-1npqnwg-5 sc-fggwcr-1 ejnaKv\"&gt;You've already applied for this job&lt;/h3&gt;&lt;p class=\"sc-1npqnwg-9 sc-1npqnwg-10 iPueVD\"&gt;We appreciate your interest in this position. Unfortunately, you have already applied for this job.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/great-minds-principal-product-manager-content-authoring-delivery-cms\"&gt;https://weworkremotely.com/remote-jobs/great-minds-principal-product-manager-content-authoring-delivery-cms&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 20:36:46 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 20:36:46 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/great-minds-principal-product-manager-content-authoring-delivery-cms</guid> <link>https://weworkremotely.com/remote-jobs/great-minds-principal-product-manager-content-authoring-delivery-cms</link> </item> <item> <title>Lifecheq: Associate Product Manager (Remote)</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Management and Finance</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Western Cape, Cape Town, 8000 South Africa &lt;/p&gt; &lt;div class=\"job-details-content content\"&gt;&lt;br&gt;&lt;div&gt;&lt;h2&gt;&lt;span&gt;About Lifecheq&lt;/span&gt;&lt;/h2&gt;&lt;p&gt;&lt;span&gt;Lifecheq is transforming financial advice and insurance distribution across emerging markets through our cutting-edge technology platform. As Africa's largest advice platform, we empower over&amp;nbsp;&lt;/span&gt;&lt;span&gt;8,000 financial advisers&lt;/span&gt;&lt;span&gt;&amp;nbsp;to deliver holistic, personalised financial planning to the underserved mass affluent market.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;Our holistic financial advice platform has achieved remarkable results in driving record adviser productivity for our partners. Backed by leading investors, we're expanding across Africa and Southeast Asia – with a mission to create one million sustainable middle-income jobs for financial advisers.&lt;/span&gt;&lt;/p&gt;&lt;h2&gt;&lt;span&gt;The Opportunity&lt;/span&gt;&lt;/h2&gt;&lt;div&gt;&lt;span&gt;Own the execution of initiatives that drive adviser productivity - moving more advisers from the mid band into the productive band, and keeping productive advisers there.&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;&lt;span&gt;What You'll Do&lt;/span&gt;&lt;/h2&gt;&lt;p&gt;&lt;span&gt;Work with your Group Product Manager to translate product strategy and experiment priorities into well-scoped tickets, timelines, and delivered features.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;Develop and maintain a deep understanding of the adviser productivity funnel - know how many advisers are in each band, what is moving them up, and where they are getting stuck.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;Develop and maintain a view of your key metrics and build instrumentation into the products you manage so you have an ongoing view of performance; know when a number looks wrong before it is flagged to you.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;Gather ongoing feedback from advisers and managers directly; build the observational habits to understand where the pipeline is failing and bring findings to the Group PM with a point of view, not just a summary.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;Own the alert and nudge pipeline end to end - template creation, regulatory approval submissions, staging tests, production deployment, and delivery quality - ensuring advisers receive the right recommendations reliably.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;Manage rollout logistics for new features: determine sequencing, verify adviser access across branches and regions, and troubleshoot activation issues.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;Set up experiment infrastructure as directed by the Group PM - cohort assignment, data feeds, template creation, tracking configuration - and take responsibility for data quality and delivery reliability throughout the experiment window.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;Compile clean experiment data packages for the Group PM to analyse and interpret; manage the operational handoff when successful experiments move to production.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;Work with lead engineers to coordinate delivery sequencing, dependencies, and deployment schedules; maintain a well-groomed backlog with clear acceptance criteria and flag risks early with a proposed solution attached.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;Take responsibility for the business outcomes of the initiatives you run: if adviser productivity is not moving, understand why and bring a plan to address it.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;Ensure automated reports are accurate and distributed reliably; maintain product analytics dashboards and coordinate data logistics with external partners.&lt;/span&gt;&lt;/p&gt;&lt;h2&gt;&lt;span&gt;What We're Looking For&lt;/span&gt;&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;&lt;span&gt;You have a four-year degree or equivalent&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;You are an analytical, data-driven, critical thinker who can unpack a problem clearly, develop and communicate a hypotheses, frame experiments and test them rigorously&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;You have had some exposure to a commercial or customer facing role; you are very open to interacting with customers and financial advisers regularly, and are&amp;nbsp;&lt;/span&gt;&lt;span&gt;passionate about using technology to solve problems&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;You can communicate well with team members and stakeholders on deliverables and approach, demonstrating the ability to communicate and listen appropriately depending on the audience. We expect a good grounding in effective written communication in a technical context&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;You strive for success, are keen to learn and develop, are collaborative with a can-do attitude, and can build positive relationships&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;You have business acumen and have a grasp of the key concepts of how a business makes money, and you enjoy seeing your work make a tangible business impact&amp;nbsp;&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;You are experienced with and are comfortable engaging with senior executives at large and small companies - you’d be quite okay being asked to give a presentation to execs at a listed company in your first three months of work.&amp;nbsp;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;h2&gt;&lt;span&gt;What We Offer&lt;/span&gt;&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;&lt;span&gt;A market-competitive salary&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;&lt;span&gt;A collaborative, mission-driven environment with exposure to cutting-edge fintech initiatives&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;&lt;span&gt;Opportunities to work on impactful projects with leading partners and stakeholders&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;&lt;span&gt;Career growth within a rapidly scaling organisation&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;&lt;span&gt;The chance to help shape the future of financial services delivery&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;&lt;span&gt;We’re a remote-first business, with a setup that optimises for async work&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;/div&gt;&lt;br&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;br&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/lifecheq-associate-product-manager-remote\"&gt;https://weworkremotely.com/remote-jobs/lifecheq-associate-product-manager-remote&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 20:36:11 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 20:36:11 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/lifecheq-associate-product-manager-remote</guid> <link>https://weworkremotely.com/remote-jobs/lifecheq-associate-product-manager-remote</link> </item> <item> <title>Nucs Ai: Senior Product Manager</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Product</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Berlin, BE, Germany &lt;/p&gt; &lt;div class=\"sc-1gch2qa-0 fhKCjg\"&gt;&lt;div&gt;&lt;div class=\"sc-gfrfnr-2 deOrHQ\"&gt;&lt;/div&gt;&lt;div class=\"sc-18h7are-0 ebVyJP\"&gt;&lt;div class=\"sc-1tu9fip-2 ezRMeN\"&gt;&lt;div class=\"sc-1tu9fip-1 kdUgoN\"&gt;&lt;div class=\"sc-1tu9fip-3 iFQjUO\"&gt;&lt;div class=\"sc-ji5wy4-0 jIYAZB\"&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div class=\"sc-1uwf3m5-2 ipgOZn\"&gt;&lt;div class=\"sc-1v95195-0 jscoSJ\"&gt;&lt;div&gt;&lt;div&gt;&lt;h2 class=\"sc-1npqnwg-4 sc-1npqnwg-5 sc-1uwf3m5-0 dPUmhl custom-css-style-job-description\"&gt;Job description&lt;/h2&gt;&lt;div class=\"sc-1fwbcuw-0 cbghYp\"&gt;&lt;div&gt;&lt;h3&gt;&lt;strong&gt;&lt;span&gt;About Nucs AI&lt;/span&gt;&lt;/strong&gt;&lt;/h3&gt;&lt;p&gt;&lt;span&gt;Nucs AI is revolutionizing cancer care through cutting-edge AI and medical imaging technology. Founded in 2024 by a multidisciplinary team of oncologists, AI researchers, and healthcare innovators, we’re tackling one of medicine’s most pressing challenges: the growing demand for accurate, timely cancer diagnostics in the face of rising scan volumes and limited radiologist capacity.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;We sit at the intersection of diagnostics and treatment planning—building AI-powered tools at the convergence of medical imaging, radioligand therapy, and artificial intelligence. Starting with prostate cancer and expanding across oncology, we partner with world-leading medical institutions and pharmaceutical companies across the US, Europe, and Australia to bring precision oncology into everyday clinical practice.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;Our mission is to enhance diagnostic precision and expand access to expert-level cancer care, improving patient outcomes worldwide. We’re venture-backed, early-stage, and building a team that blends deep clinical expertise with engineering intensity—moving with the rigor the medical field demands and the speed the problem deserves.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;&lt;span&gt;The Opportunity&lt;/span&gt;&lt;/strong&gt;&lt;/h3&gt;&lt;p&gt;&lt;span&gt;Nucs AI is looking for a Senior Product Manager who thrives at the intersection of complex technology and specialized end-users. You will own critical parts of our product roadmap, translating deep clinical and technical requirements into clear product direction, then driving execution across data, engineering, regulatory, and commercial areas. This is not a role where you manage a feature backlog in isolation; you will be expected to build conviction around what we should build, why, and in what order, and to defend that thinking rigorously.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;&lt;span&gt;What You’ll Do&lt;/span&gt;&lt;/strong&gt;&lt;/h3&gt;&lt;h4&gt;&lt;strong&gt;&lt;span&gt;Product Development Support&lt;/span&gt;&lt;/strong&gt;&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Own the roadmap for one or more product lines (e.g., DeepPSMA, SelectPSMA, TrackPSMA), balancing clinical impact, technical feasibility, and business value.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Engage directly with clinicians, nuclear medicine physicians, and oncologists to deeply understand their workflows, pain points, and decision-making processes.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Translate ambiguous, technically complex problems into well-structured product requirements and clear success criteria.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Develop and articulate a clear product narrative: why this feature matters, who it serves, and how it connects to the broader platform vision.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Navigate the regulatory landscape (FDA, CE marking) as a stakeholder, you do not need to be a regulatory expert, but you must understand how regulatory requirements shape product decisions and timelines.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;h4&gt;&lt;strong&gt;&lt;span&gt;Cross-Functional Coordination&lt;/span&gt;&lt;/strong&gt;&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Drive cross-functional execution with engineering, AI/ML, clinical, regulatory, and commercial stakeholders, keeping a small team moving fast without sacrificing quality.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Contribute to go-to-market strategy, positioning, and customer enablement alongside commercial and clinical teams.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;h4&gt;&lt;strong&gt;&lt;span&gt;Analytics &amp;amp; Insights&lt;/span&gt;&lt;/strong&gt;&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Define and track meaningful product metrics; use data and user feedback to inform iteration and prioritization decisions.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;h2 class=\"sc-1npqnwg-4 sc-1npqnwg-5 sc-1uwf3m5-0 sc-1uwf3m5-1 hvrPDI custom-css-style-job-requirements\"&gt;Job requirements&lt;/h2&gt;&lt;div class=\"sc-1fwbcuw-0 cbghYp\"&gt;&lt;div&gt;&lt;h3&gt;&lt;strong&gt;&lt;span&gt;What You Bring&lt;/span&gt;&lt;/strong&gt;&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;3-6 years of product management experience in a B2B or technical environment building products for specialized, professional users (not purely consumer products).&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Demonstrated ability to manage complex products where the user base has deep domain expertise, e.g., enterprise software, developer tools, scientific instruments, industrial platforms, or similar.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Strong conceptual and systems thinking. You can see the big picture, connect disparate inputs into a coherent product thesis, and reason about second-order effects. You don't just execute, you think.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Startup or high-growth experience. You have worked in an environment where speed, ambiguity, and wearing multiple hats were the norm, not the exception.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Excellent communication skills. You can write clearly, present a compelling argument, and facilitate productive discussions with both technical and non-technical stakeholders.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Comfort with technical depth. You do not need to write code, but you should be able to engage meaningfully with engineers and data scientists on architecture, data, and tradeoff discussions.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Intellectual curiosity and learning agility. You pick up new domains quickly and enjoy becoming a quasi-expert in areas you previously knew nothing about.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;&lt;span&gt;Bonus Points&lt;/span&gt;&lt;/strong&gt;&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Experience in healthcare, medtech, health-AI, or a regulated industry.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Familiarity with medical imaging, oncology workflows, or clinical decision support.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Experience working with AI/ML-driven products where model behavior shapes the user experience.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Exposure to FDA 510(k), De Novo, or CE marking processes for software as a medical device (SaMD).&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;&lt;span&gt;Why Nucs AI&lt;/span&gt;&lt;/strong&gt;&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;Mission with real impact &lt;/span&gt;&lt;/strong&gt;&lt;span&gt;&amp;nbsp;– Your work directly improves how cancer patients are diagnosed and treated.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;Ground-floor opportunity &lt;/span&gt;&lt;/strong&gt;&lt;span&gt;&amp;nbsp;– Early-stage company, meaningful equity, and outsized influence on the direction we take.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;World-class collaborators &lt;/span&gt;&lt;/strong&gt;&lt;span&gt;&amp;nbsp;– Work alongside leading oncologists, nuclear medicine physicians, and AI researchers globally.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;Massive market tailwinds &lt;/span&gt;&lt;/strong&gt;&lt;span&gt;&amp;nbsp;– Radioligand therapy and AI-driven oncology are multi-billion dollar growth markets.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;Autonomy and flexibility &lt;/span&gt;&lt;/strong&gt;&lt;span&gt;&amp;nbsp;– Remote-first, flexible working. We hire great people and trust them to deliver.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;Equity upside &lt;/span&gt;&lt;/strong&gt;&lt;span&gt;&amp;nbsp;– Competitive equity package. We’re building something big and want you to share in it.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;&lt;span&gt;How to Apply&lt;/span&gt;&lt;/strong&gt;&lt;/h3&gt;&lt;p&gt;&lt;span&gt;Submit your resume and a brief note on why this role and Nucs AI excite you.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;&lt;span&gt;Equal Opportunity&lt;/span&gt;&lt;/strong&gt;&lt;/h3&gt;&lt;p&gt;&lt;span&gt;Nucs AI is an equal opportunity employer. We celebrate diversity and are committed to creating an inclusive environment for all team members. All qualified applicants will receive consideration without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, disability, or veteran status.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"sc-1uwf3m5-4 fKDjfR\"&gt;&lt;div class=\"sc-e5uvhz-0 kHqIkC\"&gt;&lt;div class=\"sc-e5uvhz-8 ekemGm\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div class=\"sc-1f8x0pm-0 ibrjJt\"&gt;&lt;div&gt;&lt;h3 class=\"sc-1npqnwg-4 sc-1npqnwg-5 sc-1f8x0pm-1 hmpjWn\"&gt;All done!&lt;/h3&gt;&lt;p class=\"sc-1npqnwg-9 sc-1npqnwg-10 hZZYhK\"&gt;Your application has been successfully submitted!&lt;/p&gt;&lt;/div&gt;&lt;div class=\"sc-1f8x0pm-2 dvyFlr\"&gt;&lt;a class=\"sc-s03za1-0 imHepH custom-css-style-application-success-button\" href=\"/\"&gt;Other jobs&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/nucs-ai-senior-product-manager\"&gt;https://weworkremotely.com/remote-jobs/nucs-ai-senior-product-manager&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 20:35:26 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 20:35:26 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/nucs-ai-senior-product-manager</guid> <link>https://weworkremotely.com/remote-jobs/nucs-ai-senior-product-manager</link> </item> <item> <title>Leland: Product Management Coach (Contract)</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Product</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote - Utah &lt;/p&gt; &lt;p&gt;Leland’s mission is to unlock human potential by making the world’s expertise more accessible. We do that through a platform that connects people with coaching, content, and courses that can can help them achieve their most ambitious career and educational goals. Since our founding in 2021, we’ve helped tens of thousands of people reach their most ambitious goals, raised $19M from world-class investors, and built the industry leader in educational and career coaching.&lt;/p&gt;&lt;p&gt;We’re seeking experienced Product Managers from top technology companies to coach students and early-career professionals looking to break into product management at high-growth startups, Big Tech, and Fortune 500 companies. Coaches help mentees prepare for PM recruiting through resume reviews, behavioral and product case interview preparation, and practical guidance on navigating product careers. Ideal candidates have PM experience working with students formally or informally. Coaches set their own hours and rates, host sessions virtually, and partner with our team to deliver a high-quality coaching experience.&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;Why Leland?&lt;/strong&gt;&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Join a high-growth consumer startup focused on helping people achieve their goals by connecting them with expert coaches&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Opportunity to take part in building a world-class team&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;A collaborative, high-energy environment where your contributions have a direct impact&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The chance to join a passionate team helping people achieve their career and educational dreams&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br&gt;&lt;em&gt;Leland is an equal opportunity employer. We encourage candidates of all backgrounds and demographics to apply.&lt;/em&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/leland-product-management-coach-contract\"&gt;https://weworkremotely.com/remote-jobs/leland-product-management-coach-contract&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 20:35:26 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 20:35:26 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/leland-product-management-coach-contract</guid> <link>https://weworkremotely.com/remote-jobs/leland-product-management-coach-contract</link> </item> <item> <title>Ischool: Graphic Design instructor - Project Based</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Design</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Egypt &lt;/p&gt; &lt;p&gt;iSchool is an innovative and rapidly growing e-learning company that provides online coding and artificial intelligence education to students aged 6 to 18 years old. As a leading platform in the industry, we are committed to equipping the next generation with the skills they need to thrive in the digital era. We are currently seeking a dynamic and passionate individual to join our team as a Coding Instructor for a project-based position lasting 3 months.&lt;/p&gt;&lt;h3&gt;Overview&lt;/h3&gt;&lt;p&gt;We are seeking a Digital Arts Track Instructor responsible for delivering engaging, hands-on sessions that introduce students to the fundamentals of digital design, animation, video editing, and 3D content creation. The instructor will guide students through practical creative workflows using industry-relevant tools such as Photopea, Figma, Canva, Inkscape, CapCut, Blender, and Unity. &lt;br&gt; &lt;br&gt; The role focuses on helping students understand core visual design principles, animation fundamentals, and digital media production while encouraging creativity, problem-solving, and project-based learning.&lt;/p&gt;&lt;h3&gt;Key Responsibilities&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Deliver structured sessions covering digital design, animation, video editing, and 3D modeling fundamentals.&lt;/li&gt;&lt;li&gt;Teach students how to use digital creative tools including Photopea, Figma, Canva, Inkscape, CapCut, Blender, and Unity.&lt;/li&gt;&lt;li&gt;Guide students through hands-on projects such as designing logos, creating vector illustrations, producing short videos, and building simple 3D models.&lt;/li&gt;&lt;li&gt;Introduce design principles including shape composition, layout, and visual storytelling.&lt;/li&gt;&lt;li&gt;Teach students how to break complex drawings into simple geometric shapes and design creative visual assets.&lt;/li&gt;&lt;li&gt;Explain core 2D animation concepts including animation basics, character joints, and shape-based animation techniques.&lt;/li&gt;&lt;li&gt;Demonstrate how animation is used in games, cartoons, and digital media.&lt;/li&gt;&lt;li&gt;Teach the fundamentals of video editing including trimming clips, arranging timelines, adding text overlays, and adjusting basic audio.&lt;/li&gt;&lt;li&gt;Introduce students to 3D modeling concepts using Blender, including navigating the interface and creating simple low‑poly models.&lt;/li&gt;&lt;li&gt;Explain the differences between Eevee and Cycles render engines and guide students in exporting visual outputs.&lt;/li&gt;&lt;li&gt;Guide students in importing assets into Unity and organizing them for basic game development workflows.&lt;/li&gt;&lt;li&gt;Mentor students during exercises and projects while encouraging creativity and experimentation.&lt;/li&gt;&lt;/ul&gt; &lt;ul&gt;&lt;ul&gt;&lt;li&gt;Strong understanding of &lt;strong&gt;digital design fundamentals&lt;/strong&gt;, including composition, layout, and visual storytelling. &lt;/li&gt;&lt;li&gt; Practical experience with &lt;strong&gt;digital creative tools&lt;/strong&gt;, such as &lt;strong&gt;Photopea, Figma, Canva, Inkscape, CapCut, Blender, and Unity&lt;/strong&gt;. &lt;/li&gt;&lt;li&gt; Knowledge of &lt;strong&gt;vector illustration and digital design workflows&lt;/strong&gt;. &lt;/li&gt;&lt;li&gt; Understanding of &lt;strong&gt;2D animation fundamentals&lt;/strong&gt;, including shape-based animation and character joints. &lt;/li&gt;&lt;li&gt; Basic knowledge of &lt;strong&gt;video editing&lt;/strong&gt;, including timeline management, trimming clips, adding text overlays, and basic audio adjustments. &lt;/li&gt;&lt;li&gt; Familiarity with &lt;strong&gt;3D modeling concepts in Blender&lt;/strong&gt;, including creating simple low-poly models. &lt;/li&gt;&lt;li&gt; Basic understanding of &lt;strong&gt;render engines (Eevee and Cycles)&lt;/strong&gt; and exporting visual outputs. &lt;/li&gt;&lt;li&gt; Basic knowledge of &lt;strong&gt;game development workflows&lt;/strong&gt;, including importing and organizing assets in Unity. &lt;/li&gt;&lt;li&gt; Ability to &lt;strong&gt;explain complex creative concepts in a simple and engaging way&lt;/strong&gt;. &lt;/li&gt;&lt;li&gt; Experience in &lt;strong&gt;guiding students through practical, project-based learning activities&lt;/strong&gt;. &lt;/li&gt;&lt;li&gt; Strong &lt;strong&gt;communication, mentoring, and classroom engagement skills&lt;/strong&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;/ul&gt; &lt;ul&gt;&lt;li&gt;Compatible Salary.&lt;/li&gt;&lt;li&gt;Flexible Hours.&lt;/li&gt;&lt;li&gt;Certificate of Experience&lt;/li&gt;&lt;li&gt;Team Collaboration &amp;amp; Mentorship&lt;/li&gt;&lt;/ul&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/ischool-graphic-design-instructor-project-based\"&gt;https://weworkremotely.com/remote-jobs/ischool-graphic-design-instructor-project-based&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 20:35:08 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 20:35:08 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/ischool-graphic-design-instructor-project-based</guid> <link>https://weworkremotely.com/remote-jobs/ischool-graphic-design-instructor-project-based</link> </item> <item> <title>Rho: Staff Product Designer</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Management and Finance</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Poland - Remote &lt;/p&gt; &lt;p&gt;&lt;strong&gt;About Us&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Rho is the modern banking platform built for startups. Open accounts in minutes, issue cards, manage expenses, pay bills, and close the books – all in one connected platform backed by real human support.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;About the Role &lt;/strong&gt;&lt;/p&gt;&lt;p&gt;As a Staff Product Designer at Rho, you will champion the craft of design to deliver experiences that are not only functional but thoughtfully refined. You’ll take end-to-end ownership of complex product areas, consistently holding a high bar for usability, visual polish, and quality of execution. With an instinct for user behavior and a relentless attention to detail, you'll bring clarity to ambiguous problems and advocate for the end user in every decision. Working closely with product and engineering partners, you'll lead the creation of intuitive solutions that feel seamless, scalable, and rooted in empathy—ensuring every design moment reflects Rho's commitment to frictionless finance.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Responsibilities &lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Lead design efforts for end-to-end product features across multiple surfaces &lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Own complex design problems with minimal oversight—from exploration to polished execution.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Collaborate deeply with product managers and engineers to shape scope, identify dependencies, and optimize user flows.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Define interaction patterns and craft scalable, accessible solutions informed by data and user research.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Develop prototypes to test concepts, gather feedback, and drive alignment.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Uphold and evolve design quality by considering both micro-interactions and holistic experience.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Communicate ideas clearly across design critiques, cross-functional meetings, and stakeholder reviews.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Contribute to design system enhancements and advocate for design quality across teams.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Qualifications &lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;6+ years of experience designing digital products, with a portfolio demonstrating end-to-end ownership. Fintech experience preferred but is not necessary &lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Skilled in prototyping, UI/UX, interaction design, and visual polish.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Proven ability to work autonomously, plan work, and push projects forward independently.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Comfortable designing for ambiguity, resolving complex workflows, and simplifying edge cases.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Strong collaboration and communication skills; experience presenting to executives and external partners.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Familiar with applying qualitative and quantitative research methods to inform decisions.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Experience working with or contributing to a design system.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Adaptable, pragmatic, and empathetic—able to thrive in fast-changing, collaborative environments.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;We are hiring exclusively on a B2B contract.&lt;/p&gt;&lt;p&gt;Diversity is a core value at Rho. We’re passionate about building and sustaining an inclusive and equitable environment for all those involved with our mission, including employees, contractors, candidates, customers, and vendors. We believe every member of the Rho community enriches our ability to provide a broad range of ways to understand and engage with the market, identify problems, and drive solutions that align with our mission. We welcome all qualified applications and support each of our Rho’ers with ongoing professional growth opportunities.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/rho-staff-product-designer\"&gt;https://weworkremotely.com/remote-jobs/rho-staff-product-designer&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 20:34:52 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 20:34:52 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/rho-staff-product-designer</guid> <link>https://weworkremotely.com/remote-jobs/rho-staff-product-designer</link> </item> <item> <title>Mixpanel: Revenue Strategy &amp; Operations Manager</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Management and Finance</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; San Francisco, US (Remote) &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;p&gt;&lt;strong&gt;About Mixpanel&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Mixpanel is the leading product intelligence and analytics platform, trusted by more than 29,000 companies to help understand how people use the products they build. By combining powerful analytics with AI that knows your business, Mixpanel helps teams see what’s working, diagnose what’s not, and decide what to build next. Learn more at &lt;a href=\"mixpanel.com\"&gt;mixpanel.com&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;About the Team&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;The Revenue Operations team at Mixpanel partners with the Regional Business Leaders to help set and execute global and regional revenue strategies. We build and execute core operational processes such as business planning and reporting, facilitate key decision making, work with leadership on crafting strategies and support ongoing business operations management - whatever is needed to make our Sales teams successful!&lt;/p&gt; &lt;p&gt;&lt;strong&gt;About the Role&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;As &lt;strong&gt;Revenue Strategy &amp;amp; Operations Manager&lt;/strong&gt;, you will own core business operations for the region, your job will include in-depth quantitative analysis of operating metrics with a particular focus on problem-solving and creating scaled systems and processes. You will work closely with the VP of North America and cross-functional teams to quickly understand opportunities and implement solutions.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Responsibilities&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Primary advisor to North America VP on end-to-end Go-To-Market operations&lt;/li&gt; &lt;li&gt;Perform strategic product, market, and customer analyses to identify new growth drivers or opportunities for improvement&lt;/li&gt; &lt;li&gt;Support annual planning cycles including goaling, coverage model revisions, territory design, and cascading our financial plan&lt;/li&gt; &lt;li&gt;Drive continuous improvement through standard operating cadences including weekly forecast and metric reviews in addition to monthly and quarterly go-to-market business reviews&lt;/li&gt; &lt;li&gt;Define, manage, and provide insights on key performance indicators across a range of segments, geographies, and go-to-market teams&lt;/li&gt; &lt;li&gt;Collaborate with sales, finance, revenue operations, marketing, and other cross-functional stakeholders to design and execute strategic projects to drive growth, increase sales productivity, operational efficiency, and revenue&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;We're Looking for Someone Who Has&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;3+ years of total work experience in an analytical role (Sales Operations, Business Operations, Management Consulting)&lt;/li&gt; &lt;li&gt;Expert proficiency in financial modeling and analyzing complex and large data sets&lt;/li&gt; &lt;li&gt;Outstanding written and oral communication skills&lt;/li&gt; &lt;li&gt;Track-record of collaborating with cross-functional partners to lead transformation and growth&lt;/li&gt; &lt;li&gt;Highly motivated, innate intellectual curiosity, and a strong desire to drive impact&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Bonus Points For&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;2+ years of experience at a top tier Management or Strategy Consulting firm&lt;/li&gt; &lt;li&gt;2+ years of operating experience in Corporate Strategy, Business Operations, or Sales Strategy in a high-growth, fast paced environment, preferably at a SaaS or B2B organization&lt;/li&gt; &lt;li&gt;Fluency with core Go-To-Market operating and metrics including CAC, LTV, ROI, Conversion Ratios, and other Efficiency metrics&lt;/li&gt; &lt;li&gt;Working knowledge of SFDC including Reporting and Record Management from lead creation through opportunity closure&lt;/li&gt; &lt;li&gt;Direct or indirect management experience with global sales leaders in worldwide regions&lt;/li&gt; &lt;li&gt;Demonstrable passion for the data analytics industry&lt;/li&gt; &lt;li&gt;Comfortable working with ambiguity&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;#LI-Hybrid&lt;/p&gt;&lt;div class=\"content-pay-transparency\"&gt;&lt;div class=\"pay-input\"&gt;&lt;div class=\"description\"&gt;&lt;p&gt;&lt;strong&gt;Compensation&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;The amount listed below is the total target cash compensation (TTCC) and includes base compensation and variable compensation in the form of either a company bonus or commissions. Variable compensation type is determined by your role and level. In addition to the cash compensation provided, this position is also eligible for equity consideration and other benefits including medical, vision, and dental insurance coverage. You can view our benefits offerings &lt;a href=\"https://mxpnl.notion.site/Check-out-our-benefits-869112a6cabe4c81a2b9da99de28f636\"&gt;here&lt;/a&gt;.&lt;br&gt;&lt;br&gt;Our salary ranges are determined by role and level and are benchmarked to the SF Bay Area Technology data cut released by Radford, a global compensation database. The range displayed represents the minimum and maximum TTCC for new hire salaries for the position across all of our US locations. To stay on top of market conditions, we refresh our salary ranges twice a year so these ranges may change in the future. Within the range, individual pay is determined by experience, job-related skills, qualifications, and other factors. If you have questions about the specific range, your recruiter can share this information.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=\"title\"&gt;Mixpanel Compensation Range&lt;/div&gt;&lt;div class=\"pay-range\"&gt;&lt;span&gt;$148,000&lt;/span&gt;&lt;span class=\"divider\"&gt;—&lt;/span&gt;&lt;span&gt;$200,000 USD&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&lt;strong&gt;Benefits and Perks&lt;/strong&gt;&lt;strong&gt;&lt;br&gt;&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Comprehensive Medical, Vision, and Dental Care&lt;/li&gt; &lt;li&gt;Mental Wellness Benefit&lt;/li&gt; &lt;li&gt;Generous Vacation Policy &amp;amp; Additional Company Holidays&lt;/li&gt; &lt;li&gt;Enhanced Parental Leave&lt;/li&gt; &lt;li&gt;Volunteer Time Off&lt;/li&gt; &lt;li&gt;Additional US Benefits: Pre-Tax Benefits including 401(K), Wellness Benefit, Holiday Break&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;em&gt;*please note that benefits and perks for contract positions will vary*&lt;/em&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Culture Values&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Make Bold Bets:&lt;/strong&gt; We choose courageous action over comfortable progress.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Innovate with Insight:&lt;/strong&gt; We tackle decisions with rigor and judgment - combining data, experience and collective wisdom to drive&amp;nbsp;powerful outcomes.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;One Team:&lt;/strong&gt; We collaborate across boundaries to achieve far greater impact than any of us could accomplish alone.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Candor with Connection:&lt;/strong&gt; We build meaningful relationships that enable honest feedback and direct conversations.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Champion the Customer:&lt;/strong&gt; We seek to deeply understand our customers’ needs, ensuring their success is our north star.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Powerful Simplicity:&lt;/strong&gt; We find elegant solutions to complex problems, making sophisticated things accessible.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Why choose Mixpanel?&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;We’re a leader in analytics with over 9,000 customers and $277M invested from prominent investors: like Andreessen-Horowitz, Sequoia, YC, and, most recently, Bain Capital. Mixpanel’s pioneering event-based data analytics platform offers a powerful yet simple solution for companies to understand user behaviors and easily track overarching company success metrics. Our accomplished teams continuously facilitate our expansion by tackling the ever-evolving challenges tied to scaling, reliability, design, and service. Choosing to work at Mixpanel means you’ll be helping the world’s most innovative companies learn from their data so they can make better decisions.&lt;/p&gt; &lt;p&gt;&lt;span&gt;Mixpanel is an equal opportunity employer supporting workforce diversity. At Mixpanel, we are focused on things that really matter—our people, our customers, our partners—out of a recognition that those relationships are the most valuable assets we have. We actively encourage women, people with disabilities, veterans, underrepresented minorities, and LGBTQ+ people to apply. We do not discriminate on the basis of race, religion, color, national origin, gender, gender identity or expression, sexual orientation, age, marital status, veteran status, or disability status. Pursuant to the San Francisco Fair Chance Ordinance or other similar laws that may be applicable, we will consider for employment qualified applicants with arrest and conviction records. We’ve immersed ourselves in our Culture and Values as our guiding principles for the impact we want to have and the future we are building.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/mixpanel-revenue-strategy-operations-manager\"&gt;https://weworkremotely.com/remote-jobs/mixpanel-revenue-strategy-operations-manager&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 19 Aug 2026 07:30:40 +0000</pubDate> <expires_at>Fri, 18 Sep 2026 07:30:40 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/mixpanel-revenue-strategy-operations-manager</guid> <link>https://weworkremotely.com/remote-jobs/mixpanel-revenue-strategy-operations-manager</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0171/6213/logo.gif\" type=\"image/png\"/> <title>Integrated Hire: Account Manager – Client Services</title> <region>Anywhere in the World</region> <country></country> <state>Texas</state> <skills>Client Retention, Problem Resolution, Client Relationship Management, and Client Relations</skills> <category>Customer Support</category> <type>Full-Time</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0171/6213/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Houston, Texas &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://integratedhire.com\"&gt;https://integratedhire.com&lt;/a&gt; &lt;/p&gt; &lt;h2&gt;&lt;strong&gt;Position: Account Manager – Client Services&amp;nbsp;&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;&lt;strong&gt;**Important**: &lt;/strong&gt;This role requires at least five years of firsthand experience living and working in the United States, polished and natural spoken and written English, and a strong understanding of U.S. business culture and client expectations. Applicants who do not meet these requirements will not be considered.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Location: &lt;/strong&gt;Fully Remote / Work From Anywhere&amp;nbsp;&lt;br&gt;&lt;strong&gt;Schedule: &lt;/strong&gt;US Central Time, Monday–Friday (Full-Time)&lt;br&gt;&lt;strong&gt;Compensation: &lt;/strong&gt;$2,500–$3,500/month&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;&lt;br&gt;Overview&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;Integrated Hire (integratedhire.com) helps small and mid-sized U.S. businesses build high-performing remote teams by connecting them with experienced offshore professionals across administration, finance, customer service, marketing, operations, and more.&lt;/p&gt; &lt;p&gt;We’re looking for a Client Services and Client Success Manager who is highly organized, responsive, and excellent at keeping clients happy. This is not primarily a sales role. The focus is on onboarding, client communication, follow-up, problem solving, and making sure the client experience stays smooth from the moment a client signs through the hiring process and beyond.&lt;/p&gt; &lt;p&gt;A significant part of this role involves stepping in when things do not go according to plan. You may be handling an unhappy client, employee performance or attendance concerns, communication breakdowns, or other unexpected issues. You’ll take ownership, coordinate with the right people internally, and help drive each situation toward a resolution.&lt;/p&gt; &lt;p&gt;This role is best suited for someone who is calm under pressure, strong with follow-through, comfortable speaking with U.S.-based clients, and able to manage many moving pieces without letting anything fall through the cracks.&lt;/p&gt; &lt;p&gt;We’re open to experienced professionals based anywhere in the United States or abroad, provided they can consistently work U.S. business hours and communicate naturally and confidently with U.S. business owners.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;Key Responsibilities&lt;/strong&gt;&lt;/h2&gt; &lt;h4&gt;&lt;strong&gt;Client Issue Resolution &amp;amp; Problem Solving&lt;/strong&gt;&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;Take ownership of client issues and drive them through resolution&lt;/li&gt; &lt;li&gt;Manage situations involving employee performance, attendance, communication problems, client dissatisfaction, replacements, and other service issues&lt;/li&gt; &lt;li&gt;Communicate directly with clients to understand concerns, set expectations, and determine next steps&lt;/li&gt; &lt;li&gt;Coordinate with recruitment, leadership, and other team members to resolve problems quickly&lt;/li&gt; &lt;li&gt;Handle sensitive or difficult conversations professionally while maintaining strong client relationships&lt;/li&gt; &lt;/ul&gt; &lt;h4&gt;&lt;strong&gt;Client Onboarding &amp;amp; Handover&lt;/strong&gt;&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;Lead or join onboarding calls after a new client signs and manage a smooth handover from sales to delivery&lt;/li&gt; &lt;li&gt;Confirm and document client requirements, expectations, and timelines for the internal team&lt;/li&gt; &lt;li&gt;Set the tone for a professional, organized client experience from day one&lt;/li&gt; &lt;/ul&gt; &lt;h4&gt;&lt;strong&gt;Client Communication &amp;amp; Retention&lt;/strong&gt;&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;Serve as the main point of contact for clients through recruitment, placement, and beyond&lt;/li&gt; &lt;li&gt;Run regular check-ins and updates on search progress, interviews, and next steps&lt;/li&gt; &lt;li&gt;Answer client questions with clear guidance on process, documentation, and timelines&lt;/li&gt; &lt;li&gt;Stay proactive after hires are made by flagging concerns, risks, and expansion opportunities&lt;/li&gt; &lt;li&gt;Keep clients seeing Integrated Hire as a reliable long-term partner&lt;/li&gt; &lt;/ul&gt; &lt;h4&gt;&lt;strong&gt;Interview &amp;amp; Recruitment Coordination&lt;/strong&gt;&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;Coordinate interview scheduling between clients, candidates, and recruiters&lt;/li&gt; &lt;li&gt;Monitor client interviews to ensure attendance&lt;/li&gt; &lt;li&gt;Jump in on scheduling, access, or technical issues in real time&lt;/li&gt; &lt;li&gt;Collect post-interview feedback and share it clearly with the team&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;What We’re Looking For&lt;/strong&gt;&lt;/h2&gt; &lt;h3&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;3+ years in client success, account management, operations, recruitment coordination, or a similar client-facing role&lt;/li&gt; &lt;li&gt;Experience working with U.S.-based clients or companies&lt;/li&gt; &lt;li&gt;Excellent written and verbal English communication skills&lt;/li&gt; &lt;li&gt;Strong organization and follow-through across multiple clients, tasks, and conversations&lt;/li&gt; &lt;li&gt;Comfortable leading client calls and handling difficult or sensitive conversations professionally&lt;/li&gt; &lt;li&gt;Strong judgment and problem-solving ability when dealing with unhappy clients, employee issues, or situations without an obvious answer&lt;/li&gt; &lt;li&gt;High attention to detail with documentation, scheduling, and process management&lt;/li&gt; &lt;li&gt;Proactive, dependable, and able to take ownership without needing constant reminders&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;Preferred&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Experience in staffing, HR, recruitment, outsourcing, BPO, or remote team management&lt;/li&gt; &lt;li&gt;Experience supporting SMB clients in the U.S.&lt;/li&gt; &lt;li&gt;Familiarity with CRM, ATS, project management, or client communication tools&lt;/li&gt; &lt;li&gt;Experience coordinating interviews, onboarding, or service delivery processes&lt;/li&gt; &lt;li&gt;Experience handling client escalations, employee performance issues, or other high-touch problem resolution&lt;/li&gt; &lt;li&gt;Background in operations, executive support, or customer success&lt;br&gt;&lt;br&gt;&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;Why Join Us&lt;/strong&gt;&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Fully remote – work from anywhere in the U.S. or abroad&lt;/li&gt; &lt;li&gt;True location flexibility&lt;/li&gt; &lt;li&gt;Work directly with founders and senior team members&lt;/li&gt; &lt;li&gt;Play a key role in improving client experience and retention&lt;/li&gt; &lt;li&gt;Fast-growing company with strong opportunity for advancement&lt;/li&gt; &lt;li&gt;Collaborative, entrepreneurial team environment&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/integrated-hire-account-manager-client-services\"&gt;https://weworkremotely.com/remote-jobs/integrated-hire-account-manager-client-services&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Tue, 18 Aug 2026 21:22:10 +0000</pubDate> <expires_at>Thu, 17 Sep 2026 21:22:10 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/integrated-hire-account-manager-client-services</guid> <link>https://weworkremotely.com/remote-jobs/integrated-hire-account-manager-client-services</link> </item> <item> <title>Zenara Health: DevOps &amp; Security Engineer - AI-Native Healthcare SaaS</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>DevOps and Sysadmin</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; India &lt;/p&gt; &lt;h3&gt;About the Company&lt;/h3&gt;&lt;p&gt;Zenara Health is a mental healthcare organization driven by technology, aiming to improve the accessibility and quality of mental wellness services. By integrating AI-driven platforms with professional clinical care, we deliver personalized and effective mental health solutions, creating a smooth digital experience for both patients and providers. We operate as a startup, distinct from a mere department.&lt;/p&gt;&lt;h3&gt;Why This Role Exists&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;This position serves as the company's foremost line of defense.&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;You will operate under the assumption that systems are constantly under threat, crafting infrastructure that is resilient, auditable, and inherently secure. You will be the most risk-aware individual in the startup — and that’s exactly what we require. While others concentrate on feature rollout, you will prioritize the security of patient data, regulatory compliance, and system integrity.&lt;/p&gt;&lt;h3&gt;About the Role&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;If your understanding of DevOps is limited to \"I occasionally execute kubectl apply,\" this position is likely not for you.&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;This role is not suited for those who prioritize speed over safety or view security as an afterthought to be addressed later.&lt;/strong&gt; At Zenara, safeguarding patient data and maintaining system integrity takes precedence over rapid deployment.&lt;/p&gt;&lt;p&gt;Our team is in the process of developing a platform that manages clinical data, operates AI workflows, and processes insurance billing — all within a HIPAA-regulated environment catering to real psychiatric practices. Our infrastructure is operational; however, we lack an individual who will take ownership with a security-first perspective. We currently do not have a dedicated CI/CD owner, a comprehensive security posture, or monitoring that extends beyond simple uptime checks. If HIPAA auditors were to arrive tomorrow, we could withstand the scrutiny — but it wouldn’t be a pleasant experience.&lt;/p&gt;&lt;p&gt;You will be responsible for Zenara’s infrastructure, security posture, and compliance engineering — everything from the ground up. This includes CI/CD pipelines, HIPAA-compliant deployment automation, monitoring and alerting systems, cybersecurity measures and threat defense, access controls, and audit logging — the complete spectrum of \"essential elements that ensure the safe operation of a healthcare company.\"&lt;/p&gt;&lt;p&gt;However, your role will go beyond mere maintenance. You will also develop infrastructure for our AI platform, encompassing model serving, scaling AI workloads, and supporting production AI pipelines. You will have a dual mandate: ensure the stability and security of the platform while also building the necessary infrastructure for AI at scale.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;This represents a unique opportunity for greenfield infrastructure engineering within a healthcare AI company with genuine compliance obligations and real users.&lt;/strong&gt; You will devise systems from fundamental principles, make architectural choices, establish best practices to guide us through growth and compliance audits, and serve as the ultimate security gatekeeper.&lt;/p&gt;&lt;h3&gt;What You Will Own&lt;/h3&gt;&lt;h3&gt;1. Cybersecurity &amp;amp; Threat Defense&lt;/h3&gt;&lt;p&gt;You will manage threat modeling, reduce attack surfaces, oversee intrusion detection, handle vulnerability management, and plan incident responses. You will be the final reviewer for infrastructure and security risks, possessing the authority to halt releases that do not satisfy security or compliance criteria. The security of patient data is non-negotiable.&lt;/p&gt;&lt;h3&gt;2. CI/CD and Deployment Automation&lt;/h3&gt;&lt;p&gt;You will design and implement CI/CD pipelines for all Zenara products, establishing deployment automation, managing environments, and setting quality thresholds. Your goal is to eliminate chaotic releases and establish a system that enables the team to deploy confidently and consistently — without compromising security.&lt;/p&gt;&lt;h3&gt;3. Security Posture and HIPAA Compliance&lt;/h3&gt;&lt;p&gt;You will develop and uphold a HIPAA-compliant security posture across all Zenara systems. This involves implementing access controls, managing secrets, maintaining audit logs, and enforcing encryption standards. You will ensure our adherence to regulatory requirements while avoiding bureaucratic slowdowns.&lt;/p&gt;&lt;h3&gt;4. Monitoring, Alerting, and Incident Response&lt;/h3&gt;&lt;p&gt;You will create monitoring and alerting capabilities to proactively identify issues before they affect users. You will establish incident response protocols, define service level objectives (SLOs), and monitor reliability metrics. You will lead the on-call rotation and develop runbooks for common incidents.&lt;/p&gt;&lt;h3&gt;5. AI Infrastructure Support&lt;/h3&gt;&lt;p&gt;You will address the AI infrastructure needs, including model serving, GPU provisioning (if necessary), and autoscaling for AI workloads. You will collaborate with the Head of AI to ensure that the infrastructure supports production AI efficiently and securely.&lt;/p&gt;&lt;h3&gt;6. Cloud Infrastructure Management&lt;/h3&gt;&lt;p&gt;You will oversee cloud infrastructure (AWS/Azure), focusing on cost optimization, reliability, disaster recovery, and capacity planning. You will make architectural decisions that find a balance between cost, performance, and compliance obligations.&lt;/p&gt;&lt;h3&gt;7. SOC 2 Readiness&lt;/h3&gt;&lt;p&gt;You will spearhead SOC 2 Type II preparedness as we approach fundraising, implementing necessary controls, organizing evidence collection, and liaising with auditors. You will ensure compliance becomes an integrated process rather than an ad-hoc measure.&lt;/p&gt;&lt;h3&gt;8. Security Incident Response&lt;/h3&gt;&lt;p&gt;You will take charge of security incident response, establishing procedures, conducting regular security evaluations, and responding to incidents as they arise. Your efforts will help the organization recognize security as an essential discipline rather than an afterthought.&lt;/p&gt;&lt;h3&gt;Your First 90 Days&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Week 1-2:&lt;/strong&gt; Fully immerse yourself in the current infrastructure, deployment processes, and security posture. Identify the most significant security vulnerabilities and critical gaps. Build rapport through active listening and insightful inquiries.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Month 1:&lt;/strong&gt; Set up basic monitoring and alerting systems. Outline the CI/CD roadmap. Begin documenting existing systems and security protocols. Establish communication channels with engineering leadership. Conduct initial threat assessments.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Month 2-3:&lt;/strong&gt; Develop CI/CD pipelines for high-priority services with security gates. Implement secrets management and access controls. Create the first set of operational and security runbooks. Initiate SOC 2 gap analysis and planning for remediation. Introduce intrusion detection and vulnerability scanning.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Ongoing:&lt;/strong&gt; Take on full ownership of infrastructure and security. Deliver reliable and secure systems. Establish compliance practices and enhance security standards. Assertively say “no” when risks are unacceptable. Inspire confidence in the CEO that infrastructure and security are in capable hands.&lt;/p&gt;&lt;h3&gt;Values &amp;amp; Vibe (Who You Are)&lt;/h3&gt;&lt;p&gt;You perceive infrastructure primarily through the lens of &lt;strong&gt;security and reliability&lt;/strong&gt;, rather than merely uptime. You are the one who enters an unmanaged infrastructure landscape and brings order — not through an excess of tools, but through clarity, automation, and effective monitoring. For you, security is not a mere checklist; it shapes your worldview.&lt;/p&gt;&lt;p&gt;You possess an &lt;strong&gt;innate sense of paranoia&lt;/strong&gt; — assuming systems are under threat and designing with that understanding. You find an infrastructure environment that functions like a black box, relying on heroic measures rather than standard practices, to be unacceptable. You recognize that healthcare compliance is mandatory and understand how to implement it practically, without hindering development speed.&lt;/p&gt;&lt;p&gt;You are hands-on enough to diagnose production issues, write Terraform modules, and review security configurations — yet you know that your primary responsibility lies in creating systems that are both reliable and secure, rather than solely reacting to incidents. You have successfully built infrastructure in regulated sectors while adhering to compliance constraints.&lt;/p&gt;&lt;p&gt;You have considered issues related to security threats, compliance frameworks, and disaster recovery — moving beyond the simplistic notion of \"we use AWS defaults.\" You understand the trade-offs between security, cost, developer experience, and compliance requirements. When faced with uncertainty, your choice will always be security.&lt;/p&gt;&lt;p&gt;You are &lt;strong&gt;comfortable saying “no”&lt;/strong&gt; when risks are unacceptable, even if it delays feature deployment. This is not obstruction; it is part of your role.&lt;/p&gt;&lt;h3&gt;What Success Looks Like&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;The infrastructure is both reliable and secure — the CEO no longer concerns themselves with outages or breaches.&lt;/li&gt;&lt;li&gt;CI/CD pipelines are in place and delivering regularly — deployments become routine, low-risk, and security-gated.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;The cybersecurity posture is robust&lt;/strong&gt; — threat modeling is thorough, attack surfaces are minimized, and vulnerabilities are monitored for remediation.&lt;/li&gt;&lt;li&gt;The security posture is firm — access controls, audit trails, and secrets management are strictly enforced.&lt;/li&gt;&lt;li&gt;Monitoring and alerting systems identify issues before they are reported by users.&lt;/li&gt;&lt;li&gt;HIPAA compliance is systematic — we are audit-ready without frantic preparations.&lt;/li&gt;&lt;li&gt;AI infrastructure supports production workloads reliably and cost-effectively.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;A security review process is established&lt;/strong&gt; — any risky releases are identified and halted prior to shipping.&lt;/li&gt;&lt;li&gt;Incident response is documented and efficient — problems are resolved swiftly.&lt;/li&gt;&lt;li&gt;The infrastructure and security posture are more robust, reliable, and compliant than upon your arrival.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt; &lt;p&gt;&lt;/p&gt;&lt;h3&gt;Required&lt;/h3&gt;&lt;p&gt;- &lt;strong&gt;5-10 years of experience in DevOps, SRE, or Platform Engineering&lt;/strong&gt; — you have designed and maintained large-scale production infrastructure.&lt;/p&gt;&lt;p&gt;- &lt;strong&gt;A strong security mindset: naturally cautious, detail-focused, and able to express concerns when risks are too high.&lt;/strong&gt; For you, security is not merely a feature; it is a fundamental necessity.&lt;/p&gt;&lt;p&gt;- &lt;strong&gt;Familiarity with HIPAA, SOC 2, or healthcare compliance frameworks&lt;/strong&gt; — you comprehend BAAs, audit trails, and regulatory obligations. You have successfully implemented compliant systems.&lt;/p&gt;&lt;p&gt;- &lt;strong&gt;Proficient in AWS or Azure with infrastructure-as-code&lt;/strong&gt; (Terraform, Pulumi, or CloudFormation) — you handle infrastructure through programming rather than manual console operations.&lt;/p&gt;&lt;p&gt;- &lt;strong&gt;CI/CD pipeline design and implementation&lt;/strong&gt; (GitHub Actions, CircleCI, Jenkins, or similar) — you have developed deployment automation from the ground up.&lt;/p&gt;&lt;p&gt;- &lt;strong&gt;Experience in container orchestration&lt;/strong&gt; (Kubernetes, ECS, or equivalent) — you know how to deploy and scale applications in containers.&lt;/p&gt;&lt;p&gt;- &lt;strong&gt;Skills in cybersecurity&lt;/strong&gt;: including threat modeling, vulnerability assessment, intrusion detection, and incident response.&lt;/p&gt;&lt;p&gt;- &lt;strong&gt;Strong English communication skills&lt;/strong&gt; — You operate asynchronously and provide clear written documentation, incident reports, and architectural designs.&lt;/p&gt;&lt;p&gt;- &lt;strong&gt;Experience in startup or high-growth environments&lt;/strong&gt; — You have thrived in situations marked by uncertainty, constrained resources, and pressing deadlines.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;Strongly Preferred&lt;/h3&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;- Experience in supporting ML/AI infrastructure (model serving, GPU clusters)&lt;/p&gt;&lt;p&gt;- Security expertise in healthcare SaaS (handling PHI, encryption at rest/transit, access auditing)&lt;/p&gt;&lt;p&gt;- Background in penetration testing or security audits&lt;/p&gt;&lt;p&gt;- Prior experience with SOC 2 or HITRUST certification processes&lt;/p&gt;&lt;p&gt;- Knowledge of observability and monitoring tools (Datadog, Prometheus, Grafana, or similar)&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;Nice to Have&lt;/h3&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;- Understanding of FHIR/HL7 healthcare data standards&lt;/p&gt;&lt;p&gt;- Production experience with Kubernetes&lt;/p&gt;&lt;p&gt;- Acquainted with multi-tenant SaaS security strategies&lt;/p&gt;&lt;p&gt;- Exposure to mental health or behavioral health sectors&lt;/p&gt;&lt;p&gt;- Experience with cloud infrastructure cost optimization&lt;/p&gt;&lt;p&gt;- Relevant security certifications (CISSP, CEH, or equivalent)&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;Schedule&lt;/h3&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;Evening IST hours with &lt;strong&gt;4–8 hours of daily overlap with US Pacific&lt;/strong&gt; (9am–5pm PT). You are welcome to propose a schedule that works best for you — our emphasis is on overlap and team availability rather than rigid clock-in requirements. On-call availability is expected during key security incidents.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt; &lt;p&gt;- Salary between ₹22–35 LPA, based on your skills and responsibilities&lt;/p&gt;&lt;p&gt;- Fully remote work options available throughout India&lt;/p&gt;&lt;p&gt;- Provision for equipment allowance&lt;/p&gt;&lt;p&gt;- Acknowledgment of culturally significant local holidays (India)&lt;/p&gt;&lt;p&gt;- Flexible paid leave options&lt;/p&gt;&lt;p&gt;- Direct and regular communication with the CEO — you will have direct access without any intermediaries&lt;/p&gt;&lt;p&gt;- Opportunity to build infrastructure and security practices from the ground up&lt;/p&gt;&lt;p&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/zenara-health-devops-security-engineer-ai-native-healthcare-saas\"&gt;https://weworkremotely.com/remote-jobs/zenara-health-devops-security-engineer-ai-native-healthcare-saas&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Tue, 18 Aug 2026 20:34:31 +0000</pubDate> <expires_at>Thu, 17 Sep 2026 20:34:31 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/zenara-health-devops-security-engineer-ai-native-healthcare-saas</guid> <link>https://weworkremotely.com/remote-jobs/zenara-health-devops-security-engineer-ai-native-healthcare-saas</link> </item> <item> <title>Thatch: Product Designer</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Design</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote (US) &lt;/p&gt; &lt;div class=\"job__description body\"&gt;&lt;div&gt;&lt;h3 class=\"mb-4 text-xl font-extrabold tracking-tight text-gray-900 sm:text-3xl md:text-2xl\"&gt;About the role&lt;/h3&gt;&lt;br&gt;&lt;p class=\"mt-4\"&gt;At Thatch, design is one of the defining traits that sets us apart. The healthcare experience in America has long been subpar, and the bar for quality design is low — we’re raising that bar, and with it, the entire health insurance industry.&lt;/p&gt;&lt;br&gt;&lt;p&gt;As a designer at Thatch, you’ll craft beautiful experiences for the people using our product every day: businesses, their teams, and brokers. You’ll shape all aspects of design, including UI components for our design system, new products involving complex user interactions, and the overall strategy and vision of the design team. Your work will help create a better insurance experience that &lt;strong&gt;enables members to get the healthcare benefits they need while feeling calm, fulfilled, and liberated&lt;/strong&gt;.&lt;/p&gt;&lt;br&gt;&lt;p&gt;We’re looking for someone who can meet users where they are in their journey and inspire trust by delivering simple, beautiful, and well-crafted end-to-end experiences. You should be comfortable owning the entire design process, from UX strategy to product design and company branding.&lt;/p&gt;&lt;br&gt;&lt;div class=\"mt-10\"&gt;&lt;br&gt;&lt;h3 class=\"mb-4 text-xl font-extrabold tracking-tight text-gray-900 sm:text-3xl md:text-2xl\"&gt;What you'll do&lt;/h3&gt;&lt;br&gt;&lt;ul class=\"ml-4 list-disc\"&gt;&lt;br&gt;&lt;li&gt;Participate in and shape every part of the product development process, from idea inception to production&lt;/li&gt;&lt;br&gt;&lt;li&gt;Work cross-functionally with engineering, growth, product, sales, operations, and leadership to create incredible user experiences&lt;/li&gt;&lt;br&gt;&lt;li&gt;Develop and maintain the design system and brand assets we’ll use across the company&lt;/li&gt;&lt;br&gt;&lt;li&gt;Write design documentation and guidelines for internal audiences&lt;/li&gt;&lt;br&gt;&lt;li&gt;Iterate on and improve our design standards, tooling, and processes&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;/div&gt;&lt;br&gt;&lt;div class=\"mt-10\"&gt;&lt;br&gt;&lt;h3 class=\"mb-4 text-xl font-extrabold tracking-tight text-gray-900 sm:text-3xl md:text-2xl\"&gt;Background we're looking for&lt;/h3&gt;&lt;br&gt;&lt;ul class=\"ml-4 list-disc\"&gt;&lt;br&gt;&lt;li&gt;4+ years of experience in product design roles&lt;/li&gt;&lt;br&gt;&lt;li&gt;Obsession with understanding and serving users and, ultimately, making their lives better&lt;/li&gt;&lt;br&gt;&lt;li&gt;Demonstrated first principle thinking and mastery of fundamental design principles&lt;/li&gt;&lt;br&gt;&lt;li&gt;Experience operating in ambiguous environments solving complex user problems&lt;/li&gt;&lt;br&gt;&lt;li&gt;Ability to balance blue sky creativity and dedication to craft with bias to action&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;/div&gt;&lt;br&gt;&lt;div class=\"mt-10\"&gt;&lt;br&gt;&lt;h3 class=\"mb-4 text-xl font-extrabold tracking-tight text-gray-900 sm:text-3xl md:text-2xl\"&gt;Experience we’d be particularly excited about&lt;/h3&gt;&lt;br&gt;&lt;ul class=\"ml-4 mt-4 list-disc\"&gt;&lt;br&gt;&lt;li&gt;Ability to read and/or write HTML, CSS, and JavaScript&lt;/li&gt;&lt;br&gt;&lt;li&gt;Background scaling high growth technology companies in the past&lt;/li&gt;&lt;br&gt;&lt;li&gt;Experience or interest in finance, healthcare, or benefits&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;/div&gt;&lt;br&gt;&lt;div class=\"mt-10\"&gt;&lt;br&gt;&lt;h3 class=\"mb-4 text-xl font-extrabold text-gray-900 sm:text-3xl md:text-2xl\"&gt;What to expect&lt;/h3&gt;&lt;br&gt;&lt;p&gt;We want this process to be transparent, thoughtful, and reflective of the work you’ll be doing every day. Our goal is to learn how you think, collaborate, and create — while giving you a clear sense of the team, our culture, and how we work together. Here’s what the process looks like:&lt;/p&gt;&lt;br&gt;&lt;ul&gt;&lt;br&gt;&lt;li&gt;30-minute video interview screen to talk through your background and interest in Thatch.&lt;/li&gt;&lt;br&gt;&lt;li&gt;30 minute first-round video interview with the hiring manager to dive deeper into your experience, approach to design, and how you work.&lt;/li&gt;&lt;br&gt;&lt;li&gt;30 minute video meetings to connect with two members of the team&lt;/li&gt;&lt;br&gt;&lt;li&gt;60-minute video meeting portfolio review with members of the design team to walk through your projects, your process, and the impact of your work.&lt;/li&gt;&lt;br&gt;&lt;li&gt;30 minute video meeting with our founder to discuss culture, values, and how we operate as a company.&lt;br&gt;&lt;br&gt;&lt;/li&gt;&lt;br&gt;&lt;/ul&gt;&lt;br&gt;&lt;p&gt;We aim to move efficiently while giving you space to share your thinking, ask questions, and get a real sense of what it’s like to work here.&lt;/p&gt;&lt;br&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;div class=\"mt-10 text-base text-gray-500\"&gt;&amp;nbsp;&lt;/div&gt;&lt;br&gt;&lt;br&gt;&lt;div class=\"mt-10\"&gt;&lt;br&gt;&lt;h3 class=\"mb-4 text-xl font-extrabold text-gray-900 sm:text-3xl md:text-2xl\"&gt;About Thatch&lt;/h3&gt;&lt;br&gt;&lt;p class=\"mb-4 text-base text-gray-500\"&gt;We’re a fully distributed early stage company using technology to change the way America does healthcare. We’re a happy, friendly, high-velocity team. You can read&amp;nbsp;&lt;a class=\"font-medium text-indigo-600 hover:text-indigo-500\" href=\"https://thatch.ai/company\"&gt;more on Thatch here&lt;/a&gt;.&lt;/p&gt;&lt;br&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/thatch-product-designer\"&gt;https://weworkremotely.com/remote-jobs/thatch-product-designer&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Tue, 18 Aug 2026 20:33:40 +0000</pubDate> <expires_at>Thu, 17 Sep 2026 20:33:40 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/thatch-product-designer</guid> <link>https://weworkremotely.com/remote-jobs/thatch-product-designer</link> </item> <item> <title>Fisher Associates, P.e., L.s., L.a., D.: Precast Design Engineer</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Design</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote Worker - USA Infrastructure + Mobility &lt;/p&gt; &lt;div class=\"job-preview-details\"&gt;&lt;br&gt;&lt;div class=\"vertical-padding\"&gt;&lt;br&gt;&lt;div&gt;Full-time&lt;/div&gt;&lt;br&gt;&lt;/div&gt;&lt;br&gt;&lt;div class=\"job-listing-header\"&gt;Description&lt;/div&gt;&lt;br&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Precast Design Engineer - Civil/Structural&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Join Our Team as a Precast Design Engineer – Innovate and Lead in Concrete Design&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;Are you ready to take your engineering career to new heights? Fisher Associates is seeking a skilled Precast Design Engineer to join our dynamic team, where your expertise in designing precast concrete components will make an impact on diverse civil and structural projects.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;Join Fisher Associates and bring your talents to a team that values innovation, collaboration, and your unique contributions. Apply now to advance your career and play a key role in impactful projects within a supportive and dynamic environment!&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;About Fisher Associates&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;At Fisher Associates, we are a multidisciplinary design services firm with nine locations nationwide. Our services span civil/site engineering, transportation engineering, electrical engineering, landscape architecture, architecture, planning, environmental services, land surveying, GIS, construction inspection, precast, and construction engineering, each offering opportunities to shape communities and improve lives.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;What You’ll Do as a Precast Design Engineer&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Lead and execute precast engineering and design tasks efficiently.&lt;/li&gt;&lt;li&gt;Collaborate with project teams to deliver structurally sound, cost-effective, and visually appealing precast concrete designs.&lt;/li&gt;&lt;li&gt;Perform and review structural analysis and calculations to ensure safety under various loads and conditions.&lt;/li&gt;&lt;li&gt;Select materials and components for precast concrete production that meet strength, durability, and sustainability standards.&lt;/li&gt;&lt;li&gt;Create accurate drawings, plans, and specifications for precast projects aligned with industry design standards.&lt;/li&gt;&lt;li&gt;Support cost estimation for materials&lt;/li&gt;&lt;li&gt;Support Project Managers and Designers throughout the project lifecycle.&lt;/li&gt;&lt;li&gt;Promote, utilize and support QA/QC processes to guarantee quality deliverables.&lt;/li&gt;&lt;li&gt;Guide and mentor junior staff.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;br&gt;&lt;div class=\"job-listing-header\"&gt;Requirements&lt;/div&gt;&lt;br&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;What You Bring, Your Expertise as a Precast Design Engineer&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;B.S. degree in Civil Engineering or a related field, Master’s preferred&lt;/li&gt;&lt;li&gt;5 -10 years minimum Precast concrete design engineering experience&lt;/li&gt;&lt;li&gt;Experience in precast concrete design engineering for transportation infrastructure and underground structures (utility vaults, manholes, drainage structures and pump stations) preferred&lt;/li&gt;&lt;li&gt;Familiarity with ACI 318, ACI 350, ASCE-7, AASHTO&lt;/li&gt;&lt;li&gt;Familiarity with IBC codes a plus&lt;/li&gt;&lt;li&gt;Professional Engineering License (PE) preferred or ability to obtain it&lt;/li&gt;&lt;li&gt;Proficiency in AutoCAD &amp;amp; RISA 3D&lt;/li&gt;&lt;li&gt;Professional performance aligned with Fisher’s Mission, Vision, and Core Values&lt;/li&gt;&lt;li&gt;Dedicated to fostering trusting relationships through collaboration, integrity, respect, and active listening&lt;/li&gt;&lt;li&gt;Proven ability to deliver quality work through critical thinking, problem-solving, and sound judgment&lt;/li&gt;&lt;li&gt;Proactively own projects, prioritize effectively, and meet deadlines in a fast-paced, growth environment.&lt;/li&gt;&lt;li&gt;Superior organizational and planning skills with keen attention to detail&lt;/li&gt;&lt;li&gt;Curious and improvement-minded, embracing feedback and continuously seeking better solutions.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;Why You’ll Love Working at Fisher&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;You are empowered &lt;/strong&gt;to achieve exceptional results through collaboration and leadership of multidisciplinary design teams.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Your voice &lt;/strong&gt;matters in our inclusive culture, where accessible leadership welcomes ideas and feedback.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Your growth &lt;/strong&gt;is our priority, supported by clear career paths and leadership opportunities.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;You thrive&lt;/strong&gt; in a culture that keeps work engaging and fosters a relaxed, easy-going atmosphere.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Your journey&lt;/strong&gt; is supported by a team-driven environment that promotes mentorship and ongoing learning.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Your success&lt;/strong&gt; is supported by a flexible work environment so you can thrive professionally and personally.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;What We Offer&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Your Impact Matters, Your Career Thrives.&lt;/strong&gt; Create meaningful community impact through engaging precast engineering projects while advancing your career. We offer competitive salaries and benefits, including:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Medical, Dental &amp;amp; Vision Insurance&lt;/li&gt;&lt;li&gt;401(k) Plan&lt;/li&gt;&lt;li&gt;Company-paid Life and Disability Insurance&lt;/li&gt;&lt;li&gt;Hybrid Work Schedule&lt;/li&gt;&lt;li&gt;Generous PTO and Paid Holidays&lt;/li&gt;&lt;li&gt;Strong Work-life Balance&lt;/li&gt;&lt;li&gt;Shareholders Program&lt;/li&gt;&lt;li&gt;Professional Development Opportunities and Reimbursement&lt;/li&gt;&lt;li&gt;Supplemental Benefits Designed for Total Well-being and Financial Security&lt;/li&gt;&lt;li&gt;Engage with a variety of employee groups focused on community, inclusion, and employee voice.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;Salary Range&lt;/strong&gt; $83,000-$105,000&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;em&gt;Actual compensation may vary based on relevant experience, qualifications/education, and other factors. The salary range is not necessarily reflective of the actual total compensation that may be earned nor promise any specific pay for any specific employee. Salary range excludes monetary value of benefits.&lt;/em&gt;&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Equal Employment Opportunity Statement&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Fisher Associates is committed to fostering a diverse and inclusive workplace where all individuals are respected, valued, and empowered to thrive. We do not discriminate on the basis of any protected status under federal, state, or local law.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;#LI-Remote&lt;/p&gt;&lt;/div&gt;&lt;br&gt;&lt;div class=\"job-listing-header\"&gt;Salary Description&lt;/div&gt;&lt;br&gt;&lt;div&gt;$83,000 - $105,000 annually&lt;/div&gt;&lt;br&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/fisher-associates-p-e-l-s-l-a-d-precast-design-engineer\"&gt;https://weworkremotely.com/remote-jobs/fisher-associates-p-e-l-s-l-a-d-precast-design-engineer&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Tue, 18 Aug 2026 20:33:18 +0000</pubDate> <expires_at>Thu, 17 Sep 2026 20:33:18 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/fisher-associates-p-e-l-s-l-a-d-precast-design-engineer</guid> <link>https://weworkremotely.com/remote-jobs/fisher-associates-p-e-l-s-l-a-d-precast-design-engineer</link> </item> <item> <title>Destination Knot: Customer Support Reservation Services (Remote)</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Customer Support</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Georgia &lt;/p&gt; &lt;div class=\"content\"&gt;&lt;div class=\"section-wrapper page-full-width\"&gt;&lt;div class=\"section page-centered\"&gt;&lt;div&gt;&lt;b&gt;About the Role:&lt;/b&gt;&lt;/div&gt;&lt;div&gt; We are seeking a remote Customer Support professional to assist clients with reservation-related inquiries and general service needs. This role focuses on delivering high-quality customer support, gathering accurate information, and helping organize essential details for reservation preparation. The ideal candidate is patient, detail-oriented, and able to work independently in a virtual environment.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Responsibilities:&lt;/b&gt;&lt;/div&gt;&lt;div&gt; • Provide responsive customer support for reservation questions and service needs&lt;/div&gt;&lt;div&gt; • Assist clients with gathering required details for reservations and trip coordination&lt;/div&gt;&lt;div&gt; • Research basic accommodation, activity, and destination information as needed&lt;/div&gt;&lt;div&gt; • Maintain accurate client records and update internal systems&lt;/div&gt;&lt;div&gt; • Prepare and organize reservation details and related documentation&lt;/div&gt;&lt;div&gt; • Communicate clearly and professionally with clients throughout the process&lt;/div&gt;&lt;div&gt; • Coordinate follow-ups, scheduling, and status updates&lt;/div&gt;&lt;div&gt; • Support the reservation workflow by confirming information and managing documentation&lt;/div&gt;&lt;div&gt; • Perform general administrative and customer service tasks as assigned&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Qualifications:&lt;/b&gt;&lt;/div&gt;&lt;div&gt; • Strong communication and customer service skills&lt;/div&gt;&lt;div&gt; • Excellent attention to detail and organizational abilities&lt;/div&gt;&lt;div&gt; • Ability to work remotely with consistent follow-through&lt;/div&gt;&lt;div&gt; • Comfortable using online tools, systems, and digital platforms&lt;/div&gt;&lt;div&gt; • Previous customer service or administrative experience preferred&lt;/div&gt;&lt;div&gt; • Dependable, professional, and able to manage multiple tasks&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Work Environment:&lt;/b&gt;&lt;/div&gt;&lt;div&gt; • Fully remote position&lt;/div&gt;&lt;div&gt; • Flexible scheduling&lt;/div&gt;&lt;div&gt; • Training and ongoing support provided&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;If you enjoy supporting clients, staying organized, and helping ensure smooth reservation processes, this role offers a structured environment to build your skills in customer service and reservation coordination.&lt;/div&gt;&lt;/div&gt;&lt;div class=\"section page-centered\"&gt;&lt;div&gt;$45,000 - $65,000 a year&lt;/div&gt;&lt;/div&gt;&lt;div class=\"section page-centered\"&gt;&lt;div class=\"text-small italic text-gray-700\"&gt;We may use artificial intelligence (AI) tools to support parts of the hiring process, such as reviewing applications, analyzing resumes, or assessing responses. These tools assist our recruitment team but do not replace human judgment. Final hiring decisions are ultimately made by humans. If you would like more information about how your data is processed, please contact us.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/destination-knot-customer-support-reservation-services-remote\"&gt;https://weworkremotely.com/remote-jobs/destination-knot-customer-support-reservation-services-remote&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Tue, 18 Aug 2026 20:33:08 +0000</pubDate> <expires_at>Thu, 17 Sep 2026 20:33:08 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/destination-knot-customer-support-reservation-services-remote</guid> <link>https://weworkremotely.com/remote-jobs/destination-knot-customer-support-reservation-services-remote</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0171/6206/logo.gif\" type=\"image/png\"/> <title>Collaboration.Ai: Senior Software AI Engineer </title> <region>Anywhere in the World</region> <country>🇺🇸 United States of America</country> <state>Minnesota</state> <skills>Node.js, PostgreSQL, Python, Large Language Models (LLMs), Kotlin, TypeScript, AI Agents, and Agentic AI</skills> <category>Back-End Programming</category> <type>Full-Time</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0171/6206/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Minneapolis, MN &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"http://collaboration.ai\"&gt;http://collaboration.ai&lt;/a&gt; &lt;/p&gt; &lt;h1&gt;Who We Are&lt;/h1&gt; &lt;p&gt;Collaboration.Ai is a mission-focused, AI-powered software and services company based in Minnesota, with employees, partners, and customers around the world. We unite people, technology, and purpose to accelerate breakthroughs that transform industries, empower communities, and create a more sustainable future. We collaborate with organizations across the defense ecosystem, helping them navigate complex challenges and drive transformative change.&lt;/p&gt; &lt;h1&gt;Our Products&lt;/h1&gt; &lt;p&gt;NetworkOS — NetworkOS is an AI-powered platform that aligns people, purpose, ideas, and expertise in real-time, generating actionable insights to propel movements forward.&lt;/p&gt; &lt;p&gt;CrowdVector — CrowdVector is an integrated solution marketplace and innovation management platform that rapidly uncovers new ideas and advances breakthroughs to fuel movements.&lt;/p&gt; &lt;p&gt;To learn more about us, visit collaboration.ai.&lt;/p&gt; &lt;h1&gt;About the Role&lt;/h1&gt; &lt;p&gt;You'll build the agentic systems and data pipelines behind NetworkOS's AI capabilities: production agent workflows built on industry-leading agent SDKs and harnesses, MCP servers, and Agent Skills standards; the eval and observability layer that keeps LLM quality measurable; and the ingestion pipelines that turn messy, diverse data sources into queryable knowledge.&lt;/p&gt; &lt;p&gt;This is an execution seat, not an ivory tower. You'll commit code every week, ship agents as product capability rather than demos, and help shape a roadmap that's heading deep into graph + agents territory — for customers in defense, public sector, and regulated enterprise.&lt;/p&gt; &lt;p&gt;Agents in production. Pipelines that hold. Evals that keep everyone honest.&lt;/p&gt; &lt;h1&gt;What You'll Do&lt;/h1&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Ship production agent systems — design, build, and operate agentic workflows (agent SDKs, MCP servers, Agent Skills standards) powering AI-driven matching, analysis, and data intelligence&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Operationalize LLM quality — build the eval and observability layer with Langfuse, golden datasets, LLM-as-judge patterns, and FinOps-style tracking so every workflow has measurable quality, cost, and latency&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Engineer data pipelines — robust ingestion of documents, structured data, and external sources into searchable knowledge bases with quality validation, deduplication, and incremental updates&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Own retrieval quality — hybrid search combining vector, keyword, and metadata retrieval, continuously improved through reranking, query expansion, and contextual compression&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Accelerate with AI — build custom MCP tools and Agent Skills that make the whole engineering team measurably faster&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Execute alongside the team — pair with full-stack engineers on AI integration points, contribute to incident response for AI services, and keep your hands in the code&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h1&gt;Our Tech Stack&lt;/h1&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Languages: Python (primary); Kotlin (core platform language at CAI); TypeScript/Node.js and other modern languages (secondary)&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;AI/ML: FastAPI, Pydantic; multi-provider LLM SDKs (Anthropic, OpenAI, and others)&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Agentic Tooling: Claude Code/Codex/etc.; industry-leading agent SDKs and harnesses; MCP servers; Agent Skills standards&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;LLM Operations: Langfuse + evals (golden datasets, LLM-as-judge); in-house FinOps tracking (token usage, latency, cost); multi-provider orchestration including AWS Bedrock&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Search &amp;amp; Retrieval: Vector databases, OpenSearch, embedding models&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Data: PostgreSQL, Amazon S3; streaming pipelines (Kafka/Kinesis) where needed&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Infrastructure: Docker, Kubernetes (AWS EKS); DataDog + OpenTelemetry observability&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h1&gt;What We're Looking For&lt;/h1&gt; &lt;h2&gt;Must-Haves&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;7+ years of professional software engineering experience, with 3+ years focused on AI/ML or data engineering&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Production agentic/LLM application experience — built and operated systems around LLM APIs (Anthropic, OpenAI) serving real users: agents, tool-use, or orchestrated LLM workflows&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Data engineering background — robust, scalable pipelines for AI/ML workloads&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;LLM operations experience — evals and observability for production LLM systems (quality, cost, latency)&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Production retrieval experience — vector databases and/or search engines (OpenSearch, Elasticsearch)&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Modern Python stack proficiency — FastAPI, Pydantic, async/await, modern dependency management&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;AI-native workflows — demonstrated ability to leverage Claude Code/Codex or similar agentic coding tools to accelerate development&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience with Docker, Kubernetes, and AWS&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;US citizenship required (DoD contracting — IL4/IL5 environments — and FedRAMP compliance)&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Nice-to-Haves&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Deep agentic ecosystem experience — Agent Skills standards, custom MCP servers, agent SDKs across major vendors&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Advanced RAG expertise — GraphRAG, agentic RAG, contextual retrieval, reranking strategies&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Graph data experience — knowledge graphs, graph databases, or graph-based retrieval&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Model selection &amp;amp; rightsizing — matching models to domain-specific use cases across quality, cost, and latency tradeoffs&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Streaming data experience (Kafka, Kinesis) for real-time knowledge base updates&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Research background, open-source contributions, or an advanced degree in ML/IR/NLP&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h1&gt;Why Join Collaboration AI?&lt;/h1&gt; &lt;p&gt;Real AI engineering, not a wrapper shop. Production agents, hybrid retrieval, continuous evals, and a roadmap heading into graph + agents — with the autonomy to shape how it's built.&lt;/p&gt; &lt;p&gt;AI-native by default. We build with AI, not just for AI. Agentic coding tools (Claude Code/Codex/etc.), agent SDKs and harnesses, MCP servers, and Agent Skills standards are how we work daily — you'll both use and build them.&lt;/p&gt; &lt;p&gt;Work that matters. Defense, public sector, and regulated industries — SOC 2 and NIST compliance, FedRAMP readiness, and customers whose missions demand AI they can trust.&lt;/p&gt; &lt;p&gt;Small, senior team. Early-stage impact with your work visible from week one. You'll help set the bar for how AI engineering is done here.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/collaboration-ai-senior-software-ai-engineer\"&gt;https://weworkremotely.com/remote-jobs/collaboration-ai-senior-software-ai-engineer&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Mon, 17 Aug 2026 11:57:38 +0000</pubDate> <expires_at>Wed, 16 Sep 2026 11:57:38 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/collaboration-ai-senior-software-ai-engineer</guid> <link>https://weworkremotely.com/remote-jobs/collaboration-ai-senior-software-ai-engineer</link> </item> <item> <title>Braze: Customer Success Manager II</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Customer Support</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote - Spain &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;p&gt;At Braze, we have found our people. We’re a genuinely approachable, exceptionally kind, and intensely passionate crew.&lt;/p&gt; &lt;p&gt;We seek to ignite that passion by setting high standards, championing teamwork, and creating work-life harmony as we collectively navigate rapid growth on a global scale while striving for greater equity and opportunity – inside and outside our organization.&lt;/p&gt; &lt;p&gt;To flourish here, you must be prepared to set a high bar for yourself and those around you. There is always a way to contribute: Acting with autonomy, having accountability and being open to new perspectives are essential to our continued success.&lt;/p&gt; &lt;p&gt;Our deep curiosity to learn and our eagerness to share diverse passions with others gives us balance and injects a one-of-a-kind vibrancy into our culture.&lt;/p&gt; &lt;p&gt;If you are driven to solve exhilarating challenges and have a bias toward action in the face of change, you will be empowered to make a real impact here, with a sharp and passionate team at your back. If Braze sounds like a place where you can thrive, we can’t wait to meet you.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;As a Customer Success Manager in our South team you will work closely with agile, technology-focused brands to help them realize value from their investment in Braze.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What you’ll do&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Own client renewals, retention and net retention targets for your customers&lt;/li&gt; &lt;li&gt;Be your customers’ main point of contact and trusted advisor at Braze&lt;/li&gt; &lt;li&gt;Partner with Account Executives to provide an excellent customer experience and to ensure commercial alignment&lt;/li&gt; &lt;li&gt;Drive feature adoption by building a shared Success Plan with your customers, providing strategic guidance, enablement, and day-to-day advice to help them hit their objectives with Braze&lt;/li&gt; &lt;li&gt;Drive customer advocacy by building strong customer relationships and creating mutual value for your customers and Braze&lt;/li&gt; &lt;li&gt;Proactively analyze your customer product usage to identify opportunities and risks to account health&amp;nbsp;&amp;nbsp;&lt;/li&gt; &lt;li&gt;Maintain ongoing regular contact with your customers via ad-hoc communications, regular check-ins, events, and Executive Business Reviews.&lt;/li&gt; &lt;li&gt;Advocate for your customers, soliciting and synthesizing customer product feedback to contribute to product development&lt;/li&gt; &lt;li&gt;Provide continuing education for customers to maximize product usage, identifying new or unused Braze features that could provide value for your customer and represent an upsell opportunity for Braze.&lt;/li&gt; &lt;li&gt;In addition to being a dedicated contact for strategy, product training inquiries, and non-technical support, you will coordinate with other Braze teams including Technical Support, Industry Solutions, and Deliverability Services to ensure your customers receive the support they need simply and seamlessly&lt;/li&gt; &lt;li&gt;Work with Onboarding Managers and other Customer Success Partners to seamlessly transition clients from onboarding to ongoing activity.&lt;/li&gt; &lt;li&gt;You will likely spend time onsite with customers and may travel [internationally]&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Please note this job description cannot possibly cover every duty you may need to undertake, you may be asked by your line manager to handle other reasonable responsibilities commensurate with the role.&amp;nbsp;&amp;nbsp;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Who you are&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;You are passionate about customer success and find satisfaction in helping your customers achieve great things.&amp;nbsp; You have a proven track record in customer success and are seeking to progress your career, with one of the industry’s most advanced customer success teams, by working with agile, technology savvy scale customers with between 100 and 1,000 employees.&lt;/p&gt; &lt;ul&gt; &lt;li&gt;You are an excellent communicator with exemplary written and verbal communication skills coupled with unparalleled follow up skills. Clients and colleagues have the impression that you listen and understand the strategic problems they are trying to solve&lt;/li&gt; &lt;li&gt;You’re excited by working with medium and large technology companies who move fast, and want to build new customer experiences quickly&lt;/li&gt; &lt;li&gt;You’re known for being a “team player.” We just can’t emphasize this enough&lt;/li&gt; &lt;li&gt;You build great relationships with colleagues and customers&lt;/li&gt; &lt;li&gt;You have a high level of intellectual curiosity. You see opportunity and growth in learning more about what you do and how it impacts others&lt;/li&gt; &lt;li&gt;You have experience successfully managing complex accounts or projects with sophisticated clients, multiple stakeholders, and competing priorities&lt;/li&gt; &lt;li&gt;You have excellent time management skills&lt;/li&gt; &lt;li&gt;You have domain knowledge of two or more of the following:&amp;nbsp; SaaS, Mobile, APIs, Marketing Automation, Direct Marketing, Marketing Analytics or Programming (HTML etc&lt;/li&gt; &lt;li&gt;2-5 years relevant experience in a related area, for example Onboarding, Customer Success, Implementations or Project Management&lt;/li&gt; &lt;li&gt;Verbal and written fluency in English and Spanish&lt;/li&gt; &lt;/ul&gt;&lt;div class=\"content-conclusion\"&gt;&lt;div class=\"p-rich_text_section\"&gt; &lt;p&gt;&lt;strong&gt;WHAT WE OFFER&lt;br&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;em&gt;Braze benefits vary by location, and we encourage you to review our specific benefits offerings for each country &lt;/em&gt;&lt;a href=\"https://www.braze.com/company/careers/how-we-hire#benefit-section\"&gt;&lt;em&gt;here&lt;/em&gt;&lt;/a&gt;&lt;em&gt;. More details on benefits plans will be provided if you receive an offer of employment.&lt;/em&gt;&lt;/p&gt; &lt;p&gt;From offering comprehensive benefits to fostering hybrid ways of working, we’ve got you covered so you can prioritize work-life harmony. Braze offers benefits such as:&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Competitive compensation that may include equity&lt;/li&gt; &lt;li&gt;Retirement and Employee Stock Purchase Plans&lt;/li&gt; &lt;li&gt;Flexible paid time off&lt;/li&gt; &lt;li&gt;Comprehensive benefit plans covering medical, dental, vision, life, and disability&lt;/li&gt; &lt;li&gt;Family services that include fertility benefits and equal paid parental leave&lt;/li&gt; &lt;li&gt;Professional development supported by formal career pathing, learning platforms, and a yearly learning stipend&lt;/li&gt; &lt;li&gt;A curated in-office employee experience, designed to foster community, team connections, and innovation&lt;/li&gt; &lt;li&gt;Opportunities to give back to your community, including an annual company-wide Volunteer Week and donation matching&amp;nbsp;&lt;/li&gt; &lt;li&gt;Employee Resource Groups that provide supportive communities within Braze&lt;/li&gt; &lt;li&gt;Collaborative, transparent, and fun culture recognized as a Great Place to Work®&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;ABOUT BRAZE&lt;br&gt;&lt;br&gt;&lt;/strong&gt;Braze is the leading customer engagement platform that empowers brands to Be Absolutely Engaging™. Braze helps brands deliver great customer experiences that drive value both for consumers and for their businesses. Built on a foundation of composable intelligence, BrazeAI™ allows marketers to combine and activate AI agents, models, and features at every touchpoint throughout the Braze Customer Engagement Platform for smarter, faster, and more meaningful customer engagement. From cross-channel messaging and journey orchestration to Al-powered decisioning and optimization, Braze enables companies to turn action into interaction through autonomous, 1:1 personalized experiences.&lt;/p&gt; &lt;p&gt;The company has been consistently recognized as a Leader in marketing technology by industry analysts, and was named a G2 “Best of Marketing and Digital Advertising Software Product” in 2026. Braze was also named a 2026 Best Places to Work by Built In, a 2025 America’s Greenest Companies by Newsweek, and a 2025 Fortune Best Workplace in Technology™ by Great Place To Work®. Braze is also proudly certified as a Great Place to Work® in the U.S., the UK, Australia, and Singapore.&amp;nbsp;&lt;/p&gt; &lt;p&gt;The company is headquartered in New York with offices in Austin, Berlin, Bucharest, Chicago, Dubai, Jakarta, London, Paris, San Francisco, São Paulo, Singapore, Seoul, Sydney and Tokyo.&lt;/p&gt; &lt;strong&gt;BRAZE IS AN EQUAL OPPORTUNITY EMPLOYER&lt;/strong&gt; &lt;p&gt;At Braze, we strive to create equitable growth and opportunities inside and outside the organization.&lt;/p&gt; &lt;p&gt;Building meaningful connections is at the heart of everything we do, and that includes our recruiting practices. We're committed to offering all candidates a fair, accessible, and inclusive experience – regardless of age, color, disability, gender identity, marital status, maternity, national origin, pregnancy, race, religion, sex, sexual orientation, or status as a protected veteran. When applying and interviewing with Braze, we want you to feel comfortable showcasing what makes you &lt;em&gt;you&lt;/em&gt;.&lt;/p&gt; &lt;p&gt;We know that sometimes different circumstances can lead talented people to hesitate to apply for a role unless they meet 100% of the criteria. If this sounds familiar, we encourage you to apply, as we’d love to meet you.&lt;br&gt;&lt;br&gt;&lt;strong&gt;OUR AI-POWERED BRAZE RECRUITMENT PROCESS&lt;br&gt;&lt;/strong&gt;&lt;br&gt;At Braze, we’re committed to a fair and transparent candidate experience. To help our recruitment teams focus on what matters most — the person behind each application — we use AI-assisted tools at certain stages of our recruitment process.&amp;nbsp;&lt;/p&gt; &lt;/div&gt; &lt;div class=\"p-rich_text_section\"&gt; &lt;p&gt;This includes using AI to analyze the experience, skills and qualifications in your application materials to help with screening and prioritizing candidates. Such screening may amount to a form of solely automated decision-making. We also use AI for administrative support, like scheduling and recording interviews and summarizing interview notes. Our recruiting teams remain responsible for all hiring decisions and are involved throughout the process.&lt;/p&gt; &lt;p&gt;Depending on where you are located, you may have the right to request further information about how AI is used in our recruitment process, to opt out of AI-assisted review, to request a manual review of any decision made or to contest a decision.&amp;nbsp;&lt;/p&gt; &lt;p&gt;Please contact us at &lt;a href=\"mailto:talentdata.privacy@braze.com\"&gt;talentdata.privacy@braze.com&lt;/a&gt; for any requests or questions.&lt;strong&gt; &lt;/strong&gt;To find out more about our hiring process, check out &lt;a href=\"https://www.braze.com/company/careers/how-we-hire\"&gt;this page&lt;/a&gt;.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Notice Regarding Automated Employment Decision Tool (NYC Local Law 144)&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Our use of AI during the application review process may include the use of automated employment decision tools. Pursuant to New York City Local Law 144, for roles based in New York City, or if you reside in New York City, you have the right to request an alternative selection process or a reasonable accommodation instead of AI-assisted review. Please submit any such request to our Talent Acquisition team at &lt;a href=\"mailto:talentdata.privacy@braze.com\"&gt;talentdata.privacy@braze.com&lt;/a&gt; promptly after applying. A summary of the most recent bias audit results for such tool is available &lt;a href=\"https://www.braze.com/company/legal/bias-audit-candidates\"&gt;here&lt;/a&gt;&lt;em&gt;.&lt;br&gt;&lt;br&gt;Please see our&lt;a href=\"https://www.braze.com/company/legal/privacy-policy-job-candidates\"&gt; Candidate Privacy Policy&lt;/a&gt; for more information on how Braze processes your personal information during the recruitment process and, if applicable based on your location, how you can exercise any privacy rights.&lt;br&gt;&lt;/em&gt;&lt;/p&gt; &lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/braze-customer-success-manager-ii\"&gt;https://weworkremotely.com/remote-jobs/braze-customer-success-manager-ii&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Mon, 17 Aug 2026 07:30:52 +0000</pubDate> <expires_at>Wed, 16 Sep 2026 07:30:52 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/braze-customer-success-manager-ii</guid> <link>https://weworkremotely.com/remote-jobs/braze-customer-success-manager-ii</link> </item> <item> <title>Hightouch: Customer Success Engineer</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Customer Support</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote (North America) &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;h2&gt;About Hightouch&lt;/h2&gt; &lt;p&gt;Hightouch is an Agentic Marketing Platform powered by the industry-leading Composable CDP. With complete brand context, customer data, and performance history in one place, every marketer finally has the power to build and ship end-to-end campaigns themselves. Teams move faster, stay on brand, and get AI marketing that actually works.&lt;/p&gt; &lt;p&gt;Founded in 2019 and headquartered in San Francisco, Hightouch enables marketing teams to analyze performance, brainstorm ideas, and generate creative at a speed and quality that wasn't previously possible.&lt;/p&gt; &lt;p&gt;Named a Leader in the 2026 Gartner® Magic Quadrant™ for Customer Data Platforms, Hightouch is trusted by leading enterprises like Domino's, Spotify, Aritzia, Cars.com, Ramp, and PetSmart.&lt;/p&gt; &lt;p&gt;At Hightouch, our mission is to help our customers leverage data and AI to grow their businesses. The team is ambitious, impact-driven, efficient — and we believe humility, kindness, and compassion are essential to our success. If you're energized by velocity, obsessed with raising the bar, and want to build alongside people who care deeply about each other and our customers, we'd love to meet you.&lt;/p&gt;&lt;/div&gt;&lt;div&gt; &lt;div&gt; &lt;div&gt; &lt;div&gt; &lt;h2&gt;About the Role&lt;/h2&gt; &lt;p&gt;The Customer Success Engineering role is demanding and requires strong organizational skills and an ability to multitask. You’ll work directly with all users to ensure they can get the most value from the platform. This may include answering questions in Intercom, Slack, on the phone, or through email. The nature of the work is technical and requires an understanding of how to read API documentation, how the standard suite of SaaS tools work (e.g. CRMs, ESPs, ERPs, etc...), and the basic building blocks of customers use data.&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div&gt; &lt;div&gt; &lt;div&gt; &lt;div&gt; &lt;p&gt;The Customer Success Engineering role is also designed to provide broad exposure across the organization, including tight collaboration with Technical Account Managers, Solutions Engineers, Marketing, Engineering, and Operations. The role is perfect for strong team players that want to have impact across the company and with our customers.&lt;/p&gt; &lt;h2&gt;About You&lt;/h2&gt; &lt;p&gt;The ideal candidate is hungry to learn, excited to cross-functionally collaborate, driven to deliver optimal customer experiences, and is excited to learn from and teach others. Hightouch is still a startup, which translates to pitching in across the organization and wearing many hats as we grow. You will be excited for an opportunity that allows you to be an important member of an exceptional company, be willing to ask questions when you’re unsure, and take initiative when you’re passionate about a topic/solution/process.&lt;/p&gt; &lt;p&gt;Finally, you’ll need to be a self-starter, comfortable with ambiguity, willing to challenge the status quo, and a strong team player. Everyone at Hightouch plays an important role in our growth and this position is at the forefront of our efforts to drive an exceptional for every user. We’re of the firm belief that keeping customers promises is how we’ll win and we’re excited for this role to play an integral part of the customer journey.&lt;/p&gt; &lt;h2&gt;Requirements&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;2+ years in a customer-facing role (Note: Doesn’t necessarily need to be technical)&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Technical background either through experience or education&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Conversant in SQL or willing to learn the basics and a few more advanced topics&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Strong discovery and interpersonal skills&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Intellectual curiosity, high ambition, and humility.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Excellent verbal and written communication skills.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Ability to adapt to an ever-changing work environment&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Thorough understanding of the technology industry and its players&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;The salary range for this position is $85,000-$110,000 per year, which is location independent. We also offer meaningful equity compensation in the form of ISO options and offer early exercise and a 10-year post-termination exercise window.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&lt;strong&gt;E-Verify Statement&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;em&gt;Hightouch participates in E-Verify. After you join the team, we'll verify your eligibility to work in the U.S. by submitting information from your Form I-9 to the Social Security Administration and, if needed, the Department of Homeland Security. This process happens post-hire only — we never use E-Verify to pre-screen applicants.&lt;/em&gt;&lt;/p&gt; &lt;p&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;a href=\"https://www.rhoworld.com/wp-content/uploads/E-Verify_Participation_Poster-1.pdf\"&gt;&lt;em&gt;E-Verify Notice&lt;/em&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/a&gt;&lt;a href=\"https://www.rhoworld.com/wp-content/uploads/E-Verify_Participation_Poster_ES-1.pdf\"&gt;&lt;em&gt;E-Verify Notice (Spanish)&lt;/em&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/a&gt;&lt;a href=\"https://www.rhoworld.com/wp-content/uploads/ier_poster_final.pdf\"&gt;&lt;em&gt;Right to Work Notice&lt;/em&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/a&gt;&lt;a href=\"https://www.rhoworld.com/wp-content/uploads/spanish_ier_poster_final.pdf\"&gt;&lt;em&gt;Right to Work Notice (Spanish)&lt;/em&gt;&lt;/a&gt;&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/hightouch-customer-success-engineer\"&gt;https://weworkremotely.com/remote-jobs/hightouch-customer-success-engineer&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sun, 16 Aug 2026 07:30:36 +0000</pubDate> <expires_at>Tue, 15 Sep 2026 07:30:36 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/hightouch-customer-success-engineer</guid> <link>https://weworkremotely.com/remote-jobs/hightouch-customer-success-engineer</link> </item> <item> <title>Typeform: Customer Success Manager</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Customer Support</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; United States (Remote) &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;h3&gt;Who we are&lt;/h3&gt; &lt;p&gt;Typeform is a refreshingly different form builder. We help over 150,000 businesses collect the data they need with forms, surveys, and quizzes that people enjoy. Designed to look striking and feel effortless to fill out, Typeform drives 500 million responses every year—and integrates with essential tools like Slack, Zapier, and Hubspot.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;We’re especially excited to hire someone&amp;nbsp;&lt;strong&gt;based in the ET Timezone&lt;/strong&gt;, where we’re looking to grow our presence.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;About the Team&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;The Customer Success Team is focused on helping Enterprise customers explore what’s possible with Typeform. We work with our Enterprise customers throughout their lifecycle to ensure that they are using Typeform to their fullest potential. By proactively engaging our customers in different lifecycle stages, we maintain the role of trusted advisor and work with our Enterprise customers to continue to grow with our tools.&amp;nbsp;&lt;/p&gt; &lt;p&gt;Ultimately, we believe that Typeform can empower our customers to build meaningful relationships with their team members and customers alike. That mindset drives us as we seek to enable mission critical processes for our customers, and maintain a strong core relationship.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;About the Role&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;As a Customer Success Manager, you will be primarily responsible for partnering with Typeform’s Enterprise customers to help them achieve their business goals. You’ll work with new customers who have purchased our Enterprise plan, as well as existing customers that have upgraded, driving activation, continued adoption, retention, and creating lasting partnerships. &lt;br&gt;&lt;br&gt;As a product and customer specialist, you will provide recommendations, identify potential obstacles, and utilize internal tools to proactively identify opportunities for customers to expand their use cases. You will drive results through product training, education, use case exploration, and risk prevention and mitigation, in order to continually improve and impact the customer experience. &lt;br&gt;&lt;br&gt;You’ll be a great fit for this role, if you are curious, creative, enjoy problem solving, helping customers discover new opportunities,analyzing data, and find satisfaction in iterating on and improving processes&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;What you’ll do&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Partner with customers at key moments in their lifecycle to develop an understanding of their needs and coach them on how to use Typeform to reach their desired goals&lt;/li&gt; &lt;li&gt;Introduce new opportunities to expand usage and optimize client experiences&lt;/li&gt; &lt;li&gt;Use internal tools to monitor customer health, usage metrics, and progress&lt;/li&gt; &lt;li&gt;Connect with and assist customers when they fall out of engagement cadences, nurturing usage and mitigating risk in accounts&lt;/li&gt; &lt;li&gt;Identify expansion opportunities and negotiate and close renewals&lt;/li&gt; &lt;li&gt;Deliver account reviews and information around trends to leadership and cross functional teams&lt;/li&gt; &lt;li&gt;Collaborate across teams (Sales, Support, Product, Community, Marketing) to ensure a smooth journey, and deliver impactful feedback to inform content, program, and product development.&lt;br&gt;&lt;br&gt;&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;What you bring&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Proven experience in customer success or a customer relationship management type role with a preference for prior experience working in a SaaS company&lt;/li&gt; &lt;li&gt;Easily builds rapport with customers and team members&lt;/li&gt; &lt;li&gt;A proven track record of expansions and renewals&lt;/li&gt; &lt;li&gt;Process-driven and analytical&lt;/li&gt; &lt;li&gt;Can identify and communicate trends in their book of business&lt;/li&gt; &lt;li&gt;Strong written and verbal communication skills&lt;/li&gt; &lt;li&gt;Ability to breakdown and communicate technical terminology in a non-technical manner&amp;nbsp;&amp;nbsp;&lt;/li&gt; &lt;li&gt;A passion for delivering the quality level of service&lt;/li&gt; &lt;li&gt;Natural curiosity and enthusiasm&lt;/li&gt; &lt;li&gt;A team-focused, collaborative instinct&amp;nbsp;&lt;/li&gt; &lt;li&gt;Flexible, open to change, and a sense of humor never hurts!&lt;/li&gt; &lt;/ul&gt; &lt;h4&gt;&lt;strong&gt;Extra awesome:&lt;/strong&gt;&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;You’re excited about the tools&lt;/li&gt; &lt;li&gt;Time and work management skills to prioritize customer engagements and requests&lt;/li&gt; &lt;li&gt;Previous experience working in a fast-paced organization&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;div class=\"content-pay-transparency\"&gt;&lt;div class=\"pay-input\"&gt;&lt;div class=\"description\"&gt;&lt;div class=\"c-virtual_list__item\"&gt; &lt;div class=\"c-message_kit__background c-message_kit__background--labels c-message_kit__background--labels--later p-message_pane_message__message c-message_kit__message\"&gt; &lt;div class=\"c-message_kit__hover\"&gt; &lt;div class=\"c-message_kit__actions c-message_kit__actions--default\"&gt; &lt;div class=\"p-message_pane_message__message_label c-message_kit__labels c-message_kit__labels--light\"&gt; &lt;div class=\"c-message_kit__gutter\"&gt; &lt;div class=\"c-message_kit__gutter__right\"&gt; &lt;div class=\"c-message_kit__blocks c-message_kit__blocks--rich_text\"&gt; &lt;div class=\"c-message__message_blocks c-message__message_blocks--rich_text\"&gt; &lt;div class=\"p-block_kit_renderer\"&gt; &lt;div class=\"p-block_kit_renderer__block_wrapper p-block_kit_renderer__block_wrapper--first\"&gt; &lt;div class=\"p-rich_text_block\"&gt; &lt;div class=\"p-rich_text_section\"&gt;&lt;em&gt;No one likes a guessing game — that’s why we're transparent about the salary range for this role. In addition to the base, we offer a 5-10% bonus depending on your level and performance. The range is broad because we tailor total compensation based on your location, experience, education, and skillset.&lt;br&gt;We also want to ensure equitable pay across the team and alignment with market data — but let us handle those details. We’re committed to clarity and honesty, so feel free to ask us anything along the way.&lt;/em&gt;&lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt;&lt;/div&gt;&lt;div class=\"title\"&gt;Pay range&lt;/div&gt;&lt;div class=\"pay-range\"&gt;&lt;span&gt;$65,000&lt;/span&gt;&lt;span class=\"divider\"&gt;—&lt;/span&gt;&lt;span&gt;$95,000 USD&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;*Typeform drives hundreds of millions of interactions each year, enabling conversational, human-centered experiences across the globe. We &lt;strong&gt;move as one team&lt;/strong&gt;, empowering our collective efforts by valuing each individual’s unique perspective. This fosters &lt;strong&gt;strong bonds&lt;/strong&gt; grounded in respect, transparency, and trust. We &lt;strong&gt;champion our diverse customer base&lt;/strong&gt; by anticipating their needs and addressing their challenges with priority. Committed to excellence, we&lt;strong&gt; hold high expectations &lt;/strong&gt;for ourselves and each other, continuously striving to deliver exceptional results.&lt;/p&gt; &lt;p&gt;We are proud to be an equal-opportunity employer. We celebrate diversity and stand firmly against discrimination and harassment of any kind—whether based on race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, gender identity or expression, or veteran status. Everyone is welcome here.&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/typeform-customer-success-manager\"&gt;https://weworkremotely.com/remote-jobs/typeform-customer-success-manager&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sun, 16 Aug 2026 07:30:32 +0000</pubDate> <expires_at>Tue, 15 Sep 2026 07:30:32 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/typeform-customer-success-manager</guid> <link>https://weworkremotely.com/remote-jobs/typeform-customer-success-manager</link> </item> <item> <title>Vercel: GRC Analyst</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Front-End Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote - United States &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;h2&gt;About Vercel:&lt;/h2&gt; &lt;p&gt;&lt;span&gt;Vercel is the agentic infrastructure company. We free people and agents to ship what’s next.&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;For more than a decade, Vercel has shaped how the web is built. As the team behind Next.js, v0, and AI SDK, we create products that help builders move from idea to production with speed, security, and exceptional developer experience.&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;Now, software is entering a new era, and the next generation of products will not just be used by people. They will be built, extended, and operated by agents.&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span&gt;We are building the platform for that future, trusted by companies like&amp;nbsp;&lt;strong&gt;OpenAI, PayPal, Ramp, Supreme, and millions of developers worldwide&lt;/strong&gt;. Whether you’re building our products, supporting our customers, growing our community, or shaping our story, you’ll help define what comes next.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;h2&gt;About the role:&lt;/h2&gt; &lt;p&gt;We are looking for a GRC Analyst to join our Governance, Risk &amp;amp; Compliance (GRC) team. You will have the opportunity to manage and maintain ongoing compliance with security and privacy frameworks, policies, procedures, and commercial assessments, including ISO 27001, SOC 2, HIPAA, PCI DSS, and more. Your role will be instrumental in ensuring that our company operates ethically, responsibly, and in accordance with regulatory requirements.&lt;/p&gt; &lt;p&gt;You will collaborate with cross-functional teams to promote a culture of accountability and integrity throughout the organization and foster an environment where everyone understands the importance of adhering to established guidelines and ethical practices. You will report to the Head of GRC and will be located ((remote, onsite, hybrid)).&lt;/p&gt; &lt;p&gt;Think you may not have all the skills and are hesitant to apply? There is no “perfect” candidate and encourage you to apply if you think that you can bring value to our team and are passionate and committed to upholding the highest standards of compliance and ethics.&lt;/p&gt; &lt;p&gt;If you’re based within a pre-determined commuting distance of one of our offices (SF, NY, London, or Berlin), the role includes in-office anchor days on Monday, Tuesday, and Friday, even if the role is listed as remote. For location-specific details, please connect with our recruiting team.&lt;/p&gt; &lt;h2&gt;What you will do:&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Collaborate with internal teams&lt;/strong&gt; to maintain an effective suite of internal controls and driving remediation efforts to completion with clear documentation of progress.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Build strong working relationships&lt;/strong&gt; across the business so compliance accountability is shared and stakeholders are informed.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Streamline annual audits&lt;/strong&gt; by managing audit deliverables, developing treatment plans, and coordinating across teams to document and track completion to ensure audit success.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Monitor and improve controls&lt;/strong&gt;, processes, and evidence management practices, identify opportunities to automate and streamline GRC operations, and contribute to controls maturity scoring and reporting&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Enable go-to-market teams and accelerate deal cycles&lt;/strong&gt; by supporting security questionnaires, addressing compliance inquiries, and maintaining clear, customer-facing documentation on Vercel’s security and compliance posture.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Design and manage company training&lt;/strong&gt; and enhance visibility on compliance-specific topics for internal stakeholders to ensure an understanding of compliance, ethics, and regulatory requirements within the organization.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;About you:&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;At least 3 years of relevant experience in supporting the audit lifecycle in a cloud-centric environment (SOC 2, ISO 27001, PCI, HIPAA, etc.), with strong organizational skills to be flexible and proactive in a high-growth, start-up environment.&lt;/li&gt; &lt;li&gt;Experience collaborating closely with internal partners to seamlessly incorporate policies and technical controls into the SDLC.&lt;/li&gt; &lt;li&gt;Strong project management skills and sense of ownership with the ability to communicate and collaborate effectively, and execute projects across various business units and levels.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Bonus if you have :&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Strong experience with cloud infrastructure (e.g., Azure, AWS)&lt;/li&gt; &lt;li&gt;Familiarity with compliance or software development tools and systems (e.g., Drata, Linear, Datadog, etc.)&lt;/li&gt; &lt;li&gt;Experience with frontend development and open source components&lt;/li&gt; &lt;li&gt;Relevant industry certifications (i.e., CISM, CISSP, CCEP) is a plus, but not required&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;Benefits:&lt;/strong&gt;&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Competitive compensation package, including equity.&lt;/li&gt; &lt;li&gt;Inclusive Healthcare Package.&lt;/li&gt; &lt;li&gt;Learn and Grow - we provide mentorship and send you to events that help you build your network and skills.&lt;/li&gt; &lt;li&gt;Flexible Time Off.&lt;/li&gt; &lt;li&gt;We will provide you the gear you need to do your role, and a WFH budget for you to outfit your space as needed.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;The San Francisco, CA base pay range for this role is $134,000-$202,000. Actual salary will be based on job-related skills, experience, and location. Compensation outside of San Francisco may be adjusted based on employee location. The total compensation package may include benefits, equity-based compensation, and eligibility for a company bonus or variable pay program depending on the role. Your recruiter can share more details during the hiring process.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/vercel-grc-analyst\"&gt;https://weworkremotely.com/remote-jobs/vercel-grc-analyst&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sun, 16 Aug 2026 07:30:32 +0000</pubDate> <expires_at>Tue, 15 Sep 2026 07:30:32 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/vercel-grc-analyst</guid> <link>https://weworkremotely.com/remote-jobs/vercel-grc-analyst</link> </item> <item> <title>OKX: Affiliate BD Manager (Taiwan)</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Front-End Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Taiwan (Remote) &lt;/p&gt; &lt;div class=\"ace-line ace-line old-record-id-doxuseysYUio6Qia64JLLAwE7dh\"&gt; &lt;div&gt; &lt;div class=\"ace-line ace-line old-record-id-doxusaUYeCmu82WSkkm5KDd00db\"&gt; &lt;div&gt; &lt;div class=\"ace-line ace-line old-record-id-OqGZdUPi6oJlXzxlmNiu3gAmsVg\"&gt; &lt;div&gt; &lt;div&gt; &lt;div class=\"ace-line ace-line old-record-id-doxuseysYUio6Qia64JLLAwE7dh\"&gt; &lt;div&gt; &lt;div class=\"ace-line ace-line old-record-id-doxusaUYeCmu82WSkkm5KDd00db\"&gt; &lt;div&gt; &lt;h2&gt;&lt;strong&gt;Who We Are&lt;/strong&gt;&lt;/h2&gt; &lt;div class=\"ace-line ace-line old-record-id-doxustOiFVk8C3Uy4rotl5Nem5f\"&gt; &lt;div&gt; &lt;div class=\"ace-line ace-line old-record-id-Q479dQIlZozY6cxcPNFuoY1rsxe\"&gt; &lt;div&gt; &lt;div class=\"rich-text-paragraph\"&gt; &lt;div class=\"ace-line ace-line old-record-id-Y9usd0Vc5oLuEZxvabeuEyXOsih\"&gt; &lt;div&gt; &lt;div class=\"ace-line ace-line old-record-id-Cfb8dvi9voxFkWxhNcmuJX50sZb\"&gt;At OKX, we believe that the future will be reshaped by crypto, and ultimately contribute to every individual's freedom.&lt;/div&gt; &lt;div class=\"ace-line ace-line old-record-id-Cfb8dvi9voxFkWxhNcmuJX50sZb\"&gt;&amp;nbsp;&lt;/div&gt; &lt;div class=\"ace-line ace-line old-record-id-Cfb8dvi9voxFkWxhNcmuJX50sZb\"&gt;OKX is a leading crypto exchange, and the developer of OKX Wallet, giving millions access to crypto trading and decentralized crypto applications (dApps).&amp;nbsp;OKX is also a trusted brand by hundreds of large institutions seeking access to crypto markets. We are safe and reliable, backed by our Proof of Reserves.&amp;nbsp;&lt;/div&gt; &lt;div class=\"ace-line ace-line old-record-id-Cfb8dvi9voxFkWxhNcmuJX50sZb\"&gt;&amp;nbsp;&lt;/div&gt; &lt;div class=\"ace-line ace-line old-record-id-Cfb8dvi9voxFkWxhNcmuJX50sZb\"&gt;Across our multiple offices globally, we are united by our core principles: &lt;em&gt;We Before Me&lt;/em&gt;, &lt;em&gt;Do the Right Thing&lt;/em&gt;, and &lt;em&gt;Get Things Done&lt;/em&gt;. These shared values drive our culture, shape our processes, and foster a friendly, rewarding, and diverse environment for every OK-er.&lt;/div&gt; &lt;div class=\"ace-line ace-line old-record-id-Cfb8dvi9voxFkWxhNcmuJX50sZb\"&gt;&amp;nbsp;&lt;/div&gt; &lt;div class=\"ace-line ace-line old-record-id-Cfb8dvi9voxFkWxhNcmuJX50sZb\"&gt;OKX is part of OKG, a group that brings the value of Blockchain to users around the world, through our leading products OKX, OKX Wallet, OKLink and more.&lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;h2 class=\"heading-2 ace-line old-record-id-doxus9qcafz8J9vhi3nwZgrckWg\"&gt;&lt;strong&gt;About The Opportunity&lt;/strong&gt;&lt;/h2&gt; &lt;h3 class=\"heading-2 ace-line old-record-id-doxushHxPgvpIV0pJrijghkWDWe\"&gt;&lt;strong&gt;What You’ll Be Doing&amp;nbsp;&lt;/strong&gt;&lt;/h3&gt; &lt;div&gt; &lt;ul&gt; &lt;li&gt;Develop, manage, and optimize affiliate campaigns; Develop new affiliate network and improve the performance of existing affiliates.&lt;/li&gt; &lt;li&gt;Mainly focus on expanding the influencer resources in local market, which could bring trading users and income to the platform.&lt;/li&gt; &lt;li&gt;Devise creative ways to identify potential affiliates.&lt;/li&gt; &lt;li&gt;Optimize the strategy of business develop and plan corresponding actions to ensure the conversion rate.&lt;/li&gt; &lt;li&gt;Analyze user habits and user behavior, and judge the trend of business development.&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;h3 class=\"heading-2 ace-line old-record-id-doxusWnZPeJsdMU53QGew90VQeh\"&gt;&lt;strong&gt;What We Look For In You&amp;nbsp;&lt;/strong&gt;&lt;/h3&gt; &lt;div&gt; &lt;ul&gt; &lt;li&gt;Bachelor degree or above.&lt;/li&gt; &lt;li&gt;3+ years of affiliate marketing/ business development experience in the Cryptocurrency space.&lt;/li&gt; &lt;li&gt;Experience in building large affiliate networks from start to finish.&lt;/li&gt; &lt;li&gt;Experience with analytical tools and reporting such as Google Analytics and Amplitude.&lt;/li&gt; &lt;li&gt;Understanding of fundamental affiliate customer acquisition KPIs and optimization methods to improve performance through data analysis and segmentation.&lt;/li&gt; &lt;li&gt;Fluency in Mandarin.&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;h2&gt;&lt;strong&gt;Perks &amp;amp; Benefits&amp;nbsp;&lt;/strong&gt;&lt;/h2&gt; &lt;ul class=\"list-bullet1\"&gt; &lt;li class=\"ace-line ace-line old-record-id-Gb04dtjtMoHmldxfAjXuI6P4snC\"&gt; &lt;div&gt;Competitive total compensation package&lt;/div&gt; &lt;/li&gt; &lt;li class=\"ace-line ace-line old-record-id-Gb04dtjtMoHmldxfAjXuI6P4snC\"&gt;L&amp;amp;D programs and education subsidy for employees' growth and development&lt;/li&gt; &lt;li class=\"ace-line ace-line old-record-id-doxusfCPfNQIPMLDddcFHLcCJRC\"&gt; &lt;div&gt;Various team building programs and company events&lt;/div&gt; &lt;/li&gt; &lt;li class=\"ace-line ace-line old-record-id-doxusfCPfNQIPMLDddcFHLcCJRC\"&gt;More that we love to tell you along the process!&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt;&lt;div class=\"content-conclusion\"&gt;&lt;div&gt;&lt;span class=\"text-only\"&gt;&lt;span class=\"text-only\"&gt;&lt;span class=\"text-only\"&gt;Notice:&lt;br&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt; &lt;div&gt;&lt;span class=\"text-only\"&gt;&lt;span class=\"text-only\"&gt;All official &lt;/span&gt;&lt;span class=\"text-only text-with-abbreviation text-with-abbreviation-bottomline\"&gt;OKX&lt;/span&gt;&lt;span class=\"text-only\"&gt; vacancies are published on this website.&lt;/span&gt;&lt;/span&gt; &lt;span class=\"text-only\"&gt;&lt;span class=\"text-only\"&gt;While roles may appear on selected third-party platforms from time to time, information on other sites may be inaccurate or outdated. &lt;/span&gt;&lt;/span&gt;&lt;strong&gt;&lt;span class=\"text-only\"&gt;&lt;span class=\"text-only\"&gt;If in doubt, please apply directly through our official careers website.&lt;/span&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/div&gt; &lt;/div&gt; &lt;div&gt;&lt;span class=\"text-only\"&gt;&lt;span class=\"text-only\"&gt;Information collected and processed as part of the recruitment process of any job application you choose to submit is subject to&amp;nbsp;&lt;/span&gt;&lt;span class=\"text-only text-with-abbreviation text-with-abbreviation-bottomline\"&gt;OKX&lt;/span&gt;&lt;span class=\"text-only\"&gt;'s &lt;/span&gt;&lt;/span&gt;&lt;a class=\"link rich-text-anchor __anchor-intercept-flag__ text-content-link\" href=\"https://www.okx.com/en-eu/help/okx-candidate-privacy-notice\"&gt;Candidate Privacy Notice&lt;/a&gt;&lt;span class=\"text-only\"&gt;&lt;span class=\"text-only\"&gt;.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/okx-affiliate-bd-manager-taiwan\"&gt;https://weworkremotely.com/remote-jobs/okx-affiliate-bd-manager-taiwan&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sat, 15 Aug 2026 07:31:27 +0000</pubDate> <expires_at>Mon, 14 Sep 2026 07:31:27 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/okx-affiliate-bd-manager-taiwan</guid> <link>https://weworkremotely.com/remote-jobs/okx-affiliate-bd-manager-taiwan</link> </item> <item> <title>Temporal Technologies: Director, Global Developer Success</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Customer Support</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; United States - Remote Opportunity &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;h3&gt;&lt;strong&gt;About Us&lt;/strong&gt;&lt;/h3&gt; &lt;div&gt;Temporal is an open source programming model that can simplify code, make applications more reliable, and help developers focus on the important things like delivering features faster. We are on a mission to be the reliable foundation of every developer’s toolbox, and are building the team that will make that happen.&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;Our values guide us —they are present in how we show up, make decisions, and work together to make an impact. We’re curious, driven, collaborative, genuine and humble.&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;Temporal is growing and we are looking for those who share our values, challenge 'standard' thinking, and want to influence our future. If you have a passion for improving the developer experience, building world-class open-source software and communities, and want to be a part of our amazing team, we'd love to hear from you!&lt;/div&gt;&lt;/div&gt;&lt;h3&gt;&lt;strong&gt;Summary&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Temporal is hiring a &lt;strong&gt;&lt;span class=\"collapsed-field-text\"&gt;Director, Global Developer Success&lt;/span&gt;&lt;/strong&gt;&amp;nbsp;to lead and scale our deeply technical support organization. This is a high-impact leadership role responsible for turning customer technical response into a repeatable, measurable, and differentiated advantage for Temporal.&lt;/p&gt; &lt;p&gt;Developer Success is the team customers rely on when they need fast, confident support for complex developer and infrastructure issues. The team helps users deploy, operate, debug, and scale Temporal across cloud-native environments, distributed systems, SDKs, observability stacks, and mission-critical workloads. The next phase requires a leader who can preserve technical excellence and customer empathy while building the operational rigor of a world-class support function.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Why this role exists&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Temporal's customers are building increasingly mission-critical, distributed, long-running, and AI-enabled systems. When something is unclear or broken, the support experience must be fast, technically credible, and predictable.&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Developer Success must scale beyond heroics. We need clear KPIs, tiering, queue management, escalation paths, incident communication standards, RCA practices, quality review, and talent development systems.&lt;/li&gt; &lt;li&gt;Premium customer interactions increasingly happen across tickets, Slack, escalations, and incident channels. The support experience must have one clear operating model so customers, Sales, SAs, Platform Architects, Product, Engineering, and Support know who owns what and what good looks like.&lt;/li&gt; &lt;li&gt;The support team must reduce avoidable Engineering escalations while ensuring real product defects, documentation gaps, and recurring customer pain reach Product and Engineering with high-quality signal.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;What you will do&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Build and lead Global Developer Success:&lt;/strong&gt; Hire, coach, develop, retain, and performance-manage high-performing support engineers, managers, and specialists across tiers, regions, and customer segments.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Create the support operating system:&lt;/strong&gt; Define SLAs/OLAs, ticket and Slack triage, queue ownership, severity definitions, tiering, escalation paths, incident communications, RCA standards, quality review, staffing, and operating cadence.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Raise the quality bar:&lt;/strong&gt; Move beyond CSAT alone by measuring customer effort, touches to resolution, reopen rate, handoffs, recurrence, communication quality, resolution confidence, and customer-visible ownership.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Harden Slack and customer response:&lt;/strong&gt; Turn premium Slack response into a defined service model with acknowledgement standards, urgent paths, conversion-to-ticket rules, coverage model, manager review, and customer-facing expectations.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Protect Engineering focus through better support:&lt;/strong&gt; Reduce avoidable escalations by building runbooks, diagnostics, knowledge systems, reproducibility standards, technical triage, and high-quality escalation packets.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Lead escalation and incident discipline:&lt;/strong&gt; Establish crisp roles for technical lead, escalation manager, communications owner, Support, Engineering, SA, Platform Architecture, and Sales. Ensure incidents and critical escalations are communicated with clarity and followed by useful RCAs.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Build technical depth and enablement:&lt;/strong&gt; Create career paths, training, mentorship, certification, quality review, and hands-on learning that help junior engineers become senior/staff support engineers and help senior engineers scale their expertise.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Partner across the company:&lt;/strong&gt; Work closely with Product, Engineering, Sales, Solutions Architecture, Platform Architecture, Customer Success, Docs, DevRel, and Services to ensure support signal turns into product, documentation, enablement, and customer lifecycle improvements.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Use tooling and AI pragmatically:&lt;/strong&gt; Improve routing, deflection, summaries, analytics, knowledge surfacing, diagnostics, and customer communication while measuring real operating outcomes rather than tool adoption alone.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Represent Temporal with customers:&lt;/strong&gt; Engage directly in strategic escalations, high-stakes incidents, enterprise support conversations, QBR/EBR inputs, and executive readouts when support experience affects customer trust.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;What you will bring&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;12+ years of experience in technical support, customer engineering, SRE, solutions engineering, infrastructure engineering, or similar customer-facing technical roles, with 5+ years leading support or customer-facing engineering teams.&lt;/li&gt; &lt;li&gt;Proven experience building and scaling technical support operations for a deeply technical B2B product, ideally in developer tools, cloud infrastructure, data platforms, observability, AI infrastructure, open source, or distributed systems within a GTM organization.&lt;/li&gt; &lt;li&gt;Experience managing managers and building the systems that make teams run: metrics, operating cadence, queue management, quality review, staffing models, tiering, escalation paths, and performance management.&lt;/li&gt; &lt;li&gt;Strong technical credibility with developers, support engineers, SREs, platform engineers, and product engineers. You can reason about APIs/SDKs, cloud-native infrastructure, Kubernetes, observability, distributed systems, reliability, incident response, and debugging workflows.&lt;/li&gt; &lt;li&gt;Track record reducing avoidable Engineering escalations while improving the quality of product and engineering signal when escalations are needed.&lt;/li&gt; &lt;li&gt;Deep understanding of support quality metrics: response time, resolution time, customer effort, touches, reopens, recurrence, backlog, SLA/OLA attainment, deflection, CSAT, sentiment, and case quality.&lt;/li&gt; &lt;li&gt;Strong customer communication skills in high-pressure situations. You can write crisp updates, lead customer-facing RCA conversations, set expectations, and coach others to communicate clearly.&lt;/li&gt; &lt;li&gt;Clear philosophy for hiring, onboarding, leveling, progression, coaching, retention, and performance management for technical support engineers and support managers.&lt;/li&gt; &lt;li&gt;High ownership and builder mindset. You create clarity in ambiguous systems, ship v1 processes quickly, and iterate with data and customer evidence.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;Nice to haves&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Experience with Temporal, Cadence, workflow engines, orchestration systems, event-driven architecture, distributed applications, or production reliability tooling.&lt;/li&gt; &lt;li&gt;Experience in consumption-based, open-source, developer-led, or mission-critical enterprise support motions.&lt;/li&gt; &lt;li&gt;Energized by working within a GTM organization.&lt;/li&gt; &lt;li&gt;Experience with support tooling and modern AI support systems such as Pylon, Zendesk, Kapa-like deflection, knowledge automation, case analytics, or incident communications tooling.&lt;/li&gt; &lt;li&gt;Hands-on background with Kubernetes, Docker, AWS/GCP/Azure, Prometheus/Grafana, Datadog, OpenTelemetry, Terraform, Go, Java, Python, TypeScript, or similar technologies.&lt;/li&gt; &lt;li&gt;Experience building Tier 3 / elite support, OSS/community support, self-hosted support, premium support, or 24/7 critical escalation coverage.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;Compensation&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;The estimated pay range for this role is $220,000 - $270,000 based on experience and location.&amp;nbsp;&lt;/li&gt; &lt;li&gt;Additionally, this role is eligible to participate in Temporal's equity plan.&lt;/li&gt; &lt;/ul&gt;&lt;div class=\"content-conclusion\"&gt;&lt;div&gt;&lt;em&gt;Compensation ranges reflect salary and commission compensation (when applicable) across several geographic markets. Employment offers carefully consider multiple factors, including prior experience, knowledge, expertise, skillset, market location, and job level assessed during the interview process.&lt;/em&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;em&gt;Employee benefits and perks below are for full-time employees, part-time or temporary positions are excluded.&amp;nbsp;&lt;/em&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt; &lt;div&gt;&lt;strong&gt;U.S. Benefits&amp;nbsp;&lt;/strong&gt;&lt;/div&gt; &lt;div&gt; &lt;ul&gt; &lt;li&gt;Unlimited PTO, 12 Holidays + 2 Floating Holidays&lt;/li&gt; &lt;li&gt;100% Premiums Coverage for Medical, Dental, and Vision&lt;/li&gt; &lt;li&gt;AD&amp;amp;D, LT &amp;amp; ST Disability, and Life Insurance (Standard &amp;amp; Supplemental Available)&lt;/li&gt; &lt;li&gt;Empower 401K Plan&lt;/li&gt; &lt;li&gt;Additional Perks for Learning &amp;amp; Development, Lifestyle Spending, Home Office Setup, Professional Memberships, WFH Meals, Internet Stipend and more!&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;/div&gt; &lt;div&gt; &lt;div&gt;&lt;strong&gt;International Benefits&lt;/strong&gt;&lt;/div&gt; &lt;div&gt; &lt;p&gt;Paid Time Off (PTO) and Benefits outside the United States vary by country, and are issued in partnership with &lt;a class=\"postings-link\" href=\"http://remote.com/\"&gt;Remote.com&lt;/a&gt;.&amp;nbsp; Additionally, Temporal offers perks to all international employees for learning &amp;amp; career development, a lifestyle spending account, home office setup, professional memberships, work-from-home meals, and access to the Calm app for mental wellness.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Travel&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Temporal is a globally distributed, collaborative team that values opportunities for in-person connection. Occasional travel may be required for company events, team offsites, and other meaningful moments that bring us together.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;div&gt;&lt;em&gt;Temporal Technologies is an Equal Opportunity Employer. Temporal Technologies does not discriminate on the basis of race, religion, color, sex, gender identity, sexual orientation, age, non-disqualifying physical or mental disability, national origin, veteran status, or any other basis covered by appropriate law. All employment is decided on the basis of qualifications, merit, and business need. We embrace and celebrate differences and diversity.&lt;/em&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;em&gt;Temporal is committed to providing access, equal opportunity, and reasonable accommodation for individuals with disabilities in employment, its services, programs, and activities. If you need to request a reasonable accommodation, please let your Recruiter know so we can assist.&lt;/em&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;em&gt;We are not working with external recruitment agencies, thanks.&lt;/em&gt;&lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/temporal-technologies-director-global-developer-success\"&gt;https://weworkremotely.com/remote-jobs/temporal-technologies-director-global-developer-success&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sat, 15 Aug 2026 07:31:27 +0000</pubDate> <expires_at>Mon, 14 Sep 2026 07:31:27 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/temporal-technologies-director-global-developer-success</guid> <link>https://weworkremotely.com/remote-jobs/temporal-technologies-director-global-developer-success</link> </item> <item> <title>ZoomInfo Technologies LLC: Director, FinOps</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>DevOps and Sysadmin</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Remote &lt;/p&gt; &lt;div class=\"content-intro\"&gt;&lt;p&gt;ZoomInfo is where careers accelerate. We move fast, think boldly, and empower you to do the best work of your life. You’ll be surrounded by teammates who care deeply, challenge each other, and celebrate wins. With tools that amplify your impact and a culture that backs your ambition, you won’t just contribute. You’ll make things happen–fast.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;What You'll do:&lt;/strong&gt;&lt;/p&gt; &lt;ul class=\"ul1\"&gt; &lt;li class=\"li1\"&gt;&lt;strong&gt;Global Cloud Governance:&lt;/strong&gt; Lead the centralized FinOps strategy across an international multi-cloud footprint, focusing heavily on &lt;strong&gt;GCP&lt;/strong&gt; and &lt;strong&gt;AWS&lt;/strong&gt; optimization.&lt;span class=\"s1\"&gt;&lt;strong&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/li&gt; &lt;li class=\"li2\"&gt;&lt;strong&gt;Unit Economics Modeling&lt;/strong&gt;: Design and maintain sophisticated cost-allocation frameworks for all shared cloud resources, translating complex multi-tenant consumption into transparent, actionable product margins&lt;span class=\"s1\"&gt;&lt;strong&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/li&gt; &lt;li class=\"li1\"&gt;&lt;strong&gt;AI Economic Stewardship:&lt;/strong&gt; Manage the financial impact of our AI roadmap. You will oversee current model consumption costs and build the fiscal framework for our transition into building and training custom models.&lt;span class=\"s1\"&gt;&lt;strong&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/li&gt; &lt;li class=\"li2\"&gt;&lt;strong&gt;Forecasting &amp;amp; Tooling Ownership&lt;/strong&gt;: End-to-end management of cloud budgets and third-party hosting licenses, leveraging variance analysis and capacity planning to translate dynamic engineering metrics into predictable, accurate financial forecasts&lt;span class=\"s2\"&gt;&lt;strong&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/li&gt; &lt;li class=\"li1\"&gt;&lt;strong&gt;International Vendor Management:&lt;/strong&gt; Act as the primary lead for global vendor relationships. You will drive enterprise negotiations, contract renewals, and strategic partnerships to maximize value across different international regions.&lt;span class=\"s1\"&gt;&lt;strong&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/li&gt; &lt;li class=\"li1\"&gt;&lt;strong&gt;Strategic Reporting:&lt;/strong&gt; Partner with Finance and Engineering leadership to provide \"Cloud TCO\" visibility, leveraging both industry-standard platforms and custom in-house tooling.&lt;span class=\"s1\"&gt;&lt;strong&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/li&gt; &lt;li class=\"li3\"&gt;&lt;strong&gt;Team Leadership:&lt;/strong&gt; Lead the development of the FinOps team, mentoring and fostering their technical growth and career progression.&lt;span class=\"s1\"&gt;&lt;strong&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;What you bring:&lt;/strong&gt;&lt;/p&gt; &lt;ul class=\"ul1\"&gt; &lt;li class=\"li1\"&gt;&lt;strong&gt;Experience:&lt;/strong&gt; 5+ years in technology operations, procurement, or cloud finance, with at least 2–3 years of experience in a formal people management or leadership role.&lt;/li&gt; &lt;li class=\"li2\"&gt;&lt;strong&gt;FinOps Culture &amp;amp; Change Management&lt;/strong&gt;: Demonstrated ability to bridge the gap between Finance, DevOps/SRE, R&amp;amp;D and Product teams, fostering a cost-conscious engineering culture without bottlenecking innovation or deployment speed.&lt;span class=\"Apple-converted-space\"&gt;&amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp;&lt;/span&gt;&lt;/li&gt; &lt;li class=\"li1\"&gt;&lt;strong&gt;Multi-Cloud Mastery:&lt;/strong&gt; Proven experience with production-grade environments in &lt;strong&gt;GCP and AWS&lt;/strong&gt;, including deep knowledge of billing, commitment models, and discount structures.&lt;span class=\"s1\"&gt;&lt;strong&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/li&gt; &lt;li class=\"li3\"&gt;&lt;strong&gt;Cloud Architecture &amp;amp; Financial Governance&lt;/strong&gt;: Deep technical expertise across modern cloud ecosystems, including Kubernetes resource management, serverless compute, storage lifecycle tiering, and managed databases with a proven ability to translate complex architectural configurations into optimized unit economics.&lt;span class=\"s1\"&gt;&lt;strong&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/li&gt; &lt;li class=\"li1\"&gt;&lt;strong&gt;Global Vendor Relations:&lt;/strong&gt; A track record of operating successfully in a decentralized management structure, negotiating high-value, international contracts with major technology providers.&lt;span class=\"s1\"&gt;&lt;strong&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/li&gt; &lt;li class=\"li4\"&gt;&lt;strong&gt;AI/ML Literacy:&lt;/strong&gt; Familiarity with the cost drivers of AI, from API consumption tokens to the compute-intensive requirements of model training.&lt;/li&gt; &lt;/ul&gt; &lt;p class=\"p1\"&gt;&lt;strong&gt;Abilities Required:&lt;/strong&gt;&lt;/p&gt; &lt;ul class=\"ul1\"&gt; &lt;li class=\"li2\"&gt;&lt;strong&gt;Stakeholder Management:&lt;/strong&gt; Ability to manage expectations and prioritize work across multiple \"customer\" teams and Engineering Managers.&lt;span class=\"s1\"&gt;&lt;strong&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/li&gt; &lt;li class=\"li2\"&gt;&lt;strong&gt;Adaptability:&lt;/strong&gt; Comfortable leading through a broad range of technologies and shifting priorities as we move from AI consumption to model building.&lt;span class=\"s1\"&gt;&lt;strong&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/li&gt; &lt;li class=\"li2\"&gt;&lt;strong&gt;Problem Solving:&lt;/strong&gt; Strong analytical skills with the ability to provide a \"safety net\" during complex architectural shifts or cost anomalies.&lt;span class=\"s1\"&gt;&lt;strong&gt;&lt;em&gt;&lt;br&gt;&lt;/em&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/li&gt; &lt;li class=\"li3\"&gt;&lt;strong&gt;Collaboration:&lt;/strong&gt; Must be able to maintain high-bandwidth communication with global leadership and peers over textual mediums and video conferencing.&lt;/li&gt; &lt;li class=\"li5\"&gt;&lt;span class=\"s2\"&gt;&lt;strong&gt;Communication:&lt;/strong&gt;&lt;span class=\"Apple-converted-space\"&gt;&amp;nbsp; &lt;/span&gt;&lt;/span&gt;Exceptional presentation/leadership skills, concise and fluent communication.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;#LI-RA1&lt;/p&gt; &lt;p&gt;#LI-Onsite&amp;nbsp;&lt;/p&gt;&lt;div class=\"content-pay-transparency\"&gt;&lt;div class=\"pay-input\"&gt;&lt;div class=\"description\"&gt;&lt;p&gt;Actual compensation offered will be based on factors such as the candidate’s work location, qualifications, skills, experience and/or training. Your recruiter can share more information about the specific salary range for your desired work location during the hiring process. We want our employees and their families to thrive.&lt;/p&gt; &lt;p&gt;In addition to comprehensive benefits we offer holistic mind, body and lifestyle programs designed for overall well-being. Learn more about ZoomInfo benefits &lt;a class=\"c-link\" href=\"https://www.zoominfo.com/careers#benefits\"&gt;here&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;div class=\"title\"&gt;Below is the US base salary for this position. Additional compensation such as Bonus, Commission, Equity and other benefits may also apply.&lt;/div&gt;&lt;div class=\"pay-range\"&gt;&lt;span&gt;$155,400&lt;/span&gt;&lt;span class=\"divider\"&gt;—&lt;/span&gt;&lt;span&gt;$244,200 USD&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"content-conclusion\"&gt;&lt;p&gt;&lt;strong&gt;About us:&lt;/strong&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;ZoomInfo (NASDAQ: GTM) is the Go-To-Market Intelligence Platform that empowers businesses to grow faster with AI-ready insights, trusted data, and advanced automation. Its solutions provide more than 35,000 companies worldwide with a complete view of their customers, making every seller their best seller.&lt;/p&gt; &lt;p&gt;ZoomInfo is committed to protecting your privacy when you apply for jobs with us. Please review our Job Applicant &lt;a href=\"https://drive.google.com/file/d/1yiG-k0YX_sW10PiJk_xliDc3W-veJCrK/view?usp=drive_link\"&gt;Privacy Notice&lt;/a&gt; for more details on how we handle your personal information.&lt;/p&gt; &lt;p&gt;ZoomInfo may use a software-based assessment as part of the recruitment process. More information about this tool, including the results of the most recent bias audit, is available &lt;a href=\"https://www.zoominfo.com/legal/nyc-local-law-144-notice\"&gt;here&lt;/a&gt;.&lt;/p&gt; &lt;p&gt;ZoomInfo is proud to be an equal opportunity employer, hiring based on qualifications, merit, and business needs, and does not discriminate based on protected status. We welcome all applicants and are committed to providing equal employment opportunities regardless of sex, race, age, color, national origin, sexual orientation, gender identity, marital status, disability status, religion, protected military or veteran status, medical condition, or any other characteristic protected by applicable law. We also consider qualified candidates with criminal histories in accordance with legal requirements.&lt;/p&gt; &lt;p&gt;For Massachusetts Applicants: It is unlawful in Massachusetts to require or administer a lie detector test as a condition of employment or continued employment. An employer who violates this law shall be subject to criminal penalties and civil liability. ZoomInfo does not administer lie detector tests to applicants in any location.&lt;/p&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/zoominfo-technologies-llc-director-finops\"&gt;https://weworkremotely.com/remote-jobs/zoominfo-technologies-llc-director-finops&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sat, 15 Aug 2026 07:31:21 +0000</pubDate> <expires_at>Mon, 14 Sep 2026 07:31:21 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/zoominfo-technologies-llc-director-finops</guid> <link>https://weworkremotely.com/remote-jobs/zoominfo-technologies-llc-director-finops</link> </item> <item> <title>Fullscript: Senior Product Designer (Clinical Education Platform)</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Design</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Toronto, ON / Austin, TX / Canada Remote / USA Remote &lt;/p&gt; &lt;div class=\"content\"&gt;&lt;div class=\"section-wrapper page-full-width\"&gt;&lt;div class=\"section page-centered\"&gt;&lt;div&gt;&lt;b&gt;&lt;span&gt;About Fullscript&lt;/span&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;We’re an industry-leading health technology company on a mission to help people get better. We started in 2011 with one simple idea. Make it easier for practitioners to access the products they trust so they can deliver better care.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;That simple idea grew into a platform that powers every part of care. Today, more than 125,000 practitioners use Fullscript for clinical insights, lab interpretations, patient analytics, education, and access to high-quality supplements. Over 10 million patients rely on Fullscript to stay connected to their care plans and follow through on treatment.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;We build tools that make care smarter and more human. Tools that save time, simplify decisions, and help practitioners stay closely connected to the people they care for. When everything they need is in one place, they can focus on what matters most: &lt;i&gt;helping people get better.&lt;/i&gt;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;&lt;span&gt;This is your invitation.&lt;/span&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;Bring your ideas, your grit, and your care for people.&lt;/div&gt;&lt;div&gt;Join us and shape the future of care.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Fullscript Academy &lt;/b&gt;is an education platform designed to support healthcare providers in delivering effective whole person care through evidence-based ingredient education and advanced diagnostic training. We deliver education through a variety of formats, including courses, webinars, articles, clinical guides, and in-app resources to support real-time clinical decision-making.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;The Role&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;We’re looking for a &lt;b&gt;Senior Product Designer&lt;/b&gt; to shape the future of clinical education on Fullscript Academy. You are a strong product designer first and foremost, with deep experience in user experience design and a sharp eye for creating beautiful, intuitive interfaces that reduce complexity. You design with a high standard of craft, creating experiences that feel credible, modern, and appropriate for a clinical, professional audience.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;You have experience designing products that support learning, not just usage. You understand how to design for comprehension, retention, motivation, and long-term behavior change, and you know the difference between helping a user complete a task and helping them truly understand something.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"section page-centered\"&gt;&lt;div&gt;&lt;h3&gt;What You’ll Do:&lt;/h3&gt;&lt;ul class=\"posting-requirements plain-list\"&gt;&lt;ul&gt;&lt;li&gt;Support seamless provider journeys across onboarding, content discovery, and course enrollment.&lt;/li&gt;&lt;li&gt;Design experiences that help providers understand and retain clinical knowledge, stay motivated over time, and apply learning with confidence.&lt;/li&gt;&lt;li&gt;Go beyond a single surface by creating the connective tissue between Academy and the broader Fullscript product ecosystem, ensuring context carries across experiences and learning naturally transitions into action.&lt;/li&gt;&lt;li&gt;Lead nimble, iterative UX research and testing to validate ideas, experiment with interaction patterns and information architecture, and refine solutions in a fast-moving environment.&lt;/li&gt;&lt;li&gt;Translate user insights, behavioral data, and product strategy into clear, thoughtful design direction.&lt;/li&gt;&lt;li&gt;Partner closely with Engineering to deliver high-quality, well-documented designs, adapt to technical constraints, and collaboratively refine scope and solutions.&lt;/li&gt;&lt;li&gt;Collaborate with clinicians and content leaders to shape new educational formats, deeply understand learning objectives, and design experiences that reduce complexity while preserving clinical nuance.&lt;/li&gt;&lt;li&gt;Contribute to scalable patterns that maintain clarity, credibility, and consistency across Academy.&lt;/li&gt;&lt;/ul&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"section page-centered\"&gt;&lt;div&gt;&lt;h3&gt;What You Bring:&lt;/h3&gt;&lt;ul class=\"posting-requirements plain-list\"&gt;&lt;ul&gt;&lt;li&gt;Strong product design craft across user experience research, user experience design, and visual design.&lt;/li&gt;&lt;li&gt;Experience designing digital products end to end, from discovery and concept development through stakeholder alignment, prototyping, and developer handoff. &lt;/li&gt;&lt;li&gt;Experience working closely with engineering teams, adapting to technical constraints, refining scope collaboratively, and delivering clear, production-ready design files.&lt;/li&gt;&lt;li&gt;Experience designing for learning, behavior change, or knowledge retention outcomes.&lt;/li&gt;&lt;li&gt;Experience working across connected surfaces or product ecosystems.&lt;/li&gt;&lt;/ul&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"section page-centered\"&gt;&lt;div&gt;&lt;h3&gt;Bonus if you have experience with:&lt;/h3&gt;&lt;ul class=\"posting-requirements plain-list\"&gt;&lt;ul&gt;&lt;li&gt;Professional EdTech platforms&lt;/li&gt;&lt;li&gt;Digital onboarding or academy-style products&lt;/li&gt;&lt;li&gt;Financial education or financial literacy tools&lt;/li&gt;&lt;li&gt;Knowledge or learning-enhancement platforms (e.g., AI note-taking tools)&lt;/li&gt;&lt;li&gt;Healthcare experience is a plus, but not required.&lt;/li&gt;&lt;/ul&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"section page-centered\"&gt;&lt;div&gt;&lt;h3&gt;What we can offer you:&lt;/h3&gt;&lt;ul class=\"posting-requirements plain-list\"&gt;&lt;ul&gt;&lt;li&gt;Generous PTO and competitive pay&amp;nbsp;&lt;/li&gt;&lt;li&gt;Fullscript’s RRSP/401k match program for financial health&amp;nbsp;&lt;/li&gt;&lt;li&gt;Flexible benefits package and workplace wellness program&lt;/li&gt;&lt;li&gt;Training budget and company-wide learning initiatives&amp;nbsp;&lt;/li&gt;&lt;li&gt;Discount on Fullscript catalog of products&amp;nbsp;&lt;/li&gt;&lt;/ul&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"section page-centered\"&gt;&lt;div&gt;&lt;b&gt;Compensation range&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;The salary range for this role is between $115,000 and $145,000 CAD. Fullscript shares salary ranges to support transparency and help candidates make informed decisions. The range shown reflects base salary only and does not include stock options, wellness stipends, or other benefits that are part of Fullscript’s total rewards package.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;Final compensation depends on experience, skills, and location. We review pay regularly to stay aligned with market data and internal equity. Benefits and total rewards may vary by region.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;&lt;b&gt;Why Fullscript&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;Great work happens when people feel supported, trusted, and inspired. At Fullscript, we stay curious and keep finding smarter ways to make care better. We grow together, take on new challenges, and focus on impact. We put people first, work as a team, and leave egos at the door.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;&lt;b&gt;What to Know Before You Apply&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;We’re grateful for the interest in joining Fullscript. To make sure your application reaches our hiring team, please apply directly through our careers page. We’re not able to respond to individual messages about open roles on email or social channels.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;Fullscript is an equal opportunity employer committed to creating an inclusive workplace. Accommodations are available upon request at &lt;a class=\"__cf_email__\" href=\"/cdn-cgi/l/email-protection\"&gt;[email&amp;nbsp;protected]&lt;/a&gt;.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;All offers are contingent on successful background checks conducted in compliance with federal, state, and provincial laws.&lt;/div&gt;&lt;div&gt;We use AI tools to support parts of the hiring process, including screening and reviewing responses. Final hiring decisions are always made by people and follow all applicable privacy and employment laws in Canada and the U.S.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;&lt;b&gt;Learn More&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;a href=\"http://www.fullscript.com/\"&gt;www.fullscript.com&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&lt;a href=\"https://www.instagram.com/fullscripthq/?hl=en\"&gt;@fullscriptHQ&lt;/a&gt; on instagram&lt;/div&gt;&lt;div&gt;&lt;a href=\"https://youtu.be/ebcF2Vz3xf8\"&gt;Let’s make healthcare whole&lt;/a&gt;&amp;nbsp;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=\"section page-centered\"&gt;&lt;div class=\"text-small italic text-gray-700\"&gt;We may use artificial intelligence (AI) tools to support parts of the hiring process, such as reviewing applications, analyzing resumes, or assessing responses. These tools assist our recruitment team but do not replace human judgment. Final hiring decisions are ultimately made by humans. If you would like more information about how your data is processed, please contact us.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/fullscript-senior-product-designer-clinical-education-platform\"&gt;https://weworkremotely.com/remote-jobs/fullscript-senior-product-designer-clinical-education-platform&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Fri, 14 Aug 2026 20:31:04 +0000</pubDate> <expires_at>Sun, 13 Sep 2026 20:31:04 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/fullscript-senior-product-designer-clinical-education-platform</guid> <link>https://weworkremotely.com/remote-jobs/fullscript-senior-product-designer-clinical-education-platform</link> </item> <item> <title>Proxify AB: Senior Ruby on Rails Developer (AI-Augmented Engineering)</title> <region>Anywhere in the World</region> <country></country> <state>Stockholm</state> <skills>Ruby and Ruby on Rails</skills> <category>Back-End Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Sweden &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"http://career.proxify.io\"&gt;http://career.proxify.io&lt;/a&gt; &lt;/p&gt; &lt;div&gt; &lt;h3&gt;&lt;strong&gt;The Role:&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;We are seeking a Senior Ruby on Rails Developer who treats software engineering as an art form and a discipline. In this role, you will lead the development and scaling of highly responsive, business-critical web applications. You won't just build features; you will optimize system architectures, manage complex domain models, and champion engineering practices that keep codebases sustainable over long lifecycles.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;We look for developers who understand the core principles of software craftsmanship and can leverage modern technologies—like AI development workflows—to compress delivery timelines without compromising code quality. If you are an active contributor to the broader tech community and are obsessed with writing clean, expressive Ruby, you will thrive here.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;h4&gt;&lt;strong&gt;What we are looking for:&lt;/strong&gt;&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;5+ years of production experience writing object-oriented Ruby and scaling robust Rails applications.&lt;/li&gt; &lt;li&gt;Strong command over architectural patterns, domain-driven design, data modeling, concurrency, caching strategies, and API security protocols. You value automated testing (RSpec/Minitest) as a critical design tool.&lt;/li&gt; &lt;li&gt;Proven ability to integrate AI development tools (such as GitHub Copilot, Cursor, or specialized LLM agents) into your daily engineering workflow. We value engineers who use AI to accelerate boilerplate writing, refactoring, and test generation, while maintaining the critical eye needed to debug and validate the outputs.&lt;/li&gt; &lt;li&gt;A history of interacting with or contributing directly to the open-source community—whether that means maintaining custom gems, submitting PRs to public repositories, or actively contributing to the Rails ecosystem.&lt;/li&gt; &lt;li&gt;Hands-on experience optimizing PostgreSQL databases, managing background processing via Sidekiq, and deploying containers with Docker into cloud native environments (AWS/GCP/Heroku).&lt;/li&gt; &lt;li&gt;Located in CET timezone (+/- 3 hours), we are unable to consider applications from candidates in other time zones.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;h4&gt;&lt;strong&gt;Responsibilities:&lt;/strong&gt;&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;Design and maintain modular, testable, and highly performant backend architectures that support complex business domains.&lt;/li&gt; &lt;li&gt;Pioneer the adoption of AI-assisted coding practices within the team, demonstrating how to use modern generative tools to double execution speed safely.&lt;/li&gt; &lt;li&gt;Identify and eliminate N+1 queries, tune database indexes, and optimize memory consumption to ensure low-latency application responses.&lt;/li&gt; &lt;li&gt;Conduct meaningful code reviews that elevate the team's engineering bar, ensuring adherence to the Ruby Style Guide and SOLID design principles.&lt;/li&gt; &lt;li&gt;Bring public open-source best practices into our private repositories, keeping our internal tools modern, secure, and maintainable.&lt;/li&gt; &lt;/ul&gt; &lt;strong&gt;&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;h4&gt;&lt;strong&gt;What we offer:&lt;/strong&gt;&lt;/h4&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;Get paid, not played&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;No more unreliable clients. Enjoy on-time monthly payments with flexible withdrawal options.&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;Predictable project hours&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;Enjoy a harmonious work-life balance with consistent 8-hour working days with clients.&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;Flex days, so you can recharge&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;Enjoy up to 24 flex days off per year without losing pay, for full-time positions found through Proxify.&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;Career-accelerating positions at cutting-edge companies&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;Discover exclusive long-term remote positions at the world's most exciting companies.&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;Hand-picked opportunities, just for you&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;Skip the typical recruitment roadblocks and biases with personally matched positions.&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;One seamless process, multiple opportunities&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;A one-time contracting process for endless opportunities, with no extra assessments.&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;Compensation&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;Enjoy the same pay, every month with positions landed through Proxify.&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/proxify-ab-senior-ruby-on-rails-developer-ai-augmented-engineering\"&gt;https://weworkremotely.com/remote-jobs/proxify-ab-senior-ruby-on-rails-developer-ai-augmented-engineering&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Fri, 14 Aug 2026 10:13:03 +0000</pubDate> <expires_at>Sun, 13 Sep 2026 10:13:03 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/proxify-ab-senior-ruby-on-rails-developer-ai-augmented-engineering</guid> <link>https://weworkremotely.com/remote-jobs/proxify-ab-senior-ruby-on-rails-developer-ai-augmented-engineering</link> </item> <item> <title>Proxify AB: Senior Backend Developer (Python)</title> <region>Anywhere in the World</region> <country></country> <state>Stockholm</state> <skills>Django and Python</skills> <category>Back-End Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Sweden &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"http://career.proxify.io\"&gt;http://career.proxify.io&lt;/a&gt; &lt;/p&gt; &lt;h3&gt;&lt;strong&gt;The Role:&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;We are looking for a Senior Python Developer for one of our clients. You are a perfect candidate if you are growth-oriented, you love what you do, and you enjoy working on new ideas to develop exciting products.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;h4&gt;&lt;strong&gt;What we are looking for:&lt;/strong&gt;&lt;/h4&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;5+ years of experience building products with Python and Django.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;High proficiency in SQL with experience using databases like PostgreSQL.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience scaling cloud infrastructures with Docker or Kubernetes is a plus.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience managing cloud infrastructures, specifically AWS or GCP.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You follow the best practices and conventions.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Relevant experience in CI/CD and related tools.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Ability to work with minimal supervision.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Intermediate-advanced English level.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;You can communicate well with both technical and non-technical clients.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Time zone: CET (+/- 3 hours). We are unable to consider applications from candidates in other time zones.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Responsibilities:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Ability to build libraries and frameworks of reusable efficient code.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Competence in designing and implementing low-latency, stable and performing applications.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Capacity to effectively collaborate with other team members and stakeholders remotely.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Ability to implement data protection systems.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Competence in data storage solutions.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;h4&gt;&lt;strong&gt;What we offer:&lt;br&gt;&lt;/strong&gt;&lt;/h4&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;Get paid, not played&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;No more unreliable clients. Enjoy on-time monthly payments with flexible withdrawal options.&lt;br&gt;&lt;br&gt;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;&lt;br&gt;Predictable project hours&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;Enjoy a harmonious work-life balance with consistent 8-hour working days with clients.&lt;br&gt;&lt;br&gt;&lt;/div&gt; &lt;div&gt;&lt;br&gt;&lt;strong&gt;Flex days, so you can recharge&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;Enjoy up to 24 flex days off per year without losing pay, for full-time positions found through Proxify.&lt;br&gt;&lt;br&gt;&lt;/div&gt; &lt;div&gt;&lt;br&gt;&lt;strong&gt;Career-accelerating positions at cutting-edge companies&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;Discover exclusive long-term remote positions at the world's most exciting companies.&lt;br&gt;&lt;br&gt;&lt;/div&gt; &lt;div&gt;&lt;br&gt;&lt;strong&gt;Hand-picked opportunities just for you&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;Skip the typical recruitment roadblocks and biases with personally matched positions.&lt;br&gt;&lt;br&gt;&lt;/div&gt; &lt;div&gt;&lt;br&gt;&lt;strong&gt;One seamless process, multiple opportunities&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;A one-time contracting process for endless opportunities, with no extra assessments.&lt;br&gt;&lt;br&gt;&lt;/div&gt; &lt;div&gt;&lt;br&gt;&lt;strong&gt;Compensation&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;Enjoy the same pay, every month with positions landed through Proxify.&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/proxify-ab-senior-backend-developer-python-9\"&gt;https://weworkremotely.com/remote-jobs/proxify-ab-senior-backend-developer-python-9&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Fri, 14 Aug 2026 10:07:01 +0000</pubDate> <expires_at>Sun, 13 Sep 2026 10:07:01 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/proxify-ab-senior-backend-developer-python-9</guid> <link>https://weworkremotely.com/remote-jobs/proxify-ab-senior-backend-developer-python-9</link> </item> <item> <title>Mercury: Counsel, Product &amp; Regulatory - Payments &amp; AML</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills></skills> <category>Back-End Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; San Francisco, CA, New York, NY, Portland, OR, or Remote within Canada or United States &lt;/p&gt; &lt;p&gt;In 1905, chief engineer John Stevens inherited one of the most ambitious infrastructure projects in history: the Panama Canal.&lt;/p&gt; &lt;p&gt;The challenge wasn’t digging a ditch between two oceans. It was figuring out how to move ships safely through a system of locks, gates, reservoirs, and changing conditions without bringing global commerce to a halt.&lt;/p&gt; &lt;p&gt;The solution wasn’t to stop movement. It was to create a framework that allowed movement at scale.&lt;/p&gt; &lt;p&gt;Modern financial infrastructure presents a similar challenge. Payment systems, banking products, compliance obligations, and regulatory frameworks all exist for a reason. The goal isn’t to eliminate complexity. It’s to build systems that allow innovation, growth, and customer value within it.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Who we are&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Since 2019, Mercury has been on a mission to reinvent banking‡ for the modern age. We blend elegant design and cutting-edge technology to offer checking and savings accounts, debit cards, payment services, credit products, cash management tools, and sophisticated analytics. Everything we build reflects our belief that financial products should be thoughtfully crafted, fast, transparent, and genuinely enjoyable to use.&lt;/p&gt; &lt;p&gt;As we continue expanding and iterating on our product offerings and as we work to build a nationally chartered bank, we’re looking for a Counsel, Product &amp;amp; Regulatory (Payments &amp;amp; AML) to help us navigate increasingly complex questions at the intersection of product, regulation, and financial infrastructure.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;About the team&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Our Product &amp;amp; Regulatory Legal team operates like the rest of Mercury: with urgency, curiosity, and a bias toward action.&lt;/p&gt; &lt;p&gt;We embed with product teams from early ideation through launch, working alongside engineers, designers, compliance partners, operations teams, and risk stakeholders to get products right. We move fast, we take ownership, and we don’t wait to be asked. If something needs figuring out, we’re up to the task.&lt;/p&gt; &lt;p&gt;We are not a team that sits on the sidelines reviewing finished proposals. We work alongside our partners to identify risks, unlock opportunities, and find practical paths forward. We care deeply about good judgment, strong relationships, and building frameworks that scale.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;What you’ll do&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Advise on payments products and infrastructure.&lt;/strong&gt; You’ll support a broad portfolio of payments-related initiatives across Mercury. You’ll advise on matters involving payment rails, product launches, operational incidents, partner relationships, and customer-facing experiences. You’ll help product teams navigate regulatory complexity while continuing to build exceptional products.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Partner across the company.&lt;/strong&gt;&lt;strong&gt; &lt;/strong&gt;This role sits at the intersection of Product, Compliance, Risk, Engineering, Operations, Partnerships, and Legal. You’ll build trusted relationships across these functions and bring legal perspective into conversations early, not as a checkpoint, but as a low-ego, high-ownership thought partner.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Help launch new capabilities.&lt;/strong&gt; Mercury is continuing to expand its product offerings while building a nationally chartered bank. You’ll support new payment capabilities (like Zelle) from early exploration through launch, helping teams identify risks, evaluate options, and make sound decisions in ambiguous environments.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Support financial crimes initiatives.&lt;/strong&gt; You’ll work closely with Mercury’s AML Advisory, Sanctions, Compliance, and Risk teams on matters involving financial crimes compliance. You’ll help interpret requirements, evaluate new initiatives, and develop practical guidance that enables teams to move efficiently while maintaining an appropriate risk posture.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Build scalable guidance.&lt;/strong&gt; The best legal advice solves more than the question in front of you. You’ll help create frameworks and guidance that improve consistency, reduce friction, and allow the organization to make better decisions over time.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Use AI intentionally.&lt;/strong&gt; Bring a working knowledge of AI tools in legal workflows and a genuine interest in finding new ways to drive efficiency. We’re building a legal team that works smarter, not just harder.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Stay curious and adaptable.&lt;/strong&gt; The regulatory and product landscape continues to evolve quickly. New payment rails emerge. Regulatory expectations shift. Business priorities change. You’ll embrace that complexity and continue learning alongside it.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;What you should have&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;4+ years of legal experience.&lt;/li&gt; &lt;li&gt;Active license to practice law in at least one U.S. jurisdiction.&lt;/li&gt; &lt;li&gt;Experience supporting fintechs, banks, payment companies, sponsor-bank programs, payment networks, BaaS providers, or regulators with substantial payments- or AML-related exposure.&lt;/li&gt; &lt;li&gt;Strong working knowledge of payments-related regulatory frameworks, and an interest in emerging areas like stablecoins.&amp;nbsp;&lt;/li&gt; &lt;li&gt;Familiarity with BSA/AML and sanctions requirements.&lt;/li&gt; &lt;li&gt;Exceptional communication skills. You know your audience and tailor accordingly.&lt;/li&gt; &lt;li&gt;Strong judgment and comfort operating in ambiguous environments.&lt;/li&gt; &lt;li&gt;A proactive sense of ownership. You’re comfortable saying, “I don’t know yet, but I’ll find out.”&lt;/li&gt; &lt;li&gt;Genuine curiosity about financial products, financial infrastructure, and the evolving regulatory landscape.&lt;/li&gt; &lt;li&gt;Strong working knowledge of AI use cases within legal roles and/or financial services generally and genuine interest in using AI to drive efficiency in your work.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;What will make you successful here&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Mercury is a place where lawyers are expected to have a point of view. Not just about what a regulation requires, but about how a product can meet that requirement in a way that’s thoughtful, scalable, and good for customers.&lt;/p&gt; &lt;p&gt;The people who thrive on this team treat ambiguity as an invitation rather than a reason to pause. They read a regulation and think about what it permits, not just what it prohibits. They understand that legal advice is most valuable when it helps the business make a decision, not when it simply identifies a risk.&lt;/p&gt; &lt;p&gt;You’ll also spend a meaningful amount of your time on work that may not look like traditional legal practice: helping scope cross-functional projects, pressure-testing product designs, navigating operational questions, and building processes alongside compliance and operational partners.&lt;/p&gt; &lt;p&gt;If you’re energized by that kind of work, and if you measure your impact by whether the product, process, or customer experience got better—not just whether the memo was technically correct—you’ll do well here.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Why this role&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;This is an opportunity to join Mercury during a uniquely consequential period of growth.&lt;/p&gt; &lt;p&gt;You’ll help support existing products while contributing to the development of new capabilities as Mercury builds a nationally chartered bank. You’ll work alongside experienced legal, compliance, product, and banking professionals, gain exposure to a wide range of regulatory and product questions, and have meaningful ownership early in your career. You’ll also help shape how Mercury approaches payments and financial crimes legal support for years to come.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;The total rewards package at Mercury includes base salary, equity (stock options), and benefits.&lt;/p&gt; &lt;p&gt;Our salary and equity ranges are highly competitive within the SaaS and fintech industry and are updated regularly using the most reliable compensation survey data for our industry. New hire offers are made based on a candidate’s experience, expertise, geographic location, and internal pay equity relative to peers.&lt;/p&gt; &lt;p&gt;Our target new hire base salary ranges for this role are the following:&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;em&gt;US employees in New York City, Los Angeles, Seattle, or the San Francisco Bay Area: $186,400 - $209,700&lt;/em&gt;&lt;/li&gt; &lt;li&gt;&lt;em&gt;US employees outside of the New York City, Los Angeles, Seattle, or the San Francisco Bay Area: $167,800 - $188,700&lt;/em&gt;&lt;/li&gt; &lt;li&gt;&lt;em&gt;Canadian employees (any location): $176,100 - $198,200 CAD&lt;/em&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;em&gt;While we’ve received conditional approval to become a bank, Mercury today is a fintech company, not an FDIC-insured bank. Banking services provided through Choice Financial Group and Column N.A., Members FDIC. Investment advisory products and services offered by Mercury Advisory, LLC (\"MA\"), an SEC-registered investment adviser. MA is a wholly-owned subsidiary of Mercury Technologies, Inc..&lt;/em&gt;&lt;/p&gt; &lt;p&gt;Mercury values diversity &amp;amp; belonging and is proud to be an Equal Employment Opportunity employer. All individuals seeking employment at Mercury are considered without regard to race, color, religion, national origin, age, sex, marital status, ancestry, physical or mental disability, veteran status, gender identity, sexual orientation, or any other legally protected characteristic. We are committed to providing reasonable accommodations throughout the recruitment process for applicants with disabilities or special needs. If you need assistance, or an accommodation, please let your recruiter know once you are contacted about a role.&lt;/p&gt; &lt;p&gt;&lt;span&gt;#LI-JD1&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/mercury-counsel-product-regulatory-payments-aml\"&gt;https://weworkremotely.com/remote-jobs/mercury-counsel-product-regulatory-payments-aml&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 12 Aug 2026 07:30:59 +0000</pubDate> <expires_at>Fri, 11 Sep 2026 07:30:59 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/mercury-counsel-product-regulatory-payments-aml</guid> <link>https://weworkremotely.com/remote-jobs/mercury-counsel-product-regulatory-payments-aml</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0171/6136/logo.gif\" type=\"image/png\"/> <title>Lemon.io: Senior AI Engineer</title> <region>Anywhere in the World</region> <country>🇦🇩 Andorra, 🇦🇱 Albania, 🇦🇷 Argentina, 🇦🇹 Austria, 🇦🇺 Australia, 🇧🇦 Bosnia and Herzegovina, 🇧🇪 Belgium, 🇧🇬 Bulgaria, 🇧🇴 Bolivia (Plurinational State of), 🇧🇷 Brazil, 🇧🇿 Belize, 🇨🇦 Canada, 🇨🇭 Switzerland, 🇨🇱 Chile, 🇨🇴 Colombia, 🇨🇷 Costa Rica, 🇨🇾 Cyprus, 🇨🇿 Czechia, 🇩🇪 Germany, 🇩🇰 Denmark, 🇩🇴 Dominican Republic, 🇪🇨 Ecuador, 🇪🇪 Estonia, 🇪🇸 Spain, 🇫🇮 Finland, 🇫🇷 France, 🇬🇧 United Kingdom of Great Britain and Northern Ireland, 🇬🇷 Greece, 🇬🇹 Guatemala, 🇭🇳 Honduras, 🇭🇷 Croatia, 🇭🇹 Haiti, 🇭🇺 Hungary, 🇮🇩 Indonesia, 🇮🇪 Ireland, 🇮🇱 Israel, 🇮🇹 Italy, 🇯🇲 Jamaica, 🇯🇵 Japan, 🇰🇷 Korea (Republic of), 🇱🇹 Lithuania, 🇱🇺 Luxembourg, 🇱🇻 Latvia, 🇲🇦 Morocco, 🇲🇩 Moldova (Republic of), 🇲🇪 Montenegro, 🇲🇰 North Macedonia, 🇲🇹 Malta, 🇲🇽 Mexico, 🇲🇾 Malaysia, 🇳🇱 Netherlands, 🇳🇴 Norway, 🇳🇿 New Zealand, 🇵🇦 Panama, 🇵🇪 Peru, 🇵🇬 Papua New Guinea, 🇵🇭 Philippines, 🇵🇱 Poland, 🇵🇷 Puerto Rico, 🇵🇹 Portugal, 🇵🇾 Paraguay, 🇷🇴 Romania, 🇸🇪 Sweden, 🇸🇬 Singapore, 🇸🇮 Slovenia, 🇸🇰 Slovakia, 🇸🇻 El Salvador, 🇹🇭 Thailand, 🇺🇦 Ukraine, 🇺🇸 United States of America, 🇺🇾 Uruguay, 🇻🇳 Viet Nam, and 🇿🇦 South Africa</country> <state>Delaware</state> <skills>Python, SQL, Artificial Intelligence (AI), Large Language Models (LLMs), API Integration, OpenAI, and AI Agents</skills> <category>Back-End Programming</category> <type>Full-Time</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0171/6136/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; New York, NY &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://lemon.io\"&gt;https://lemon.io&lt;/a&gt; &lt;/p&gt; &lt;p&gt;Are you a talented Senior AI Engineer/Architect looking for a remote job that lets you show your skills and get decent compensation? Look no further than &lt;a href=\"https://lemon.io/for-developers/?utm_source=weworkremotely&amp;amp;utm_medium=job_ad&amp;amp;utm_campaign=supply_en_ai_engineer_agent/architect_jul_2026_job_ad\"&gt;Lemon.io&lt;/a&gt; — the marketplace that connects you with hand-picked startups in the US and Europe.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What we offer:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;The rate depends on your skills and experience. We've already paid out over $11M to our engineers.&lt;/li&gt; &lt;li&gt;No more hunting for clients or negotiating rates — let us handle the business side of things so you can focus on what you do best.&lt;/li&gt; &lt;li&gt;We'll manually find the best project for you according to your skills and preferences.&lt;/li&gt; &lt;li&gt;Choose a schedule that works best for you. It’s possible to communicate async or minimally overlap within team working hours.&lt;/li&gt; &lt;li&gt;We respect your seniority so you can expect no micromanagement or screen trackers.&lt;/li&gt; &lt;li&gt;Communicate directly with the clients. Most of them have technical backgrounds. Sounds good, yeah?&lt;/li&gt; &lt;li&gt;We will support you from the time you submit the application throughout all cooperation stages.&lt;/li&gt; &lt;li&gt;Most of our projects involve working in a fast-paced startup environment. We hope you like it as much as we do.&lt;/li&gt; &lt;li&gt;Through our community, we will connect you with the best developers from more than 75 countries.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;We have several AI-related roles; here are some of them.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Requirements - AI Engineer:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;3+ years of commercial experience applying AI to practical technology solutions&lt;/li&gt; &lt;li&gt;A solid understanding of Python is a must; experience with other programming languages commonly used in AI is a plus&lt;/li&gt; &lt;li&gt;Experience with Vector Databases, Pinecone or Weaviate is required&lt;/li&gt; &lt;li&gt;2+ years of experience with LangChain is mandatory&lt;/li&gt; &lt;li&gt;2+ years of experience with large language models (LLMs) or vLLMs is mandatory&lt;/li&gt; &lt;li&gt;2+ years of experience with RAG or OpenAI is required&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Requirements - AI Agent Architect:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;3+ years of experience with Python&lt;/li&gt; &lt;li&gt;3+ years of experience with LLM&lt;/li&gt; &lt;li&gt;Experience with Multi-agent systems architecture, AI agent orchestration, AI telemetry is a must.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Requirements - AI Automation Architect:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;1+ year of experience with Workflow Automation and Webhooks&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;3+ years with SQL is a must&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Familiarity with AI API integration and Claude Cowork is a must&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Knowledge of Make.com/n8n/Zapier&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Strong technical skills: as a Senior AI Engineer/Architect, you are expected to be able to create projects from scratch and have a deep understanding of application architecture.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Clear and effective communication in English — advanced ability to discuss business tasks, justify decisions, and communicate issues. Good self-presentation is also essential for upcoming client calls.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Strong self-organizational skills — ability to work full-time remotely with no supervision.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Reliability — we want to trust you and expect that you won’t let us and the client down.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Adaptability and Flexibility — the ability to onboard the project promptly after accepting it and start delivering results quickly.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Sounds good for you? Apply now and join the &lt;a href=\"https://lemon.io/for-developers/?utm_source=weworkremotely&amp;amp;utm_medium=job_ad&amp;amp;utm_campaign=supply_en_ai_engineer_agent/architect_jul_2026_job_ad\"&gt;Lemon.io&lt;/a&gt; community!&lt;/p&gt; &lt;p&gt;&lt;strong&gt;NOT YOUR TECH STACK?&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;We have a variety of projects, so if you have 4+ years of commercial software development experience and are proficient in Site Reliability Engineering, Platform Engineering, React &amp;amp; Python, React &amp;amp; Golang, Golang, React &amp;amp; Java, React &amp;amp; Ruby, Ruby, PHP &amp;amp; Vue, Vue &amp;amp; Node.js, React &amp;amp; .NET, Android &amp;amp; iOS, iOS &amp;amp; Swift, Flutter &amp;amp; Dart, Blockchain (Ethereum/Ethers.js/Wagmi/Viem/Solana), Angular &amp;amp; Node.js, Vue &amp;amp; .NET, Python &amp;amp; Vue, DevOps, MLOps, Data Science, Angular &amp;amp; PHP, Angular &amp;amp; .NET, Symfony &amp;amp; React, Symfony &amp;amp; Vue, Symfony &amp;amp; Angular, Python, Symfony &amp;amp; JavaScript &amp;amp; Next.js &amp;amp; TypeScript, Data Analysis, React &amp;amp; PHP, Data Engineering, Project Management, Product Management, QA Automation, QA Manual, Embedded Software Engineering, React Native &amp;amp; Node, React Native &amp;amp; React, React Native &amp;amp; Ruby, React Native &amp;amp; Python, WordPress, Android, Data Annotation, Angular, Python &amp;amp; Node, React &amp;amp; Node.js, Java &amp;amp; Spring, Svelte &amp;amp; Python, Svelte &amp;amp; Node.js, Svelte &amp;amp; TypeScript, Rust, Shopify &amp;amp; JavaScript, Vue &amp;amp; Nuxt, PHP &amp;amp; Laravel, UI/UX Design, Animation, Graphic Design, React &amp;amp; Node &amp;amp; React Native, .NET &amp;amp; C#, Electron, Scala, C++, Unreal Engine &amp;amp; C++, Python &amp;amp; LLM, Unity, or Machine Learning Engineering, we would be happy to connect with you and match you with a project that fits your experience.&lt;/p&gt; &lt;p&gt;We work with developers from 75+ countries across Europe, Latin America, North America (the U.S. and Canada), selected countries in Asia (Japan, Singapore, South Korea, the Philippines, Indonesia, Malaysia, Vietnam, Thailand, and Israel), Oceania (Australia, New Zealand, and Papua New Guinea), and Africa (including Morocco and South Africa).&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/lemon-io-senior-ai-engineer-4\"&gt;https://weworkremotely.com/remote-jobs/lemon-io-senior-ai-engineer-4&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 05 Aug 2026 08:23:41 +0000</pubDate> <expires_at>Fri, 04 Sep 2026 08:23:41 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/lemon-io-senior-ai-engineer-4</guid> <link>https://weworkremotely.com/remote-jobs/lemon-io-senior-ai-engineer-4</link> </item> <item> <title>thehivecareers.co: Web Developer (Remote)</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills>Cross-Browser Development and Cross-Selling</skills> <category>Front-End Programming</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Bridgetown, Saint Michael, Barbados &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"http://thehivecareers.co\"&gt;http://thehivecareers.co&lt;/a&gt; &lt;/p&gt; &lt;div class=\"mt-5\"&gt; &lt;div class=\"redactor-styles\"&gt; &lt;p&gt;&lt;strong&gt;Job Description:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Title:&amp;nbsp;&lt;/strong&gt;Web Developer&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Job Level:&lt;/strong&gt; Full-Time/Remote&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Location:&lt;/strong&gt; Barbados&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Position Overview:&lt;/strong&gt; We are seeking an experienced and motivated C# Web Developer with 5+ years of professional experience to join our dynamic development team. The ideal candidate will be responsible for designing, developing, and maintaining robust web applications while collaborating closely with cross-functional teams. A strong proficiency in C#, ASP.NET, and related technologies is essential, along with a proven track record of delivering scalable and high-performing web solutions.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Key Skills:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt;&lt;li&gt;Strong problem-solving and analytical skills.&lt;/li&gt;&lt;li&gt;Excellent written and verbal communication abilities.&lt;/li&gt;&lt;li&gt;Excellent UX design.&lt;/li&gt;&lt;li&gt;Ability to work both independently and as part of a collaborative team.&lt;/li&gt;&lt;li&gt;Attention to detail and commitment to delivering high-quality code.&lt;/li&gt;&lt;li&gt;Banking experience is an asset.&lt;/li&gt;&lt;/ul&gt; &lt;/div&gt; &lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/thehivecareers-co-web-developer-remote-1\"&gt;https://weworkremotely.com/remote-jobs/thehivecareers-co-web-developer-remote-1&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Tue, 04 Aug 2026 22:13:00 +0000</pubDate> <expires_at>Thu, 03 Sep 2026 22:13:00 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/thehivecareers-co-web-developer-remote-1</guid> <link>https://weworkremotely.com/remote-jobs/thehivecareers-co-web-developer-remote-1</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0171/6131/logo.gif\" type=\"image/png\"/> <title>Charles Technology Africa: Web Developer</title> <region>Remote</region> <country></country> <state></state> <skills>Adobe Photoshop, CMS Development, Cross-Browser Development, Estimating and Cost Forecasting, InfoSec, iOS, Cross-Selling, Deal Closure, Composition, and Jetpack Compose</skills> <category>Front-End Programming</category> <type>Full-Time</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0171/6131/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Accra, Remote, Ghana &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"http://meisterpiece.com\"&gt;http://meisterpiece.com&lt;/a&gt; &lt;/p&gt; &lt;p&gt;&lt;strong&gt;JOB DESCRIPTION&lt;/strong&gt;&lt;br&gt;&lt;br&gt;Charles Technology Africa seeks to hire a Web Developer to independently design, develop, and maintain both external and internal Websites and applications that leverage the WordPress Content management system.&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Minimum Qualifications Required:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Strong HTML, CSS, PHP and Java Script skills&lt;/p&gt;&lt;p&gt;Expert level Wordpress experience and capabilities&lt;/p&gt;&lt;p&gt;Ability to integrate WP websites with other applications&lt;/p&gt;&lt;p&gt;Experience with Cpanel or other managed hosting platforms&lt;/p&gt;&lt;p&gt;Proficiency with client-side scripting and JavaScript frameworks&lt;/p&gt;&lt;p&gt;Working knowledge of Apache, Linux Ubuntu, MySQL&lt;/p&gt;&lt;p&gt;Understanding of web accessibility&lt;/p&gt;&lt;p&gt;Ability to work well in a team structure&lt;/p&gt;&lt;p&gt;A passion for quality design and a drive for innovation&lt;/p&gt;&lt;p&gt;Ability to take a concept from sketch or wireframe to final implementation&lt;/p&gt;&lt;p&gt;Strong oral and written communication skills&lt;/p&gt;&lt;p&gt;Multitasking and problem-solving skills&lt;/p&gt;&lt;p&gt;Analytical, organized and proactive attitude&lt;/p&gt;&lt;p&gt;Ability to work under tight deadlines and switch quickly and comfortably between projects as determined by supervisor, clients or other circumstances&lt;/p&gt;&lt;p&gt;Experience developing custom WP themes and plugins a plus&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/charles-technology-africa-web-developer\"&gt;https://weworkremotely.com/remote-jobs/charles-technology-africa-web-developer&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Tue, 04 Aug 2026 22:13:00 +0000</pubDate> <expires_at>Thu, 03 Sep 2026 22:13:00 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/charles-technology-africa-web-developer</guid> <link>https://weworkremotely.com/remote-jobs/charles-technology-africa-web-developer</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0171/5998/logo.gif\" type=\"image/png\"/> <title>Zapiet: Head of Marketing</title> <region>Anywhere in the World</region> <country></country> <state>Lincolnshire</state> <skills>Digital Marketing, Email Marketing and Automation, Influencer Marketing, Marketing, Marketing Automation, Marketing Management, Product Marketing, Social Media Marketing, and SaaS</skills> <category>Management and Finance</category> <type>Full-Time</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0171/5998/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; UK &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://zapiet.com/\"&gt;https://zapiet.com/&lt;/a&gt; &lt;/p&gt; &lt;p&gt;&lt;strong&gt;Location:&lt;/strong&gt; Remote, with a preference for candidates based in the UK&lt;br&gt;&lt;strong&gt;Salary:&lt;/strong&gt; £40,000–£50,000 per year, depending on experience&lt;br&gt;&lt;strong&gt;Bonus:&lt;/strong&gt; Performance-related bonus&lt;br&gt;&lt;strong&gt;Reporting to:&lt;/strong&gt; Chief Marketing Officer and Chief Executive Officer&lt;/p&gt; &lt;p&gt;This is a remote role, and we welcome applications from suitably qualified candidates in other locations. However, candidates based in the UK are preferred due to working hours and the need to collaborate closely with Zapiet’s leadership team.&lt;/p&gt; &lt;h2&gt;About Zapiet&lt;/h2&gt; &lt;p&gt;Zapiet helps Shopify merchants offer exceptional pickup, delivery and shipping experiences.&lt;/p&gt; &lt;p&gt;Our products are used by more than 10,000 merchants around the world, from independent businesses to some of the world’s best-known brands. We are a remote, bootstrapped SaaS company with ambitious plans for the next stage of our growth.&lt;/p&gt; &lt;p&gt;We are looking for a commercially focused Head of Marketing to help more merchants discover, adopt and succeed with Zapiet’s products.&lt;/p&gt; &lt;h2&gt;The role&lt;/h2&gt; &lt;p&gt;As Head of Marketing, your primary responsibility will be to increase revenue by driving awareness, adoption and continued use of Zapiet’s products.&lt;/p&gt; &lt;p&gt;You will turn our wider company and marketing strategy into focused campaigns that generate measurable results. You will own the marketing funnel, from discovery and acquisition through to activation, expansion and retention.&lt;/p&gt; &lt;p&gt;You will also manage and grow a team of internal and external specialists across email marketing, SEO, answer engine optimisation, content, communications and other marketing disciplines.&lt;/p&gt; &lt;p&gt;This is a hands-on leadership role. You should be comfortable setting strategy, managing specialists, analysing performance and stepping in to help execute when needed.&lt;/p&gt; &lt;p&gt;You will work closely with our CMO, CEO, product, sales, partnerships and customer support teams.&lt;/p&gt; &lt;h2&gt;Your responsibilities&lt;/h2&gt; &lt;h3&gt;Increase product adoption and revenue&lt;/h3&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Develop and deliver marketing plans that increase installations, product adoption and recurring revenue.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Identify the biggest opportunities within our acquisition, activation, retention and expansion funnels.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Create campaigns that clearly communicate how Zapiet’s products help merchants increase revenue, reduce costs and improve their operations.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Increase adoption across Zapiet’s complete product portfolio through cross-selling, product education and lifecycle marketing.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Support new product and feature launches with clear positioning, messaging and go-to-market plans.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Develop campaigns for specific industries, merchant segments and geographic markets.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Turn merchant success stories into compelling case studies, campaigns and sales materials.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Own marketing performance&lt;/h3&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Set clear targets and KPIs for every marketing channel.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Build reporting that connects marketing activity to installations, qualified opportunities, product adoption and recurring revenue.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Monitor performance across the full funnel and identify where merchants are dropping off.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Run structured experiments to improve conversion, activation and retention.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Manage the marketing budget and allocate resources to the channels producing the strongest commercial results.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Report performance, insights and priorities directly to the CMO and CEO.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Lead and grow the marketing team&lt;/h3&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Manage and develop a team of specialists across email marketing, SEO, AEO, content and communications.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Recruit additional expertise as the marketing function grows.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Set clear goals, responsibilities and performance expectations.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Create an environment where specialists can do their best work while remaining accountable for measurable outcomes.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Coordinate internal team members, agencies, freelancers and technology partners.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Ensure campaigns are delivered on time and to a consistently high standard.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Strengthen Zapiet’s market position&lt;/h3&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Refine the positioning and messaging of Zapiet and its products.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Improve Zapiet’s visibility across search engines, AI answer platforms, industry publications and the wider Shopify ecosystem.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Build relationships with Shopify agencies, technology partners, influencers and ecommerce communities.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Identify emerging changes in SaaS marketing, ecommerce discovery and merchant buying behaviour.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Ensure Zapiet’s communications are clear, distinctive and consistent across every channel.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;What we are looking for&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Significant experience marketing SaaS products, ideally within ecommerce, Shopify or B2B software.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A proven record of increasing product adoption, recurring revenue or qualified pipeline through marketing.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience leading and developing a multidisciplinary marketing team.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Strong knowledge of lifecycle and email marketing, SEO, content, communications and product marketing.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A practical understanding of answer engine optimisation and how AI is changing product discovery.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience developing and executing go-to-market plans for products and features.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Strong analytical skills and the ability to connect marketing activity with commercial results.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience setting targets, managing budgets and reporting performance to senior leadership.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Excellent project management skills and the ability to keep multiple campaigns moving.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Native-level written and spoken English, with exceptional attention to detail.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A willingness to be hands-on and take ownership of outcomes.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;You will do well in this role if you&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Think about revenue and product adoption, not vanity metrics.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Can turn a broad strategy into a focused and achievable plan.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Understand how acquisition, activation, retention and expansion work together.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Are comfortable challenging assumptions and testing new ideas.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Know how to lead experts without needing to be the deepest specialist in every discipline.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Communicate openly, make decisions using evidence and take responsibility for results.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Enjoy working in a fast-moving, international and remote environment.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;How success will be measured&lt;/h2&gt; &lt;p&gt;Your performance will be assessed against agreed commercial and marketing targets, which may include:&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Growth in marketing-attributed recurring revenue.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Growth in product installations and qualified merchant opportunities.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Improvements in trial-to-paid and install-to-activation conversion.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Increased adoption of additional Zapiet products.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Growth in organic, email, partner and AI-assisted discovery channels.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Merchant retention and expansion revenue.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;The performance and development of the marketing team.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Efficient use of the marketing budget.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;A performance-related bonus will be paid based on the achievement of agreed targets.&lt;/p&gt; &lt;h2&gt;What we offer&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;A salary of £40,000–£50,000 per year, depending on experience.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;A performance-related bonus.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Remote and flexible working.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;The opportunity to shape the marketing strategy of an established, international SaaS company.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Direct access to Zapiet’s CMO and CEO.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;The freedom to build a talented marketing team and introduce new ideas.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;The opportunity to work with Shopify merchants, agencies and technology partners around the world.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Equal opportunities&lt;/h2&gt; &lt;p&gt;Zapiet welcomes applications from people of all backgrounds. We make hiring decisions based on experience, ability and the contribution each person can make to our team.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/zapiet-head-of-marketing\"&gt;https://weworkremotely.com/remote-jobs/zapiet-head-of-marketing&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sun, 26 Jul 2026 17:42:41 +0000</pubDate> <expires_at>Thu, 24 Sep 2026 17:42:41 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/zapiet-head-of-marketing</guid> <link>https://weworkremotely.com/remote-jobs/zapiet-head-of-marketing</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0171/4271/logo.gif\" type=\"image/png\"/> <title>garden3d: Head of Design</title> <region>Anywhere in the World</region> <country></country> <state>New York</state> <skills></skills> <category>Design</category> <type>Contract</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0171/4271/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; New York City &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://garden3d.net/\"&gt;https://garden3d.net/&lt;/a&gt; &lt;/p&gt; &lt;p&gt;We are hiring a &lt;strong&gt;Head of Design&lt;/strong&gt; for the garden3d creative collective, to uphold an exceedingly high bar on every single thing we make&lt;/p&gt; &lt;p&gt;More details if you check our&amp;nbsp;&lt;a href=\"https://app.notion.com/p/garden3d/Head-of-Design-39d131fea2c781b3953af7d310a53bc2?source=copy_link\"&gt;original job posting link&lt;/a&gt;&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;About &lt;a href=\"https://garden3d.net/\"&gt;garden3d&lt;/a&gt;&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;We are worker owned creative collective, innovating on everything from brands and IRL communities to IoT devices and cross platform apps. We share profit, open source everything, spin out new businesses, and invest in exciting ideas through financial and/or in-kind contributions.&lt;/p&gt; &lt;p&gt;Our client roster includes&amp;nbsp;&lt;a href=\"https://www.google.com/\"&gt;Google&lt;/a&gt;,&amp;nbsp;&lt;a href=\"https://stripe.com/\"&gt;Stripe&lt;/a&gt;,&amp;nbsp;&lt;a href=\"https://www.figma.com/\"&gt;Figma&lt;/a&gt;,&amp;nbsp;&lt;a href=\"https://hinge.co/\"&gt;Hinge&lt;/a&gt;,&amp;nbsp;&lt;a href=\"https://blacksocialists.us/\"&gt;Black Socialists in America&lt;/a&gt;,&amp;nbsp;&lt;a href=\"https://www.aclu.org/\"&gt;ACLU&lt;/a&gt;,&amp;nbsp;&lt;a href=\"https://www.pratt.edu/\"&gt;Pratt&lt;/a&gt;,&amp;nbsp;&lt;a href=\"https://www.newschool.edu/parsons/\"&gt;Parsons&lt;/a&gt;,&amp;nbsp;&lt;a href=\"https://www.mozilla.org/en-US/\"&gt;Mozilla&lt;/a&gt;,&amp;nbsp;&lt;a href=\"https://www.nobelprize.org/\"&gt;The Nobel Prize&lt;/a&gt;,&amp;nbsp;&lt;a href=\"https://www.mit.edu/\"&gt;MIT&lt;/a&gt;,&amp;nbsp;&lt;a href=\"https://www.gnosis.io/\"&gt;Gnosis&lt;/a&gt;,&amp;nbsp;&lt;a href=\"https://www.etsy.com/\"&gt;Etsy&lt;/a&gt;&amp;nbsp;&amp;amp;&amp;nbsp;&lt;a href=\"https://gagosian.com/\"&gt;Gagosian&lt;/a&gt;.&lt;/p&gt; &lt;p&gt;We’re the software team behind innovative products like&amp;nbsp;&lt;a href=\"https://www.thelightphone.com/\"&gt;The Light Phone&lt;/a&gt;&amp;nbsp;&amp;amp;&amp;nbsp;&lt;a href=\"https://www.mill.com/\"&gt;Mill&lt;/a&gt;, and we operate a global, decentralized community space collective called&amp;nbsp;&lt;a href=\"https://www.index-space.org/\"&gt;Index Space&lt;/a&gt;.&lt;/p&gt; &lt;p&gt;We think of our garden3d as collective for creative people, prioritizing a happy, talented, and diverse studio culture. We work on projects that bring value to our world, and we balance deep care for the work we do with a genuine curiosity about life outside of our jobs.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Sanctuary Computer&lt;/strong&gt;&amp;nbsp;— Development&lt;/p&gt; &lt;p&gt;At&amp;nbsp;&lt;a href=\"https://www.sanctuary.computer/\"&gt;Sanctuary Computer&lt;/a&gt;&amp;nbsp;we’re building a different type of technology shop – one that prioritizes close collaboration between the client and the craftsperson.&lt;/p&gt; &lt;p&gt;Our projects range from design-forward websites, to robust web apps, to native mobile development.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;XXIX&lt;/strong&gt;&amp;nbsp;— Design&lt;/p&gt; &lt;p&gt;When we started&amp;nbsp;&lt;a href=\"https://www.xxix.co/\"&gt;XXIX&lt;/a&gt;&amp;nbsp;in 2013, we set out to create a different kind of design studio and we’ve thrived because we continually ask what a creative practice can be.&lt;/p&gt; &lt;p&gt;We’re building a radically different kind of organization that values autonomy, growth, transparency, and shared responsibility.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Index Space&lt;/strong&gt;&amp;nbsp;— Community&lt;/p&gt; &lt;p&gt;A network of physical spaces all around the world,&amp;nbsp;&lt;a href=\"https://www.index-space.org/\"&gt;Index&lt;/a&gt;&amp;nbsp;provides space for the exchange of knowledge and tools.&lt;/p&gt; &lt;p&gt;We nurture trust within the creative community through generosity and abundance of ideas and care.&lt;/p&gt; &lt;p&gt;&lt;a href=\"https://garden3d.substack.com/\"&gt;&lt;strong&gt;garden3d TK&lt;/strong&gt;&lt;/a&gt;&amp;nbsp;— Media&lt;/p&gt; &lt;p&gt;At garden3d, we’re in the early stages of building an experimental media company exploring emerging themes related to the evolving landscape of technology, design and culture.&lt;/p&gt; &lt;p&gt;We aim to monetize this outlet, publish books, produce screenplays, and release music.&lt;/p&gt; &lt;p&gt;Plus, our partner organizations&lt;br&gt;&lt;a href=\"https://www.thelightphone.com/\"&gt;https://www.thelightphone.com/&lt;/a&gt;&lt;br&gt;&lt;a href=\"https://www.mill.com/\"&gt;https://www.mill.com/&lt;/a&gt;&lt;br&gt;&lt;a href=\"https://www.mill.com/\"&gt;https://www.ingredient-ai.com/&lt;/a&gt;&lt;/p&gt; &lt;h2&gt;The Head of Design Role&lt;/h2&gt; &lt;p&gt;The garden3d Head of Design has one mandate: nothing we put on the internet falls below an 8 out of 10. We are a house of brands - Sanctuary Computer (development), XXIX (design), Index Space (community), USB Club (digital community), and the garden3d umbrella itself - and all of them ship work into the world under our name. Working in close partnership with our founder &amp;amp; president &lt;a href=\"http://hhff.solar/\"&gt;Hugh Francis&lt;/a&gt;, this person sets the craft standard, and builds the culture that holds it.&lt;/p&gt; &lt;p&gt;&lt;span class=\"notion-enable-hover\"&gt;You can be based anywhere.&lt;/span&gt; A lot of our people are in New York and there's some gravity here, but we already work across timezones and we would happily hire in Europe, Singapore, Chicago, or wherever you are. If you're the right person, we want to hear from you.&lt;/p&gt; &lt;p&gt;This role works with studio leads, designers, developers, editors, animators, photographers and clients across every garden3d vertical.&amp;nbsp;&lt;/p&gt; &lt;p&gt;This person can move between a brand identity, a product interface, a case study and a launch film in the same week, and raise the bar on each of them.&lt;/p&gt; &lt;p&gt;They span all of garden3d, but their home base is &lt;a href=\"https://www.xxix.co\"&gt;XXIX&lt;/a&gt;. Our design studio is where the standard gets set, and where it either holds or slips, so this person runs critique there. Regular reviews. Honest and specific feedback. A shared language for why one thing is better than another, and what practically to do about it. Then they carry that same bar everywhere: to Sanctuary Computer's product and web work, to Index, to new USB Club product launches, to garden3d TK and everything we publish.&lt;/p&gt; &lt;p&gt;They are also how we get better people. Our work is only as good as the designers making it, so this person hunts for exceptional talent, sells them on us, and sets them up to do the best work of their careers. The ideal candidate looks at a worker-owned collective with four studios, an open P&amp;amp;L and clients like Google, Figma and The Nobel Prize, and sees a design practice they can propel among the best in the world.&lt;/p&gt; &lt;p&gt;They span all of garden3d, but their home base is &lt;a href=\"https://www.xxix.co\"&gt;XXIX&lt;/a&gt;. Our design studio is where the standard gets set, and where it either holds or slips, so this person runs critique there. Regular reviews. Honest and specific feedback. A shared language for why one thing is better than another, and what practically to do about it. Then they carry that same bar everywhere: to Sanctuary Computer's product and web work, to Index, to new USB Club product launches, to garden3d TK and everything we publish.&lt;/p&gt; &lt;p&gt;They are also how we get better people. Our work is only as good as the designers making it, so this person hunts for exceptional talent, sells them on us, and sets them up to do the best work of their careers. The ideal candidate looks at a worker-owned collective with four studios, an open P&amp;amp;L and clients like Google, Figma and The Nobel Prize, and sees a design practice they can propel among the best in the world.&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;Responsibilities &amp;amp; Mandates&lt;/strong&gt;&lt;/h2&gt; &lt;h3&gt;‍Quality never less than &lt;strong&gt;8/10&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;We aspire for 10/10, celebrate 9/10 and never publish anything that’s not an 8/10 - visually, narratively, and in production quality. This person holds that line across every website, brand, deck, film, case study and post, on every vertical. They would rather kill a piece than let a 6 out the door. Their feedback makes work better and faster, without micromanaging the people who make it.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;A critique culture at XXIX&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;XXIX is where our standard lives, so this is where most of their energy goes. They build and run its critique practice: reviews with teeth, feedback that is specific rather than polite, and a vocabulary the whole studio shares. A designer should leave a crit knowing exactly what to do next. Done well, the crit is what makes the studio better than any one person in it, including them.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Hiring and empowering the very best&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;They are a magnet for exceptional designers. They know where to find them, how to convince them, and how to give them enough room to do their best work while still holding them to the standard. People who work for this person should get visibly better, and should say so.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Client craft, at blue-chip standard&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Our clients include Google, Stripe, Figma, Mozilla, The Nobel Prize and Gagosian. This person has sat across the table from companies like these, presented work, defended it, and shaped a brand narrative the client's own leadership could repeat back to their board. They can run a room, and they've done it across many industries, not just one.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;New design business, and the projects that matter most&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;They run new business for design. Pitching, scoping and closing the work we actually want, and building the relationships that bring the next one back. When a project is our highest-profile or highest-budget, they're in it: not always as the day-to-day lead, but as the person shaping the creative direction and making sure it lands. The work we win, and the work we're known for, is the clearest measure of whether this is going well.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Type and editorial design&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Typography and editorial systems are core craft here, not a specialism we farm out. This person has a real practice in both. Their type choices should be one of the first things you notice about their portfolio, and one of the first things our designers learn from them.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Case study production&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Every engagement across our studios should end in a case study you'd want to read. Producing them is second nature to this person: interviewing the team, shaping the narrative, art-directing the assets, and shipping something that wins the studio its next project.&lt;/p&gt; &lt;h3&gt;️ &lt;strong&gt;Websites that put our best foot forward&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Our sites are usually the first place a prospective client or hire meets us. This person owns what each garden3d site says, what work it shows, and how clearly it explains what that studio can do. They keep sites, decks and collateral current as the work moves, so what people find is sharp and true.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Presence IRL&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;garden3d shows up in person: events, conferences, talks, Index programming, and the dinners and openings where our world gathers. This person decides which of these deserve our time, gets us there looking like ourselves, and comes back with something to publish.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Culture&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;They model garden3d's values of partnership, curiosity, and accountability. The designers they lead do the best work of their careers here, because the feedback is honest, the recognition is earned, and the taste rubs off.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;&lt;span class=\"notion-enable-hover\"&gt;Special Projects&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;span class=\"notion-enable-hover\"&gt;&lt;strong&gt;In addition to day to day responsibilities, here’s an idea of some of the projects this role may spearhead or support in coming years →&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Building XXIX's critique practice into something other studios try to copy&lt;/li&gt; &lt;li&gt;Landing the kind of flagship design engagement that changes what people think we do&lt;/li&gt; &lt;li&gt;Hiring the next generation of the design team, across every garden3d studio&lt;/li&gt; &lt;li&gt;Rebuilding our studio websites so each one sells its studio properly&lt;/li&gt; &lt;li&gt;A case study production line that feeds all four new-business pipelines&lt;/li&gt; &lt;li&gt;Bringing our type and editorial practice into garden3d TK: books, covers, records, screenplays&lt;/li&gt; &lt;li&gt;Setting the AI-assisted design pipeline the whole collective works from&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;Qualifications&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;This is a great opportunity for someone looking to make a significant impact in a growing, dynamic company. Based on the responsibilities of this role, we think the right candidate has the following experience and skills:&lt;/p&gt; &lt;p&gt;&lt;strong&gt; Must have:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;10+ years in design, at least three of them leading a team inside a studio, agency or founder-led company&lt;/li&gt; &lt;li&gt;A portfolio that proves exceptional taste: visual, typographic and narrative&lt;/li&gt; &lt;li&gt;Type design and editorial design as core craft, not an occasional side interest&lt;/li&gt; &lt;li&gt;Extensive client experience: presenting and defending work in front of blue-chip companies across many industries, and shaping the brand narrative their leadership repeats back&lt;/li&gt; &lt;li&gt;A track record of winning design work, not only delivering it: pitching, scoping and closing new business at the top of the market&lt;/li&gt; &lt;li&gt;A track record of hiring exceptional designers, and of people who got measurably better working for them&lt;/li&gt; &lt;li&gt;Running critique: feedback that is specific, honest and actionable, and the ability to build a studio culture around it&lt;/li&gt; &lt;li&gt;Hands-on Figma fluency. This person can make the thing, not only critique it (and will get on the tools when the need arises)&lt;/li&gt; &lt;li&gt;Case study production as second nature: interviewing the team, shaping the story, art-directing the assets&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt; Nice-to-have:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Directing video and holding the quality bar on it: short-form for social, product and client shoots, launch films. They can brief a crew, sit in the edit, and say why a cut isn't working&lt;/li&gt; &lt;li&gt;Motion, photography or editing chops of their own&lt;/li&gt; &lt;li&gt;Print, publishing or book design&lt;/li&gt; &lt;li&gt;Product and interface design alongside brand work&lt;/li&gt; &lt;li&gt;Experience owning a company's web presence end to end&lt;/li&gt; &lt;li&gt;Comfort managing several distinct brand voices in a house of brands&lt;/li&gt; &lt;li&gt;Experience inside a worker-owned, open-book or otherwise unusual company&lt;/li&gt; &lt;li&gt;A network in the design community: the schools, the conferences, the people worth hiring&lt;/li&gt; &lt;li&gt;Experience designing for the design &amp;amp; engineering decision-makers at companies like our clients&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;Who you are&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;The person we’re looking for is happy, relaxed and easy to get along with and appreciates a commitment to a culture of transparency, non-dictatorial leadership styles, and alternative methodologies. They’re flexible on anything except conceits that will lower their usually outstanding work quality. They work “smart” by carefully managing their workflow and team.&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;How we interview&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;After you submit your application, a member of our team will reach out. Our interview process starts with an intro call to answer any questions you have about the role and to learn a bit more about your experience and interests.&lt;/p&gt; &lt;p&gt;From there, we’ll follow up with a panel interview call where you get to meet a few members of our team, to openly discuss some of our challenges and ensure your skills and interests align with where we’re going as a business.&lt;/p&gt; &lt;p&gt;For qualified candidates, the process wraps with a reference call, and an offer to follow.&lt;/p&gt; &lt;h2&gt;Compensation&lt;/h2&gt; &lt;p&gt;&lt;strong&gt;This is a permanent leadership role.&lt;/strong&gt; If this individual exceeds expectations in their first four months, we'll shape the permanent role together, with scope and compensation that grow as the studios and their revenue do. After a period of proven success (12 - 24 months), they become eligible to join our worker ownership program.&lt;/p&gt; &lt;p&gt;We start with a 4-month fraction trial contract, paid hourly between &lt;strong&gt;$110 - $175&lt;/strong&gt; p/hr pending seniority &amp;amp; experience. In the first few weeks of the trial, this individual will propose their own goals to define success in their trial, and present them to our leadership team for approval.&lt;/p&gt; &lt;p&gt;At garden3d, we believe that those who shoulder the most responsibility and create the greatest impact should be paid accordingly. This role greatly favors autonomous, competent &amp;amp; ambitious operators.&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;How we work:&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;We believe that there’s a better balance between the poles of freelancing &amp;amp; full time, and for that reason we work differently to most shops:&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;a href=\"https://sanctucompu.substack.com/p/our-open-source-2020-profit-and-loss\"&gt;&lt;strong&gt;Transparency &amp;amp; Ownership:&lt;/strong&gt;&lt;/a&gt;&amp;nbsp;We release out Profit &amp;amp; Loss statements to the community each year, open source our best ideas, and talk business &amp;amp; money with everyone in the company. We’re proud to run our business with integrity, and for that reason we share everything with our team &amp;amp; community.&lt;/li&gt; &lt;li&gt;&lt;a href=\"https://negative.sanctuary.computer/\"&gt;&lt;strong&gt;150% Carbon Negative:&lt;/strong&gt;&lt;/a&gt;&amp;nbsp;Our studio offsets 150% of the carbon we use to do business each year, dated back to our founding in 2015. We turn down work that is not in-line with our morals, and we encourage our peers to do the same. &lt;strong&gt;&lt;a href=\"https://twitter.com/sanctucompu/status/1385282161197060100\"&gt;We have been certified climate neutral since 2021&lt;/a&gt;.&lt;/strong&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;&lt;a href=\"https://sanctucompu.substack.com/p/our-moral-compass\"&gt;Strong Morals:&lt;/a&gt;&amp;nbsp;&lt;/strong&gt;Since our founding, we've turned down somewhere between $1mm - $2mm of work that didn't meet our moral standards. (Most of that was DTC brands that can't show a valid sustainability initiative).&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Async &amp;amp; Decentralized:&lt;/strong&gt; We use tools optimized for calm, thoughtful communication, and opt for async whenever possible. We fight hard to maintain our focus time.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Remote Friendly:&lt;/strong&gt;&amp;nbsp;Our company is fluent in remote work, making our workplace more decentralized, and democratized in the process.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Ideas &amp;amp; Products:&lt;/strong&gt;&amp;nbsp;In our spare studio time, we work to build our own open source or internal products to diversify &amp;amp; bolster our income. We create amazing technology products for our clients, so why not for the studio?&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;→ Read more on our &lt;a href=\"https://sanctucompu.substack.com/\"&gt;Substack, over here&lt;/a&gt;.&lt;/p&gt; &lt;p&gt;Kindly submit a complete and thoughtful application, including relevant links that help verify your work experience and identity. Applications with missing or insufficient information will not move forward in the review process.&lt;/p&gt; &lt;p&gt;Our team carefully reviews every complete submission, and we truly appreciate the time and effort you put into applying! We’re excited to hear from you! ❤&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/garden3d-head-of-design\"&gt;https://weworkremotely.com/remote-jobs/garden3d-head-of-design&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Fri, 17 Jul 2026 16:43:01 +0000</pubDate> <expires_at>Tue, 15 Sep 2026 16:43:01 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/garden3d-head-of-design</guid> <link>https://weworkremotely.com/remote-jobs/garden3d-head-of-design</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0171/5346/logo.gif\" type=\"image/png\"/> <title>Ignition, Inc.: Mac MSP Help Desk Guru (work from home)</title> <region>Anywhere in the World</region> <country></country> <state>California</state> <skills>Technical Support</skills> <category>DevOps and Sysadmin</category> <type>Full-Time</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0171/5346/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; ignitionit.com &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://ignitionit.com\"&gt;https://ignitionit.com&lt;/a&gt; &lt;/p&gt; &lt;p&gt;&lt;strong&gt;APPLY HERE: https://go.cultureindex.com/p/bLvP56CvGHU&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Fully Remote · Work from home · Full-time (Eastern or Pacific time zones) · Apple-first&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;TL;DR&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;ignitionit.com is a seasoned, Apple-first MSP — in business for almost 30 years — and we're hiring a Help Desk Technician to be the friendly, capable first voice our clients reach when something isn't working. This position is a remote, work-from-home, full-time role.&lt;/p&gt; &lt;p&gt;We've written this as a junior-to-mid-level job description because that's where most great people start on our team. But if you're more seasoned — comfortable in identity, MDM, or security work — don't scroll past. We'd be delighted to find someone who can step in higher up the ladder, and we'll happily talk about a more senior scope and comp if that's you.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What the actual job???&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Unlike many IT shops, we believe that the technology is the tactic. The actual job is making people feel taken care of. One of our core values is “49% tech support, 51% human support.”&lt;/p&gt; &lt;p&gt;You'll succeed by configuring devices, resetting access, untangling email, and chasing down the gremlin that's been haunting someone's conference room. But you'll know you succeeded when a client exhales and says, “Thank goodness you're on it!” That Warm Fuzzy Feeling™ is the actual product. The green lights on the dashboard are just how we get there.&lt;/p&gt; &lt;p&gt;In a typical week, you might:&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Onboard a new hire at a fast-growing startup: provision their Mac, set up their Google Workspace or Microsoft 365 accounts, enroll the device in MDM, and make sure day one feels effortless.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Offboard a departing employee cleanly — recover the laptop, revoke access, and close the loop so nothing's left dangling. All boxes checked, ticket notated and closed, client followed up with.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Field a \"my email stopped working\" ticket that turns out to be a DNS thing, a phishing-filter thing, or a \"they changed their password on their phone three weeks ago\" thing.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Help a family office or RIA get a touchy Zoom Room or conference-room AV setup behaving before a meeting — over the phone.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Triage the queue so phones get answered fast, emails don't rot, and nobody feels forgotten — even when the honest answer is, “We're on it, but here's the realistic timeline.\"&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;⠀ You'll be the front line: helping with what you can, researching what you can't, and pinging the rest of the team when you're genuinely stuck. That last part is a skill, not a weakness — knowing when to ask is half the job.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;About ignitionit.com&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;We're one of the oldest Apple Technical Partners on the planet, and one of the only certified Apple Premier Partners — that’s kinda like getting knighted by the ghost of Steve Jobs. We started where you’d expect to find Macs (creative agencies, non-profits, education) but our primary clients today are cutting-edge, venture-backed AI SaaS startups, VC and private equity firms, registered investment advisors — many of them operating under stringent compliance expectations (SOC 2, SEC). That means we hold ourselves to a higher standard than the scrappy shop we started as. Polished, reliable, security-minded work is the baseline now — but always with a smile!&lt;/p&gt; &lt;p&gt;What hasn't changed: relationships are still our most valuable currency — with clients, with vendors, and with each other. We're a tight, supportive team. We teach each other what we know, cover for each other when life throws a punch, and care a little too much about doing things the right way. We're still a bit weird, and our clients seem to like us that way.&lt;/p&gt; &lt;p&gt;We move fast, priorities shift, it’s not always documented (whatever it is), our tool set and list of supported platforms is sprawling, and some days the to-do list is longer than you'd like. If you can stay warm under pressure, create order out of chaos, learn new stuff fast because you love it, and speak up when you need help, you'll thrive here.&lt;/p&gt; &lt;p&gt;If you need a rigid, fully-documented, never-changes environment where nobody trusts you with admin access, where you will be micro-managed so you never have to wonder whether or not you’re doing the right thing, this isn't it. You’ll have a ton of independence on our team, and freedom to use your best judgment to get the ball over the finish line, but that also means we expect you to be naturally responsible, honest, and highly accountable — to yourself, your teammates, and the clients. As they say, the price of freedom is eternal vigilance.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;The tech you'll work with (and grow into)&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Day one, you'll be living in:&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Apple at the core — macOS, iOS, Apple Business Manager, and MDM (Jamf / Iru / Intune / Workspace ONE / and more)&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Yes, PCs too — about one-third of our users are driving Windows&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Google Workspace and Microsoft 365 admin consoles&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Identity and access — SSO, MFA, and security keys (Okta, Entra ID, Yubikey, and friends)&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Lots of other security tools — our stack is constantly evolving and may vary from client to client&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;The everyday productivity stack — Slack, Zoom, conference-room AV, networking basics (Meraki), and endpoint tooling&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;⠀ You don't need to know all of this. You need to be the kind of person who wants to. As you grow, there's a clear path into infrastructure administration, project architecture and implementation, and — for the right person — security and compliance work (phishing simulations, endpoint detection, SOC 2 / CIS / SEC readiness, due diligence questionnaire support, etc.). That's where our most senior people live, and it's wide open.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Who we hope you are&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;The hard requirements — we won't move forward unless you:&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Can work standard business hours in Eastern or Pacific time zones (we currently need both)&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Have a quiet home workspace and reliable broadband&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Have proven Apple aptitude — you actually use and like the Apple ecosystem&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Have at least 2 years of IT support experience on the job. Go-getters who are just getting started and can prove they have a deep, demonstrable history of teaching themselves technology for the sheer joy of it might also make the cut.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;⠀ Everything else — and this is the longer list, on purpose. We figure technical skills are teachable; character takes a lot longer. So we're looking for someone who:&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Genuinely cares — about clients, teammates, and doing right by people&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Loves to learn, and proves it in how they spend their time&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Reads, and writes clearly — clear writing is clear thinking, and you'll do a lot of it&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Stays calm and kind with a frustrated person on the other end of the line&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Can tell the difference between good customer service and fantastic customer service, and refuses to settle for the former&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Notices when something's being done inefficiently and fixes it (you may boast about it later, that’s fine)&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Proofreads their own work (yes, we noticed whether you proofread your application)&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Has a sense of humor, and doesn't take themselves too seriously&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Regarding AI&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Our company founder/CEO is headquartered in the Bay Area. We work with innovative, ambitious companies developing AI products. Our team members hold a range of opinions about whether AI is “good or bad” for humans, but at the end of the day, we embrace the plain fact that it is here, we must embrace it to evolve, and our clients increasingly depend on us to help them embrace it, too, to help them evolve and stay competitive.&lt;/p&gt; &lt;p&gt;Our CEO's opinion: AI will not replace human labor any time soon; rather, AI is a new opportunity to either (a) get things done faster, or (b) get a much higher quality of output than before. If you’re an AI tinkerer, great! We want to hear how you’re using it and see your latest vibe project. If you’re allergic to AI or have no interest in learning new habits to work effectively with it, this is not the place for you.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Compensation &amp;amp; logistics&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Base salary: For applicants closer to the junior side who are located in the USA, $50,000–$65,000/yr, depending on experience level and your local geographical price index. With experience, comp goes up from there. Genuinely experienced, more senior candidates can be slotted higher — let's talk. Applicants outside the USA will be compensated according to your local employment market.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Type &amp;amp; location: Full-time, work from home, fully remote. Eastern or Pacific time zones.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Benefits: Medical / dental / vision for the employee, 401(k) with employer contribution, 2 weeks of PTO annually to start, and a stipend for your home internet.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;How to apply&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;The first step is really easy and only takes 10 minutes — no resume, no cover letter, no essays. Here's how:&lt;/p&gt; &lt;ol&gt; &lt;li&gt; &lt;p&gt;Take&lt;a href=\"https://go.cultureindex.com/p/bLvP56CvGHU\"&gt; this online Culture Index assessment &lt;/a&gt;(about 10 minutes): We use it to screen for people whose natural wiring fits how our team works.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;If your profile lines up with what we're looking for, we'll reach out and ask you to complete a 60-minute TestGorilla assessment for critical thinking skills, send us your resume, and maybe a couple of other items.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;From there, we conduct between 2-4 video interviews. One of these might be a live technical assessment.&lt;/p&gt; &lt;/li&gt; &lt;/ol&gt; &lt;p&gt;If the Culture Index step feels like a strange way to start a job application — that's kind of the point. Remember the phrase Think Different?&lt;/p&gt; &lt;p&gt;Ignition is an equal opportunity employer. We welcome and will consider all qualified applicants. Good luck in your search — and may the Force be with you!&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/ignition-inc-mac-msp-help-desk-guru-work-from-home\"&gt;https://weworkremotely.com/remote-jobs/ignition-inc-mac-msp-help-desk-guru-work-from-home&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Thu, 28 May 2026 07:25:37 +0000</pubDate> <expires_at>Fri, 25 Sep 2026 07:25:37 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/ignition-inc-mac-msp-help-desk-guru-work-from-home</guid> <link>https://weworkremotely.com/remote-jobs/ignition-inc-mac-msp-help-desk-guru-work-from-home</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0144/3476/logo.gif\" type=\"image/png\"/> <title>NoGigiddy: Entry-Level Account Manager</title> <region>Anywhere in the World</region> <country></country> <state>Georgia</state> <skills></skills> <category>Customer Support</category> <type>Contract</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0144/3476/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Atlanta, Georgia &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://www.nogigiddy.com/\"&gt;https://www.nogigiddy.com/&lt;/a&gt; &lt;/p&gt; &lt;div&gt;NoGigiddy is seeking a proactive and customer-focused Entry-Level Account Manager to join our remote team. In this role, you will build and maintain relationships with our clients, ensuring their needs are met and providing exceptional service. This position is perfect for someone eager to start their career in account management and customer service. No college degree is required, but strong communication skills and a passion for helping clients are essential.&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;&lt;br&gt;Key Responsibilities:&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;ul&gt; &lt;li&gt;Client Relationship Management: Build and maintain strong relationships with clients, understanding their needs and ensuring their satisfaction.&lt;/li&gt; &lt;li&gt;Communication: Act as the main point of contact for clients, addressing their inquiries, concerns, and requests promptly and effectively.&lt;/li&gt; &lt;li&gt;Account Coordination: Assist in coordinating client accounts, including setting up new accounts, managing renewals, and ensuring all client information is up to date.&lt;/li&gt; &lt;li&gt;Problem Solving: Identify and resolve client issues proactively, ensuring a positive client experience.&lt;/li&gt; &lt;li&gt;Reporting: Prepare and deliver regular reports on account performance, client feedback, and service improvements.&lt;/li&gt; &lt;li&gt;Collaboration: Work closely with internal teams, including sales, marketing, and customer support, to ensure client needs are met.&lt;/li&gt; &lt;li&gt;Client Onboarding: Assist in onboarding new clients, providing them with the necessary resources and information to get started.&lt;/li&gt; &lt;li&gt;Feedback Collection: Gather and relay client feedback to improve our services and client experience.&lt;/li&gt; &lt;/ul&gt; &lt;div&gt;&lt;strong&gt;&lt;br&gt;Skills and Qualifications:&lt;br&gt;&lt;/strong&gt;&lt;/div&gt; &lt;ul&gt; &lt;li&gt;Communication Skills: Exceptional verbal and written communication skills.&lt;/li&gt; &lt;li&gt;Customer Service Skills: Strong ability to understand and meet client needs.&lt;/li&gt; &lt;li&gt;Organizational Skills: Ability to manage multiple tasks and prioritize effectively.&lt;/li&gt; &lt;li&gt;Interpersonal Skills: Strong ability to build and maintain relationships with clients and team members.&lt;/li&gt; &lt;li&gt;Problem-Solving: Ability to address and resolve client issues effectively.&lt;/li&gt; &lt;li&gt;Time Management: Strong ability to manage time and meet deadlines.&lt;/li&gt; &lt;li&gt;Technical Skills: Basic proficiency with Microsoft Office Suite (Word, Excel, Outlook) and CRM software.&lt;/li&gt; &lt;/ul&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;Preferred Experience:&lt;/strong&gt;&lt;/div&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;ul&gt; &lt;li&gt;Experience in customer service, sales, or a related field is a plus but not required.&lt;/li&gt; &lt;li&gt;Familiarity with CRM software and account management tools is a plus.&lt;/li&gt; &lt;li&gt;Previous experience with gig economy platforms or staffing apps is a plus.&lt;/li&gt; &lt;/ul&gt; &lt;div&gt;&lt;strong&gt;Education:&lt;/strong&gt;&lt;/div&gt; &lt;ul&gt; &lt;li&gt;High school diploma or equivalent.&lt;/li&gt; &lt;li&gt;Relevant certifications or coursework in customer service, sales, or account management are beneficial but not required.&lt;/li&gt; &lt;/ul&gt; &lt;div&gt;&lt;strong&gt;Working Conditions:&lt;/strong&gt;&lt;/div&gt; &lt;ul&gt; &lt;li&gt;Remote Work: The role is remote, allowing for flexibility in work location.&lt;/li&gt; &lt;li&gt;Collaboration: Regular virtual meetings and communications with the sales and support teams.&lt;/li&gt; &lt;li&gt;Tools: Use of various communication and collaboration tools, such as email, video conferencing, and CRM software.&lt;/li&gt; &lt;/ul&gt; &lt;div&gt;&lt;strong&gt;Salary Range:&lt;/strong&gt;&lt;/div&gt; &lt;ul&gt; &lt;li&gt;$20 to $27 per hour, depending on experience and qualifications.&lt;/li&gt; &lt;/ul&gt; &lt;div&gt;&lt;br&gt;If you are organized, detail-oriented, and passionate about providing excellent service to clients, we’d love to hear from you! Apply now to join NoGigiddy and make a difference in the gig economy.&lt;br&gt;&lt;br&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/nogigiddy-entry-level-account-manager-4\"&gt;https://weworkremotely.com/remote-jobs/nogigiddy-entry-level-account-manager-4&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Wed, 20 May 2026 10:55:57 +0000</pubDate> <expires_at>Thu, 17 Sep 2026 10:55:57 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/nogigiddy-entry-level-account-manager-4</guid> <link>https://weworkremotely.com/remote-jobs/nogigiddy-entry-level-account-manager-4</link> </item> <item> <title>Egear : Senior Google Ads Media Buyer / Performance Marketing Lead</title> <region>Anywhere in the World</region> <country></country> <state>Florida</state> <skills>Google Analytics, Paid Social Media Advertising, and Google Ads</skills> <category>All Other Remote</category> <type>Full-Time</type> <description> &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Florida, USA &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://egearmedia.com/\"&gt;https://egearmedia.com/&lt;/a&gt; &lt;/p&gt; &lt;p&gt;We are looking for someone with experience level: 4–7 years running Google Ads independently, ideally in a performance marketing agency or ecommerce media buying team. Not a generalist digital marketer - a specialist who lives in Google Ads daily. Someone who can take full ownership of our paid search and Performance Max campaigns, bring structure to our account operations, and drive our media buying to consistent profitability.&lt;br&gt;&lt;br&gt;Who we are:&lt;br&gt;A fast-growing e-commerce performance marketing agency running direct-to-consumer offers across multiple product verticals including smart devices, health, and outdoor products.&lt;br&gt;&lt;br&gt;What you will own&lt;br&gt;&lt;br&gt;You will be the most senior hands-on media buyer on the team. This is not a management role where you direct others — you will be in the accounts every day. Specifically you will:&lt;br&gt;&lt;br&gt;- Plan, build, and optimise Google Search, Performance Max, Demand Gen, and Display campaigns across multiple product offers and accounts&lt;br&gt;- Set up and maintain full tracking and attribution in RedTrack, including postback URLs, offer parameters, sub-parameter mapping, and conversion event configuration&lt;br&gt;- Diagnose and resolve account-level issues including conversion tracking failures, advertiser verification, billing problems, and campaign ID mismatches&lt;br&gt;- Evaluate each offer independently and give a clear verdict: scale, test a new angle, or cut losses&lt;br&gt;- Brief landing page requirements to our web developer based on performance data, not guesswork&lt;br&gt;- Deliver a written performance report every week covering spend, ROAS, CPA by campaign etc.&lt;br&gt;- Establish and document campaign setup standards so the rest of the team can follow a consistent process&lt;br&gt;- Mentor junior media buyers on campaign architecture and optimisation&lt;br&gt;&lt;br&gt;What we offer:&lt;br&gt;&lt;br&gt;Fully remote, flexible hours — we care about results not schedules&lt;br&gt;Direct access to decision-makers — no layers of approval&lt;br&gt;Performance bonus structure based on ROAS targets (discussed at offer stage)&lt;br&gt;A team that is already generating real data and real results — you will not be starting from zero&lt;br&gt;&lt;br&gt;To apply&lt;br&gt;Send your application to&amp;nbsp;&lt;a class=\"external_link\" href=\"mailto:anna@egearmedia.com\"&gt;anna@egearmedia.com&lt;/a&gt;&amp;nbsp;with the subject line: Google Ads Media Buyer&lt;br&gt;Your application must include:&lt;br&gt;&lt;br&gt;1. CV with projects cases&lt;br&gt;2. A link to a short video introduction (google drive/ Frame/ social media or on any other platform) also covering description of a Google Ads campaign you took from unprofitable to profitable — what was broken, what you changed, and what the result was.&lt;br&gt;Your experience with third-party tracking tools and how you have used them&lt;br&gt;Your availability and rate expectations.&lt;br&gt;&lt;br&gt;Applications without video presentation will not be reviewed.&lt;br&gt;Thank you!&lt;/p&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/egear-senior-google-ads-media-buyer-performance-marketing-lead\"&gt;https://weworkremotely.com/remote-jobs/egear-senior-google-ads-media-buyer-performance-marketing-lead&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Sun, 26 Apr 2026 12:50:19 +0000</pubDate> <expires_at>Wed, 23 Sep 2026 12:50:19 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/egear-senior-google-ads-media-buyer-performance-marketing-lead</guid> <link>https://weworkremotely.com/remote-jobs/egear-senior-google-ads-media-buyer-performance-marketing-lead</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0083/7653/logo.gif\" type=\"image/png\"/> <title>Elite Software Automation: Business Analyst</title> <region>Anywhere in the World</region> <country></country> <state>Texas</state> <skills>Operations Management, Process Improvement, Operational Planning, Management Consulting, and Business Analysis &amp; Strategy</skills> <category>Management and Finance</category> <type>Full-Time</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0083/7653/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Virtual &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://jobs.elitesoftwareautomation.com/\"&gt;https://jobs.elitesoftwareautomation.com/&lt;/a&gt; &lt;/p&gt; &lt;p class=\"text-muted-foreground italic mb-4\"&gt;(Remote, Full-Time, Anywhere in the World)&lt;/p&gt; &lt;p class=\"text-foreground mb-1\"&gt;Starting Pay:&amp;nbsp;USD $110-150K/year for Advanced/Senior level, $80-100K/year for Mid-level (details below)&lt;/p&gt; &lt;p class=\"text-foreground mb-6\"&gt;Further pay promotions available based on performance once on the job&lt;/p&gt; &lt;p class=\"text-foreground font-semibold mb-1\"&gt;We are only accepting experienced candidates at this time.&lt;/p&gt; &lt;p class=\"text-foreground font-semibold mb-6\"&gt;If you are a beginner, your application will be rejected.&lt;/p&gt; &lt;p class=\"text-muted-foreground italic text-sm mt-6 mb-10\"&gt;&lt;strong&gt;Note:&lt;/strong&gt; this job listing is incomplete due to the job board's word limit. Click \"Apply\" to see the full job description and application on our jobs site.&lt;/p&gt; &lt;h2 class=\"text-[28px] font-semibold text-foreground tracking-tight mb-6\"&gt;Introduction&lt;/h2&gt; &lt;div class=\"space-y-4 text-foreground leading-relaxed\"&gt; &lt;p&gt;Elite Software Automation (ESA) is a boutique consulting firm that transforms successful, fast-growing businesses into dominant market players through comprehensive operational optimization.&lt;/p&gt; &lt;p&gt;Our clients are established 7 and 8 figure enterprises with service-intensive business models. They excel at client acquisition and sales, but face severe operational challenges as they scale. Their back-end operations struggle with process effectiveness, system inadequacy, and automation deficiency. Growth creates chaos. Chaos forces stabilization. Stabilization stalls growth. The cycle repeats, each iteration more expensive and less effective.&lt;/p&gt; &lt;p&gt;This is where we come in.&lt;/p&gt; &lt;p&gt;We don't implement cookie-cutter solutions or recycle methodologies. We don't take requirements and build what clients ask for. We investigate their businesses at a granular level, identify actual root causes of their profit erosion, and re-engineer their operations from first principles.&lt;/p&gt; &lt;p&gt;We design and implement comprehensive custom business processes that ensure effective and efficient operation across all business areas. We build custom systems that enforce correct process execution and eliminate human error, sabotage, and information loss. We automate all repetitive logic, removing manual effort and making execution instant.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;This is possible because of our unique approach:&lt;/strong&gt;&amp;nbsp;focused and methodical execution, dedicated attention to each client's specific business circumstances, extreme detail orientation, and our in-house custom technology and methodology. We don't outsource anything. Everything is executed by our full-time in-house team of expert business process analysts and full-stack technical experts.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What we offer you if you're qualified:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;You won't write reports that executives ignore. You won't implement solutions that don't work. You won't take requirements from clients and translate them into technical specifications.&lt;/p&gt; &lt;p&gt;You'll go into inefficient and overwhelmed business operations and actually fix them from root to core. You'll have real autonomy to design custom solutions based on first-principles thinking. You'll have real accountability for actual business results. You'll work without corporate politics, without useless meetings, without reports for the sake of reports. Just you, the problem, and the authority to solve it.&lt;/p&gt; &lt;p&gt;And you'll be paid accordingly. Pay increases tied to results delivery, not tenure. Work from anywhere in the world. Flexible schedule. The freedom to make your own decisions and be at your most productive.&lt;/p&gt; &lt;p&gt;If you want validation, safety, and easy work, go elsewhere. If you want to do the hardest, most intellectually demanding process optimization work that exists and be rewarded for delivering impossible results, keep reading.&lt;/p&gt; &lt;p&gt;We are selective about both clients and team members. We vet our prospective clients rigorously and work only with mature businesses where our services will make a real difference. We ensure our methodology is always followed and our clients commit to working with it. This is a cooperative relationship where we focus on business results and help define how to achieve them.&lt;/p&gt; &lt;div class=\"space-y-4 text-foreground leading-relaxed\"&gt; &lt;h2&gt;Full Description On Our Site&lt;/h2&gt; &lt;/div&gt; &lt;p&gt;This job listing is incomplete due to the job board's word limit. Click \"Apply\" to see the full job description and application on our jobs site.&lt;/p&gt; &lt;h2 class=\"text-[28px] font-semibold text-foreground tracking-tight mb-6\"&gt;How Our Organization Works&lt;/h2&gt; &lt;div class=\"space-y-4 text-foreground leading-relaxed\"&gt; &lt;p&gt;Our goal with every single project we undertake is improving the actual day-to-day operation of our client's business, and doing so quickly.&lt;/p&gt; &lt;p&gt;To achieve that, we operate with a rigorous methodology that considers things holistically and accomplishes excellence in both business processes and technology/systems, without mixing up important business decisions with technical details and deliverables.&lt;/p&gt; &lt;p&gt;First, process decisions are made based on what is good for the business. This is a thorough process involving both a comprehensive investigation of current day-to-day operations and conceptual design of new business processes engineered to make operations better.&lt;/p&gt; &lt;p&gt;Then a separate set of technical experts work with you to create innovative technical solutions that fit those business needs and requirements.&lt;/p&gt; &lt;p&gt;Clear delineation of expertise is enforced and utilized: business experts don't make technical decisions by themselves and technical experts don't make business decisions by themselves, but both are accountable to work proactively together, raising and resolving questions or issues until the solutions actually achieve the expected results in our clients' organizations.&lt;/p&gt; &lt;h2&gt;Full Description On Our Site&lt;/h2&gt; &lt;/div&gt; &lt;p&gt;This job listing is incomplete due to the job board's word limit. Click \"Apply\" to see the full job description and application on our jobs site.&lt;/p&gt; &lt;h2 class=\"text-[28px] font-semibold text-foreground tracking-tight mb-6\"&gt;Role of Business Process Analyst in ESA&lt;/h2&gt; &lt;div class=\"space-y-4 text-foreground leading-relaxed\"&gt; &lt;p&gt;In this job, you will be ultimately responsible for creating the results for our clients' business operations. You will be responsible for the client's business processes and continuous improvements to their day-to-day business operations.&lt;/p&gt; &lt;p&gt;When you get a new client, it will be your responsibility to thoroughly investigate the client's day-to-day operations and reconstruct the client's current business processes. You will examine all their current systems, data, records, documents, communication logs, and other artifacts of their business. You will interview all their key staff, managers, and other individuals. You will conduct other investigation as appropriate. And you will ultimately reconstruct in detail the client's current as-is business processes, capturing all appropriate process scenarios, structure, and other inner workings of the business processes.&lt;/p&gt; &lt;p&gt;You will then use your business process expertise to improve the client's business processes in a way that will enable a more profitable, efficient, and scalable business. You will craft individualized custom solutions and not be boxed in to any cookie-cutter solutions. You will actually work from root principles to find sub-optimalities and issues in current business processes and then re-engineer the business processes of the client and define the exact desired processes that will need to be implemented to achieve the results goals, and it will be your responsibility to ensure that the desired processes you engineer will actually be able to successfully work in our client's day-to-day business operations.&lt;/p&gt; &lt;p&gt;You will then work with our technical team to get a systems solution conceptualized and implemented in a way that will actually implement, enforce, and automate the desired to-be processes in the client's business. While it is the technical team who is responsible for the technical side of the engagement, you will work with them to ensure that the design meets the business needs and enables implementation of the desired business processes. It is your responsibility to ensure that as the systems are built and made ready for implementation, that they meet the needs of implementing the desired processes you defined and will work for the client's day-to-day business.&lt;/p&gt; &lt;p&gt;You will then lead the implementation of these processes and systems into the client's actual business operations, and make them the client's new day-to-day reality. You will discover issues during implementation, you will discover the need to refine your improvements, and you will need to follow through on those needs. Ultimately, the actual end-to-end day-to-day resulting operations in the client's business are your responsibility and you will need to work to make sure these processes and systems powering them are refined to achieve the desired results. As our clients evolve their businesses you will need to continue to evolve their processes and systems to power their growth, efficiency, and profitability as time goes on.&lt;/p&gt; &lt;p&gt;This is an extremely rigorous and thorough job. A very methodical approach is required to execute it. There is a lot of complicated decision making and responsibility in this job, and while there is a lot of independence offered in the job, there also is a great expectation of responsibility and you will be held to account for results on a frequent and regular basis. This job requires 100% full-time focus and 100% full-time effort. It is impossible to execute this job while doing other things on the side. You should only apply to this job if you are eager to commit to it and to work very hard to deliver exceptional results. Your performance and your career progression within the company will be evaluated by these results and they will not be easy to achieve.&lt;/p&gt; &lt;div class=\"space-y-4 text-foreground leading-relaxed\"&gt; &lt;h2&gt;Full Description On Our Site&lt;/h2&gt; &lt;/div&gt; &lt;p&gt;This job listing is incomplete due to the job board's word limit. Click \"Apply\" to see the full job description and application on our jobs site.&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;div&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;/div&gt; &lt;div&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;/div&gt; &lt;div&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;/div&gt; &lt;div&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;/div&gt; &lt;div&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;/div&gt; &lt;div&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;/div&gt; &lt;div&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/elite-software-automation-business-analyst-2\"&gt;https://weworkremotely.com/remote-jobs/elite-software-automation-business-analyst-2&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Mon, 23 Mar 2026 19:26:05 +0000</pubDate> <expires_at>Sat, 19 Sep 2026 19:26:05 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/elite-software-automation-business-analyst-2</guid> <link>https://weworkremotely.com/remote-jobs/elite-software-automation-business-analyst-2</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0141/5059/logo.gif\" type=\"image/png\"/> <title>ProWriterSites: Freelance Writer</title> <region>Anywhere in the World</region> <country></country> <state>New York</state> <skills></skills> <category>All Other Remote</category> <type>Contract</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0141/5059/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; New York &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://prowritersites.com\"&gt;https://prowritersites.com&lt;/a&gt; &lt;/p&gt; &lt;div&gt;ProWriterSites is a highly-rated professional portfolio design and hosting service catering to freelancers. Our mission is to make professional portfolio websites easy and affordable to all freelancers.&amp;nbsp;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;Will you help us help thousands of freelancers elevate their careers and online presence?&amp;nbsp;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;About the Role:&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;As a content writer, you'll play a pivotal role in shaping the voice and messaging across our platform and marketing channels. Your words will inspire freelancers to dream big and trust in our service to showcase their talents. This role is ideal for someone who thrives in a creative, fast-paced environment and is passionate about storytelling, branding, and the freelance lifestyle.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Key Responsibilities:&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;- Develop, write, and edit content for website pages, blog posts, email campaigns, and social media that resonates with our target audience of freelance professionals.&lt;/div&gt;&lt;div&gt;- Edit and proofread content with a keen eye for detail, ensuring high-quality and consistency across all platforms.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;What We Offer:&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;- A fully remote role with flexible working hours to suit your lifestyle.&lt;/div&gt;&lt;div&gt;- Competitive salary and performance-based bonuses.&lt;/div&gt;&lt;div&gt;- Opportunities for professional growth and creative freedom.&lt;/div&gt;&lt;div&gt;- A supportive and collaborative work environment that values new ideas and innovation.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Compensation:&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;We would like to engage with a skilled content writer on a per-project or hourly basis of $75-80 per hour, however, our ultimate goal is to bring on a full-time copywriter for a $75K to $100K annual salaried role.&amp;nbsp;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/prowritersites-freelance-writer\"&gt;https://weworkremotely.com/remote-jobs/prowritersites-freelance-writer&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Fri, 29 Nov 2024 20:05:12 +0000</pubDate> <expires_at>Sun, 20 Sep 2026 20:05:12 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/prowritersites-freelance-writer</guid> <link>https://weworkremotely.com/remote-jobs/prowritersites-freelance-writer</link> </item> <item> <media:content url=\"https://wwr-pro.s3.amazonaws.com/logos/0083/6659/logo.gif\" type=\"image/png\"/> <title>New Law Business Model: Marketing Automation SaaS + Services Line of Business Owner</title> <region>Anywhere in the World</region> <country></country> <state></state> <skills>Information Analysis</skills> <category>Management and Finance</category> <type>Full-Time</type> <description>&lt;img src=\"https://we-work-remotely.imgix.net/logos/0083/6659/logo.gif?ixlib=rails-4.0.0&amp;w=50&amp;h=50&amp;dpr=2&amp;fit=fill&amp;auto=compress\" /&gt; &lt;p&gt; &lt;strong&gt;Headquarters:&lt;/strong&gt; Boulder, CO &lt;br /&gt;&lt;strong&gt;URL:&lt;/strong&gt; &lt;a href=\"https://newlawbusinessmodel.com\"&gt;https://newlawbusinessmodel.com&lt;/a&gt; &lt;/p&gt; &lt;div&gt;If you would thrive running and scaling a line of business that makes it possible for your multi-year subscription customers to build and grow a tech-enabled business they love and can run with ease, you might be a great fit as our Marketing Automation and Practice Management Business Unit Manager (SaaS Stack Product Owner).&lt;br&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;Using a collection of off-the-shelf technologies (e.g. inbound digital marketing automation, practice/business management, scheduling software, etc.) configured in a way that has continuously proven successful for our niche market customers (members/subscribers), you would provide them with all the tools they need to efficiently manage their sales, marketing, and service delivery. You would also manage the delivery of marketing assets created by internal and external (agency/vendor) teams for our members to use with that SaaS suite to grow their firms.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;Leveraging your expertise in inbound digital marketing and business process automation, technology, operations, and efficiency, you would lead an established fantastic team that has technical expertise in system configuration and account management as well as existing SOPs and playbooks, manage and expand this $1M+/year BPO business unit’s P&amp;amp;L, and drive efficiency, customer success, and program enhancements through process and technology (especially as the technology landscape continues to evolve).&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;To apply:&lt;/strong&gt; &lt;a href=\"https://weworkremotely.com/remote-jobs/new-law-business-model-marketing-automation-saas-services-line-of-business-owner\"&gt;https://weworkremotely.com/remote-jobs/new-law-business-model-marketing-automation-saas-services-line-of-business-owner&lt;/a&gt;&lt;/p&gt; </description> <pubDate>Tue, 07 Feb 2023 20:07:41 +0000</pubDate> <expires_at>Sat, 19 Sep 2026 20:07:41 +0000</expires_at> <guid>https://weworkremotely.com/remote-jobs/new-law-business-model-marketing-automation-saas-services-line-of-business-owner</guid> <link>https://weworkremotely.com/remote-jobs/new-law-business-model-marketing-automation-saas-services-line-of-business-owner</link> </item> </channel> </rss>"