        - generic [ref=f21e20]:
          - paragraph [ref=f21e21]:
            - strong [ref=f21e22]: Who we are
          - paragraph [ref=f21e23]: Moniepoint Inc. is Africa’s all-in-one financial ecosystem, helping 10 million businesses and individuals access seamless payments, banking, credit, and business management tools since 2019.As Nigeria’s largest merchant acquirer, Moniepoint Inc. powers most of the country’s point-of-sale (POS) transactions. Through its subsidiaries, Moniepoint Inc. processes $22 billion monthly for its customers while operating profitably.
          - paragraph [ref=f21e24]:
            - strong [ref=f21e25]: About the role
          - paragraph [ref=f21e26]: We’re looking for a Full-Stack Engineer to join the Moniepoint team. The ideal candidate has strong experience with Node.js and TypeScript, and is proficient in at least one object-oriented programming language (e.g., Java, C#, etc.). You’ll be building scalable backend services and intuitive frontend interfaces that power financial services used by millions. This role requires a problem-solver with a builder mindset and the ability to work across the stack to deliver high-impact features.
          - paragraph [ref=f21e27]: "Location: Remote (Full-time)"
          - paragraph [ref=f21e28]:
            - strong [ref=f21e29]: What you’ll get to do
          - list [ref=f21e30]:
            - listitem [ref=f21e31]: Work with developers to design algorithms and flowcharts
            - listitem [ref=f21e32]: Produce clean, efficient code based on specifications
            - listitem [ref=f21e33]: Integrate software components and third-party programs
            - listitem [ref=f21e34]: Verify and deploy programs and systems
            - listitem [ref=f21e35]: Troubleshoot, debug and upgrade existing software
            - listitem [ref=f21e36]: Gather and evaluate user feedback
            - listitem [ref=f21e37]: Recommend and execute improvements
            - listitem [ref=f21e38]: Create technical documentation for reference and reporting
          - paragraph [ref=f21e39]:
            - strong [ref=f21e40]: To succeed in this role, we think you should have
          - list [ref=f21e41]:
            - listitem [ref=f21e42]: 7-10 years of experience as a Software Developer, Software Engineer or similar role
            - listitem [ref=f21e43]: 5+ years of MERN stack experience
            - listitem [ref=f21e44]: 2+ years of OOP language like Java, C# etc.
            - listitem [ref=f21e45]: Familiarity with Agile development methodologies
            - listitem [ref=f21e46]: Experience with software design and development in a test-driven environment
            - listitem [ref=f21e47]: Knowledge of coding languages (e.g. Javascript, Typescript) and frameworks/systems (e.g. ReactJS, Node.js, ExpressJs, Git)
            - listitem [ref=f21e48]: Experience with databases (MySQL, Mongo) and Object-Relational Mapping (ORM) frameworks
            - listitem [ref=f21e49]: Ability to learn new languages and technologies
            - listitem [ref=f21e50]: Excellent communication skills
            - listitem [ref=f21e51]: Resourcefulness and troubleshooting aptitude
            - listitem [ref=f21e52]: BSc/BA in Computer Science, Engineering or a related field
          - paragraph [ref=f21e53]:
            - strong [ref=f21e54]: Some of the technologies you’ll get to work with
          - list [ref=f21e55]:
            - listitem [ref=f21e56]: Javascript & Typescript
            - listitem [ref=f21e57]: ReactJS and NodeJS
            - listitem [ref=f21e58]: Docker and Kubernetes
            - listitem [ref=f21e59]: MySQL, MSSQL, Redis
            - listitem [ref=f21e60]: Microservices architecture on AWS
          - paragraph [ref=f21e61]:
            - strong [ref=f21e62]: What we can offer you
          - list [ref=f21e63]:
            - listitem [ref=f21e64]: Culture -We put our people first and prioritize the well-being of every team member. We’ve built a company where all opinions carry weight and where all voices are heard. We value and respect each other and always look out for one another. Above all, we are human.
            - listitem [ref=f21e65]: Learning - We have a learning and development-focused environment with an emphasis on knowledge sharing, training, and regular internal technical talks.
            - listitem [ref=f21e66]: Compensation - You’ll receive an attractive salary, pension, health insurance, annual bonus, plus other benefits.
