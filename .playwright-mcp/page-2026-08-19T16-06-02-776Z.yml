          - generic [ref=f3e1503]:
            - generic [ref=f3e1504]:
              - img "Preliminary Phone Screen" [ref=f3e1506]
              - generic [ref=f3e1507]: Step 1
              - heading "Preliminary Phone Screen" [level=2] [ref=f3e1508]
              - paragraph [ref=f3e1509]: Our recruitment team will reach out to you for an initial call. During this conversation, we'll confirm the details of your profile and conduct an initial assessment of your qualifications and communication skills. This step is crucial in getting to know you better and ensuring you're a good fit for the role.
            - generic [ref=f3e1510]:
              - img "Technical Assessment/Case Study Interview" [ref=f3e1512]
              - generic [ref=f3e1513]: Step 2
              - heading "Technical Assessment/Case Study Interview" [level=2] [ref=f3e1514]
              - paragraph [ref=f3e1515]: For this stage of the interview process, we will evaluate your technical prowess and problem-solving abilities through a technical assessment or case study, depending on the specific role you are applying for. This stage will challenge you to apply your skills in a hypothetical scenario, allowing us to gauge your aptitude for the position.
            - generic [ref=f3e1516]:
              - img "Panel Interview" [ref=f3e1518]
              - generic [ref=f3e1519]: Step 3
              - heading "Panel Interview" [level=2] [ref=f3e1520]
              - paragraph [ref=f3e1521]: This interview will delve into your work experience and what you can potentially bring to the team. It's an opportunity for both you and the team to get to know each other better and assess the alignment of your skills and goals with the position.
            - generic [ref=f3e1522]:
              - img "Executive/Final Interview" [ref=f3e1524]
              - generic [ref=f3e1525]: Step 4
              - heading "Executive/Final Interview" [level=2] [ref=f3e1526]
              - paragraph [ref=f3e1527]: The final phase of our interview process involves a meeting with a key member of the executive team. This stage is crucial in ensuring that you are a good fit for the team and the broader organisation. If you successfully pass this interview, you will receive an offer letter, marking the final step before joining our team.
