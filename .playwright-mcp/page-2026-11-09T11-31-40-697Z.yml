            - generic [ref=f107e24]:
              - heading "Company Description" [level=2] [ref=f107e26]
              - generic [ref=f107e27]:
                - paragraph [ref=f107e28]: We’re a remote-first, distributed software company with team members spread across the globe. We help startups and scaling companies build products and grow their engineering teams.
                - paragraph [ref=f107e29]: Why do people join Clearview? To make an impact. To grow as people and professionals. To enjoy schedule flexibility unlike anything they’ve ever experienced in a workplace. To be surrounded by developers who they can learn from. We are truly excited to be creating waves in an industry under transformation.
                - paragraph [ref=f107e30]: "We bring Clearview teammates on as full-time contractors, but our list of benefits looks nothing like traditional contract freelancing. We offer all our teammates:"
                - list [ref=f107e31]:
                  - listitem [ref=f107e32]:
                    - strong [ref=f107e33]: Unparalleled flexibility of working hours --
                    - text: which means operationalized family-first, soul-first values
                  - listitem [ref=f107e34]:
                    - strong [ref=f107e35]: Paid skill expansion
                    - text: (so you can keep growing as you work with us).
                  - listitem [ref=f107e36]:
                    - strong [ref=f107e37]: Coworking
                    - text: (or home office optimization) budget
                  - listitem [ref=f107e38]:
                    - text: A local
                    - strong [ref=f107e39]: meet-up budget
                    - text: for our co-located teammates to hang out outside of work
                  - listitem [ref=f107e40]:
                    - strong [ref=f107e41]: Annual summits
                    - text: ", for company-wide face time"
                - paragraph [ref=f107e42]: "True innovation comes from an exchange of knowledge across all of our teams. To put people on the path to success, we nurture a culture built on trust, collaboration, and personal growth. You will often work independently, but when you’re working on a team it will be a small, feature-based, cross-functional team. One thing you can be certain of: You will be empowered to take ownership."
            - generic [ref=f107e43]:
              - heading "Job Description" [level=2] [ref=f107e45]
              - generic [ref=f107e46]:
                - paragraph [ref=f107e47]: Are you an exceptionally strong, mid-to-senior Backend Developer with an independent mindset? Do you want to work remotely on challenging projects within a great community? Sounds like you’ll be a great fit for Clearview.
                - paragraph [ref=f107e48]: We are currently seeking a mid-to-senior-career engineer with ironclad coding skills and the proven ability to work effectively, proactively and independently but within the context of a small, self-directed engineering team.
            - generic [ref=f107e49]:
              - heading "Qualifications" [level=2] [ref=f107e51]
              - generic [ref=f107e52]:
                - paragraph [ref=f107e53]: "You’ll need to be:"
                - list [ref=f107e54]:
                  - listitem [ref=f107e55]:
                    - list [ref=f107e56]:
                      - listitem [ref=f107e57]: "Fluent in the English language, both spoken and written (however: we don’t mind which version of the English language it is)"
                      - listitem [ref=f107e58]: Comfortable working effectively, proactively and independently within the context of a small, self-directed team of developers.
                      - listitem [ref=f107e59]: A fully proactive and self-directed time-management expert, very capable and happy working independently while communicating very regularly with your intercontinental teammates.
                - paragraph [ref=f107e60]: "What we expect of you:"
                - list [ref=f107e61]:
                  - listitem [ref=f107e62]:
                    - list [ref=f107e63]:
                      - listitem [ref=f107e64]: Several years of professional experience in software development
                      - listitem [ref=f107e65]: You’ll write lots of Node.js code, incorporating best practices, design patterns and frameworks that will last for years to come.
                      - listitem [ref=f107e66]: Strong experience and understand the ins and outs of JavaScript and Node.js.
                      - listitem [ref=f107e67]: Extensive experience with Git, GitHub and GitLab
                      - listitem [ref=f107e68]: Implement automated unit, integration, and end-to-end tests
                      - listitem [ref=f107e69]: Create pull requests (While you’re at it, review your teammates’ pull requests too, mentoring the more junior members of our development team.)
                      - listitem [ref=f107e70]: "You’ll participate in design sessions with your team members, coming up with the optimum technical solution: one that not only meets business requirements, but does so with performance, scalability and maintainability in mind."
                      - listitem [ref=f107e71]: You’ll innovate. There’s always something we can improve upon, whether it be process or tools or technology choices. If you can dream it, you’ll likely get to build it.
                      - listitem [ref=f107e72]: You have a strong understanding of SQL databases (Postgres, MySQL..), Redis and Elasticsearch
                - paragraph [ref=f107e73]: "It would be awesome if:"
                - list [ref=f107e74]:
                  - listitem [ref=f107e75]:
                    - list [ref=f107e76]:
                      - listitem [ref=f107e77]: You have some experience working remotely (but if you’re a clear communicator with rock-solid reliability and you’re curious about making the leap to remote, we’ll guide you through it)
                      - listitem [ref=f107e78]: You understand the AWS / GCP / Docker / K8s services and ecosystem.
                      - listitem [ref=f107e79]: You understand CI tools and implement CD (Delivery/Deployment)
